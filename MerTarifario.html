<body class="mk">
<div id="sysbar"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"><div class="cargando">Cargando planes y tarifas…</div></main></div>
<script>
(function () {
  /* D = api_tarifario (reglas, catálogo, zonas, historial) · PL = api_planes (planes, promociones, sectores) */
  var D = null, PL = null, PLerr = '', T = null, T0 = null, SUCIO = false, ED = false;
  var A = null, A0 = '', P = null, P0 = '';
  var S = { v: 'tabs', tab: 'planes', K: 0, marca: '', marcaTxt: '', marcaPromo: '', aviso: null, pendiente: false };
  var E = MK.esc, IC = MK.ic, $ = function (id) { return document.getElementById(id); };
  var clon = function (o) { return JSON.parse(JSON.stringify(o)); };
  var n2 = function (n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var d2 = function (n) { return 'B/. ' + n2(n); };
  var FRECS = [['2X SEMANA', 8], ['SEMANAL', 4], ['QUINCENAL', 2], ['MENSUAL', 1], ['BIMESTRAL', 0.5], ['TRIMESTRAL', 0.34]];
  var FR = { 'SEMANAL': 'Semanal', '2X SEMANA': '2 veces por semana', 'QUINCENAL': 'Quincenal', 'MENSUAL': 'Mensual', 'BIMESTRAL': 'Bimestral', 'TRIMESTRAL': 'Trimestral' };
  var ZN = { 'CENTRO CIUDAD': 'Centro ciudad', 'PANAMÁ NORTE': 'Panamá Norte', 'PANAMÁ ESTE': 'Panamá Este', 'PANAMÁ OESTE': 'Panamá Oeste', 'CHORRERA': 'La Chorrera', 'COLON': 'Colón', 'INTERIOR': 'Interior (base)', 'OTRA': 'Otra' };
  var SECTORES_BASE = ['Consultorios', 'Clínicas y policlínicas', 'Hospitales', 'Laboratorios', 'Veterinarias', 'Odontologías', 'Farmacias', 'Otro'];
  var CADA = [['visita', 'cada visita', 0], ['mes', 'al mes', 1], ['bimestre', 'cada 2 meses', 2], ['trimestre', 'cada 3 meses', 3], ['semestre', 'cada 6 meses', 6]];
  var DURAS = [[1, '1 mes'], [3, '3 meses'], [6, '6 meses'], [0, 'Todo el contrato']];
  var BEN = { gratis: ['Servicio o producto gratis', 'caja'], kgAdicional: ['Kilo adicional a otro precio', 'moneda'], visitasExtra: ['Visitas extra sin costo', 'camion'], precio: ['Precio por visita distinto', 'billete'] };
  var PASOS = [['Para quién', 'kilos, zona y referencia'], ['El plan', 'frecuencia y precio'], ['Servicios y productos', 'del catálogo'], ['Revisar y guardar', 'nombre y tipo']];
  var visDe = function (f) { return (FRECS.filter(function (x) { return x[0] === f; })[0] || [0, 1])[1]; };
  var visTxt = function (v) { return v >= 1 ? v + (v === 1 ? ' visita' : ' visitas') + ' al mes' : v === 0.5 ? '1 visita cada 2 meses' : '1 visita cada 3 meses'; };
  var cadaDe = function (k) { return CADA.filter(function (x) { return x[0] === k; })[0] || CADA[1]; };
  /* forma común de un servicio (3.13): {itemId, nombre, modo:'incluido'|'cobrado', cantidad, cada, meses:1|2|3|6, precio (por vez), total (al mes, repartido), delPlan, dePromo} */
  var mesesDe = function (k) { var m = cadaDe(k)[2]; return m || 1; };
  var CADA_M = { 1: 'mes', 2: 'bimestre', 3: 'trimestre', 6: 'semestre' };
  function normServ(s) { var x = clon(s); if (!x.cada) x.cada = CADA_M[Number(x.meses)] || 'mes'; if (x.modo !== 'cobrado') x.modo = 'incluido'; return x; }
  var faltaTxt = function (s) { return (/^(los|las) /.test(s) ? 'faltan ' : 'falta ') + s; };
  var lista = function (l) { return l.length > 1 ? l.slice(0, -1).join(', ') + ' y ' + l[l.length - 1] : l[0] || ''; };
  function fecha(iso, anio) {
    if (!/^\d{4}-\d{2}-\d{2}/.test(iso || '')) return iso || '';
    var p = String(iso).slice(0, 10).split('-');
    return Number(p[2]) + ' ' + MK.MESES[Number(p[1]) - 1] + (anio ? ' ' + p[0] : '');
  }
  var hoy = function () { return MK.hoy || MK.hoyLocal(); };

  /* se llega desde una propuesta: ?volver=MerCuenta.html%3Fid%3D…&de=Nombre del cliente (solo nuestras pantallas Mer*.html) */
  var VOLVER = (function () { var v = MK.param('volver'); return /^Mer[A-Za-z]+\.html(\?[^#<>"'\s\\]*)?$/.test(v) && v.indexOf('//') < 0 ? v : ''; })(), DE = MK.param('de');
  var TABS = ['planes', 'reglas', 'catalogo'];
  var leerHash = function () { var h = (location.hash || '').slice(1); return TABS.indexOf(h) >= 0 ? h : ''; };
  /* #promociones (enlace de la oportunidad) abre Planes en la lista de promociones */
  if (location.hash === '#promociones') S.irPromos = true;
  S.tab = leerHash() || (VOLVER && !S.irPromos ? 'catalogo' : 'planes');
  function ponerHash(t) { try { history.replaceState(null, '', location.pathname + location.search + '#' + t); } catch (e) {} }
  window.addEventListener('hashchange', function () { var h = leerHash(); if (h && D && S.v === 'tabs' && h !== S.tab) irTab(h); });

  MK.iniciar('tarifario', function () { cargar(); });
  function cargar(despues) {
    Promise.all([
      MK.api('api_tarifario', MK.pin),
      MK.api('api_planes', MK.pin).then(null, function (e) { return { ok: false, error: e.message }; })
    ]).then(function (rr) {
      var r = rr[0], p = rr[1];
      if (!r || !r.ok) { MK.error('main', (r && r.error) || 'No se pudo cargar.'); return; }
      D = r; D.tipos = D.tipos || { servicio: 'Servicio', producto: 'Producto', prestamo: 'Préstamo' };
      D.quien = D.quien || {}; D.insumos = D.insumos || []; D.historial = D.historial || []; D.catalogo = D.catalogo || [];
      D.zonas = D.zonas || Object.keys(r.tarifario.zonas || {});
      T = clon(r.tarifario); T0 = clon(r.tarifario); SUCIO = false; ED = !!r.puedeEditar;
      if (p && p.ok) { PL = p; PL.planes = p.planes || []; PL.promos = p.promos || []; PLerr = ''; }
      else { PL = null; PLerr = (p && p.error) || 'No se pudieron cargar los planes.'; }
      if (S.v === 'tabs') ponerHash(S.tab);
      pintar();
      if (despues) despues();
    }, function (e) { MK.error('main', e.message); });
  }
  var EDP = function () { return PL ? (PL.puedeEditar != null ? !!PL.puedeEditar : ED) : false; };
  var sectores = function () { return (PL && PL.sectores && PL.sectores.length) ? PL.sectores : SECTORES_BASE; };
  var cat = function (id) { return D.catalogo.filter(function (c) { return c.id === id; })[0] || null; };
  var kaBase = function () { return Number(T0.kgAdicional) || 0; };
  var granKg = function () { return Number(T0.granDesdeKg) || 100; };
  var planDe = function (id) { return ((PL && PL.planes) || []).filter(function (p) { return p.id === id; })[0] || null; };
  var esGranPlan = function (p) { return typeof p.gran === 'boolean' ? p.gran : Number(p.kgIncluidos) >= granKg(); };
  function historial() { return (PL && PL.historial && PL.historial.length) ? PL.historial : D.historial; }

  function pintar() {
    var mm = $('main'); mm.onclick = mm.oninput = mm.onchange = null;
    if (S.v === 'armar') return pintarArmar();
    if (S.v === 'promo') return pintarPromo();
    var cuerpo = S.tab === 'planes' ? tabPlanes() : S.tab === 'reglas' ? tabReglas() : tabCatalogo();
    mm.innerHTML = '<div class="w44">' + barraVolver() +
      '<div class="ph" style="margin-bottom:10px"><div><h1>Planes y tarifas' + (T0.ejemplo ? ' <span class="ejemplo">NÚMEROS DE EJEMPLO</span>' : '') + '</h1>' +
      '<p class="lead" style="margin:0">Los planes y promociones que salen en las propuestas, las reglas que dan el precio de referencia y el catálogo.</p></div>' +
      '<div class="sp"></div><button class="btn" id="verHis">' + IC('reloj', 15) + ' Historial</button></div>' +
      '<div class="tabs">' +

      '<label class="lb" for="i-des">DESCRIPCIÓN</label><input class="in" id="i-des" value="' + E(it.descripcion || '') + '">' +
      '<div class="grid g2" style="gap:10px"><div><label class="lb" for="i-tip">TIPO</label>' + sel('i-tip', D.tipos, it.tipo) + '</div><div><label class="lb" for="i-qui">QUIÉN LO HACE O LO ENTREGA</label>' + sel('i-qui', D.quien, it.quien) + '</div>' +
      '<div><label class="lb" for="i-pre">PRECIO DE REFERENCIA</label><input class="in" id="i-pre" type="number" min="0" step="0.01" value="' + (it.precio || '') + '"></div><div><label class="lb" for="i-uni">UNIDAD</label><input class="in" id="i-uni" value="' + E(it.unidad || '') + '" placeholder="unidad, por visita…"></div></div>' +
      '<div id="i-invb"><label class="lb" for="i-inv">DEL INVENTARIO</label><select class="sel" id="i-inv"><option value="">— Sin amarrar —</option>' + D.insumos.map(function (x) { return '<option value="' + E(x.insumoId) + '"' + (x.insumoId === it.insumoId ? ' selected' : '') + '>' + E(x.descripcion) + ' · quedan ' + E(x.stock) + '</option>'; }).join('') + '</select>' +
      '<p class="small muted" style="margin-top:6px">Amarrado al inventario, lo que el conductor deja en la visita se descuenta solo.</p></div>' +
      '<label class="chk" style="margin-top:12px"><input type="checkbox" id="i-act"' + (it.activo !== false ? ' checked' : '') + '> Activo (sale en las propuestas nuevas)</label>' +
      (conPlan ? '<div class="aviso az small" style="margin-top:14px">«Volver y amarrarlo» lo guarda, te regresa al plan que estás armando y lo deja amarrado.</div>' : '') +
      (conProp ? '<div class="aviso az small" style="margin-top:14px">«Volver y agregarlo» lo guarda, te regresa a la propuesta' + (DE ? ' de ' + E(DE) : '') + ' y lo deja agregado.</div>' : '') +
      '<div class="row" style="margin-top:16px;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" onclick="MK.cerrarLado()">Cancelar</button>' +
        (conPlan || conProp ? '<button class="btn" id="i-ok">Guardar</button><button class="btn pri" id="i-volver">' + IC('atras', 15) + (conPlan ? ' Volver y amarrarlo' : ' Volver y agregarlo') + '</button>' : '<button class="btn pri" id="i-ok">Guardar</button>') + '</div>');
    var ver = function () { $('i-invb').style.display = $('i-tip').value === 'servicio' ? 'none' : ''; }; $('i-tip').onchange = ver; ver();
    var leer = function () { return { id: it.id || '', nombre: $('i-nom').value.trim(), descripcion: $('i-des').value.trim(), tipo: $('i-tip').value, quien: $('i-qui').value,
      precio: Number($('i-pre').value) || 0, unidad: $('i-uni').value.trim(), insumoId: $('i-tip').value === 'servicio' ? '' : $('i-inv').value, activo: $('i-act').checked }; };
    $('i-ok').onclick = function () {
      var d = leer(); if (!d.nombre) { MK.aviso('Escribe el nombre.'); return; }
      var b = this; MK.ocupado(b, true); guardarItem(d).then(function () { MK.ocupado(b, false); });
    };
    if ($('i-volver')) $('i-volver').onclick = function () {
      var d = leer(), b = this;
      if (!d.nombre) { MK.aviso('Escribe el nombre.'); return; }
      if (!d.activo) { MK.aviso('Para ' + (conPlan ? 'amarrarlo al plan' : 'agregarlo a la propuesta') + ' tiene que estar activo.'); return; }
      MK.ocupado(b, true);
      MK.llamar('api_guardarCatalogoItem', MK.pin, d).then(function (r) {
        D.catalogo = r.catalogo || D.catalogo;
        var id = idNuevo(r, d);
        if (conPlan) {
          MK.cerrarLado();
          if (id) amarrarItem(cat(id) || Object.assign({}, d, { id: id }));
          S.pendiente = false; S.v = 'armar'; S.K = 2; ponerHash('planes'); pintar(); window.scrollTo(0, 0);
          MK.aviso(id ? 'Quedó amarrado «' + d.nombre + '»' : 'Guardado. Amárralo con «Amarrar servicio o producto».');
          return;
        }
        SUCIO = false;
        location.href = VOLVER + (VOLVER.indexOf('?') >= 0 ? '&' : '?') + 'agregar=' + encodeURIComponent(id);
      }, function () { MK.ocupado(b, false); });
    };
  }
  window.addEventListener('beforeunload', function (e) { if (SUCIO || cambiosA() || (P && JSON.stringify(P) !== P0)) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
