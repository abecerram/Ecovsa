/* ═══ QUÉ CICLOS VAN EN ESTE DESPACHO ═══
   Antes se llevaba TODO lo que estuviera en cuarentena, sin preguntar. Con un
   ciclo pendiente daba igual; con cuatro y dos camiones, no: el manifiesto
   del primer viaje reclamaba material que se fue en el segundo. Ahora se
   eligen, vienen todos marcados —que es el caso normal— y desmarcar uno lo
   deja en cuarentena para el siguiente. */
function pintarPendientes(){
  var p = (TRA && TRA.pendientes) || [];
  if(!p.length){
    $("sal-pendientes").innerHTML = '<div class="nota">No hay material en cuarentena esperando despacho.</div>';
    return;
  }
  $("sal-pendientes").innerHTML =
    '<div class="nota" style="background:var(--verde-suave);border-left-color:var(--verde);'+
    'color:var(--verde)"><b>'+p.length+' ciclo(s) en cuarentena</b> · '+
    n1(TRA.kgPorDespachar)+' kg esterilizados esperando el despacho.'+
    '<div style="margin-top:9px">'+p.map(function(c,i){
      return '<label class="chk-ciclo"><input type="checkbox" class="pend" checked '+
        'data-id="'+esc(c.cicloId)+'" data-kg="'+c.kgSalida+'" onchange="sumarElegidos()"> '+
        '<span><b>'+esc(c.cicloId)+'</b> · '+esc(c.fecha)+' · '+
        (c.sinPeso ? 'sin peso anotado' : n1(c.kgSalida)+' kg'+(c.estimado?'*':''))+
        '</span></label>';
    }).join("")+'</div>'+
    '<div id="sal-elegidos" style="font-size:11.5px;margin-top:8px;font-weight:700"></div>'+
    (p.some(function(c){return c.estimado && !c.sinPeso;})
      ? '<div style="font-size:11px;margin-top:7px;opacity:.85">* todavía sin pesar: se usa '+
        'el peso de entrada como referencia. El material se pesa en la báscula de planta al '+
        'salir de cuarentena.</div>'
      : '')+'</div>';
  sumarElegidos();
}

function elegidos(){
  return [].slice.call(document.querySelectorAll('#sal-pendientes .pend'))
    .filter(function(e){ return e.checked; });
}

function sumarElegidos(){
  var e = elegidos();
  var kg = e.reduce(function(s,x){ return s + (Number(x.dataset.kg)||0); }, 0);
  var c = $("sal-elegidos");
  if(c) c.innerHTML = e.length
    ? e.length+' ciclo(s) elegidos · '+n1(kg)+' kg de referencia'
    : '<span style="color:var(--rojo)">Ningún ciclo elegido: el manifiesto saldría sin '+
      'constancia de qué se trató.</span>';
  /* El peso sugerido sigue a lo elegido mientras nadie lo haya escrito a mano;
     en cuanto el operador teclea el de báscula, no se lo tocamos más. */
  var k = $("s-kg");
  if(k && !k.dataset.tocado && kg > 0) k.value = kg.toFixed(2);
}

function guardarSalida(){
  var marcados = elegidos();
  var p = marcados.map(function(e){
    return { cicloId: e.dataset.id, kgSalida: Number(e.dataset.kg) || 0 };
  });
  var kg = num($("s-kg").value);
  if(!(kg>0)){
    toast("Escribe el peso del despacho. Si aún no lo tienes, usa el de la báscula del relleno.");
    $("s-kg").focus(); return;
  }
  var d = { fecha:$("s-fecha").value, horaSalida:$("s-hora").value, kgPlanta:kg,
    vehiculo:$("s-vehiculo").value, conductor:$("s-conductor").value.trim(),
    responsable:$("s-responsable").value.trim(),
    ciclos:p.map(function(c){ return c.cicloId; }),
    kgTratado: p.reduce(function(s,c){ return s+c.kgSalida; },0),
    observaciones:$("s-obs").value.trim() };

  /* Antes esto era un callejón sin salida: sin ciclos pendientes el botón
     contestaba «No hay ciclos tratados sin despachar» y ahí terminaba
     todo. El camión salía igual y la salida se anotaba a mano en el libro
     —así quedaron las 18 cargadas—, sin que el sistema se enterara.

     Ahora sí se puede despachar sin ciclos, pero cuesta: hay que escribir
     por qué. Ese motivo se imprime en el manifiesto y sale en la revisión
     de integridad, que es exactamente lo que faltaba. */
  if(!p.length){ razonSinCiclos(d); return; }
  enviarSalida(d);
}

function razonSinCiclos(d){
  preguntar({
    icono:"⚠️", titulo:"Esta salida no lleva ningún ciclo",
    texto:"No hay ciclos tratados esperando despacho. Si el camión sale igual, "+
          "el manifiesto se imprime diciendo <b>«sin ciclos registrados»</b>: "+
          "sale sin constancia de qué se trató.<br><br>"+
          "Si aun así es lo correcto, escribe por qué. Queda en el papel y en "+
          "la revisión del libro.",
    boton:"Despachar sin ciclos",
    campos:[{ id:"sc-razon", etiqueta:"Por qué sale sin ciclos",
              placeholder:"Ej.: los ciclos del lunes se registran mañana" }],
    alAceptar:function(v){
      var r = v["sc-razon"];
      if(r.length < 10){
        toast("Escribe el motivo completo — con una palabra no se entiende en un año.");
        return false;                       // el diálogo se queda abierto
      }
      d.sinCiclos = true;
      d.observaciones = (d.observaciones ? d.observaciones+" · " : "") + r;
      enviarSalida(d);
    }
  });
}

function enviarSalida(d){
  toast("Generando el manifiesto…");
  google.script.run
    .withSuccessHandler(function(r){
      if(!r || !r.ok){
        /* el servidor también frena la salida sin ciclos, por si la
           pantalla llegara aquí por otro camino */
        if(r && r.sinCiclos){ razonSinCiclos(d); return; }
        toast((r&&r.error)||"No se pudo generar"); return;
      }
      toast(r.ciclos ? "Manifiesto "+r.salidaId+" generado · "+r.ciclos+" ciclo(s)"
                     : "Manifiesto "+r.salidaId+" generado SIN ciclos");
      ["s-kg","s-conductor","s-obs","s-hora"].forEach(function(i){ $(i).value=""; });
      delete $("s-kg").dataset.tocado;
      SAL=null; TRA=null; cargarSalidas();
      setTimeout(function(){ verActaSalida(r.salidaId); }, 600);
    })
    .withFailureHandler(function(){ toast("Sin conexión — no se generó"); })
    .api_guardarSalida(PIN, d);
}

/* El recibo de báscula del relleno llega después del viaje. */
function pedirRecibo(id){
  var s = null;
  (SAL && SAL.salidas || []).forEach(function(z){ if(z.salidaId === id) s = z; });
  preguntar({
    titulo: "Recibo del relleno",
    texto: s
      ? "Despacho <b>"+esc(id)+"</b> del "+esc(s.fecha)+"<br>Salieron "+n1(s.kgPlanta)+
        " kg de planta según nuestra báscula."
      : "Despacho "+esc(id),
    campos: [
      { id:"r-kg", etiqueta:"Kilos que pesó el relleno", tipo:"number", placeholder:"0.00" },
      { id:"r-num", etiqueta:"Número del recibo", placeholder:"Ej. EMAS-88214" }
    ],
    boton: "Registrar el recibo",
    alAceptar: function(v){
      if(!(num(v["r-kg"]) > 0)){ toast("Escribe el peso del recibo"); return false; }
      toast("Registrando…");
      google.script.run
        .withSuccessHandler(function(r){
          if(r && r.ok){ toast("Recibo registrado ✓"); SAL=null; cargarSalidas(); }
          else toast((r&&r.error)||"No se pudo registrar");
        })
        .withFailureHandler(function(){ toast("Sin conexión"); })
        .api_registrarReciboEmas(PIN, id, num(v["r-kg"]), v["r-num"]);
    }
  });
}

/* ═══ Diálogo propio ═══ */
var dlgCb = null, dlgCampos = [];

function preguntar(op){
  $("dlg-tit").textContent = op.titulo || "";
  $("dlg-txt").innerHTML = op.texto || "";
  $("dlg-si").textContent = op.boton || "Guardar";
  $("dlg-ic").textContent = op.icono || "⚖️";
  dlgCampos = op.campos || [];
  $("dlg-campos").innerHTML = dlgCampos.map(function(c){
    return '<label>'+esc(c.etiqueta)+'</label>'+
      '<input id="'+c.id+'"'+(c.tipo==="number"?' inputmode="decimal"':'')+
      ' placeholder="'+esc(c.placeholder||"")+'" autocomplete="off">';
  }).join("");
  dlgCb = op.alAceptar || null;
  $("dlg").classList.add("ver");
  if(dlgCampos.length) setTimeout(function(){
    var c = dlgCampos[0]; if(!c) return;      // pudo cerrarse antes del foco
    var e = $(c.id); if(e) e.focus();
  }, 150);
}

function dlgSi(){
  var v = {};
  dlgCampos.forEach(function(c){ var e=$(c.id); v[c.id] = e ? e.value.trim() : ""; });
  var f = dlgCb;
  if(f && f(v) === false) return;      // dato inválido: el diálogo se queda abierto
  $("dlg").classList.remove("ver"); dlgCb = null; dlgCampos = [];
}

function dlgNo(){ $("dlg").classList.remove("ver"); dlgCb = null; dlgCampos = []; }

function verActaSalida(id){
  abrirDoc("?p=asalida&id="+encodeURIComponent(id));
}

/* ═══ Mantenimiento ═══ */
function cargarMantenimiento(){
  $("mto-lista").innerHTML = '<div class="vacio">Consultando…</div>';
  google.script.run
    .withSuccessHandler(function(r){
      if(!r || !r.ok){ $("mto-lista").innerHTML='<div class="vacio">'+esc((r&&r.error)||"No se pudo")+'</div>'; return; }
      MTO = r; pintarMantenimiento();
    })
    .withFailureHandler(function(){ $("mto-lista").innerHTML='<div class="vacio">Sin conexión.</div>'; })
    .api_mantenimiento(PIN);
}

function pintarMantenimiento(){
  $("mto-alertas").innerHTML = MTO.alertas.length
    ? MTO.alertas.map(function(m){
        var v = m.estado === "VENCIDO";
        return '<div class="nota"'+(v?' style="background:var(--rojo-suave);'+
          'border-left-color:var(--rojo);color:var(--rojo)"':'')+'>'+
          '<b>'+esc(m.equipo)+' · '+esc(m.tipo)+'</b> — '+
          (v ? 'venció hace '+Math.abs(m.diasPara)+' día(s)'
             : 'vence en '+m.diasPara+' día(s)')+' ('+esc(m.proximo)+')</div>';
      }).join("")
    : '<div class="nota" style="background:var(--verde-suave);border-left-color:var(--verde);'+
      'color:var(--verde)">Todos los equipos al día.</div>';

  if(MTO.puedeEditar){
    $("mto-form").style.display = "block";
    if(!$("m-equipo").options.length){
      $("m-equipo").innerHTML = MTO.equipos.map(function(z){ return '<option>'+z+'</option>'; }).join("");
      $("m-tipo").innerHTML = MTO.tipos.map(function(z){ return '<option>'+z+'</option>'; }).join("");
    }
    if(!$("m-fecha").value) $("m-fecha").value = MTO.hoy;
  }

  $("mto-lista").innerHTML = MTO.mantenimientos.length
    ? '<h2>Historial</h2><div class="tabla-caja"><table><thead><tr>'+
      '<th>Equipo</th><th>Tipo</th><th>Fecha</th><th>Próximo</th><th>Estado</th>'+
      '<th>Quién</th><th>Resultado</th></tr></thead><tbody>'+
      MTO.mantenimientos.map(function(m){
        return '<tr><td><b>'+esc(m.equipo)+'</b></td><td>'+esc(m.tipo)+'</td>'+
          '<td>'+esc(m.fecha)+'</td><td>'+esc(m.proximo||"—")+'</td>'+
          '<td'+(m.estado==="VENCIDO"?' style="color:var(--rojo);font-weight:800"':'')+'>'+
            esc(m.estado)+'</td>'+
          '<td>'+esc(m.empresa||m.responsable||"—")+'</td>'+
          '<td>'+esc(m.resultado||"—")+'</td></tr>';
      }).join("")+'</tbody></table></div>'
    : '<div class="vacio">No hay mantenimientos registrados.</div>';
}

function guardarMantenimiento(){
  var d = { equipo:$("m-equipo").value, tipo:$("m-tipo").value, fecha:$("m-fecha").value,
    proximo:$("m-proximo").value, responsable:$("m-responsable").value.trim(),
    empresa:$("m-empresa").value.trim(), resultado:$("m-resultado").value.trim(),
    costo:num($("m-costo").value), observaciones:$("m-obs").value.trim() };
  toast("Registrando…");
  google.script.run
    .withSuccessHandler(function(r){
      if(!r || !r.ok){ toast((r&&r.error)||"No se pudo"); return; }
      toast("Mantenimiento registrado ✓");
      ["m-proximo","m-empresa","m-resultado","m-costo","m-obs"].forEach(function(i){ $(i).value=""; });
      MTO=null; cargarMantenimiento();
    })
    .withFailureHandler(function(){ toast("Sin conexión"); })
    .api_guardarMantenimiento(PIN, d);
}

/* ═══ Consumibles ═══ */
function cargarConsumibles(){
  $("con-lista").innerHTML = '<div class="vacio">Consultando…</div>';
  google.script.run
    .withSuccessHandler(function(r){
      if(!r || !r.ok){ $("con-lista").innerHTML='<div class="vacio">'+esc((r&&r.error)||"No se pudo")+'</div>'; return; }
      CON = r; pintarConsumibles();
    })
    .withFailureHandler(function(){ $("con-lista").innerHTML='<div class="vacio">Sin conexión.</div>'; })
    .api_consumibles(PIN, $("f-desde").value||"", $("f-hasta").value||"");
}

function pintarConsumibles(){
  if(CON.puedeEditar){
    $("con-form").style.display = "block";
    if(!$("k-articulo").options.length)
      $("k-articulo").innerHTML = CON.articulos.map(function(z){ return '<option>'+z+'</option>'; }).join("");
    if(!$("k-fecha").value) $("k-fecha").value = (TRA && TRA.hoy) || "";
  }
  $("con-lista").innerHTML = CON.resumen.length
    ? '<h2>Consumo del periodo</h2><div class="tabla-caja"><table><thead><tr>'+
      '<th>Artículo</th><th>Cantidad</th><th>Unidad</th><th>Veces</th><th>Último</th>'+
      '</tr></thead><tbody>'+
      CON.resumen.map(function(c){
        return '<tr><td><b>'+esc(c.articulo)+'</b></td><td class="n">'+n1(c.cantidad)+'</td>'+
          '<td>'+esc(c.unidad||"—")+'</td><td class="n">'+c.veces+'</td>'+
          '<td>'+esc(c.ultima)+'</td></tr>';
      }).join("")+'</tbody></table></div>'
    : '<div class="vacio">No hay consumos registrados en este periodo.</div>';
}

function guardarConsumo(){
  var d = { fecha:$("k-fecha").value, articulo:$("k-articulo").value,
    cantidad:num($("k-cantidad").value), unidad:$("k-unidad").value.trim() };
  if(!(d.cantidad>0)){ toast("Falta la cantidad"); return; }
  toast("Registrando…");
  google.script.run
    .withSuccessHandler(function(r){
      if(!r || !r.ok){ toast((r&&r.error)||"No se pudo"); return; }
      toast("Consumo registrado ✓");
      $("k-cantidad").value=""; CON=null; cargarConsumibles();
    })
    .withFailureHandler(function(){ toast("Sin conexión"); })
    .api_guardarConsumo(PIN, d);
}


/* Aviso breve al pie. Las pestañas de planta lo usan en cada guardado. */
function toast(m){
  var t = $("toast"); if(!t) return;
  t.textContent = m; t.classList.add("ver");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("ver"); }, 3400);
}


/* La duración total incluye prevacío, esterilización y vacío final.
   Los minutos de esterilización son otro dato: los de la receta del equipo. */
function calcDuracion(){
  var a = $("c-hini").value, b = $("c-hfin").value, d = $("c-dur");
  if(!d) return;
  if(!a || !b){ d.value = ""; return; }
  var p = a.split(":"), q = b.split(":");
  var m = (Number(q[0])*60 + Number(q[1])) - (Number(p[0])*60 + Number(p[1]));
  if(m < 0) m += 1440;              // el ciclo cruzó la medianoche
  var h = Math.floor(m/60), r = m%60;
  d.value = (h ? h+" h " : "") + r + " min";
  d.dataset.min = m;
}


/* Navega la ventana de arriba: dentro del iframe de Apps Script,
   location.href solo cambia el marco interno y la pantalla queda en blanco. */
function irA(url){
  try{
    if(window.top && window.top !== window){ window.top.location.href = url; return; }
  }catch(e){}
  location.href = url;
}
