<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planta · ECOVSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:'oculto',enSupabase:/^api_(?!optimizarRuta$)/};</script>

<style>
/* ═══ Planta · opción A (api 3.4) ═══ */
:root{--pl:#6C3A96;--pl2:#c9b3e0}
.ph h1{display:flex;align-items:center;gap:10px}
.ph h1::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--pl)}
.receta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#f5f0fa;border:1px solid #e3d7f0;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.receta b{color:var(--pl)}
.receta .p{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid #e3d7f0;border-radius:8px;padding:4px 10px;font-weight:700}
.flujo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.et4{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.et4:hover{box-shadow:0 6px 18px rgba(15,33,64,.08)}
.et4 .pa{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.et4 .pa .n{width:20px;height:20px;border-radius:50%;background:var(--pl);color:#fff;display:grid;place-items:center;font-size:11px}
.et4 b{font-size:26px;font-weight:800}.et4 b small{font-size:13px;color:var(--muted);margin-left:4px}
.et4 .s{font-size:12px;color:var(--muted)}
.et4 .al{font-size:11.5px;font-weight:700;color:var(--bad)}.et4 .ok{font-size:11.5px;font-weight:700;color:var(--ok)}
.lista .li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.lista .li:first-child{border-top:0}
.lista .zc{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.lista .tx{flex:1;min-width:0}.lista .tx b{display:block;font-size:13.5px}.lista .tx span{font-size:12.5px;color:var(--muted)}
.ley{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.b3{display:flex;align-items:flex-end;gap:10px;height:170px;padding:16px 4px 22px}
.b3 .m{flex:1;display:flex;align-items:flex-end;gap:3px;height:100%;position:relative}
.b3 .m i{flex:1;border-radius:4px 4px 0 0;min-height:1px}
.b3 .m span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted2)}
.acta{padding:14px}
.acta .top{display:flex;justify-content:space-between;gap:10px}
.acta .meta{font-size:12px;color:var(--muted)}
.acta .kg{font-weight:800;font-size:16px}
.tipos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.tipos span{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;background:#f5f0fa;color:var(--pl)}
.eqs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.eq{padding:14px;display:flex;flex-direction:column;gap:8px}
.eq .h{display:flex;gap:10px;align-items:center}.eq .h b{font-size:15px}
.eq .ic2{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#f5f0fa;color:var(--pl)}
.eq .tar{font-size:12.5px;color:#3d4a60;display:flex;flex-direction:column;gap:3px}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.art{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.art span{color:var(--muted);font-weight:700}
.meses{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.meses div{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;font-weight:700}
.meses div small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px}
.meses .ok{background:var(--ok-bg);border-color:#bfe3b3}.meses .bad{background:var(--bad-bg);border-color:#f3c2c4}.meses .toca{background:var(--warn-bg);border-color:#f3dc9c}.meses .pend{background:var(--info-bg)}.meses .fut{opacity:.45}
.pasosv{display:flex;flex-direction:column;gap:10px;counter-reset:p}
.pasosv div{display:flex;gap:10px;font-size:13px}
.pasosv div::before{counter-increment:p;content:counter(p);width:22px;height:22px;border-radius:50%;background:var(--pl);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.pasosv b{display:block}
.sem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sem .s{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.sem .s .d{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;grid-row:span 2}
.sem .s b{font-size:13.5px}.sem .s span{font-size:12px;color:var(--muted)}
.cadena{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cadena div{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column}
.cadena .t1{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted2)}.cadena b{font-size:20px}.cadena span{font-size:12px;color:var(--muted)}
.pasos4{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pasos4 span{font-size:12px;font-weight:700;border-radius:20px;padding:5px 12px;background:var(--line2);color:var(--muted);cursor:pointer}
.pasos4 span.on{background:var(--pl);color:#fff}.pasos4 span.hecho{background:#f0e8f7;color:var(--pl)}
.grande{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grande label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.grande input{width:100%;font:800 28px Archivo,sans-serif;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}
.ayuda{font-size:12px;color:var(--muted);margin-top:4px}
.chk{display:flex;flex-direction:column;gap:8px}
.chk label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:13px}
.chk label b{display:block}
.chk label.on{border-color:var(--pl);background:#f5f0fa}
.chipx{white-space:nowrap;display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.chipx.bad{background:var(--bad-bg);color:#a8262b}.chipx.warn{background:var(--warn-bg);color:#8a6300}.chipx.gris{background:var(--line2);color:var(--muted)}.chipx.ok{background:var(--ok-bg);color:#276b33}.chipx.info{background:var(--info-bg);color:#2c56a8}.chipx.pl{background:#f5f0fa;color:var(--pl)}
.tb td.r{white-space:nowrap}
.dtab tbody tr{cursor:pointer}
@media (max-width:1100px){.flujo,.eqs{grid-template-columns:repeat(2,minmax(0,1fr))}.sem{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.meses{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:820px){.flujo,.eqs,.sem,.cadena,.grande{grid-template-columns:minmax(0,1fr)}.b3{gap:5px}}
</style>
</head>
<body>
<script src="cargador.js" data-modulo="Planta"></script>
<div id="sysbar"></div>
<div class="mtabs" id="mtabs"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"></main></div>
<script>
/* ════════════════════════════════════════════════════════════════
   PLANTA · opción A (api 3.4). Todo sale de api_plaBase; los guardados
   usan las funciones de siempre (api_guardarCiclo, api_guardarSalida…),
   que mantienen sus revisiones: receta, margen de carga, ciclos que ya
   salieron, número del contador repetido.
   ════════════════════════════════════════════════════════════════ */
var PER = 'anio', MES_REP = '';
function B() { return MK.base || {}; }
function D(v) { return MK.dinero(v); }
function kg(v, d) { return MK.num(v, d == null ? 0 : d) + ' kg'; }
function fdm(iso) { return MK.dmy(iso); }
function rango(p) {
  var h = MK.hoy, y = h.slice(0, 4), m = Number(h.slice(5, 7));
  if (p === 'mes') return [h.slice(0, 8) + '01', h];
  if (p === 'trim') { var mi = Math.floor((m - 1) / 3) * 3 + 1; return [y + '-' + ('0' + mi).slice(-2) + '-01', h]; }
  if (p === 'anio') return [y + '-01-01', h];
  return ['', h];
}
function enRango(f, p) { var r = rango(p || PER); return f && (!r[0] || f >= r[0]) && f <= r[1]; }
function chipsPer() { return MK.chips([['mes', 'Mes'], ['trim', 'Trimestre'], ['anio', 'Año'], ['todo', 'Todo']], PER, 'cambiaPer'); }
function cambiaPer(p) { PER = p; MK.repintar(); }
function nomPer() { return { mes: MK.mesNombre(MK.hoy.slice(0, 7)), trim: 'el trimestre', anio: 'el año ' + MK.hoy.slice(0, 4), todo: 'todo el registro' }[PER]; }
function receta() {
  var r = B().receta, t = B().tratamiento || {};
  return '<div class="receta"><span>Receta del equipo</span><span class="p">' + MK.ic('termometro', 15) + r.temperatura + ' °C</span><span class="p">' + MK.ic('reloj', 15) + r.minutos + ' min</span><span class="p">' + MK.ic('balanza', 15) + 'hasta ' + r.capacidadKg + ' kg ±' + B().margen + '</span><span class="sp"></span><span>Siguiente n.º del contador: <b>' + B().siguienteNumero + '</b></span></div>';
}
function abrirDoc(qs) { window.open('index.html' + qs, '_blank'); }

/* ═══════════ INICIO ═══════════ */
function vInicio() {
  var b = B(), t = b.tratamiento, s = b.salidas, hoy = MK.hoy, mes = hoy.slice(0, 7);
  var bal = b.balance || [], bm = bal.filter(function (x) { return x.mes === mes; })[0] || { recibido: 0, tratado: 0, despachado: 0, actas: 0, ciclos: 0, despachos: 0 };
  var C = (t ? t.ciclos : []).filter(function (c) { return !c.anulado && !c.esPrueba; });
  var ult = C[0];
  var diasSin = ult ? MK.dias(ult.fecha, hoy) : null;
  var carga = t ? t.totales.cargaTipica : 700;
  var cuar = t ? t.kgPorDespachar : 0;
  var anio = hoy.slice(0, 4);
  var desp = (s ? s.salidas : []).filter(function (x) { return x.fecha.slice(0, 4) === anio; });
  var kgDesp = desp.reduce(function (a, x) { return a + x.kgPlanta; }, 0);
  var sinRec = desp.filter(function (x) { return !x.reciboEmas; }).length;
  var porTratarMes = Math.max(0, bm.recibido - bm.tratado);
  var h = MK.cabeza('Planta', MK.mesNombre(mes).replace(/^./, function (x) { return x.toUpperCase(); }) + ' · el material recorre cuatro pasos; cada tarjeta abre su parte');
  h += receta();
  h += '<div class="flujo">' +
    '<div class="et4" onclick="MK.ir(\'rec\')"><span class="pa"><span class="n">1</span>Recibido · zona sucia</span><b class="num">' + MK.num(bm.recibido) + '<small>kg</small></b><span class="s">' + bm.actas + ' acta' + (bm.actas === 1 ? '' : 's') + ' este mes' + (porTratarMes > 0 ? ' · ≈ ' + Math.ceil(porTratarMes / carga) + ' ciclos por correr' : '') + '</span>' + (b.sinActa.recolecciones ? '<span class="al">+ ' + kg(b.sinActa.kg) + ' recogidos sin acta</span>' : '') + '</div>' +
    '<div class="et4" onclick="MK.ir(\'tra\')"><span class="pa"><span class="n">2</span>Tratado · autoclave</span><b class="num">' + bm.ciclos + '<small>ciclos</small></b><span class="s">' + (ult ? 'último: n.º ' + ult.numero + ', el ' + MK.fechaLarga(ult.fecha).replace(/^[a-zé]+, /, '').replace(/ de \d{4}$/, '') : 'sin ciclos registrados') + '</span>' + (diasSin != null && diasSin > 7 ? '<span class="al">' + diasSin + ' días sin ciclo</span>' : '') + '</div>' +
    '<div class="et4" onclick="MK.ir(\'cua\')"><span class="pa"><span class="n">3</span>Cuarentena · zona limpia</span><b class="num">' + MK.num(cuar) + '<small>kg</small></b><span class="s">' + (t ? t.pendientes.length : 0) + ' ciclo(s) esterilizados esperando despacho</span></div>' +
    '<div class="et4" onclick="MK.ir(\'cua\')"><span class="pa"><span class="n">4</span>Despachado · relleno</span><b class="num">' + MK.num(bm.despachado) + '<small>kg</small></b><span class="s">en el año: ' + kg(kgDesp) + ' en ' + desp.length + ' viajes</span>' + (sinRec ? '<span class="al">' + sinRec + ' sin recibo EMAS</span>' : desp.length ? '<span class="ok">Todos con recibo EMAS</span>' : '') + '</div></div>';
  /* lo que toca */
  var toca = [];
  if (porTratarMes > 0 || (diasSin != null && diasSin > 7)) toca.push(['var(--bad)', 'fuego', 'Correr ciclos' + (porTratarMes > 0 ? ': ' + kg(porTratarMes) + ' en zona sucia este mes' : ''), '≈ ' + Math.max(1, Math.ceil(porTratarMes / carga)) + ' ciclos de ' + MK.num(carga) + ' kg (la carga típica medida).' + (diasSin != null ? ' Último ciclo hace ' + diasSin + ' días.' : ''), MK.si('<button class="btn pri sm" onclick="nuevoCiclo()">' + MK.ic('mas', 15) + 'Registrar ciclo</button>')]);
  (b.spEquipos || []).filter(function (x) { return !x.servicio && /autoclave|caldera|calibra|hermetic/i.test(x.concepto); }).forEach(function (x) {
    toca.push(['var(--amber)', 'llaveInglesa', 'Servicio sin anotar: ' + x.solicitudId, x.proveedor + ' · ' + D(x.total) + ' · ' + x.concepto + '. Mantenimiento no lo tiene.', MK.si('<button class="btn sm" onclick="servicio(\'\',\'' + x.solicitudId + '\')">' + MK.ic('flecha', 15) + 'Anotar</button>')]);
  });
  var bioMes = (b.bio || []).filter(function (x) { return x.mes === mes; })[0];
  if (mes >= b.bioDesde && (!bioMes || bioMes.resultado === 'PENDIENTE')) toca.push(['var(--amber)', 'matraz', 'Verificación biológica de ' + MK.mesNombre(mes), bioMes ? 'Vial en incubación: anotar el resultado.' : 'En el último ciclo antes del despacho, con vial Attest incubado.', '<button class="btn sm" onclick="MK.ir(\'bio\')">' + MK.ic('flecha', 15) + 'Ver</button>']);
  if (t && t.sinQuimico) toca.push(['var(--amber)', 'alerta', t.sinQuimico + ' ciclo(s) de este mes sin cinta anotada', 'El indicador químico va en cada ciclo.', '<button class="btn sm" onclick="MK.ir(\'tra\')">' + MK.ic('flecha', 15) + 'Ver</button>']);
  if (t && t.totales.porTratar < -100) toca.push(['var(--info)', 'balanza', 'El balance no cuadra', MK.num(-t.totales.porTratar) + ' kg más tratados que recibidos: faltan actas o ciclos por cargar.', '<button class="btn sm" onclick="MK.ir(\'rep\')">' + MK.ic('flecha', 15) + 'Revisar</button>']);
  if ((b.mantenimiento && b.mantenimiento.alertas || []).length) b.mantenimiento.alertas.forEach(function (a) { toca.push(['var(--bad)', 'llaveInglesa', a.equipo + ': ' + a.tipo + ' ' + a.estado.toLowerCase(), 'Próximo: ' + fdm(a.proximo), '<button class="btn sm" onclick="MK.ir(\'mto\')">Ver</button>']); });
  h += '<div class="g2m"><section class="card"><h3>Lo que te toca</h3><div class="lista">' + (toca.length ? toca.map(function (x) { return '<div class="li" style="--c:' + x[0] + '"><span class="zc">' + MK.ic(x[1], 17) + '</span><div class="tx"><b>' + MK.esc(x[2]) + '</b><span>' + MK.esc(x[3]) + '</span></div>' + x[4] + '</div>'; }).join('') : MK.vacio('Todo al día.')) + '</div></section>';
  var ult6 = bal.slice(-6);
  var max = Math.max.apply(null, ult6.map(function (x) { return Math.max(x.recibido, x.tratado, x.despachado); }).concat([1]));
  h += '<section class="card"><h3>Mes a mes</h3><div class="small muted">kg recibidos, tratados y despachados</div><div class="b3">' + ult6.map(function (x) {
    return '<div class="m" title="' + MK.mesNombre(x.mes) + ': recibido ' + MK.num(x.recibido) + ' · tratado ' + MK.num(x.tratado) + ' · despachado ' + MK.num(x.despachado) + '"><i style="height:' + (x.recibido / max * 100) + '%;background:var(--pl2)"></i><i style="height:' + (x.tratado / max * 100) + '%;background:var(--pl)"></i><i style="height:' + (x.despachado / max * 100) + '%;background:var(--ok)"></i><span>' + MK.mesCorto(x.mes) + '</span></div>';
  }).join('') + '</div><div class="ley"><span><i style="background:var(--pl2)"></i>Recibido</span><span><i style="background:var(--pl)"></i>Tratado</span><span><i style="background:var(--ok)"></i>Despachado</span></div>' +
    MK.tabla(['Mes', '>Recibido', '>Tratado', '>Despachado'], ult6.slice().reverse().map(function (x) { return [MK.mesNombre(x.mes), MK.num(x.recibido), MK.num(x.tratado) + (x.ciclos ? '<small>' + x.ciclos + ' ciclos</small>' : ''), MK.num(x.despachado)]; })) + '</section></div>';
  return h;
}

/* ═══════════ RECEPCIÓN ═══════════ */
function vRecepcion() {
  var b = B(), A = ((b.actas || {}).actas || []).filter(function (a) { return enRango(a.fecha); });
  var t = { kg: 0, bio: 0, punzo: 0, anat: 0, cb: 0, cp: 0, ca: 0, entregas: 0 };
  var gen = {};
  A.forEach(function (a) { t.kg += a.kgTotal; t.bio += a.kgBio; t.punzo += a.kgPunzo; t.anat += a.kgAnatomo; t.cb += a.cantBio; t.cp += a.cantPunzo; t.ca += a.cantAnatomo;
    (a.detalle || []).forEach(function (d) { var g = d.cliente || '—'; gen[g] = (gen[g] || 0) + (Number(d.kg) || 0); t.entregas += Number(d.visitas) || 0; }); });
  var G = Object.keys(gen).map(function (k) { return { e: k, v: gen[k] }; }).sort(function (x, y) { return y.v - x.v; });
  var h = MK.cabeza('Recepción · actas', 'Lo que entra a la zona sucia en ' + nomPer() + '. Cada acta la genera Logística al entregar.', chipsPer() + '<button class="btn" onclick="reporteRecepcion()">' + MK.ic('imprimir', 16) + 'Reporte imprimible</button>');
  h += MK.kpis([{ e: 'Recibido', v: kg(t.kg, 2), s: A.length + ' actas · ' + t.entregas + ' entregas de generadores' }, { e: 'Bioinfeccioso', v: kg(t.bio, 2), s: MK.num(t.cb) + ' bultos' }, { e: 'Punzocortante', v: kg(t.punzo, 2), s: MK.num(t.cp) + ' bultos' }, { e: 'Anatomopatológico', v: kg(t.anat, 2), s: MK.num(t.ca) + ' bultos' }]);
  if (b.sinActa.recolecciones) h += '<div class="aviso am" style="margin-bottom:14px"><b>Por llegar desde Logística: ' + kg(b.sinActa.kg) + ' en ' + b.sinActa.recolecciones + ' recolecciones sin acta</b> — la más vieja lleva ' + b.sinActa.dias + ' días. Es material recogido que todavía no aparece entregado a planta.</div>';
  h += '<div class="g2m"><div class="pila">' + (A.length ? A.map(function (a) {
    return '<div class="card acta"><div class="top"><div><b>' + MK.esc(a.actaId) + '</b> <span class="meta">' + fdm(a.fecha) + ' · ' + MK.esc(a.hora) + '</span></div><span class="kg num">' + kg(a.kgTotal, 2) + '</span></div>' +
      '<div class="meta">Entregó ' + MK.esc(a.operador) + ' · ' + MK.esc(a.vehiculo) + ' · recibió ' + MK.esc(a.recibe || '—') + (a.desde ? ' · recolectado del ' + fdm(a.desde) + ' al ' + fdm(a.hasta) : '') + ' · ' + (a.detalle || []).length + ' generadores</div>' +
      '<div class="tipos"><span>Bio ' + kg(a.kgBio, 2) + ' · ' + a.cantBio + ' b.</span>' + (a.kgPunzo ? '<span>Punzo ' + kg(a.kgPunzo, 2) + ' · ' + a.cantPunzo + ' b.</span>' : '') + (a.kgAnatomo ? '<span>Anatomo ' + kg(a.kgAnatomo, 2) + '</span>' : '') + '<span>' + a.bultos + ' bultos</span></div>' +
      '<div class="fila" style="justify-content:space-between;margin-top:8px"><span class="chipx ok">Recibida en planta</span><a href="#" onclick="abrirDoc(\'?p=acta&id=' + encodeURIComponent(a.actaId) + '\');return false">Ver el acta</a></div></div>';
  }).join('') : '<div class="card">' + MK.vacio('Ninguna acta en ' + nomPer() + '.') + '</div>') + '</div>' +
    '<div class="card"><h3>Quién genera más</h3><div class="small muted" style="margin-bottom:6px">' + G.length + ' generadores en ' + nomPer() + '</div>' + MK.hbar(G.slice(0, 6).concat(G.length > 6 ? [{ e: 'Los otros ' + (G.length - 6), v: G.slice(6).reduce(function (s, x) { return s + x.v; }, 0), c: 'var(--pl2)' }] : []), { color: 'var(--pl)', fmt: function (v) { return kg(v, 1); } }) + '</div></div>';
  return h;
}
function reporteRecepcion() { var r = rango(); if (!r[0]) r[0] = '2020-01-01'; abrirDoc('?p=rplanta&desde=' + r[0] + '&hasta=' + r[1]); }

/* ═══════════ TRATAMIENTO ═══════════ */
function vTratamiento() {
  var t = B().tratamiento;
  if (!t) return MK.cabeza('Tratamiento · ciclos') + '<div class="aviso rj">No se pudieron leer los ciclos.</div>';
  var C = t.ciclos.filter(function (c) { return enRango(c.fecha); });
  var cu = C.filter(function (c) { return !c.anulado && !c.esPrueba; });
  var kgE = 0, kgS = 0, conP = 0, bol = 0;
  cu.forEach(function (c) { if (c.sinPeso) return; kgE += c.kgEntrada; if (!c.salidaEstimada) { kgS += c.kgSalida; conP++; } bol += c.bolsas; });
  var mermaE = 0; cu.forEach(function (c) { if (!c.sinPeso && !c.salidaEstimada) mermaE += c.kgEntrada; });
  var h = MK.cabeza('Tratamiento · ciclos', 'Cada ciclo lleva el número del contador del autoclave, que no se reinicia. ' + nomPer().replace(/^./, function (x) { return x.toUpperCase(); }) + '.',
    chipsPer() + '<button class="btn" onclick="descargarCiclos()">' + MK.ic('bajar', 16) + 'Descargar</button>' + MK.si('<button class="btn pri" onclick="nuevoCiclo()">' + MK.ic('mas', 16) + 'Registrar ciclo</button>'));
  h += receta();
  h += MK.kpis([{ e: 'Ciclos', v: cu.length, s: C.filter(function (c) { return c.esPrueba; }).length + ' de prueba · ' + C.filter(function (c) { return c.anulado; }).length + ' anulados' },
    { e: 'Kg tratados', v: kg(kgE), s: cu.length ? 'carga típica ' + MK.num(kgE / Math.max(1, cu.filter(function (c) { return !c.sinPeso; }).length)) + ' kg' : '' },
    { e: 'Merma', v: mermaE ? MK.num((mermaE - kgS) / mermaE * 100, 1) + ' %' : '—', s: conP ? MK.num(kgS) + ' kg salieron de ' + conP + ' ciclos pesados' : 'sin pesos de salida' },
    { e: 'Cinta 3M', v: cu.filter(function (c) { return c.quimico; }).length + ' de ' + cu.length, s: 'ciclos con indicador químico anotado', c: cu.some(function (c) { return !c.quimico; }) ? 'warn' : '' }]);
  var L = C.slice(0, 200);
  h += '<div class="card dtab"><h3>Ciclos <span class="sp"></span><span class="l muted">toca uno para ver su ficha, corregirlo o anularlo</span></h3>' +
    MK.tabla(['N.º', 'Fecha', 'Hora', 'Bolsas', '>Kg entrada', '>Kg salida', 'Merma', 'Receta', 'Químico', 'Biológico', 'Despacho'], L.map(function (c) {
      var merma = !c.sinPeso && !c.salidaEstimada && c.kgEntrada ? MK.num((c.kgEntrada - c.kgSalida) / c.kgEntrada * 100, 1) + ' %' : '—';
      var rec = c.temperatura === B().receta.temperatura && c.minutos === B().receta.minutos;
      return ['<b>' + c.numero + '</b>' + (c.anulado ? ' <span class="chipx gris">anulado</span>' : c.esPrueba ? ' <span class="chipx info">prueba</span>' : ''), fdm(c.fecha), (c.horaInicio || '—') + (c.horaFinal ? '–' + c.horaFinal : ''), c.bolsas || '—',
        c.sinPeso ? '<span class="chipx warn">sin peso</span>' : MK.num(c.kgEntrada, 1), c.salidaEstimada ? '<span class="muted">' + MK.num(c.kgSalida, 1) + '*</span>' : MK.num(c.kgSalida, 1), merma,
        '<span class="chipx ' + (rec ? 'ok' : 'warn') + '">' + c.temperatura + '° · ' + c.minutos + '</span>',
        c.quimico ? '<span class="chipx ' + (/^NO/i.test(c.resultadoQuimico) ? 'bad' : 'ok') + '">' + MK.esc(c.resultadoQuimico || 'sí') + '</span>' : '<span class="chipx gris">sin anotar</span>',
        c.biologico ? '<span class="chipx pl">' + MK.esc(c.resultadoBiologico || 'vial') + '</span>' : '—', c.salida ? MK.esc(c.salida) : '<span class="chipx info">en cuarentena</span>'];
    }), { clic: function (j) { return 'fichaCiclo(\'' + L[j].cicloId + '\')'; }, vacio: 'Ningún ciclo en ' + nomPer() + '.' }) +
    '<div class="nota">«Sin anotar»: los ciclos cargados del control de producción no dicen si llevaron cinta; queda vacío a propósito. Los nuevos lo piden en el paso 3. * = peso de salida estimado (no se pesó).</div></div>';
  return h;
}
function descargarCiclos() {
  var C = (B().tratamiento || {}).ciclos || [];
  var q = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var f = [['cicloId', 'numero', 'fecha', 'horaInicio', 'horaFinal', 'bolsas', 'kgEntrada', 'kgSalida', 'temperatura', 'minutos', 'cinta', 'resultadoCinta', 'vial', 'resultadoVial', 'despacho', 'prueba', 'anulado']].concat(C.map(function (c) {
    return [c.cicloId, c.numero, c.fecha, c.horaInicio, c.horaFinal, c.bolsas, c.sinPeso ? '' : c.kgEntrada, c.salidaEstimada ? '' : c.kgSalida, c.temperatura, c.minutos, c.quimico ? 'SI' : '', c.resultadoQuimico, c.biologico ? 'SI' : '', c.resultadoBiologico, c.salida, c.esPrueba ? 'SI' : '', c.anulado ? 'SI' : ''];
  }));
  var blob = new Blob(['﻿' + f.map(function (r) { return r.map(q).join(','); }).join('\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ciclos_autoclave_' + MK.hoy + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function ciclo(id) { return ((B().tratamiento || {}).ciclos || []).filter(function (c) { return c.cicloId === id; })[0]; }
function fichaCiclo(id) {
  var c = ciclo(id); if (!c) return;
  MK.lado('<span class="et" style="font-size:11px;font-weight:700;color:var(--muted2)">CICLO</span><h2>N.º ' + c.numero + ' · ' + fdm(c.fecha) + '</h2><div class="sub">' + MK.esc(c.cicloId) + (c.operador ? ' · ' + MK.esc(c.operador) : '') + '</div>' +
    (c.anulado ? '<div class="aviso rj">Anulado el ' + fdm(c.fechaAnulacion) + ' por ' + MK.esc(c.anuladoPor) + ': ' + MK.esc(c.motivoAnulacion) + '</div>' : '') +
    MK.kpis([{ e: 'Entró', v: c.sinPeso ? '—' : kg(c.kgEntrada, 1) }, { e: 'Salió', v: kg(c.kgSalida, 1), s: c.salidaEstimada ? 'estimado' : '' }, { e: 'Receta', v: c.temperatura + '° · ' + c.minutos + '′' }], 3) +
    '<div class="lst"><div class="it"><div class="tx"><b>Hora</b><small>' + (c.horaInicio || '—') + ' a ' + (c.horaFinal || '—') + '</small></div></div>' +
    '<div class="it"><div class="tx"><b>Indicador químico (cinta 3M)</b><small>' + (c.quimico ? MK.esc(c.resultadoQuimico || 'Sí') : 'Sin anotar') + '</small></div></div>' +
    '<div class="it"><div class="tx"><b>Verificación biológica (vial)</b><small>' + (c.biologico ? MK.esc(c.resultadoBiologico || 'Sí') : 'No') + '</small></div></div>' +
    '<div class="it"><div class="tx"><b>Despacho</b><small>' + (c.salida ? MK.esc(c.salida) : 'En cuarentena') + '</small></div>' + (c.salida ? '<a href="#" onclick="abrirDoc(\'?p=asalida&id=' + encodeURIComponent(c.salida) + '\');return false">Manifiesto</a>' : '') + '</div>' +
    (c.obs ? '<div class="it"><div class="tx"><b>Observaciones</b><small>' + MK.esc(c.obs) + '</small></div></div>' : '') + '</div>' +
    (c.anulado || MK.soloVer ? '' : '<h3 style="margin-top:16px">Corregir</h3><div class="f3"><div><label class="lb">Kg entrada</label><input class="in" id="ec-kge" value="' + (c.sinPeso ? '' : c.kgEntrada) + '"></div><div><label class="lb">Kg salida</label><input class="in" id="ec-kgs" value="' + (c.salidaEstimada ? '' : c.kgSalida) + '"></div><div><label class="lb">Bolsas</label><input class="in" id="ec-bol" value="' + (c.bolsas || '') + '"></div></div>' +
      '<div class="f2"><div><label class="lb">Hora de inicio</label><input class="in" type="time" id="ec-hi" value="' + (c.horaInicio || '') + '"></div><div><label class="lb">Hora de fin</label><input class="in" type="time" id="ec-hf" value="' + (c.horaFinal || '') + '"></div></div>' +
      '<label class="fila small" style="margin-top:10px"><input type="checkbox" id="ec-cin" ' + (c.quimico ? 'checked' : '') + '> Llevó cinta 3M</label><select class="in" id="ec-rcin" style="margin-top:6px"><option' + (/^conforme/i.test(c.resultadoQuimico) ? ' selected' : '') + '>Conforme</option><option' + (/^NO/i.test(c.resultadoQuimico) ? ' selected' : '') + '>NO conforme</option></select>' +
      '<div class="pie2">' + (c.salida ? '' : '<button class="btn bad" onclick="anularCiclo(\'' + c.cicloId + '\')">Anular</button>') + '<button class="btn" onclick="MK.cerrarLado()">Cerrar</button><button class="btn pri" onclick="corregirCiclo(\'' + c.cicloId + '\',this)">' + MK.ic('check', 16) + 'Guardar corrección</button></div>'));
}
function corregirCiclo(id, btn) {
  var d = { horaInicio: MK.val('ec-hi'), horaFinal: MK.val('ec-hf'), pruebaBiologica: document.getElementById('ec-cin').checked, resultadoPrueba: document.getElementById('ec-cin').checked ? MK.val('ec-rcin') : '' };
  if (MK.val('ec-kge')) d.kgEntrada = Number(MK.val('ec-kge')); if (MK.val('ec-kgs')) d.kgSalida = Number(MK.val('ec-kgs')); if (MK.val('ec-bol')) d.bolsas = Number(MK.val('ec-bol'));
  MK.ocupado(btn, true);
  MK.llamar('api_editarCiclo', id, d).then(function () { MK.cerrarLado(); MK.aviso('Ciclo corregido'); MK.recargar(); }, function () { MK.ocupado(btn, false); });
}
function anularCiclo(id) {
  MK.hoja('<h2>Anular el ciclo</h2><p class="muted">No se borra: queda con el motivo, quién y cuándo. El número del contador no desaparece.</p><label class="lb">Motivo</label><input class="in" id="an-mot" autofocus>' +
    '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn bad" id="an-si">Anular</button></div>');
  document.getElementById('an-si').onclick = function () { MK.llamar('api_anularCiclo', id, MK.val('an-mot')).then(function () { MK.cerrarHoja(); MK.cerrarLado(); MK.aviso('Ciclo anulado'); MK.recargar(); }); };
}
</script>
