<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de oportunidad · ECOVSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">

<style>
/* ═══ Ficha de oportunidad · opción B «Pestañas con tarjeta fija» ═══ */
.main{padding-bottom:110px}
.sysbar .srch{min-width:0}   /* sin esto la búsqueda empuja la barra fuera de la pantalla en celular */
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.crumb a{color:var(--muted);font-weight:600}.crumb a:hover{color:var(--navy2)}
/* tarjeta */
.tarj{padding:18px}
.hd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.hd .logo{width:48px;height:48px;border-radius:12px;background:#eaf0fa;color:var(--navy2);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.hd .tt{min-width:0;flex:1 1 300px}
.hd h1{font-size:21px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.hd .sub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.hd .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mets{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.mets>div{padding:8px 14px;border-left:1px solid var(--line);min-width:96px;flex:1 0 auto}
.mets>div:first-child{border-left:0}
.mets small{display:block;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.mets b{font-size:16px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.mets b.down{color:var(--bad)}
.info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.ibox{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 12px;min-width:0}
.ibox .tx{flex:1;min-width:0}
.ibox .k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.7px;color:var(--muted2)}
.ibox .tx b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibox .tx small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibox .tx small.down{color:var(--bad);font-weight:700}
.ibox .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eef2f8;color:var(--navy2);flex:none}
.ibox .ca{display:flex;gap:2px;flex:none}
.ibox .ca .btn{padding:6px 7px;color:var(--navy2)}
/* barra de etapas */
.stgw{margin-top:14px}
.stg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.stg .st{flex:1 1 0;min-width:108px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font:600 12px Archivo,sans-serif;color:var(--muted);cursor:pointer;text-align:left;line-height:1.15}
.stg .st .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:11px;flex:none}
.stg .st .n svg{width:12px;height:12px}
.stg .st.hecho{color:var(--navy2);background:#f5f8fd}
.stg .st.hecho .n{background:var(--navy2);border-color:var(--navy2);color:#fff}
.stg .st.actual{background:var(--navy2);border-color:var(--navy2);color:#fff}
.stg .st.actual .n{background:#fff;color:var(--navy2);border-color:#fff}
.stg .st:hover:not(:disabled){border-color:#9db4d8}
.stg .st:disabled{cursor:default}
.stg.off .st{opacity:.5}
.b-bar{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.b-bar .auto{flex:1 1 280px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;min-width:0}
.b-bar .auto svg{margin-top:1px;color:var(--muted2)}
.b-bar .acc{display:flex;gap:6px;flex-wrap:wrap}
.b-bar .sigue{padding:10px 16px}
/* avisos grandes */
.ban{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--info);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap}
#bans .ban:first-child{margin-top:14px}
#bans .ban:last-child{margin-bottom:0}
.ban.bad{border-left-color:var(--bad);border-color:#f1c3c4;background:#fffafa}
.ban.ok{border-left-color:var(--ok)}
.ban.gris{border-left-color:var(--gris)}
.ban>svg{margin-top:2px;color:var(--muted)}
.ban .bx{flex:1 1 300px;min-width:0}
.ban .bx b{font-size:14px}
.ban .bx p{font-size:13px;margin-top:3px;color:var(--muted)}
/* pestañas */
.tabs{margin:16px 0;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tabs button{scroll-snap-align:start;display:flex;gap:6px;align-items:center;font-size:13.5px}
.tabs button.on .n{background:#e3ebf8;color:var(--navy2)}
.b2{display:grid;gap:14px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
.b2e{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
/* campos */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 12px}
.fld{min-width:0}
.fld.w2{grid-column:1/-1}
.fld .in,.fld .sel{min-width:0}
.fld.mod .in,.fld.mod .sel{border-color:var(--amber);background:#fffdf6}
.fld.glow .in,.fld.glow .sel{box-shadow:0 0 0 3px var(--amber-line);border-color:var(--amber)}
.in:disabled,.sel:disabled{background:#f7f8fa;color:#3d4a5e;opacity:1;cursor:default}
.req{font-size:10.5px;color:#8a5a00;background:var(--warn-bg);border-radius:5px;padding:0 5px;font-weight:700;letter-spacing:0;margin-left:4px}
.fuera{font-size:10.5px;color:#8a5a00;font-weight:600;margin-left:4px}
.hint2{font-size:11.5px;color:var(--muted);margin-top:3px}
.pista{font-size:12px;color:var(--muted);background:var(--line2);border-radius:8px;padding:8px 10px;margin-top:12px;display:flex;gap:6px;align-items:flex-start}
.pista svg{flex:none;margin-top:1px;color:var(--muted2)}
.dl2{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.dl2 dt{color:var(--muted);font-size:12px;font-weight:600}
.dl2 dd{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.calc>div{background:#fafbfd;border:1px solid var(--line2);border-radius:10px;padding:9px 12px}
.calc span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.calc b{font-size:16px;font-variant-numeric:tabular-nums}
.calc em{display:block;font-style:normal;font-size:11px;color:var(--muted2);margin-top:2px}
.tipo-sv{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.tipo-sv .small{flex:1 1 200px}
/* notas */
.nl{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.nl .nn{padding-top:7px}
.nl .btn{margin-top:3px}
.nl .nn{width:20px;font-size:12px;color:var(--muted);font-weight:700;text-align:right;flex:none}
.nl .in{flex:1;min-width:0;padding:6px 9px;font-size:13px;min-height:0;resize:none;overflow:hidden;line-height:1.4}
.nl .btn{padding:4px 7px;flex:none}
.nl.ed .in{border-color:var(--amber-line);background:#fffdf6}
/* contactos */
.ct{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}
.ct:last-of-type{border-bottom:0}
.ct .tx{flex:1;min-width:0}.ct .tx b{font-weight:600}
.ct .tx small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .ca{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0;max-width:140px}.ct .ca .btn{padding:5px 6px;color:var(--navy2)}
/* tareas */
.tk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2)}
.tk:last-child{border-bottom:0}
.tk .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid #b9c4d4;background:#fff;display:grid;place-items:center;flex:none;cursor:pointer;color:transparent;padding:0;margin-top:1px}
.tk .ck:hover{border-color:var(--ok);color:var(--ok)}
.tk .ck svg{width:13px;height:13px}
.tk .ck:disabled{cursor:default;opacity:.5}
.tk .tx{flex:1;min-width:0}.tk .tx b{font-weight:600;font-size:13px;display:block}
.tk .tx small{display:block;font-size:12px;color:var(--muted)}
.tk .tx small.down{color:var(--bad);font-weight:700}
.tk>svg{color:var(--muted2);margin-top:2px}
.tk.hecha .tx b{text-decoration:line-through;color:var(--muted);font-weight:500}
.tk.hecha .ck{background:var(--ok);border-color:var(--ok);color:#fff;cursor:default}
.lnk{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0;text-align:left}
.lnk:hover{color:var(--info)}
/* línea de tiempo */
.tlf{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.tlf .chip{padding:3px 9px;font-size:11.5px}
.tl .ev .h{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl .ev .h b{color:var(--ink);font-weight:700;font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.tl .ev .h b svg{width:14px;height:14px;color:var(--navy2)}
.tl .ev.sis .h b,.tl .ev.sis .h b svg{color:var(--muted)}
.tl .ev.sis p{color:var(--muted)}
.tl .ev .tag{font-size:10.5px;padding:1px 6px}
/* registrar rápido */
.rt{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rt button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11.5px Archivo,sans-serif;color:var(--navy2);cursor:pointer}
.rt button:hover{border-color:#9db4d8;background:var(--hover)}
/* documentos */
.dprog{display:flex;gap:4px;margin:6px 0}.dprog i{flex:1;height:8px;border-radius:3px;background:var(--line)}.dprog i.si{background:var(--ok)}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:8px;min-width:0}
.dcard.falta{border-style:dashed;background:#fcfdfe}
.dcard.rev{border:1.5px solid #f0c24b;border-style:solid;background:#fffcf2}
.cli-rev{background:#fff7df;border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.cli-rev b{display:flex;gap:5px;align-items:center;color:#7a5600}.cli-rev span{color:var(--muted);overflow-wrap:anywhere}
.cli-link{margin-bottom:14px;border-left:4px solid var(--navy2)}
.dcard .fn{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center;overflow-wrap:anywhere;min-width:0}
.dcard .fn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .row .chk{font-size:12.5px;font-weight:600}
.zona{border:1px dashed #c9d3e2;border-radius:9px;padding:10px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;font-family:inherit;width:100%}
.zona:hover{border-color:var(--navy2);color:var(--navy2)}
.zona input{max-width:100%}
.vt{width:100%;border-collapse:collapse}
.vt td{padding:9px 6px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:top}
.vt tr:last-child td{border-bottom:0}
.vt .vn{font-weight:800;color:var(--navy2);width:34px;white-space:nowrap}
.vt small{display:block;color:var(--muted);font-size:11.5px}
.vt .acc{white-space:nowrap;text-align:right}
.vt details{margin-top:4px}.vt details summary{cursor:pointer;color:var(--muted);font-size:11.5px}
.vt details li{font-size:11.5px;color:var(--muted);margin-left:16px}
/* inspección */
.cmp{width:100%;border-collapse:collapse;margin:10px 0}
.cmp th{font-size:11px;color:#7a879b;text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.cmp td{padding:7px 8px;border-bottom:1px solid var(--line2);font-size:13px}
.meter{margin:10px 0}.meter .row{font-size:13px;margin-bottom:4px}
.meter .bar-h i.ok{background:var(--ok)}
.faltas{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.faltas button{border:1px dashed #e0c98c;background:var(--warn-bg);color:#6b4700;border-radius:7px;padding:3px 8px;font:600 11.5px Archivo,sans-serif;cursor:pointer}
.faltas button:hover{border-style:solid}
.faltas button svg{width:12px;height:12px;vertical-align:-2px;margin-right:2px}
.flow{display:flex;align-items:center;gap:8px;margin:12px 0;flex-wrap:wrap}
.flow .fb{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;background:#fff;flex:1 1 0;min-width:0;color:var(--muted)}
.flow .fb b{display:block;font-size:12.5px;color:var(--navy2)}
.flow .fb.on{border-color:var(--navy2)}
.flow svg{color:var(--muted2)}
.opcs{display:grid;gap:8px;margin-top:12px}
.opcs button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer;font:500 13px Archivo,sans-serif;color:var(--ink)}
.opcs button:hover{border-color:var(--navy2);background:var(--hover)}
.opcs button b{display:block;font-size:14px}
.opcs button small{color:var(--muted)}
.opcs button>svg{color:var(--navy2)}
.borrar{display:block;margin:6px auto 0;border:0;background:none;color:var(--bad);font:600 12.5px Archivo,sans-serif;cursor:pointer;padding:8px}
.borrar:hover{text-decoration:underline}
.msgbox{white-space:pre-wrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5}
/* barra fija compacta y barra de guardar */
.fija{position:fixed;top:58px;left:232px;right:0;z-index:25;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(15,33,64,.07);padding:8px 26px;display:flex;gap:10px;align-items:center;transform:translateY(-120%);transition:transform .2s;visibility:hidden}
.fija.si{transform:none;visibility:visible}
.fija .nm{min-width:0;flex:1;display:flex;gap:8px;align-items:center}
.fija .nm b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fija .nm small{color:var(--muted);font-size:12px;white-space:nowrap}
.savebar{position:fixed;left:232px;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(15,33,64,.08);display:flex;align-items:center;gap:10px;padding:10px 26px;transform:translateY(120%);transition:transform .2s}
.savebar:not(.si){visibility:hidden}
.savebar.si{transform:none}
.savebar .tx{flex:1;min-width:0;font-size:13px;display:flex;gap:8px;align-items:center}
.savebar .tx .dot{background:var(--amber)}

@media(max-width:1180px){.b2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:900px){
  .b2,.b2e{grid-template-columns:1fr}
  .fija{left:0;padding:8px 14px}
  .savebar{left:0;padding:10px 14px}
  .mets{width:100%}
  .tarj{padding:14px}
}
@media(max-width:560px){
  .hd .logo{display:none}
  .hd{gap:10px}
  .hd h1{font-size:18px}
  .hd .sub{font-size:12px}
  .mets>div{min-width:45%;border-left:0;border-top:1px solid var(--line);padding:6px 11px}
  .mets>div:nth-child(-n+2){border-top:0}
  .mets>div:nth-child(even){border-left:1px solid var(--line)}
  .mets b{font-size:14.5px}
  .info{grid-template-columns:1fr;gap:8px;margin-top:10px}
  .stgw{margin-top:10px}
  .stg{scroll-snap-type:x proximity}
  .stg .st{min-width:118px;padding:6px 8px;font-size:11.5px;scroll-snap-align:start}
  .hd .sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .calc{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .calc>div{padding:7px 8px}.calc b{font-size:13.5px}.calc span{font-size:10.5px}.calc em{display:none}
  .ibox{padding:7px 8px 7px 10px}
  .b-bar .auto{flex-basis:100%;font-size:12px}
  .b-bar .sigue{order:-1;width:100%;justify-content:center}
  .b-bar .acc{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  .b-bar .acc::-webkit-scrollbar{display:none}
  .dl2{grid-template-columns:1fr;gap:0}.dl2 dd{margin-bottom:8px}
  .rt{grid-template-columns:repeat(3,1fr)}
  .fg{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
  .fija .nm small{display:none}
  .fija .sigue .tx2{display:none}
  .savebar .tx span.l{display:none}
  .vt .res{display:none}
}
</style>
</head>

  /* ═════════ eventos ═════════ */
  function activarPanel() {
    var m = $('main');
    m.oninput = function (e) {
      var t = e.target;
      if (t.hasAttribute('data-nota')) { var i = +t.getAttribute('data-nota'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; var nv = t.value.replace(/\n/g, ' '); if (NOTAS[i] !== nv) { NOTAS[i] = nv; notaEditada(); } return; }
      var c = t.getAttribute('data-c'); if (!c || t.type === 'checkbox' || t.tagName === 'SELECT') return;
      setCampo(c, t.value, t);
    };
    m.onchange = function (e) {
      var t = e.target, c = t.getAttribute('data-c'); if (!c) return;
      setCampo(c, t.type === 'checkbox' ? (t.checked ? 'SI' : 'NO') : t.value, t);
      if (TARIFA_COLS.indexOf(c) >= 0) notasTrasTarifa();
      if (c === 'frecuencia' || c.indexOf('doc ') === 0 || c === 'costo visita') { var y = window.scrollY; if (c.indexOf('doc ') === 0 && TAB === 'documentos') { pintarPanel(); } else if (c === 'frecuencia') { pintarPanel(); } window.scrollTo(0, y); }
    };
    m.onclick = function (e) {
      var a = e.target.closest('[data-a],[data-tab],[data-etapa],[data-sv],[data-tlf],[data-ir]'); if (!a || !m.contains(a)) return;
      if (a.hasAttribute('data-tab')) { e.preventDefault(); irTab(a.getAttribute('data-tab')); return; }
      if (a.hasAttribute('data-etapa')) { if (!a.disabled) hojaEtapa(a.getAttribute('data-etapa')); return; }
      if (a.hasAttribute('data-sv')) { if (!a.disabled) cambiarTipo(a.getAttribute('data-sv')); return; }
      if (a.hasAttribute('data-tlf')) { TL_FILTRO = a.getAttribute('data-tlf'); pintarPanel(); return; }
      if (a.hasAttribute('data-ir')) { irCampo(a.getAttribute('data-ir')); return; }
      if (a.tagName === 'A' && a.getAttribute('href') === '#') e.preventDefault();
      accion(a.getAttribute('data-a'), a);
    };
    $('fija').onclick = function (e) { if (e.target.closest('[data-a="sigue"]')) sigue().fn(); };
  }

  function setCampo(col, val, el) {
    if (norm(col, val) === norm(col, OP[col])) delete CAMBIOS[col]; else CAMBIOS[col] = val;
    if (col === 'frecuencia' && especial() && lleno('plazo contrato')) CAMBIOS['plazo contrato'] = '';
    var f = el && el.closest && el.closest('.fld'); if (f) f.classList.toggle('mod', Object.prototype.hasOwnProperty.call(CAMBIOS, col));
    if (col === 'fecha contrato' || col === 'plazo contrato') { var vn = $('venc'); if (vn) { var x = vencimiento(); vn.value = x ? MK.fechaLarga(x) : ''; } }
    pintarTabs(); pintarGuardar();
  }

  function irTab(t) {
    TAB = t; pintarTabs(); pintarPanel();
    var tb = $('tabs'), on = tb.querySelector('.on'); if (on) tb.scrollLeft = Math.max(0, on.offsetLeft - 30);
    if (tb.getBoundingClientRect().top < 60) window.scrollTo(0, window.scrollY + tb.getBoundingClientRect().top - 120);
  }
  function irCampo(col) {
    var t = DONDE[col] || 'contrato';
    if (t === 'contacto') { var pc = principal(); if (!ro()) hojaContacto(pc, (D.contactos || []).indexOf(pc)); else MK.aviso('Ese dato sale del contacto principal.'); return; }
    if (TAB !== t) irTab(t);
    var el = document.querySelector('[data-c="' + col + '"]');
    if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); setTimeout(function () { el.focus(); }, 250); var f = el.closest('.fld'); if (f) { f.classList.add('glow'); setTimeout(function () { f.classList.remove('glow'); }, 2400); } }
  }

  function cambiarTipo(tipo) {
    if (ro()) return;
    var ahora = unica() ? 'VISITA UNICA' : 'RECURRENTE';
    if (tipo === ahora) return;
    setCampo('tipoServicio', tipo);
    if (NOTAS_EDIT) NOTAS_AVISO = 'Estas notas se escribieron para un servicio ' + (tipo === 'VISITA UNICA' ? 'recurrente' : 'de una sola visita') + '. Revísalas, o usa <b>Volver a las estándar</b> para traer las que corresponden.';
    else traerNotas('silencioso');
    pintarTarjeta(); pintarTabs(); pintarPanel();
    MK.aviso(tipo === 'VISITA UNICA' ? 'Visita única: sin frecuencia, plazo ni contrato. Guarda para aplicarlo.' : 'Servicio recurrente. Guarda para aplicarlo.');
  }

  function accion(a, el) {
    var i = el.getAttribute('data-i'), id = el.getAttribute('data-id');
    switch (a) {
      case 'sigue': sigue().fn(); break;
      case 'actividad': MK.actividad({ ref: COD, refTipo: 'op', cuenta: OP.empresa, contacto: (principal() || {}).nombre || '', tipo: el.getAttribute('data-tipo') || 'llamada' }); break;
      case 'ganada': hojaEtapa('Firmado'); break;
      case 'perdida': hojaEtapa('Rechazado'); break;
      case 'standby': hojaEtapa('Stand-by'); break;
      case 'reabrir-ficha': REABIERTA = true; MK.aviso('Ficha reabierta: ya puedes corregirla'); pintar(); break;
      case 'tarea-nueva': MK.tarea({ ref: COD, refTipo: 'op', cuenta: OP.empresa, fecha: MK.masDias(MK.hoy, 1) }); break;
      case 'tarea-completar': var t = tareaPor(id); if (t && t.estado === 'pendiente') MK.completar(t); break;
      case 'tarea-editar': var t2 = tareaPor(id); if (t2) MK.tarea(t2); break;
      case 'wa': case 'mail':
        var c = i === '-1' ? principal() : D.contactos[+i];
        if (c) MK.mensaje({ canal: a === 'wa' ? 'whatsapp' : 'correo', telefono: waNumero(c.celular) || waNumero(c.telefono), correo: c.correo, ref: COD, refTipo: 'op', cuenta: OP.empresa, contacto: c.nombre,
          momento: OP.estado, vars: { propuesta: COD, enlace: enlaceFormulario() } });
        break;
      case 'contacto-nuevo': hojaContacto(null, -1); break;
      case 'contacto-editar': hojaContacto(D.contactos[+i], +i); break;
      case 'contacto-principal': var pc = principal(); hojaContacto(pc, (D.contactos || []).indexOf(pc)); break;
      case 'formulario': hojaFormulario(); break;
      case 'copiar-enlace': copiar(enlaceFormulario(), 'Enlace copiado. Pégalo en el WhatsApp del cliente.'); break;
      case 'ver-propuesta': verPropuesta(); break;
      case 'envio-propuesta': hojaEnvioPropuesta(); break;
      case 'pedir-inspeccion': hojaInspeccion(); break;
      case 'usar-rec': usarRecomendacion(); break;
      case 'nota-quitar': NOTAS.splice(+i, 1); notaEditada(); pintarNotas(); break;
      case 'nota-agregar': var pos = el.hasAttribute('data-nota') ? +el.getAttribute('data-nota') + 1 : NOTAS.length; NOTAS.splice(pos, 0, ''); notaEditada(); pintarNotas(); var ins = document.querySelector('#notas-box [data-nota="' + pos + '"]'); if (ins) ins.focus(); break;
      case 'nota-estandar': MK.confirmar('Se descartan los cambios de este cliente y vuelven las notas del tipo de servicio, con las tarifas de la ficha.', function () { traerNotas('restaurar'); }, { titulo: 'Volver a las notas estándar', boton: 'Sí, restaurar' }); break;
      case 'subir': hojaSubir({ col: el.getAttribute('data-col') || '' }); break;
      case 'nueva-version': hojaSubir({ docId: el.getAttribute('data-doc') }); break;
      case 'ver-archivo': verArchivo(id); break;
      case 'ver-cli': verCli(id); break;
      case 'aceptar-cli': aceptarCli(id, el); break;
      case 'rechazar-cli': rechazarCli(id, el.getAttribute('data-n') || 'el documento'); break;
      case 'wa-docs': waDocs(); break;
      case 'envio-doc': hojaEnvioDoc(docPor(el.getAttribute('data-doc'))); break;
      case 'contrato': revisarContrato(); break;
      case 'cartera': hojaCartera(); break;
      case 'contabilidad': correoCartera(); break;
      case 'borrar': borrar(); break;
    }
  }
  function tareaPor(id) { var t = (D.tareas || []).filter(function (x) { return x.id === id; })[0] || (OP.proximaTarea && OP.proximaTarea.id === id ? OP.proximaTarea : null); return t; }
  function docPor(id) { return (D.documentos || []).filter(function (x) { return x.id === id; })[0] || null; }

  function copiar(texto, msg) {
    var ok = function () { MK.aviso(msg || 'Copiado'); };
    var manual = function () {
      MK.hoja('<h2>Copia el enlace</h2><p class="small muted">Selecciónalo y cópialo con Ctrl+C (o mantén presionado en el celular).</p><input class="in" id="cp-link" readonly value="' + E(texto) + '" style="margin-top:10px">' +
        '<div class="pie"><button class="btn pri" onclick="MK.cerrarHoja()">Listo</button></div>');
      var i = $('cp-link'); setTimeout(function () { i.focus(); i.select(); }, 60);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, manual); else manual();
  }

  /* ═════════ guardar ═════════ */
  function guardar() {
    if (GER || !hayCambios()) return Promise.resolve(true);
    if (Object.prototype.hasOwnProperty.call(CAMBIOS, 'empresa') && !String(CAMBIOS.empresa).trim()) { MK.aviso('Falta el nombre de la empresa.'); irCampo('empresa'); return Promise.resolve(false); }
    var d = {}; Object.keys(CAMBIOS).forEach(function (k) { d[k] = CAMBIOS[k]; });
    /* siempre juntos: el servidor calcula el vencimiento con los dos y, si no
       llega la fecha, lo borra */
    d.tipoServicio = unica() ? 'VISITA UNICA' : 'RECURRENTE';
    d['fecha contrato'] = v('fecha contrato'); d['plazo contrato'] = especial() ? '' : v('plazo contrato');
    if (!lleno('validez propuesta')) d['validez propuesta'] = '30';
    if (!lleno('asesor')) d.asesor = MK.usuario.nombre;
    if (NOTAS_CAMBIO) d.notasPropuesta = NOTAS_EDIT ? NOTAS.map(function (x) { return String(x).trim(); }).filter(Boolean).join('\n') : '';
    var b = $('sv-ok'); MK.ocupado(b, true);
    return MK.api('api_crmGuardarOportunidad', MK.pin, COD, d).then(function (r) {
      MK.ocupado(b, false);
      if (!r || !r.ok) { MK.aviso((r && r.error) || 'No se pudo guardar.'); return false; }
      CAMBIOS = {}; NOTAS_CAMBIO = false; NOTAS_AVISO = '';
      pintarGuardar(); MK.aviso('Guardado ✓');
      MK.cambio({ tipo: 'oportunidad', codigo: COD });
      return true;
    }, function (e) { MK.ocupado(b, false); MK.aviso('Sin conexión — no se guardó. ' + e.message); return false; });
  }
  /* guardar unas pocas columnas sin tocar lo que está sin guardar */
  function guardarParcial(datos) {
    var d = Object.assign({ 'fecha contrato': OP['fecha contrato'] || '', 'plazo contrato': OP['plazo contrato'] || '' }, datos);
    return MK.llamar('api_crmGuardarOportunidad', MK.pin, COD, d);
  }

  /* ═════════ etapas ═════════ */
  function mover(etapa, extra) {
    return antesGuardar().then(function (ok) {
      if (!ok) return false;
      return MK.llamar('api_crmMoverEtapa', MK.pin, [COD], etapa, extra || {}).then(function (r) {
        if (r.errores && r.errores.length) MK.aviso(r.errores.join(' · ')); else MK.aviso('Etapa: «' + etapa + '»');
        MK.cambio({ tipo: 'etapa', codigo: COD }); return true;
      }, function () { return false; });
    });
  }
  function hojaEtapa(etapa) {
    if (GER) return;
    if (etapa === OP.estado) { MK.aviso('Ya está en «' + etapa + '»'); return; }
    if (etapa === 'Pasado a cartera') { hojaCartera(); return; }
    var aj = D.ajustes || {}, pr = Number((aj.probabilidades || {})[etapa] || 0);
    var aviso = hayCambios() ? '<div class="aviso am" style="margin-top:10px">Primero se guardan tus cambios de la ficha.</div>' : '';
    var h;
    if (etapa === 'Rechazado') {
      h = MK.hoja('<h2>Marcar como perdida</h2><p class="small muted">El motivo es obligatorio: alimenta el reporte de por qué perdemos. Las tareas pendientes se cierran solas.</p>' +
        '<label class="lb">MOTIVO</label>' + MK.chips('mot', aj.motivosPerdida || [], '') +
        '<label class="lb" for="et-det">DETALLE <span class="muted">(con quién se fue, qué pasó)</span></label><input class="in" id="et-det">' + aviso +
        '<div id="et-msg" class="small" style="margin-top:8px;color:var(--bad)"></div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn bad" id="et-ok">Marcar perdida</button></div>');
      MK.activarChips(h);
      $('et-ok').onclick = function () {
        var m = MK.valorChips(h, 'mot'), det = $('et-det').value.trim();
        if (!m && !det) { $('et-msg').textContent = 'Elige el motivo.'; return; }
        MK.ocupado(this, true); var b = this;
        mover('Rechazado', { motivo: m ? m + (det ? ': ' + det : '') : det }).then(function (ok) { MK.ocupado(b, false); if (ok) MK.cerrarHoja(); });
      };
      return;
    }
    if (etapa === 'Stand-by') {
      MK.hoja('<h2>Poner en stand-by</h2><p class="small muted">Sale del embudo activo y no cuenta en el pronóstico. Se crea una tarea para retomarla ese día.</p>' +
        '<label class="lb" for="et-ret">RETOMAR EL</label><input class="in" type="date" id="et-ret" value="' + MK.masDias(MK.hoy, 30) + '">' +
        '<label class="lb" for="et-por">POR QUÉ</label><input class="in" id="et-por" placeholder="Ej.: esperan el presupuesto del próximo año">' + aviso +
        '<div id="et-msg" class="small" style="margin-top:8px;color:var(--bad)"></div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="et-ok">Poner en stand-by</button></div>');
      $('et-ok').onclick = function () {
        var f = $('et-ret').value; if (!f) { $('et-msg').textContent = 'Elige cuándo retomarla.'; return; }
        if (f <= MK.hoy) { $('et-msg').textContent = 'La fecha para retomarla tiene que ser después de hoy.'; return; }
        var b = this; MK.ocupado(b, true);
        mover('Stand-by', { retomar: f, nota: $('et-por').value.trim() }).then(function (ok) { MK.ocupado(b, false); if (ok) MK.cerrarHoja(); });
      };
      return;
    }
    var iA = ETAPAS.indexOf(OP.estado), iN = ETAPAS.indexOf(etapa);
    MK.hoja('<h2>Mover a «' + E(etapa) + '»</h2><p class="small muted">Queda anotado en la línea de tiempo con la fecha de hoy.</p>' +
      '<div class="meter" style="margin-top:12px"><div class="row small"><span>Probabilidad en esa etapa</span><span class="sp"></span><b>' + pr + ' %</b></div>' +
      '<div class="row small"><span>Valor ponderado</span><span class="sp"></span><b>' + MK.dinero(Number(OP.valor || 0) * pr / 100) + '</b></div></div>' +
      (iA >= 0 && iN >= 0 && iN < iA ? '<p class="small" style="margin-top:8px;color:#8a5a00">Vas hacia atrás: se conservan todos los datos y documentos.</p>' : '') +
      (etapa === 'Firmado' ? '<div class="aviso az" style="margin-top:10px">Se gana cuando el cliente firma. Sube el ' + (unica() ? 'documento firmado' : 'contrato firmado') + ' en Documentos. Al quedar en «Firmado» la ficha se cierra a la edición y las tareas pendientes se cierran solas.</div>' : '') +
      aviso + '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="et-ok">Mover</button></div>');
    $('et-ok').onclick = function () { var b = this; MK.ocupado(b, true); mover(etapa).then(function (ok) { MK.ocupado(b, false); if (ok) MK.cerrarHoja(); }); };
  }
  function hojaReabrir() {
    var abiertas = ETAPAS.slice(0, 6);
    MK.hoja('<h2>Reabrir la oportunidad</h2><p class="small muted">Elige en qué etapa retomarla. Queda anotado.</p><div class="opcs">' + abiertas.map(function (e) {
      return '<button data-e="' + E(e) + '">' + IC('flecha', 18) + '<span><b>' + E(e) + '</b><small>Probabilidad ' + Number(((D.ajustes || {}).probabilidades || {})[e] || 0) + ' %</small></span></button>';
    }).join('') + '</div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button></div>');
    [].forEach.call(document.querySelectorAll('#hoja .opcs button'), function (b) {

    });

      mover('Contrato en proceso').then(function (ok) { if (ok) { TAB = 'contrato'; } });

    [].forEach.call(document.querySelectorAll('#hoja .opcs button'), function (b) {

          : r === 'cambios' ? { texto: 'El cliente pide ajustar la propuesta.', resultado: 'Pide cambios', etapa: 'En negociación', siguiente: { titulo: 'Enviar la propuesta ajustada', tipo: 'correo', fecha: MK.masDias(MK.hoy, 2) } }
            : { texto: 'Llamada de seguimiento: no contestó.', resultado: 'No contestó', siguiente: { titulo: 'Volver a llamar', tipo: 'llamada', fecha: MK.masDias(MK.hoy, 1) } });
        [].forEach.call(document.querySelectorAll('#hoja .opcs button'), function (x) { x.disabled = true; });
        antesGuardar().then(function (ok) {

            MK.cambio({ tipo: 'actividad', ref: COD });
          }, function () { [].forEach.call(document.querySelectorAll('#hoja .opcs button'), function (x) { x.disabled = false; }); });
        });
      };

  }
  function aBlob(datos, tipo) {
    var s = String(datos || '').replace(/^'/, ''), i = s.indexOf(',');
    var meta = s.slice(5, i), bin = atob(s.slice(i + 1)), n = bin.length, u = new Uint8Array(n);
    for (var k = 0; k < n; k++) u[k] = bin.charCodeAt(k);
    return new Blob([u], { type: tipo || meta.split(';')[0] || 'application/octet-stream' });
  }
  function verArchivo(id) {
    var w = window.open('', '_blank');
    if (w) { try { w.document.write('<title>Abriendo…</title><p style="font:14px Archivo,sans-serif;color:#667489;padding:24px">Abriendo el archivo…</p>'); } catch (e) {} }
    MK.api('api_crmArchivo', MK.pin, id).then(function (r) {
      if (!r || !r.ok) { if (w) w.close(); MK.aviso((r && r.error) || 'No se pudo abrir el archivo.'); return; }
      if (r.url || r.almacenError) { if (!r.url) { if (w) w.close(); MK.aviso(r.almacenError); return; } if (w) w.location.href = r.url; else location.href = r.url; return; }
      var url = URL.createObjectURL(aBlob(r.datos, r.tipo));
      if (w) w.location.href = url; else { var a = document.createElement('a'); a.href = url; a.download = r.nombre || 'archivo'; document.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
    }, function (e) { if (w) w.close(); MK.aviso('Sin conexión: ' + e.message); });
  }
  function selectContactos(id, canal) {
    var l = D.contactos || [];
    return '<select class="sel" id="' + id + '">' + l.map(function (c) { var d = canal === 'correo' ? c.correo : (c.celular || c.telefono); return '<option value="' + E(c.nombre + (d ? ' · ' + d : '')) + '">' + E(c.nombre + (d ? ' · ' + d : '')) + '</option>'; }).join('') + '<option value="">Otro…</option></select>';
  }
  function hojaEnvioDoc(doc) {
    if (!doc || GER) return;
    var h = MK.hoja('<h2>Anotar envío · ' + E(doc.nombre) + '</h2><p class="small muted">Queda en el historial del documento y en la línea de tiempo.</p>' +
      '<label class="lb">CANAL</label>' + MK.chips('canal', [['correo', IC('correo', 14) + ' Correo'], ['whatsapp', IC('whatsapp', 14) + ' WhatsApp'], ['entregado', 'En mano']], 'correo') +
      '<label class="lb" for="ev-a">ENVIADO A</label>' + selectContactos('ev-a', 'correo') +
      (doc.tipo === 'propuesta' ? '<label class="lb" for="ev-v">VÁLIDA HASTA</label><input class="in" type="date" id="ev-v" value="' + MK.masDias(MK.hoy, Number(v('validez propuesta') || 30)) + '">' : '') +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="ev-ok">Anotar</button></div>');
    MK.activarChips(h);
    $('ev-ok').onclick = function () {
      var b = this; MK.ocupado(b, true);
      var d = { id: doc.id, estado: 'enviada', canal: MK.valorChips(h, 'canal'), enviadoA: $('ev-a').value, evento: 'Enviado' };
      if ($('ev-v')) d.validoHasta = $('ev-v').value;
      MK.llamar('api_crmGuardarDocumento', MK.pin, d).then(function () { MK.ocupado(b, false); MK.cerrarHoja(); MK.aviso('Envío anotado'); MK.cambio({ tipo: 'documento' }); }, function () { MK.ocupado(b, false); });
    };
  }
  function hojaEnvioPropuesta() {
    if (GER) return;
    var props = (D.documentos || []).filter(function (d) { return d.tipo === 'propuesta' && d.estado !== 'firmada'; }).sort(function (a, b) { return String(b.creadoEn).localeCompare(String(a.creadoEn)); });
    var prev = props[0] || null, iA = ETAPAS.indexOf(OP.estado);
    var h = MK.hoja('<h2>Anotar que se envió la propuesta</h2><p class="small muted">Después de mandarla desde la propuesta imprimible (WhatsApp, correo o impresa), anótalo aquí: queda la versión con fecha, canal y vigencia.</p>' +
      '<label class="lb">CANAL</label>' + MK.chips('canal', [['correo', IC('correo', 14) + ' Correo'], ['whatsapp', IC('whatsapp', 14) + ' WhatsApp'], ['entregado', 'En mano']], 'correo') +
      '<label class="lb" for="ep-a">ENVIADA A</label>' + selectContactos('ep-a', 'correo') +
      '<label class="lb" for="ep-v">VÁLIDA HASTA</label><input class="in" type="date" id="ep-v" value="' + MK.masDias(MK.hoy, Number(v('validez propuesta') || 30)) + '">' +
      (prev ? '<label class="chk" style="margin-top:12px"><input type="checkbox" id="ep-nv"> Es una versión nueva (cambió el precio o las notas) · hoy va en v' + prev.version + '</label>' : '') +
      (iA >= 0 && iA < 3 ? '<div class="aviso az" style="margin-top:10px">La etapa pasa sola a «Propuesta enviada».</div>' : '') +
      (hayCambios() ? '<div class="aviso am" style="margin-top:10px">Primero se guardan tus cambios de la ficha.</div>' : '') +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="ep-ok">Anotar envío</button></div>');
    MK.activarChips(h);
    $('ep-ok').onclick = function () {
      var b = this, canal = MK.valorChips(h, 'canal'), a = $('ep-a').value, val = $('ep-v').value, nv = $('ep-nv') && $('ep-nv').checked;
      MK.ocupado(b, true);
      antesGuardar().then(function (ok) {
        if (!ok) { MK.ocupado(b, false); return; }
        var d = prev ? { id: prev.id, estado: 'enviada', canal: canal, enviadoA: a, validoHasta: val, nuevaVersion: !!nv, evento: 'Enviado' }
          : { tipo: 'propuesta', ref: COD, refTipo: 'op', cuenta: OP.empresa, nombre: 'Propuesta ' + COD, estado: 'enviada', canal: canal, enviadoA: a, validoHasta: val, enlace: 'Propuesta.html?cod=' + encodeURIComponent(COD), evento: 'Enviado' };
        MK.llamar('api_crmGuardarDocumento', MK.pin, d).then(function () {
          if (iA >= 0 && iA < 3) return MK.llamar('api_crmMoverEtapa', MK.pin, [COD], 'Propuesta enviada', { nota: 'se envió la propuesta' });
          if (!OP['fecha propuesta']) return guardarParcial({ 'fecha propuesta': MK.hoy });
        }).then(function () { MK.ocupado(b, false); MK.cerrarHoja(); MK.aviso('Envío de la propuesta anotado'); MK.cambio({ tipo: 'documento' }); }, function () { MK.ocupado(b, false); });
      });
    };
  }

  /* ═════════ pasar a cartera ═════════ */
  function hojaCartera() {
    if (GER) return;
    if (OP.estado === 'Pasado a cartera') { MK.aviso('Esta propuesta ya pasó a cartera.'); return; }
    if (OP.estado !== 'Firmado') { MK.aviso('Solo se pasan a cartera las oportunidades en «Firmado».'); return; }
    var falt = listaDocs().filter(function (d) { return String(OP[d[0]]).toUpperCase() !== 'SI'; });
    MK.hoja('<h2>Pasar a cartera</h2><p class="small muted">Se envía a operaciones como solicitud de alta para que la aprueben con su ubicación. Viaja todo lo de esta ficha: RUC, plan, tarifas, contrato y facturación.</p>' +
      (falt.length ? '<div class="aviso am" style="margin-top:10px">Faltan documentos: <b>' + E(falt.map(function (d) { return d[1]; }).join(', ')) + '</b>. Se puede enviar igual: la solicitud lo dice.</div>' : '<div class="aviso vd" style="margin-top:10px">Documentación completa.</div>') +
      (hayCambios() ? '<div class="aviso am" style="margin-top:10px">Primero se guardan tus cambios de la ficha.</div>' : '') +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="ca-ok">' + IC('flecha', 15) + ' Sí, enviar</button></div>');
    $('ca-ok').onclick = function () {
      if (ENVIANDO.cartera) { MK.aviso('Ya se está enviando…'); return; }
      ENVIANDO.cartera = true; var b = this; MK.ocupado(b, true, 'Enviando…');
      var soltar = function () { ENVIANDO.cartera = false; MK.ocupado(b, false); };
      antesGuardar().then(function (ok) {
        if (!ok) { soltar(); return; }
        MK.api('api_pasarACartera', MK.pin, COD).then(function (r) {
          soltar();
          if (!r || !r.ok) { MK.cerrarHoja(); MK.aviso((r && r.error) || 'No se pudo enviar.'); if (r && r.yaEnviada) MK.cambio({ tipo: 'cartera' }); return; }
          MK.cerrarHoja();
          MK.aviso(r.aviso ? r.aviso : r.faltan && r.faltan.length ? 'Enviado, pero faltan documentos: ' + r.faltan.join(', ') : 'Enviado a operaciones ✓');
          MK.cambio({ tipo: 'cartera' });
          setTimeout(correoCartera, 500);
        }, function (e) { soltar(); MK.aviso('Sin conexión: ' + e.message); });
      });
    };
  }
  function correoCartera() {
    MK.llamar('api_correoCartera', MK.pin, COD).then(function (r) {
      var av = '';
      if (r.sinDestinatarios) av += '<div class="aviso rj small" style="margin-top:10px"><b>No hay correos configurados para contabilidad.</b> Se abre igual, pero tendrás que escribir a quién. Se configuran en Plantillas y ajustes.</div>';
      if (r.faltan && r.faltan.length) av += '<div class="aviso am small" style="margin-top:10px">Al cliente le falta <b>' + E(r.faltan.join(', ')) + '</b>. El correo lo dice, para que contabilidad no lo descubra facturando.</div>';
      MK.hoja('<h2>Avisarle a contabilidad</h2>' + av + '<p class="small muted" style="margin-top:10px">' + (r.sinDestinatarios ? 'Sin destinatarios' : 'Para: <b>' + E((r.para || []).join(', ')) + '</b>') + '</p>' +
        '<label class="lb" for="cc-t">MENSAJE</label><textarea class="in mono" id="cc-t" rows="11">' + E(r.cuerpo || '') + '</textarea>' +
        '<p class="small muted" style="margin-top:6px">Se abre tu correo con todo puesto. Lo revisas y lo mandas tú.</p>' +
        '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cerrar</button><button class="btn" id="cc-cp">' + IC('documento', 14) + ' Copiar</button><button class="btn pri" id="cc-ok">' + IC('correo', 15) + ' Abrir en mi correo</button></div>', { ancha: true });
      $('cc-cp').onclick = function () { copiar($('cc-t').value, 'Mensaje copiado'); };
      $('cc-ok').onclick = function () {
        var u = outlook((r.para || []).join(','), r.asunto, $('cc-t').value);
        if (u.length > 1900) MK.aviso('El mensaje es largo: si te llega cortado, usa Copiar');
        abrir(u);
      };
    }, function () {});
  }

  /* ═════════ borrar ═════════ */
  function borrar() {
    MK.llamar('api_revisarBorrado', MK.pin, COD).then(function (r) {
      if (!r.puede) {
        MK.hoja('<h2>No puedes borrar esta oportunidad</h2><p class="muted" style="margin-top:6px">Está en «' + E(r.estado) + '». Desde que hay propuesta, solo el administrador puede borrarla.</p><div class="pie"><button class="btn pri" onclick="MK.cerrarHoja()">Entendido</button></div>');
        return;
      }
      MK.hoja('<h2>Borrar ' + E(r.empresa) + '</h2><p class="muted" style="margin-top:6px">Esto <b>no se puede deshacer</b>.</p>' +
        (r.pierde && r.pierde.length ? '<p class="small" style="margin-top:10px">Se van a perder:</p><ul style="margin:4px 0 0 18px;font-size:13px">' + r.pierde.map(function (z) { return '<li>' + E(z) + '</li>'; }).join('') + '</ul>' : '') +
        '<label class="lb" for="br-n">ESCRIBE EL NOMBRE DE LA EMPRESA PARA CONFIRMAR</label><input class="in" id="br-n" autocomplete="off" placeholder="' + E(r.empresa) + '">' +
        '<div id="br-msg" class="small" style="margin-top:8px;color:var(--bad)"></div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn bad" id="br-ok" disabled>Borrar definitivamente</button></div>');
      var inp = $('br-n'), ok = $('br-ok');
      inp.oninput = function () { ok.disabled = clave(inp.value) !== clave(r.empresa); };
      setTimeout(function () { inp.focus(); }, 60);
      ok.onclick = function () {
        MK.ocupado(ok, true, 'Borrando…');
        MK.api('api_borrarProspecto', MK.pin, COD).then(function (x) {
          if (!x || !x.ok) { MK.ocupado(ok, false); $('br-msg').textContent = (x && x.error) || 'No se pudo borrar.'; return; }
          CAMBIOS = {}; NOTAS_CAMBIO = false; MK.cerrarHoja(); MK.aviso('Oportunidad borrada');
          setTimeout(function () { location.href = 'MerOportunidades.html'; }, 700);
        }, function (e) { MK.ocupado(ok, false); $('br-msg').textContent = e.message; });
      };
    }, function () {});
  }
})();
</script>
</body>
