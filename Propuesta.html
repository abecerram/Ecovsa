<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--fondo);color:var(--tinta);padding-bottom:40px}

.barra{position:sticky;top:0;z-index:5;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:11px 14px;background:linear-gradient(135deg,var(--azul-osc),var(--azul));
  box-shadow:0 2px 12px rgba(11,60,110,.3)}
.barra .ti{color:#fff;font-size:13px;font-weight:800;letter-spacing:.4px;margin-right:auto}
.barra button{border:none;font-family:inherit;font-size:13.5px;font-weight:700;
  padding:10px 15px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.barra button.pri{background:var(--ambar);color:#4A3300}
.barra button.wa{background:#25D366;color:#08351C}
.barra button:active{transform:translateY(1px)}

/* El paso previo a enviar. Vive DENTRO de la barra a propósito: así el
   display:none de @media print lo tapa junto con ella y no hay forma de
   que un aviso interno termine impreso en la propuesta del cliente. */
.pre{flex-basis:100%;background:#fff;border-radius:10px;padding:14px 16px;
  font-size:13px;color:#333;line-height:1.6}
.pre h5{margin:0 0 7px;font-size:13.5px;color:var(--azul-osc)}
/* El documento pone un ✓ delante de cada <li>. Aquí los pasos van
   numerados, y número más palomita a la vez se lee como si el paso ya
   estuviera hecho — justo lo contrario de lo que dice el aviso. */
.pre ol{margin:0 0 11px;padding-left:19px;list-style:decimal}
.pre li{margin-bottom:3px;position:static}
.pre li:before{content:none}
.pre .bs{display:flex;gap:9px;flex-wrap:wrap}
.pre button{font-size:13px;padding:9px 14px}
.pre button.ok{background:var(--azul);color:#fff}
.pre button.no{background:#eceff3;color:#555}

.aviso{max-width:820px;margin:22px auto;background:#fff;border:1px solid var(--borde);
  border-radius:12px;padding:26px;text-align:center;font-size:14px;color:var(--gris);line-height:1.6}

.hoja{max-width:820px;margin:18px auto 0;background:#fff;color:#1a1a1a;padding:34px 40px;
  border:1px solid var(--borde);border-radius:8px;font-size:12.5px;line-height:1.62;
  box-shadow:0 3px 16px rgba(11,60,110,.10)}

.enc{display:flex;gap:16px;align-items:flex-start;padding-bottom:14px}
.enc img{height:74px;width:auto}
.enc .emp{font-size:19px;font-weight:900;color:var(--verde);letter-spacing:.5px;line-height:1.1}
.enc .lem{font-size:10.5px;color:var(--azul);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}
.enc .con{font-size:10px;color:#666;margin-top:5px;line-height:1.5}
.enc .der{margin-left:auto;text-align:right}
.enc .der .et{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#777}
.enc .der .num{font-size:16px;font-weight:900;color:var(--azul-osc);letter-spacing:.6px}
.enc .der .fe{font-size:10.5px;color:#666;margin-top:4px}
.franja{height:4px;background:linear-gradient(90deg,var(--azul-osc) 0%,var(--azul) 34%,
  var(--verde-bandera) 67%,var(--lima) 100%);border-radius:2px;margin-bottom:20px}

.dest{margin-bottom:16px}
.dest .se{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#777}
.dest .nom{font-size:15px;font-weight:800;color:var(--azul-osc);line-height:1.25}
.dest .li{font-size:11.5px;color:#555;margin-top:2px}

.sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--azul);margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--lima)}
p{margin-bottom:9px;text-align:justify}
ul{list-style:none}
li{padding-left:20px;position:relative;margin-bottom:5px}
li:before{content:"✓";position:absolute;left:0;color:var(--verde-bandera);font-weight:900}
.notas li:before{content:"•";color:var(--azul);font-size:15px;line-height:1}

table{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:12px}
th{background:var(--azul-osc);color:#fff;padding:9px 10px;text-align:left;
  font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
td{border:1px solid #d6d6d6;padding:9px 10px}
td.n{text-align:right;white-space:nowrap}
/* api 3.13: en el celular las tablas no se salen de la hoja */
@media screen and (max-width:600px){td.n{white-space:normal}th,td{padding:7px 6px}}
tr.tot td{background:#EEF5E4;font-weight:800;font-size:13.5px;color:var(--verde)}
.pie-tabla{font-size:10.5px;color:#666;line-height:1.55;font-style:italic}

.firma{margin-top:20px}
.firma .lin{border-top:1.5px solid #333;width:230px;padding-top:6px;margin-top:26px;font-size:11.5px}
.firma .lin b{display:block;font-size:12.5px}
.pie{margin-top:16px;padding-top:9px;border-top:1px solid #ddd;font-size:9.5px;
  color:#777;text-align:center;line-height:1.6}

@media print{
  body{background:#fff;padding:0}
  .barra{display:none}
  .hoja{max-width:none;margin:0;border:none;border-radius:0;padding:0;box-shadow:none;font-size:10.5pt}
  table{page-break-inside:avoid} .firma{page-break-inside:avoid}
}
@page{size:letter;margin:12mm}

<body>

<div id="aviso" class="aviso">Cargando la propuesta…</div>

<div id="app" style="display:none">
<div class="barra doc-barra no-imprimir">
    <span class="db-marca"><img src="ecovsa-letras.png" alt="ECOVSA"></span>
    <div class="ti">Propuesta comercial</div>
    <span id="envios"></span>
    <button class="db-pdf" onclick="window.print()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg><span>Guardar en PDF</span></button>
    <div class="pre" id="pre" style="display:none"></div>
  </div>
  <div class="hoja" id="hoja"></div>
</div>

<script>
var LOGO="logo-ecovsa.png";
var COD="", DATOS=null;

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
/* Con separador de miles: esto lo lee un cliente. "3240.00" y "3,240.00"
   se leen distinto en voz alta, y en una propuesta eso importa. */
function n2(v){return (Number(v||0)).toLocaleString("en-US",
  {minimumFractionDigits:2,maximumFractionDigits:2});}

/* Los datos de la empresa vienen del servidor (constante EMPRESA en
   Codigo.gs), no escritos aquí. Cambiar la dirección es cambiar una línea
   allá, no acordarse de cuatro pantallas. El respaldo es por si una versión
   vieja del servidor no los manda todavía. */
var EMP_RESP={comercial:"ECOVSA",razonSocial:"ECOTERMO DE PANAMA S.A.",
  ruc:"1074020-1-552789",dv:"50",lema:"Ecología · Vida · Salud",
  /* A propósito vacía: si algún día el servidor no manda los datos, es mejor
     que el documento salga sin dirección — y se note — a que salga con una
     dirección vieja en un contrato o un certificado. */
  direccion:"",
  ciudad:"Panamá",telefono:"310-2268",whatsapp:"6264-1647",
  correo:"info@ecovsa.com",instagram:"@ecovsapanama",
  resolucion:"Resolución Sanitaria N° 1519 del 10 de diciembre de 2025",
  resolucionCorta:"Resolución Sanitaria N° 1519",
  decreto:"Decreto Ejecutivo 111 de 1999",formulario:""};
function emp(){ return (typeof DATOS_EMP==="object" && DATOS_EMP) ? DATOS_EMP : EMP_RESP; }
var DATOS_EMP=null;
/* La dirección ya nombra la ciudad; anteponerla daba "Panamá, Distrito Panamá". */
function conCiudad(dir,ciudad){
  var d=String(dir||"").trim(), c=String(ciudad||"").trim();
  if(!d) return c;
  if(!c || d.toUpperCase().indexOf(c.toUpperCase())>=0) return d;
  return c+", "+d;
}
function pieEmpresa(){
  var e=emp();
  return conCiudad(e.direccion, e.ciudad)+
         " · Tel. "+e.telefono+" · "+e.correo;
}

function aviso(t){ $("app").style.display="none"; var a=$("aviso"); a.style.display="block"; a.innerHTML=t; }

var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
           "septiembre","octubre","noviembre","diciembre"];
function larga(iso){
  if(!iso) return "";
  var d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return iso;
  return d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear();
}
function sumarDias(iso,n){
  var d=new Date((iso||"")+"T12:00:00");
  if(isNaN(d.getTime())) d=new Date();
  d.setDate(d.getDate()+Number(n||30));
  return d.toISOString().slice(0,10);
}

function arrancar(){
  if(window.google && google.script && google.script.url){
    google.script.url.getLocation(function(loc){
      var p=(loc&&loc.parameter)||{};
      if(p.token&&p.k) return seguirCliente(p.token,p.k);
      seguir(p.cod||"");
    });
  } else {
    var q=new URLSearchParams(location.search||"");
    if(q.get("token")&&q.get("k")) return seguirCliente(q.get("token"),q.get("k"));
    seguir(q.get("cod")||"");
  }
}

/* api 3.10: el cliente la abre desde su enlace, sin PIN (con la llave del enlace).
   Ve la misma propuesta, sin los botones de envío. */
var CLIENTE=false;
function seguirCliente(token,k){
  CLIENTE=true; COD=token;
  document.title="Su propuesta · ECOVSA";
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||!r.ok){ aviso(esc((r&&r.error)||"No se pudo cargar la propuesta.")); return; }
      DATOS=r; pintar(r.prospecto);
      $("aviso").style.display="none"; $("app").style.display="block";
      var e=$("envios"); if(e) e.style.display="none";
    })
    .withFailureHandler(function(){ aviso("Sin conexión. La propuesta necesita señal."); })
    .api_enlacePropuesta(token,k);
}

function seguir(cod){
  COD=cod;
  if(!COD){ aviso("Falta el código de propuesta en el enlace.<br><br>Ábrela desde la ficha del prospecto."); return; }
  var pin="";
  try{ pin=JSON.parse(localStorage.getItem("ecovsa_pin")||'""'); }catch(e){ pin=""; }
  if(!pin){ aviso("Entra primero en la página de mercadeo y vuelve a abrir la propuesta."); return; }

  google.script.run
    .withSuccessHandler(function(r){
      if(!r||!r.ok){ aviso(esc((r&&r.error)||"No se pudo cargar la propuesta.")); return; }
      DATOS=r; pintar(r.prospecto);
      $("aviso").style.display="none"; $("app").style.display="block";
    })
    .withFailureHandler(function(){ aviso("Sin conexión. La propuesta necesita señal."); })
    .api_propuesta(pin, COD);
}

/* ═══ api 3.13 · los textos fijos vienen del servidor ═══
   Katherine los edita en Plantillas y ajustes › Propuesta y contrato; el servidor
   los manda ya resueltos en prospecto.textos = {saludo, operativa, incluye:[…], pasos}
   (de la copia guardada si la propuesta ya salió). Si no vienen —propuesta vieja o
   servidor anterior— se usan los de siempre, que son estos. */
var TXT_RESP={
  saludo:"Cordial saludo:\n\nEn ECOVSA contamos con más de 5 años de experiencia y personal altamente calificado en el "+
    "manejo integral de desechos hospitalarios peligrosos. Le garantizamos confiabilidad, regularidad "+
    "y puntualidad, con total cumplimiento de la normativa sanitaria y ambiental vigente en Panamá, "+
    "respaldando a su institución ante cualquier fiscalización. Para nosotros sería muy importante "+
    "poder contar con ustedes como nuestros usuarios.",
  operativa:{
    unica:"Recolección, transporte, tratamiento y disposición final del material descrito a "+
      "continuación, en una sola jornada coordinada con ustedes, con camión especializado y "+
      "personal certificado.",
    recurrente:"Servicio integral de recolección, transporte, tratamiento, trituración y disposición final de "+
      "desechos punzocortantes, patológicos y biológico-infecciosos, con camión especializado y personal "+
      "certificado."},
  incluye:{
    unica:["Recolección en la fecha coordinada, con camión y personal certificado."],
    recurrente:["Recolección programada según la frecuencia acordada, con puntualidad garantizada.",
      "Suministro de recipientes punzocortantes, para la correcta segregación de los desechos."],
    comun:["Manifiesto de transporte en cada recolección, para la trazabilidad de sus residuos.",
      "Certificado de tratamiento y disposición final, válido ante las autoridades sanitarias.",
      "Tratamiento con tecnología verde que reduce el volumen y el impacto ambiental del residuo.",
      "Cumplimiento de las normas oficiales de bioseguridad y manejo de desechos peligrosos."]},
  pasos:{
    unica:"Para programar el servicio solo necesitamos su confirmación y copia de su Aviso de "+
      "Operación. La fecha se coordina con un mínimo de 48 horas de anticipación. Contáctenos al "+
      "6264-1647 o escríbanos a info@ecovsa.com; será un placer atenderle.",
    recurrente:"Para iniciar el servicio solo necesitamos copia de su Aviso de Operación y los datos generales "+
      "de su institución. Con gusto coordinamos una visita o su primera recolección. Contáctenos al "+
      "6264-1647 o escríbanos a info@ecovsa.com; será un placer atenderle."}
};
function textosDe(p,UNICA){
  var T=(p&&p.textos&&typeof p.textos==="object")?p.textos:{}, k=UNICA?"unica":"recurrente";
  function hay(v){ return Array.isArray(v)?v.length>0:String(v==null?"":v).trim()!==""; }
  return {
    saludo: hay(T.saludo)?T.saludo:TXT_RESP.saludo,
    operativa: hay(T.operativa)?T.operativa:TXT_RESP.operativa[k],
    incluye: hay(T.incluye)?lineas(T.incluye):TXT_RESP.incluye[k].concat(TXT_RESP.incluye.comun),
    pasos: hay(T.pasos)?T.pasos:TXT_RESP.pasos[k]
  };
}
/* texto → html, en el formato del servidor: cada renglón es un párrafo; un renglón que
   empieza con «- » es un punto de lista (viñeta); **negrita**. [[ ]] (marca de dato) no se ve. */
function enLinea(t){ return esc(String(t).replace(/\[\[|\]\]/g,"")).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>"); }
function parrafos(t){
  var out=[], li=[];
  function cl(){ if(li.length){ out.push('<ul class="notas">'+li.map(function(x){return "<li>"+enLinea(x)+"</li>";}).join("")+"</ul>"); li=[]; } }
  String(t==null?"":t).split("\n").forEach(function(l){
    var u=/^\s*-\s+(.*)$/.exec(l);
    if(!l.trim()){ cl(); return; }
    if(u){ li.push(u[1]); return; }
    cl(); out.push("<p>"+enLinea(l)+"</p>");
  });
  cl();
  return out.join("");
}
function lineas(t){ return (Array.isArray(t)?t:String(t==null?"":t).split("\n")).map(function(x){ return String(x).replace(/^\s*-\s+/,"").trim(); }).filter(Boolean); }
/* la línea «Propuesta vigente hasta…» / «válida hasta…» ya puede venir del servidor */
function esVigencia(t){ return /^\s*(\*\*)?\s*(esta\s+)?propuesta\s+(es\s+)?(vigente|v[aá]lida)\s+hasta/i.test(String(t||"")); }
/* api 3.13 · Nota importante. notas_lista ya trae las líneas de la promoción; las que también
   vienen en notas_promo se marcan en negrita (sin tachar nada). Si el servidor no trae la línea
   de vigencia, se pone aquí; nunca dos veces. */
function notasHtml(p, vence, vencePromo){
  var L=(p.notas_lista||[]).slice(), P=(p.notas_promo||[]).map(function(x){ return String(x).trim(); });
  var ya={}; L.forEach(function(t){ ya[String(t).trim()]=1; });
  var faltan=P.filter(function(t){ return !ya[t]; });            // servidor que las manda solo aparte
  L=faltan.concat(L);
  var h='';
  if(!L.some(esVigencia)) h+= vencePromo
    ? '<li><b>Esta propuesta es válida hasta el '+esc(larga(vence))+', fecha en que cierra la promoción.</b></li>'
    : '<li>Propuesta vigente hasta '+esc(larga(vence))+'.</li>';
  return h+L.map(function(t){ var neg=p.promo&&(P.indexOf(String(t).trim())>=0||(esVigencia(t)&&/promoci/i.test(t))); return '<li>'+(neg?'<b>'+enLinea(t)+'</b>':enLinea(t))+'</li>'; }).join('');
}
/* servicios que se dan cada 2, 3 o 6 meses: se cobran repartidos en cada mes */
var MESES_CADA={bimestre:2,trimestre:3,semestre:6};

function pintar(p){
  if(DATOS && DATOS.empresa) DATOS_EMP=DATOS.empresa;
  var costo=Number(p["costo visita"])||0;
  var itbms=Number(p.itbms);
  if(!isFinite(itbms)||itbms<=0) itbms=0.07;          // 7% por defecto
  var imp=Math.round(costo*itbms*100)/100;
  var total=Math.round((costo+imp)*100)/100;
  var kg=Number(p["kg plan"])||0;
  var fProp=p["fecha propuesta"]||p["fecha contacto"]||DATOS.hoy;
  var vence=(DATOS&&DATOS.vence)||sumarDias(fProp, p["validez propuesta"]||30);
  /* api 3.13: con promoción, la propuesta vence a más tardar cuando cierra la oferta */
  var PROMO=p.promo||null, cierra=PROMO?String(p.venceOferta||PROMO.hasta||"").slice(0,10):"";
  if(cierra && (!vence || cierra<vence)) vence=cierra;
  var vencePromo=!!(cierra && vence===cierra);

  var atencion = p.contacto ? (p.contacto + (p.cargo ? " · "+p.cargo : "")) : "";

  /* Una recolección de una sola vez no es un servicio recurrente, y la
     propuesta no debe leerse como si lo fuera: no hay frecuencia, no hay kg
     incluidos en un plan, y "total por visita" no significa nada cuando la
     visita es una. El servidor ya dice cuál de las dos es. */
  var UNICA = !!p.visitaUnica;
  /* api 3.11: gran generador — una tabla por grupo de sedes y el total mensual */
  var GRAN = !!(p.gran && p.cuenta);
  var TX = textosDe(p, UNICA);

  var html =
  DOCE.membrete({ empresa: emp(),
    derecha: '<small>Propuesta N°</small><b>'+esc(p.codigoPropuesta)+'</b><span>Panamá, '+esc(larga(fProp))+'</span>' })+

  '<div class="dest">'+
    '<div class="se">Señores</div>'+
    '<div class="nom">'+esc(p.empresa||"")+'</div>'+
    '<div class="li">E. S. D.'+(atencion?' · Atención: '+esc(atencion):'')+'</div>'+
  '</div>'+

  parrafos(TX.saludo)+

  '<div class="sec">Propuesta operativa</div>'+
  parrafos(TX.operativa)+
  (UNICA
    ? (p.descripcionTrabajo
        ? '<p><b>Trabajo a realizar:</b> '+esc(p.descripcionTrabajo)+'</p>' : '')+
      (p.cantidadEstimada
        ? '<p><b>Cantidad estimada:</b> '+esc(p.cantidadEstimada)+'</p>' : '')+
      (p.fechaTentativa
        ? '<p><b>Fecha tentativa:</b> '+esc(larga(p.fechaTentativa))+'</p>' : '')
    : '')+

  '<div class="sec">Nuestro servicio incluye</div>'+
  '<ul>'+
    TX.incluye.filter(function(t){ return String(t||"").trim(); }).map(function(t){ return '<li>'+enLinea(t)+'</li>'; }).join('')+
  '</ul>'+

  '<div class="sec">Propuesta económica</div>'+
  '<p>De acuerdo con el volumen de desechos a entregar, nuestra propuesta económica es la siguiente:</p>'+
  (GRAN ? tablaGran(p.cuenta) : UNICA
    ? '<table><thead><tr><th>Concepto</th><th>Cantidad estimada</th><th>Precio</th>'+
        '<th>ITBMS</th><th>Total</th></tr></thead><tbody>'+
        '<tr><td>'+esc(p.descripcionTrabajo||"Recolección única")+'</td>'+
          '<td class="n">'+esc(p.cantidadEstimada||"—")+'</td>'+
          '<td class="n">B/. '+n2(costo)+'</td><td class="n">B/. '+n2(imp)+'</td>'+
          '<td class="n"><b>B/. '+n2(total)+'</b></td></tr>'+
        '<tr class="tot"><td colspan="4">TOTAL DEL SERVICIO</td>'+
          '<td class="n">B/. '+n2(total)+'</td></tr>'+
      '</tbody></table>'+
      '<div class="pie-tabla">El precio cubre únicamente el trabajo aquí descrito. '+
      'Precios en balboas (B/.), ITBMS incluido.</div>'
    : '<table><thead><tr><th>Frecuencia</th><th>Kg incluidos</th><th>Precio por visita</th>'+
        '<th>ITBMS</th><th>Total</th></tr></thead><tbody>'+
        '<tr><td>'+esc(p.frecuencia||"—")+'</td><td class="n">'+(kg||"—")+'</td>'+
          '<td class="n">B/. '+n2(costo)+'</td><td class="n">B/. '+n2(imp)+'</td>'+
          '<td class="n"><b>B/. '+n2(total)+'</b></td></tr>'+
        '<tr class="tot"><td colspan="4">TOTAL POR VISITA</td><td class="n">B/. '+n2(total)+'</td></tr>'+
      '</tbody></table>'+
      '<div class="pie-tabla">El precio por visita incluye la recolección de hasta los kilogramos '+
      'indicados; el excedente se factura según la tarifa de kilogramo adicional. Precios en balboas '+
      '(B/.), ITBMS incluido.'+(PROMO?' Esta propuesta incluye la promoción «'+esc(PROMO.nombre||'')+'»: vea sus beneficios en la nota importante.':'')+'</div>')+

  /* Las notas las arma el servidor según el tipo de servicio, y si Katherine
     las editó para este cliente, manda lo que ella guardó. Antes vivían aquí
     escritas a mano y afirmaban un contrato a 12 meses incluso en las
     recolecciones de una sola visita. */
  (!GRAN && p.servicios && p.servicios.lista && p.servicios.lista.length ? tablaServicios(p.servicios, UNICA, PROMO) : '')+
  '<div class="sec">Nota importante</div>'+
  '<ul class="notas">'+
    notasHtml(p, vence, vencePromo)+
  '</ul>'+

  '<div class="sec">Próximos pasos</div>'+
  parrafos(TX.pasos)+

  '<div class="firma"><p>Atentamente,</p>'+
    '<div class="lin"><b>'+esc(p.asesor||(DATOS.usuario||{}).nombre||"")+'</b>Coord. Comercial · ECOVSA</div>'+
  '</div>'+

  '<div class="pie">'+esc(pieEmpresa())+' · '+esc(emp().instagram)+
    (emp().formulario?'<br>'+esc(emp().formulario):'')+'</div>';

  $("hoja").innerHTML=html;
  document.title="Propuesta "+p.codigoPropuesta+" · "+(p.empresa||"");
  if(!CLIENTE) pintarEnvios(p);
}

/* api 3.12 · servicios y productos de una propuesta de un solo punto */
function tablaServicios(S, UNICA, PROMO){
  var durP=PROMO?Number(PROMO.duracionMeses!=null?PROMO.duracionMeses:PROMO.meses)||0:0;
  var hayRep=false;
  return '<div class="sec" style="font-size:12.5px;margin-top:14px">Servicios y productos</div>'+
    '<table><thead><tr><th>Concepto</th><th>Cantidad</th><th>Precio</th><th>'+(UNICA?'Total':'Al mes')+'</th></tr></thead><tbody>'+
    S.lista.map(function(v){
      /* api 3.13: lo de la promoción va «Sin costo» (sin tachar precio); lo que se da cada 2, 3 o 6 meses se cobra repartido al mes */
      /* forma del servicio: modo 'incluido'|'cobrado', cada + meses (1|2|3|6), total ya repartido al mes; lo gratis de la promoción = incluido + dePromo */
      var promo=v.dePromo===true||v.modo==='promo', mc=Number(v.meses)>1?Number(v.meses):(MESES_CADA[v.cada]||0);
      if(mc) hayRep=hayRep||v.modo==='cobrado';
      var cant=v.cantidad==='solicitud'?'Por solicitud':v.cantidad+(UNICA?'':(v.cada==='visita'?' por visita':mc?' cada '+mc+' meses':' al mes'))+(promo&&durP?', primeros '+durP+(durP===1?' mes':' meses'):'');
      var alMes=v.modo==='cobrado'?(v.total!=null&&v.total!==''?Number(v.total):(Number(v.precio)||0)*(Number(v.cantidad)||1)/(mc||1)):0;
      var precio=promo?'Sin costo':v.modo==='cobrado'?'B/. '+n2(v.precio)+(mc?' c/u':''):'Incluido';
      return '<tr><td>'+esc(v.nombre)+'</td><td class="n">'+esc(cant)+'</td><td class="n">'+precio+'</td><td class="n">'+(v.modo==='cobrado'?'B/. '+n2(alMes):'—')+'</td></tr>'; }).join('')+
    (S.total?'<tr class="tot"><td colspan="3">'+(UNICA?'SERVICIOS Y PRODUCTOS':'SERVICIOS Y PRODUCTOS AL MES')+'</td><td class="n">B/. '+n2(S.total)+'</td></tr>':'')+
    '</tbody></table>'+
    '<div class="pie-tabla">'+(S.total?'Lo cobrado se factura aparte'+(UNICA?' junto con el servicio':' cada mes, más ITBMS')+'. ':'')+(hayRep&&!UNICA?'Lo que se da cada 2, 3 o 6 meses se cobra repartido en cada mes. ':'')+'Lo incluido va sin costo adicional.</div>';
}
/* api 3.11 · la propuesta de una cuenta con varias sedes */
function frecDe(v){ v=Number(v)||0; return v>=8?'2 veces por semana':v>=4?'Semanal':v>=2?'Quincenal':v>=1?'Mensual':v>=0.5?'Bimestral':'Trimestral'; }
function tablaGran(c){
  var FAC={consolidada:'una sola factura mensual para toda la cuenta, con el detalle de cada sede',sede:'una factura mensual por sede',grupo:'una factura mensual por grupo de sedes'};
  var h='';
  (c.grupos||[]).forEach(function(g,gi){
    var abrir=[];
    h+='<div class="sec" style="font-size:12.5px;margin-top:14px">'+(c.grupos.length>1?'Grupo '+(gi+1)+' · ':'')+esc(g.nombre)+'</div>'+
      '<table><thead><tr><th>Sede</th><th>Frecuencia</th><th>Visitas al mes</th><th>Inicio</th></tr></thead><tbody>'+
      g.sedes.map(function(s){ var ab=/abrir/i.test(s.desde||''); if(ab) abrir.push(s.nombre);
        return '<tr><td>'+esc(s.nombre)+(ab?' *':'')+'</td><td>'+(g.aSolicitud?'A solicitud':frecDe(s.visitas))+'</td><td class="n">'+(g.aSolicitud?'—':s.visitas)+'</td><td>'+esc(ab?'Al abrir':(/^\d{4}-\d{2}-\d{2}$/.test(s.desde||'')?larga(s.desde):'Al firmar'))+'</td></tr>'; }).join('')+
      '</tbody></table>'+
      '<table style="margin-top:6px"><thead><tr><th>Concepto</th><th>Cantidad</th><th>Al mes</th></tr></thead><tbody>'+
      '<tr><td>Recolección, transporte, tratamiento y disposición final'+(g.aSolicitud?' (a solicitud)':'')+'</td><td class="n">'+(g.aSolicitud?'—':Math.round(g.visitas*100)/100+' visitas · hasta '+Math.round(g.kgIncluidos)+' kg')+'</td><td class="n">B/. '+n2(g.recoleccion)+'</td></tr>'+
      (g.servicios||[]).map(function(v){ var cant=v.cantidad==='solicitud'?'Por solicitud':v.cantidad+' '+(v.cada==='visita'?'por visita':'al mes')+' por sede';
        return '<tr><td>'+esc(v.nombre)+'</td><td class="n">'+esc(cant)+'</td><td class="n">'+(v.modo==='cobrado'&&v.total?'B/. '+n2(v.total):'Incluido')+'</td></tr>'; }).join('')+
      '<tr class="tot"><td colspan="2">SUBTOTAL '+(c.grupos.length>1?'DEL GRUPO':'MENSUAL')+'</td><td class="n">B/. '+n2(g.total)+'</td></tr></tbody></table>'+
      (abrir.length?'<div class="pie-tabla">* '+esc(abrir.join(', '))+': se factura desde su apertura.</div>':'');
  });
  h+='<table style="margin-top:12px"><tbody>'+
    '<tr><td>Subtotal mensual · '+c.sedes+' sede'+(c.sedes===1?'':'s')+'</td><td class="n">B/. '+n2(c.subtotal)+'</td></tr>'+
    '<tr><td>ITBMS 7 %</td><td class="n">B/. '+n2(c.itbms)+'</td></tr>'+
    '<tr class="tot"><td>TOTAL MENSUAL</td><td class="n">B/. '+n2(c.total)+'</td></tr></tbody></table>'+
    '<div class="pie-tabla">Facturación: '+esc(FAC[c.facturacion]||FAC.consolidada)+'. El precio de recolección incluye hasta los kilogramos indicados por grupo; el excedente se factura a B/. '+n2(c.kgAdicional)+' el kilogramo. Precios en balboas (B/.).'+(c.plazo?' Contrato de '+c.plazo+' meses.':'')+'</div>';
  return h;
}

/* ═══ ENVIAR LA PROPUESTA ═══════════════════════════════════════════
   Dos caminos, y ninguno manda nada solo: los dos abren la ventana con
   el mensaje ya escrito para que la persona lo lea y le dé enviar.

   Ninguno de los dos puede adjuntar un archivo —ni Outlook por enlace ni
   WhatsApp— y la propuesta no tiene enlace que el cliente pueda abrir:
   esta página pide PIN. Así que el PDF lo adjunta quien envía, y por eso
   antes de abrir sale el aviso. Sin él, el correo promete un adjunto que
   no está y el cliente se queda esperando.

   Nada de esto sale impreso: la barra tiene display:none en @media print,
   así que el papel de la propuesta queda exactamente igual.            */

/* ¿Este número sirve para WhatsApp?

   En Panamá el celular tiene OCHO dígitos y empieza en 6; el fijo tiene
   SIETE. Un fijo no tiene WhatsApp, y mandarlo igual abre wa.me/3021188
   —un chat que no existe— sin decir por qué. Por eso aquí no se acepta
   cualquier cosa: o es un celular panameño, o ya viene con el 507 y sus
   ocho dígitos detrás, o no hay botón. Un botón que no funciona es peor
   que no tenerlo, porque el que lo aprieta cree que mandó algo.         */
function waNumero_(v){
  var n=String(v||"").replace(/[^0-9]/g,"");
  if(/^6\d{7}$/.test(n))      return "507"+n;   // celular, como lo escribe mercadeo
  if(/^5076\d{7}$/.test(n))   return n;         // ya trae el país
  return "";
}

/* Se prueba el celular y, si no sirve, el teléfono: a veces el celular
   se escribe en la casilla equivocada. Gana el primero que sea válido. */
function telProspecto_(p){
  return waNumero_(p.celular) || waNumero_(p.telefono) || "";
}

/* 50767123456 no se lee: se cuenta con el dedo. En el botón va como lo
   escribe cualquiera —6712-3456— y en el enlace va el largo. */
function telBonito_(n){
  var s=String(n||"").replace(/^507/,"");
  return s.length===8 ? s.slice(0,4)+"-"+s.slice(4) : s;
}

function pintarEnvios(p){
  var E=$("envios"); if(!E) return;
  var tel=telProspecto_(p), correo=String(p.correo||"").trim();

  /* Un botón que abre una ventana en blanco es peor que no tenerlo: el
     que falta se dice, con el dato que falta y dónde se agrega. */
  if(!correo && !tel){
    E.innerHTML='<button onclick="pasoPrevio(\'nada\')">Sin correo ni celular</button>';
    return;
  }
  E.innerHTML =
    (correo ? '<button onclick="pasoPrevio(\'outlook\')">✉️ Outlook · '+esc(correo)+'</button>' : '')+
    (tel    ? '<button class="wa" onclick="pasoPrevio(\'whatsapp\')">📱 WhatsApp · '+esc(telBonito_(tel))+'</button>' : '');
}

function cerrarPaso(){ var P=$("pre"); if(P){ P.style.display="none"; P.innerHTML=""; } }

function pasoPrevio(canal){
  var P=$("pre"); if(!P) return;
  if(canal==="nada"){
    P.innerHTML='<h5>Este prospecto no tiene por dónde recibirla</h5>'+
      '<p style="margin:0 0 11px">No tiene correo ni celular en su ficha. '+
      'Agrégaselo en mercadeo y vuelve a abrir la propuesta. '+
      'Mientras tanto puedes imprimirla o guardarla en PDF.</p>'+
      '<div class="bs"><button class="no" onclick="cerrarPaso()">Entendido</button></div>';
    P.style.display="block";
    return;
  }
  var esWa = canal==="whatsapp";
  P.innerHTML='<h5>Antes de abrir '+(esWa?"WhatsApp":"Outlook")+'</h5>'+
    '<ol><li>Guarda la propuesta con <b>Imprimir / Guardar PDF</b>.</li>'+
    '<li>Aquí se abre '+(esWa?"el chat":"el correo")+' con el mensaje ya escrito.</li>'+
    '<li><b>Adjunta el PDF</b>, revisa el texto y envía.</li></ol>'+
    '<p style="margin:0 0 11px;color:#8A5A00"><b>El archivo lo adjuntas tú.</b> '+
    'El mensaje dice que la propuesta va adjunta, y eso solo es cierto si la pones.</p>'+
    '<div class="bs">'+
      '<button class="ok" onclick="enviarPor(\''+canal+'\')">Ya la tengo · abrir '+
        (esWa?"WhatsApp":"Outlook")+'</button>'+
      '<button class="no" onclick="cerrarPaso()">Cancelar</button>'+
    '</div>';
  P.style.display="block";
}

/* Al correo se le escribe distinto que al WhatsApp. El mismo párrafo
   formal en un chat se lee como un copiar y pegar. */
function textoCorreo(p){
  return "Estimados señores "+(p.empresa||"")+":\n\n"+
    "Adjunto encontrará nuestra propuesta de servicio para el manejo integral de desechos "+
    "hospitalarios peligrosos.\n\nQuedamos atentos a sus comentarios.\n\n"+
    (p.asesor||"")+"\nCoord. Comercial · ECOVSA\nTel. 310-2268 · info@ecovsa.com";
}
function textoWhatsapp(p){
  return "Buen día"+(p.contacto ? " "+p.contacto : "")+", le saludamos de ECOVSA.\n\n"+
    "Le comparto nuestra propuesta de servicio "+(p.codigoPropuesta||"")+
    " para el manejo de desechos hospitalarios peligrosos de "+(p.empresa||"su institución")+
    ". Se la envío en este mismo chat.\n\n"+
    "Quedo atenta a sus comentarios.\n\n"+
    (p.asesor||"")+" · ECOVSA\nTel. 310-2268";
}

function enviarPor(canal){
  var p=DATOS.prospecto;
  cerrarPaso();

  if(canal==="whatsapp"){
    window.open("https://wa.me/"+telProspecto_(p)+
      "?text="+encodeURIComponent(textoWhatsapp(p)),"_blank");
    return;
  }

  /* Outlook.com por enlace directo, no mailto: mailto abre el cliente de
     correo que cada máquina tenga por defecto, y por eso a unos les abría
     Outlook y a otros no. Esto abre siempre el mismo. */
  window.open("https://outlook.live.com/mail/0/deeplink/compose"+
    "?to="+encodeURIComponent(String(p.correo||"").trim())+
    "&subject="+encodeURIComponent("Propuesta de servicio "+p.codigoPropuesta+" · ECOVSA")+
    "&body="+encodeURIComponent(textoCorreo(p)),"_blank");
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",arrancar);
else arrancar();
</script>
