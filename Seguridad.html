/* ── Seguridad · seguridad y salud en el trabajo (ISO 45001) · api 3.32 ──

   más expedientes, peligros, requisitos legales, incidentes, acciones, auditorías, simulacros, consultas, capacitación, contratistas y equipos.

   api 3.14: nace apagado (Configuración › Encender y apagar).

<script>
/* Qué va en cada sección todavía por construir (de la maqueta aprobada, DISENO_calidad.md) */
var SECC = {
  frm:  ['Formularios', 'documento', 'Todos los formularios en un solo lugar. Los que ya viven en otro módulo abren su pantalla; los de calidad se llenan aquí.'],
  nc:   ['No conformidades', 'alerta', 'Reportar algo que salió mal, buscar la causa (5 porqués), corregir y verificar que no se repita (F-CAL-05).'],
  rie:  ['Riesgos y oportunidades', 'escudo', 'Qué puede salir mal y qué podemos aprovechar, con su plan y su dueño (F-CAL-08).'],
  aud:  ['Auditorías', 'check', 'Programa anual de auditorías internas y del organismo certificador, con sus hallazgos (F-CAL-06).'],
  obj:  ['Objetivos e indicadores', 'tendencia', 'Los objetivos de la calidad (DG-CAL-03) medidos con lo que el sistema ya registra.'],
  rev:  ['Revisión por la dirección', 'brujula', 'Las entradas que pide la norma, listas para el acta de Gerencia (F-CAL-07).'],
  cap:  ['Capacitación', 'personas', 'Quién está preparado para qué y cuándo se le capacitó (F-ADM-06).'],
  prov: ['Proveedores', 'carrito', 'Evaluación anual de los proveedores que afectan el servicio (F-ADM-07).'],
  equ:  ['Equipos de medición', 'balanza', 'Calibración de báscula, autoclave e incubadora, con aviso antes de vencer (F-PLA-08).']
};
function pSec(id) {
  var x = SECC[id] || SECC.frm;
  return MK.cabeza(x[0], x[2]) +
    '<div class="card"><div class="obra-c"><div class="ic2">' + MK.ic(x[1], 22) + '</div><div><b>Por construir.</b>' +
    '<p>Esta sección está en la maqueta aprobada y se construye en su propio paquete. Aquí no se guarda nada todavía.</p></div></div></div>';
}

/* ═══ api 3.24 · piezas comunes ═══ */
var CAL_EST = { vigente: ['Vigente', 'ok'], sistema: ['En el sistema', 'ok'], externo: ['Externo', 'info'], por_aprobar: ['Por aprobar', 'warn'],
  borrador: ['En borrador', 'gris'], falta: ['Falta', 'bad'], obsoleto: ['Obsoleto', 'gris'] };
var CAL_AREAS = { VEN: 'Mercadeo', LOG: 'Logística', PLA: 'Planta', ADM: 'Administración', CAL: 'Gerencia y calidad', SST: 'Seguridad y salud', EXT: 'Externos' };
var CAL_TIPOS = { PO: 'Política', DG: 'Documento general', PL: 'Plan', PR: 'Procedimiento', IT: 'Instructivo', F: 'Formulario o registro', DE: 'Documento externo' };
var CAL_LISTO = { vigente: 1, sistema: 1, externo: 1 };
var MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function C() { return (MK.base && MK.base.cal) || {}; }
function PU() { return C().puede || {}; }
function estTag(e) { var x = CAL_EST[e] || [e, 'gris']; return MK.tag(x[0], x[1]); }
function mesTx(ym) { return /^\d{4}-\d{2}$/.test(ym || '') ? MES_C[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4) : ''; }
function rango(a, b) {
  if (!a) return '';
  if (!b || a === b) return mesTx(a);
  if (a.slice(0, 4) === b.slice(0, 4)) return MES_C[Number(a.slice(5, 7)) - 1] + '–' + mesTx(b);
  return mesTx(a) + ' – ' + mesTx(b);
}
function js(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
/* Algo cambió: se vuelve a pedir la base (Inicio) y el listado */
function calRecargar() { DOCS = null; return MK.recargar(); }
/* Abrir un archivo firmado: la pestaña se abre antes de pedirlo (si no, el navegador la bloquea) */
function calAbrir(codigo, clase, versionId) {

var SV = null;

  SV = { grupos: [] };
  MK.hoja('<h2>Subir varios</h2><p class="muted" style="margin-top:4px">Elija los PDF y los Word o Excel juntos. Cada archivo va a su documento por el código al principio del nombre (por ejemplo <b>PO-SST-01_Politica.docx</b>).</p>' +
    '<label class="lb">Archivos</label><input class="in" type="file" id="sv-m" multiple accept=".pdf,.docx,.xlsx,.doc,.xls" onchange="calSvLeer(this.files)">' +
    '<div id="sv-l"></div><div id="sv-pr" class="small muted" style="margin-top:10px"></div>' +
    '<div class="pie"><button class="btn" id="sv-x" onclick="MK.cerrarHoja()">Cerrar</button><button class="btn pri" id="sv-ok" onclick="calSvSubir()" disabled>Subir</button></div>', { ancha: true, fija: true });
}
function calSvLeer(files) {
  var porCod = {}, sobran = [], mapa = {};

  Array.prototype.forEach.call(files || [], function (f) {
    var m = /^((?:PO|DG|PL|PR|IT|F)-(?:VEN|LOG|PLA|ADM|CAL|SST)-\d{2}|DE-\d{2})(?![0-9])/i.exec(String(f.name).trim());
    var cl = calClase(f);
    if (!m || !cl) { sobran.push([f.name, !m ? 'el nombre no empieza con un código' : 'no es PDF, Word ni Excel']); return; }
    var c = m[1].toUpperCase();
    if (!mapa[c]) { sobran.push([f.name, c + ' no está en el listado']); return; }
    if (mapa[c].estado === 'obsoleto') { sobran.push([f.name, c + ' está obsoleto']); return; }
    var g = porCod[c] = porCod[c] || { codigo: c, doc: mapa[c] };
    if (g[cl]) { sobran.push([f.name, 'ya hay otro ' + (cl === 'pdf' ? 'PDF' : 'editable') + ' para ' + c]); return; }
    if (f.size > 10 * 1024 * 1024) { sobran.push([f.name, 'pesa más de 10 MB']); return; }
    g[cl] = f;
  });

    var g = porCod[c], e = g.doc.estado;
    g.estado = (e === 'por_aprobar' || e === 'borrador') ? e : (e === 'sistema' || e === 'externo') && g.pdf ? 'vigente' : 'borrador';   /* las muestras del sistema y los externos se publican; lo demás entra como borrador */
    return g;
  });
  var tx = { borrador: 'En borrador', por_aprobar: 'Por aprobar', vigente: 'Vigente' };
  document.getElementById('sv-l').innerHTML = (SV.grupos.length ? '<div class="sv-l">' + SV.grupos.map(function (g, i) {
    return '<div class="f" id="sv-f' + i + '"><span class="cod">' + g.codigo + '</span><span>' + MK.esc(g.doc.nombre) + '<small>' + [g.pdf ? 'PDF' : '', g.editable ? 'editable' : ''].filter(Boolean).join(' + ') + ' · queda: ' + (g.doc.estado === 'sistema' ? 'muestra a la vista de todos' : g.doc.estado === 'externo' ? 'copia a la vista de todos' : tx[g.estado]) + '</small></span><span class="st">' + MK.tag('Listo para subir', 'gris') + '</span></div>';
  }).join('') + '</div>' : '') +
    (sobran.length ? '<div class="aviso am" style="margin-top:10px"><b>' + sobran.length + ' archivo' + (sobran.length === 1 ? '' : 's') + ' no se van a subir:</b><br>' + sobran.map(function (s) { return MK.esc(s[0]) + ' — ' + MK.esc(s[1]); }).join('<br>') + '</div>' : '');
  document.getElementById('sv-ok').disabled = !SV.grupos.length;
  document.getElementById('sv-ok').textContent = SV.grupos.length ? 'Subir ' + SV.grupos.length + ' documento' + (SV.grupos.length === 1 ? '' : 's') : 'Subir';
}
function calSvSubir() {
  var btn = document.getElementById('sv-ok'), pr = document.getElementById('sv-pr'), i = 0, bien = 0, mal = 0;
  MK.ocupado(btn, true, 'Subiendo…'); document.getElementById('sv-m').disabled = true;
  var marca = function (k, t, tono) { var f = document.getElementById('sv-f' + k); if (f) f.querySelector('.st').innerHTML = MK.tag(t, tono); };
  var sig = function () {
    if (i >= SV.grupos.length) {
      pr.textContent = bien + ' subido' + (bien === 1 ? '' : 's') + (mal ? ' · ' + mal + ' con problema (vea la lista)' : '') + '.';
      btn.textContent = 'Listo'; document.getElementById('sv-x').textContent = 'Cerrar'; calRecargar(); return;
    }
    var k = i++, g = SV.grupos[k];
    marca(k, 'Subiendo…', 'info');
    calSubirArchivos(g.codigo, g.pdf, g.editable, g.estado, 'Carga de archivos', function (t) { pr.textContent = (k + 1) + ' de ' + SV.grupos.length + ' · ' + t; })
      .then(function () { bien++; marca(k, 'Subido', 'ok'); }, function (e) { mal++; marca(k, 'No: ' + (e.message || 'error').slice(0, 60), 'bad'); }).then(sig);
  };
  sig();
}

function mjCache(clave) { var s = SEG.cache[clave]; return s && s.listo ? s.valor : null; }
function mjUsuario() { var u = MK.usuario; return (u && typeof u === 'object' ? (u.nombre || '') : String(u || '')); }
function mjMesCorto(iso) { var m = /^(\d{4})-(\d{2})/.exec(iso || ''); return m ? SEG.MES[Number(m[2]) - 1].charAt(0).toUpperCase() + SEG.MES[Number(m[2]) - 1].slice(1) + ' ' + m[1] : ''; }
function mjDiaMes(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? Number(m[3]) + ' ' + SEG.MES[Number(m[2]) - 1] : ''; }

/* Pide algo una sola vez y lo guarda en el mismo lugar que SEG.dato; devuelve una promesa */
function mjQuiero(clave, pedir) {
  var v = mjCache(clave);
  if (v) return Promise.resolve(v);
  return pedir().then(function (r) {
    if (r && r.ok === false) throw new Error(r.error || 'No se pudo abrir.');
    SEG.cache[clave] = { listo: true, valor: r };
    return r;
  });
}
function mjPedirInc() { return mjQuiero('inc', function () { return MK.p('api_segIncidentes'); }); }
function mjPedirAcc() { return mjQuiero('acc', function () { return MK.p('api_segAcciones'); }); }
function mjPedirLista(tipo) { return mjQuiero('l:' + tipo, function () { return MK.p('api_segLista', tipo); }); }
function mjConInc(id, fn) { mjPedirInc().then(function (D) { var r = mjBuscar(D, id); if (r) fn(r); else MK.aviso('No encontré ese reporte.'); }, mjErrCarga); }
function mjConAcc(id, fn) { mjPedirAcc().then(function (D) { var r = mjBuscar(D, id); if (r) fn(r); else MK.aviso('No encontré esa acción.'); }, mjErrCarga); }
function mjConLista(tipo, id, fn) { mjPedirLista(tipo).then(function (D) { var r = mjBuscar(D, id); if (r) fn(r); else MK.aviso('No encontré ese registro.'); }, mjErrCarga); }
function mjBuscar(D, id) { return ((D && D.items) || []).filter(function (x) { return x.id === id; })[0]; }
/* Las personas activas de Expedientes («Nombre · puesto»); sin permiso o sin nadie cargado queda la lista vacía */
function mjPersonas() {
  return mjQuiero('mj:exp', function () { return MK.p('api_segExpedientes'); }).then(function (d) {
    return (d.personas || []).filter(function (p) { return p.est === 'activo'; }).map(function (p) { return p.n + (p.p ? ' · ' + p.p : ''); });
  }, function () { return []; });
}
function mjPartHtml(lista, marcados) {
  marcados = marcados || [];
  marcados.forEach(function (x) { if (lista.indexOf(x) < 0) lista = lista.concat([x]); });
  if (!lista.length) return '<textarea class="in" rows="2" id="mj-part" placeholder="Nombres, separados por coma"></textarea>';
  return '<div id="mj-part">' + lista.map(function (x) { return '<label class="chk"><input type="checkbox" value="' + MK.esc(x) + '"' + (marcados.indexOf(x) >= 0 ? ' checked' : '') + '><span>' + MK.esc(x) + '</span></label>'; }).join('') + '</div>';
}
function mjPartLeer() {
  var el = document.getElementById('mj-part'); if (!el) return [];
  if (el.tagName === 'TEXTAREA') return el.value.split(/[,\n]/).map(function (x) { return x.trim(); }).filter(Boolean);
  return Array.prototype.map.call(el.querySelectorAll('input:checked'), function (i) { return i.value; });
}
/* Archivos que se eligen en una ventana y se suben al guardar (cuando ya existe el registro al que pertenecen) */
function mjElegirArch(clase, aceptar) {
  SEG.elegir(function (f) { MJ.p.push([clase, f]); mjPintarArch(); }, aceptar);
}
function mjQuitarArch(i) { MJ.p.splice(i, 1); mjPintarArch(); }
function mjPintarArch() {
  var el = document.getElementById('mj-arch'); if (!el) return;
  el.innerHTML = MJ.p.map(function (z, i) { return '<span>' + MK.esc(z[1].name) + ' · <a href="#" onclick="mjQuitarArch(' + i + ');return false">quitar</a></span>'; }).join('');
}
function mjSubirPend(ref) {                                                    // → promesa con cuántos fallaron
  var fallas = 0, p = Promise.resolve();
  MJ.p.forEach(function (z) { p = p.then(function () { return SEG.subir(ref, z[0], z[1]).catch(function () { fallas++; }); }); });
  return p.then(function () { MJ.p = []; return fallas; });
}
function mjArchivos(ref, clase) {
  if (!mjVeArch()) return Promise.resolve([]);
  return MK.p('api_segArchivos', ref).then(function (x) { return x && x.ok ? (x.archivos || []).filter(function (a) { return !clase || a.clase === clase; }) : []; }, function () { return []; });
}
/* El formato en blanco (Word) de un código del listado; si no está cargado, avisa */
function mjBlanco(codigo, btn) {
  MK.ocupado(btn, true, 'Preparando…');
  MK.p('api_segDoc', codigo).then(function (r) {
    MK.ocupado(btn, false);
    if (r && r.ok && r.doc && r.doc.hayEditable) { calBajar(codigo, 'editable'); return; }
    MK.aviso('Todavía no está cargado el Word de ' + codigo + ': lo sube Álvaro en Documentos');
  }, function (e) { MK.ocupado(btn, false); MK.aviso((e && e.message) || 'Sin conexión'); });
}
/* Cada punto de una lista pasa a ser una acción de mejora; devuelve una promesa con los números de acción, en el mismo orden */
function mjCrearAcciones(lineas, origen, fecha) {
  var ids = [], p = Promise.resolve();
  lineas.forEach(function (q) {
    p = p.then(function () {
      return SEG.guardar('accion', { q: q, o: origen, j: 'A', r: MJ_RESP[0], f: MK.masDias(fecha || SEG.hoy(), 30), e: 'pend' }).then(function (r) { ids.push(r.id); });
    });
  });
  return p.then(function () { return ids; });
}

/* ═══════════════════ Incidentes y casi accidentes (ISO 45001 10.2) ═══════════════════ */
function incPasos(n) {
  return '<div class="sg-pasos">' + INC_PASOS.map(function (p, i) { return '<span class="' + (i < n || n === 4 ? 'ok' : i === n ? 'ya' : '') + '"><i></i>' + p + '</span>'; }).join('') + '</div>';
}
function incTipo(r) { return r.t === 'ca' ? MK.tag('Casi accidente', 'warn') : MK.tag('Incidente', 'bad'); }
function mjIncDonde(r) { return [r.a, r.d].filter(Boolean).map(function (x) { return MK.esc(x); }).join(' · '); }
function pInc() {
  var cab = 'Incidentes y casi accidentes', sub = 'Lo que pasó y lo que estuvo a punto de pasar, investigado hasta su causa como una no conformidad de Calidad';
  var der = '<button class="btn" onclick="MK.aviso(\'El incidente lo reporta el conductor desde su celular, como hoy (F-LOG-03).\')">' + MK.ic('alerta', 15) + ' Reportar incidente</button><button class="btn pri" onclick="sgCasi()">' + MK.ic('mas', 15) + ' Reportar casi accidente</button>';
  var D = SEG.dato('inc', function () { return MK.p('api_segIncidentes'); }, 'inc');
  if (!D) return SEG.espera('inc', cab, sub, der);
  var I = D.items || [], mes = SEG.hoy().slice(0, 7), nm = SEG.mesNombre(mes);
  var ca = I.filter(function (r) { return r.t === 'ca'; }).length, abi = I.filter(function (r) { return r.paso < 4; }).length;
  var caMes = I.filter(function (r) { return r.t === 'ca' && String(r.fecha).slice(0, 7) === mes; }).length;
  var incMes = I.filter(function (r) { return r.t === 'inc' && String(r.fecha).slice(0, 7) === mes; }).length;
  var cerMes = I.filter(function (r) { return r.paso === 4 && String(r.cerradoEn || r.fecha).slice(0, 7) === mes; }).length;
  var L = I.filter(function (r) { return FINC === 't' || r.t === FINC || (FINC === 'abi' && r.paso < 4) || (FINC === 'cer' && r.paso === 4); });
  var h = MK.cabeza(cab, sub, der);
  h += '<div class="pila">' + MK.kpis([
    { e: 'Casi accidentes reportados', v: caMes, s: nm + ' · lo que casi pasa', c: caMes ? 'warn' : '' },
    { e: 'Incidentes', v: incMes, s: nm + ' · F-LOG-03' },
    { e: 'Abiertos', v: abi, s: 'en causa, acción o verificación', c: abi ? 'warn' : 'ok' },
    { e: 'Cerrados', v: cerMes, s: nm + ' · con la acción verificada', c: 'ok' }], 4);
  h += '<div class="card" id="sg-inc-tabla"><div class="filtros">' + MK.chips([['t', 'Todos', I.length], ['ca', 'Casi accidentes', ca], ['inc', 'Incidentes', I.length - ca], ['abi', 'Abiertos', abi], ['cer', 'Cerrados', I.length - abi]], FINC, 'sgFinc') + '</div>';
  h += MK.tabla(['Reporte', 'Qué pasó', 'Pudo causar', 'Avance', 'Responsable'], L.map(function (r) {
    return ['<span class="cod">' + MK.esc(r.id) + '</span><small>' + MK.esc(SEG.fh(r.fecha, r.hora)) + '</small>' + incTipo(r),
      '<b>' + MK.esc(r.q) + '</b><small>' + mjIncDonde(r) + '</small>',
      MK.esc(r.pot || '—') + (r.g ? '<small>Gravedad posible: ' + INC_G[r.g].toLowerCase() + '</small>' : ''),
      incPasos(r.paso), MK.esc(r.resp || '—')];
  }), { cls: 'sg-inc', clic: function (j) { return mjC('sgInc', L[j].id); },
    vacio: I.length ? 'Nada en este filtro.' : 'Todavía no hay reportes. Aquí llegan los reportes de incidencia de Logística (F-LOG-03) y los casi accidentes que reporte cualquier persona.' });
  h += '<div class="nota">Un casi accidente no deja lesión, pero avisa dónde está el peligro: se investiga igual que un incidente. Reportar no trae castigo; lo que se busca es la causa, no el culpable. Toque un reporte para ver su investigación.</div></div>';
  return h + '</div>';
}
function sgFinc(v) { FINC = v; MK.repintar(); }

function sgInc(id) {
  mjPedirInc().then(function (D) {
    var r = mjBuscar(D, id); if (!r) { MK.aviso('No encontré ese reporte.'); return; }
    var cerrado = r.t === 'inc' && r.paso === 4 && !(r.why || []).length && !(r.acc || []).length;       // lo cerró Logística por su lado
    Promise.all([
      cerrado ? MK.p('api_verIncidencia', r.id).then(function (x) { return x && x.ok ? x : null; }, function () { return null; }) : Promise.resolve(null),
      r.t === 'ca' ? mjArchivos(r.id, 'foto') : Promise.resolve([])
    ]).then(function (z) { mjIncFicha(r, z[0], z[1]); });
  }, mjErrCarga);
}
function mjAccTag(e, f) {
  if (e === 'cerr' || e === 'hecha') return MK.tag('Hecha', 'ok');
  if (f && f < SEG.hoy()) return MK.tag('Vencida', 'bad');
  return MK.tag('En curso', 'warn');
}
function mjIncFicha(r, log, fotos) {
  var P = mjPuede(), why = r.why || [], acc = r.acc || [];
  var h = '<h2>' + MK.esc(r.q) + '</h2><div class="sub">' + MK.esc(r.id) + ' · ' + MK.esc(SEG.fh(r.fecha, r.hora)) + (mjIncDonde(r) ? ' · ' + mjIncDonde(r) : '') + '</div>';
  h += '<div style="margin:4px 0 14px">' + incTipo(r) + ' ' + (r.pot ? MK.tag('Pudo causar: ' + r.pot.toLowerCase(), 'gris') : '') + '</div>' + incPasos(r.paso);
  h += '<div class="card" style="margin-top:14px"><h3>Reportado</h3><div class="it2"><div class="tx"><b>Lo reportó</b><small>' + MK.esc(r.por || '—') + ' · ' + MK.esc(SEG.fh(r.fecha, r.hora)) + '</small></div>' + MK.tag('Hecho', 'ok') + '</div>' + SEG.archivosHtml(fotos) + '</div>';
  /* Causa */
  h += '<div class="card" style="margin-top:12px"><h3>Causa · los porqués</h3>';
  if (why.length) h += why.map(function (w, i) { return '<div class="it2"><div class="tx"><b>' + (i + 1) + '.° ¿Por qué?</b><small>' + MK.esc(w) + '</small></div></div>'; }).join('');
  else if (log && log.causa) h += '<div class="it2"><div class="tx"><b>Causa anotada en Logística</b><small>' + MK.esc(log.causa) + '</small></div></div>';
  else h += '<div class="it2"><div class="tx"><small>Se busca la causa con quien lo reportó.</small></div>' + (r.paso === 0 ? MK.tag('Siguiente', 'info') : '') + '</div>';
  h += '</div>';
  /* Acción */
  h += '<div class="card" style="margin-top:12px"><h3>Acción</h3>';
  if (acc.length) h += acc.map(function (a) {
    return '<div class="it2"><div class="tx"><b><span class="sg-j sg-j' + MK.esc(a[0]) + '">' + MK.esc(a[0]) + '</span> ' + MK.esc(a[1]) + '</b><small>' + MK.esc([a[2], a[3] ? SEG.f(a[3]) : '', a[4]].filter(Boolean).join(' · ')) + '</small></div>' + mjAccTag(a[5], a[3]) + '</div>';
  }).join('');
  else if (log && log.accion) h += '<div class="it2"><div class="tx"><b>Acción anotada en Logística</b><small>' + MK.esc(log.accion) + '</small></div>' + MK.tag('Hecha', 'ok') + '</div>';
  else h += '<div class="it2"><div class="tx"><small>Sale de la causa. Se escoge en el orden de siempre: eliminar, sustituir, ingeniería, administrativo y EPP.</small></div></div>';
  h += '</div>';
  /* Verificación y cierre */
  var ver = r.ver || (log && log.verificar) || '', mat = r.mat || (log && log.prevencion) || '';
  var baja = r.baja === 'si' ? 'Con baja' + (r.dias ? ' · ' + mjPl(r.dias, 'día perdido', 'días perdidos') : '') : r.baja === 'no' ? 'Sin baja' : '';
  h += '<div class="card" style="margin-top:12px"><h3>Verificación y cierre</h3><div class="it2"><div class="tx"><small>' + MK.esc(ver || 'Cuando la acción esté hecha, se comprueba que funcionó.') + '</small>' + (mat ? '<small>' + MK.esc(mat) + '</small>' : '') + (baja ? '<small>' + baja + '</small>' : '') + '</div>' + (r.paso === 4 ? MK.tag('Cerrado', 'ok') : r.paso === 3 ? MK.tag('En curso', 'warn') : '') + '</div>' +
    '<div class="it2"><div class="tx"><b>¿Cambia la matriz de peligros?</b><small>Al cerrar se revisa si el peligro ya estaba en la matriz y si sus controles bastan.</small></div><button class="btn sm" onclick="MK.cerrarLado();MK.ir(\'pel\')">' + MK.ic('enlace', 14) + ' Ver la matriz</button></div></div>';
  var sig = P ? ['Anotar la causa', 'Registrar la acción', 'Marcar la acción hecha', 'Verificar y cerrar'][r.paso] : '', fn = ['mjIncCausa', 'mjIncAccion', 'mjIncHecha', 'mjIncCierre'][r.paso];
  h += '<div class="row w" style="margin-top:12px">' + (sig ? '<button class="btn pri" onclick="' + mjC(fn, r.id) + '">' + MK.ic('check', 15) + ' ' + sig + '</button>' : '') +
    '<button class="btn" onclick="' + mjC('sgIncReporte', r.id) + '">' + MK.ic('documento', 15) + ' Ver el reporte</button>' +
    (acc.length ? '<button class="btn gh" onclick="MK.cerrarLado();MK.ir(\'acc\')">' + MK.ic('enlace', 15) + ' Ver en Acciones de mejora</button>' : '') + '</div>';
  MK.lado(h, { ancho: true });
}

/* Un paso de la investigación (api_segIncAvanzar) y vuelta a la ficha */
function mjAvanzar(id, d, btn, msg) {
  if (btn) MK.ocupado(btn, true);
  MK.llamar('api_segIncAvanzar', id, d).then(function () {
    SEG.limpiar('inc', 'acc', 'est', 'exp'); MK.cerrarHoja(); MK.aviso(msg);
    MK.recargar(); sgInc(id);
  }, function () { if (btn) MK.ocupado(btn, false); });
}
function mjIncCausa(id) { mjConInc(id, function (r) { mjIncCausaForm(r, id); }); }
function mjIncCausaForm(r, id) {
  var w = r.why || [], f = '';
  for (var i = 0; i < 5; i++) f += '<label class="lb">' + (i + 1) + '.° ¿Por qué?</label><input class="in" id="mj-w' + i + '" maxlength="300" value="' + MK.esc(w[i] || '') + '"' + (i === 0 ? ' autofocus' : '') + '>';
  MK.hoja('<h2>Anotar la causa</h2><div class="sub">' + MK.esc(r.id) + ' · se pregunta «¿por qué?» con quien lo reportó, hasta llegar a la causa de fondo. Para empezar basta el primero.</div>' + f +
    '<div class="f2"><div><label class="lb">Pudo causar</label><input class="in" id="mj-pot" list="mj-pots" maxlength="120" value="' + MK.esc(r.pot || '') + '"><datalist id="mj-pots">' +
    ['Pinchazo o corte', 'Contacto con fluidos', 'Golpe o caída', 'Choque o vuelco', 'Quemadura', 'Lesión de espalda'].map(function (x) { return '<option value="' + x + '">'; }).join('') + '</datalist></div>' +
    '<div><label class="lb">Qué tan grave pudo ser</label><select class="in" id="mj-g">' + mjOpc(INC_G.slice(1).map(function (x, i) { return [i + 1, x]; }), r.g || 3) + '</select></div></div>' +
    '<label class="lb">Responsable de la investigación</label><select class="in" id="mj-resp">' + mjOpc(MJ_RESP, r.resp) + '</select>' +
    '<div class="pie2"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" onclick="' + mjCB('mjIncCausaOk', id) + '">Guardar la causa</button></div>', { ancha: true });
}
function mjIncCausaOk(id, btn) {
  var why = [0, 1, 2, 3, 4].map(function (i) { return MK.val('mj-w' + i); }).filter(Boolean);
  if (!why.length) { MK.aviso('Escriba al menos el primer porqué'); return; }
  mjAvanzar(id, { paso: 1, why: why, pot: MK.val('mj-pot'), g: Number(MK.val('mj-g')) || 3, resp: MK.val('mj-resp') }, btn, 'Causa anotada');
}
/* Una fila de acción: tipo de control, responsable, qué se va a hacer y fecha límite */
function mjAcFila() {
  return '<div class="sg-fila"><div class="f2"><div><label class="lb">Tipo de control</label><select class="in mj-j">' + mjJOpc('A') + '</select></div>' +
    '<div><label class="lb">Responsable</label><select class="in mj-r">' + mjOpc(MJ_RESP) + '</select></div></div>' +
    '<label class="lb">Qué se va a hacer</label><input class="in mj-q" maxlength="300">' +
    '<label class="lb">Fecha límite</label><input class="in mj-f" type="date" min="' + SEG.hoy() + '"></div>';
}
function mjAcMas() { var c = document.getElementById('mj-acs'); if (c) c.insertAdjacentHTML('beforeend', mjAcFila()); }
function mjAcLeer() {                                                           // → [{j, q, r, f}] o null si falta algo
  var L = [], mal = false, pasada = false;
  Array.prototype.forEach.call(document.querySelectorAll('#mj-acs .sg-fila'), function (fi) {
    var q = fi.querySelector('.mj-q').value.trim(), f = fi.querySelector('.mj-f').value;
    if (!q && !f) return;
    if (!q || !f) { mal = true; return; }
    if (f < SEG.hoy()) { pasada = true; return; }
    L.push({ j: fi.querySelector('.mj-j').value, q: q, r: fi.querySelector('.mj-r').value, f: f });
  });
  if (pasada) { MK.aviso('La fecha límite tiene que ser de hoy en adelante'); return null; }
  if (mal || !L.length) { MK.aviso(mal ? 'Cada acción lleva qué se va a hacer y su fecha límite' : 'Registre al menos una acción'); return null; }
  return L;
}
function mjIncAccion(id) { mjConInc(id, function (r) { mjIncAccionForm(r, id); }); }
function mjIncAccionForm(r, id) {
  MK.hoja('<h2>Registrar la acción</h2><div class="sub">' + MK.esc(r.id) + ' · sale de la causa. Se escoge en el orden de siempre: eliminar, sustituir, ingeniería, administrativo y EPP.</div>' +
    '<div id="mj-acs">' + mjAcFila() + '</div><div style="margin-top:10px"><button class="btn sm" onclick="mjAcMas()">' + MK.ic('mas', 14) + ' Otra acción</button></div>' +
    '<div class="pie2"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" onclick="' + mjCB('mjIncAccionOk', id) + '">Registrar</button></div>', { ancha: true });
}
function mjIncAccionOk(id, btn) {
  var L = mjAcLeer(); if (!L) return;
  mjAvanzar(id, { paso: 2, acc: L }, btn, 'Acción registrada');
}
function mjIncHecha(id) {
  MK.confirmar('Las acciones de ' + id + ' ya se hicieron. Después falta comprobar que funcionaron.', function () { mjAvanzar(id, { paso: 3 }, null, 'Acciones marcadas como hechas'); },
    { titulo: 'Marcar la acción hecha', boton: 'Sí, ya se hicieron' });
}
function mjIncCierre(id) { mjConInc(id, function (r) { mjIncCierreForm(r, id); }); }
function mjIncCierreForm(r, id) {
  var conBaja = r.t === 'inc' && (r.tipoLog === 'lesion' || r.tipoLog === 'choque');            // estas alimentan las estadísticas de accidentabilidad
  MK.hoja('<h2>Verificar y cerrar</h2><div class="sub">' + MK.esc(r.id) + ' · se comprueba que la acción funcionó. Al cerrar, las acciones quedan cerradas' + (r.t === 'inc' ? ' y el reporte también se cierra en Logística (F-LOG-03)' : '') + '.</div>' +
    '<label class="lb">Cómo se comprobó que funcionó</label><textarea class="in" rows="3" id="mj-ver" maxlength="400" autofocus></textarea>' +
    '<label class="lb">¿Cambia la matriz de peligros?</label><textarea class="in" rows="2" id="mj-mat" maxlength="300" placeholder="Si el peligro ya estaba y sus controles bastan, dígalo aquí">' + MK.esc(r.mat || '') + '</textarea>' +
    (conBaja ? '<div class="f2"><div><label class="lb">¿Con baja?</label><select class="in" id="mj-baja"><option value="">Elija…</option><option value="no">No</option><option value="si">Sí</option></select></div>' +
      '<div><label class="lb">Días perdidos</label><input class="in" id="mj-dias" type="number" min="0" max="365" value="0"></div></div>' : '') +
    '<div class="pie2"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" onclick="' + mjCB('mjIncCierreOk', id) + '">Verificar y cerrar</button></div>', { ancha: true });
}
function mjIncCierreOk(id, btn) {
  var ver = MK.val('mj-ver'); if (!ver) { MK.aviso('Escriba cómo se comprobó que funcionó'); return; }
  var d = { paso: 4, ver: ver, mat: MK.val('mj-mat') };
  if (document.getElementById('mj-baja')) {
    d.baja = MK.val('mj-baja'); if (!d.baja) { MK.aviso('Diga si fue con baja o sin baja'); return; }

function mjConOk(id, btn) {
  var f = MK.val('mj-f'), ap = mjLineas(MK.val('mj-ap')), ac = mjLineas(MK.val('mj-ac')), part = mjPartLeer();
  if (!f) { MK.aviso('Ponga la fecha'); return; }

  if (futura && (ap.length || ac.length)) { MK.aviso('Esa fecha todavía no llega: deje en blanco lo que se dijo, o ponga la fecha de la reunión'); return; }
  if (hecha && !part.length) { MK.aviso('Marque quiénes participaron'); return; }
  var d = { f: f, t: MK.val('mj-t'), n: MK.val('mj-n'), p: part, e: hecha ? 'hecha' : 'prog' };

  if (hecha) { d.ap = ap; d.ac = ac.map(function (q) { return { q: q, ac: '' }; }); }

    return (hecha && ac.length ? mjCrearAcciones(ac, ['con', cid, 'Consulta a los trabajadores'], f) : Promise.resolve([])).then(function (ids) {

        MK.recargar(); if (id) sgCon(cid);
      });
    });
  }, function () { MK.ocupado(btn, false); });
}

/* ═══ Apoyo · Capacitación y Contratistas y proveedores (api 3.32) ═══
   Capacitación: planes `capplan` (SEG.lista), estado = el del documento PL-SST-0x del listado (api_segDocs), personas y
   matriz de puestos de api_segExpedientes (solo con permiso de expedientes), registro con api_segCapRegistrar.
   Contratistas y proveedores: tipos `contratista` y `proveedor` (SEG.lista / SEG.guardar), constancias clase `contratista`. */
var SGAP = { filtro: 'ct', listaCap: null, listaCapNombre: '', evid: null };
(function () {
  var s = document.createElement('style');
  s.textContent = '.sg-ap-lista{max-height:260px;overflow:auto;border:1px solid var(--line2);border-radius:9px;padding:0 10px}' +
    '.sg-ap-lista .chk:first-child{border-top:0}.sg-ap-sub{color:var(--muted);font-size:12px;margin-top:6px}';
  document.head.appendChild(s);
})();

/* ───────────────────────── Capacitación ───────────────────────── */
var SGAP_CORTO = { 'PL-SST-01': 'Inducción', 'PL-SST-02': 'EPP', 'PL-SST-03': 'Pinchazos', 'PL-SST-04': 'Derrames', 'PL-SST-05': 'Cargas', 'PL-SST-06': 'Transporte' };
var SGAP_NUM = ['Cero', 'Un', 'Dos', 'Tres', 'Cuatro', 'Cinco', 'Seis'];
var SGAP_SUB_CAP = 'Los planes de capacitación de seguridad, a quién le toca cada uno y quién lo tiene al día. Comparte la matriz de capacitación con Calidad';

/* Lo que ya llegó, sin pedir nada */
function sgCapPl() {
  var s = SEG.cache['l:capplan'];
  if (!s || !s.listo) return null;
  return (s.valor.items || []).slice().sort(function (a, b) { return a.c < b.c ? -1 : a.c > b.c ? 1 : 0; });
}
function sgCapDocs() {
  var s = SEG.cache['cap:docs'];
  if (!s || !s.listo || !s.valor || !s.valor.docs) return null;
  var m = {}; s.valor.docs.forEach(function (d) { m[d.codigo] = d; });
  return m;
}
function sgCapExp() { var s = SEG.cache['exp']; return s && s.listo && s.valor && s.valor.personas ? s.valor : null; }
function sgCapPuedeReg() { var SP = SEG.puede(); return !!(SP.editar && SP.expedientes); }
/* «4 horas», «1 hora 30 minutos» → horas (solo lo de antes del paréntesis); null si no se entiende */
function sgCapHoras(t) {
  var s = String(t || '').split('(')[0], h = /(\d+(?:[.,]\d+)?)\s*horas?/i.exec(s), m = /(\d+)\s*min/i.exec(s);
  if (!h && !m) return null;
  return (h ? parseFloat(h[1].replace(',', '.')) : 0) + (m ? Number(m[1]) / 60 : 0);
}
function sgCapHorasTx(n) { var r = Math.round(n * 10) / 10; return String(r).replace('.', ',') + ' h'; }

function pCap() {
  var SP = SEG.puede(), pl = null;
  var der = '<button class="btn" onclick="sgCapTodos(this)">' + MK.ic('bajar', 15) + ' Bajar los planes</button>' +
    (sgCapPuedeReg() ? '<button class="btn pri" onclick="sgCapReg()">' + MK.ic('check', 15) + ' Registrar capacitación</button>' : '');
  var r = SEG.lista('capplan', 'cap');
  if (!r) return SEG.listaEspera('capplan', 'Capacitación', SGAP_SUB_CAP, der);
  SEG.dato('cap:docs', function () { return MK.p('api_segDocs'); }, 'cap');
  if (SP.expedientes) SEG.dato('exp', function () { return MK.p('api_segExpedientes'); }, 'cap');
  var espDocs = !SEG.cache['cap:docs'] || (!SEG.cache['cap:docs'].listo && !SEG.cache['cap:docs'].error);
  var espExp = SP.expedientes && (!SEG.cache['exp'] || (!SEG.cache['exp'].listo && !SEG.cache['exp'].error));
  if (espDocs || espExp) return MK.cabeza('Capacitación', SGAP_SUB_CAP, der) + '<div class="cargando">Cargando…</div>';
  pl = sgCapPl();
  var D = sgCapDocs(), EX = SP.expedientes ? sgCapExp() : null;
  var h = MK.cabeza('Capacitación', SGAP_SUB_CAP, der);

  /* cuántos están en borrador (cuenta real, con el estado del documento) */
  var nb = 0, nv = 0;
  if (D) pl.forEach(function (c) {
    var d = D[c.c]; if (!d) return;
    if (d.estado === 'borrador' || d.estado === 'por_aprobar') nb++; else if (d.estado === 'vigente') nv++;
  });
  h += '<div class="pila">';
  if (D && nb) {
    var uno = nb === 1;
    h += '<div class="aviso am" id="sg-cap-rev"><b>' + (SGAP_NUM[nb] || nb) + (uno ? ' plan en borrador.' : ' planes en borrador.') + '</b> ' +
      (uno ? 'Espera' : 'Esperan') + ' la revisión de la responsable de SST (propuesta: Estefanía) y la aprobación de Gerencia; al aprobarse ' +
      (uno ? 'pasa a vigente y se empieza' : 'pasan a vigentes y se empiezan') + ' a dictar.</div>';
  }
  var K = [];
  var partes = []; if (nv) partes.push(nv + (nv === 1 ? ' vigente' : ' vigentes')); if (nb) partes.push(nb + ' en borrador');
  K.push({ e: 'Planes de capacitación', v: pl.length, s: D ? partes.join(' · ') : '', c: D ? (nb ? 'warn' : nv ? 'ok' : '') : '' });
  if (EX) {
    var P = EX.personas.filter(function (p) { return p.est === 'activo'; });
    var alDia = P.filter(function (p) { return p.r && p.r.ind && p.r.ind[0] === 'ok'; }).length;
    if (P.length) K.push({ e: 'Inducción al día', v: alDia + ' <small style="display:inline;font-size:14px">de ' + P.length + '</small>', s: 'personal activo', c: alDia === P.length ? 'ok' : 'warn' });
    var cp = EX.capPuestos || {}, hs = 0, ok = !!cp.Conductor;
    if (ok) pl.forEach(function (c) { if (cp.Conductor[c.c] === 1) { var x = sgCapHoras(c.dur); if (x == null) ok = false; else hs += x; } });
    if (ok && hs > 0) K.push({ e: 'Horas por persona', v: sgCapHorasTx(hs), s: 'conductor nuevo · todos los planes' });
  }
  h += MK.kpis(K, 3);

  h += '<div class="card" id="sg-cap-planes"><h3>Planes de capacitación</h3>' + MK.tabla(['Código', 'Capacitación', 'Dirigida a', 'Duración', 'Cada cuánto', 'Estado', ''], pl.map(function (c) {
    var d = D && D[c.c];
    return ['<span class="cod">' + MK.esc(c.c) + '</span>', '<b>' + MK.esc(c.n) + '</b>', MK.esc(c.a), MK.esc(c.dur), MK.esc(c.fr), d ? estTag(d.estado) : '<span style="color:var(--muted)">—</span>',

/* Los seis uno tras otro; avisa los que no estén cargados */

  var hay = [], faltan = [];

/* ───────────────────── Contratistas y proveedores ───────────────────── */
var SGCT_REQ = [['css', 'Personal afiliado a la CSS'], ['epp', 'EPP propio para el trabajo'], ['ind', 'Inducción de seguridad de ECOVSA'], ['per', 'Permiso de trabajo y bloqueo']];
var SGCT_FALTA = { css: 'Falta la constancia de la CSS', epp: 'Falta el EPP propio para el trabajo', ind: 'Falta: no ha recibido la inducción', per: 'Falta el permiso de trabajo y bloqueo' };
var SGCT_ER = { ok: ['Al día', 'ok'], bad: ['Falta', 'bad'], warn: ['Pendiente', 'warn'], gris: ['No aplica', 'gris'] };

function sgCtLista() { var s = SEG.cache['l:contratista']; return s && s.listo ? (s.valor.items || []).slice().sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; }) : null; }
function sgCtGet(id) { var l = sgCtLista(); return l ? l.filter(function (x) { return x.id === id; })[0] : null; }

function sgProvAviso() { MK.aviso('La evaluación de proveedores de Calidad (F-ADM-07) todavía no está construida: cuando exista, se abre desde aquí.', 5000); }

  } else {

    h += MK.tabla(['Proveedor', 'Qué suministra', 'Afecta la seguridad', 'Evaluación', 'Resultado'], PRV.map(function (p) {
      return ['<b>' + MK.esc(p.n) + '</b>', MK.esc(p.q || ''), p.s ? MK.tag('Sí', 'info') : '<span style="color:var(--muted)">No</span>', p.p != null && p.p !== '' ? MK.esc(p.p) + ' / 100' : '—', p.e ? MK.tag(p.e, p.e === 'Aprobado' ? 'ok' : 'warn') : '—'];

  }

/* Deja una evidencia en su sitio y guarda todas (el arreglo se manda completo) */
function sgCtPoner(c, k, v, btn) {
  var r = {}; SGCT_REQ.forEach(function (q) { r[q[0]] = sgCtR(c, q[0]); });

/* Contratista nuevo: nace con todo en rojo */
