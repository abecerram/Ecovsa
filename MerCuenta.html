<style>
/* api 3.11 · Cuenta con sedes (maqueta 44) · api 3.13: pasos por color, Cancelar / Guardar y salir, plan del grupo */
.w44{--nv:var(--navy);--ln:var(--line);--ln2:var(--line2);--mu:var(--muted);font-size:13.5px}
.w44 .crumb2{font-size:13px;color:var(--mu);margin-bottom:6px}.w44 .crumb2 a{color:var(--mu)}
.w44 h1{font-size:22px;margin:0 0 4px;color:var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.w44 .lead{color:var(--mu);font-size:13px;margin-bottom:14px}
.w44 .stp{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.w44 .stp>button{flex:1;min-width:120px;border-radius:10px;padding:8px 11px;background:#f3f5f8;color:#8a96a8;border:0;text-align:left;font:inherit;cursor:pointer}
.w44 .stp>button.ok{background:#eaf6e4;color:#2f6b0a}.w44 .stp>button.on{background:var(--nv);color:#fff}
.w44 .stp>button.falta{background:#fff4d6;color:#8a6100}.w44 .stp>button.falta small{opacity:1;font-weight:700}
.w44 .stp b{display:block;font-size:12.5px}.w44 .stp small{font-size:11.5px;opacity:.9}
.w44 .cd{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.w44 .cd h3{font-size:12px;letter-spacing:.9px;color:#5b6a80;font-weight:700;margin:0 0 12px;text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w44 .g{display:grid;gap:12px}.w44 .g2{grid-template-columns:1fr 1fr}.w44 .g3{grid-template-columns:repeat(3,1fr)}.w44 .g4{grid-template-columns:repeat(4,1fr)}
.w44 .dos{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.w44 label.l{display:block;font-size:11px;letter-spacing:.7px;color:#5b6a80;font-weight:700;text-transform:uppercase;margin-bottom:5px}
.w44 .in.ed{border-color:#d99a00;background:#fffdf6}.w44 .in.n{text-align:right;font-variant-numeric:tabular-nums}
.w44 .tw{overflow-x:auto}
.w44 table.t{width:100%;border-collapse:collapse}
.w44 table.t th{text-align:left;font-size:10.5px;letter-spacing:.6px;color:#5b6a80;text-transform:uppercase;padding:6px 7px;border-bottom:1px solid var(--ln);white-space:nowrap}
.w44 table.t td{padding:6px 7px;border-bottom:1px solid var(--ln2);vertical-align:middle}
.w44 table.t .in,.w44 table.t .sel{padding:6px 8px;font-size:13px}
.w44 .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.w44 tr.sub td{border-bottom:1px solid var(--ln);padding-top:0;background:#fbfcfe}
.w44 .tg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.w44 .az{background:#e7edf7;color:#1d3f86}.w44 .vd{background:#eaf6e4;color:#1f6b35}.w44 .am{background:#fff4d6;color:#8a6100}.w44 .rj{background:#fdecea;color:#a8262b}.w44 .gr{background:#eef1f5;color:#5d6b80}.w44 .mo{background:#f1ecfa;color:#6c3a96}
.w44 .bar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid var(--ln);padding-top:14px;margin-top:4px;position:sticky;bottom:0;background:var(--bg,#f4f6f9);padding-bottom:10px;z-index:3}
.w44 .add{border:1.5px dashed #c9d5e8;background:#fff;border-radius:10px;padding:7px 12px;font:700 12.5px Archivo,sans-serif;color:var(--nv);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.w44 .nota{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5}
.w44 .avi{display:flex;gap:10px;align-items:flex-start;border-radius:11px;padding:10px 12px;font-size:12.8px;line-height:1.5;margin-top:10px}
.w44 .avi.az{border:1px solid #c9d8f5;background:#eef4ff}.w44 .avi.am{border:1px solid #f1d48a;background:#fffbef}.w44 .avi.vd{border:1px solid #bfe3b3;background:#f4fbf0}.w44 .avi.rj{border:1px solid #f3c2c4;background:#fffafa}
.w44 .dif{font-size:11.5px;font-weight:800}.w44 .dif.bj{color:#a8262b}.w44 .dif.sb{color:#1f6b35}
.w44 .lat{position:sticky;top:76px}
.w44 .rw{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln2);font-size:13px}.w44 .rw b{font-variant-numeric:tabular-nums;text-align:right}
.w44 .big{background:var(--nv);color:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.w44 .fx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.w44 .sp{flex:1}.w44 .mut{color:var(--mu)}.w44 .sm{font-size:12px}
.w44 .ejemplo{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;background:#fff4d6;color:#8a6100;border-radius:5px;padding:1px 6px;margin-left:4px}
.w44 .pag{border:1.5px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:10px;background:#fff}
.w44 .pag.on{border-color:var(--nv);background:#f8fafe}
.w44 label.pag{display:block;cursor:pointer}
.w44 .rad{width:18px;height:18px;border-radius:50%;border:2px solid #b3c0d4;display:inline-block;flex:none}.w44 .rad.on{border:5px solid var(--nv)}
.w44 .ico{background:none;border:0;cursor:pointer;color:#8a96a8;padding:4px;border-radius:6px}.w44 .ico:hover{color:#a8262b;background:#fdecea}
.w44 .gnom{font:700 14px Archivo,sans-serif;border:1px solid transparent;border-radius:8px;padding:4px 6px;color:var(--ink);background:transparent;min-width:220px}
.w44 .gnom:hover,.w44 .gnom:focus{border-color:var(--ln);background:#fff}
.w44 .guardado{font-size:12px;color:#2f6b0a;font-weight:700}
.w44 .cat{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.w44 .cat button{text-align:left;border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;cursor:pointer}
.w44 .cat button:hover{border-color:var(--nv)}
.hoja .cat{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:10px}
.hoja .cat button{text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;cursor:pointer}
.hoja .cat button:hover{border-color:var(--navy)}
/* api 3.13 · plan del grupo */
.w44 .pln{display:grid;gap:8px;border:1px solid #c9d8f5;background:#f5f8fd;border-radius:11px;padding:10px 12px;margin-bottom:12px}
.w44 .pln .sel{font-weight:700;color:var(--ink);max-width:470px;min-width:0}
.w44 .pln .r1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.w44 .pln .ref{font-size:12.5px;line-height:1.55;color:var(--mu)}.w44 .pln .ref b{color:var(--ink);font-variant-numeric:tabular-nums}
.w44 .pln.sin{border-color:var(--ln);background:#fafbfd}
.w44 .rw b{white-space:nowrap}
.w44 .rw small{display:block;font-size:11px;color:var(--mu);font-weight:500}
.w44 .avi .btn{margin-left:auto;flex:none}
.w44 .dos>*{min-width:0}
@media (max-width:900px){.w44 .dos,.w44 .g3,.w44 .g4{grid-template-columns:1fr}.w44 .g2{grid-template-columns:1fr}.w44 .lat{position:static}.w44 .gnom{min-width:0;width:100%}.w44 .pln .sel{width:100%;max-width:none}.w44 .avi{flex-wrap:wrap}}
</style>

<body class="mk">
<div id="sysbar"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"><div class="cargando">Cargando la cuenta…</div></main></div>
<script>
(function () {
  var COD = MK.param('id'), D = null, C = null, CAL = null, K = 0, CAMBIOS = false, tCalc = null, RO = false;
  var PLN = null;                                     /* api 3.13: planes que aplican a este cliente (api_planesParaOportunidad) */
  var AGREGAR = MK.param('agregar'), GRUPO_AG = Number(MK.param('grupo')) || 1;   /* de vuelta del catálogo */
  var E = MK.esc, IC = MK.ic;
  var PASOS = [['La cuenta', 'quién es el cliente'], ['Sedes', 'dónde y cuánto genera'], ['Precio', 'referencia y precio final'], ['Servicios y productos', 'fumigación, envases…'], ['Facturación y cobro', 'quién paga y a quién se cobra'], ['Revisar y enviar', 'propuesta y enlace']];
  var FAC = { consolidada: ['Una sola factura para toda la cuenta', 'Una factura al mes con el detalle de cada sede. Se cobra a un solo pagador.'],
              sede: ['Una factura por sede', 'Cada sede tiene su factura y su propio cobro: la carta solo le llega a la sede que debe.'],
              grupo: ['Una factura por grupo', 'Una factura por cada grupo (por ejemplo, sus sedes en una y las clínicas externas en otra).'] };
  var FREC = [['', 'La sugerida'], ['8', '2 por semana (8)'], ['4', 'Semanal (4)'], ['2', 'Quincenal (2)'], ['1', 'Mensual (1)'], ['0.5', 'Bimestral'], ['0.34', 'Trimestral']];
  var d2 = function (n) { return 'B/. ' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var n2 = function (n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var $ = function (id) { return document.getElementById(id); };
  var idN = function (p) { return p + Math.random().toString(36).slice(2, 8).toUpperCase(); };
  var calG = function (gid) { return ((CAL && CAL.grupos) || []).filter(function (g) { return g.id === gid; })[0] || null; };
  var calS = function (sid) { var r = null; ((CAL && CAL.grupos) || []).forEach(function (g) { g.sedes.forEach(function (s) { if (s.id === sid) r = s; }); }); return r; };
  /* api 3.13 · forma de un servicio: {itemId, nombre, modo, cantidad, cada, meses, precio, total, delPlan, dePromo} (catId se deja igual a itemId por lo guardado antes) */
  var MESES_DE = { visita: 1, mes: 1, bimestre: 2, trimestre: 3, semestre: 6, solicitud: 1 };
  var sId = function (x) { return (x && (x.itemId || x.catId)) || ''; };
  var srvNorm = function (x) { var id = sId(x); x.itemId = id; x.catId = id; x.meses = MESES_DE[x.cada] || 1; x.delPlan = !!x.delPlan; x.dePromo = !!x.dePromo; return x; };
  var srvDe = function (c) { return srvNorm({ itemId: c.id, nombre: c.nombre, tipo: c.tipo, cantidad: 1, cada: 'mes', modo: c.tipo === 'servicio' && c.precio ? 'cobrado' : 'incluido', precio: c.precio || 0, insumoId: c.insumoId, quien: c.quien }); };
  var catPor = function (id) { return (D.catalogo || []).filter(function (c) { return c.id === id; })[0] || {}; };
  var frecTxt = function (v) { v = Number(v); return v >= 8 ? '2 por semana' : v >= 4 ? 'Semanal' : v >= 2 ? 'Quincenal' : v >= 1 ? 'Mensual' : v >= 0.5 ? 'Bimestral' : 'Trimestral'; };

  MK.iniciar('cuenta', function () {
    if (!COD) { MK.error('main', 'Falta el código de la oportunidad.'); return; }
    cargar();
  });
  function cargar() {
    /* los planes no detienen la pantalla: si no llegan, el precio se arma sin plan, como antes */
    var planes = MK.api('api_planesParaOportunidad', MK.pin, COD).then(function (r) { return r && r.ok ? r : null; }, function () { return null; });
    Promise.all([MK.api('api_cuentaGran', MK.pin, COD), planes]).then(function (x) {
      var r = x[0];
      if (!r || !r.ok) { MK.error('main', (r && r.error) || 'No se pudo cargar.'); return; }
      D = r; C = r.cuenta; CAL = r.calculo; PLN = x[1];
      (C.grupos || []).forEach(function (g) { g.servicios = (g.servicios || []).map(srvNorm); });
      RO = !r.editar || ['Firmado', 'Pasado a cartera'].indexOf(r.oportunidad.estado) >= 0;
      var p = Number(MK.param('paso')); K = p >= 1 && p <= 6 ? p - 1 : Math.min(5, Number(C.paso) || 0);
      if (AGREGAR) K = 3;
      pintar();
      if (AGREGAR) agregarDelCatalogo();
    }, function (e) { MK.error('main', e.message); });
  }

  /* ═══ api 3.13 · pasos: verde con lo mínimo, amarillo «falta …», gris opcional o sin tocar ═══ */
  function pl(n, uno, varios) { return n === 1 ? uno : varios.replace('#', n); }
  function faltaPaso(i) {
    var O = D.oportunidad, cc = C.contactoCorp || {}, f = [];
    var sedes = []; C.grupos.forEach(function (g) { g.sedes.forEach(function (s) { sedes.push(s); }); });
    if (i === 0) { if (!O.empresa) f.push('falta el nombre'); if (!cc.nombre) f.push('falta el contacto'); else if (!cc.correo) f.push('falta el correo del contacto'); }
    if (i === 1) {
      var sn = sedes.filter(function (s) { return !String(s.nombre || '').trim(); }).length, sz = sedes.filter(function (s) { return !s.zona; }).length, sk = sedes.filter(function (s) { return !(Number(s.kgMes) > 0); }).length;
      if (!sedes.length) f.push('falta agregar las sedes');
      if (sn) f.push(pl(sn, 'falta el nombre de 1 sede', 'falta el nombre de # sedes'));
      if (sz) f.push(pl(sz, 'falta la zona de 1 sede', 'falta la zona de # sedes'));
      if (sk) f.push(pl(sk, 'faltan los kilos de 1 sede', 'faltan los kilos de # sedes'));
    }
    if (i === 2) { var gp = ((CAL && CAL.grupos) || []).filter(function (g) { return !(g.precioFinal > 0); }).length; if (gp) f.push(pl(gp, 'falta el precio de 1 grupo', 'falta el precio de # grupos')); }
    if (i === 4) {
      var ps = C.pagadores || [];
      if (!C.facturacion) f.push('falta elegir la factura');
      else if (!ps.length || ps.some(function (p) { return !String(p.nombre || '').trim(); })) f.push('falta quién paga');
      else if (ps.some(function (p) { return !p.correo; })) f.push('falta el correo de cobro');
    }
    return f;
  }
  function estadoPaso(i) {
    if (i === K) return { cl: 'on', txt: PASOS[i][1] };
    var hecho = i <= (Number(C.paso) || 0);                     /* ya se pasó por ese paso */
    if (i === 3) { var n = 0; C.grupos.forEach(function (g) { n += (g.servicios || []).length; });
      return n ? { cl: 'ok', txt: n + (n === 1 ? ' servicio o producto' : ' servicios y productos') } : { cl: '', txt: 'opcional · ninguno' }; }
    if (i === 5) return ['Propuesta enviada', 'En negociación', 'Contrato en proceso', 'Firmado', 'Pasado a cartera'].indexOf(D.oportunidad.estado) >= 0 ? { cl: 'ok', txt: 'enviada' } : { cl: '', txt: PASOS[i][1] };
    var f = faltaPaso(i);
    if (!f.length) return hecho ? { cl: 'ok', txt: PASOS[i][1] } : { cl: '', txt: PASOS[i][1] };
    return hecho ? { cl: 'falta', txt: f[0] + (f.length > 1 ? ' (+' + (f.length - 1) + ')' : ''), todo: f } : { cl: '', txt: PASOS[i][1] };
  }
  function botonPaso(p, i) {
    var e = estadoPaso(i);
    return '<button type="button" data-k="' + i + '" class="' + e.cl + '"' + (e.todo ? ' title="' + E(e.todo.join(' · ')) + '"' : '') + '><b>' + (e.cl === 'ok' ? '✓ ' : (i + 1) + ' · ') + p[0] + '</b><small>' + E(e.txt) + '</small></button>';
  }
  /* sedes y kilos de toda la cuenta; «gran generador» es solo por volumen (o un plan de gran generador) */
  function totales() {
    var nS = 0, kgT = 0; C.grupos.forEach(function (g) { nS += g.sedes.length; g.sedes.forEach(function (s) { kgT += Number(s.kgMes) || 0; }); });
    var umbral = (D.granGenerador && D.granGenerador.umbral) || 100;
    var porPlan = ((CAL && CAL.grupos) || []).some(function (g) { return g.plan && g.plan.gran; });
    return { sedes: nS, kg: kgT, umbral: umbral, gran: kgT >= umbral || porPlan, porPlan: porPlan };
  }
  function tagsHtml() {
    var O = D.oportunidad, t = totales();
    return (t.sedes >= 2 ? '<span class="tg az">CUENTA CON ' + t.sedes + ' SEDES</span> ' : '') +
      (t.gran ? '<span class="tg vd">GRAN GENERADOR' + (t.kg >= t.umbral ? ' · ' + Math.round(t.kg) + ' KG AL MES' : ' · POR EL PLAN') + '</span> ' : '') +
      (O.reactivacion ? '<span class="tg am">' + IC('renovar', 12) + ' reactivación</span> ' : '') +
      (O.clienteOrigen ? '<a class="tg gr" href="MerCliente.html?id=' + encodeURIComponent(O.clienteOrigen) + '">CLI-' + ('000' + O.clienteOrigen).slice(-3) + '</a> ' : '') + MK.ETAPA_TAG(O.estado);
  }

  /* ═══ marco ═══ */
  function pintar(mantener) {
    var O = D.oportunidad, y = window.scrollY, nS = totales().sedes;
    var cuerpo = [pCuenta, pSedes, pPrecio, pServicios, pFacturacion, pRevisar][K]();
    $('main').innerHTML = '<div class="w44">' + MK.ruta([{ t: 'Oportunidades', href: 'MerOportunidades.html' }, { t: COD, href: 'MerOportunidad.html?id=' + encodeURIComponent(COD) }, { t: nS >= 2 ? 'Cuenta con ' + nS + ' sedes' : 'Cuenta' }]) +
      '<h1>' + E(O.empresa || 'Sin nombre') + ' <span id="tags" style="display:contents">' + tagsHtml() + '</span></h1>' +
      '<div class="lead">' + (RO ? (D.editar ? 'La oportunidad ya está firmada: la cuenta se ve, pero no se cambia.' : 'Solo consulta.') : 'Se guarda en cada paso: se puede dejar a medias y seguir después.') + ' <span class="guardado" id="gd"></span></div>' +
      '<div class="stp">' + PASOS.map(botonPaso).join('') + '</div>' +
      '<div id="cuerpo">' + cuerpo + '</div>' +
      /* api 3.13: Atrás · Cancelar · Guardar y salir · Siguiente en todos los pasos */
      '<div class="bar"><div class="fx">' + (K ? '<button class="btn" id="b-atras">' + IC('atras', 14) + ' Atrás</button>' : '') + '<span class="sm mut">Paso ' + (K + 1) + ' de 6</span></div>' +
      '<div class="fx">' + (RO ? '<a class="btn" href="MerOportunidad.html?id=' + encodeURIComponent(COD) + '">' + IC('atras', 14) + ' Volver a la ficha</a>'
        : '<button class="btn" id="b-cancelar">' + IC('x', 14) + ' Cancelar</button><button class="btn" id="b-salir">' + IC('check', 14) + ' Guardar y salir</button>') +
      (K < 5 ? '<button class="btn pri" id="b-sig">Siguiente ' + IC('flecha', 14) + '</button>' : '') + '</div></div></div>';
    [].forEach.call(document.querySelectorAll('.stp [data-k]'), function (b) { b.onclick = function () { ir(Number(b.getAttribute('data-k'))); }; });
    if ($('b-atras')) $('b-atras').onclick = function () { ir(K - 1); };
    if ($('b-sig')) $('b-sig').onclick = function () { ir(K + 1); };
    if ($('b-salir')) $('b-salir').onclick = guardarYSalir;
    if ($('b-cancelar')) $('b-cancelar').onclick = cancelar;
    [enCuenta, enSedes, enPrecio, enServicios, enFacturacion, enRevisar][K]();
    if (RO) [].forEach.call(document.querySelectorAll('#cuerpo input,#cuerpo select,#cuerpo textarea,#cuerpo .add,#cuerpo .ico,#cuerpo [data-rw]'), function (x) { x.disabled = true; });
    window.scrollTo(0, mantener ? y : 0);
  }
  function salirA(url) { clearTimeout(tCalc); CAMBIOS = false; location.href = url; }
  function guardarYSalir() {
    var b = $('b-salir'); MK.ocupado(b, true);
    clearTimeout(tCalc);
    guardar().then(function (ok) { MK.ocupado(b, false); if (ok !== false) salirA('MerOportunidad.html?id=' + encodeURIComponent(COD)); });
  }
  /* Cancelar: sale sin guardar; si hay cambios, lo pregunta */
  function cancelar() {
    if (!CAMBIOS || RO) { salirA('MerOportunidad.html?id=' + encodeURIComponent(COD)); return; }
    MK.hoja('<h2>¿Salir sin guardar?</h2><p class="muted" style="margin-top:6px">Se pierden los cambios de este paso que no se han guardado. Lo guardado en los pasos anteriores se queda.</p>' +
      '<div class="pie"><button class="btn" id="b-seguir">Seguir editando</button><button class="btn bad" id="b-perder">Salir sin guardar</button></div>');
    $('b-seguir').onclick = function () { MK.cerrarHoja(); };
    $('b-perder').onclick = function () { MK.cerrarHoja(); salirA('MerOportunidad.html?id=' + encodeURIComponent(COD)); };
  }
  function ir(k) {
    if (k === K) return;
    clearTimeout(tCalc);

      var filas, th;

            '<td class="n"><b>' + d2(s.refVisita) + '</b></td><td class="n">× ' + s.visitasCalc + '</td><td class="n"><b>' + d2(s.refMes) + '</b></td></tr>';
        }).join('');
      } else {
        th = '<th>Sede</th><th class="n">Kilos por visita × precio del kg</th><th class="n">Viaje</th><th class="n">Por visita</th><th class="n">Visitas</th><th class="n">Al mes</th>';
        filas = cg.sedes.map(function (s) {

            '<td class="n">' + n2(s.viaje.total) + ' <span class="sm mut">' + E(s.zona.toLowerCase()) + (s.viaje.extra ? ' + ' + n2(s.viaje.extra) + ' por km' : '') + '</span></td>' +

        }).join('');
      }
      var kgAd = P && P.kgAdicional ? P.kgAdicional : CAL.kgAdicional;   /* sin kilo adicional propio: el de las reglas de base */
      return '<div class="cd" data-grupo="' + gi + '"><h3>' + IC('calc', 16) + 'Grupo ' + (gi + 1) + ' · ' + E(cg.nombre) + (cg.aSolicitud ? ' <span class="tg am">a solicitud</span>' : '') + '</h3>' + barra +
        '<div class="tw"><table class="t"><thead><tr>' + th + '</tr></thead><tbody>' + filas +
        '<tr class="tt"><td>' + (P ? 'Referencia del plan' : 'Referencia del grupo') + '</td><td colspan="4" class="sm mut" style="font-weight:600">' + n2(cg.kgMes).replace('.00', '') + ' kg al mes · ' + cg.visitasMes + ' visitas</td><td class="n">' + d2(cg.refMes) + '</td></tr></tbody></table></div>' +
        '<div class="g g4" style="margin-top:14px"><div><label class="l">' + (P ? 'Precio del plan' : 'Referencia') + '</label><input class="in n" readonly value="' + n2(cg.refMes) + '"></div>' +
        '<div><label class="l" for="pf' + gi + '">Precio al mes (Katherine)</label><input class="in n ed" id="pf' + gi + '" data-pf="' + gi + '" type="number" min="0" step="0.01" value="' + (g.precio == null ? '' : g.precio) + '" placeholder="' + n2(cg.refMes) + '"></div>' +
        '<div><label class="l">Diferencia</label><div style="padding:9px 0" data-dif="' + gi + '">' + difTx(gi) + '</div></div>' +
        '<div><label class="l" for="ki' + gi + '">Kg incluidos al mes</label><input class="in n" id="ki' + gi + '" data-ki="' + gi + '" type="number" min="0" value="' + (g.kgIncluidos == null ? '' : g.kgIncluidos) + '" placeholder="' + Math.round(cg.kgIncluidosCalc != null ? cg.kgIncluidosCalc : cg.kgMes) + '"></div></div>' +
        '<div class="nota">Vacío = ' + (P ? 'el precio del plan y sus kilos (' + kgPlan(P) + ' kg por sede)' : 'la referencia') + '. El excedente se cobra a ' + d2(kgAd) + ' el kilo' + (P ? (P.kgAdicional ? ' (del plan)' : ' (reglas de base: el plan no trae el suyo)') : '') + '.</div></div>';
    }).join('');
    return '<div class="dos"><div>' + html + '</div><div class="lat"><div class="cd"><h3>' + IC('billete', 16) + 'Cómo se calcula</h3>' +
      (PLN ? '<div class="sm" style="line-height:1.6"><b>Con plan:</b> precio por visita del plan × visitas × sedes del grupo.<br><b>Sin plan:</b> kilos por visita × precio del kg + viaje de su zona, con el mínimo por visita.</div>'
        : '<div class="sm" style="line-height:1.6">Precio por visita =<br><b>kilos por visita × precio del kg</b><br>+ <b>viaje de su zona</b> (y recargo por km)<br>con el mínimo por visita.</div>') +
      '<div class="rw" style="margin-top:10px"><span>Kilos de toda la cuenta</span><b>' + n2(CAL.kgTotal).replace('.00', '') + ' kg</b></div><div class="rw"><span>Tramo</span><b>' + CAL.tramo.desde + '–' + (CAL.tramo.hasta == null ? 'en adelante' : CAL.tramo.hasta + ' kg') + '</b></div>' +
      '<div class="rw"><span>Precio del kg' + (PLN ? ' (sin plan)' : '') + '</span><b>' + d2(CAL.precioKg) + '</b></div><div class="rw"><span>Mínimo en ruta · a solicitud</span><b>' + d2(T.minimoRuta) + ' · ' + d2(T.minimoSolicitud) + '</b></div>' +
      '<div class="rw"><span>Recargo por km</span><b>' + d2(T.recargoKm) + ' desde ' + T.recargoDesdeKm + ' km</b></div>' +
      '<div class="nota">Los ' + (PLN ? 'planes y los ' : '') + 'números vienen de <a href="MerTarifario.html">Planes y tarifas</a>.' + (T.ejemplo ? ' <span class="ejemplo">EJEMPLO</span> Todavía son números de ejemplo.' : '') + '</div></div>' +
      '<div class="cd"><h3>' + IC('moneda', 16) + 'Recolección al mes</h3>' + CAL.grupos.map(function (g, gi) {
        var pg = g.plan || planPor(C.grupos[gi].planId);
        return '<div class="rw"><span>' + E(g.nombre) + '<small>' + (pg ? 'plan «' + E(pg.nombre) + '»' : 'sin plan') + (C.grupos[gi].precio != null ? ' · especial' : '') + '</small></span><b>' + d2(g.precioFinal) + '</b></div>'; }).join('') +
      '<div class="big"><span>Total al mes</span><span>' + d2(CAL.grupos.reduce(function (a, g) { return a + (Number(g.precioFinal) || 0); }, 0)) + '</span></div></div></div></div>';
  }
  /* lo que Katherine cambió contra el plan (o la referencia) se ve, no se esconde */
  function difTx(gi) {
    var cg = CAL.grupos[gi], g = C.grupos[gi], conPlan = !!(g.planId);
    if (g.precio == null || !cg) return '<span class="sm mut">igual ' + (conPlan ? 'al plan' : 'a la referencia') + '</span>';
    var dif = Number(cg.diferencia) || 0;
    if (!dif) return '<span class="sm mut">igual ' + (conPlan ? 'al plan' : 'a la referencia') + '</span>';
    return '<span class="dif ' + (dif < 0 ? 'bj' : 'sb') + '">' + (conPlan ? 'Precio especial · ' + Math.abs(dif) + ' % ' + (dif < 0 ? 'bajo' : 'sobre') + ' el plan' : (dif > 0 ? '+' : '') + dif + ' % ' + (dif < 0 ? 'bajo' : 'sobre') + ' la referencia') + '</span>';
  }
  function enPrecio() {
    $('cuerpo').oninput = function (e) {
      var t = e.target, gi;
      if (t.hasAttribute('data-pf')) { gi = Number(t.getAttribute('data-pf')); C.grupos[gi].precio = t.value === '' ? null : Number(t.value);
        recalcular(function () { var el = document.querySelector('[data-dif="' + gi + '"]'); if (el) el.innerHTML = difTx(gi); }); }
      if (t.hasAttribute('data-ki')) { gi = Number(t.getAttribute('data-ki')); C.grupos[gi].kgIncluidos = t.value === '' ? null : Number(t.value); CAMBIOS = true; }
    };
    $('cuerpo').onchange = function (e) {
      var t = e.target; if (!t.hasAttribute('data-plan')) return;
      ponerPlan(Number(t.getAttribute('data-plan')), t.value || null);
    };
  }
  /* al elegir el plan: el grupo toma su precio y sus kilos, y los servicios del plan quedan puestos (marcados «del plan») */
  function ponerPlan(gi, id) {
    var g = C.grupos[gi], P = planPor(id);
    g.planId = id || null; g.precio = null; g.kgIncluidos = null;
    g.servicios = (g.servicios || []).filter(function (x) { return !x.delPlan; });
    if (P) (P.servicios || []).forEach(function (x) {
      var cat = catPor(x.itemId);
      g.servicios = g.servicios.filter(function (y) { return sId(y) !== x.itemId; });
      g.servicios.push(srvNorm({ itemId: x.itemId, nombre: x.nombre || cat.nombre, tipo: cat.tipo, cantidad: x.cantidad, cada: x.cada, modo: x.modo, precio: Number(x.precio) || 0, insumoId: cat.insumoId, quien: cat.quien, delPlan: true }));
    });
    recalcular(function () { pintar(true); });
    if (P) MK.aviso('Plan «' + P.nombre + '» en el grupo ' + (gi + 1) + (P.servicios && P.servicios.length ? ' · sus servicios quedaron en el paso 4' : ''));
  }

  /* ═══ 4 · servicios y productos ═══ */
  var QUIEN = { camion: 'Personal del camión', conductor: 'Conductor en la visita', mercadeo: 'Mercadeo', otro: 'Otro' };
  function pServicios() {
    var th = '<thead><tr><th>Servicio o producto</th><th>Cantidad por sede</th><th>Cada</th><th>En la propuesta</th><th class="n">Precio</th><th>Quién</th><th class="n">Al mes</th><th></th></tr></thead>';
    return CAL.grupos.map(function (cg, gi) {
      var g = C.grupos[gi];
      var filas = g.servicios.map(function (sv, si) {
        var cat = catPor(sId(sv)), cs = cg.servicios[si] || {}, esProd = (cat.tipo || sv.tipo) !== 'servicio';
        var rep = !!CADA_MESES[sv.cada];                          /* no mensual: se cobra repartido al mes */
        return '<tr data-g="' + gi + '" data-v="' + si + '"><td><div class="fx" style="flex-wrap:nowrap"><span class="tg ' + (esProd ? 'vd' : 'mo') + '" style="padding:6px">' + IC(esProd ? 'caja' : 'estrella', 14) + '</span><div><b>' + E(cat.nombre || sv.nombre) + '</b>' + (sv.delPlan ? ' <span class="tg gr">del plan</span>' : '') +
          '<div class="sm mut">' + (cat.insumoId ? 'Inventario: quedan ' + (cat.stock == null ? '—' : cat.stock) : esProd ? 'sin amarrar al inventario' : E(cat.descripcion || '')) + (cat.activo === false ? ' · <span class="tg am">apagado</span>' : '') + '</div></div></div></td>' +
          '<td style="width:120px"><select class="sel" data-f="cantidad">' + ['1', '2', '3', '4', '5', '10', 'solicitud'].map(function (o) { return '<option value="' + o + '"' + (String(sv.cantidad) === o ? ' selected' : '') + '>' + (o === 'solicitud' ? 'por solicitud' : o) + '</option>'; }).join('') + '</select></td>' +
          '<td style="width:130px"><select class="sel" data-f="cada">' + ['mes', 'visita', 'bimestre', 'trimestre', 'semestre'].map(function (k) { return '<option value="' + k + '"' + (sv.cada === k ? ' selected' : '') + '>' + CADA_TX[k] + '</option>'; }).join('') +
            (sv.cada === 'solicitud' ? '<option value="solicitud" selected>por solicitud</option>' : '') + '</select></td>' +
          '<td style="width:130px"><select class="sel" data-f="modo"><option value="incluido"' + (sv.modo === 'incluido' ? ' selected' : '') + '>Incluido</option><option value="cobrado"' + (sv.modo === 'cobrado' ? ' selected' : '') + '>Cobrado</option></select></td>' +
          '<td style="width:110px"><input class="in n" data-f="precio" type="number" min="0" step="0.01" value="' + (sv.precio || '') + '" placeholder="' + n2(cat.precio) + '"' + (sv.modo === 'cobrado' ? '' : ' disabled') + '></td>' +
          '<td class="sm">' + E(QUIEN[cat.quien] || '') + '</td><td class="n" data-tot><b>' + (sv.modo === 'cobrado' ? d2(cs.total) : 'incluido') + '</b><div class="sm mut">' + (rep ? (sv.modo === 'cobrado' ? 'al mes · repartida' : E(CADA_TX[sv.cada])) : (cs.cantidadMes || 0) + ' al mes') + '</div></td>' +
          '<td><button class="ico" data-quitar title="Quitar">' + IC('basura', 15) + '</button></td></tr>';
      }).join('');
      return '<div class="cd"><h3>' + IC(gi ? 'personas' : 'edificio', 16) + 'Grupo ' + (gi + 1) + ' · ' + E(cg.nombre) + '<span class="sp"></span><span class="tg gr">' + cg.sedes.length + (cg.sedes.length === 1 ? ' sede · ' : ' sedes · ') + cg.visitasMes + (cg.visitasMes === 1 ? ' visita' : ' visitas') + ' al mes</span></h3>' +
        (filas ? '<div class="tw"><table class="t">' + th + '<tbody>' + filas + '<tr class="tt"><td colspan="6">Servicios del grupo</td><td class="n">' + d2(cg.serviciosMes) + '</td><td></td></tr></tbody></table></div>' : '<div class="sm mut">Sin servicios ni productos todavía.</div>') +
        '<div class="fx" style="margin-top:10px"><button class="add" data-agregar="' + gi + '">' + IC('mas', 14) + ' Agregar servicio o producto</button><span class="sm mut">del catálogo · se quita con la papelera</span></div></div>';
    }).join('') +
      '<div class="avi az">' + IC('info', 16) + '<div>La <b>fumigación</b> la hace el personal del camión. Los <b>envases</b> los repone el conductor en la visita y salen del inventario. Los servicios y productos nuevos se crean en el catálogo de <a href="MerTarifario.html#catalogo">Planes y tarifas</a>. Los que no son mensuales (cada 3 meses…) se cobran repartidos al mes.</div></div>';
  }
  function enServicios() {
    var cu = $('cuerpo');
    cu.onchange = cu.oninput = function (e) {
      var t = e.target, tr = t.closest('tr[data-v]'), f = t.getAttribute('data-f'); if (!tr || !f) return;
      var sv = C.grupos[Number(tr.getAttribute('data-g'))].servicios[Number(tr.getAttribute('data-v'))];
      if (f === 'cantidad') sv.cantidad = t.value === 'solicitud' ? 'solicitud' : Number(t.value);
      else if (f === 'precio') sv.precio = Number(t.value) || 0; else sv[f] = t.value;
      if (f === 'cantidad' && t.value === 'solicitud') sv.cada = 'solicitud';
      if (f === 'modo' && sv.modo === 'cobrado' && !sv.precio) sv.precio = catPor(sId(sv)).precio || 0;
      srvNorm(sv);
      if (e.type === 'change' && (f === 'modo' || f === 'cantidad' || f === 'cada')) recalcular(function () { pintar(); });
      else recalcular(function () { var cs = (CAL.grupos[Number(tr.getAttribute('data-g'))].servicios || [])[Number(tr.getAttribute('data-v'))]; if (cs) tr.querySelector('[data-tot]').innerHTML = '<b>' + (sv.modo === 'cobrado' ? d2(cs.total) : 'incluido') + '</b><div class="sm mut">' + (CADA_MESES[sv.cada] ? (sv.modo === 'cobrado' ? 'al mes · repartida' : E(CADA_TX[sv.cada])) : cs.cantidadMes + ' al mes') + '</div>'; });

  function elegirCatalogo(gi) {

      (L.length ? '<div class="cat">' + L.map(function (c) {

          E(c.tipo === 'servicio' ? 'Servicio' : c.tipo === 'prestamo' ? 'Préstamo' : 'Producto') + (c.stock != null ? ' · quedan ' + c.stock : '') + (c.precio ? ' · ' + d2(c.precio) : '') + ' · ' + E(QUIEN[c.quien] || '') + '</div></button>';
      }).join('') + '</div>' : MK.vacio('Ya están todos. Crea uno nuevo en el catálogo de Planes y tarifas.')) +

      };
    });
  }

  /* api 3.13: el catálogo sabe a qué propuesta y a qué grupo volver */
  function enlaceCatalogo(gi) {
    return MK.enlaceCatalogo('MerCuenta.html?id=' + encodeURIComponent(COD) + '&paso=4&grupo=' + (gi + 1), D.oportunidad.empresa || COD);
  }
  /* de vuelta del catálogo (…&agregar=<id>&grupo=<n>): el artículo nuevo entra a ese grupo y se avisa */
  function agregarDelCatalogo() {
    var id = AGREGAR; AGREGAR = ''; MK.quitarParam(['agregar', 'grupo']);

  /* ═══ 5 · facturación y cobro ═══ */

    var pags = (C.pagadores || []).map(function (p, i) {
      var f = function (k, l, ph) { return '<div><label class="l">' + l + '</label><input class="in" data-p="' + i + '" data-k="' + k + '" value="' + E(p[k] == null ? '' : p[k]) + '"' + (ph ? ' placeholder="' + E(ph) + '"' : '') + '></div>'; };
      var sedes = C.facturacion === 'consolidada' ? 'todas las sedes' : (p.sedes || []).map(function (id) { return nomSede[id] || id; }).join(', ');

      (C.facturacionCliente ? '<div class="avi vd">' + IC('check', 16) + '<div>El cliente eligió en su enlace: <b>' + E(FAC[C.facturacionCliente] ? FAC[C.facturacionCliente][0].toLowerCase() : C.facturacionCliente) + '</b>.</div></div>' : '') + '</div>' +
      '<div class="cd"><h3>' + IC('persona', 16) + 'Quién paga · a quién se cobra</h3>' + pags +
      '<div class="avi vd">' + IC('check', 16) + '<div>Las facturas, los estados de cuenta y las cartas de cobro van <b>solo</b> al contacto de cobro del pagador. Nunca a una sede.</div></div></div></div>';
  }
  function enFacturacion() {

      var t = e.target;

  /* ═══ 6 · revisar y enviar ═══ */
  function pRevisar() {
    var docs = D.docsLista || [];
    var filas = CAL.grupos.map(function (g) {
      return '<tr><td><b>' + E(g.nombre) + '</b>' + (g.aSolicitud ? ' <span class="tg am">a solicitud</span>' : '') + (g.plan ? '<div class="sm mut">plan «' + E(g.plan.nombre) + '»</div>' : '') + '</td><td class="n">' + g.sedes.length + '</td><td class="n">' + g.visitasMes + '</td><td class="n">' + Math.round(g.kgIncluidosCalc) + '</td>' +
        '<td class="n">' + n2(g.precioFinal) + (g.precio != null && g.diferencia ? ' <span class="dif ' + (g.diferencia < 0 ? 'bj' : 'sb') + '">' + (g.diferencia > 0 ? '+' : '') + g.diferencia + ' %</span>' : '') + '</td><td class="n">' + (g.serviciosMes ? n2(g.serviciosMes) : '—') + '</td><td class="n"><b>' + n2(g.total) + '</b></td></tr>';
    }).join('');
    var sinPrecio = CAL.grupos.filter(function (g) { return !(g.precioFinal > 0); }).length, sinCorreo = !(C.contactoCorp && C.contactoCorp.correo), sinCobro = (C.pagadores || []).filter(function (p) { return !p.correo; }).length;
    var alDia = [];
    if (sinPrecio) alDia.push('hay un grupo sin precio');
    if (sinCorreo) alDia.push('falta el correo del contacto corporativo (paso 1)');
    if (sinCobro) alDia.push('falta el correo de cobro de ' + sinCobro + ' pagador' + (sinCobro > 1 ? 'es' : '') + ' (paso 5)');
    var abrir = []; C.grupos.forEach(function (g) { g.sedes.forEach(function (s) { if (/abrir/i.test(s.desde || '')) abrir.push(s.nombre); }); });
    return '<div class="dos" style="grid-template-columns:minmax(0,1fr) 320px"><div><div class="cd"><h3>' + IC('documento', 16) + 'Resumen de la propuesta ' + E(COD) + '</h3>' +
      '<div class="tw"><table class="t"><thead><tr><th>Grupo</th><th class="n">Sedes</th><th class="n">Visitas</th><th class="n">Kg incl.</th><th class="n">Recolección</th><th class="n">Servicios</th><th class="n">Al mes</th></tr></thead><tbody>' + filas +
      '<tr class="tt"><td>Subtotal</td><td class="n">' + CAL.sedes + '</td><td class="n">' + CAL.visitasMes + '</td><td class="n">' + Math.round(CAL.kgTotal) + '</td><td></td><td></td><td class="n">' + n2(CAL.subtotal) + '</td></tr></tbody></table></div>' +
      (abrir.length ? '<div class="avi am">' + IC('info', 16) + '<div>' + E(abrir.join(', ')) + ' se cobra' + (abrir.length > 1 ? 'n' : '') + ' desde su apertura: la propuesta lo dice y la factura no la' + (abrir.length > 1 ? 's' : '') + ' incluye hasta que abra' + (abrir.length > 1 ? 'n' : '') + '.</div></div>' : '') +
      (C.aceptadas ? '<div class="avi vd">' + IC('check', 16) + '<div>El cliente aceptó <b>' + C.aceptadas.length + ' de ' + CAL.sedes + '</b> sedes en su enlace. Al pasar a cartera solo van esas.</div></div>' : '') + '</div>' +
      '<div class="cd"><h3>' + IC('contrato', 16) + 'Condiciones</h3><div class="g g3">' +
      '<div><label class="l" for="r-vig">Válida hasta</label><input class="in" type="date" id="r-vig" value="' + E(C.vigencia) + '"></div>' +
      '<div><label class="l" for="r-pla">Plazo del contrato</label><select class="sel" id="r-pla">' + [6, 12, 24, 36].map(function (m) { return '<option value="' + m + '"' + (Number(C.plazo) === m ? ' selected' : '') + '>' + m + ' meses</option>'; }).join('') + '</select></div>' +
      '<div><label class="l">Facturación</label><div style="padding:9px 0;font-weight:700">' + E(FAC[C.facturacion][0]) + '</div></div></div>' +
      '<label class="l" style="margin-top:12px">Documentos que se le piden (una sola vez por RUC)</label><div class="fx">' + docs.map(function (d) { return '<label class="chip' + (C.documentos.indexOf(d[0]) >= 0 ? ' on' : '') + '"><input type="checkbox" data-doc="' + E(d[0]) + '"' + (C.documentos.indexOf(d[0]) >= 0 ? ' checked' : '') + ' style="display:none">' + E(d[1]) + '</label>'; }).join('') + '</div></div></div>' +
      '<div class="lat"><div class="cd"><h3>' + IC('billete', 16) + 'Total mensual</h3><div class="rw"><span>Subtotal</span><b>' + d2(CAL.subtotal) + '</b></div><div class="rw"><span>' + (CAL.exento ? 'ITBMS · cliente exento' : 'ITBMS 7 %') + '</span><b>' + d2(CAL.itbms) + '</b></div><div class="big"><span>TOTAL</span><span>' + d2(CAL.total) + '</span></div>' +
      (alDia.length ? '<div class="avi am">' + IC('alerta', 16) + '<div>Antes de enviar: ' + E(alDia.join('; ')) + '.</div></div>' : '') +
      '<div style="display:grid;gap:8px;margin-top:12px"><a class="btn" href="Propuesta.html?cod=' + encodeURIComponent(COD) + '" target="_blank" id="r-ver">' + IC('ojo', 14) + ' Ver la propuesta impresa</a>' +
      '<button class="btn pri" id="r-env" data-rw>' + IC('correo', 14) + ' Enviar por correo con su enlace</button></div>' +
      '<div class="nota">El contacto corporativo recibe el correo con el enlace: ahí ve la propuesta, marca las sedes que acepta y elige la factura. La etapa pasa sola a «Propuesta enviada».</div></div></div></div>';
  }
  function enRevisar() {
    $('r-vig').onchange = function () { C.vigencia = this.value; CAMBIOS = true; };
    $('r-pla').onchange = function () { C.plazo = Number(this.value); CAMBIOS = true; };
    [].forEach.call(document.querySelectorAll('[data-doc]'), function (x) { x.onchange = function () { var k = x.getAttribute('data-doc'), i = C.documentos.indexOf(k); if (x.checked && i < 0) C.documentos.push(k); if (!x.checked && i >= 0) C.documentos.splice(i, 1); x.parentNode.classList.toggle('on', x.checked); CAMBIOS = true; }; });
    $('r-ver').onclick = function (e) { if (CAMBIOS && !RO) { e.preventDefault(); var w = window.open('', '_blank'); guardar().then(function () { if (w) w.location = 'Propuesta.html?cod=' + encodeURIComponent(COD); }); } };
    $('r-env').onclick = enviar;
  }
  function enviar() {
    var cc = C.contactoCorp || {};
    if (!cc.correo) { MK.aviso('Falta el correo del contacto corporativo (paso 1).'); return; }
    var b = $('r-env'); MK.ocupado(b, true);
    guardar(5).then(function (ok) {
      if (!ok) { MK.ocupado(b, false); return; }
      return MK.api('api_crmOportunidad', MK.pin, COD).then(function (r) {
        MK.ocupado(b, false);
        var op = (r && r.oportunidad) || {}, docs = (r && r.documentos) || [], estado = op.estado;
        var base = new URL('index.html', location.href).href.replace(/index\.html$/, '');
        var enlace = base + '?p=formulario&token=' + encodeURIComponent(COD) + (op.formClave ? '&k=' + op.formClave : '');
        MK.mensaje({ canal: 'correo', correo: cc.correo, ref: COD, refTipo: 'op', cuenta: D.oportunidad.empresa, contacto: cc.nombre, momento: 'Propuesta enviada',
          vars: { propuesta: COD, enlace: enlace },
          texto: 'Buen día' + (cc.nombre ? ' ' + cc.nombre : '') + ':\n\nLe compartimos la propuesta ' + COD + ' de ECOVSA para ' + CAL.sedes + ' sede' + (CAL.sedes === 1 ? '' : 's') + ' de ' + D.oportunidad.empresa + '. ' +
            'En este enlace la puede ver completa, marcar las sedes que acepta y elegir cómo prefiere la factura:\n\n' + enlace + '\n\nQuedamos atentos a cualquier consulta.',
          alEnviar: function () { anotarEnvio(docs, estado); } });
      });
    });
  }
  /* queda anotado el envío (documento con su vigencia) y la etapa se mueve */
  function anotarEnvio(docs, estado) {
        var cc = C.contactoCorp || {};
        var prev = docs.filter(function (d) { return d.tipo === 'propuesta' && d.estado !== 'firmada'; })[0];
        var d = prev ? { id: prev.id, estado: 'enviada', canal: 'correo', enviadoA: (cc.nombre || '') + ' · ' + cc.correo, validoHasta: C.vigencia, nuevaVersion: true, evento: 'Enviado' }
          : { tipo: 'propuesta', ref: COD, refTipo: 'op', cuenta: D.oportunidad.empresa, nombre: 'Propuesta ' + COD, estado: 'enviada', canal: 'correo', enviadoA: (cc.nombre || '') + ' · ' + cc.correo, validoHasta: C.vigencia, enlace: 'Propuesta.html?cod=' + encodeURIComponent(COD), evento: 'Enviado' };
        MK.api('api_crmGuardarDocumento', MK.pin, d).then(function () {
          var iA = ['Registrado', 'Formulario enviado', 'Formulario recibido'].indexOf(estado);
          return iA >= 0 ? MK.api('api_crmMoverEtapa', MK.pin, [COD], 'Propuesta enviada', { nota: 'se envió la propuesta de la cuenta (' + CAL.sedes + ' sedes)' }) : null;
        }).then(function () { D.oportunidad.estado = ['Registrado', 'Formulario enviado', 'Formulario recibido'].indexOf(estado) >= 0 ? 'Propuesta enviada' : estado; MK.aviso('Envío anotado · la etapa quedó en «' + D.oportunidad.estado + '»'); pintar(); }, function () {});
  }
  window.addEventListener('beforeunload', function (e) { if (CAMBIOS && !RO) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
