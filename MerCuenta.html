  escritura:/^api_(crm(Guardar|Completar|Anular|Captura|Mover|Reasignar|Borrar|Subir|Usar)|guardar|marcar|abrir|cerrar|registrar|borrar|eliminar|crear|actualizar|enviar|corregir|dar|anular|confirmar|aprobar|rechazar|subir|asignar|mover|cambiar|agregar|nuevo|editar|reabrir|emitir|pasar|pedir)/i};</script>

<style>
/* api 3.11 · Cuenta de gran generador (maqueta 44) */
.w44{--nv:var(--navy);--ln:var(--line);--ln2:var(--line2);--mu:var(--muted);font-size:13.5px}
.w44 .crumb2{font-size:13px;color:var(--mu);margin-bottom:6px}.w44 .crumb2 a{color:var(--mu)}
.w44 h1{font-size:22px;margin:0 0 4px;color:var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.w44 .lead{color:var(--mu);font-size:13px;margin-bottom:14px}
.w44 .stp{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.w44 .stp>button{flex:1;min-width:120px;border-radius:10px;padding:8px 11px;background:#f3f5f8;color:#8a96a8;border:0;text-align:left;font:inherit;cursor:pointer}
.w44 .stp>button.ok{background:#eaf6e4;color:#2f6b0a}.w44 .stp>button.on{background:var(--nv);color:#fff}
.w44 .stp b{display:block;font-size:12.5px}.w44 .stp small{font-size:11.5px;opacity:.9}
.w44 .cd{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.w44 .cd h3{font-size:12px;letter-spacing:.9px;color:#5b6a80;font-weight:700;margin:0 0 12px;text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w44 .g{display:grid;gap:12px}.w44 .g2{grid-template-columns:1fr 1fr}.w44 .g3{grid-template-columns:repeat(3,1fr)}.w44 .g4{grid-template-columns:repeat(4,1fr)}
.w44 .dos{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.w44 label.l{display:block;font-size:11px;letter-spacing:.7px;color:#5b6a80;font-weight:700;text-transform:uppercase;margin-bottom:5px}
.w44 .in.ed{border-color:#d99a00;background:#fffdf6}.w44 .in.n{text-align:right;font-variant-numeric:tabular-nums}
.w44 .tw{overflow-x:auto}
.w44 table.t{width:100%;border-collapse:collapse}
.w44 table.t th{text-align:left;font-size:10.5px;letter-spacing:.6px;color:#5b6a80;text-transform:uppercase;padding:6px 7px;border-bottom:1px solid var(--ln);white-space:nowrap}
.w44 table.t td{padding:6px 7px;border-bottom:1px solid var(--ln2);vertical-align:middle}
.w44 table.t .in,.w44 table.t .sel{padding:6px 8px;font-size:13px}
.w44 .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.w44 tr.tt td{font-weight:800;background:#f5f8fd;border-top:1px solid var(--ln)}
.w44 tr.sub td{border-bottom:1px solid var(--ln);padding-top:0;background:#fbfcfe}
.w44 .tg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.w44 .az{background:#e7edf7;color:#1d3f86}.w44 .vd{background:#eaf6e4;color:#1f6b35}.w44 .am{background:#fff4d6;color:#8a6100}.w44 .rj{background:#fdecea;color:#a8262b}.w44 .gr{background:#eef1f5;color:#5d6b80}.w44 .mo{background:#f1ecfa;color:#6c3a96}
.w44 .bar{display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--ln);padding-top:14px;margin-top:4px;position:sticky;bottom:0;background:var(--bg,#f4f6f9);padding-bottom:10px;z-index:3}
.w44 .add{border:1.5px dashed #c9d5e8;background:#fff;border-radius:10px;padding:7px 12px;font:700 12.5px Archivo,sans-serif;color:var(--nv);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.w44 .nota{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5}
.w44 .avi{display:flex;gap:10px;align-items:flex-start;border-radius:11px;padding:10px 12px;font-size:12.8px;line-height:1.5;margin-top:10px}
.w44 .avi.az{border:1px solid #c9d8f5;background:#eef4ff}.w44 .avi.am{border:1px solid #f1d48a;background:#fffbef}.w44 .avi.vd{border:1px solid #bfe3b3;background:#f4fbf0}.w44 .avi.rj{border:1px solid #f3c2c4;background:#fffafa}
.w44 .dif{font-size:11.5px;font-weight:800}.w44 .dif.bj{color:#a8262b}.w44 .dif.sb{color:#1f6b35}
.w44 .lat{position:sticky;top:76px}
.w44 .rw{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln2);font-size:13px}.w44 .rw b{font-variant-numeric:tabular-nums;text-align:right}
.w44 .big{background:var(--nv);color:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.w44 .fx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.w44 .sp{flex:1}.w44 .mut{color:var(--mu)}.w44 .sm{font-size:12px}
.w44 .ejemplo{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;background:#fff4d6;color:#8a6100;border-radius:5px;padding:1px 6px;margin-left:4px}
.w44 .pag{border:1.5px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:10px;background:#fff}
.w44 .pag.on{border-color:var(--nv);background:#f8fafe}
.w44 label.pag{display:block;cursor:pointer}
.w44 .rad{width:18px;height:18px;border-radius:50%;border:2px solid #b3c0d4;display:inline-block;flex:none}.w44 .rad.on{border:5px solid var(--nv)}
.w44 .ico{background:none;border:0;cursor:pointer;color:#8a96a8;padding:4px;border-radius:6px}.w44 .ico:hover{color:#a8262b;background:#fdecea}
.w44 .gnom{font:700 14px Archivo,sans-serif;border:1px solid transparent;border-radius:8px;padding:4px 6px;color:var(--ink);background:transparent;min-width:220px}
.w44 .gnom:hover,.w44 .gnom:focus{border-color:var(--ln);background:#fff}
.w44 .guardado{font-size:12px;color:#2f6b0a;font-weight:700}
.w44 .cat{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.w44 .cat button{text-align:left;border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;cursor:pointer}
.w44 .cat button:hover{border-color:var(--nv)}
.hoja .cat{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:10px}
.hoja .cat button{text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;cursor:pointer}
.hoja .cat button:hover{border-color:var(--navy)}
@media (max-width:900px){.w44 .dos,.w44 .g3,.w44 .g4{grid-template-columns:1fr}.w44 .g2{grid-template-columns:1fr}.w44 .lat{position:static}}
</style>

<body class="mk">
<div id="sysbar"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"><div class="cargando">Cargando la cuenta…</div></main></div>
<script>
(function () {
  var COD = MK.param('id'), D = null, C = null, CAL = null, K = 0, CAMBIOS = false, tCalc = null, RO = false;
  var E = MK.esc, IC = MK.ic;
  var PASOS = [['La cuenta', 'quién es el cliente'], ['Sedes', 'dónde y cuánto genera'], ['Precio', 'referencia y precio final'], ['Servicios y productos', 'fumigación, envases…'], ['Facturación y cobro', 'quién paga y a quién se cobra'], ['Revisar y enviar', 'propuesta y enlace']];
  var FAC = { consolidada: ['Una sola factura para toda la cuenta', 'Una factura al mes con el detalle de cada sede. Se cobra a un solo pagador.'],
              sede: ['Una factura por sede', 'Cada sede tiene su factura y su propio cobro: la carta solo le llega a la sede que debe.'],
              grupo: ['Una factura por grupo', 'Una factura por cada grupo (por ejemplo, sus sedes en una y las clínicas externas en otra).'] };
  var FREC = [['', 'La sugerida'], ['8', '2 por semana (8)'], ['4', 'Semanal (4)'], ['2', 'Quincenal (2)'], ['1', 'Mensual (1)'], ['0.5', 'Bimestral'], ['0.34', 'Trimestral']];
  var d2 = function (n) { return 'B/. ' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var n2 = function (n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var $ = function (id) { return document.getElementById(id); };
  var idN = function (p) { return p + Math.random().toString(36).slice(2, 8).toUpperCase(); };
  var calG = function (gid) { return ((CAL && CAL.grupos) || []).filter(function (g) { return g.id === gid; })[0] || null; };
  var calS = function (sid) { var r = null; ((CAL && CAL.grupos) || []).forEach(function (g) { g.sedes.forEach(function (s) { if (s.id === sid) r = s; }); }); return r; };
  var catPor = function (id) { return (D.catalogo || []).filter(function (c) { return c.id === id; })[0] || {}; };
  var frecTxt = function (v) { v = Number(v); return v >= 8 ? '2 por semana' : v >= 4 ? 'Semanal' : v >= 2 ? 'Quincenal' : v >= 1 ? 'Mensual' : v >= 0.5 ? 'Bimestral' : 'Trimestral'; };

  MK.iniciar('cuenta', function () {
    if (!COD) { MK.error('main', 'Falta el código de la oportunidad.'); return; }
    cargar();
  });
  function cargar() {
    MK.api('api_cuentaGran', MK.pin, COD).then(function (r) {
      if (!r || !r.ok) { MK.error('main', (r && r.error) || 'No se pudo cargar.'); return; }
      D = r; C = r.cuenta; CAL = r.calculo;
      RO = !r.editar || ['Firmado', 'Pasado a cartera'].indexOf(r.oportunidad.estado) >= 0;
      var p = Number(MK.param('paso')); K = p >= 1 && p <= 6 ? p - 1 : Math.min(5, Number(C.paso) || 0);
      pintar();
    }, function (e) { MK.error('main', e.message); });
  }

  /* ═══ marco ═══ */
  function pintar() {
    var O = D.oportunidad;
    var tags = '<span class="tg az">GRAN GENERADOR</span>' + (O.reactivacion ? ' <span class="tg am">' + IC('renovar', 12) + ' reactivación</span>' : '') +
      (O.clienteOrigen ? ' <a class="tg gr" href="MerCliente.html?id=' + encodeURIComponent(O.clienteOrigen) + '">CLI-' + ('000' + O.clienteOrigen).slice(-3) + '</a>' : '') + ' ' + MK.ETAPA_TAG(O.estado);
    var cuerpo = [pCuenta, pSedes, pPrecio, pServicios, pFacturacion, pRevisar][K]();
    $('main').innerHTML = '<div class="w44"><div class="crumb2"><a href="MerOportunidades.html">Oportunidades</a> / <a href="MerOportunidad.html?id=' + encodeURIComponent(COD) + '">' + E(COD) + '</a> · <b>gran generador</b></div>' +
      '<h1>' + E(O.empresa || 'Sin nombre') + ' ' + tags + '</h1>' +
      '<div class="lead">' + (RO ? (D.editar ? 'La oportunidad ya está firmada: la cuenta se ve, pero no se cambia.' : 'Solo consulta.') : 'Se guarda en cada paso: se puede dejar a medias y seguir después.') + ' <span class="guardado" id="gd"></span></div>' +
      '<div class="stp">' + PASOS.map(function (p, i) { return '<button type="button" data-k="' + i + '" class="' + (i < K ? 'ok' : i === K ? 'on' : '') + '"><b>' + (i < K ? '✓ ' : (i + 1) + ' · ') + p[0] + '</b><small>' + p[1] + '</small></button>'; }).join('') + '</div>' +
      '<div id="cuerpo">' + cuerpo + '</div>' +
      '<div class="bar"><button class="btn" id="b-atras">' + IC('atras', 14) + (K ? ' Atrás' : ' A la ficha') + '</button><span class="sm mut">Paso ' + (K + 1) + ' de 6</span>' +
      (K < 5 ? '<button class="btn pri" id="b-sig">Siguiente ' + IC('flecha', 14) + '</button>' : '<a class="btn" href="MerOportunidad.html?id=' + encodeURIComponent(COD) + '">Ir a la ficha ' + IC('flecha', 14) + '</a>') + '</div></div>';
    [].forEach.call(document.querySelectorAll('.stp [data-k]'), function (b) { b.onclick = function () { ir(Number(b.getAttribute('data-k'))); }; });
    $('b-atras').onclick = function () { if (K) ir(K - 1); else guardar().then(function () { MK.irOportunidad(COD); }); };
    if ($('b-sig')) $('b-sig').onclick = function () { ir(K + 1); };
    [enCuenta, enSedes, enPrecio, enServicios, enFacturacion, enRevisar][K]();
    if (RO) [].forEach.call(document.querySelectorAll('#cuerpo input,#cuerpo select,#cuerpo textarea,#cuerpo .add,#cuerpo .ico,#cuerpo [data-rw]'), function (x) { x.disabled = true; });
    window.scrollTo(0, 0);
  }
  function ir(k) {
    if (k === K) return;
    clearTimeout(tCalc);
    guardar(Math.max(Number(C.paso) || 0, k)).then(function (ok) { if (ok !== false) { K = k; pintar(); } });
  }
  function guardar(paso) {
    if (RO) return Promise.resolve(true);
    if (paso != null) C.paso = paso;
    var datos = D._datos || {};
    return MK.api('api_guardarCuentaGran', MK.pin, COD, C, datos).then(function (r) {
      if (!r || !r.ok) { MK.aviso((r && r.error) || 'No se pudo guardar.'); return false; }
      C = r.cuenta; CAL = r.calculo; CAMBIOS = false; D._datos = {};
      if (datos.empresa) D.oportunidad.empresa = datos.empresa;
      var g = $('gd'); if (g) g.textContent = '✓ guardado';
      return true;
    }, function (e) { MK.aviso(e.message); return false; });
  }
  /* recalcula sin guardar (el precio y el plan sugerido al escribir) */
  function recalcular(despues) {
    CAMBIOS = true; clearTimeout(tCalc);
    var enK = K;
    tCalc = setTimeout(function () {
      MK.api('api_calcularCuentaGran', MK.pin, C).then(function (r) { if (r && r.ok && enK === K) { CAL = r.calculo; if (despues) despues(); } }, function () {});
    }, 350);
  }

  /* ═══ 1 · la cuenta ═══ */
  function pCuenta() {
    var O = D.oportunidad, cc = C.contactoCorp || {};
    var f = function (id, l, v, ph, ro) { return '<div><label class="l" for="' + id + '">' + l + '</label><input class="in" id="' + id + '" value="' + E(v || '') + '"' + (ph ? ' placeholder="' + E(ph) + '"' : '') + (ro ? ' readonly' : '') + '></div>'; };
    var ro = !!O.clienteOrigen;
    return '<div class="dos" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)"><div class="cd"><h3>' + IC('edificio', 16) + 'Datos de la cuenta</h3><div class="g g2">' +
      f('c-emp', 'Nombre comercial', O.empresa) + f('c-raz', 'Razón social', O.razon, '', ro && O.razon) + f('c-ruc', 'RUC', O.ruc, '', ro && O.ruc) + f('c-dv', 'DV', O.dv, '', ro && O.dv) +
      '<div><label class="l" for="c-sec">Sector</label><input class="in" id="c-sec" list="l-sec" value="' + E(O.sector) + '"><datalist id="l-sec">' + ((MK.base.ajustes && MK.base.ajustes.sectores) || []).map(function (s) { return '<option value="' + E(s) + '">'; }).join('') + '</datalist></div>' +
      '<div><label class="l" for="c-fue">¿De dónde vino?</label><input class="in" id="c-fue" list="l-fue" value="' + E(O.fuente) + '"><datalist id="l-fue">' + ((MK.base.ajustes && MK.base.ajustes.fuentes) || []).map(function (s) { return '<option value="' + E(s) + '">'; }).join('') + '</datalist></div>' +
      '</div>' + (ro ? '<div class="nota">Los datos en gris vienen de su ficha de cliente (<a href="MerCliente.html?id=' + encodeURIComponent(O.clienteOrigen) + '">CLI-' + ('000' + O.clienteOrigen).slice(-3) + '</a>): se corrigen allá.</div>' : '') + '</div>' +
      '<div class="cd"><h3>' + IC('persona', 16) + 'Contacto corporativo</h3><div class="g">' +
      f('k-nom', 'Nombre', cc.nombre) + f('k-car', 'Cargo', cc.cargo) + f('k-cor', 'Correo', cc.correo) + f('k-cel', 'Celular', cc.celular) + '</div>' +
      '<div class="nota">A este contacto le llegan la propuesta y el enlace por correo. El contacto de cada sede y el de cobro se piden más adelante.</div></div></div>';
  }
  function enCuenta() {
    var mapa = { 'c-emp': 'empresa', 'c-raz': 'razon social', 'c-ruc': 'ruc', 'c-dv': 'dv', 'c-sec': 'sector', 'c-fue': 'fuente' };
    Object.keys(mapa).forEach(function (id) { $(id).oninput = function () { D._datos = D._datos || {}; D._datos[mapa[id]] = this.value; CAMBIOS = true; }; });
    var mk = { 'k-nom': 'nombre', 'k-car': 'cargo', 'k-cor': 'correo', 'k-cel': 'celular' };
    Object.keys(mk).forEach(function (id) { $(id).oninput = function () { C.contactoCorp[mk[id]] = this.value; CAMBIOS = true; }; });
  }

  /* ═══ 2 · sedes ═══ */
  function pSedes() {
    var html = C.grupos.map(function (g, gi) {
      var cg = calG(g.id) || { sedes: [], kgMes: 0, visitasMes: 0 };
      var filas = g.sedes.map(function (s, si) {
        var cs = calS(s.id) || { plan: { frecuencia: '', porque: '' }, visitasCalc: 0 };
        var vis = s.visitas == null ? '' : String(s.visitas);
        return '<tr data-g="' + gi + '" data-s="' + si + '">' +
          '<td style="min-width:160px"><input class="in" data-f="nombre" value="' + E(s.nombre) + '" placeholder="Nombre de la sede">' + (s.clienteId ? '<div class="sm mut" style="margin-top:3px">' + IC('edificio', 12) + ' su ficha CLI-' + ('000' + s.clienteId).slice(-3) + '</div>' : '') + '</td>' +
          '<td style="min-width:150px"><select class="sel" data-f="zona">' + D.zonas.map(function (z) { return '<option' + (z === s.zona ? ' selected' : '') + '>' + E(z) + '</option>'; }).join('') + '</select>' +
          (s.zona === 'INTERIOR' || s.zona === 'OTRA' || s.km ? '<div class="fx" style="margin-top:4px"><input class="in n" data-f="km" type="number" min="0" style="width:80px" value="' + (s.km || '') + '"><span class="sm mut">km</span></div>' : '') + '</td>' +
          '<td style="width:95px"><input class="in n" data-f="kgMes" type="number" min="0" value="' + (s.kgMes || '') + '"></td>' +
          '<td class="sm" style="text-align:center"><input type="checkbox" data-f="anatomo"' + (s.anatomo ? ' checked' : '') + ' title="Genera anatomopatológico"></td>' +
          '<td style="min-width:150px"><span class="tg vd" data-plan>' + E(g.aSolicitud ? 'A solicitud' : cs.plan.frecuencia || '—') + '</span><div class="sm mut" data-porque style="margin-top:3px">' + E(cs.plan.porque || '') + '</div></td>' +
          '<td style="min-width:140px"><select class="sel" data-f="visitas">' + FREC.map(function (f) { return '<option value="' + f[0] + '"' + (f[0] === vis ? ' selected' : '') + '>' + f[1] + '</option>'; }).join('') + '</select></td>' +
          '<td class="n" data-vis><b>' + (cs.visitasCalc || 0) + '</b></td>' +
          '<td style="min-width:120px"><input class="in" data-f="desde" value="' + E(s.desde) + '" placeholder="ya / al abrir / fecha"></td>' +
          '<td><button class="ico" data-quitar title="Quitar la sede">' + IC('basura', 15) + '</button></td></tr>' +
          '<tr class="sub" data-g="' + gi + '" data-s="' + si + '"><td colspan="9"><div class="g g4" style="gap:8px">' +
          '<input class="in" data-f="direccion" value="' + E(s.direccion) + '" placeholder="Dirección">' +
          '<input class="in" data-f="contacto" value="' + E(s.contacto) + '" placeholder="Contacto en la sede">' +
          '<input class="in" data-f="telefono" value="' + E(s.telefono) + '" placeholder="Teléfono">' +
          '<input class="in" data-f="correo" value="' + E(s.correo) + '" placeholder="Correo"></div></td></tr>';
      }).join('');
      return '<div class="cd" data-grupo="' + gi + '"><h3>' + IC(gi ? 'personas' : 'edificio', 16) + 'Grupo ' + (gi + 1) + ' · <input class="gnom" data-gf="nombre" value="' + E(g.nombre) + '"><span class="sp"></span>' +
        '<label class="fx sm" style="text-transform:none;letter-spacing:0;font-weight:600"><input type="checkbox" data-gf="aSolicitud"' + (g.aSolicitud ? ' checked' : '') + '> a solicitud</label>' +
        '<span class="tg gr">' + g.sedes.length + ' sede' + (g.sedes.length === 1 ? '' : 's') + '</span>' + (C.grupos.length > 1 ? '<button class="ico" data-quitarg title="Quitar el grupo">' + IC('basura', 15) + '</button>' : '') + '</h3>' +
        '<div class="tw"><table class="t"><thead><tr><th>Sede</th><th>Zona (del mapa)</th><th class="n">Kg al mes</th><th>Anatomo.</th><th>Plan sugerido</th><th>Visitas al mes</th><th class="n">Visitas</th><th>Desde</th><th></th></tr></thead><tbody>' + filas +

    return '<div class="dos" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)"><div class="cd"><h3>' + IC('billete', 16) + '¿Cómo se factura?</h3>' + op('consolidada') + op('sede') + op('grupo') +
      '<div class="nota">Deja la que el cliente pidió. Si no lo sabe, la elige en su enlace al aceptar (y aquí se ajustan los contactos de cobro).</div>' +
      (C.facturacionCliente ? '<div class="avi vd">' + IC('check', 16) + '<div>El cliente eligió en su enlace: <b>' + E(FAC[C.facturacionCliente] ? FAC[C.facturacionCliente][0].toLowerCase() : C.facturacionCliente) + '</b>.</div></div>' : '') + '</div>' +
      '<div class="cd"><h3>' + IC('persona', 16) + 'Quién paga · a quién se cobra</h3>' + pags +
      '<div class="avi vd">' + IC('check', 16) + '<div>Las facturas, los estados de cuenta y las cartas de cobro van <b>solo</b> al contacto de cobro del pagador. Nunca a una sede.</div></div></div></div>';
  }
  function enFacturacion() {
    var cu = $('cuerpo');
    cu.onchange = function (e) {
      var t = e.target;
      if (t.name === 'fac') { C.facturacion = t.value; guardar().then(function () { pintar(); }); }
    };
    cu.oninput = function (e) {
      var t = e.target; if (!t.hasAttribute('data-p')) return;
      var p = C.pagadores[Number(t.getAttribute('data-p'))], k = t.getAttribute('data-k');
      p[k] = k === 'credito' ? Number(t.value) || 30 : t.value; CAMBIOS = true;
    };
  }

  /* ═══ 6 · revisar y enviar ═══ */
  function pRevisar() {
    var docs = D.docsLista || [];
    var filas = CAL.grupos.map(function (g) {
      return '<tr><td><b>' + E(g.nombre) + '</b>' + (g.aSolicitud ? ' <span class="tg am">a solicitud</span>' : '') + '</td><td class="n">' + g.sedes.length + '</td><td class="n">' + g.visitasMes + '</td><td class="n">' + Math.round(g.kgIncluidosCalc) + '</td>' +
        '<td class="n">' + n2(g.precioFinal) + (g.precio != null && g.diferencia ? ' <span class="dif ' + (g.diferencia < 0 ? 'bj' : 'sb') + '">' + (g.diferencia > 0 ? '+' : '') + g.diferencia + ' %</span>' : '') + '</td><td class="n">' + (g.serviciosMes ? n2(g.serviciosMes) : '—') + '</td><td class="n"><b>' + n2(g.total) + '</b></td></tr>';
    }).join('');
    var sinPrecio = CAL.grupos.filter(function (g) { return !(g.precioFinal > 0); }).length, sinCorreo = !(C.contactoCorp && C.contactoCorp.correo), sinCobro = (C.pagadores || []).filter(function (p) { return !p.correo; }).length;
    var alDia = [];
    if (sinPrecio) alDia.push('hay un grupo sin precio');
    if (sinCorreo) alDia.push('falta el correo del contacto corporativo (paso 1)');
    if (sinCobro) alDia.push('falta el correo de cobro de ' + sinCobro + ' pagador' + (sinCobro > 1 ? 'es' : '') + ' (paso 5)');
    var abrir = []; C.grupos.forEach(function (g) { g.sedes.forEach(function (s) { if (/abrir/i.test(s.desde || '')) abrir.push(s.nombre); }); });
    return '<div class="dos" style="grid-template-columns:minmax(0,1fr) 320px"><div><div class="cd"><h3>' + IC('documento', 16) + 'Resumen de la propuesta ' + E(COD) + '</h3>' +
      '<div class="tw"><table class="t"><thead><tr><th>Grupo</th><th class="n">Sedes</th><th class="n">Visitas</th><th class="n">Kg incl.</th><th class="n">Recolección</th><th class="n">Servicios</th><th class="n">Al mes</th></tr></thead><tbody>' + filas +
      '<tr class="tt"><td>Subtotal</td><td class="n">' + CAL.sedes + '</td><td class="n">' + CAL.visitasMes + '</td><td class="n">' + Math.round(CAL.kgTotal) + '</td><td></td><td></td><td class="n">' + n2(CAL.subtotal) + '</td></tr></tbody></table></div>' +
      (abrir.length ? '<div class="avi am">' + IC('info', 16) + '<div>' + E(abrir.join(', ')) + ' se cobra' + (abrir.length > 1 ? 'n' : '') + ' desde su apertura: la propuesta lo dice y la factura no la' + (abrir.length > 1 ? 's' : '') + ' incluye hasta que abra' + (abrir.length > 1 ? 'n' : '') + '.</div></div>' : '') +
      (C.aceptadas ? '<div class="avi vd">' + IC('check', 16) + '<div>El cliente aceptó <b>' + C.aceptadas.length + ' de ' + CAL.sedes + '</b> sedes en su enlace. Al pasar a cartera solo van esas.</div></div>' : '') + '</div>' +
      '<div class="cd"><h3>' + IC('contrato', 16) + 'Condiciones</h3><div class="g g3">' +
      '<div><label class="l" for="r-vig">Válida hasta</label><input class="in" type="date" id="r-vig" value="' + E(C.vigencia) + '"></div>' +
      '<div><label class="l" for="r-pla">Plazo del contrato</label><select class="sel" id="r-pla">' + [6, 12, 24, 36].map(function (m) { return '<option value="' + m + '"' + (Number(C.plazo) === m ? ' selected' : '') + '>' + m + ' meses</option>'; }).join('') + '</select></div>' +
      '<div><label class="l">Facturación</label><div style="padding:9px 0;font-weight:700">' + E(FAC[C.facturacion][0]) + '</div></div></div>' +
      '<label class="l" style="margin-top:12px">Documentos que se le piden (una sola vez por RUC)</label><div class="fx">' + docs.map(function (d) { return '<label class="chip' + (C.documentos.indexOf(d[0]) >= 0 ? ' on' : '') + '"><input type="checkbox" data-doc="' + E(d[0]) + '"' + (C.documentos.indexOf(d[0]) >= 0 ? ' checked' : '') + ' style="display:none">' + E(d[1]) + '</label>'; }).join('') + '</div></div></div>' +
      '<div class="lat"><div class="cd"><h3>' + IC('billete', 16) + 'Total mensual</h3><div class="rw"><span>Subtotal</span><b>' + d2(CAL.subtotal) + '</b></div><div class="rw"><span>ITBMS 7 %</span><b>' + d2(CAL.itbms) + '</b></div><div class="big"><span>TOTAL</span><span>' + d2(CAL.total) + '</span></div>' +
      (alDia.length ? '<div class="avi am">' + IC('alerta', 16) + '<div>Antes de enviar: ' + E(alDia.join('; ')) + '.</div></div>' : '') +
      '<div style="display:grid;gap:8px;margin-top:12px"><a class="btn" href="Propuesta.html?cod=' + encodeURIComponent(COD) + '" target="_blank" id="r-ver">' + IC('ojo', 14) + ' Ver la propuesta impresa</a>' +
      '<button class="btn pri" id="r-env" data-rw>' + IC('correo', 14) + ' Enviar por correo con su enlace</button></div>' +
      '<div class="nota">El contacto corporativo recibe el correo con el enlace: ahí ve la propuesta, marca las sedes que acepta y elige la factura. La etapa pasa sola a «Propuesta enviada».</div></div></div></div>';
  }
  function enRevisar() {
    $('r-vig').onchange = function () { C.vigencia = this.value; CAMBIOS = true; };
    $('r-pla').onchange = function () { C.plazo = Number(this.value); CAMBIOS = true; };
    [].forEach.call(document.querySelectorAll('[data-doc]'), function (x) { x.onchange = function () { var k = x.getAttribute('data-doc'), i = C.documentos.indexOf(k); if (x.checked && i < 0) C.documentos.push(k); if (!x.checked && i >= 0) C.documentos.splice(i, 1); x.parentNode.classList.toggle('on', x.checked); CAMBIOS = true; }; });
    $('r-ver').onclick = function (e) { if (CAMBIOS && !RO) { e.preventDefault(); var w = window.open('', '_blank'); guardar().then(function () { if (w) w.location = 'Propuesta.html?cod=' + encodeURIComponent(COD); }); } };
    $('r-env').onclick = enviar;
  }
  function enviar() {
    var cc = C.contactoCorp || {};
    if (!cc.correo) { MK.aviso('Falta el correo del contacto corporativo (paso 1).'); return; }
    var b = $('r-env'); MK.ocupado(b, true);
    guardar(5).then(function (ok) {
      if (!ok) { MK.ocupado(b, false); return; }
      return MK.api('api_crmOportunidad', MK.pin, COD).then(function (r) {
        MK.ocupado(b, false);
        var op = (r && r.oportunidad) || {}, docs = (r && r.documentos) || [], estado = op.estado;
        var base = new URL('index.html', location.href).href.replace(/index\.html$/, '');
        var enlace = base + '?p=formulario&token=' + encodeURIComponent(COD) + (op.formClave ? '&k=' + op.formClave : '');
        MK.mensaje({ canal: 'correo', correo: cc.correo, ref: COD, refTipo: 'op', cuenta: D.oportunidad.empresa, contacto: cc.nombre, momento: 'Propuesta enviada',
          vars: { propuesta: COD, enlace: enlace },
          texto: 'Buen día' + (cc.nombre ? ' ' + cc.nombre : '') + ':\n\nLe compartimos la propuesta ' + COD + ' de ECOVSA para ' + CAL.sedes + ' sede' + (CAL.sedes === 1 ? '' : 's') + ' de ' + D.oportunidad.empresa + '. ' +
            'En este enlace la puede ver completa, marcar las sedes que acepta y elegir cómo prefiere la factura:\n\n' + enlace + '\n\nQuedamos atentos a cualquier consulta.',
          alEnviar: function () { anotarEnvio(docs, estado); } });
      });
    });
  }
  /* queda anotado el envío (documento con su vigencia) y la etapa se mueve */
  function anotarEnvio(docs, estado) {
        var cc = C.contactoCorp || {};
        var prev = docs.filter(function (d) { return d.tipo === 'propuesta' && d.estado !== 'firmada'; })[0];
        var d = prev ? { id: prev.id, estado: 'enviada', canal: 'correo', enviadoA: (cc.nombre || '') + ' · ' + cc.correo, validoHasta: C.vigencia, nuevaVersion: true, evento: 'Enviado' }
          : { tipo: 'propuesta', ref: COD, refTipo: 'op', cuenta: D.oportunidad.empresa, nombre: 'Propuesta ' + COD, estado: 'enviada', canal: 'correo', enviadoA: (cc.nombre || '') + ' · ' + cc.correo, validoHasta: C.vigencia, enlace: 'Propuesta.html?cod=' + encodeURIComponent(COD), evento: 'Enviado' };
        MK.api('api_crmGuardarDocumento', MK.pin, d).then(function () {
          var iA = ['Registrado', 'Formulario enviado', 'Formulario recibido'].indexOf(estado);
          return iA >= 0 ? MK.api('api_crmMoverEtapa', MK.pin, [COD], 'Propuesta enviada', { nota: 'se envió la propuesta de la cuenta (' + CAL.sedes + ' sedes)' }) : null;
        }).then(function () { D.oportunidad.estado = ['Registrado', 'Formulario enviado', 'Formulario recibido'].indexOf(estado) >= 0 ? 'Propuesta enviada' : estado; MK.aviso('Envío anotado · la etapa quedó en «' + D.oportunidad.estado + '»'); pintar(); }, function () {});
  }
  window.addEventListener('beforeunload', function (e) { if (CAMBIOS && !RO) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
