    var SG=r.seguridad; if(SG && SG.abiertos){ var ped=SG.pedidos||[]; G.tuyo=[{nivel:"r",tipo:"seguridad",ir:"config",titulo:SG.bloqueos?(SG.bloqueos===1?"Un equipo quedó bloqueado por intentos de PIN":SG.bloqueos+" equipos o redes bloqueados por intentos de PIN"):(ped.length===1?ped[0]+" pide un PIN nuevo":ped.length+" personas piden un PIN nuevo"),texto:(SG.bloqueos&&ped.length?(ped.length===1?ped[0]+" pide un PIN nuevo. ":ped.length+" piden un PIN nuevo. "):"")+"Toca para verlo en Configuración › Seguridad."}].concat(G.tuyo||[]); }
    /* api 3.23: lo que espera al administrador (portal de clientes) sale en «Lo tuyo» y en la franja azul */
    var AD=(r.admin||[]).map(function(a){ return {nivel:a.nivel,tipo:a.tipo,ir:"config",titulo:a.titulo,texto:a.texto,etq:a.etq||"",n:a.n,chip:a.chip}; });
    if(AD.length){ G.tuyo=AD.concat(G.tuyo||[]); var pesoT={r:0,a:1,g:2}; G.tuyo=G.tuyo.map(function(p,i){ return [p,i]; }).sort(function(x,y){ return ((pesoT[x[0].nivel]||0)-(pesoT[y[0].nivel]||0))||(x[1]-y[1]); }).map(function(x){ return x[0]; }); }
    if(SG && SG.abiertos){ var pd=(SG.pedidos||[]).length; if(SG.bloqueos) AD.push({nivel:"r",tipo:"seguridad",n:SG.bloqueos,chip:SG.bloqueos===1?"equipo bloqueado":"equipos bloqueados"}); if(pd) AD.push({nivel:"r",tipo:"seguridad",n:pd,chip:pd===1?"PIN nuevo":"PIN nuevos"}); }
    AD.sort(function(x,y){ return (x.nivel==="r"?0:1)-(y.nivel==="r"?0:1); });
    admH=(rol==="admin"&&AD.length)?'<div class="adm"><h3><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>PARA USTED COMO ADMINISTRADOR</h3><div class="ch">'+
      AD.map(function(a){ return '<button class="'+(a.nivel==="r"?"r":"a")+'" onclick="irTipo(\''+a.tipo+'\')"><i style="background:'+(a.nivel==="r"?"#ff8a75":"#f5b301")+'"></i><span><b>'+esc(a.n)+'</b> '+esc(a.chip)+'</span><span class="ar">›</span></button>'; }).join("")+'</div></div>':"";
    var gT=(G.tuyo||[]).slice(0,rol==="admin"?7:4), gM=(G.modulo||[]).slice(0,G.tuyo&&G.tuyo.length?5:6), gS=(G.sigue||[]).slice(0,4);
    ESPERA=gT.concat(gM,gS); P=ESPERA;
    var mios=(G.tuyo||[]).concat(G.modulo||[]);
    nP=mios.length; nU=mios.filter(function(p){ return p.nivel==="r"; }).length;
  } else {
    P=(r.pendientes||[]).filter(function(p){ return todoRol || p.ir===idT; });
    ESPERA=P;
    nP=todoRol?(r.totalPendientes||P.length):P.length; nU=P.filter(function(p){ return p.nivel==="r"; }).length;
  }
  var subt=nP ? (nP+(nP===1?" asunto de ":" asuntos de ")+nomT+(nP===1?" te espera":" te esperan")+(nU?", "+nU+(nU===1?" urgente":" urgentes"):"")) : "Todo al día en "+nomT;

  $("tablero").innerHTML=
   '<div class="lb"><div class="lg"></div><div class="mk"><b>ECOVSA</b><span>Sistema de operaciones</span></div><div class="sep"></div>'+
   '<span class="fe num">'+esc(fecha)+' · '+ahora.toLocaleTimeString("es-PA",{hour:"numeric",minute:"2-digit"})+'</span><div class="sp"></div>'+
   '<div class="us" role="button" tabindex="0" title="Tu usuario" onclick="window.TemaECOVSA&&TemaECOVSA.menuUsuario(this,window._US)"><span>'+esc(nombre)+' · '+esc(r.usuario.rotulo)+'</span><div class="av">'+esc(ini)+'</div></div><button class="bt" onclick="salir()">Salir</button></div>'+
   '<div class="lw"><div class="ban '+fondoElegido()+'"><div class="f"></div><h1>'+sal+', '+esc(primer)+'</h1><p>'+esc(fecha)+' · '+esc(subt)+'</p>'+
     (r.kpis&&r.kpis.length?'<div class="kp">'+r.kpis.map(function(k){ return '<div><b class="num">'+esc(k.v)+'</b><span>'+esc(k.e)+(k.d?' <em class="'+(k.malo?'malo':'')+'">'+esc(k.d)+'</em>':'')+'</span></div>'; }).join("")+'</div>':'')+
   admH+'</div><div class="gr">'+
   '<div class="box"><h2>'+(mods.length>1?"MÓDULOS <span>"+mods.length+" disponibles</span>":"TU MÓDULO")+'</h2><div class="mods">'+
     mods.map(function(m){ var e=(r.estados||{})[m.id], mant=m.estado==="mantenimiento", obra=m.estado==="construccion"||(mant&&m.cerrado), tu=m.id===idT;
       /* api 3.14: módulo apagado por mantenimiento. Al administrador y a los probadores sí les abre */
       return '<button class="m'+(tu?" tuyo":"")+(obra?" obra":"")+'" onclick="'+(obra?(mant?'avisarMant(\''+m.id+'\')':'avisar(\'Este módulo está en construcción.\')'):'abrir(\''+m.id+'\')')+'">'+
         '<div class="top"><div class="ic">'+svg(m.icono)+'</div>'+(tu&&mods.length>1?'<span class="chip">TU MÓDULO</span>':'')+'</div>'+
         '<div class="tx"><b>'+esc(m.titulo)+'</b><small>'+esc(m.detalle)+'</small></div>'+
         (mant?'<span class="st mant">🔧 En mantenimiento'+(m.cerrado?'':' · solo tú y probadores')+'</span>':obra?'<span class="st">En construcción</span>':(e?'<span class="st"><i style="background:'+PUNTO[e.nivel]+'"></i>'+esc(e.texto)+'</span>':''))+'<span class="ar">›</span></button>'; }).join("")+'</div>'+
   '</div>'+
   '<div class="box"><h2>LO QUE TE ESPERA HOY <span>'+esc(nomT)+'</span></h2>'+
     (G ? esperaGrupos(gT,gM,gS,nomT) : (P.length? P.slice(0,5).map(function(p,i){ return '<div class="it" onclick="irPend('+i+')"><i class="dot" style="background:'+PUNTO[p.nivel]+'"></i><div class="tx">'+esc(p.titulo)+(p.texto?'<small title="'+esc(p.texto)+'">'+esc(p.texto)+'</small>':'')+'</div></div>'; }).join("")
       : '<div class="vacio">No hay nada esperando por ti. Buen trabajo.</div>'))+
     (idT?'<button class="mas" onclick="abrir(\''+idT+'\')">Ver todo en '+esc(nomT)+' →</button>':'')+
   '</div></div>'+
   '<div class="pie"><span>ECOVSA · Ecología · Vida · Salud</span><span>Sesión segura · se bloquea tras 15 minutos sin uso</span></div></div>';
}
/* api 3.7: lo tuyo · tu módulo hoy · también sigues */
function esperaGrupos(gT,gM,gS,nomT){
  if(!gT.length && !gM.length && !gS.length) return '<div class="vacio">No hay nada esperando por ti. Buen trabajo.</div>';
  var k=0, h='', uno=function(p,cls){
    var i=k++, ac='';
    if(p.tipo==="rcd") ac='<div class="ac"><button onclick="event.stopPropagation();rcdAcc('+i+',\'hecho\',this)">Hecho</button><button onclick="event.stopPropagation();rcdAcc('+i+',\'manana\',this)">Mañana</button></div>';
    else if(p.tipo==="borrador") ac='<div class="ac"><button onclick="event.stopPropagation();irPend('+i+')">Abrir</button></div>';
    return '<div class="it '+(cls||'')+'" onclick="irPend('+i+')"><i class="dot" style="background:'+PUNTO[p.nivel]+'"></i><div class="tx">'+esc(p.titulo)+(p.etq?'<b class="tag'+(p.nivel==="a"?" a":"")+'">'+esc(String(p.etq).toUpperCase())+'</b>':'')+(p.texto?'<small title="'+esc(p.texto)+'">'+esc(p.texto)+'</small>':'')+'</div>'+ac+'</div>';
  };
  var pri=true, cab=function(t){ var x='<div class="grp'+(pri?' pri':'')+'">'+t+' <i></i></div>'; pri=false; return x; };
  if(gT.length) h+=cab('LO TUYO')+gT.map(function(p){ return uno(p,'mio'); }).join("");
  if(gM.length) h+=cab(esc(String(nomT||'').toUpperCase())+' HOY')+gM.map(function(p){ return uno(p,''); }).join("");
  else if(gT.length) h+=cab(esc(String(nomT||'').toUpperCase())+' HOY')+'<div class="vacio" style="padding:6px 2px">Nada urgente en '+esc(nomT)+'.</div>';
  if(gS.length) h+=cab('TAMBIÉN SIGUES')+gS.map(function(p){ return uno(p,'sig'); }).join("");
  return h;
}
function rcdAcc(i,acc,btn){
  var p=ESPERA[i]; if(!p||!p.rcdId) return; if(btn) btn.disabled=true;
  google.script.run.withSuccessHandler(function(x){
    if(!x||!x.ok){ if(btn) btn.disabled=false; avisar((x&&x.error)||"No se pudo"); return; }
    avisar(acc==="hecho"?"Listo, marcado como hecho":"Te lo recuerdo mañana");
    cargar(PIN_ACTUAL,function(y){ if(y&&y.ok){ TAB=y; pintar(y); } });
  }).withFailureHandler(function(){ if(btn) btn.disabled=false; avisar("Sin conexión"); }).api_recordatorioAccion(PIN_ACTUAL,p.rcdId,acc);
}
function modulo(id){ return (TAB&&TAB.modulos||[]).filter(function(m){ return m.id===id; })[0]; }
function irPend(i){ var p=ESPERA[i]; if(!p) return; var m=modulo(p.ir);
  /* api 3.7: la ruta en borrador o la ficha del cliente se abren directo */
  if(p.tipo==="espacio"){ navegar(String(URL_APP||"").replace(/[^\/]*$/,"")+"Configuracion.html#esp"); return; }
  if(p.tipo==="seguridad"||/^ptl/.test(p.tipo||"")){ irTipo(p.tipo); return; }
  var ir=null; if(p.tipo==="borrador") ir={tab:"plan",fecha:p.fecha}; else if(p.tipo==="rcd"&&p.clienteId&&p.ir==="campo") ir={tab:"cli2",cli:p.clienteId};
  else if(p.tipo==="rcd"&&p.rtipo==="ruta"&&p.ref) ir={tab:"plan",fecha:String(p.ref).split("|")[0]}; else if(p.tipo==="rcd"&&p.rtipo==="camion"&&p.ref) ir={tab:"flota",placa:p.ref};
  if(ir){ ir.t=Date.now(); try{ localStorage.setItem("eco_ir",JSON.stringify(ir)); }catch(e){} }
  if(m && m.permitido && m.estado!=="construccion") abrir(p.ir); else avisar("Esto lo atiende otro módulo."); }
/* api 3.23: cada asunto del administrador abre directo su pestaña de Configuración */
function irTipo(tipo){ var H={seguridad:"#seg",ptlPed:"#ptl-ped",ptlInv:"#ptl-venc",ptlPro:"#ptl-pro"}; navegar(String(URL_APP||"").replace(/[^\/]*$/,"")+"Configuracion.html"+(H[tipo]||"#ptl")); }
function avisarMant(id){ var m=modulo(id); avisar((m&&m.aviso)||"Este módulo está en mantenimiento."); }
function avisar(t){ var a=$("aviso"); a.textContent=t; a.style.display="block"; clearTimeout(window._av); window._av=setTimeout(function(){ a.style.display="none"; },3600); }

function abrir(p){ navegar(URL_APP+"?p="+p); }
function navegar(u){ if(window.__ir) window.__ir(u); else irA(u); }
function salir(){
  try{ localStorage.removeItem("ecovsa_pin"); localStorage.removeItem("eco_bloq_nombre"); sessionStorage.removeItem("eco_rol_sesion"); }catch(e){}
  PIN_ACTUAL=""; TAB=null; clearInterval(REFRESCO);
  EntradaECOVSA.detener();
  entrada();
}

/* Al desbloquear, el saludo toma el fondo que se haya elegido en la entrada. */
window.addEventListener("eco-desbloqueo",function(){ var b=document.querySelector(".ban"); if(b) b.className="ban "+fondoElegido(); });
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",arrancar);
else arrancar();

/* Navega la ventana de arriba: dentro del iframe de Apps Script,
   location.href solo cambia el marco interno y la pantalla queda en blanco. */
function irA(url){
  try{
    if(window.top && window.top !== window){ window.top.location.href = url; return; }
  }catch(e){}
  location.href = url;
}
