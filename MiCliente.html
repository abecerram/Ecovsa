<script>
/* ═══ Página del QR del cliente (api 3.1) ═══
   Verificación: pública, la ve cualquiera que escanee el distintivo (también un

   la pared de la recepción.
   Mi servicio: solo el establecimiento, con el RUC. Queda abierto 30 días en ese

   certificado → mercadeo). */
var CLI="", COD="", PUB=null, MIO=null, V="ver", FIL="todos", RI=0, YA_GIRO=false, LLAVE="";
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function f(i){ var d=new Date(String(i)+"T12:00:00"); return isNaN(d)?String(i||""):d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear(); }

function kg(v){ var x=Math.round((Number(v)||0)*100)/100; return x.toLocaleString("es-PA"); }
function toast(t){ var a=$("toast"); a.textContent=t; a.style.display="block"; clearTimeout(a._t); a._t=setTimeout(function(){ a.style.display="none"; },3200); }
function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){} }
function kLlave(){ return "qr_llave_"+CLI; }

/* ── llamadas al servidor ── */
function llamar(fn, args){
  return new Promise(function(ok, mal){
    var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ mal(e||new Error("Sin conexión")); });
    r[fn].apply(r, args);
  });
}

function arrancar(){
  var q=location.search||"";
  var a=q.match(/[?&]cli=([^&]+)/), b=q.match(/[?&]cod=([^&]+)/);
  CLI=a?decodeURIComponent(a[1]):""; COD=b?decodeURIComponent(b[1]):"";

  LLAVE=lsGet(kLlave());
  if(/(^|#)mio$/.test(location.hash)) V="mio";
  llamar("api_miCliente",[CLI,COD]).then(function(r){
    if(!r||!r.ok){ falla("No pudimos abrir esta página", esc((r&&r.error)||"Intente de nuevo en unos minutos.")+"<br><br>Si necesita ayuda, escríbanos al WhatsApp <b>6264-1647</b>."); return; }
    PUB=r; ir(V);
  },function(){ falla("Sin conexión","No pudimos conectar en este momento. Intente de nuevo en unos minutos."); });
}
function falla(t,p){ $("app").innerHTML='<div class="centro"><div style="font-size:34px">🔒</div><h3>'+esc(t)+'</h3><p>'+p+'</p></div>'; }

/* ── navegación ── */
function ir(v){
  if((v==="mio"||v==="recibos"||v==="recibo") && !LLAVE) v="clave";
  V=v;
  var h={ver:vVer,clave:vClave,mio:vMio,recibos:vRecibos,recibo:vRecibo}[v]();

  if(v==="mio" && !MIO) cargarMio();
  if(v==="clave"){ var i=$("ruc"); if(i) setTimeout(function(){ try{ i.focus(); }catch(e){} },100); }

/* api 3.3 · tres caras: en servicio (verde), apagado (suspendido o en pausa:

function estado(){
  var r=PUB;
  if(r.estadoServicio==="baja") return {sello:"FUERA DE SERVICIO", cls:"fuera", gris:true, pill:"Fuera de servicio", nota:"Este establecimiento ya no cuenta con el servicio de ECOVSA"+(r.fechaBaja?" · desde "+r.fechaBaja:""), sinHora:true, icono:"x"};

  if(!r.contratoVigente) return {sello:"CONTRATO POR RENOVAR", gris:true, pill:"Contrato por renovar", nota:"Escríbanos para renovar su servicio."};
  return {sello:"SERVICIO VIGENTE", gris:false, pill:"Cliente con servicio vigente", nota:""};
}

function cab(){
  var g=YA_GIRO?"":" gira"; YA_GIRO=true; var e=estado();
  return '<div class="hC"><div class="emb" onclick="girar(this)" title="ECOVSA"><div class="e3">'+

      '<div class="wm">ECOVSA</div><div class="tg">ECOLOGÍA · VIDA · SALUD</div></div>'+
    '<div class="fC"><div class="n">'+esc(PUB.establecimiento)+'</div><small>Cliente N.º '+esc(PUB.codigoCliente)+'</small><br>'+
      (e.pill?'<span class="ok'+(e.gris?' gris':'')+'">● '+esc(e.pill)+'</span>':'')+'</div>'+
    '<div class="tab"><button data-t="ver" class="'+(V==="ver"?"on":"")+'">Verificación</button><button data-t="mio" class="'+(V!=="ver"?"on":"")+'">Mi servicio 🔒</button></div>';
}
function girar(el){ var a=el.querySelector(".fl"); a.classList.remove("gira"); void a.offsetWidth; a.classList.add("gira"); }
function barra(t,s,atras){ return '<div class="bar2"><button onclick="ir(\''+atras+'\')" aria-label="Volver">←</button><div><b>'+esc(t)+'</b>'+(s?'<small>'+esc(s)+'</small>':'')+'</div></div>'; }

/* ═══ Verificación (pública) ═══ */
function vVer(){
  var r=PUB, e=estado(), E=r.empresa||{};
  var chk=function(ok,t,s){ return '<div class="chk"><i class="'+(ok?'':'no')+'">'+(ok?'✓':'–')+'</i><div>'+esc(t)+(s?'<small>'+esc(s)+'</small>':'')+'</div></div>'; };
  var h=cab()+
    '<div class="sello'+(e.cls?' '+e.cls:(e.gris?' gris':''))+'"><div class="ic">'+
        (e.icono==="off"?'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>'
        :e.icono==="x"?'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
        :e.gris?'<span style="font-size:28px">⏸</span>':'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>')+'</div>'+
      '<b>'+esc(e.sello)+'</b>'+(e.sinHora?'':'<div class="hora num" id="hora"></div>'+(r.codigoDia?'<div class="cod num" title="Cambia cada día">'+esc(r.codigoDia)+'</div>':''))+
      (e.nota?'<div class="hora">'+esc(e.nota)+'</div>':'')+'</div>'+
    (e.sinHora?'<div class="card"><h3>PRESTADOR DEL SERVICIO</h3>'+chk(true,"Empresa autorizada",(E.razonSocial||"ECOTERMO DE PANAMA S.A.")+" · "+(E.resolucionCorta||E.resolucion||"Resolución Sanitaria vigente"))+'</div>':
    '<div class="card"><h3>LO QUE SE VERIFICA</h3>'+
      chk(r.contratoVigente && !!r.servicioDesde, "Contrato vigente", (r.servicioDesde?"Servicio desde el "+r.servicioDesde:"Fecha de inicio pendiente de registrar")+(r.contratoHasta?" · vigente hasta el "+r.contratoHasta:""))+
      chk(!!r.ultimaVisita, "Recolección registrada", (r.frecuencia?r.frecuencia+(r.frecuenciaDetalle?" ("+r.frecuenciaDetalle+")":""):"")+(r.ultimaVisita?" · última el "+r.ultimaVisita:" · primera recolección por realizarse"))+
      (r.ultimoRecibo?chk(true,"Última recolección documentada","Recibo "+r.ultimoRecibo+(r.ultimaVisitaKg?" · "+kg(r.ultimaVisitaKg)+" kg":"")+(r.ultimaActa?" · Acta "+r.ultimaActa:"")):"")+

    '</div>')+

/* ═══ Entrar con el RUC ═══ */
function vClave(){
  return cab()+'<div class="card"><div class="lock">🔒 <b>Solo para el establecimiento.</b> Aquí están sus recibos, sus certificados y los pedidos a ECOVSA. Escriba el <b>RUC de su empresa</b>, como aparece en su factura.</div>'+
    '<form onsubmit="entrar(event)"><input class="in ruc num" id="ruc" inputmode="text" autocomplete="off" placeholder="Ej. 155714552-2-2021" style="margin-top:12px">'+
    '<div class="msg" id="rmsg"></div><button class="btn pri" id="rbt" style="margin-top:6px">Entrar</button></form>'+
    '<p class="nota" style="text-align:center">Queda abierto en este celular por 30 días.</p></div>'+
    '<div class="pie">¿No tiene el RUC a mano? Escríbanos al WhatsApp <b>6264-1647</b>.</div>';
}
function entrar(ev){
  ev.preventDefault();
  var v=$("ruc").value.trim(), m=$("rmsg"), b=$("rbt");
  if(v.replace(/\D/g,"").length<4){ m.textContent="Escriba el RUC completo."; return; }
  b.disabled=true; b.textContent="Revisando…"; m.textContent="";
  llamar("api_miServicioEntrar",[CLI,COD,v]).then(function(r){
    b.disabled=false; b.textContent="Entrar";
    if(!r||!r.ok){ m.textContent=(r&&r.error)||"No se pudo entrar."; return; }
    LLAVE=r.llave; lsSet(kLlave(),LLAVE); MIO=null; ir("mio");
  },function(){ b.disabled=false; b.textContent="Entrar"; m.textContent="Sin conexión. Intente de nuevo."; });
}
function salir(){ LLAVE=""; MIO=null; lsSet(kLlave(),""); ir("ver"); }

/* ═══ Mi servicio ═══ */
function cargarMio(){
  llamar("api_miServicio",[CLI,COD,LLAVE]).then(function(r){
    if(!r||!r.ok){ if(r&&r.salir){ LLAVE=""; lsSet(kLlave(),""); ir("clave"); var m=$("rmsg"); if(m) m.textContent=r.error; return; }
      var c=$("mio-cuerpo"); if(c) c.innerHTML='<div class="carga">'+esc((r&&r.error)||"No se pudo cargar.")+'</div>'; return; }
    MIO=r; if(V==="mio") ir("mio");
  },function(){ var c=$("mio-cuerpo"); if(c) c.innerHTML='<div class="carga">Sin conexión. <button class="mas2" style="display:inline;width:auto" onclick="cargarMio()">Reintentar</button></div>'; });
}
function filaRec(x,i){ return '<div class="fila" onclick="verRec('+i+')"><div class="ic2">🧾</div><div class="tx">'+f(x.fecha)+'<small>Recibo '+esc(x.recibo||"s/n")+' · '+kg(x.kg)+' kg</small></div><span class="ac">Ver →</span></div>'; }
function filaCert(c){ return '<div class="fila" onclick="bajarCert(\''+esc(c.folio)+'\')"><div class="ic2">📄</div><div class="tx">'+esc(c.folio)+'<small>Del '+f(c.desde)+' al '+f(c.hasta)+' · '+kg(c.kg)+' kg · '+c.visitas+' visita'+(c.visitas===1?'':'s')+'</small></div><span class="ac">⬇ Descargar</span></div>'; }
function vMio(){
  var es=PUB.estadoServicio||"activo";
  var h=cab()+(es==="baja"?'<div class="tema" style="background:#eef1f5;border-color:#e1e6ee;color:#44516a">Este establecimiento ya no tiene servicio con ECOVSA. Aquí puede descargar sus recibos y certificados anteriores.</div>'
    :es==="apagado"?'<div style="margin:12px 14px 0"><button class="btn apag" disabled>🚚 Pedir recolección extra</button><p class="nota" style="text-align:center;margin-top:6px">Para coordinar una recolección escríbanos al WhatsApp 6264-1647.</p></div>'
    :'<div style="margin:12px 14px 0"><button class="btn wa" onclick="extra()">🚚 Pedir recolección extra</button></div>');
  if(!MIO) return h+'<div id="mio-cuerpo"><div class="carga"><div class="spin"></div>Cargando su servicio…</div></div>';
  var r=MIO, P=PUB, R=r.recibos||[], C=r.certificados||[];
  if(r.temaAdministrativo) h+='<div class="tema">Tiene un tema administrativo pendiente. Escríbanos al WhatsApp <b>6264-1647</b> y lo revisamos.</div>';
  h+='<div class="card"><h3>TU SERVICIO</h3><div class="dos"><div><div class="k">FRECUENCIA</div><div class="v">'+esc(P.frecuencia||"—")+(P.frecuenciaDetalle?'<small>'+esc(P.frecuenciaDetalle)+'</small>':'')+'</div></div>'+
     '<div><div class="k">PRÓXIMA VISITA</div><div class="v">'+esc(P.proximaMes?P.proximaMes.charAt(0).toUpperCase()+P.proximaMes.slice(1):"Por coordinar")+'<small>se coordina contigo</small></div></div>'+
     '<div><div class="k">TOTAL RETIRADO</div><div class="v num">'+kg(r.acumulado.kg)+' kg<small>en '+r.acumulado.visitas+' visita'+(r.acumulado.visitas===1?'':'s')+'</small></div></div>'+
     '<div><div class="k">CONTRATO</div><div class="v">'+(P.contratoHasta?'Hasta el '+esc(P.contratoHasta):'Vigente')+'</div></div></div></div>';
  h+='<div class="card"><h3>ÚLTIMA RECOLECCIÓN</h3>'+(R.length?filaRec(R[0],0)+'<button class="mas2" onclick="FIL=\'todos\';ir(\'recibos\')">Ver todos mis recibos ('+R.length+') →</button>':'<p class="nota">Su primera recolección está por realizarse.</p>')+'</div>';
  h+='<div class="card"><h3>MIS CERTIFICADOS DE TRATAMIENTO</h3>'+
     (C.length?'<p class="nota" style="margin:0 0 4px">Cada fila es un certificado distinto: toque ⬇ Descargar en el que necesite.</p>'+C.map(filaCert).join(""):'<p class="nota" style="margin:0 0 4px">Todavía no tiene certificados emitidos.</p>')+
     (es==="baja"?'':'<button class="btn" style="margin-top:10px" onclick="pedirCert()">+ Pedir un certificado'+(C.length?' de otro periodo':'')+'</button>')+'</div>';
  var S=r.solicitudes||[];
  if(S.length) h+='<div class="card"><h3>MIS SOLICITUDES</h3>'+S.map(function(s){
      var cl=s.estado==="Atendida"?" at":s.estado==="Cerrada"?" ce":"";
      return '<div class="fila" style="cursor:default"><div class="ic2">'+(s.tipo==="recoleccion"?"🚚":"📄")+'</div><div class="tx">'+esc(s.resumen)+'<small>'+esc(s.folio)+' · '+f(s.fecha)+(s.nota?' · '+esc(s.nota):'')+'</small></div><span class="est'+cl+'">'+esc(s.estado)+'</span></div>'; }).join("")+'</div>';
  h+='<div class="pie">¿Consultas? Tel. 310-2268 · WhatsApp 6264-1647<br><button onclick="salir()">Salir de mi servicio en este celular</button></div>';
  return h;
}

/* ═══ Mis recibos ═══ */
function vRecibos(){
  var R=(MIO&&MIO.recibos)||[], años=["todos"];
  R.forEach(function(x){ var y=x.fecha.slice(0,4); if(años.indexOf(y)<0) años.push(y); });
  var L=R.map(function(x,i){ return [x,i]; }).filter(function(p){ return FIL==="todos"||p[0].fecha.slice(0,4)===FIL; });
  var tot=L.reduce(function(s,p){ return s+p[0].kg; },0);
  var h=barra("Mis recibos",L.length+" recoleccion"+(L.length===1?"":"es")+" · "+kg(tot)+" kg","mio");
  if(años.length>2) h+='<div class="chips">'+años.map(function(a){ return '<button class="'+(FIL===a?'on':'')+'" onclick="FIL=\''+a+'\';ir(\'recibos\')">'+(a==="todos"?"Todos":a)+'</button>'; }).join("")+'</div>';
  var y="";
  L.forEach(function(p){ var yy=p[0].fecha.slice(0,4); if(yy!==y){ y=yy; h+='<div class="mes">'+yy+'</div>'; } h+='<div class="card" style="margin-top:6px;padding:4px 14px">'+filaRec(p[0],p[1])+'</div>'; });
  if(!L.length) h+='<div class="carga">No hay recibos en este periodo.</div>';
  return h+'<div class="aviso">Cada recibo es el comprobante oficial de esa recolección: kilos por tipo, camión, conductor y quién entregó.</div><div style="height:20px"></div>';
}
function verRec(i){ RI=i; ir("recibo"); }
function enlaceRec(x){ return "Recibo.html?p=recibo&solover=1&id="+encodeURIComponent(x.recibo)+(x.clave?"&k="+encodeURIComponent(x.clave):""); }
function vRecibo(){
  var R=(MIO&&MIO.recibos)||[], x=R[RI]; if(!x) return vRecibos();
  var fila=function(t,v){ return v?'<tr><td>'+t+'</td><td style="text-align:right" class="num">'+kg(v)+'</td></tr>':''; };
  return barra("Recibo "+(x.recibo||"s/n"),fl(x.fecha),"recibos")+
    (x.recibo?'<div style="margin:12px 14px 0" class="row"><button class="btn pri" onclick="bajarRec()">⬇ Descargar PDF</button><button class="btn" onclick="compartirRec()">Compartir</button></div>':'')+
    '<div class="rec"><div class="h"><div><b>Recibo de Visita</b><div style="color:var(--mu);font-size:11px">ECOVSA · Comprobante oficial</div></div><span class="nro num">'+esc(x.recibo||"s/n")+'</span></div>'+
      '<div class="g"><div><small>ESTABLECIMIENTO</small>'+esc(PUB.establecimiento)+'</div><div><small>FECHA</small>'+f(x.fecha)+'</div>'+
      '<div><small>CAMIÓN</small>'+esc(x.vehiculo||"—")+'</div><div><small>CONDUCTOR</small>'+esc(x.conductor||"—")+'</div></div>'+
      '<table><tr><th>CLASIFICACIÓN</th><th style="text-align:right">KG</th></tr>'+fila("Bioinfeccioso",x.kgBio)+fila("Punzocortante",x.kgPunzo)+fila("Anatomopatológico",x.kgAnatomo)+
      '<tr><td><b>TOTAL</b></td><td style="text-align:right" class="num"><b>'+kg(x.kg)+'</b></td></tr></table>'+
      '<div class="g"><div><small>ACTA DE DISPOSICIÓN</small>'+esc(x.acta||"En trámite")+'</div><div><small>ENTREGÓ</small>'+esc(x.firmante||"—")+'</div></div></div>'+
    '<div class="row" style="margin:0 14px 20px"><button class="btn" '+(RI>=R.length-1?'disabled':'onclick="verRec('+(RI+1)+')"')+'>← Anterior</button><button class="btn" '+(RI<=0?'disabled':'onclick="verRec('+(RI-1)+')"')+'>Siguiente →</button></div>';
}
function bajarRec(){ var x=MIO.recibos[RI]; window.open(enlaceRec(x)+"&bajar=1","_blank"); }
function compartirRec(){
  var x=MIO.recibos[RI], u=new URL(enlaceRec(x), location.href).href;
  if(navigator.share){ navigator.share({title:"Recibo "+x.recibo+" · ECOVSA", url:u}).catch(function(){}); return; }
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){ toast("Enlace del recibo copiado"); },function(){ prompt("Copie el enlace del recibo:",u); });
}
function bajarCert(folio){ window.open("CertificadoVista.html?p=vercert&folio="+encodeURIComponent(folio)+"&cli="+encodeURIComponent(CLI)+"&cod="+encodeURIComponent(COD)+"&t="+encodeURIComponent(LLAVE),"_blank"); }

/* ═══ Hojas: pedir recolección extra y pedir certificado ═══ */
function hoja(h){ $("hc").innerHTML=h; $("hoja").classList.add("si"); }
function cerrar(){ $("hoja").classList.remove("si"); }
$("hoja").addEventListener("click",function(e){ if(e.target.id==="hoja") cerrar(); });
function chips(nombre, ops, on){ return '<div class="chips en" data-g="'+nombre+'">'+ops.map(function(o){ return '<button type="button" class="'+(o===on?'on':'')+'">'+esc(o)+'</button>'; }).join("")+'</div>'; }
function chipVal(nombre){ var b=document.querySelector('[data-g="'+nombre+'"] button.on'); return b?b.textContent:""; }
document.addEventListener("click",function(e){ var b=e.target.closest(".chips.en button"); if(!b) return; b.parentNode.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on",x===b); }); });

function extra(){
  if(PUB.estadoServicio&&PUB.estadoServicio!=="activo") return;
  if(!LLAVE){ ir("clave"); toast("Primero escriba el RUC de su empresa"); return; }
  var abierta=MIO&&(MIO.solicitudes||[]).some(function(s){ return s.tipo==="recoleccion"&&s.estado!=="Atendida"&&s.estado!=="Cerrada"; });
  hoja('<h2>Pedir recolección extra</h2><p class="sub">Le llega directo a logística. Le confirmamos el día por WhatsApp.</p>'+
    (abierta?'<div class="tema" style="margin:8px 0 0">Ya tiene una recolección extra en camino. Si es urgente, escríbanos al 6264-1647.</div>':'')+
    '<span class="k">¿POR QUÉ?</span>'+chips("motivo",["Se llenó antes","Evento o campaña","Limpieza","Otro"],"Se llenó antes")+
    '<span class="k">¿PARA CUÁNDO?</span>'+chips("cuando",["Lo antes posible","Esta semana","La próxima semana"],"Lo antes posible")+
    '<span class="k">¿CUÁNTO HAY?</span>'+chips("cantidad",["1–3 bolsas","4–10 bolsas","Más de 10","No sé"],"4–10 bolsas")+
    '<span class="k">¿A QUIÉN LLAMAMOS?</span><input class="in" id="x-cont" style="margin-top:6px" value="'+esc((MIO&&MIO.contacto)||"")+'" placeholder="Nombre y teléfono">'+
    '<div class="msg" id="x-msg"></div><button class="btn wa" id="x-ok" style="margin-top:8px" onclick="enviarExtra()">Enviar solicitud</button>'+
    '<button class="btn" style="margin-top:8px;border:0" onclick="cerrar()">Cancelar</button>');
}
function enviarExtra(){
  var d={tipo:"recoleccion",motivo:chipVal("motivo"),cuando:chipVal("cuando"),cantidad:chipVal("cantidad"),contacto:$("x-cont").value.trim()};
  if(!d.contacto){ $("x-msg").textContent="Escriba a quién llamamos."; return; }
  enviar(d,$("x-ok"),$("x-msg"),"Solicitud enviada a logística");
}
function pedirCert(){
  var P=(MIO&&MIO.periodos)||[];
  hoja('<h2>Pedir un certificado</h2><p class="sub">Elija el periodo. Los que ya tienen certificado se descargan, no se piden.</p>'+
    P.map(function(p,i){
      if(p.folio) return '<div class="per ya">📄<div>'+esc(p.texto)+'<small>Ya emitido: '+esc(p.folio)+'</small></div><button class="t" onclick="cerrar();bajarCert(\''+esc(p.folio)+'\')">⬇ Descargar</button></div>';
      if(!p.visitas) return '<div class="per nada">🗓️<div>'+esc(p.texto)+'<small>Sin recolecciones en este periodo</small></div></div>';
      return '<div class="per" data-i="'+i+'" onclick="elegirPer(this)">🗓️<div>'+esc(p.texto)+'<small>'+p.visitas+' visita'+(p.visitas===1?'':'s')+' · '+kg(p.kg)+' kg · aún no tiene certificado</small></div></div>';
    }).join("")+
    '<div class="per" data-i="otro" onclick="elegirPer(this)">✏️<div>Otro periodo<small>Escríbalo abajo</small></div></div>'+
    '<input class="in" id="c-otro" style="margin-top:8px;display:none" placeholder="Ej. marzo a agosto de 2026">'+
    '<span class="k">¿A QUÉ CORREO LO ENVIAMOS?</span><input class="in" id="c-mail" type="email" style="margin-top:6px" value="'+esc((MIO&&MIO.correo)||"")+'">'+
    '<p class="nota">Se entrega cuando el periodo está pagado. Le avisamos si falta algo.</p>'+
    '<div class="msg" id="c-msg"></div><button class="btn pri" id="c-ok" onclick="enviarCert()">Enviar solicitud</button>'+
    '<button class="btn" style="margin-top:8px;border:0" onclick="cerrar()">Cancelar</button>');
}
function elegirPer(el){ document.querySelectorAll(".per").forEach(function(x){ x.classList.toggle("on",x===el); }); $("c-otro").style.display=el.getAttribute("data-i")==="otro"?"block":"none"; }
function enviarCert(){
  var el=document.querySelector(".per.on"), m=$("c-msg");
  if(!el){ m.textContent="Elija un periodo arriba."; return; }
  var i=el.getAttribute("data-i"), d={tipo:"certificado",correo:$("c-mail").value.trim()};
  if(i==="otro"){ d.texto=$("c-otro").value.trim(); if(!d.texto){ m.textContent="Escriba el periodo que necesita."; return; } }
  else { var p=MIO.periodos[Number(i)]; d.desde=p.desde; d.hasta=p.hasta; d.texto=p.texto.replace(/\s*\(hasta hoy\)/,""); }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.correo)){ m.textContent="Escriba un correo válido."; return; }
  enviar(d,$("c-ok"),m,"Solicitud enviada a mercadeo");
}
function enviar(d,b,m,ok){
  b.disabled=true; var t=b.textContent; b.textContent="Enviando…"; m.textContent="";
  llamar("api_pedirDesdeQR",[CLI,COD,LLAVE,d]).then(function(r){
    b.disabled=false; b.textContent=t;
    if(!r||!r.ok){ if(r&&r.salir){ cerrar(); salir(); ir("clave"); return; } m.textContent=(r&&r.error)||"No se pudo enviar."; return; }
    cerrar(); toast(ok+" · "+r.folio); MIO=null; ir("mio");
  },function(e){ b.disabled=false; b.textContent=t; m.textContent=/cola/i.test(String(e&&e.message))?"Sin señal: se enviará sola al volver la conexión. No la repita.":"Sin conexión. Intente de nuevo."; });
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",arrancar); else arrancar();
</script>
