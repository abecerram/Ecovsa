<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitudes de compra · Mercadeo · ECOVSA</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">

  escritura:/^api_(crm(Guardar|Completar|Anular|Captura|Mover|Reasignar|Borrar|Subir|Usar)|guardar|marcar|abrir|cerrar|registrar|borrar|eliminar|crear|actualizar|enviar|corregir|dar|anular|confirmar|aprobar|rechazar|subir|asignar|mover|cambiar|agregar|nuevo|editar|reabrir|emitir|pasar|pedir)/i};</script>

<style>
/* ═══ Solicitudes de compra · opción A (lista + panel + hoja tipo factura) ═══ */
/* la barra común desbordaba a 390 px: el buscador no se dejaba encoger */
.sysbar .srch{min-width:0}
.pane{display:none}.pane.on{display:block}
.mono{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.nw{white-space:nowrap}

/* bandeja */
.kp4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kp4 .kpi{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.kp4 .kpi:hover{border-color:#9db4d8}
.kp4 .kpi em{display:block;margin:2px 0 0;font-weight:500;color:var(--muted2);font-size:11.5px}
.kp4 .kpi.on{border-color:var(--navy2);box-shadow:inset 0 0 0 1px var(--navy2)}
.barra{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bus{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff;color:var(--muted);flex:1;min-width:200px;max-width:360px}
.bus input{border:0;outline:0;padding:8px 0;font:500 13.5px Archivo,sans-serif;flex:1;min-width:0;background:none;color:var(--ink)}
.barra .sel{width:auto;max-width:230px}
#tb-sol thead td.fil{background:#fafbfd;padding:9px 12px;border-bottom:1px solid var(--line)}
#tb-sol tbody tr.clic{cursor:pointer}
#tb-sol tbody tr.sel td{background:#eef3fb}
#tb-sol tbody tr.anul td{color:var(--muted2)}
#tb-sol tbody tr.anul .mono{text-decoration:line-through}
.esp{font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pv{font-weight:600}
.cpt{font-size:12px;color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* panel de detalle */
.lado h2{font-size:18px;margin-top:6px;padding-right:34px;line-height:1.25}
.det-tot{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px}
.det-tot .mono{font-size:26px;font-weight:800;letter-spacing:-.3px}
.sec{margin-top:18px}
.sec>h4{font-size:11px;letter-spacing:.9px;color:#5b6a80;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.sec>h4 .sp{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;word-break:break-word}
.nota{background:var(--hover);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--muted)}
.nota.warn{background:var(--warn-bg);border-color:var(--amber-line);color:#6b4a00}
.nota.bad{background:var(--bad-bg);border-color:#f3c1c3;color:#8f2226}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tl .ev b{font-weight:700;font-size:13px}
.tl .ev .q{color:var(--muted);font-size:12.5px}
.tl .ev small{display:block}
.tl .ev.pend{color:var(--muted2)}
.tl .ev.pend::before{border-color:var(--gris)}
.tl .ev.bad::before{border-color:var(--bad);background:var(--bad)}
.tl .ev.ok::before{background:var(--navy2)}
.tl .ev .espe{font-size:11.5px;color:#8a5a00;font-weight:600}
table.ln{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.ln td{padding:8px 10px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:top}
table.ln td.r{text-align:right}
table.ln tr.t td{border-bottom:0;padding:4px 10px;color:var(--muted)}
table.ln tr.g td{border-top:2px solid var(--navy2);color:var(--ink);font-weight:700;padding-top:8px}
.hp .it{cursor:pointer}
.hp .it:hover{background:var(--hover)}
.pie-det{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;border-top:1px solid var(--line);padding-top:14px}

/* hoja tipo factura */
.inv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;max-width:1080px}
.inv-h{display:flex;align-items:flex-start;gap:14px;padding-bottom:16px;border-bottom:2px solid var(--navy2);flex-wrap:wrap}
.inv-logo{display:flex;align-items:center;gap:10px}
.inv-logo .lgm{width:42px;height:42px;border-radius:9px;border:1px solid var(--line);background:#fff url(logo-ecovsa.png) center/32px no-repeat;flex:none}
.inv-logo b{display:block;letter-spacing:2px;font-size:15px}.inv-logo small{font-size:11.5px;color:var(--muted)}
.inv-num{text-align:right}
.inv-num>span{display:block;font-size:11px;letter-spacing:1.4px;color:var(--muted);font-weight:700}
.inv-num>b{font-size:21px;letter-spacing:.5px;display:block}
.inv-num>small{display:block;font-size:11px;color:var(--muted2)}
.inv-num label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.inv-num label input{width:auto;padding:4px 8px;font-size:13px}
.inv-2{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;margin-top:16px}
.inv h4{font-size:11px;letter-spacing:1.2px;color:var(--muted);font-weight:700;margin-bottom:6px}
.inv .f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.inv .f3{display:grid;grid-template-columns:1.4fr 1.3fr .6fr;gap:0 10px}
.inv .frow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.inv .frow>span{font-size:11.5px;font-weight:700;color:#5b6a80;width:92px;flex:none}
.inv .in.sm,.inv .sel.sm{padding:6px 8px;font-size:13px}
.inv .prov{font-weight:700;font-size:14px}
.provst{font-size:12px;margin-top:6px;min-height:4px}
.provst .fi{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.provst .fi span.muted{flex:1;min-width:200px}
.sg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:#fff;padding:3px;gap:2px;flex-wrap:wrap}
.sg button{border:0;background:none;border-radius:7px;padding:6px 11px;font:700 12.5px Archivo,sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap}
.sg button.on{background:var(--navy2);color:#fff}
.sg button.on.urge{background:var(--bad)}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.ck input{width:16px;height:16px}
table.inv-l{width:100%;border-collapse:collapse;margin-top:20px}
.inv-l th{font-size:10.5px;letter-spacing:.7px;color:#7a879b;text-align:left;font-weight:700;padding:7px 5px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap}
.inv-l td{padding:5px 4px;border-bottom:1px solid var(--line2);vertical-align:top}
.inv-l input,.inv-l select{width:100%;border:1px solid transparent;border-radius:7px;padding:6px 6px;font:500 13px Archivo,sans-serif;background:#fff;color:var(--ink)}
.inv-l input:hover,.inv-l select:hover{border-color:var(--line)}
.inv-l input:focus,.inv-l select:focus{border-color:#9db4d8;outline:0}
.inv-l .r,.inv-l input.r{text-align:right}
.inv-l td.tl2{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:11px}
.inv-l .q{width:62px}.inv-l .u{width:86px}.inv-l .cc{width:96px}.inv-l .j{width:70px}.inv-l .v{width:96px}.inv-l .e{width:146px}
.inv-l td.cn{width:38%}
.inv-l .c{min-width:200px}
.inv-l .ccd{display:block;font-size:10.5px;color:var(--muted);padding:0 6px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-l .ccd.no{color:#8a5a00}
.qx{border:0;background:none;color:var(--muted2);cursor:pointer;padding:6px;border-radius:7px;display:inline-flex}
.qx:hover{color:var(--bad);background:var(--bad-bg)}
.tots div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
.tots div span{color:var(--muted)}
.tots .gran{border-top:2px solid var(--navy2);margin-top:6px;padding-top:8px;font-size:18px;font-weight:800}
.tots .gran span{color:var(--ink)}
.inv-firma{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.inv-firma div{flex:1;min-width:200px;border-top:1px solid var(--ink);padding-top:6px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;text-align:center}
.inv-firma div b{display:block;color:var(--ink);text-transform:none;letter-spacing:0;font-size:13px}
.inv-f{display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.inv-f .small{flex:1;min-width:220px}
#f-msg:empty{display:none}
.rp{max-height:52vh;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px}
.rp .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.rp .it:last-child{border:0}
.rp .it:hover{background:var(--hover)}
.rp .it .tx{flex:1;min-width:0}
.rp .it small{display:block;color:var(--muted);font-size:12px}

/* caja menuda */
.cj-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;align-items:start}
.atajos{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.atajo{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;cursor:pointer;font:700 13px Archivo,sans-serif;color:var(--ink);text-align:left}
.atajo small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.atajo:hover{border-color:#9db4d8}
.atajo.on{border-color:var(--navy2);box-shadow:inset 0 0 0 1px var(--navy2)}
.cjf1{display:grid;grid-template-columns:140px 1fr 110px;gap:0 10px}
.cjf2{display:grid;grid-template-columns:1fr 1.4fr auto;gap:0 10px;align-items:end}
.kpi .bar-h{margin-top:7px}
.bar-h i.ok{background:var(--ok)}.bar-h i.warn{background:var(--amber)}.bar-h i.bad{background:var(--bad)}

/* totales */
.tb.mx td,.tb.mx th{text-align:right}
.tb.mx td:first-child,.tb.mx th:first-child{text-align:left}
.pila{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line2);min-width:90px}
.pila i{display:block;height:100%}
.pila .p1{background:var(--navy2)}.pila .p2{background:#7f97c4}.pila .p3{background:#c9d4e6}
.ley{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* pendientes del asistente */
.pend .it{align-items:flex-start}
.pend .acc{margin-top:6px}

/* impresos (arqueo) */
#impreso{display:none}
.doc{font-size:12px;color:#111;line-height:1.5}
.doc .dh{display:flex;gap:14px;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:10px}
.doc .dh .lgd{width:58px;height:58px;background:url(logo-ecovsa.png) center/contain no-repeat;flex:none}
.doc .dh .em b{display:block;font-size:17px;letter-spacing:1.5px}
.doc .dh .em small{display:block;font-size:10.5px;color:#444}
.doc .dh .nr{margin-left:auto;text-align:right}
.doc .dh .nr b{display:block;font-size:15px;letter-spacing:.5px}
.doc .dh .nr small{display:block;font-size:10.5px;color:#444}
.doc h5{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;margin:16px 0 6px;color:#222}
.doc table{width:100%;border-collapse:collapse}
.doc td,.doc th{border:1px solid #9a9a9a;padding:5px 7px;text-align:left;font-size:11.5px;vertical-align:top}
.doc th{background:#eef0f3;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase}
.doc td.r,.doc th.r{text-align:right;white-space:nowrap}
.doc tr.tt td{font-weight:800;background:#f5f6f8}
.doc .dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.doc .fir{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}
.doc .fir div{border-top:1px solid #111;padding-top:5px;text-align:center;font-size:10.5px}
.doc .fir div b{display:block;font-size:11.5px}
.doc .pd{margin-top:18px;border-top:1px solid #bbb;padding-top:6px;font-size:9.5px;color:#555;text-align:center}
.doc .ln-b{display:inline-block;min-width:120px;border-bottom:1px solid #111}

@media(max-width:1100px){
  .cj-grid{grid-template-columns:1fr}
}
@media(max-width:900px){
  .kp4{grid-template-columns:1fr 1fr}
  .inv-2{grid-template-columns:1fr;gap:6px}
  .oc{display:none}
}
@media(max-width:700px){
  .kp4 .kpi b{font-size:18px}
  .barra .bus{max-width:none;flex-basis:100%}
  .barra .sel{flex:1;max-width:none}
  .inv{padding:16px 14px}
  .inv-num{text-align:left;width:100%}
  .inv .f3{grid-template-columns:1fr 1fr}
  .inv .f3>div:first-child{grid-column:1/-1}
  .inv .frow>span{width:100%}
  table.inv-l thead{display:none}
  table.inv-l,table.inv-l tbody{display:block}
  table.inv-l tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 8px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;position:relative}
  table.inv-l td{border:0;padding:0}
  table.inv-l td[data-l]::before{content:attr(data-l);display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:2px}
  table.inv-l td.cn{grid-column:1/-1;padding-right:34px;width:auto}
  .inv-l .c{min-width:0}
  table.inv-l input,table.inv-l select{border-color:var(--line)}
  table.inv-l .q,table.inv-l .u,table.inv-l .cc,table.inv-l .j,table.inv-l .v,table.inv-l .e{width:100%}
  table.inv-l td.imp{grid-column:span 2}
  table.inv-l td.tl2{align-self:end;font-size:14px;padding:0 0 8px}
  #totbox .tb td,#totbox .tb th{padding:9px 8px}
  table.inv-l td.qx-td{position:absolute;top:6px;right:6px}
  .inv-l .ccd{max-width:none}
  .cjf1{grid-template-columns:1fr 1fr}
  .cjf1>div:nth-child(2){grid-column:1/-1;grid-row:1}
  .cjf2{grid-template-columns:1fr}
  .cjk{grid-template-columns:1fr 1fr!important}
  /* bandeja en tarjetas */
  #tb-sol,#tb-sol thead,#tb-sol tbody{display:block}
  #tb-sol thead tr.cab{display:none}
  #tb-sol thead tr,#tb-sol thead td{display:block}
  #tb-sol tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:11px 12px;border-bottom:1px solid var(--line2)}
  #tb-sol tbody td{border:0;padding:0;display:block;background:none!important}
  #tb-sol tbody td.c-pv{grid-column:1;grid-row:1}
  #tb-sol tbody td.c-tot{grid-column:2;grid-row:1;text-align:right}
  #tb-sol tbody td.c-id{grid-column:1;grid-row:2;display:flex;gap:8px;align-items:baseline;font-size:12px}
  #tb-sol tbody td.c-id small{display:inline}
  #tb-sol tbody td.c-est{grid-column:2;grid-row:2;text-align:right}
  #tb-sol tbody td.c-esp{grid-column:1/-1;grid-row:3;display:block}
  #tb-sol tbody td.c-esp .muted:empty{display:none}
  #tb-sol tbody td[colspan]{grid-column:1/-1}
  #tb-sol tbody tr.sel{background:#eef3fb}
  .cpt{max-width:none;white-space:normal}
  .doc .dos{grid-template-columns:1fr}
}
@media print{
  body.imp>*:not(#impreso){display:none!important}
  body.imp #impreso{display:block}
  body.imp{background:#fff}
  .doc{font-size:10.5pt}
  @page{size:letter;margin:12mm}
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════════
   SOLICITUDES DE COMPRA (Mercadeo · CRM)
   Reemplaza SolicitudPago.html (pedir un pago, mis solicitudes, marcar
   pagada, proveedor nuevo, caja menuda) y reúne lo de Finanzas.html
   sobre solicitudes (visto bueno, aprobar, rechazar, pagar), con las
   mismas reglas. El servidor es quien decide; la pantalla solo evita
   mostrar botones que el servidor rechazaría.
   ═══════════════════════════════════════════════════════════════════ */
var BOOT = null, LISTA = [], PROV_TODOS = null, CAJA = null, PEND = [];
var TASA = 0.07, UMBRAL = 1500;
/* api 3.4 · las reglas vienen de Configuración (api_finanzasBootstrap) */
function REG() { return (BOOT && BOOT.reglas) || { aprobacion: true, registranPago: ['solicitante', 'admin', 'gerente'], anulan: ['admin', 'gerente'], aprueban: ['admin', 'gerente'] }; }
function APROB() { return REG().aprobacion !== false; }
var ROLN = { admin: 'administración', gerente: 'gerencia', solicitante: 'quien la pidió' };
function quienes(l) { return (l || []).map(function (x) { return ROLN[x] || x; }).join(' o ') || 'nadie'; }
function umbralDe(r) { return r.umbralVistoBueno === null ? Infinity : (Number(r.umbralVistoBueno) || UMBRAL); }
/* Sin aprobación en el sistema una SOLICITADA vieja ya está «por pagar»: se trata como APROBADA */
function normal(s) { if (s && s.porPagar && s.estado === 'SOLICITADA') s.estado = 'APROBADA'; return s; }
function puedePagar(s) { var rp = REG().registranPago || [], rol = (U().rol || ''); return rp.indexOf(rol) >= 0 || (rp.indexOf('solicitante') >= 0 && yo(s.solicitadoPor)); }
function puedeAnular() { return (REG().anulan || []).indexOf(U().rol || '') >= 0; }
function textoEntrada() { return APROB() ? 'la solicitud entra como <b>SOLICITADA</b> y nadie la paga hasta que gerencia la apruebe' : 'la solicitud entra <b>por pagar</b>: la aprobación se hace en otro proceso'; }
var LISTA_OK = false, FIL = 'tramite', SOLO_MIAS = false, DET = '', FAP = {}, TAB = 'sol', RANGO = 'anio', NUEVA = '';
var ATJ_ICONO = { 'Taxi': 'auto', 'Copias': 'copias', 'Cafetería': 'cafe', 'Papelería': 'lapiz', 'Envío': 'paquete', 'Estacionamiento': 'parqueo', 'Botiquín': 'botiquin' };
MK.ICONOS.auto = '<path d="M3 16v-3l2.2-5h13.6L21 13v3z"/><path d="M3 13h18"/><circle cx="7.5" cy="16.5" r="1.6"/><circle cx="16.5" cy="16.5" r="1.6"/>';
MK.ICONOS.cafe = '<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/>';
MK.ICONOS.copias = '<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/>';
MK.ICONOS.paquete = '<path d="M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>';
MK.ICONOS.parqueo = '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9.5 17V7h3.5a3 3 0 0 1 0 6H9.5"/>';
MK.ICONOS.botiquin = '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M12 10.5v6M9 13.5h6"/>';

function $(i) { return document.getElementById(i); }
var esc = MK.esc;
function bal(v) { return MK.dinero(v); }
function r2(v) { return Math.round((Number(v) || 0) * 100) / 100; }
function U() { return (BOOT && BOOT.usuario) || MK.usuario || { nombre: '' }; }
function mismo(a, b) { return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase(); }
function yo(n) { return !!String(n || '').trim() && mismo(n, U().nombre); }
/* En la hoja hay filas viejas con una fecha escrita donde va el nombre:
   no se muestra una fecha como si fuera una persona. */
function persona(n) { n = String(n || '').trim(); if (!n || /GMT|\d{4}-\d{2}|\d{1,2}:\d{2}/.test(n)) return ''; return n; }
function puedeAprobar() { return !!(BOOT && BOOT.puedeAprobar); }
function normProv(s) {
  return String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[.,]/g, ' ')
    .replace(/\b(S\s?A|SA|SRL|S\s?DE\s?RL|INC|CORP|CIA)\b/g, ' ').replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function normRuc(s) { return String(s || '').replace(/[^0-9A-Za-z]/g, '').toUpperCase(); }
var ROT = { 'DESECHOS SOLIDOS': 'DESECHOS SÓLIDOS', 'CREDITO': 'CRÉDITO' };
function rot(x) { return ROT[x] || x; }
function pct() { return Math.round(TASA * 100) + ' %'; }
function buscarSol(id) { return LISTA.filter(function (s) { return s.solicitudId === id; })[0] || null; }
function cuentaDesc(cod) { var c = ((BOOT && BOOT.cuentas) || []).filter(function (x) { return x.codigo === String(cod || '').trim(); })[0]; return c ? c.descripcion : ''; }
function diasTxt(n) { return n === 0 ? 'hoy' : n + (n === 1 ? ' día' : ' días'); }

/* ── estados ── */
function vista(s) { return (s.estado === 'SOLICITADA' && (s.requiereVistoBueno || Number(s.total) > UMBRAL) && !s.vistoBuenoPor) ? 'VB' : s.estado; }
var ETQ = { SOLICITADA: ['Por aprobar', 't-info'], VB: ['Espera visto bueno', 't-warn'], APROBADA: ['Aprobada', 't-info'], PAGADA: ['Pagada', 't-ok'], RECHAZADA: ['Rechazada', 't-bad'], ANULADA: ['Anulada', 't-gris'] };
function tagE(s) { var e = ETQ[vista(s)] || [s.estado || '—', 't-gris']; return '<span class="tag ' + e[1] + '">' + esc(e[0]) + '</span>'; }
function abierta(s) { return s.estado === 'SOLICITADA' || s.estado === 'APROBADA'; }
function desde(s) {
  if (s.estado === 'SOLICITADA') return s.fechaVistoBueno || s.fechaSolicitud || s.fecha || '';
  if (s.estado === 'APROBADA') return s.fechaAprobacion || FAP[s.solicitudId] || '';
  return '';
}
function espera(s) { var d = desde(s); return d ? Math.max(0, MK.dias(d, MK.hoy)) : null; }
function quienTiene(s) { var v = vista(s); return v === 'VB' ? 'visto bueno' : v === 'SOLICITADA' ? 'aprobación' : v === 'APROBADA' ? 'el pago' : ''; }
function esperaHTML(s) {
  if (!abierta(s)) {
    if (s.estado === 'PAGADA' && s.fechaPago && s.fecha) { var n = Math.max(0, MK.dias(s.fecha, s.fechaPago)); return '<span class="esp muted">pagada en ' + diasTxt(n) + '</span>'; }
    return '<span class="esp muted">—</span>';
  }
  var d = espera(s);
  if (d === null) return '<span class="esp muted">' + (s.estado === 'APROBADA' && !(s.solicitudId in FAP) ? '…' : '—') + ' · ' + quienTiene(s) + '</span>';
  return '<span class="esp"><i class="dot ' + (d >= 7 ? 'd-bad' : d >= 3 ? 'd-warn' : 'd-ok') + '"></i>' + diasTxt(d) + ' · ' + quienTiene(s) + '</span>';
}

/* ═══ arranque ═══ */
MK.iniciar('compras', function () {
  var main = $('main');
  MK.cargando(main, 'Abriendo las solicitudes…');
  cargarBoot().then(function () {
    pintarMarco();
    pintarForm();
    var t = (location.hash || '').slice(1) || MK.param('tab');
    irTab(['sol', 'nueva', 'caja', 'tot'].indexOf(t) >= 0 ? t : 'sol', true);
    return cargarLista();
  }).then(function () {
    pintarTodo();
    completarFechas();
    cargarPend();
    var id = MK.param('id'); if (id && buscarSol(id.toUpperCase())) verDet(id.toUpperCase());
  }).catch(function (e) {
    if (!BOOT) { main.innerHTML = '<div class="aviso rj">' + esc(e.message || 'No se pudo abrir.') + ' <a href="index.html">Volver a los módulos</a></div>'; return; }
    if ($('tb-sol')) $('tb-sol').innerHTML = '<tbody><tr><td>' + '<div class="aviso rj" style="margin:12px">' + esc(e.message || 'No se pudo cargar.') + ' <a href="#" onclick="recargar();return false">Reintentar</a></div></td></tr></tbody>';
  });
  window.addEventListener('mk:cambio', recargar);
  window.addEventListener('afterprint', function () { document.body.classList.remove('imp'); });
});

function cargarBoot() {
  return MK.api('api_finanzasBootstrap', MK.pin).then(function (r) {
    if (!r || !r.ok) throw new Error((r && r.error) || 'Sin acceso a las solicitudes de compra.');
    BOOT = r; TASA = Number(r.itbmsTasa) || TASA; UMBRAL = umbralDe(r);
    if (!APROB()) { ETQ.APROBADA = ['Por pagar', 't-warn']; FILTROS = FILTROS.filter(function (f) { return f[0] !== 'VB' && f[0] !== 'SOLICITADA'; }).map(function (f) { return f[0] === 'APROBADA' ? ['APROBADA', 'Por pagar'] : f; }); }
    llenarListas();
    if (r.verFinanzas && !PROV_TODOS)   /* el catálogo completo (con inactivos) para avisar del RUC repetido como lo hace el servidor */
      MK.api('api_catalogosFinanzas', MK.pin).then(function (c) { if (c && c.ok) PROV_TODOS = c.proveedores || []; }, function () {});
    var n = $('f-num'); if (n) n.textContent = r.siguienteId || '';
    return r;
  });
}
function llenarListas() {
  $('dl-prov').innerHTML = (BOOT.proveedores || []).map(function (p) { return '<option value="' + esc(p.proveedor) + '">'; }).join('');
  $('dl-cc').innerHTML = (BOOT.cuentas || []).map(function (c) { return '<option value="' + esc(c.codigo) + '" label="' + esc(c.descripcion) + '">' + esc(c.descripcion) + '</option>'; }).join('');
}
function cargarLista() {
  return MK.api('api_solicitudes', MK.pin, { limite: 5000 }).then(function (r) {
    if (!r || !r.ok) throw new Error((r && r.error) || 'No se pudieron cargar las solicitudes.');
    LISTA = (r.solicitudes || []).map(normal); LISTA_OK = true;
    if ('umbralVistoBueno' in r) UMBRAL = umbralDe(r);
  });
}
/* La lista no trae la fecha de aprobación: para decir cuántos días lleva
   una aprobada esperando el pago se consulta cada una (son pocas). */
function completarFechas() {
  var faltan = LISTA.filter(function (s) { return s.estado === 'APROBADA' && !(s.solicitudId in FAP); }).slice(0, 40);
  if (!faltan.length) return;
  Promise.all(faltan.map(function (s) {
    return MK.api('api_verSolicitud', MK.pin, s.solicitudId).then(function (r) { FAP[s.solicitudId] = (r && r.ok && r.solicitud.fechaAprobacion) || ''; }, function () { FAP[s.solicitudId] = ''; });
  })).then(function () { if (TAB === 'sol') pintarBandeja(); });
}
function recargar() {
  var abiertoDet = DET && $('mk-lado') && $('mk-lado').classList.contains('si');
  cargarBoot().catch(function () {});
  cargarLista().then(function () {
    pintarTodo(); completarFechas(); cargarPend();
    if (NUEVA) { var n = NUEVA; NUEVA = ''; if (buscarSol(n)) verDet(n); }
    else if (abiertoDet && buscarSol(DET)) verDet(DET, true);
  }, function (e) { MK.aviso(e.message); });
  if (CAJA) cargarCaja();
}

/* ═══ marco y pestañas ═══ */
function pintarMarco() {
  $('main').innerHTML =
    '<div class="ph"><div><h1>Solicitudes de compra</h1><p>Pagos a proveedores y caja menuda · en qué va cada cosa y quién la tiene</p></div><div class="sp"></div>' +
      (BOOT.verFinanzas ? '<a class="btn gh" href="Finanzas.html">' + MK.ic('grafico', 15) + 'Finanzas</a>' : '') + '</div>' +
    '<div class="tabs" id="tabs">' +
      '<button data-t="sol" onclick="irTab(\'sol\')">Solicitudes<span class="n" id="n-sol" hidden></span></button>' +
      '<button data-t="nueva" onclick="irTab(\'nueva\')">Nueva solicitud</button>' +
      '<button data-t="caja" onclick="irTab(\'caja\')">Caja menuda</button>' +
      '<button data-t="tot" onclick="irTab(\'tot\')">Totales</button></div>' +
    '<div class="pane" id="p-sol">' +
      '<div id="pend"></div>' +
      '<div class="kp4" id="kpis"></div>' +
      '<div class="barra"><label class="bus">' + MK.ic('buscar', 15) + '<input id="q" placeholder="Buscar proveedor, número o concepto…" oninput="pintarBandeja()"></label>' +
        '<select class="sel" id="fp" onchange="pintarBandeja()" aria-label="Proyecto"><option value="">Todos los proyectos</option>' +
          (BOOT.proyectos || []).map(function (p) { return '<option value="' + esc(p) + '">' + esc(rot(p)) + '</option>'; }).join('') + '<option value="-">Sin proyecto</option></select>' +
        (BOOT.verFinanzas ? '<label class="ck"><input type="checkbox" id="mias" onchange="SOLO_MIAS=this.checked;pintarBandeja()"> Solo las mías</label>' : '') +
        '<div class="sp"></div><button class="btn pri" onclick="irTab(\'nueva\')">' + MK.ic('mas', 15) + 'Nueva solicitud</button></div>' +
      '<div class="tbw"><table class="tb" id="tb-sol"><tbody><tr><td><div class="cargando">Cargando solicitudes…</div></td></tr></tbody></table></div>' +
    '</div>' +
    '<div class="pane" id="p-nueva"><div id="form"></div></div>' +
    '<div class="pane" id="p-caja"><div id="cajabox"></div></div>' +
    '<div class="pane" id="p-tot"><div id="totbox"></div></div>';
}
function irTab(t, sinHash) {
  TAB = t;
  [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
  ['sol', 'nueva', 'caja', 'tot'].forEach(function (x) { var p = $('p-' + x); if (p) p.classList.toggle('on', x === t); });
  if (!sinHash) { try { history.replaceState(null, '', location.pathname + location.search + (t === 'sol' ? '' : '#' + t)); } catch (e) {} }
  if (t !== 'sol') MK.cerrarLado();
  if (t === 'caja' && !CAJA) cargarCaja();
  if (t === 'tot') pintarTot();
  if (t === 'sol') pintarBandeja();
  window.scrollTo(0, 0);
}
function pintarTodo() { pintarBandeja(); if (TAB === 'tot') pintarTot(); }

/* ═══ bandeja ═══ */
var FILTROS = [['tramite', 'En trámite'], ['VB', 'Esperan visto bueno'], ['SOLICITADA', 'Solicitadas'], ['APROBADA', 'Aprobadas'], ['PAGADA', 'Pagadas'], ['RECHAZADA', 'Rechazadas'], ['ANULADA', 'Anuladas'], ['todas', 'Todas']];
function pasaFiltro(s, f) {
  if (f === 'tramite') return abierta(s);
  if (f === 'VB') return vista(s) === 'VB';
  if (f === 'todas') return true;
  return s.estado === f;
}
function mesPago(s) { return s.estado === 'PAGADA' && String(s.fechaPago || '').slice(0, 7) === MK.hoy.slice(0, 7); }
function pintarBandeja() {
  var tb = $('tb-sol'); if (!tb || !LISTA_OK) return;
  var base = LISTA.filter(function (s) { return !SOLO_MIAS || yo(s.solicitadoPor); });
  var ab = base.filter(abierta), vb = base.filter(function (s) { return vista(s) === 'VB'; }),
      pg = base.filter(function (s) { return s.estado === 'APROBADA'; }), pag = base.filter(mesPago);
  var suma = function (a) { return r2(a.reduce(function (x, s) { return x + (Number(s.total) || 0); }, 0)); };
  var esps = ab.map(espera).filter(function (x) { return x !== null; });
  var prom = esps.length ? Math.round(esps.reduce(function (a, b) { return a + b; }, 0) / esps.length * 10) / 10 : null;
  var ns = $('n-sol'); if (ns) { ns.textContent = ab.length; ns.hidden = !ab.length; }
  $('kpis').innerHTML =
    kpiB('tramite', ab.length, 'En trámite · ' + bal(suma(ab)), prom !== null ? 'esperan ' + String(prom).replace('.', ',') + ' días en promedio' : '') +
    (UMBRAL === Infinity ? '' : kpiB('VB', vb.length, 'Esperan visto bueno', 'pasan de ' + bal(UMBRAL))) +
    kpiB('APROBADA', pg.length, (APROB() ? 'Aprobadas por pagar · ' : 'Por pagar · ') + bal(suma(pg))) +
    kpiB('PAGADA', bal(suma(pag)), 'Pagado en ' + MK.MESES_L[Number(MK.hoy.slice(5, 7)) - 1] + ' · ' + pag.length + ' solicitud' + (pag.length === 1 ? '' : 'es'));
  var q = (($('q') || {}).value || '').trim().toLowerCase(), pr = ($('fp') || {}).value || '';
  var l = base.filter(function (s) { return pasaFiltro(s, FIL); }).filter(function (s) {
    if (pr === '-' && s.proyecto) return false;
    if (pr && pr !== '-' && s.proyecto !== pr) return false;
    return !q || (s.solicitudId + ' ' + s.proveedor + ' ' + s.concepto + ' ' + s.ruc).toLowerCase().indexOf(q) >= 0;
  });
  var cuenta = function (f) { return base.filter(function (s) { return pasaFiltro(s, f); }).length; };
  var sel = DET && $('mk-lado') && $('mk-lado').classList.contains('si') ? DET : '';
  tb.innerHTML = '<thead><tr><td colspan="6" class="fil"><div class="row w" style="gap:6px">' +
      FILTROS.map(function (c) { return '<button class="chip' + (FIL === c[0] ? ' on' : '') + '" onclick="ponFiltro(\'' + c[0] + '\')">' + c[1] + ' <span class="n">' + cuenta(c[0]) + '</span></button>'; }).join('') +
    '</div></td></tr><tr class="cab"><th>Solicitud</th><th>Proveedor y concepto</th><th class="oc">Proyecto</th><th>Estado</th><th>Esperando</th><th class="r">Total</th></tr></thead><tbody>' +
    (l.length ? l.map(function (s) {
      return '<tr class="clic' + (s.estado === 'ANULADA' ? ' anul' : '') + (sel === s.solicitudId ? ' sel' : '') + '" onclick="verDet(\'' + esc(s.solicitudId) + '\')" tabindex="0" onkeydown="if(event.key===\'Enter\')verDet(\'' + esc(s.solicitudId) + '\')">' +
        '<td class="c-id"><b class="mono" style="font-weight:600">' + esc(s.solicitudId) + '</b><small class="muted">' + esc(MK.fechaCorta(s.fecha)) + '</small></td>' +
        '<td class="c-pv"><span class="pv">' + esc(s.proveedor) + '</span>' + (s.urgencia === 'URGE' ? ' <span class="tag t-bad">URGE</span>' : '') +
          (s.origen === 'CAJA MENUDA' ? ' <span class="tag t-gris">Caja menuda</span>' : '') + '<div class="cpt">' + esc(s.concepto) + '</div></td>' +
        '<td class="oc small">' + (s.proyecto ? esc(rot(s.proyecto)) : '<span class="muted">—</span>') + '</td>' +
        '<td class="c-est">' + tagE(s) + '</td>' +
        '<td class="c-esp">' + esperaHTML(s) + '</td>' +
        '<td class="c-tot r mono">' + bal(s.total) + '</td></tr>';
    }).join('') : '<tr><td colspan="6">' + MK.vacio(LISTA.length ? 'Nada con este filtro.' : 'Todavía no hay solicitudes. Crea la primera en «Nueva solicitud».') + '</td></tr>') + '</tbody>';
}
function kpiB(f, v, t, t2) { return '<button type="button" class="kpi' + (FIL === f ? ' on' : '') + '" onclick="ponFiltro(\'' + f + '\')"><b>' + esc(v) + '</b><span>' + esc(t) + '</span>' + (t2 ? '<em>' + esc(t2) + '</em>' : '') + '</button>'; }
function ponFiltro(f) { FIL = f; pintarBandeja(); }

/* ═══ panel de detalle ═══ */
function verDet(id, quieto) {
  var s = buscarSol(id); if (!s) return;
  DET = id;
  MK.lado('<div id="det">' + detHTML(s, null) + '</div>');
  if (!quieto) pintarBandeja();
  MK.api('api_verSolicitud', MK.pin, id).then(function (r) {
    if (DET !== id || !$('det')) return;
    if (!r || !r.ok) { var x = $('det-lin'); if (x) x.innerHTML = '<div class="aviso rj">' + esc((r && r.error) || 'No se pudo abrir el detalle.') + '</div>'; return; }
    if (r.solicitud.estado === 'APROBADA') FAP[id] = r.solicitud.fechaAprobacion || '';
    var m = normal(Object.assign({}, s, r.solicitud)); m.requiereVistoBueno = s.requiereVistoBueno;
    $('det').innerHTML = detHTML(m, r);
  }, function (e) { var x = $('det-lin'); if (x) x.innerHTML = '<div class="aviso rj">Sin conexión: ' + esc(e.message) + '</div>'; });
}
function evento(t, q, f, extra, clase) {
  return '<div class="ev ' + (clase || 'ok') + '"><b>' + esc(t) + '</b>' + (q ? ' <span class="q">· ' + esc(q) + '</span>' : '') +
    '<small class="muted">' + (f ? esc(MK.fecha(f)) : 'sin fecha registrada') + (extra ? ' · ' + extra : '') + '</small>';
}
function lineaTiempo(s, completo) {
  var ev = [], pend = [];
  var fSol = s.fechaSolicitud || s.fecha;
  ev.push({ h: evento('Solicitó', persona(s.solicitadoPor), fSol, s.origen === 'CAJA MENUDA' ? 'reposición de caja menuda' : ''), f: fSol });
  var nvb = Number(s.total) > UMBRAL || s.requiereVistoBueno;
  if (s.vistoBuenoPor) ev.push({ h: evento('Dio el visto bueno', persona(s.vistoBuenoPor), s.fechaVistoBueno, 'gerencia de gestión'), f: s.fechaVistoBueno });
  else if (nvb && s.estado === 'SOLICITADA') pend.push(['Visto bueno', 'gerencia de gestión']);
  if (s.estado === 'RECHAZADA') ev.push({ h: evento('Rechazó', persona(s.aprobadoPor), s.fechaAprobacion, s.motivoRechazo ? 'motivo: ' + esc(s.motivoRechazo) : '', 'bad'), f: s.fechaAprobacion });
  else if ((s.estado === 'APROBADA' || s.estado === 'PAGADA') && !(!persona(s.aprobadoPor) && !APROB())) ev.push({ h: evento('Aprobó', persona(s.aprobadoPor), completo ? s.fechaAprobacion : (FAP[s.solicitudId] || ''), ''), f: completo ? s.fechaAprobacion : FAP[s.solicitudId] });
  else if (s.estado === 'SOLICITADA') pend.push(['Aprobación', 'gerencia o administración']);
  if (s.estado === 'PAGADA') {
    var ref = [s.referenciaPago ? 'ref. ' + esc(s.referenciaPago) : '', s.numeroCheque ? 'cheque Nº ' + esc(s.numeroCheque) : ''].filter(Boolean).join(' · ');
    ev.push({ h: evento('Pagó', persona(s.pagadoPor) ? 'lo marcó ' + persona(s.pagadoPor) : '', s.fechaPago, ref), f: s.fechaPago });
  } else if (abierta(s)) pend.push(['Pago', 'lo registra ' + quienes(REG().registranPago)]);
  if (s.estado === 'ANULADA') ev.push({ h: '<div class="ev bad"><b>Anulada</b><small class="muted">' + (s.motivoRechazo ? 'motivo: ' + esc(s.motivoRechazo) : 'sin motivo escrito') + '</small>', f: '' });
  var html = ev.map(function (e, i) {
    var nx = ev[i + 1], dur = (nx && e.f && nx.f) ? Math.max(0, MK.dias(e.f, nx.f)) : null;
    return e.h + (dur !== null ? '<small class="muted">' + (dur === 0 ? 'pasó el mismo día' : 'estuvo ' + diasTxt(dur) + ' en este paso') + '</small>' : '') + '</div>';
  }).join('');
  var d = espera(s);
  html += pend.map(function (p, i) {
    return '<div class="ev pend"><b>' + p[0] + '</b> <span class="small">· ' + p[1] + '</span>' +
      (i === 0 ? '<small class="espe">' + (d === null ? 'Esperando' : d === 0 ? 'Esperando desde hoy' : 'Esperando desde hace ' + diasTxt(d)) + '</small>' : '<small>pendiente</small>') + '</div>';
  }).join('');
  return '<div class="tl">' + html + '</div>';
}
function accionesHTML(s) {
  var a = [], notas = [], v = vista(s), pa = puedeAprobar();
  if (v === 'VB') {
    notas.push('<div class="nota warn">Es por <b>' + bal(s.total) + '</b> y pasa de ' + bal(UMBRAL) + ': necesita el visto bueno de gerencia de gestión antes de aprobarse. Quien lo dé no puede ser quien apruebe.</div>');
    if (pa && !yo(s.solicitadoPor)) a.push('<button class="btn ok sm" onclick="accVB(this)">' + MK.ic('check', 14) + 'Dar el visto bueno</button>');
    else if (pa) notas.push('<div class="nota">Tú pediste este pago: el visto bueno lo da otra persona de gerencia.</div>');
  }
  if (s.estado === 'SOLICITADA' && v !== 'VB') {
    if (pa && !yo(s.vistoBuenoPor)) a.push('<button class="btn ok sm" onclick="accAprobar(this)">' + MK.ic('check', 14) + 'Aprobar</button>');
    else if (pa) notas.push('<div class="nota">Tú diste el visto bueno: la aprobación la da otra persona de gerencia.</div>');
  }
  if (s.estado === 'SOLICITADA' && pa) a.push('<button class="btn bad sm" onclick="accMotivo(\'RECHAZADA\')">Rechazar</button>');
  if (s.estado === 'SOLICITADA' && !pa) notas.push('<div class="nota">La aprueba gerencia o administración. Te queda a la vista aquí mientras espera.</div>');
  if (s.estado === 'APROBADA' && puedePagar(s)) a.push('<button class="btn ok sm" onclick="accPagar()">' + MK.ic('billete', 14) + 'Registrar el pago</button>');
  if (s.estado === 'APROBADA' && !puedePagar(s)) notas.push('<div class="nota">El pago lo registra ' + quienes(REG().registranPago) + '.</div>');
  if (s.notaGerencia) notas.unshift('<div class="nota warn" style="white-space:pre-wrap"><b>Nota de gerencia</b>\n' + esc(s.notaGerencia) + '</div>');
  if (abierta(s) && puedeAnular()) a.push('<button class="btn gh sm" style="color:var(--bad)" onclick="accMotivo(\'ANULADA\')">Anular</button>');
  return notas.join('<div style="height:8px"></div>') + (a.length ? '<div class="acc" id="det-acc">' + a.join('') + '</div>' : '');
}
function detHTML(s, r) {
  var lin = r ? r.lineas || [] : null, completo = !!r;

function bloquear(si) { [].forEach.call(document.querySelectorAll('#det-acc button'), function (b) { b.disabled = si; }); }
function mover(estado, datos, alTerminar) {
  var id = DET, s = buscarSol(id) || {};
  bloquear(true);
  return MK.api('api_estadoSolicitud', MK.pin, id, estado, datos || {}).then(function (r) {
    bloquear(false);
    if (!r || !r.ok) { if (alTerminar) alTerminar(r); MK.aviso((r && r.error) || 'No se pudo cambiar el estado.'); return; }
    if (alTerminar) alTerminar(r);
    MK.aviso({ APROBADA: id + ' aprobada · queda por pagar', RECHAZADA: id + ' rechazada', PAGADA: id + ' registrada como pagada', ANULADA: id + ' anulada' }[estado] || 'Listo');
    MK.cambio({ tipo: 'compra', id: id, proveedor: s.proveedor });
  }, function (e) { bloquear(false); if (alTerminar) alTerminar({ ok: false }); MK.aviso('Sin conexión con el servidor. ' + e.message); });
}
function accVB() {

      '<div class="kpi"><b>' + bal(tot.pen) + '</b><span>Pendiente · por aprobar o por pagar</span></div></div>' +
    (!val.length ? '<div class="card">' + MK.vacio('No hay solicitudes en este rango.') + '</div>' :
    '<div class="card" style="padding:0;overflow:hidden;margin-bottom:14px"><div style="padding:14px 16px 0"><h3>Por proyecto<span class="sp"></span><span class="l ley"><span><i style="background:var(--navy2)"></i>Pagado</span><span><i style="background:#7f97c4"></i>Aprobado sin pagar</span><span><i style="background:#c9d4e6"></i>Por aprobar</span></span></h3></div>' +
      '<div style="overflow-x:auto"><table class="tb">' + cab.replace('__', 'Proyecto') + '<tbody>' + porP.map(function (x) { return fila(x.k ? esc(rot(x.k)) : '<span class="muted">Sin proyecto</span>', x.o, maxP); }).join('') +
      '<tr><td><b>Total</b></td><td class="r mono">' + bal(tot.ped) + '</td><td class="r mono">' + bal(tot.apr) + '</td><td class="r mono">' + bal(tot.pag) + '</td><td class="r mono">' + bal(tot.pen) + '</td><td class="oc"></td></tr></tbody></table></div></div>' +
    '<div class="card" style="padding:0;overflow:hidden;margin-bottom:14px"><div style="padding:14px 16px 0"><h3>Por mes</h3></div><div style="overflow-x:auto"><table class="tb">' + cab.replace('__', 'Mes') + '<tbody>' +
      porM.map(function (x) { return fila('<span style="text-transform:capitalize">' + esc(MK.mesNombre(x.k)) + '</span>', x.o, maxM); }).join('') + '</tbody></table></div></div>' +
    (mx.length > 1 ? '<div class="card" style="padding:0;overflow:hidden"><div style="padding:14px 16px 0"><h3>Pedido por proyecto y mes</h3></div><div style="overflow-x:auto"><table class="tb mx"><thead><tr><th>Proyecto</th>' + mx.map(function (m) { return '<th>' + esc(MK.MESES[Number(m.slice(5, 7)) - 1]) + ' ' + m.slice(2, 4) + '</th>'; }).join('') + '<th>Total</th></tr></thead><tbody>' +
      porP.map(function (x) {
        var t = 0; var celdas = mx.map(function (m) { var v = sumar(val.filter(function (s) { return (s.proyecto || '') === x.k && String(s.fecha).slice(0, 7) === m; })).ped; t += v; return '<td class="mono">' + (v ? bal(v) : '<span class="muted">—</span>') + '</td>'; }).join('');
        return '<tr><td>' + (x.k ? esc(rot(x.k)) : '<span class="muted">Sin proyecto</span>') + '</td>' + celdas + '<td class="mono">' + bal(r2(t)) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>' : ''));
}

/* ═══ pendientes del asistente (la bandeja que tenía SolicitudPago) ═══ */
function cargarPend() {
  if (!BOOT || !BOOT.verFinanzas) return;
  MK.api('api_pendientes', MK.pin, 'solicitudes', false).then(function (r) { PEND = (r && r.ok && r.pendientes) || []; pintarPend(); }, function () {});
}
function pintarPend() {
  var e = $('pend'); if (!e) return;
  if (!PEND.length) { e.innerHTML = ''; return; }
  var pri = { alta: 't-bad', media: 't-warn', baja: 't-gris' };
  e.innerHTML = '<div class="card pend" style="margin-bottom:14px"><h3>' + MK.ic('campana', 15) + 'El asistente encontró ' + PEND.length + ' pendiente' + (PEND.length === 1 ? '' : 's') + '</h3><div class="lst">' +
    PEND.map(function (x, i) {
      return '<div class="it"><div class="tx"><b>' + esc(x.titulo) + '</b> <span class="tag ' + (pri[x.prioridad] || 't-gris') + '">' + esc(x.prioridad || 'media') + '</span><small>' + esc(x.descripcion || '') + '</small>' +
        '<small>' + esc([x.asistente, x.fecha].filter(Boolean).join(' · ')) + (x.estado === 'pospuesto' ? ' · pospuesto, volvió hoy' : '') + '</small>' +
        '<div class="acc">' + (x.enlace ? '<button class="btn sm" onclick="pendAbrir(' + i + ')">Abrir</button>' : '') +
          '<button class="btn sm ok" onclick="pendCerrar(' + i + ',\'resuelto\',\'Atendido desde la bandeja\',0)">Ya lo atendí</button>' +
          '<button class="btn sm" onclick="pendCerrar(' + i + ',\'pospuesto\',\'Pospuesto desde la bandeja\',1)" title="Vuelve mañana si el problema sigue">Mañana</button>' +
          '<button class="btn sm" onclick="pendCerrar(' + i + ',\'pospuesto\',\'Pospuesto desde la bandeja\',7)" title="Vuelve en una semana si el problema sigue">En 7 días</button>' +
          '<button class="btn sm gh" onclick="pendCerrar(' + i + ',\'descartado\',\'Marcado «no aplica» desde la bandeja\',0)" title="No es un problema. No se vuelve a avisar.">No aplica</button></div></div></div>';
    }).join('') + '</div></div>';
}
function pendAbrir(i) {
  var x = PEND[i]; if (!x) return;
  var m = String(x.enlace || '').match(/SP-\d{4}-\d+/i);
  if (m && buscarSol(m[0].toUpperCase())) { irTab('sol'); verDet(m[0].toUpperCase()); return; }
  window.open('index.html' + x.enlace, '_blank');
}
function pendCerrar(i, estado, nota, dias) {
  var x = PEND[i]; if (!x) return;
  var antes = PEND.slice(); PEND.splice(i, 1); pintarPend();
  MK.api('api_cerrarPendiente', MK.pin, x.pendienteId, estado, nota, dias).then(function (r) {
    if (!r || !r.ok) { PEND = antes; pintarPend(); MK.aviso((r && r.error) || 'No se pudo cerrar'); return; }
    if (estado === 'pospuesto') MK.aviso(dias === 1 ? 'Vuelve mañana' : 'Vuelve en ' + dias + ' días');
  }, function () { PEND = antes; pintarPend(); MK.aviso('Sin conexión'); });
}
</script>
