<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuestas y contratos · Mercadeo · ECOVSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:'oculto',enSupabase:/^api_(?!optimizarRuta$)/,
  escritura:/^api_(crm(Guardar|Completar|Anular|Captura|Mover|Reasignar|Borrar|Subir|Usar)|guardar|marcar|abrir|cerrar|registrar|borrar|eliminar|crear|actualizar|enviar|corregir|dar|anular|confirmar|aprobar|rechazar|subir|asignar|mover|cambiar|agregar|nuevo|editar|reabrir|emitir|pasar|pedir)/i};</script>
<script src="puente.js"></script>
<link rel="stylesheet" href="mercadeo-kit.css">
<script src="mercadeo-kit.js"></script>
<style>
/* ═══ Propuestas y contratos · opción A «Biblioteca con vista previa» ═══ */
.ico-d{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#eef2f8;color:var(--navy2);flex:none}
.ico-d.c{background:#f1f3f7;color:#3a4a63}
.srch2{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff;min-width:0;flex:1 1 220px;max-width:340px;color:var(--muted2)}
.srch2 input{border:0;outline:0;padding:8px 0;font:500 13.5px Archivo,sans-serif;width:100%;min-width:0;background:none;color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip .c{font-size:11px;opacity:.75}
.venc{color:var(--bad);font-weight:700}.pronto{color:#8a5a00;font-weight:700}
.canal{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:11.5px}
.canal svg.i{width:12px;height:12px}

.a-kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.a-kp button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-family:inherit;color:var(--ink)}
.a-kp button:hover{border-color:#9db4d8}
.a-kp button.on{border-color:var(--navy2);box-shadow:inset 0 0 0 1px var(--navy2)}
.a-kp b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.a-kp span{font-size:12px;color:var(--muted)}
.a-ren{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.a-wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
.a-tab{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.a-tab .scr{overflow-x:auto}
.a-tab table{min-width:560px}
.a-tab tbody tr{cursor:pointer}
.a-tab tr.sel td{background:#eef3fb!important}
.a-tab td{padding:9px 10px}
.a-tab .dcell{display:flex;gap:10px;align-items:center}
.a-tab .dcell b{font-weight:600}
.a-tab td small{display:block;color:var(--muted);font-size:11.5px}
.a-tab td .cu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.a-tab td small.mob{display:none}
.a-tab td small.est-s{white-space:nowrap;margin-top:2px}
.cartera td.num{white-space:nowrap}
/* barra del kit: que el buscador no empuje la página en celular */
.sysbar .srch{min-width:0}.sysbar .srch input{width:100%}
.a-pane{position:sticky;top:72px;max-height:calc(100vh - 86px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;scrollbar-width:thin}
.tag.gris-l{background:#fff;border:1px dashed #b9c5d8;color:var(--muted)}

/* detalle */
.dt-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dt-h .tx{flex:1;min-width:0}.dt-h .tx b{font-size:15px;display:block;overflow-wrap:anywhere}.dt-h .tx small{color:var(--muted);font-size:12.5px}
.dt-acc{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.dl2{display:grid;grid-template-columns:104px 1fr;gap:6px 10px;font-size:12.5px;margin-bottom:6px}
.dl2 dt{color:var(--muted);font-weight:600;font-size:12px}
.dl2 dd{min-width:0;overflow-wrap:anywhere}
.nota-v{font-size:12px;color:#4d5b70;background:var(--line2);border-radius:8px;padding:8px 10px;margin:10px 0 0;display:flex;gap:8px;align-items:flex-start}
.nota-v svg{flex:none;margin-top:1px}
.dt h4{font-size:11px;letter-spacing:.8px;color:#5b6a80;margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.dt h4 .sp{flex:1}
.pv-bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:16px 0 6px}
.pv-bar h4{margin:0}
#pv-acc{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.hist{font-size:12.5px}
.hist .it{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2)}
.hist .it:last-child{border:0}
.hist svg{color:var(--muted2);margin-top:1px}
.verlink{display:flex;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:12.5px;background:#fff;width:100%;text-align:left;font-family:inherit;color:var(--ink)}
.verlink:hover{border-color:#9db4d8}
.pvbox{border:1px solid var(--line);border-radius:10px;background:#f6f8fb;overflow:hidden;min-height:120px}
.pv{position:relative;overflow:hidden;background:#fff}
.pv iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.pvbox img{display:block;width:100%;height:auto;background:#fff}
.pvbox iframe.pdf{display:block;width:100%;height:520px;border:0;background:#fff}
.pvbox .vacio{padding:22px 14px}
.falta{background:var(--bad-bg);border:1px solid #f3c2c4;color:#8c1d22;border-radius:10px;padding:10px 12px;font-size:12.5px}
.falta ul{margin:4px 0 6px 18px}

/* hojas */
.zona{border:1.5px dashed #c9d3e2;border-radius:12px;padding:16px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fcfdfe;margin-top:6px}
.zona:hover,.zona.sobre{border-color:var(--navy2);color:var(--navy2);background:#f5f8fd}
.zona b{color:var(--ink)}
.opcs{display:grid;gap:6px;max-height:220px;overflow:auto;margin-top:6px}
.opcs button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font:500 13px Archivo,sans-serif;color:var(--ink)}
.opcs button:hover,.opcs button.on{border-color:var(--navy2);background:var(--hover)}
.opcs button b{display:block;font-weight:600}.opcs button small{color:var(--muted)}
.msgerr{color:var(--bad);font-size:12.5px;margin-top:8px;min-height:1px}
.hoja .grande{width:100%;height:72vh;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}

/* contratos de la cartera */
.sec-h{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h p{color:var(--muted);font-size:12.5px;margin-top:2px}
.kgbar{display:flex;align-items:center;gap:8px;min-width:150px}
.kgbar .bar-h{flex:1;min-width:60px}
.kgbar .bar-h i.w{background:var(--amber)}.kgbar .bar-h i.b{background:var(--bad)}
.cartera td{vertical-align:middle}
.cartera .acc{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.lado .dt{padding-top:26px}

@media(max-width:1440px){.a-tab .hm2{display:none}}
@media(max-width:1250px){.a-wrap{grid-template-columns:minmax(0,1fr) 360px}}
@media(max-width:560px){.sysbar .mk{display:none}}
@media(max-width:900px){
  .a-wrap{grid-template-columns:1fr}
  .a-pane{display:none}
  .a-kp{grid-template-columns:1fr 1fr}
}
@media(max-width:700px){
  .a-tab table{min-width:0}
  .a-tab .hm{display:none}
  .a-tab td small.mob{display:block}
  .a-tab td small.est-s{display:none}
  .a-tab td .cu{max-width:none;white-space:normal}
  .srch2{max-width:none;flex-basis:100%}
  .cartera .hm{display:none}
  .dl2{grid-template-columns:1fr;gap:0}.dl2 dd{margin-bottom:6px}
  .ph .btn{width:100%}
}
/* gerencia solo consulta */
body.solo-ver #bt-nuevo,body.solo-ver [data-r="msg"],body.solo-ver [data-r="tarea"]{display:none!important}
</style>
</head>
<body class="mk">
<div id="sysbar"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"><div class="cargando">Cargando…</div></main></div>
<script>
(function () {
  var D = null;                 // api_crmDocumentos
  var OPS = {}, CLIS = {};       // oportunidades por código, clientes por id
  var F = { q: '', tipo: 'todo', estado: 'todos', ant: false };
  var FC = { solo: false, q: '' };
  var SEL = null;               // id del documento elegido
  var VISTA = {};               // id → 'archivo' | 'hoja'
  var BLOBS = {};               // archivoId → {url,tipo,nombre}
  var ENVIO = null;             // qué hacer cuando MK.mensaje se envía
  var TIPOS_DOC = { propuesta: 'Propuesta', contrato: 'Contrato', documento: 'Documento', firmado: 'Firmado' };
  var MAX_ARCHIVO = 4200000;

  function $(i) { return document.getElementById(i); }
  function esc(s) { return MK.esc(s); }
  function aj() { return (D && D.ajustes) || (MK.base && MK.base.ajustes) || {}; }
  function diasRen() { return Number(aj().diasRenovacion) || 60; }
  function hoy() { return MK.hoy || MK.hoyLocal(); }
  function ahora() { return hoy() + ' ' + MK.ahoraHM(); }
  function fDia(s) { return String(s || '').slice(0, 10); }
  function faltan(iso) { return /^\d{4}-\d{2}-\d{2}/.test(iso || '') ? MK.dias(hoy(), fDia(iso)) : null; }
  function tipoNom(t) { return TIPOS_DOC[t] || (t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Documento'); }
  function esMovil() { return window.matchMedia('(max-width:900px)').matches; }
  function linkSeguro(u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; }

  /* ─────────── datos ─────────── */
  function preparar() {
    var g = {};
    D.documentos.forEach(function (d) {
      d.k = d.ref + '|' + d.tipo;
      (g[d.k] = g[d.k] || []).push(d);
      d.deducido = !!d.deducido || /^auto-/.test(d.id);
      d.ef = efectivo(d);
    });
    Object.keys(g).forEach(function (k) {
      var l = g[k].sort(function (a, b) { return (b.version - a.version) || String(b.creadoEn || '').localeCompare(String(a.creadoEn || '')); });
      var vivo = l.filter(function (d) { return d.estado !== 'anulada'; })[0] || l[0];
      l.forEach(function (d) { d.anterior = d !== vivo; d.hermanos = l; });
    });
  }
  function efectivo(d) {
    if (d.tipo !== 'contrato' && d.estado === 'enviada' && d.validoHasta && fDia(d.validoHasta) < hoy()) return 'vencida';
    if (d.tipo === 'contrato' && d.estado === 'firmada' && d.validoHasta && fDia(d.validoHasta) < hoy()) return 'vencida';
    return d.estado;
  }
  function venceProto(d) {
    var n = faltan(d.validoHasta); if (n === null || n < 0) return false;
    if (d.tipo === 'contrato') return d.ef === 'firmada' && n <= diasRen();
    return d.ef === 'enviada' && n <= 7;
  }
  function info(d) {   // contacto, etapa y valor que vienen de la oportunidad o del cliente
    if (d.refTipo === 'op') {
      var o = OPS[d.ref];
      if (o) return { nombre: o.contacto, tel: o.celular || o.telefono, correo: o.correo, etapa: o.estado, valor: o.valor != null ? o.valor : d.valor,
        recurrente: !o.visitaUnica, validez: o['validez propuesta'], existe: true };
      return { etapa: d.etapa, valor: d.valor, recurrente: true };
    }
    var c = CLIS[d.ref];
    if (c) return { nombre: c.contacto, tel: telDe(c), correo: c.correo, valor: c.planCosto, recurrente: true, existe: true, cliente: c };
    return { valor: d.valor };
  }
  function telDe(c) { var w = String(c.whatsapp || ''); if (w && !/^https?:/i.test(w) && /\d{7}/.test(w.replace(/\D/g, ''))) return w; return c.telefono || ''; }

  /* ─────────── estados y piezas ─────────── */
  function tagE(d) {
    var e = d.ef, C = d.tipo === 'contrato', x;
    if (e === 'borrador') x = ['Borrador', 't-gris'];
    else if (e === 'enviada') x = C ? ['Para firma', 't-warn'] : ['Enviada', 't-info'];
    else if (e === 'aceptada') x = ['Aceptada', 't-ok'];
    else if (e === 'firmada') x = [C ? 'Firmado' : 'Firmada', 't-ok'];
    else if (e === 'rechazada') x = ['Rechazada', 't-bad'];
    else if (e === 'vencida') x = [C ? 'Vencido' : 'Vencida', 't-bad'];
    else if (e === 'anulada') x = ['Anulada', 't-gris'];
    else x = [e || '—', 't-gris'];
    return '<span class="tag ' + x[1] + '">' + esc(x[0]) + '</span>';
  }
  function icD(d, s) { return '<span class="ico-d' + (d.tipo === 'contrato' ? ' c' : '') + '">' + MK.ic(d.tipo === 'contrato' ? 'contrato' : d.tipo === 'propuesta' ? 'documento' : 'clip', s || 16) + '</span>'; }
  function titulo(d) { return d.nombre + (d.version > 1 ? ' · v' + d.version : ''); }
  function canalTx(c) { return c === 'whatsapp' ? ['WhatsApp', 'whatsapp'] : c === 'correo' ? ['Correo', 'correo'] : c === 'mano' ? ['En mano', 'persona'] : c ? [c, 'enlace'] : null; }
  function celEnvio(d) {
    if (d.ef === 'borrador') return '<span class="muted">Sin enviar</span>';
    if (!d.enviadoEn) return '<span class="muted">Sin fecha</span>';
    var c = canalTx(d.canal);
    return MK.fechaCorta(fDia(d.enviadoEn)) + (c ? '<small class="canal">' + MK.ic(c[1], 12) + ' ' + esc(c[0]) + '</small>' : d.enviadoA ? '<small class="cu" style="max-width:150px" title="' + esc(d.enviadoA) + '">' + esc(d.enviadoA) + '</small>' : '');
  }
  function celVence(d) {
    if (!d.validoHasta) return d.tipo === 'propuesta' && d.ef === 'borrador' ? '<span class="muted">al enviarla</span>' : '<span class="muted">—</span>';
    var n = faltan(d.validoHasta), f = MK.fechaCorta(fDia(d.validoHasta));
    if (['aceptada', 'rechazada', 'anulada'].indexOf(d.ef) >= 0 || (d.tipo !== 'contrato' && d.ef === 'firmada')) return f + '<small>—</small>';
    var cls = n < 0 ? 'venc' : n <= (d.tipo === 'contrato' ? diasRen() : 7) ? 'pronto' : '';
    var t = n < 0 ? (d.tipo === 'contrato' ? 'venció' : 'venció') + ' hace ' + (-n) + ' d' : n === 0 ? 'vence hoy' : (d.tipo === 'contrato' ? 'en ' : 'vence en ') + n + ' d';
    return f + '<small class="' + cls + '">' + t + '</small>';
  }
  function valorTx(d) {
    var i = info(d); if (!i.valor) return '<span class="muted">—</span>';
    return MK.dinero(i.valor) + (i.recurrente ? '<small>por mes</small>' : '<small>visita única</small>');
  }

  /* ─────────── filtros ─────────── */
  function pasaTipo(d) { return F.tipo === 'todo' || (F.tipo === 'otros' ? ['propuesta', 'contrato'].indexOf(d.tipo) < 0 : d.tipo === F.tipo); }
  function pasaEstado(d, est) {
    var e = d.ef;
    switch (est) {
      case 'todos': return true;
      case 'borrador': return e === 'borrador';
      case 'env': return e === 'enviada';
      case 'firm': return e === 'aceptada' || e === 'firmada';
      case 'rechazada': return e === 'rechazada';
      case 'vencida': return e === 'vencida';
      case 'pronto': return venceProto(d);
      case 'semana': return d.tipo === 'propuesta' && venceProto(d);
      case 'espera': return d.tipo !== 'contrato' && e === 'enviada';
      case 'firma': return d.tipo === 'contrato' && e === 'enviada';
    }
    return true;
  }
  function pasaTexto(d) {
    if (!F.q) return true;
    var i = info(d), q = F.q.toLowerCase();
    return (d.nombre + ' ' + d.cuenta + ' ' + d.ref + ' ' + (i.nombre || '') + ' ' + (d.enviadoA || '')).toLowerCase().indexOf(q) >= 0;
  }
  function base() { return D.documentos.filter(function (d) { return (F.ant || !d.anterior) && pasaTipo(d) && pasaTexto(d); }); }
  function lista() { return base().filter(function (d) { return pasaEstado(d, F.estado); }); }
  function porId(id) { return D && D.documentos.filter(function (d) { return d.id === id; })[0]; }

  /* ─────────── pintar ─────────── */
  function pintar() {
    var m = $('main');
    m.innerHTML = '<div class="ph"><div><h1>Propuestas y contratos</h1><p>Todos los documentos comerciales: versiones, envíos, firmas, vencimientos y renovaciones.</p></div><div class="sp"></div>' +
      '<button class="btn pri" id="bt-nuevo">' + MK.ic('mas', 15) + ' Registrar documento</button></div>' +
      '<div id="kp"></div><div id="tools"></div><div id="ren"></div>' +
      '<div class="a-wrap"><div class="a-tab"><div class="scr" id="tabla"></div></div><aside class="a-pane" id="pane"></aside></div>' +
      '<div id="cartera"></div>';
    $('bt-nuevo').onclick = function () { hojaNuevo(); };
    pintarTodo(true);
  }
  function pintarTodo(pane) { pintarKp(); pintarTools(); pintarTabla(true); pintarCartera(); if (pane) pintarPane(); }

  function renov() { return (D.contratos || []).filter(function (c) { return c.dias <= diasRen(); }); }
  function pintarKp() {
    var vivos = D.documentos.filter(function (d) { return !d.anterior; });
    var esp = vivos.filter(function (d) { return d.tipo !== 'contrato' && d.ef === 'enviada'; });
    var sem = vivos.filter(function (d) { return d.tipo === 'propuesta' && venceProto(d); });
    var fir = vivos.filter(function (d) { return d.tipo === 'contrato' && d.ef === 'enviada'; });
    var ren = renov();
    var tot = esp.reduce(function (s, d) { return s + (Number(info(d).valor) || 0); }, 0);
    var kp = [['espera', esp.length, 'Esperando respuesta · ' + MK.dinero(tot, true) + ' al mes en la calle'], ['semana', sem.length, 'Vencen en 7 días · propuestas por recordar'],
      ['firma', fir.length, 'Contratos para firma · entregados, sin firmar'], ['ren', ren.length, 'Renovaciones ' + diasRen() + ' días · contratos de la cartera']];
    $('kp').innerHTML = '<div class="a-kp">' + kp.map(function (k) {
      return '<button data-kp="' + k[0] + '" class="' + (F.estado === k[0] ? 'on' : '') + '"><b>' + k[1] + '</b><span>' + esc(k[2]) + '</span></button>';
    }).join('') + '</div>';
    [].forEach.call($('kp').querySelectorAll('button'), function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-kp');
        if (k === 'ren') { FC.solo = true; pintarCartera(); var c = $('cartera'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
        F.estado = F.estado === k ? 'todos' : k; pintarKp(); pintarTools(); pintarTabla();
      };
    });
  }
  function pintarTools() {
    var b = base(); function n(e) { return b.filter(function (d) { return pasaEstado(d, e); }).length; }
    var est = [['todos', 'Todos'], ['borrador', 'Borradores'], ['env', 'Enviadas'], ['firm', 'Aceptadas / firmadas'], ['rechazada', 'Rechazadas'], ['vencida', 'Vencidas'], ['pronto', 'Vencen pronto']];
    var extra = { espera: 'Esperando respuesta', semana: 'Vencen en 7 días', firma: 'Contratos para firma' };
    var t = $('tools'), foco = document.activeElement && document.activeElement.id === 'q', pos = foco ? document.activeElement.selectionStart : 0;
    t.innerHTML = '<div class="tools"><label class="srch2">' + MK.ic('buscar', 15) + '<input id="q" placeholder="Buscar documento, cuenta o contacto…" value="' + esc(F.q) + '" autocomplete="off"></label>' +
      '<div class="chips" id="ch-tipo">' + [['todo', 'Todo'], ['propuesta', 'Propuestas'], ['contrato', 'Contratos'], ['otros', 'Otros documentos']].map(function (x) {
        return '<button class="chip ' + (F.tipo === x[0] ? 'on' : '') + '" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
      '<span class="sp"></span><label class="chk small"><input type="checkbox" id="ant"' + (F.ant ? ' checked' : '') + '> Ver versiones anteriores</label></div>' +
      '<div class="chips" id="ch-est" style="margin-bottom:12px">' + est.map(function (x) {
        return '<button class="chip ' + (F.estado === x[0] ? 'on' : '') + '" data-v="' + x[0] + '">' + x[1] + ' <span class="c">' + n(x[0]) + '</span></button>'; }).join('') +

    };
    MK.mensaje({ canal: canalPrev, telefono: i.tel || '', correo: i.correo || '', ref: d.ref, refTipo: d.refTipo || 'op', cuenta: d.cuenta, contacto: i.nombre || '',
      momento: momento, texto: texto, vars: { propuesta: d.ref, empresa: d.cuenta || '', contacto: i.nombre || '' } });
  }
  /* Enganche con MK.mensaje: cuando la hoja se envía y se cierra, se anota el envío del documento. */
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest && e.target.closest('#ms-ok'); if (!b || !ENVIO) return;
    var h = $('hoja'), x = { canal: MK.valorChips(h, 'canal') || 'correo', a: (($('ms-d') || {}).value || '').trim() }, cb = ENVIO;
    setTimeout(function () { if (!h.classList.contains('si')) { ENVIO = null; cb(x); } }, 0);
  }, true);

  function leerArchivo(file) {
    return new Promise(function (ok, mal) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result)); };
      r.onerror = function () { mal(new Error('No se pudo leer el archivo.')); };
      r.readAsDataURL(file);
    });
  }
  function zonaArchivo(id, texto) {
    return '<label class="zona" id="' + id + '-z">' + MK.ic('subir', 22) + '<b>' + esc(texto) + '</b><span id="' + id + '-t">PDF o foto · hasta 3 MB · toca para elegir o arrástralo aquí</span><input type="file" id="' + id + '" accept=".pdf,image/*" hidden></label>';
  }
  function activarZona(id, alElegir) {
    var z = $(id + '-z'), inp = $(id);
    var tomar = function (f) {
      if (!f) return;
      if (f.size > 3.1 * 1024 * 1024) { $(id + '-t').innerHTML = '<span style="color:var(--bad)">«' + esc(f.name) + '» pesa más de 3 MB. Redúcelo o guarda el enlace de donde está.</span>'; alElegir(null); return; }
      $(id + '-t').innerHTML = MK.ic('check', 13) + ' <b>' + esc(f.name) + '</b> · ' + Math.round(f.size / 1024) + ' KB'; alElegir(f);
    };
    inp.onchange = function () { tomar(inp.files[0]); };
    z.ondragover = function (e) { e.preventDefault(); z.classList.add('sobre'); };
    z.ondragleave = function () { z.classList.remove('sobre'); };
    z.ondrop = function (e) { e.preventDefault(); z.classList.remove('sobre'); tomar(e.dataTransfer.files[0]); };
  }
  function subir(file) {
    return leerArchivo(file).then(function (datos) {
      if (datos.length > MAX_ARCHIVO) throw new Error('El archivo pesa más de 3 MB. Redúcelo o guarda el enlace de donde está.');
      return MK.api('api_crmSubirArchivo', MK.pin, { nombre: file.name, tipo: file.type, datos: datos });
    }).then(function (r) { if (!r || !r.ok) throw new Error((r && r.error) || 'No se pudo subir el archivo.'); return r.archivo; });
  }
  function hojaFirmada(d) {
    var C = d.tipo === 'contrato', file = null;
    MK.hoja('<h2>Subir ' + (C ? 'el contrato firmado' : d.tipo === 'propuesta' ? 'la propuesta firmada' : 'la versión firmada') + '</h2><p class="muted small">' + esc(titulo(d)) + ' · ' + esc(d.cuenta || '') + '. Queda guardado con el documento' + (d.refTipo === 'op' && d.tipo !== 'documento' ? ' y se marca en la lista de documentos de la oportunidad' : '') + '.</p>' +
      zonaArchivo('hf-f', 'Elige el PDF o la foto firmada') +
      '<label class="lb" for="hf-n">NOTA <span class="muted">(opcional)</span></label><input class="in" id="hf-n" placeholder="Quién lo firmó, cómo llegó…">' +
      '<div class="msgerr" id="hf-msg"></div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="hf-ok" disabled>' + MK.ic('subir', 15) + ' Guardar firmada</button></div>');
    activarZona('hf-f', function (f) { file = f; $('hf-ok').disabled = !f; });
    $('hf-ok').onclick = function () {
      var b = this, msg = $('hf-msg'); if (!file) return; MK.ocupado(b, true, 'Subiendo…'); msg.textContent = '';
      subir(file).then(function (a) {
        var c = { estado: 'firmada', archivoId: a.id, evento: 'Subió la versión firmada (' + a.nombre + ')' };
        var n = $('hf-n').value.trim(); if (n) c.notas = (d.notas ? d.notas + ' · ' : '') + n;
        return guardar(d, c, (C ? 'Contrato firmado' : 'Versión firmada') + ' guardado').then(function () {
          MK.cerrarHoja();
          if (!d.deducido && d.refTipo === 'op' && (d.tipo === 'contrato' || d.tipo === 'propuesta')) {
            var k = {}; k[d.tipo === 'contrato' ? 'doc contrato firmado' : 'doc propuesta firmada'] = 'SI';
            MK.api('api_crmGuardarOportunidad', MK.pin, d.ref, k).catch(function () {});
          }
        });
      }).catch(function (e) { MK.ocupado(b, false); msg.textContent = e.message || 'No se pudo guardar.'; });
    };
  }
  function hojaVersion(d) {
    var P = d.tipo === 'propuesta';
    MK.hoja('<h2>Nueva versión de ' + esc(d.nombre) + '</h2><p class="muted small">Se crea la versión ' + ((d.version || 1) + 1) + ' como borrador. La anterior queda en el historial.' +
      (d.refTipo === 'op' && d.tipo !== 'documento' ? ' Los precios y datos que salen en la hoja se ajustan en la <a href="MerOportunidad.html?id=' + encodeURIComponent(d.ref) + '">ficha de la oportunidad</a>.' : '') + '</p>' +
      '<label class="lb" for="nv-n">¿QUÉ CAMBIA?</label><textarea class="in" id="nv-n" autofocus placeholder="Ej. precio ajustado a B/. 60 por visita, agrega visita adicional"></textarea>' +
      '<label class="lb">ARCHIVO <span class="muted">(opcional, si la nueva versión es un archivo)</span></label>' + zonaArchivo('nv-f', 'Adjuntar la nueva versión') +
      '<div class="msgerr" id="nv-msg"></div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="nv-ok">' + MK.ic('mas', 15) + ' Crear versión ' + ((d.version || 1) + 1) + '</button></div>');
    var file = null; activarZona('nv-f', function (f) { file = f; });
    $('nv-ok').onclick = function () {
      var b = this, msg = $('nv-msg'), n = $('nv-n').value.trim();
      if (!n) { msg.textContent = 'Escribe qué cambia en esta versión.'; return; }
      MK.ocupado(b, true);
      (file ? subir(file) : Promise.resolve(null)).then(function (a) {
        return guardar(d, { nuevaVersion: true, estado: 'borrador', notas: n, archivoId: a ? a.id : '', enviadoEn: '', validoHasta: '', evento: 'Nueva versión: ' + n.slice(0, 80) },
          'Versión ' + ((d.version || 1) + 1) + ' creada como borrador' + (P ? '. Envíala cuando esté lista.' : ''));
      }).then(function () { MK.cerrarHoja(); }).catch(function (e) { MK.ocupado(b, false); msg.textContent = e.message || 'No se pudo guardar.'; });
    };
  }

  /* registrar un documento nuevo */
  function hojaNuevo() {
    var ref = null, file = null, tipo = 'propuesta';
    var h = MK.hoja('<h2>Registrar documento</h2><p class="muted small">Una propuesta, un contrato o cualquier documento del cliente, con su archivo o su enlace.</p>' +
      '<label class="lb">TIPO</label>' + MK.chips('tipo', [['propuesta', 'Propuesta'], ['contrato', 'Contrato'], ['documento', 'Otro documento']], 'propuesta') +
      '<label class="lb" for="rn-q">¿DE QUIÉN ES? <span class="muted">(oportunidad o cliente)</span></label><input class="in" id="rn-q" autofocus placeholder="Escribe el nombre, código o RUC" autocomplete="off"><div class="opcs" id="rn-r"></div>' +
      '<label class="lb" for="rn-nom">NOMBRE</label><input class="in" id="rn-nom" placeholder="Ej. Propuesta PRO-26-061 · ajuste de precio">' +
      '<label class="lb">ESTADO</label>' + MK.chips('est', [['borrador', 'Borrador'], ['enviada', 'Enviada'], ['aceptada', 'Aceptada'], ['firmada', 'Firmada']], 'borrador') +
      '<label class="lb">ARCHIVO</label>' + zonaArchivo('rn-f', 'Elige el PDF o la foto') +
      '<label class="lb" for="rn-l">O ENLACE <span class="muted">(Drive, correo, portal…)</span></label><input class="in" id="rn-l" inputmode="url" placeholder="https://">' +
      '<div class="grid g2" style="gap:10px"><div><label class="lb" for="rn-v" id="rn-vl">VÁLIDA HASTA</label><input class="in" type="date" id="rn-v" value="' + MK.masDias(hoy(), 30) + '"></div>' +
      '<div><label class="lb" for="rn-n">NOTAS</label><input class="in" id="rn-n"></div></div>' +
      '<div class="msgerr" id="rn-msg"></div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="rn-ok">Registrar</button></div>');
    MK.activarChips(h);
    activarZona('rn-f', function (f) { file = f; });
    var gT = h.querySelector('[data-chips="tipo"]');
    gT._cambio = function (v) { tipo = v; $('rn-vl').textContent = v === 'contrato' ? 'VENCE' : 'VÁLIDA HASTA'; $('rn-v').value = v === 'propuesta' ? MK.masDias(hoy(), 30) : v === 'contrato' ? MK.masDias(hoy(), 365) : ''; ponerNombre(); };
    function ponerNombre() { var n = $('rn-nom'); if (!n._tocado) n.value = ref ? tipoNom(tipo) + ' · ' + ref.nombre : ''; }
    $('rn-nom').oninput = function () { this._tocado = true; };
    var q = $('rn-q'), res = $('rn-r'), tt = null;
    q.oninput = function () {
      clearTimeout(tt); ref = null; var s = q.value.trim(); if (s.length < 2) { res.innerHTML = ''; return; }
      tt = setTimeout(function () {
        res.innerHTML = '<div class="small muted">Buscando…</div>';
        MK.api('api_crmBuscar', MK.pin, s).then(function (x) {
          var l = ((x && x.resultados) || []).filter(function (z) { return z.tipo !== 'contacto'; }).slice(0, 8);
          if (!l.length) { res.innerHTML = '<div class="small muted">Nada con «' + esc(s) + '».</div>'; return; }
          res.innerHTML = l.map(function (z, i) { return '<button type="button" data-i="' + i + '">' + MK.ic(z.tipo === 'cliente' ? 'edificio' : 'embudo', 16) + '<span><b>' + esc(z.nombre) + '</b><small>' + (z.tipo === 'cliente' ? 'Cliente' : 'Oportunidad') + (z.detalle ? ' · ' + esc(z.detalle) : '') + '</small></span></button>'; }).join('');
          [].forEach.call(res.querySelectorAll('button'), function (b) {
            b.onclick = function () {
              var z = l[+b.getAttribute('data-i')]; ref = { ref: z.id, refTipo: z.tipo === 'cliente' ? 'cli' : 'op', nombre: z.nombre };
              q.value = z.nombre; res.innerHTML = '<div><span class="tag t-ok">✓ ' + esc(z.nombre) + ' · ' + (ref.refTipo === 'cli' ? 'cliente' : 'oportunidad ' + esc(z.id)) + '</span></div>'; ponerNombre();
            };
          });
        }, function () { res.innerHTML = '<div class="small muted">Sin conexión.</div>'; });
      }, 250);
    };
    $('rn-ok').onclick = function () {
      var b = this, msg = $('rn-msg'), enlace = $('rn-l').value.trim();
      if (!ref) { msg.textContent = 'Busca y elige la oportunidad o el cliente.'; q.focus(); return; }
      if (enlace && !linkSeguro(enlace)) { msg.textContent = 'El enlace debe empezar con https://'; return; }
      var est = MK.valorChips(h, 'est');
      var d = { tipo: tipo, ref: ref.ref, refTipo: ref.refTipo, cuenta: ref.nombre, nombre: $('rn-nom').value.trim() || tipoNom(tipo) + ' · ' + ref.nombre,
        estado: est, validoHasta: $('rn-v').value, enlace: enlace, notas: $('rn-n').value.trim(), evento: 'Registrado' };
      MK.ocupado(b, true);
      (file ? subir(file) : Promise.resolve(null)).then(function (a) {
        if (a) d.archivoId = a.id;
        return MK.llamar('api_crmGuardarDocumento', MK.pin, d);
      }).then(function (r) {
        MK.cerrarHoja(); SEL = r.documento && r.documento.id; F.estado = 'todos'; F.tipo = 'todo'; F.q = '';
        MK.aviso('Documento registrado'); MK.cambio({ tipo: 'documento' });
      }).catch(function (e) { MK.ocupado(b, false); msg.textContent = e.message || 'No se pudo registrar.'; });
    };
  }

  /* ─────────── contratos de la cartera ─────────── */
  function pintarCartera() {
    var el = $('cartera'); if (!el) return;
    var todos = D.contratos || [], dr = diasRen();
    var l = todos.filter(function (c) { return (!FC.solo || c.dias <= dr) && (!FC.q || (c.cliente + ' ' + c.contrato).toLowerCase().indexOf(FC.q.toLowerCase()) >= 0); });
    var nRen = todos.filter(function (c) { return c.dias <= dr; }).length;
    el.innerHTML = '<div class="sec-h" id="sec-cartera"><div><h2>Contratos de la cartera</h2><p>Vencimientos de los clientes con contrato, con sus kilos reales del último trimestre contra el plan.</p></div><div class="sp"></div>' +
      '<div class="chips"><button class="chip ' + (!FC.solo ? 'on' : '') + '" data-s="0">Todos <span class="c">' + todos.length + '</span></button><button class="chip ' + (FC.solo ? 'on' : '') + '" data-s="1">Vencen en ' + dr + ' días <span class="c">' + nRen + '</span></button></div></div>' +
      '<div class="tbw"><table class="tb cartera"><thead><tr><th>Cliente</th><th>Vence</th><th class="hm">Kilos reales / plan</th><th class="r hm">Plan</th><th></th></tr></thead><tbody>' +
      (l.length ? l.map(function (c) {
        var p = Number(c.planKg) || 0, k = Number(c.kgMes) || 0, pct = p ? Math.min(100, Math.round(k / p * 100)) : 0;
        var est = !p ? '' : k > p * 1.1 ? '<span class="tag t-warn">se pasa del plan</span>' : k < p * 0.6 ? '<span class="tag t-warn">el plan le queda grande</span>' : '<span class="tag t-ok">acorde al plan</span>';
        var cls = c.dias < 0 ? 'venc' : c.dias <= dr ? 'pronto' : 'muted';
        return '<tr data-cli="' + esc(c.clienteId) + '"><td><b style="font-weight:600">' + esc(c.cliente) + '</b><small>' + esc(c.contrato || 'sin número de contrato') + '</small></td>' +
          '<td class="num">' + MK.fechaCorta(c.vencimiento) + (c.vencimiento.slice(0, 4) !== hoy().slice(0, 4) ? '' : '') + '<small class="' + cls + '">' + (c.dias < 0 ? 'venció hace ' + (-c.dias) + ' d' : c.dias === 0 ? 'vence hoy' : 'en ' + c.dias + ' d') + '</small></td>' +
          '<td class="hm"><div class="kgbar"><span class="bar-h"><i class="' + (k > p * 1.1 ? 'b' : k < p * 0.6 ? 'w' : '') + '" style="width:' + pct + '%"></i></span><span class="small num">' + MK.num(k, 1) + ' / ' + MK.num(p) + ' kg</span></div><div style="margin-top:4px">' + est + '</div></td>' +
          '<td class="r hm num">' + (c.planCosto ? MK.dinero(c.planCosto) + '<small>por visita</small>' : '—') + '</td>' +
          '<td><div class="acc"><button class="btn sm pri" data-r="msg" title="Mensaje con la plantilla de renovación">' + MK.ic('renovar', 14) + ' Renovar</button><button class="btn sm" data-r="tarea" title="Agendar la renovación">' + MK.ic('calendario', 14) + ' Tarea</button><button class="btn sm gh" data-r="ficha" title="Ficha del cliente">' + MK.ic('edificio', 14) + '</button></div></td></tr>';
      }).join('') : '<tr><td colspan="5">' + MK.vacio(todos.length ? 'Ningún contrato vence en los próximos ' + dr + ' días.' : 'Ningún cliente tiene fecha de vencimiento de contrato en su ficha.') + '</td></tr>') + '</tbody></table></div>';
    [].forEach.call(el.querySelectorAll('[data-s]'), function (b) { b.onclick = function () { FC.solo = b.getAttribute('data-s') === '1'; pintarCartera(); }; });
    [].forEach.call(el.querySelectorAll('[data-r]'), function (b) {
      b.onclick = function () {
        var id = b.closest('tr').getAttribute('data-cli'), c = todos.filter(function (x) { return x.clienteId === id; })[0]; if (!c) return;
        var r = b.getAttribute('data-r'), cl = CLIS[id] || {};
        if (r === 'ficha') return MK.irCliente(id);
        if (SOLO_VER) return;
        var kgTxt = 'Genera ' + MK.num(c.kgMes, 1) + ' kg al mes; su plan es de ' + MK.num(c.planKg) + ' kg.';
        if (r === 'tarea') {
          var f = c.dias > dr ? MK.masDias(c.vencimiento, -dr) : hoy();
          return MK.tarea({ titulo: 'Renovar contrato ' + (c.contrato || '') + ' · ' + c.cliente, tipo: 'llamada', ref: id, refTipo: 'cli', cuenta: c.cliente, fecha: f, notas: 'Vence el ' + c.vencimiento + '. ' + kgTxt });
        }
        ENVIO = null;
        MK.mensaje({ canal: cl.correo ? 'correo' : 'whatsapp', telefono: telDe(cl), correo: cl.correo || '', ref: id, refTipo: 'cli', cuenta: c.cliente, contacto: cl.contacto || '', momento: 'Renovación',
          texto: MK.rellenar('{saludo} {contacto}:\n\nSu contrato ' + (c.contrato || '') + ' con ECOVSA vence el ' + MK.fechaLarga(c.vencimiento) + '. En los últimos meses han generado en promedio ' + MK.num(c.kgMes, 1) + ' kg al mes (su plan es de ' + MK.num(c.planKg) + ' kg). Nos gustaría renovarlo con el plan que mejor le queda.\n\n{firma}', { contacto: cl.contacto || '' }),
          vars: { empresa: c.cliente, contacto: cl.contacto || '' } });
      };
    });
  }

  /* ─────────── carga ─────────── */
  var tRec = null;
  function cargar(primera) {
    if (primera) MK.cargando('main', 'Cargando documentos…');
    var pDoc = MK.api('api_crmDocumentos', MK.pin);
    var pOps = MK.api('api_crmOportunidades', MK.pin).catch(function () { return null; });
    var pCli = MK.api('api_crmClientes', MK.pin).catch(function () { return null; });
    return Promise.all([pDoc, pOps, pCli]).then(function (r) {
      var d = r[0];
      if (!d || !d.ok) { if (primera || !D) MK.error('main', (d && d.error) || 'No se pudieron cargar los documentos.'); else MK.aviso((d && d.error) || 'No se pudo actualizar.'); return; }
      OPS = {}; ((r[1] && r[1].oportunidades) || []).forEach(function (o) { OPS[o.codigoPropuesta] = o; });
      CLIS = {}; ((r[2] && r[2].clientes) || []).forEach(function (c) { CLIS[String(c.id)] = c; });
      D = d; preparar();
      var pSel = MK.param('id'); if (primera && pSel && porId(pSel)) SEL = pSel;
      var ref = MK.param('ref'); if (primera && ref) { var x = D.documentos.filter(function (z) { return z.ref === ref && !z.anterior; })[0]; if (x) SEL = x.id; else F.q = ref; }
      if (primera || !$('tabla')) pintar();
      else { pintarTodo(false); refrescarDetalle(); }
    }, function (e) { if (primera || !D) MK.error('main', 'Sin conexión: ' + e.message); else MK.aviso('Sin conexión: ' + e.message); });
  }
  function refrescarDetalle() {
    var l = $('mk-lado');
    if (l && l.classList.contains('si') && l.querySelector('.dt') && esMovil()) { var d = porId(SEL); if (d) pintarDetalle(l.querySelector('.dt'), d); else MK.cerrarLado(); }
    else pintarPane();
  }
  window.addEventListener('mk:cambio', function () { clearTimeout(tRec); tRec = setTimeout(function () { cargar(false); }, 250); });
  var tRes = null, eraMovil = null;
  window.addEventListener('resize', function () {
    clearTimeout(tRes); tRes = setTimeout(function () {
      ajustarPv(); var m = esMovil();
      if (eraMovil !== null && m !== eraMovil && D) { if (!m) { MK.cerrarLado(); pintarPane(); } else { $('pane').innerHTML = ''; } }
      eraMovil = m;
    }, 150);
  });

  var SOLO_VER = false;
  MK.iniciar('documentos', function (base) {
    SOLO_VER = !!(base && base.usuario && base.usuario.rol === 'gerente');
    if (SOLO_VER) document.body.classList.add('solo-ver');
    eraMovil = esMovil(); cargar(true);
  });
})();
</script>
</body>
