<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:#cfd6e1;color:#16233b;padding-bottom:40px}

.carta .mb{display:flex;gap:14px;align-items:center;border-bottom:3px solid #0f2a57;padding-bottom:10px}.carta .mb img{height:46px}.carta .mb .em{font-weight:900;font-size:19px;color:#0f2a57;letter-spacing:.4px}.carta .mb .em small{display:block;font-size:9.5px;font-weight:600;color:#5e6b7e;letter-spacing:0}
.carta .mb .tt{margin-left:auto;text-align:right;border:1.5px solid #0f2a57;border-radius:6px;padding:6px 10px;min-width:280px}.carta .mb .tt b{display:block;font-size:13px;color:#14306b;letter-spacing:.4px}.carta .mb .tt span{font-size:10px;color:#5e6b7e;font-weight:700}
.carta .fr{gap:14px;margin-top:6px;font-size:9.5px;color:#44516a;font-weight:700;display:flex;justify-content:space-between}.carta .fr span:last-child{white-space:nowrap}
.carta .fja{height:5px;display:flex;margin:6px 0 10px}.carta .fja i{display:block;height:100%}
.carta table{width:100%;border-collapse:collapse}.carta td,.carta th{border:1px solid #9fb0c8;padding:3px 6px;font-size:10.5px;vertical-align:top}.carta th{background:#e8effb;color:#0f2a57;text-align:left;font-size:10px;letter-spacing:.3px}.carta td.c{text-align:center;width:36px;font-weight:900}
.carta .gt{background:#0f2a57;color:#fff;font-weight:900;letter-spacing:.6px;font-size:10px;text-transform:uppercase}
.carta .dat td{width:25%}.carta .dat td.l{background:#f1f5fb;font-weight:800;color:#0f2a57;width:19%}
.carta .nu td:first-child{background:#fffbe6}

.carta .firm{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}.carta .firm div{border-top:1px solid #16233b;padding-top:5px;font-size:10px;font-weight:800;text-align:center}.carta .firm small{display:block;font-weight:600;color:#5e6b7e}
.carta .x{font-weight:900}.carta .sec{font-weight:900;color:#0f2a57;letter-spacing:.5px;font-size:10.5px;text-transform:uppercase;margin:12px 0 4px}
.carta .obs{border:1px solid #9fb0c8;min-height:54px;padding:6px;font-size:10.5px;line-height:1.45}
.carta .cro{border:1px solid #9fb0c8;display:flex;align-items:center;gap:12px;padding:6px 10px}
.carta .dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;align-items:start}
.carta .pt2 td,.carta .pt2 th{padding:1px 5px;font-size:9px;line-height:1.25}.carta .pt2 td.c,.carta .pt2 th.c{width:30px}
.carta .cro{display:block;padding:4px 10px}
.carta td.c{text-align:center}
.carta .cro svg{width:auto;max-width:100%;height:78px;display:block;margin:0 auto}
.carta .dat td{padding:2px 6px}
.zn.mk *{fill:url(#hach)!important;stroke:#e5484d!important;stroke-width:2}
.carta .cro svg{height:78px}
.carta .cro2{padding:4px 10px 6px}.carta .cro2 svg{width:auto;max-width:100%;height:124px;display:block;margin:0 auto}.carta .zl{font-size:10px;font-weight:800;color:#44516a;margin-top:2px;text-align:center}
.carta .mb{border-bottom:3px solid #0f2a57;padding-bottom:8px;align-items:center}
.carta .mb .em{font-size:20px}.carta .mb .em small{margin-top:1px}
.carta .mb .tt{border:0;padding:0;min-width:0;border-radius:0;margin-left:auto;text-align:right}.carta .mb .tt b{font-size:12.5px;display:block}.carta .mb .tt span{display:block;font-size:9.5px;color:#5e6b7e;font-weight:600}
.carta .pie{display:block;text-align:center;border-top:0;padding-top:0;left:46px;right:46px;bottom:22px}.carta .pie .pf{background:#f1f4f8;padding:4px;font-size:9px;color:#44516a;font-weight:700}.carta .pie .px{text-align:left;font-size:9px;color:#5e6b7e;font-weight:600;margin-bottom:4px}
.carta .sec em,.carta .lc th em{font-weight:600;font-style:italic;text-transform:none;letter-spacing:0;color:#5e6b7e;font-size:9px;margin-left:6px}.carta .lc th em{color:#c9d6ee}
.carta .topf{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-top:8px;align-items:stretch}.carta .topf .dat td{font-size:9px;padding:2px 5px}
.carta .dibq{border:1px solid #9fb0c8;padding:3px 6px}.carta .dibq em{display:block;font-size:8.5px;color:#5e6b7e;text-align:center;font-style:italic}.carta .dibq svg{width:100%;height:auto;display:block}
.carta .lc{width:100%;border-collapse:collapse;margin-top:6px}.carta .lc th{background:#0f2a57;color:#fff;font-size:9px;padding:3px 5px;text-align:center}
.carta .lc td{border:1px solid #9fb0c8;padding:2px 5px;font-size:9.5px;line-height:1.25}.carta .lc td.nn{width:20px;color:#7a8799;text-align:right;padding-right:3px}.carta .lc td.c{width:44px}.carta .lc td.ob{font-size:8.5px;color:#33415a}
.carta .lc .gt{background:#e8effb;color:#0f2a57;font-size:9.5px;font-weight:900;letter-spacing:.4px}.carta .lc .gt em{color:#5e6b7e}
.carta .lc.ap td{padding:.5px 4px;font-size:8.5px;line-height:1.2}.carta .lc.ap td.ob{font-size:8px}.carta .lc.ap th{padding:2px 4px;font-size:8.5px}.carta .lc.ap .gt{font-size:8.5px;padding:1px 4px}
.carta .firt{width:100%;border-collapse:collapse}.carta .firt th{background:#0f2a57;color:#fff;font-size:9px;text-align:left;padding:3px 6px}.carta .firt td{border:1px solid #9fb0c8;padding:6px;font-size:9.5px;line-height:2}
.carta.apr{padding:26px 40px}.carta.apr .mb img{height:38px}.carta.apr .pie{bottom:14px}.carta.apr .sec{margin:7px 0 3px}.carta.apr .obs{min-height:34px;padding:4px 6px;font-size:9.5px;line-height:1.35}
.carta .lc .gl{width:92px;text-align:center;vertical-align:middle;background:#f1f5fb;color:#0f2a57;font-size:8.5px;line-height:1.25}.carta .lc .gl em{display:block;font-size:7.5px;color:#5e6b7e;font-style:normal;font-weight:600}
.carta.apr .firt td{padding:3px 6px;line-height:1.7}.carta.apr .dibq svg{max-height:92px}
.carta.apr .dibq svg{max-height:74px}.carta.apr .topf .dat td{padding:1px 5px}.carta.apr .lc.ap td{padding:0 4px;line-height:1.15}
.carta .topf{grid-template-columns:1.05fr 1fr}
.carta.apr .dibq{display:flex;flex-direction:column;justify-content:space-evenly;padding:3px 8px}
.carta.apr .dibq svg{width:100%;max-height:none;height:auto}
.carta .ob b{font-weight:800}
.carta table.mec td,.carta table.mec th{font-size:10px}
.carta .ch{font-size:15px;text-align:center}
.carta .topf>div:first-child{display:flex}.carta .topf>div:first-child .dat{height:100%}
@media print{
  @page{size:letter;margin:0}
  body{background:#fff;padding:0}
  .barra,.aviso{display:none!important}
  #hojas{padding:0;overflow:visible}
  .carta{margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .carta:last-child{page-break-after:auto;break-after:auto}
  .carta,.carta th,.carta .gt,.carta .gl,.carta .l,.carta .pf,.zn.mk *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</head>
<body>
<div id="aviso" class="aviso">Cargando la inspección…</div>
<div class="barra" id="barra" style="display:none">
  <div class="ti" id="ti">Inspección mensual del vehículo</div>
  <button id="b-ins" onclick="ver('ins')">Inspección F-LOG-08</button>
  <button id="b-mec" onclick="ver('mec')">Hoja para el mecánico</button>
  <button onclick="window.print()">Imprimir o guardar en PDF</button>
  <button class="sec" onclick="window.close()">Cerrar</button>
</div>
<div id="hojas"></div>
<script>
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function mesTxt(m){ m=String(m||""); var n=Number(m.slice(5,7)); return n?(MESES[n-1].charAt(0).toUpperCase()+MESES[n-1].slice(1)+" "+m.slice(0,4)):m; }
function fch(iso){ iso=String(iso||""); return /^\d{4}-\d{2}-\d{2}/.test(iso)?(iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4)):""; }
function nm(n){ return String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function aviso(h){ $("aviso").innerHTML=h; $("aviso").style.display="block"; $("barra").style.display="none"; $("hojas").innerHTML=""; }
function param(k){ var m=(location.search||"").match(new RegExp("[?&]"+k+"=([^&]*)")); return m?decodeURIComponent(m[1]):""; }

var INS=null, VISTA="ins";
var GD={"Pedales":"antideslizante, recorrido y graduación","Luces":"uniformidad, intensidad y carcasas","Equipo de carretera y botiquín":"gasas, esparadrapo, guantes, yodo, curitas"};
var GRUPOS=["Niveles","Pedales","Luces","Equipo de carretera y botiquín","Varios"];

function membrete(titulo, per, cod, pag){
  return '<div class="mb"><img src="logo-ecovsa.png" alt=""><div class="em">ECOVSA<small>ECOTERMO DE PANAMA S.A. · RUC 1074020-1-552789 DV 50</small><small>Proceso: plan de mantenimiento de vehículos · ISO 9001 e ISO 45001</small></div>'+
    '<div class="tt"><b>'+titulo+'</b><span>'+cod+'</span><span>'+(per?esc(per)+' · ':'')+'Página '+pag+'</span></div></div>';
}
function pie(extra, cod){
  return '<div class="pie">'+(extra?'<div class="px">'+esc(extra)+'</div>':'')+'<div class="pf">Empresa registrada ante el Ministerio de Salud · Resolución Sanitaria N.° 1519 del 10 de diciembre de 2025 · '+cod+'</div></div>';
}
function tablaDatos(d){
  var pre=d.ultimoPreventivo?(fch(d.ultimoPreventivo.fecha)+(d.ultimoPreventivo.taller?' · '+esc(d.ultimoPreventivo.taller):'')):'';
  var ace=d.ultimoAceite?((d.ultimoAceite.fecha?fch(d.ultimoAceite.fecha):'')+(d.ultimoAceite.km?(d.ultimoAceite.fecha?' · ':'')+nm(d.ultimoAceite.km)+' km':'')):'';
  return '<table class="dat"><tr><td class="l">Mes inspeccionado</td><td>'+esc(mesTxt(d.mes))+'</td><td class="l">Placa</td><td>'+esc(d.placa)+'</td></tr>'+
    '<tr><td class="l">Fecha de inspección</td><td>'+fch(d.fecha)+'</td><td class="l">Modelo</td><td>'+esc([d.modelo,d.anio].filter(Boolean).join(' '))+'</td></tr>'+
    '<tr><td class="l">Conductor</td><td>'+esc(d.conductor||'')+'</td><td class="l">Tipo de vehículo</td><td>'+esc(d.tipo||'')+'</td></tr>'+
    '<tr><td class="l">Vence la póliza</td><td>'+fch(d.polizaVence)+'</td><td class="l">Kilometraje actual</td><td>'+(d.km?nm(d.km)+' km':'')+'</td></tr>'+
    '<tr><td class="l">Último mantenimiento preventivo (fecha y taller)</td><td>'+pre+'</td><td class="l">Último cambio de aceite (fecha y km)</td><td>'+ace+'</td></tr></table>';
}
function obsPunto(p, d){
  var o=String(p.obs||"");
  if(!o && p.fuentes && p.fuentes.indexOf("s08")>=0 && d.extintorVence) o="Vence "+fch(d.extintorVence);
  return o;
}
function tablaPuntos(d){
  var h='<table class="lc ap"><tr><th colspan="3" style="text-align:left">LISTA DE CHEQUEO <em>Marque con una X el resultado de cada punto</em></th><th class="c">BUEN ESTADO</th><th class="c">MAL ESTADO</th><th class="c">N/A</th><th style="width:30%">OBSERVACIONES</th></tr>';
  GRUPOS.forEach(function(g){
    var fil=d.puntos.filter(function(p){ return p.grupo===g; });
    fil.forEach(function(p,k){
      h+='<tr>'+(k===0?'<td class="gl" rowspan="'+fil.length+'"><b>'+esc(g.toUpperCase())+'</b>'+(GD[g]?'<em>('+esc(GD[g])+')</em>':'')+'</td>':'')+
        '<td class="nn">'+p.n+'.</td><td>'+esc(p.texto)+'</td><td class="c">'+(p.estado==='b'?'X':'')+'</td><td class="c">'+(p.estado==='m'?'X':'')+'</td><td class="c">'+(p.estado==='x'?'X':'')+'</td><td class="ob">'+esc(obsPunto(p,d))+'</td></tr>';
    });
  });
  return h+'</table>';
}
function cierre(I){
  var d=I.datos;
  return '<div class="sec">Observaciones generales <em>(fallas encontradas, qué se hizo y si el vehículo puede salir)</em></div><div class="obs">'+esc(d.observaciones||'').replace(/\n/g,'<br>')+'</div>'+
    '<div style="margin:7px 0 4px;font-size:9.5px;line-height:1.4">Hago constar que la información de esta inspección es cierta. Toda condición insegura o defecto se reporta a la Coordinación de Logística (Reporte de falla F-LOG-05) y, si es crítico, el vehículo no sale hasta repararlo.</div>'+
    '<table class="firt"><tr><th>CONDUCTOR</th><th>COORDINADOR DE LOGÍSTICA</th></tr><tr><td>Nombre: '+esc(d.conductor||'')+'<br>Cédula: ______________ &nbsp; Firma: ______________</td><td>Nombre: '+esc(I.firmadaPor||'')+'<br>Fecha: '+(I.firmadaEn?fch(I.firmadaEn):'____ / ____ / ______')+' &nbsp; Firma: ______________</td></tr></table>';
}
function extraTxt(I){
  var d=I.datos, r=d.resumen||{};
  if(d.copiaDe) return 'Sin salidas en el mes: se repite la inspección de '+mesTxt(d.copiaDe).toLowerCase()+' (mismos estados y kilometraje)';
  return 'Armada con '+(r.revisiones||0)+(r.revisiones===1?' revisión':' revisiones')+' del conductor (F-LOG-04) de '+mesTxt(d.mes).toLowerCase();
}
function hojaIns(I){
  var d=I.datos, zonas=d.zonas||[];
  return '<div class="carta apr">'+membrete('INSPECCIÓN MENSUAL DEL VEHÍCULO','','F-LOG-08 · VERSIÓN 1 / MAY-26','1 de 1')+
    '<div class="topf"><div>'+tablaDatos(d)+'</div><div class="dibq"><em>Marque con un círculo dónde el vehículo tiene algún defecto</em>'+CAMION.dibujo(zonas)+
    (zonas.length?'<div class="zl">Zonas marcadas: '+esc(CAMION.nombres(zonas))+'</div>':'')+'</div></div>'+
    tablaPuntos(d)+cierre(I)+pie(extraTxt(I),'F-LOG-08')+'</div>';
}
function planTxt(t){
  if(t.porQue==='km' && t.faltanKm!==null && t.faltanKm<0) return 'Pasado '+nm(-t.faltanKm)+' km del servicio';
  if(t.porQue==='fecha' && t.faltanDias!==null && t.faltanDias<0) return 'Vencido hace '+(-t.faltanDias)+(t.faltanDias===-1?' día':' días');
  if(t.porQue==='ciclos') return 'Pasado de ciclos';
  return 'Vencido';
}
function hojaMec(I){
  var d=I.datos, M=I.mecanico||{pendientes:[],resueltas:[],planVencido:[]};
  var filas=M.pendientes.map(function(p){ return [p.punto, p.queSePaso, p.desde?fch(p.desde):'', p.critico]; })
    .concat(M.planVencido.map(function(t){ return [t.tarea, planTxt(t), 'Plan de mantenimiento', false]; }));
  var tr=function(r,i){ return '<tr><td class="c">'+(i+1)+'</td><td><b>'+esc(r[0])+'</b>'+(r[3]?' ★':'')+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td class="c ch">&#9744;</td><td></td></tr>'; };
  var vac=''; for(var i=filas.length;i<Math.max(8,filas.length);i++) vac+='<tr><td class="c">'+(i+1)+'</td><td></td><td></td><td></td><td class="c ch">&#9744;</td><td></td></tr>';
  var res=M.resueltas.length?'<table class="mec"><tr><th>Punto</th><th>Qué pasó</th><th>Resuelta el</th></tr>'+M.resueltas.map(function(r){ return '<tr><td>'+esc(r.punto)+'</td><td>'+esc(r.queSePaso||'')+' ('+fch(r.fecha)+')</td><td>'+fch(r.resuelta)+'</td></tr>'; }).join('')+'</table>'
    :'<div class="obs" style="min-height:0;color:#5e6b7e">Ninguna falla se resolvió en el mes.</div>';
  return '<div class="carta">'+membrete('HOJA PARA EL MECÁNICO','Pendientes de '+mesTxt(d.mes).toLowerCase(),'Anexo del F-LOG-08 · VERSIÓN 1 / MAY-26','1 de 1')+
    '<table class="dat"><tr><td class="l">Vehículo</td><td>'+esc([d.modelo,d.tipo].filter(Boolean).join(' · '))+'</td><td class="l">Placa</td><td>'+esc(d.placa)+'</td></tr>'+
    '<tr><td class="l">Conductor del mes</td><td>'+esc(d.conductor||'')+'</td><td class="l">Kilometraje</td><td>'+(d.km?nm(d.km)+' km':'')+'</td></tr>'+
    '<tr><td class="l">Inspección</td><td>F-LOG-08 de '+esc(mesTxt(d.mes).toLowerCase())+'</td><td class="l">Entregada el</td><td>'+(I.firmadaEn?fch(I.firmadaEn):fch(d.fecha))+'</td></tr></table>'+
    '<div style="margin:12px 0 6px;font-size:14px;font-weight:900;color:#0f2a57">Esto es lo que hay que arreglar</div>'+
    '<table class="mec"><tr><th class="c" style="width:26px">N.°</th><th style="width:150px">Punto</th><th>Qué se encontró</th><th style="width:110px">Desde</th><th class="c" style="width:44px">Hecho</th><th style="width:150px">Observación del mecánico</th></tr>'+filas.map(tr).join('')+vac+'</table>'+
    '<div style="margin-top:6px;font-size:9.5px">★ Punto crítico: si falla, el camión no puede salir. Lo vencido del plan sale del plan de mantenimiento del camión.</div>'+
    '<div class="sec">Resuelto este mes (solo informativo)</div>'+res+
    '<div class="sec">Del taller</div><table class="dat"><tr><td class="l">Taller o mecánico</td><td></td><td class="l">Fecha de entrega</td><td></td></tr><tr><td class="l">Repuestos</td><td></td><td class="l">Costo total B/.</td><td></td></tr></table>'+
    '<div class="firm"><div>Entregó · coordinador de logística<small>'+esc(I.firmadaPor||'')+'</small></div><div>Recibió · mecánico<small>Nombre, firma y fecha</small></div></div>'+
    pie('Sale sola al generar la inspección mensual','F-LOG-08')+'</div>';
}
function ver(v){
  VISTA=v; if(!INS) return;
  $("hojas").innerHTML = v==="mec" ? hojaMec(INS) : hojaIns(INS);
  $("b-ins").className = v==="ins" ? "on" : ""; $("b-mec").className = v==="mec" ? "on" : "";
  document.title = (v==="mec" ? "Hoja para el mecánico · " : "F-LOG-08 · ")+INS.placa+" · "+mesTxt(INS.mes);
}
function seguir(){
  var placa=param("placa"), mes=param("mes");
  if(!placa||!mes){ aviso("Faltan el camión y el mes en el enlace."); return; }
  var pin=""; try{ pin=JSON.parse(localStorage.getItem("ecovsa_pin")||'""'); }catch(e){ pin=""; }
  if(!pin){ aviso("Entra primero en la aplicación con tu PIN y vuelve a abrir la inspección."); return; }
  google.script.run
    .withSuccessHandler(function(r){
