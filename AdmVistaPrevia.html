<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lo que reciben los clientes · ECOVSA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:'oculto',enSupabase:/^api_(?!optimizarRuta$)/};</script>
<script src="puente.js"></script>
<link rel="stylesheet" href="modulo-kit.css">
<script src="modulo-kit.js"></script>
<style>
/* ═══ api 3.80 · «Lo que reciben los clientes» (administración) · todo con prefijo vp380 ═══ */
.sysbar{background:#0b1f40}
.vp380-nota{display:flex;gap:10px;align-items:flex-start;background:#fff8e6;border:1px solid #f2d58a;color:#5c4300;border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.45;margin:0 0 16px}
.vp380-nota svg{flex:none;margin-top:1px;color:#b07d00}
.vp380-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.vp380-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:box-shadow .2s,border-color .2s}
.vp380-card:hover{border-color:#9db8e8;box-shadow:0 6px 18px rgba(15,42,87,.08)}
.vp380-card .ic{width:40px;height:40px;border-radius:12px;background:#e3f1ff;color:#0f2a57;display:grid;place-items:center}
.vp380-card b{font-size:15.5px}
.vp380-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.45;flex:1}
.vp380-card .ir{font-weight:700;font-size:13px;color:#1d4ed8;display:flex;align-items:center;gap:6px}
.vp380-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.vp380-seg{display:inline-flex;background:var(--line2);border-radius:12px;padding:3px}
.vp380-seg button{border:0;background:transparent;font:700 13px Archivo,sans-serif;color:var(--muted);padding:7px 12px;border-radius:9px;cursor:pointer}
.vp380-seg button[aria-pressed="true"]{background:#fff;color:#0f2a57;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.vp380-pasos{display:inline-flex;gap:6px;flex-wrap:wrap}
.vp380-esc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
.vp380-esc.solo-pc{grid-template-columns:minmax(0,1fr)}
.vp380-esc.solo-cel{grid-template-columns:auto;justify-content:center}
.vp380-esc.solo-pc .vp380-cel,.vp380-esc.solo-cel .vp380-pc{display:none}
.vp380-pc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(15,42,87,.08);min-width:0}
.vp380-pc .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f1f4f9;border-bottom:1px solid var(--line)}
.vp380-pc .bar i{width:10px;height:10px;border-radius:50%;background:#d5dbe5;display:inline-block}
.vp380-pc .bar span{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp380-pc .vista{position:relative;overflow:hidden;background:#fff}
.vp380-pc iframe{position:absolute;left:0;top:0;width:1280px;height:820px;border:0;transform-origin:0 0;background:#fff}
.vp380-cel{width:300px;flex:none}
.vp380-cel .tel{width:300px;height:620px;border-radius:38px;background:#0f172a;padding:10px;box-shadow:0 14px 34px rgba(15,23,42,.25);position:relative}
.vp380-cel .pantalla{width:280px;height:600px;border-radius:30px;overflow:hidden;background:#fff;position:relative}
.vp380-cel iframe{position:absolute;left:0;top:0;width:390px;height:836px;border:0;transform:scale(.718);transform-origin:0 0;background:#fff}
.vp380-cel .pie{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.vp380-que{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.vp380-caja{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.vp380-caja h3{margin:0 0 8px;font-size:14px}
.vp380-caja ol{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:#33415c}
.vp380-log{list-style:none;margin:0;padding:0;font-size:12.5px;max-height:260px;overflow:auto}
.vp380-log li{display:grid;grid-template-columns:52px 74px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line2);align-items:baseline}
.vp380-log li:first-child{border-top:0}
.vp380-log .h{color:var(--muted);font-variant-numeric:tabular-nums}
.vp380-log .t{font-weight:700;font-size:11px;border-radius:6px;padding:2px 6px;text-align:center}
.vp380-log .t.escribe{background:#fff3d6;color:#8a6300}.vp380-log .t.lee{background:#e3f1ff;color:#1d4ed8}
.vp380-log .t.bloqueado{background:#fde8e8;color:#b42318}.vp380-log .t.navega,.vp380-log .t.abre{background:var(--line2);color:var(--muted)}
.vp380-log .t.nueva{background:#f3e8ff;color:#6b21a8}
.vp380-log small{color:var(--muted)}
.vp380-vacio{color:var(--muted);font-size:13px}
.vp380-cero{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#276b33;background:var(--ok-bg);border-radius:999px;padding:4px 10px}
.vp380-grande{position:fixed;inset:0;z-index:2000;background:rgba(11,31,64,.72);display:flex;flex-direction:column;padding:14px;gap:10px}
.vp380-grande .cab{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700}
.vp380-grande .cab .sp{flex:1}
.vp380-grande iframe{flex:1;width:100%;border:0;border-radius:14px;background:#fff}
@media (max-width:1080px){.vp380-esc{grid-template-columns:minmax(0,1fr)}.vp380-cel{margin:0 auto}.vp380-que{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.vp380-esc .vp380-pc{display:none}.vp380-esc.solo-pc .vp380-pc{display:block}.vp380-esc.solo-pc .vp380-cel{display:none}.vp380-seg [data-v="ambos"]{display:none}
  .vp380-log li{grid-template-columns:44px 70px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.vp380-card{transition:none}}
</style>
</head>
<body>
<div id="sysbar"></div>
<div class="mtabs" id="mtabs"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"></main></div>
<script>
/* ═══════════ api 3.80 · «LO QUE RECIBEN LOS CLIENTES» ═══════════
   Administración (y Mercadeo) ven las pantallas que reciben los clientes, las de verdad (la última publicada),
   con un cliente de EJEMPLO y sin servidor: cada pantalla se abre en un marco con vp380.js en lugar de puente.js,
   que contesta con el ejemplo (vp380-ejemplos.js) y no deja salir nada ni escribir nada en el navegador.
   La puerta: el PIN guardado y la base de Mercadeo (api_crmBase, que ya existe); solo administración y Mercadeo.
   Sin PIN no se pinta nada y el ejemplo ni se carga. Nombres propios: vp380 / VP380. */
var VP380_ROLES = ['admin', 'mercadeo'];
var VP380_PANT = {
  enc: { n: 'Encuesta', pag: 'Encuesta.html', qs: 'e=ENC-EJEMPLO&k=ejemplo', i: 'check',
    d: 'La encuesta de satisfacción que le llega al cliente por WhatsApp o correo.',
    que: ['La abre desde el enlace que le manda nuestro equipo.', 'Responde pregunta por pregunta; si la deja a medias, sigue donde iba.', 'Al final la envía y ve el «gracias».'] },
  frm: { n: 'Formulario de primer contacto', pag: 'FormularioCliente.html', paso: 'datos', i: 'documento',
    d: 'El enlace del cliente, primer paso: llena los datos de su empresa.',
    que: ['Empresa, RUC y representante legal.', 'Dirección y el punto en el mapa (buscar, pegar un enlace o «Estoy en el local»).', 'Contacto, tipo de residuo, kilos y frecuencia.', 'Al enviar, ve que ya recibimos sus datos.'] },
  prop: { n: 'La propuesta en su enlace', pag: 'FormularioCliente.html', paso: 'propuesta', i: 'factura',
    d: 'En el mismo enlace, la propuesta: la ve completa y la acepta ahí mismo.',
    que: ['Ve el resumen y puede abrir la propuesta completa.', 'Acepta con su nombre, cargo y la casilla de confirmar.', 'O dice «lo decido más adelante» o «no la acepto» con el motivo.', 'Al aceptar, el enlace pasa a pedirle los documentos.'] },
  docs: { n: 'El pedido de documentos', pag: 'FormularioCliente.html', paso: 'documentos', i: 'subir',
    d: 'Después de aceptar: sube sus documentos y escribe sus datos bancarios.',
    que: ['Aviso de operación, cédula del representante y Registro Público (PDF o foto).', 'Datos bancarios: banco, titular y últimos 4 dígitos.', 'Cada uno queda «por revisar» hasta que Mercadeo lo acepta.', 'En la vista previa el archivo no sale de su computadora.'] }
};
var VP380 = { log: [], vista: 'ambos', paso: {}, cargado: false, html: {}, n: 0 };
try { var v0 = localStorage.getItem('vp380_vista'); if (v0) VP380.vista = v0; } catch (e) {}

/* ── la puerta: solo después de la base se carga el ejemplo ── */
function vp380Puerta(b) {
  var u = (b && b.usuario) || {};
  if (VP380_ROLES.indexOf(u.rol) < 0) { VP380.negado = true; return; }
  var s = document.createElement('script'); s.src = 'vp380-ejemplos.js?v=3.80';
  s.onload = function () { VP380.cargado = !!window.VP380_EJ; MK.repintar(); };
  s.onerror = function () { VP380.error = true; MK.repintar(); };
  document.head.appendChild(s);
}

/* ── la pantalla real, preparada para el marco ── */
function vp380Base() { return new URL('.', location.href).href; }
function vp380Fuente(pag) {
  if (VP380.html[pag]) return Promise.resolve(VP380.html[pag]);
  return fetch(pag + '?vp380=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('No se pudo leer ' + pag + ' (' + r.status + ').');
    return r.text();
  }).then(function (t) { VP380.html[pag] = t; return t; });
}
function vp380Srcdoc(html, cfg) {
  /* sin puente.js no hay camino al servidor; si la pantalla ya no lo carga como antes, no se muestra */
  var re = /<script[^>]*\bsrc=["']puente\.js(?:\?[^"']*)?["'][^>]*>\s*<\/script>/gi;
  if (!re.test(html)) return null;
  html = html.replace(re, '');
  var cab = '<base href="' + cfg.base + '" target="_self">' +
    '<meta http-equiv="Content-Security-Policy" content="connect-src \'none\'; form-action \'none\'; worker-src \'none\'">' +
    '<script>window.VP380_CFG=' + JSON.stringify(cfg).replace(/</g, '\\u003c') + ';<\/script>' +
    '<script src="vp380.js?v=3.80"><\/script>';
  return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + cab; }) : cab + html;
}
function vp380Cargar(marco, id, pag, qs, paso) {
  var P = VP380_PANT[id], f = document.getElementById('vp380-f-' + marco); if (!f) return;
  pag = pag || P.pag; qs = qs != null ? qs : (P.qs || ('token=' + encodeURIComponent(VP380_EJ.token) + '&k=' + VP380_EJ.k));
  var url = document.getElementById('vp380-u-' + marco);
  if (url) url.textContent = 'ecovsaapp.com/' + pag + '?' + qs;
  vp380Fuente(pag).then(function (html) {
    var doc = vp380Srcdoc(html, { marco: marco, pantalla: P.n, pag: pag, qs: qs, paso: paso || P.paso || '', base: vp380Base() });
    if (!doc) { f.removeAttribute('srcdoc'); f.src = 'about:blank'; MK.aviso(pag + ' cambió: no se puede mostrar sin riesgo. Avise a Mercadeo.'); return; }
    f.srcdoc = doc;
  }, function (e) { MK.aviso(e.message); });
}
/* lo llama vp380.js desde el marco */
VP380.anotar = function (marco, o) {
  var id = String(marco).split('-')[0], d = new Date();
  VP380.log.unshift({ h: ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2),
    id: id, eq: /-cel$/.test(marco) ? 'celular' : (/-grande$/.test(marco) ? 'grande' : 'compu'), tipo: o.tipo, fn: o.fn, txt: o.txt });
  if (VP380.log.length > 300) VP380.log.length = 300;
  clearTimeout(VP380._t); VP380._t = setTimeout(vp380PintaLog, 120);
};
VP380.navegar = function (marco, pag, qs, paso) {
  var id = String(marco).split('-')[0];
  if (/-grande$/.test(marco)) return vp380CargarGrande(id, pag, qs, paso);
  vp380Cargar(marco, id, pag, qs, paso);
};
window.VP380 = VP380;

/* ── pintar ── */
function vp380Inicio() {
  return MK.cabeza('Lo que reciben los clientes', 'Las pantallas que recibe el cliente, tal como están publicadas hoy, con un cliente de ejemplo.') +
    '<div class="vp380-nota">' + MK.ic('ojo', 18) + '<span><b>Datos de ejemplo:</b> «Clínica Ejemplo», nunca un cliente real. Puede recorrer cada pantalla hasta el final: lo que escriba, suba o envíe <b>no sale de este navegador</b> y no se guarda.</span></div>' +
    '<div class="vp380-cards">' + Object.keys(VP380_PANT).map(function (id) { var P = VP380_PANT[id];
      return '<a class="vp380-card" href="#' + id + '" data-vp="' + id + '"><span class="ic">' + MK.ic(P.i, 20) + '</span><b>' + MK.esc(P.n) + '</b><p>' + MK.esc(P.d) + '</p><span class="ir">Ver en compu y celular ' + MK.ic('flecha', 14) + '</span></a>'; }).join('') + '</div>';
}
function vp380Pantalla(id) {
  var P = VP380_PANT[id], v = VP380.vista;
  if (v === 'ambos' && window.matchMedia('(max-width:700px)').matches) v = 'cel';   /* en el celular «ambos» es el celular */
  var seg = '<div class="vp380-seg" role="group" aria-label="Cómo verla">' + [['ambos', 'Compu y celular'], ['pc', 'Compu'], ['cel', 'Celular']].map(function (x) {
    return '<button type="button" data-v="' + x[0] + '" aria-pressed="' + (v === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>';
  var derecha = '<button class="btn" data-a="reiniciar">' + MK.ic('renovar', 16) + 'Volver a empezar</button>' +
    '<button class="btn pri" data-a="grande">' + MK.ic('ojo', 16) + 'Abrir en grande</button>';
  return MK.cabeza(P.n, MK.esc(P.d), derecha) +
    '<div class="vp380-barra">' + seg + '<span class="vp380-cero" id="vp380-cero">' + MK.ic('escudo', 14) + 'Nada sale al servidor</span></div>' +
    '<div class="vp380-esc' + (v === 'pc' ? ' solo-pc' : v === 'cel' ? ' solo-cel' : '') + '">' +
      '<div class="vp380-pc"><div class="bar"><i></i><i></i><i></i><span id="vp380-u-' + id + '-pc"></span></div><div class="vista" id="vp380-v-' + id + '-pc"><iframe id="vp380-f-' + id + '-pc" title="' + MK.esc(P.n) + ' en computadora" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></div></div>' +
      '<div class="vp380-cel"><div class="tel"><div class="pantalla"><iframe id="vp380-f-' + id + '-cel" title="' + MK.esc(P.n) + ' en celular" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></div></div><div class="pie">Celular · 390 px</div></div>' +
    '</div>' +
    '<div class="vp380-que"><div class="vp380-caja"><h3>Qué hace el cliente aquí</h3><ol>' + P.que.map(function (t) { return '<li>' + MK.esc(t) + '</li>'; }).join('') + '</ol></div>' +
      '<div class="vp380-caja"><h3>Lo que pasó en esta vista previa</h3><ul class="vp380-log" id="vp380-log"></ul></div></div>';
}
function vp380Registro() {
  return MK.cabeza('Lo que pasó aquí', 'Todo lo que las pantallas intentaron leer, guardar o abrir en esta visita. Nada de esto llegó al servidor.') +
    '<div class="vp380-caja"><ul class="vp380-log" id="vp380-log" style="max-height:none"></ul></div>';
}
var VP380_TIPO = { lee: 'Lee', escribe: 'Guardaría', bloqueado: 'No salió', navega: 'Abre', abre: 'Abre', nueva: 'Nuevo' };
function vp380PintaLog() {
  var ul = document.getElementById('vp380-log'); if (!ul) return;
  var id = MK.seccion, L = VP380.log.filter(function (x) { return id === 'reg' || x.id === id; });
  ul.innerHTML = L.length ? L.map(function (x) {
    return '<li><span class="h">' + x.h + '</span><span class="t ' + x.tipo + '">' + (VP380_TIPO[x.tipo] || x.tipo) + '</span><span>' + MK.esc(x.txt || '') +
      ' <small>· ' + (id === 'reg' ? MK.esc((VP380_PANT[x.id] || {}).n || '') + ' · ' : '') + x.eq + (x.fn && /^api_/.test(x.fn) ? ' · ' + MK.esc(x.fn) : '') + '</small></span></li>'; }).join('')
    : '<li class="vp380-vacio" style="display:block">Todavía nada. Recorra la pantalla: aquí se ve lo que habría enviado.</li>';
}
/* el marco de la compu se achica para caber */
function vp380Medir() {
  ['enc', 'frm', 'prop', 'docs'].forEach(function (id) {
    var v = document.getElementById('vp380-v-' + id + '-pc'), f = document.getElementById('vp380-f-' + id + '-pc');
    if (!v || !f) return;
    var s = Math.min(1, (v.clientWidth || 1) / 1280); f.style.transform = 'scale(' + s + ')'; v.style.height = Math.round(820 * s) + 'px';
  });
}
window.addEventListener('resize', vp380Medir);
function vp380Arrancar(id) {
  vp380Medir();
  var v = VP380.vista, chico = window.matchMedia('(max-width:700px)').matches;
  if (v !== 'cel' && !(chico && v === 'ambos')) vp380Cargar(id + '-pc', id);
  if (v !== 'pc') vp380Cargar(id + '-cel', id);
  vp380PintaLog();
}
function vp380CargarGrande(id, pag, qs, paso) {
  var P = VP380_PANT[id], g = document.getElementById('vp380-grande');
  if (!g) {
    g = document.createElement('div'); g.className = 'vp380-grande'; g.id = 'vp380-grande';
    g.innerHTML = '<div class="cab">' + MK.ic('ojo', 18) + '<span>' + MK.esc(P.n) + ' · vista previa con datos de ejemplo</span><span class="sp"></span><button class="btn" data-a="cerrar-grande">' + MK.ic('x', 16) + 'Cerrar</button></div>' +
      '<iframe id="vp380-f-' + id + '-grande" title="' + MK.esc(P.n) + ' en grande" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>';
    document.body.appendChild(g);
  }
  vp380Cargar(id + '-grande', id, pag, qs, paso);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-v],[data-a],[data-vp]'); if (!b) return;
  if (b.dataset.vp) { e.preventDefault(); MK.ir(b.dataset.vp); return; }
  if (b.dataset.v) { VP380.vista = b.dataset.v; try { localStorage.setItem('vp380_vista', VP380.vista); } catch (x) {} MK.repintar(); return; }
  var a = b.dataset.a, id = MK.seccion;
  if (a === 'reiniciar') { VP380.log = VP380.log.filter(function (x) { return x.id !== id; }); MK.repintar(); MK.aviso('Volvió a empezar'); }
  if (a === 'grande') vp380CargarGrande(id);
  if (a === 'cerrar-grande') { var g = document.getElementById('vp380-grande'); if (g) g.remove(); }
});
VP380.escape = function () { var g = document.getElementById('vp380-grande'); if (g) g.remove(); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') VP380.escape(); });

MK.iniciar({
  modulo: 'Administración',
  base: 'api_crmBase',
  inicio: 'inicio',
  paginas: [
    { g: 'LO QUE RECIBEN LOS CLIENTES' },
    { id: 'inicio', n: 'Las cuatro pantallas', i: 'ojo' },
    { id: 'enc', n: 'Encuesta', i: 'check' },
    { id: 'frm', n: 'Formulario de primer contacto', i: 'documento' },
    { id: 'prop', n: 'La propuesta en su enlace', i: 'factura' },
    { id: 'docs', n: 'El pedido de documentos', i: 'subir' },
    { g: 'REVISIÓN' },
    { id: 'reg', n: 'Lo que pasó aquí', i: 'historial' }
  ],
  pieMenu: '<a href="index.html">← Volver a los módulos</a>',
  alCargar: vp380Puerta,
  pintar: function (id) {
    var main = document.getElementById('main');
    if (VP380.negado) { main.innerHTML = '<div class="aviso rj">Esta página es de administración. <a href="index.html">Volver a los módulos</a></div>'; return; }
    if (VP380.error) { main.innerHTML = '<div class="aviso rj">No se pudo cargar el cliente de ejemplo. Intente de nuevo.</div>'; return; }
    if (!VP380.cargado) { MK.cargando(main); return; }
    var g = document.getElementById('vp380-grande'); if (g) g.remove();
    if (id === 'reg') { main.innerHTML = vp380Registro(); vp380PintaLog(); return; }
    if (!VP380_PANT[id]) { main.innerHTML = vp380Inicio(); return; }
    main.innerHTML = vp380Pantalla(id); vp380Arrancar(id);
  }
});
</script>
</body>
</html>
