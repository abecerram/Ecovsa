<!DOCTYPE html>
<html lang="es">
<head>
<title>Arqueo de Caja Menuda · ECOVSA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<!-- api 3.5.1 · El arqueo de caja menuda (F-ADM-02). Antes este archivo era una
     copia de la propuesta y nunca mostró el arqueo; ahora lo arma con
     api_arqueo, igual que Mercadeo › Solicitudes de compra. -->
<script>window.PUENTE_CONFIG={indicador:'oculto',sinCopia:/./};</script>
<script src="puente.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;background:#e9edf3;color:#0f2140;padding-bottom:30px}
.hoja{max-width:860px;margin:18px auto 0;background:#fff;border-radius:6px;box-shadow:0 10px 30px rgba(15,33,64,.12);padding:40px 48px}
.estado{max-width:520px;margin:60px auto;background:#fff;border-radius:14px;padding:26px 24px;text-align:center;color:#5d6a80;box-shadow:0 8px 24px rgba(15,33,64,.1)}
.estado b{display:block;font-size:18px;color:#0f2a57;margin-bottom:6px}
h5{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;margin:18px 0 6px;color:#14306b}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #c9d0db;padding:6px 8px;text-align:left;font-size:12px;vertical-align:top}
th{background:#eef1f5;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:#3d4a60}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
tr.tt td{font-weight:800;background:#f5f6f8}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fir{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:46px}
.fir div{border-top:1px solid #111;padding-top:5px;text-align:center;font-size:10.5px}
.fir div b{display:block;font-size:11.5px}
.ln-b{display:inline-block;min-width:120px;border-bottom:1px solid #111}
.parcial{display:inline-block;background:#fff4d6;color:#8a6100;font-weight:700;font-size:10.5px;border-radius:5px;padding:2px 7px;margin-top:4px}
.pie{margin-top:22px;border-top:1px solid #dfe4ec;padding-top:8px;font-size:9.5px;color:#5d6a80;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:680px){.hoja{margin:0;border-radius:0;box-shadow:none;padding:22px 14px}.dos,.fir{grid-template-columns:1fr}.fir{gap:34px}.tw{overflow-x:auto}}
@page{size:A4;margin:12mm 14mm}
@media print{.hoja{box-shadow:none;margin:0;padding:0;max-width:none}th,tr.tt td,.parcial{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{break-inside:avoid}}
</style>
<link rel="stylesheet" href="documento.css">
<script src="documento.js"></script>
</head>
<body>
<div class="barra doc-barra no-imprimir">
  <span class="db-marca"><img src="ecovsa-letras.png" alt="ECOVSA"></span>
  <div class="ti">Arqueo de caja menuda <span class="fo" id="ti-folio"></span></div>
  <button class="sec" onclick="history.length > 1 ? history.back() : window.close()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Volver</span></button>
  <button class="db-pdf" onclick="window.print()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg><span>Guardar en PDF</span></button>
</div>
<div id="app"><div class="estado">Abriendo el arqueo…</div></div>
<script>
var esc = function (s) { return DOCE.esc(s); };
function n2(v) { return (Number(v) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function porCuenta(gastos) {
  var o = {}; (gastos || []).forEach(function (g) { var k = g.cuentaCodigo || '—'; if (!o[k]) o[k] = { d: g.cuentaDescripcion, m: 0 }; o[k].m = Math.round((o[k].m + (Number(g.monto) || 0)) * 100) / 100; });
  return Object.keys(o).sort().map(function (k) { return { c: k, d: o[k].d, m: o[k].m }; });
}
function pintar(a, e) {
  var abierta = a.estado !== 'CERRADA';
  document.title = 'Arqueo ' + a.cajaId + ' · ECOVSA';
  document.getElementById('ti-folio').textContent = a.cajaId;
  document.getElementById('app').innerHTML = '<div class="hoja">' +
    DOCE.membrete({ empresa: e, modo: 'legal', codigo: e.formulario || 'F-ADM-02',
      derecha: '<small>Arqueo de caja menuda</small><b>' + esc(a.cajaId) + '</b>' + (abierta ? '<span class="parcial">Período abierto · arqueo parcial</span>' : '<span>Período cerrado</span>') }) +
    '<h5>Datos del período</h5><div class="tw"><table><tr><th>Período</th><td style="text-transform:capitalize">' + esc(a.periodoTexto || a.periodo) + '</td><th>Custodia del fondo</th><td>' + esc(a.custodio) + '</td></tr>' +
      '<tr><th>Apertura</th><td>' + esc(DOCE.fecha(a.apertura) || '—') + '</td><th>Cierre</th><td>' + esc(a.cierre ? DOCE.fecha(a.cierre) : '—') + '</td></tr>' +
      '<tr><th>Estado</th><td>' + esc(a.estado) + '</td><th>Solicitud de reposición</th><td>' + esc(a.solicitudId || '—') + '</td></tr></table></div>' +
    '<h5>Detalle de gastos</h5><div class="tw"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Cuenta</th><th>Comprobante</th><th class="r">Monto B/.</th></tr></thead><tbody>' +
      ((a.gastos || []).length ? a.gastos.map(function (g) { return '<tr><td class="nw">' + esc(DOCE.fecha(g.fecha, true)) + '</td><td>' + esc(g.concepto) + '</td><td>' + esc(g.cuentaCodigo) + (g.cuentaDescripcion ? ' · ' + esc(g.cuentaDescripcion) : '') + '</td><td>' + (g.sinComprobante ? '<i>sin comprobante</i>' : esc(g.comprobante)) + '</td><td class="r">' + n2(g.monto) + '</td></tr>'; }).join('') : '<tr><td colspan="5">Sin gastos anotados.</td></tr>') +
      '<tr class="tt"><td colspan="4">TOTAL GASTADO</td><td class="r">' + n2(a.total) + '</td></tr></tbody></table></div>' +
    '<div class="dos"><div><h5>Resumen</h5><table><tr><td>Fondo asignado</td><td class="r">' + n2(a.fondoAsignado) + '</td></tr><tr><td>Total gastado (' + a.cuantos + ' gasto' + (a.cuantos === 1 ? '' : 's') + ')</td><td class="r">' + n2(a.total) + '</td></tr>' +
        '<tr class="tt"><td>Efectivo que debe haber en caja</td><td class="r">' + n2(a.disponible) + '</td></tr><tr><td>Gastos sin comprobante</td><td class="r">' + a.sinComprobante + ' · ' + n2(a.montoSinComprobante) + '</td></tr>' +
        '<tr><td>Efectivo contado</td><td class="r"><span class="ln-b">&nbsp;</span></td></tr><tr><td>Diferencia</td><td class="r"><span class="ln-b">&nbsp;</span></td></tr></table></div>' +
      '<div><h5>Por cuenta contable</h5><table>' + (porCuenta(a.gastos).map(function (x) { return '<tr><td>' + esc(x.c) + (x.d ? ' · ' + esc(x.d) : '') + '</td><td class="r">' + n2(x.m) + '</td></tr>'; }).join('') || '<tr><td>—</td><td class="r">0.00</td></tr>') + '</table></div></div>' +
    '<div class="fir"><div><b>' + esc(a.custodio) + '</b>Custodia del fondo</div><div><b>&nbsp;</b>Revisado por</div><div><b>&nbsp;</b>Aprobado · Dirección financiera</div></div>' +
    '<div class="pie"><span>' + esc(e.razonSocial || '') + ' · RUC ' + esc(e.ruc || '') + (e.dv ? ' DV ' + esc(e.dv) : '') + '</span><span>' + esc(e.formulario || 'F-ADM-02') + ' · Documento generado por el sistema de operaciones de ECOVSA</span></div></div>';
}
(function () {
  var q = location.search || '', m = q.match(/[?&](?:caja|cod|id)=([^&]+)/);
  var falla = function (t) { document.getElementById('app').innerHTML = '<div class="estado"><b>No se pudo abrir el arqueo</b>' + esc(t) + '</div>'; };
  if (!m) { falla('El enlace no trae el número de la caja.'); return; }
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok) { falla((r && r.error) || 'No encontré ese arqueo.'); return; }
    pintar(r.arqueo, r.empresa || {});
  }).withFailureHandler(function () { falla('Sin conexión. Intente de nuevo.'); }).api_arqueo(decodeURIComponent(m[1]));
})();
</script>
</body>
</html>
