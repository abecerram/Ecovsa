<!DOCTYPE html>
<html lang="es">
<head>
<title>Carta de cobro · ECOVSA</title>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<!-- api 3.5 · Carta de cobro pública: se abre con el enlace que manda Cobros
     (correo o WhatsApp). Sin PIN: el enlace lleva un token largo y solo trae
     lo que ya quedó escrito en la carta el día que se generó. -->
<script>window.PUENTE_CONFIG={sinCopia:/./, enSupabase:/^api_(?!optimizarRuta$)/, indicador:'oculto'};</script>
<script src="puente.js"></script>
<style>
:root{--navy:#0f2a57;--navy2:#14306b;--ink:#0f2140;--mu:#5d6a80;--line:#dfe4ec;--line2:#eef1f5;--bg:#e9edf3;--bad:#b3261e;--badbg:#fdecea;--ok:#2f7d3a;--am:#F5B301}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
.barra{position:sticky;top:0;z-index:3;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.barra b{font-size:14px;letter-spacing:.3px}.barra span{font-size:12px;color:#b9c6dd}
.barra .sp{flex:1}
.btn{font:inherit;font-size:13px;font-weight:700;border-radius:9px;border:1px solid transparent;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.cl{background:#fff;color:var(--navy2)}
.btn.wa{background:#25a244;color:#fff}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hoja{max-width:820px;margin:18px auto 28px;background:#fff;border-radius:6px;box-shadow:0 10px 30px rgba(15,33,64,.12);padding:44px 56px 40px}
.mem{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:3px solid var(--navy)}
.mem .lg{width:74px;height:74px;flex:none;background:url(logo-ecovsa.png) center/contain no-repeat}
.mem .dt b{display:block;font-size:17px;letter-spacing:.4px;color:var(--navy)}
.mem .dt span{display:block;font-size:11.5px;color:var(--mu);line-height:1.45}
.mem .res{margin-left:auto;text-align:right;font-size:11px;color:var(--mu);max-width:220px}
.mem .res i{font-style:normal;display:inline-block;margin-top:4px;background:#eaf6e4;color:#1f6b2e;font-weight:700;border-radius:5px;padding:2px 7px}
.meta{display:flex;justify-content:space-between;gap:16px;margin:22px 0 18px;font-size:13.5px}
.meta .para b{display:block;font-size:15px}
.meta .fe{text-align:right;color:var(--mu)}
.tit{font-size:19px;font-weight:800;color:var(--navy);margin:6px 0 14px;letter-spacing:.2px}
.tit small{display:block;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);margin-bottom:2px}
p{margin:0 0 12px;font-size:14px}
.plazo{border:1px solid #f1c7c3;background:var(--badbg);border-radius:10px;padding:12px 16px;margin:14px 0;display:flex;align-items:center;gap:14px}
.plazo b{font-size:17px;color:var(--bad)}.plazo span{font-size:13px;color:#6d2b27}
.tw{overflow-x:auto;margin:10px 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);font-weight:700;border-bottom:1.5px solid var(--navy);padding:7px 8px}
td{padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
th.r,td.r{text-align:right}
tr.tot td{font-weight:800;border-bottom:0;border-top:1.5px solid var(--navy);font-size:14px}
.dias{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--line2);color:var(--mu)}
.dias.v{background:var(--badbg);color:var(--bad)}
.norma{border-left:3px solid var(--am);background:#fffaf0;padding:10px 14px;font-size:12.5px;color:#4a4130;margin:16px 0;border-radius:0 8px 8px 0}
.nota{background:#f4f7fb;border-radius:8px;padding:10px 14px;font-size:13px;margin:10px 0}
.contacto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 4px}
.contacto div{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--mu)}
.contacto b{display:block;font-size:13.5px;color:var(--ink);word-break:break-word}
.firma{margin-top:30px;font-size:13.5px}
.firma .l{width:220px;border-top:1px solid var(--ink);margin-bottom:4px}
.firma span{display:block;color:var(--mu);font-size:12px}
.pie{margin-top:26px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mu);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.estado{max-width:520px;margin:60px auto;background:#fff;border-radius:14px;padding:28px 24px;text-align:center;box-shadow:0 8px 24px rgba(15,33,64,.1)}
.estado h1{font-size:19px;margin:10px 0 6px;color:var(--navy)}.estado p{color:var(--mu);font-size:14px}
.gira{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy2);margin:0 auto;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (max-width:680px){
  .hoja{margin:0;border-radius:0;box-shadow:none;padding:22px 16px 28px}
  .mem{flex-wrap:wrap}.mem .lg{width:56px;height:56px}.mem .res{margin-left:0;text-align:left;max-width:none;flex-basis:100%}
  .meta{flex-direction:column;gap:6px}.meta .fe{text-align:left}
  .contacto{grid-template-columns:minmax(0,1fr)}
  .cf{display:none}td,th{padding:7px 5px}.tot .tc{white-space:normal}
  .barra span{display:none}
}
@page{size:A4;margin:14mm 16mm}
@media print{
  body{background:#fff}
  .barra{display:none}
  .hoja{box-shadow:none;margin:0;padding:0;max-width:none}
  .plazo,.norma,.nota,.dias{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{break-inside:avoid}
  p{font-size:12.5px;margin-bottom:8px}
  .mem{padding-bottom:10px}.meta{margin:14px 0 10px;font-size:12.5px}.tit{font-size:17px;margin-bottom:10px}
  .plazo{padding:8px 14px;margin:10px 0}.plazo b{font-size:15px}
  td{padding:6px 8px}.norma{font-size:11px;margin:10px 0;padding:8px 12px}
  .contacto{margin:8px 0 0}.contacto div{padding:6px 10px}
  .firma{margin-top:14px;break-inside:avoid}.firma p{margin-bottom:22px!important}
  .pie{margin-top:14px}
}
</style>
</head>
<body>
<div class="barra"><b>ECOVSA</b><span id="b-tit">Carta de cobro</span><div class="sp"></div><a class="btn wa" id="b-wa" href="#" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>Escribirnos</a><button class="btn cl" id="b-pdf" onclick="window.print()" hidden><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>Guardar en PDF</button></div>
<div id="app"><div class="estado"><div class="gira"></div><p style="margin-top:14px">Abriendo la carta…</p></div></div>
<script>
function $(i){ return document.getElementById(i); }
function E(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function D(v){ return "B/. "+(Number(v)||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fL(iso){ if(!iso) return ""; var p=String(iso).slice(0,10).split("-"); return Number(p[2])+" de "+MESES[Number(p[1])-1]+" de "+p[0]; }
function fC(iso){ if(!iso) return "—"; var p=String(iso).slice(0,10).split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function llamar(fn, args){
  return new Promise(function(ok, mal){
    var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ mal(e||new Error("Sin conexión")); });
    r[fn].apply(r, args);
  });
}
function falla(t, x){ $("app").innerHTML='<div class="estado"><h1>'+E(t)+'</h1><p>'+x+'</p></div>'; }

function pintar(k, em){
  var d=k.datos||{}, F=d.facturas||[], t=k.tipo;
  var vencido=F.filter(function(f){ return f.dias>0; }).reduce(function(s,f){ return s+(Number(f.saldo)||0); },0);
  var total=F.reduce(function(s,f){ return s+(Number(f.saldo)||0); },0);
  document.title=(k.titulo||"Carta")+" · "+(d.nombre||"")+" · ECOVSA";
  $("b-tit").textContent=k.titulo||"Carta de cobro";
  var wa=String(em.whatsapp||"").replace(/\D/g,""); if(wa.length===8) wa="507"+wa;
  if(wa){ var b=$("b-wa"); b.hidden=false; b.href="https://wa.me/"+wa+"?text="+encodeURIComponent("Buenas, les escribo por la carta "+k.id+" de "+(d.nombre||"")+"."); }
  $("b-pdf").hidden=false;

  var cuerpo="";
  if(t==="ultimo"){
    cuerpo='<p>Reciban un cordial saludo. Por medio de la presente les notificamos que su cuenta con nosotros presenta, a la fecha, un saldo vencido de <b>'+D(vencido||d.vencido)+'</b>, correspondiente a las facturas que se detallan a continuación.</p>'+
      '<p>Les solicitamos ponerse al día a más tardar en la fecha indicada o comunicarse con nosotros antes de ese día para acordar un plan de pago. De no recibir el pago ni un acuerdo en ese plazo, nos veremos en la necesidad de suspender el servicio de recolección en sus establecimientos.</p>'+
      (k.fechaLimite?'<div class="plazo"><div><span>Plazo para ponerse al día</span><br><b>'+E(fL(k.fechaLimite))+'</b></div></div>':'');
  } else if(t==="suspension"){
    cuerpo='<p>Reciban un cordial saludo. Les notificamos que, a partir del <b>'+E(fL(k.fecha))+'</b>, el servicio de recolección de desechos en sus establecimientos queda <b>suspendido</b> por el saldo pendiente de <b>'+D(total||d.saldo)+'</b>, que se detalla a continuación.</p>'+
      '<p>El servicio se reanuda en cuanto la cuenta se ponga al día o se acuerde un plan de pago con nuestro departamento de Cobros. Quedamos atentos para coordinarlo.</p>';
  } else {
    cuerpo='<p>Reciban un cordial saludo. Nos complace confirmarles que, a partir del <b>'+E(fL(k.fecha))+'</b>, el servicio de recolección de desechos en sus establecimientos queda <b>reactivado</b>. Agradecemos su gestión para ponerse al día.</p>'+
      '<p>Logística retomará las visitas según la frecuencia acordada. Si necesitan una recolección antes de la próxima visita programada, escríbannos.</p>';
  }
  var tabla=F.length?'<div class="tw"><table><thead><tr><th>Factura</th><th class="cf">Fecha</th><th>Vence</th><th>Estado</th><th class="r">Saldo</th></tr></thead><tbody>'+
    F.map(function(f){ return '<tr><td>'+E(f.factura)+'</td><td class="cf">'+fC(f.fecha)+'</td><td>'+fC(f.vence)+'</td><td>'+(f.dias>0?'<span class="dias v">'+f.dias+' días vencida</span>':'<span class="dias">por vencer</span>')+'</td><td class="r num">'+D(f.saldo)+'</td></tr>'; }).join('')+
    '<tr class="tot"><td colspan="3" class="tc">Total pendiente'+(vencido&&vencido<total?' · vencido '+D(vencido):'')+'</td><td class="cf"></td><td class="r num">'+D(total)+'</td></tr></tbody></table></div>':'';
  var h='<div class="hoja">'+
    '<div class="mem"><div class="lg" role="img" aria-label="ECOVSA"></div><div class="dt"><b>'+E(em.razonSocial||"ECOVSA")+'</b><span>'+E(em.comercial||"ECOVSA")+' · Recolección, transporte y tratamiento de desechos hospitalarios</span><span>RUC '+E(em.ruc||"")+(em.dv?' DV '+E(em.dv):'')+' · '+E(em.direccion||"")+'</span></div>'+
      (em.resolucion?'<div class="res">Empresa registrada ante el Ministerio de Salud<br><i>'+E(em.resolucion)+'</i></div>':'')+'</div>'+
    '<div class="meta"><div class="para">Señores<b>'+E(d.destinatario||d.nombre)+'</b>'+(d.ruc?'RUC '+E(d.ruc)+'<br>':'')+(d.nombre&&d.destinatario&&d.nombre!==d.destinatario?E(d.nombre)+'<br>':'')+(d.contacto&&!/^n\/?a$/i.test(d.contacto)?'Atención: '+E(d.contacto):'')+'</div>'+
      '<div class="fe">Panamá, '+E(fL(k.fecha))+'<br>Carta '+E(k.id)+'</div></div>'+
    '<div class="tit"><small>'+(t==="reactivacion"?"Aviso":"Aviso de cobro")+'</small>'+E(k.titulo)+'</div>'+
    cuerpo+tabla+
    (t==="ultimo"?'<p style="margin-top:12px">Si ya realizaron el pago, les agradecemos enviarnos el comprobante para aplicarlo a su cuenta y dar por atendido este aviso.</p>':'')+
    (d.nota?'<div class="nota">'+E(d.nota).replace(/\n/g,"<br>")+'</div>':'')+
    (d.norma?'<div class="norma">'+E(d.norma)+'</div>':'')+
    '<p>Para coordinar su pago, pedir su estado de cuenta o cualquier consulta:</p>'+
    '<div class="contacto"><div>WhatsApp<b>'+E(em.whatsapp||"—")+'</b></div><div>Teléfono<b>'+E(em.telefono||"—")+'</b></div><div>Correo<b>'+E(em.correo||"—")+'</b></div></div>'+
    '<div class="firma"><p style="margin-bottom:34px">Atentamente,</p><div class="l"></div><b>'+E(d.firma||"")+'</b><span>Departamento de '+E(d.cargo||"Cobros")+' · '+E(em.comercial||"ECOVSA")+'</span></div>'+
    '<div class="pie"><span>'+E(em.razonSocial||"")+' · RUC '+E(em.ruc||"")+(em.dv?' DV '+E(em.dv):'')+'</span><span>Documento generado por el sistema de operaciones de ECOVSA · '+E(k.id)+'</span></div>'+
  '</div>';
  $("app").innerHTML=h;
}

(function arrancar(){
  var q=location.search||"", m=q.match(/[?&](?:carta|t)=([0-9a-fA-F]+)/);
  if(!m){ falla("Enlace incompleto","Pídale a ECOVSA que le reenvíe el enlace de la carta. WhatsApp <b>6264-1647</b>."); return; }
  llamar("api_cartaCobro",[m[1]]).then(function(r){
    if(!r||!r.ok){ falla("No encontramos la carta", E((r&&r.error)||"El enlace no es válido.")+" Si la necesita, escríbanos al WhatsApp <b>6264-1647</b>."); return; }
    pintar(r.carta, r.empresa||{});
  }, function(){ falla("Sin conexión","No pudimos abrir la carta. Revise su conexión e intente de nuevo."); });
})();
</script>
</body>
</html>
