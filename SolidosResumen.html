<!DOCTYPE html>
<html lang="es">
<head>
<title>Resumen de la noche · desechos sólidos · ECOVSA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<meta charset="UTF-8">
<link rel="stylesheet" href="estilos-operaciones.css">
<script>window.PUENTE_CONFIG={indicador:'oculto',sinCopia:/./};</script>
<script src="puente.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--fondo);color:var(--tinta);padding-bottom:40px}

.barra{position:sticky;top:0;z-index:5;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:11px 14px;background:linear-gradient(135deg,var(--azul-osc),var(--azul));
  box-shadow:0 2px 12px rgba(20,48,107,.3)}
.barra .ti{color:#fff;font-size:13px;font-weight:800;letter-spacing:.4px;margin-right:auto}
.barra button{border:none;font-family:inherit;font-size:13.5px;font-weight:700;
  padding:10px 15px;border-radius:10px;cursor:pointer;background:var(--ambar);color:#4A3300}
.barra button:active{transform:translateY(1px)}

.aviso{max-width:900px;margin:22px auto;background:#fff;border:1px solid var(--borde);
  border-radius:12px;padding:26px;text-align:center;font-size:14px;color:var(--gris);line-height:1.6}

.hoja{max-width:900px;margin:18px auto 0;background:#fff;color:#111;padding:28px 32px;
  border:1px solid var(--borde);border-radius:8px;font-size:12px;line-height:1.5;
  box-shadow:0 3px 16px rgba(20,48,107,.10)}
.enc{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--azul-osc);padding-bottom:12px}
.enc img{height:60px;width:auto}
.enc .ti{font-size:17px;font-weight:900;color:var(--azul-osc);letter-spacing:.3px;line-height:1.2}
.enc .su{font-size:10.5px;color:#555;letter-spacing:.6px;text-transform:uppercase}
.cod{margin-left:auto;text-align:right;font-size:9.5px;color:#555;line-height:1.65;white-space:nowrap}

.tit{background:var(--azul-osc);color:#fff;padding:11px 15px;border-radius:6px;margin:15px 0;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.tit .et{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;opacity:.85}
.tit b{font-size:18px;display:block;letter-spacing:.3px}
.tit .der{text-align:right;font-size:11px;line-height:1.5}

.sec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;
  color:var(--azul-osc);border-bottom:1px solid #ccc;padding-bottom:3px;margin:18px 0 9px}

.cuadros{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cuadro{border:1px solid #bbb;border-radius:6px;padding:9px 11px;border-top:3px solid var(--azul)}
.cuadro .e{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:#666}
.cuadro .v{font-size:19px;font-weight:900;color:var(--azul-osc);line-height:1.2}
.cuadro .s{font-size:10px;color:#666}

table{width:100%;border-collapse:collapse;margin-top:5px;font-size:11px}
th{background:#EEF2F7;border:1px solid #bbb;padding:6px 7px;text-align:left;
  font-size:8.5px;text-transform:uppercase;letter-spacing:.4px}
td{border:1px solid #ccc;padding:5px 7px;vertical-align:top}
td.n{text-align:right;white-space:nowrap}
tr.tot td{background:#EEF2F7;font-weight:800;border-top:2px solid var(--azul-osc)}

.firmas{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.firma{text-align:center}
.firma .lin{border-top:1.5px solid #333;margin-top:60px;padding-top:6px;font-size:11px;line-height:1.5}
.nota{background:#FFF8E1;border-left:4px solid var(--ambar);border-radius:6px;padding:9px 12px;margin-top:11px;font-size:10.5px;line-height:1.6;color:#6b5200}
.pie{margin-top:24px;padding-top:10px;border-top:1px solid #ccc;font-size:9px;color:#666;line-height:1.7}

@media print{
  body{background:#fff;padding:0}
  .barra{display:none}
  .hoja{max-width:none;margin:0;border:none;border-radius:0;padding:0;box-shadow:none;font-size:10pt}
  table{page-break-inside:auto} tr{page-break-inside:avoid}
  .firmas{page-break-inside:avoid}
  .sec{page-break-after:avoid}
}
.estado{display:inline-block;border-radius:6px;padding:3px 9px;font-size:10.5px;font-weight:900;letter-spacing:.6px;margin-top:4px}
.estado.ab{background:var(--ambar);color:#4A3300}.estado.ce{background:#E7F3DD;color:#2F6B0A}
.tabla{overflow-x:auto}
td.no{color:#B42318}
@media (max-width:640px){.mo{display:none}}
@media (max-width:640px){.hoja{padding:18px 14px}.cuadros{grid-template-columns:1fr 1fr}.enc img{height:44px}}
@page{margin:12mm}
</style>
<link rel="stylesheet" href="documento.css">
<script src="documento.js"></script>
</head>
<body>

<div id="aviso" class="aviso">Abriendo el documento…</div>

<div id="app" style="display:none">
<div class="barra doc-barra no-imprimir">
    <span class="db-marca"><img src="ecovsa-letras.png" alt="ECOVSA"></span>
    <div class="ti">Resumen de la noche · desechos sólidos</div>
    <button class="db-pdf" onclick="window.print()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg><span>Guardar en PDF</span></button>
  </div>
  <div class="hoja" id="hoja"></div>
</div>

<script>
/* api 3.27 · Desechos sólidos · Resumen de la noche para la gerencia del cliente (enlace con clave, sin PIN).
   Todas las sucursales de la ruta con sus bolsas y quién recibió; el peso total lo manda la planta después:
   mientras no se cierre, el resumen dice ABIERTO. */
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function n0(v){return Number(v||0).toLocaleString("en-US",{maximumFractionDigits:0});}
function n1(v){return Number(v||0).toLocaleString("en-US",{maximumFractionDigits:1});}
function aviso(t){ $("app").style.display="none"; var a=$("aviso"); a.style.display="block"; a.innerHTML=t; }
function q(k){ var m=(location.search||"").match(new RegExp("[?&]"+k+"=([^&]+)")); return m?decodeURIComponent(m[1]):""; }
function membrete(r, que){ return DOCE.membrete({ empresa:r.empresa, linea:"Recolección y transporte de desechos sólidos no peligrosos", franja:"Desechos sólidos no peligrosos · "+que, codigo:(r.empresa&&r.empresa.formulario)||"Formato por asignar" }); }
function mostrar(html){ $("hoja").innerHTML=html; $("aviso").style.display="none"; $("app").style.display="block"; }
function pie(r){ var e=DOCE.empresa(r.empresa); return "<div class='pie'>"+esc(e.razonSocial)+" · RUC "+esc(e.ruc)+(e.dv?" DV "+esc(e.dv):"")+" · "+esc(e.direccion)+"<br>Tel. "+esc(e.telefono)+" · "+esc(e.correo)+"</div>"; }
function recibio(f){
  if(!f.llegada) return "<span style='color:#888'>pendiente</span>";
  if(!f.atendida) return "<span class='no'>No se pudo recolectar</span>";
  return f.recibe==="encargado" ? "✍ "+esc(f.recibeNombre||"Encargado") : f.recibe==="nadie" ? "Sin encargado · fotos" : "—";
}
function arrancar(){
  var h=q("h"), k=q("k");
  if(!h||!k){ aviso("El enlace está incompleto."); return; }
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ aviso(esc((r&&r.error)||"No se pudo abrir el resumen.")); return; }
    var T=r.totales, D=r.descargas||[];
    var est = r.abierto ? "<span class='estado ab'>ABIERTO · "+(r.rutaCerrada?"PESO POR CERRAR":"RUTA EN CURSO")+"</span>" : "<span class='estado ce'>CERRADO</span>";
    var peso = r.kg!=null ? "<div class='v'>"+n1(r.kg)+"</div><div class='s'>kg · reportado por la planta</div>" : "<div class='v' style='font-size:15px'>En proceso</div><div class='s'>la planta lo está reportando</div>";
    mostrar(membrete(r,"Resumen de la noche")+
      "<div class='tit'><div><span class='et'>Resumen de la noche · desechos sólidos</span><b>"+esc(r.folio)+"</b></div><div class='der'>"+esc(DOCE.fecha(r.fecha))+"<br>"+est+"</div></div>"+
      "<div class='cuadros'>"+
        "<div class='cuadro'><div class='e'>Sucursales atendidas</div><div class='v'>"+T.atendidos+" <span style='font-size:13px;color:#666'>de "+T.puntos+"</span></div><div class='s'>"+(T.noAtendidos?T.noAtendidos+" no se pudo recolectar":"todas las visitadas")+(T.pendientes?" · "+T.pendientes+" pendiente(s)":"")+"</div></div>"+
        "<div class='cuadro'><div class='e'>Bolsas</div><div class='v'>"+n0(T.bolsas)+"</div><div class='s'>contadas en los puntos</div></div>"+
        "<div class='cuadro'><div class='e'>Recibieron</div><div class='v'>"+T.firmaron+"</div><div class='s'>firmaron · "+T.sinEncargado+" sin encargado</div></div>"+
        "<div class='cuadro'><div class='e'>Peso total</div>"+peso+"</div>"+
      "</div>"+
      "<div class='sec'>Datos de la noche</div><table><tbody>"+
        (r.clientes?"<tr><th style='width:30%'>Cliente</th><td>"+esc(r.clientes)+"</td></tr>":"")+
        "<tr><th style='width:30%'>Ruta</th><td>"+esc(r.ruta||r.hojaId)+"</td></tr>"+
        "<tr><th>Unidad y equipo</th><td>"+esc(r.unidad)+" · conductor "+esc(r.conductor)+(r.ayudantes?" y "+r.ayudantes+" ayudante"+(r.ayudantes===1?"":"s"):"")+"</td></tr>"+
        "<tr><th>Salida y regreso</th><td>"+(r.salida?"Salió "+esc(r.salida):"—")+(r.regreso?" · regresó "+esc(r.regreso):r.rutaCerrada?"":" · en ruta")+"</td></tr>"+
      "</tbody></table>"+
      "<div class='sec'>Sucursales</div><div class='tabla'><table><thead><tr><th>#</th><th>Sucursal</th><th>Llegada</th><th class='mo'>Salida</th><th style='text-align:right'>Bolsas</th><th class='mo'>Depósito</th><th>Recibió</th><th>Novedades</th><th class='mo'>Recibo N.°</th></tr></thead><tbody>"+
        r.filas.map(function(f){ return "<tr><td>"+f.n+"</td><td><b>"+esc(f.punto)+"</b></td><td>"+esc(f.llegada||"—")+"</td><td class='mo'>"+esc(f.salida||"—")+"</td><td class='n'>"+(f.atendida?(f.caja?"Caja "+esc(f.caja):n0(f.bolsas)):"—")+"</td><td class='mo'>"+esc(f.contenedor||"")+"</td><td>"+recibio(f)+"</td><td>"+esc([f.inc,f.otro?"Otro material: "+f.otro:""].filter(Boolean).join(" · "))+"</td><td class='mo'>"+esc(f.folio||"")+"</td></tr>"; }).join("")+
        "<tr class='tot'><td></td><td>Total</td><td></td><td class='mo'></td><td class='n'>"+n0(T.bolsas)+"</td><td class='mo'></td><td colspan='2'>"+T.atendidos+" de "+T.puntos+" sucursales atendidas</td><td class='mo'></td></tr>"+
      "</tbody></table></div>"+
      "<div class='sec'>Disposición final</div>"+(D.length?"<table><thead><tr><th>Destino</th><th>Llegada y salida</th><th style='text-align:right'>Bolsas entregadas</th><th style='text-align:right'>Peso</th></tr></thead><tbody>"+
        D.map(function(d){ return "<tr><td>"+esc(d.destino)+"</td><td>"+esc(d.llegada||"—")+(d.salida?" a "+esc(d.salida):"")+"</td><td class='n'>"+(d.bolsas!=null?n0(d.bolsas):"—")+"</td><td class='n'>"+(d.abierto?"en proceso":n1(d.kg)+" kg")+"</td></tr>"; }).join("")+
        (r.kg!=null&&D.length>1?"<tr class='tot'><td colspan='3'>Peso total</td><td class='n'>"+n1(r.kg)+" kg</td></tr>":"")+
        "</tbody></table>":"<div style='font-size:11px;color:#666'>Todavía no se ha descargado.</div>")+
      "<div class='nota'>"+(r.abierto?"Este resumen está <b>abierto</b>: la planta de disposición pesa la carga con cuidado al tratarla y reporta el peso después. Cuando ECOVSA registre el peso total, este mismo enlace mostrará el resumen cerrado.":"Resumen cerrado con el peso total que reportó la planta de disposición.")+" Cada sucursal tiene su recibo de visita (horas, bolsas y quién recibió); los recibos de sucursal no llevan peso.</div>"+
      pie(r));
  }).withFailureHandler(function(){ aviso("Sin conexión. El resumen necesita señal."); }).api_dsoResumen(h, k);
}
arrancar();
</script>
</body>
</html>
