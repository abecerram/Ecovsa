<style>
/* ── Calidad · sistema de gestión de la calidad (ISO 9001) ──
   api 3.14: nace apagado (Configuración › Encender y apagar).
   api 3.24 · parte 1: Inicio como guía hacia la certificación (meta, ruta,
   % del camino, lo que te toca, lo que falta, informe de avance en Word) y
   Documentos (el listado maestro F-CAL-03 vivo: subir PDF y Word, versiones,
   leído y entendido, Excel). Ajustes: quién ve qué (solo el administrador). */
.ruta{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:6px}
.ruta .e{border-radius:10px;padding:9px 9px 8px;background:var(--line2);font-size:11.5px;color:var(--muted);line-height:1.3;min-height:84px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;font-family:inherit}
.ruta .e b{font-size:12.5px;color:var(--ink)}.ruta .e em{font-style:normal;font-weight:800;font-size:10.5px;letter-spacing:.4px}
.ruta .e small{margin-top:auto;font-size:10.5px;font-weight:700}
.ruta .e.hecho{background:var(--ok-bg)}.ruta .e.hecho b{color:#1e5a2a}.ruta .e.hecho small{color:#1e5a2a}
.ruta .e.on{background:var(--navy2);color:#c9d6ea}.ruta .e.on b{color:#fff}
.ruta .e.tarde{background:var(--warn-bg);color:#6b4d00;box-shadow:inset 0 0 0 1.5px var(--warn)}.ruta .e.tarde b{color:#5a4000}
.ruta .e.on.tarde{background:var(--navy2);color:#ffd970}
.ruta button.e{cursor:pointer}.ruta button.e:hover{filter:brightness(.97)}
.hero{background:linear-gradient(135deg,#0f2a57,#17407f);color:#fff;border-radius:14px;padding:18px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero h2{font-size:20px;margin-top:6px}.hero p{color:#c9d6ea;font-size:13px;margin-top:3px}.hero .tag{background:rgba(255,255,255,.14);color:#fff}
.hero .sp{flex:1}.hero .big{font-size:40px;font-weight:800;line-height:1;text-align:right}.hero .big small{font-size:13px;color:#c9d6ea;font-weight:600;display:block;margin-top:4px}
.hero .barra{height:7px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:10px;max-width:420px}.hero .barra i{display:block;height:100%;background:linear-gradient(90deg,#86B62C,#c5e89a);border-radius:5px}
.obra-c{display:flex;gap:14px;align-items:flex-start}
.obra-c .ic2{width:46px;height:46px;border-radius:12px;background:rgba(245,179,1,.18);color:#8a6300;display:grid;place-items:center;flex:none}
.obra-c b{font-size:14.5px;display:block}.obra-c p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.secs a{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600}
.secs a small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.it2{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}.it2:first-child{border-top:0}
.it2>svg{flex:none;color:var(--navy2)}.it2 .tx{flex:1;min-width:0}.it2 .tx b{font-size:13.5px;display:block}.it2 .tx small{color:var(--muted);font-size:12px;display:block;margin-top:2px}
.it2 .cd{font-weight:800;font-size:12px;color:var(--navy2);white-space:nowrap}
.gr-t{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin:14px 0 2px}.gr-t:first-child{margin-top:0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}.chk:first-child{border-top:0}
.chk input{width:17px;height:17px;margin-top:1px;flex:none;accent-color:var(--ok)}.chk.hecha span{color:var(--muted);text-decoration:line-through}
.chk small{display:block;color:var(--muted);font-size:11.5px;text-decoration:none}
.cod{font-weight:800;white-space:nowrap}
.tb td small{display:block;color:var(--muted);font-size:11.5px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.filtros .sp{flex:1}
.filtros .in{max-width:240px}
.ver-t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.vs{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.vs .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.vs .h b{font-size:13.5px}.vs p{font-size:12.5px;color:var(--muted);margin-top:4px}
.mt{width:100%;border-collapse:collapse;font-size:12.5px}.mt th,.mt td{border-bottom:1px solid var(--line2);padding:7px 6px;text-align:center}.mt th:first-child,.mt td:first-child{text-align:left}
.mt th{font-size:11px;color:var(--muted);font-weight:700}.mt input{width:17px;height:17px;accent-color:var(--navy2)}
.prs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.prs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font:600 12px Archivo,sans-serif;color:var(--muted);cursor:pointer}
.prs button.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.sv-l{max-height:46vh;overflow:auto;border:1px solid var(--line2);border-radius:10px;margin-top:10px}
.sv-l .f{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line2);font-size:12.5px}.sv-l .f:first-child{border-top:0}
.sv-l .f small{display:block;color:var(--muted);font-size:11px}
.q5 .f{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 40px;gap:10px;align-items:center;padding:8px 0;font-size:12.5px;border-top:1px solid var(--line2)}.q5 .f:first-child{border-top:0}
.q5 .f small{display:block;color:var(--muted);font-size:11px}.q5 .st{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line2)}.q5 .st i{display:block;height:100%}
.nuevo{font-size:10px;font-weight:800;background:var(--amber);color:#3d2a00;border-radius:5px;padding:1px 6px;margin-left:6px;letter-spacing:.3px}
.cmt{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:10px 0;font-size:13px}.cmt small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}.cmt.bad{border-left-color:var(--bad)}
@media(max-width:900px){.ruta{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){.ruta{grid-template-columns:repeat(2,minmax(0,1fr))}.ruta .e{min-height:0}.obra-c{flex-direction:column}.hero .big{text-align:left}
  .filtros .in{max-width:none}.sv-l .f{grid-template-columns:76px minmax(0,1fr)}.sv-l .f>:last-child{grid-column:1/-1}}
</style>
</head>

<script>
/* Qué va en cada sección todavía por construir (de la maqueta aprobada, DISENO_calidad.md) */
var SECC = {
  frm:  ['Formularios', 'documento', 'Todos los formularios en un solo lugar. Los que ya viven en otro módulo abren su pantalla; los de calidad se llenan aquí.'],
  nc:   ['No conformidades', 'alerta', 'Reportar algo que salió mal, buscar la causa (5 porqués), corregir y verificar que no se repita (F-CAL-05).'],
  rie:  ['Riesgos y oportunidades', 'escudo', 'Qué puede salir mal y qué podemos aprovechar, con su plan y su dueño (F-CAL-08).'],
  aud:  ['Auditorías', 'check', 'Programa anual de auditorías internas y del organismo certificador, con sus hallazgos (F-CAL-06).'],
  obj:  ['Objetivos e indicadores', 'tendencia', 'Los objetivos de la calidad (DG-CAL-03) medidos con lo que el sistema ya registra.'],
  rev:  ['Revisión por la dirección', 'brujula', 'Las entradas que pide la norma, listas para el acta de Gerencia (F-CAL-07).'],
  cap:  ['Capacitación', 'personas', 'Quién está preparado para qué y cuándo se le capacitó (F-ADM-06).'],
  prov: ['Proveedores', 'carrito', 'Evaluación anual de los proveedores que afectan el servicio (F-ADM-07).'],
  equ:  ['Equipos de medición', 'balanza', 'Calibración de báscula, autoclave e incubadora, con aviso antes de vencer (F-PLA-08).']
};
function pSec(id) {
  var x = SECC[id] || SECC.frm;
  return MK.cabeza(x[0], x[2]) +
    '<div class="card"><div class="obra-c"><div class="ic2">' + MK.ic(x[1], 22) + '</div><div><b>Por construir.</b>' +
    '<p>Esta sección está en la maqueta aprobada y se construye en su propio paquete. Aquí no se guarda nada todavía.</p></div></div></div>';
}

/* ═══ api 3.24 · piezas comunes ═══ */
var CAL_EST = { vigente: ['Vigente', 'ok'], sistema: ['En el sistema', 'ok'], externo: ['Externo', 'info'], por_aprobar: ['Por aprobar', 'warn'],
  borrador: ['En borrador', 'gris'], falta: ['Falta', 'bad'], obsoleto: ['Obsoleto', 'gris'] };
var CAL_AREAS = { VEN: 'Mercadeo', LOG: 'Logística', PLA: 'Planta', ADM: 'Administración', CAL: 'Gerencia y calidad', EXT: 'Externos' };
var CAL_TIPOS = { PO: 'Política', DG: 'Documento general', PL: 'Plan', PR: 'Procedimiento', IT: 'Instructivo', F: 'Formulario o registro', DE: 'Documento externo' };
var CAL_LISTO = { vigente: 1, sistema: 1, externo: 1 };
var MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function C() { return (MK.base && MK.base.cal) || {}; }
function PU() { return C().puede || {}; }
function estTag(e) { var x = CAL_EST[e] || [e, 'gris']; return MK.tag(x[0], x[1]); }
function mesTx(ym) { return /^\d{4}-\d{2}$/.test(ym || '') ? MES_C[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4) : ''; }
function rango(a, b) {
  if (!a) return '';
  if (!b || a === b) return mesTx(a);
  if (a.slice(0, 4) === b.slice(0, 4)) return MES_C[Number(a.slice(5, 7)) - 1] + '–' + mesTx(b);
  return mesTx(a) + ' – ' + mesTx(b);
}
function js(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
/* Algo cambió: se vuelve a pedir la base (Inicio) y el listado */
function calRecargar() { DOCS = null; return MK.recargar(); }
/* Abrir un archivo firmado: la pestaña se abre antes de pedirlo (si no, el navegador la bloquea) */
function calAbrir(codigo, clase, versionId) {
  var w = null; try { w = window.open('', '_blank'); if (w) w.document.write('<p style="font:15px Archivo,sans-serif;padding:20px;color:#14306b">Abriendo ' + MK.esc(codigo) + '…</p>'); } catch (e) { w = null; }
  MK.llamar('api_calVer', codigo, clase || 'pdf', versionId || '').then(function (r) {
    if (clase === 'editable') { if (w) w.close(); var a = document.createElement('a'); a.href = r.url; a.download = r.nombre; document.body.appendChild(a); a.click(); a.remove(); return; }
    if (w) w.location.href = r.url; else location.href = r.url;
  }, function () { if (w) w.close(); });
}

/* ═══ Inicio: la guía hacia la certificación ═══ */
function pIni() {
  var c = C(), P = PU();
  var der = (P.informe ? '<button class="btn" onclick="calInforme(this)">' + MK.ic('bajar', 15) + ' Informe de avance</button>' : '') +
    (P.editar ? '<button class="btn" onclick="calEditarRuta()">' + MK.ic('lapiz', 15) + ' Cambiar la meta y la ruta</button>' : '');
  var h = MK.cabeza('Calidad', 'Sistema de gestión de la calidad · ISO 9001 · aquí se ve hacia dónde vamos, dónde está cada documento y qué le toca a cada quien', der);
  if (!c.cargado) {
    return h + '<div class="card"><div class="obra-c"><div class="ic2">' + MK.ic('libro', 22) + '</div><div><b>Falta cargar el listado maestro (F-CAL-03).</b>' +
      '<p>' + (P.ajustes ? 'Se cargan los 58 códigos del listado al 4 oct 2026 con su estado, la ruta propuesta y las tareas que no son documentos. No pisa nada que ya exista.' :
      'El administrador hace la carga inicial. Cuando esté, aquí verás la meta, la ruta y lo que te toca.') + '</p>' +
      (P.ajustes ? '<div style="margin-top:12px"><button class="btn pri" onclick="calCargaInicial(this)">' + MK.ic('subir', 15) + ' Hacer la carga inicial</button></div>' : '') +
      '</div></div></div>';
  }
  var A = c.avance, K = c.conteos, E = c.etapas || [], act = E.filter(function (e) { return e.actual; })[0];
  var tarde = E.filter(function (e) { return e.atrasada; }).length;
  h += '<div class="pila">';
  /* la meta y el % */
  h += '<div class="hero"><div style="flex:1;min-width:240px"><span class="tag">Meta</span><h2>' + MK.esc(c.meta.texto) + ' · ' + MK.esc(mesTx(c.meta.mes)) + '</h2>' +
    '<p>' + (act ? 'Hoy vamos en: <b style="color:#fff">' + MK.esc(act.nombre) + '</b>' + (act.atrasada ? ' · <b style="color:#ffd970">atrasada</b>' : '') : 'Todas las etapas están hechas') +
    ' · ' + A.etapasHechas + ' de ' + A.etapasTotal + ' etapas hechas · ' + K.listos + ' de ' + K.total + ' documentos listos</p>' +
    '<div class="barra"><i style="width:' + Math.max(2, A.total) + '%"></i></div></div>' +
    '<div class="big">' + A.total + ' %<small>del camino recorrido</small></div></div>';
  /* la ruta */
  h += '<div class="card"><div class="row" style="align-items:center"><h3 style="margin:0">La ruta</h3><span class="sp"></span>' +
    (P.falta ? '<button class="btn gh sm" onclick="calHistorial()">' + MK.ic('historial', 14) + ' Historial</button>' : '') + '</div><div class="ruta">' +
    E.map(function (e, k) {
      var cl = e.hecha ? 'hecho' : (e.actual ? 'on' : '') + (e.atrasada ? ' tarde' : '');
      var pie = e.hecha ? '✓ Hecha' : e.atrasada ? 'Atrasada' : (P.falta && e.pendientes ? e.pendientes + ' pendiente' + (e.pendientes === 1 ? '' : 's') : e.actual ? 'En curso' : '');
      var tag = P.falta ? 'button' : 'div';
      return '<' + tag + ' class="e ' + cl + '"' + (P.falta ? ' onclick="calEtapa(\'' + e.id + '\')"' : '') + '><em>' + (k + 1) + '</em><b>' + MK.esc(e.nombre) + '</b>' + MK.esc(rango(e.desde, e.hasta)) +
        (pie ? '<small>' + MK.esc(pie) + '</small>' : '') + '</' + tag + '>';
    }).join('') + '</div>' +
    '<div class="nota">El % sale solo: la mitad por las etapas hechas (' + A.etapasHechas + ' de ' + A.etapasTotal + ') y la mitad por los documentos listos (' + K.listos + ' de ' + K.total + ').' +
    (tarde ? ' En ámbar: ' + (tarde === 1 ? 'una etapa pasó su fecha' : tarde + ' etapas pasaron su fecha') + ' sin marcarse como hecha.' : '') +
    (P.falta ? ' Toque una etapa para ver lo que exige.' : '') + '</div></div>';
  /* los números del listado */
  h += MK.kpis([
    { e: 'Documentos listos', v: K.listos + ' <small style="display:inline;font-size:14px">de ' + K.total + '</small>', s: K.faltan + ' faltan', c: 'ok', ir: "calIrDocs('listos')" },
    { e: 'Por aprobar', v: K.por_aprobar, s: 'esperan a Gerencia', c: K.por_aprobar ? 'warn' : '', ir: P.falta ? "calIrDocs('por_aprobar')" : '' },
    { e: 'En borrador', v: K.borrador, s: 'se están escribiendo', ir: P.falta ? "calIrDocs('borrador')" : '' },
    { e: 'Faltan por crear', v: K.falta, s: 'todavía no existen', c: K.falta ? 'bad' : '', ir: P.falta ? "calIrDocs('falta')" : '' }], 4);
  /* lo que te toca + dónde está todo */
  h += '<div class="g21"><div class="card"><h3>Lo que te toca</h3>' + calToca() + '</div>' +
    '<div class="card"><h3>Dónde está todo</h3>' + calBasicos() + '</div></div>';
  if (P.falta && c.falta) h += calFalta();
  return h + '</div>';
}
function calToca() {
  var c = C(), h = '';
  (c.toca || []).forEach(function (d) {
    h += '<div class="it2">' + MK.ic('libro', 18) + '<div class="tx"><b>Leer ' + MK.esc(d.codigo) + ' · ' + MK.esc(d.nombre) + '</b><small>Versión ' + d.version + ' · al terminar, marque «Leído y entendido»</small></div>' +
      '<button class="btn sm pri" onclick="calFicha(\'' + d.codigo + '\')">Leer</button></div>';
  });
  if (c.miArea && !(c.puede || {}).falta) {   /* quien ve «Lo que falta» completo ya lo tiene abajo */
    var n = c.miArea.docs.length + c.miArea.tareas.length;
    if (n) {
      h += '<div class="gr-t" style="margin-top:' + (h ? 14 : 0) + 'px">De ' + MK.esc(c.areaNombre) + ' · en preparación</div>';
      c.miArea.docs.forEach(function (d) {
        h += '<div class="it2"><span class="cd">' + MK.esc(d.codigo) + '</span><div class="tx"><b>' + MK.esc(d.nombre) + '</b><small>' + MK.esc(d.responsable || '') + '</small></div>' + estTag(d.estado) +
          '<button class="btn sm gh" onclick="calFicha(\'' + d.codigo + '\')">Ver</button></div>';
      });
      c.miArea.tareas.forEach(function (t) {
        h += '<div class="it2">' + MK.ic('check', 18) + '<div class="tx"><b>' + MK.esc(t.texto) + '</b><small>' + MK.esc(t.responsable || 'Tarea de la ruta') + '</small></div></div>';
      });
    }
  }
  return h || '<div class="vacio">Estás al día: no tienes documentos por leer.</div>';
}
function calBasicos() {
  var c = C(), h = '';
  (c.basicos || []).forEach(function (d) {
    h += '<div class="it2">' + MK.ic('documento', 18) + '<div class="tx"><b>' + MK.esc(d.nombre) + '</b><small>' + MK.esc(d.codigo) + (d.listo ? ' · versión ' + d.version : ' · en preparación') + '</small></div>' +
      (d.listo ? '<button class="btn sm" onclick="calAbrir(\'' + d.codigo + '\',\'pdf\')">' + MK.ic('ojo', 14) + ' Abrir</button>' : MK.tag('En preparación', 'gris')) + '</div>';
  });
  h += '<div class="it2">' + MK.ic('libro', 18) + '<div class="tx"><b>Todos los documentos vigentes</b><small>Procedimientos, instructivos y formularios con su versión</small></div><button class="btn sm" onclick="MK.ir(\'doc\')">Ver</button></div>';
  h += '<div class="it2">' + MK.ic('alerta', 18) + '<div class="tx"><b>Reportar algo que salió mal</b><small>Se abre con la sección de No conformidades</small></div>' + MK.tag('Pronto', 'gris') + '</div>';
  return h;
}
/* «Lo que falta» completo, por etapa (responsable de calidad, Gerencia y administrador) */
function calFalta() {
  var c = C(), P = PU(), F = c.falta, E = c.etapas || [], h = '';
  var nd = F.docs.length, nt = F.tareas.length;
  var grupos = E.map(function (e) { return { id: e.id, n: e.nombre, r: rango(e.desde, e.hasta), d: F.docs.filter(function (d) { return d.etapa === e.id; }), t: F.tareas.filter(function (t) { return t.etapa === e.id; }) }; });
  var sin = F.docs.filter(function (d) { return !E.some(function (e) { return e.id === d.etapa; }); });
  if (sin.length) grupos.push({ id: '', n: 'Sin etapa asignada', r: '', d: sin, t: [] });
  h += '<div class="card"><div class="row" style="align-items:center"><h3 style="margin:0">Lo que falta</h3><span class="sp"></span><span class="small muted">' + nd + ' documento' + (nd === 1 ? '' : 's') + ' · ' + nt + ' tarea' + (nt === 1 ? '' : 's') + '</span></div>';
  grupos.forEach(function (g) {
    if (!g.d.length && !g.t.length) return;
    h += '<div class="gr-t" style="margin-top:14px">' + MK.esc(g.n) + (g.r ? ' · ' + MK.esc(g.r) : '') + '</div>';
    g.d.forEach(function (d) {
      h += '<div class="it2" style="cursor:pointer" onclick="calFicha(\'' + d.codigo + '\')"><span class="cd" style="min-width:74px">' + MK.esc(d.codigo) + '</span><div class="tx"><b>' + MK.esc(d.nombre) + '</b><small>' + MK.esc(d.responsable || '') + '</small></div>' + estTag(d.estado) + '</div>';
    });
    g.t.forEach(function (t) { h += calChkTarea(t, P.editar); });
  });
  if (!nd && !nt) h += '<div class="vacio">No falta nada en el listado ni en las tareas.</div>';
  return h + '</div>';
}
function calChkTarea(t, puede) {
  return '<label class="chk' + (t.hecha ? ' hecha' : '') + '"><input type="checkbox"' + (t.hecha ? ' checked' : '') + (puede ? ' onchange="calTareaHecha(\'' + t.tareaId + '\',this.checked)"' : ' disabled') + '>' +

/* pedir subida → subir al espacio de archivos → avisar que está listo */
function calSubirArchivos(codigo, fp, fe, estado, nota, avance) {
  var L = []; if (fp) L.push({ clase: 'pdf', f: fp }); if (fe) L.push({ clase: 'editable', f: fe });
  return MK.api('api_calPedirSubida', MK.pinUso(), codigo, L.map(function (x) { return { clase: x.clase, nombre: x.f.name, mime: calMime(x.f), tamano: x.f.size }; })).then(function (r) {
    if (!r || !r.ok) throw new Error((r && r.error) || 'No se pudo preparar la subida');
    var ids = {}, i = 0;
    var sig = function () {
      if (i >= r.archivos.length) return Promise.resolve();
      var a = r.archivos[i++], x = L.filter(function (z) { return z.clase === a.clase; })[0];
      ids[a.clase] = a.archivoId;
      return ARCH.subir(a.subida, { blob: x.f, meta: { nombre: x.f.name, mime: calMime(x.f), tamano: x.f.size } }, function (pc) { avance && avance('Subiendo ' + x.f.name + ' · ' + pc + ' %'); }).then(sig);
    };
    return sig().then(function () {
      avance && avance('Guardando…');
      return MK.api('api_calSubidaLista', MK.pinUso(), codigo, ids, { estado: estado, nota: nota });
    }).then(function (z) { if (!z || !z.ok) throw new Error((z && z.error) || 'No se pudo guardar'); return z; });

    '<div class="pie"><button class="btn" id="sv-x" onclick="MK.cerrarHoja()">Cerrar</button><button class="btn pri" id="sv-ok" onclick="calSvSubir()" disabled>Subir</button></div>', { ancha: true, fija: true });

function calSvLeer(files) {
  var porCod = {}, sobran = [], mapa = {};
  (DOCS && DOCS.docs || []).forEach(function (d) { mapa[d.codigo] = d; });
  Array.prototype.forEach.call(files || [], function (f) {
    var m = /^((?:PO|DG|PL|PR|IT|F)-(?:VEN|LOG|PLA|ADM|CAL)-\d{2}|DE-\d{2})(?![0-9])/i.exec(String(f.name).trim());
    var cl = calClase(f);
    if (!m || !cl) { sobran.push([f.name, !m ? 'el nombre no empieza con un código' : 'no es PDF, Word ni Excel']); return; }
    var c = m[1].toUpperCase();
    if (!mapa[c]) { sobran.push([f.name, c + ' no está en el listado']); return; }
    if (mapa[c].estado === 'obsoleto') { sobran.push([f.name, c + ' está obsoleto']); return; }
    var g = porCod[c] = porCod[c] || { codigo: c, doc: mapa[c] };
    if (g[cl]) { sobran.push([f.name, 'ya hay otro ' + (cl === 'pdf' ? 'PDF' : 'editable') + ' para ' + c]); return; }
    if (f.size > 10 * 1024 * 1024) { sobran.push([f.name, 'pesa más de 10 MB']); return; }

  });

    return '<div class="f" id="sv-f' + i + '"><span class="cod">' + g.codigo + '</span><span>' + MK.esc(g.doc.nombre) + '<small>' + [g.pdf ? 'PDF' : '', g.editable ? 'editable' : ''].filter(Boolean).join(' + ') + ' · queda: ' + tx[g.estado] + '</small></span><span class="st">' + MK.tag('Listo para subir', 'gris') + '</span></div>';
  }).join('') + '</div>' : '') +
    (sobran.length ? '<div class="aviso am" style="margin-top:10px"><b>' + sobran.length + ' archivo' + (sobran.length === 1 ? '' : 's') + ' no se van a subir:</b><br>' + sobran.map(function (s) { return MK.esc(s[0]) + ' — ' + MK.esc(s[1]); }).join('<br>') + '</div>' : '');

    }).join('') + '</div><div class="nota">Cuando esté la sección de No conformidades, las que no se atiendan bien abrirán una acción correctiva.</div></div>' : '') +
    '<div class="card"><h3>Cuándo se envía</h3><div class="small" style="line-height:1.6">A los <b>' + r.cfg.primera + ' días</b> del primer servicio y luego cada <b>' + r.cfg.cada + ' meses</b>. Recordatorio a los ' + r.cfg.recordar + ' días. Se cambia en Mercadeo › Plantillas y ajustes › Encuesta de satisfacción.</div></div>' +
    '</div></div>';
  return h;
}

    { g: 'DESEMPEÑO' }, { id: 'obj', n: 'Objetivos e indicadores', i: 'tendencia' }, { id: 'sat', n: 'Satisfacción del cliente', i: 'grafico' }, { id: 'rev', n: 'Revisión por la dirección', i: 'brujula' },
    { g: 'APOYO' }, { id: 'cap', n: 'Capacitación', i: 'personas' }, { id: 'prov', n: 'Proveedores', i: 'carrito' }, { id: 'equ', n: 'Equipos de medición', i: 'balanza' },
    { g: 'AJUSTES' }, { id: 'aju', n: 'Quién ve qué', i: 'candado' }
  ],

  alCargar: function (b) {

    if (!P.ajustes) MK.op.paginas = MK.op.paginas.filter(function (p) { return p.id !== 'aju' && p.g !== 'AJUSTES'; });
    MK.contadores.ini = (c.toca || []).length ? { n: c.toca.length, t: 'am' } : null;
