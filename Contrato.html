function conCiudad(dir,ciudad){

var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
           "septiembre","octubre","noviembre","diciembre"];
function larga(iso){
  if(!iso) return "";
  var d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return iso;
  return d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear();
}

/* el contrato exige el valor en letras */
var UNI=["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez",

 "veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis",
 "veintisiete","veintiocho","veintinueve"];
var DEC=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
var CEN=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos",
 "setecientos","ochocientos","novecientos"];
function menor100(n){
  if(n<30) return UNI[n];
  var d=Math.floor(n/10), u=n%10;
  return DEC[d]+(u?" y "+UNI[u]:"");
}
function menor1000(n){
  if(n===100) return "cien";
  var c=Math.floor(n/100), r=n%100;
  return (c?CEN[c]:"")+(c&&r?" ":"")+(r?menor100(r):"");
}
function enLetras(v){
  var n=Math.floor(Number(v)||0);
  var cent=Math.round(((Number(v)||0)-n)*100);
  var txt;
  if(n===0) txt="cero";
  else if(n<1000) txt=menor1000(n);
  else {
    var mil=Math.floor(n/1000), r=n%1000;
    txt=(mil===1?"mil":menor1000(mil)+" mil")+(r?" "+menor1000(r):"");
  }
  txt=txt.charAt(0).toUpperCase()+txt.slice(1);
  return txt+" balboas con "+("0"+cent).slice(-2)+"/100";
}

function arrancar(){
  if(window.google && google.script && google.script.url){
    google.script.url.getLocation(function(loc){
      var p=(loc&&loc.parameter)||{}; seguir(p.cod||"");
    });
  } else {
    var m=(location.search||"").match(/[?&]cod=([^&]+)/);
    seguir(m?decodeURIComponent(m[1]):"");
  }
}

function seguir(cod){
  COD=cod;
  if(!COD){ aviso("Falta el código de propuesta en el enlace."); return; }
  var pin="";
  try{ pin=JSON.parse(localStorage.getItem("ecovsa_pin")||'""'); }catch(e){ pin=""; }
  if(!pin){ aviso("Entra primero en la página de mercadeo."); return; }

  google.script.run
    .withSuccessHandler(function(r){
      if(r && r.incompleto){ pintarFaltantes(r); return; }
      if(!r||!r.ok){ aviso(esc((r&&r.error)||"No se pudo cargar.")); return; }
      if(r.empresa) DATOS_EMP=r.empresa;
      pintar(r.prospecto);
      $("aviso").style.display="none"; $("app").style.display="block";
    })
    .withFailureHandler(function(){ aviso("Sin conexión."); })
    .api_contrato(pin, COD);
}

    '<div class="sub">Faltan datos obligatorios en la ficha de <b>'+esc(r.empresa||"")+

  'entenderá prorrogado por el mismo término inicial. En el caso de que EL CONTRATANTE decida '+
  'culminar la relación comercial antes del plazo pactado, EL CONTRATISTA impondrá una penalización '+
  'de un mes de facturación por los gastos incurridos.</p>'+

  '<p><span class="cl">Octava: Responsabilidad por daños o pérdidas del equipo.</span> Convienen LAS '+
  'PARTES que cualquier daño o pérdida, una vez entregado e instalado el equipo y sus complementos, '+
  'a consecuencia de la inadecuada operación y/o la poca vigilancia hacia ellos o el personal, serán '+
  'responsabilidad de EL CONTRATANTE, por lo que se verá obligado a cubrir los gastos de '+
  'reparaciones y/o sustitución de los mismos.</p>'+

  '<p><span class="cl">Novena: Total entendimiento.</span> El hecho de que una de LAS PARTES permita '+
  'una o varias veces que la otra incumpla sus obligaciones, o las cumpla imperfectamente, o en '+
  'forma distinta de la pactada, o no insista en el cumplimiento de tales obligaciones, o no ejerza '+

  'a ningún tipo de modificación del presente contrato, ni obstará en ningún caso para que dicha '+
  'parte en el futuro reclame el fiel cumplimiento de las obligaciones que corren a cargo de la '+
  'otra, o ejerza los derechos contractuales, legales y/o convencionales de los cuales sea titular. '+
  'Las leyendas que aparecen como títulos o encabezados de los términos del presente contrato se han '+
  'insertado para conveniencia y fácil referencia del lector, de forma tal que las mismas no tienen '+
  'relevancia para efectos de la interpretación del contenido de los referidos términos.</p>'+

  '<p><span class="cl">Décima: Causales de terminación del contrato.</span> El presente Contrato '+
  'terminará por cualquiera de las siguientes causas:</p><ol>'+
  '<li>Por la terminación de la duración del Contrato.</li>'+
  '<li>Por mutuo acuerdo entre LAS PARTES.</li>'+
  '<li>Por las demás contenidas en la ley.</li>'+
  '<li>Por incapacidad financiera, la cual se presume si se declara cualquiera de LAS PARTES en '+
  'quiebra o se le abre concurso de acreedores, o es intervenida por autoridad competente.</li>'+
  '<li>Por fuerza mayor o caso fortuito como está descrito en la ley, siempre y cuando esto '+
  'imposibilite la ejecución del Contrato, habiendo pasado 30 días calendario a partir de la fecha '+
  'de los hechos que den lugar a la fuerza mayor o el caso fortuito.</li></ol>'+

  '<p><span class="cl">Décima primera: Legislación aplicable y resolución de conflictos.</span> Este '+
  'Contrato y las relaciones entre LAS PARTES derivadas de la materia que constituye su objeto están '+
  'sujetos y regulados por las leyes vigentes en la República de Panamá. En caso de surgir '+
  'controversia, discrepancia o reclamación entre LAS PARTES relacionada con la interpretación, '+
  'ejecución o cumplimiento del presente documento, LAS PARTES se comprometen a resolver dichas '+
  'controversias de la siguiente manera:</p><ol>'+
  '<li><b>Negociación amistosa:</b> en primer lugar, LAS PARTES se comprometen a intentar resolver '+
  'sus controversias mediante una negociación amistosa, en un plazo no mayor a 30 días hábiles '+
  'siguientes a la fecha en que se comunique entre ellas el conflicto. LAS PARTES acuerdan reunirse '+
  'de buena fe para dar una solución al motivo de controversia.</li>'+
  '<li><b>Conciliación:</b> si transcurrido el plazo anterior LAS PARTES no logran un acuerdo, se '+
  'someterán a un proceso de conciliación, el cual será llevado a cabo por un mediador designado de '+
  'común acuerdo o, en su defecto, por el Centro de Conciliación y Arbitraje de Panamá. El proceso '+
  'de conciliación deberá iniciarse dentro de los 15 días hábiles siguientes a la notificación de '+
  'fracaso de las negociaciones amistosas y deberá concluir en un plazo máximo de 30 días hábiles '+
  'siguientes a su inicio.</li></ol>'+
  '<p>De no llegar LAS PARTES a un acuerdo, podrán interponer sus acciones ante los Tribunales de '+
  'Justicia competentes.</p>'+

  '<p><span class="cl">Décima segunda: Confidencialidad.</span> LAS PARTES se comprometen a guardar '+
  'completa reserva y estricta confidencialidad sobre toda la información intercambiada dentro de la '+
  'etapa precontractual, contractual y postcontractual, incluyendo pero sin limitarse al presente '+
  'Contrato, la Propuesta, los documentos Anexos y cualquier otra información compartida o revelada '+
  'por medio escrito, electrónico, verbal o por cualquier otro medio conocido por el hombre (la '+
  '"Información"). LAS PARTES mantendrán vigentes sus obligaciones respecto a la confidencialidad de '+
  'esta cláusula durante la vigencia del contrato y hasta por tres (3) años después de la fecha de '+
  'liquidación de este.</p>'+

  '<p><span class="cl">Décima tercera: Caso fortuito o fuerza mayor.</span> Cualquier incumplimiento '+
  'o demora en el cumplimiento de las obligaciones pactadas en el Contrato no generará '+
  'responsabilidades para LAS PARTES si dicho incumplimiento o demora resulta de caso fortuito o '+
  'fuerza mayor. Se entenderán como tales todas las eventualidades establecidas en el Código Civil '+
  'fuera del control razonable de LAS PARTES, que no puedan ser previstas o que, si son previsibles, '+
  'sean inevitables, que ocurran durante la vigencia de este Contrato y que impidan el cumplimiento '+
  'de las obligaciones. Las anteriores incluyen, pero no se limitan a, desastres naturales como '+
  'terremoto, tsunami, tormentas, deslizamientos de tierra o derrumbes, erupciones volcánicas o '+
  'inundaciones; conflictos armados; huelgas, disturbios o asonadas; epidemias o pandemias que '+
  'afecten gravemente a la población; y/o fallas a las infraestructuras físicas o tecnológicas que '+
  'sean irresistibles o irreparables en un periodo mayor a los 30 días.</p>'+

  '<p><span class="cl">Décima cuarta: Domicilio contractual y notificaciones.</span> Para todos los '+
  'efectos derivados del presente Contrato, se establece como domicilio contractual la Ciudad de '+
  'Panamá, Panamá. Para que cualquier aviso o notificación entre LAS PARTES tenga validez, se '+

  'una nueva dirección con una antelación no inferior a 10 días hábiles o comunes a la fecha del '+
  'cambio de dirección. Toda notificación se tendrá como realizada y será efectiva una vez que quien '+
  'envía el correo electrónico haya recibido confirmación de recibo por parte del destinatario. '+
  'Salvo que se disponga expresamente lo contrario, las notificaciones se enviarán a:</p><ul>'+
  '<li>EL CONTRATANTE, al correo electrónico '+D(p.correo)+' · Teléfono '+D(p.telefono)+'</li>'+
  '<li>EL CONTRATISTA, al correo electrónico correo@ejemplo.com / correo@ejemplo.com</li></ul>'+

  '<p><span class="cl">Décima quinta: Modificaciones.</span> El presente contrato no podrá ser '+
  'enmendado o modificado en forma alguna, a menos que dichas enmiendas o modificaciones se den con '+

  'LAS PARTES, cumpliendo las mismas formalidades establecidas para el Contrato.</p>'+

  '<p style="margin-top:18px">Para constancia de LAS PARTES, se firma el presente contrato en la '+
  'Ciudad de Panamá el '+(firma?D(larga(firma)):'_______________________')+'.</p>'+

      'ECOTERMO DE PANAMA S.A.</div></div>'+
