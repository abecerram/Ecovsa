<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--fondo);color:var(--tinta);padding-bottom:40px}

.barra{position:sticky;top:0;z-index:5;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:11px 14px;background:linear-gradient(135deg,var(--azul-osc),var(--azul));
  box-shadow:0 2px 12px rgba(11,60,110,.3)}
.barra .ti{color:#fff;font-size:13px;font-weight:800;letter-spacing:.4px;margin-right:auto}
.barra button{border:none;font-family:inherit;font-size:13.5px;font-weight:700;
  padding:10px 15px;border-radius:10px;cursor:pointer;background:var(--ambar);color:#4A3300}
.barra button:active{transform:translateY(1px)}

.aviso{max-width:760px;margin:26px auto;background:#fff;border:1px solid var(--borde);
  border-radius:14px;padding:28px;font-size:14px;color:var(--gris);line-height:1.65;
  box-shadow:0 3px 16px rgba(11,60,110,.10)}
.aviso h2{font-size:18px;color:var(--rojo);margin-bottom:6px}
.aviso .sub{font-size:13px;color:var(--gris);margin-bottom:18px}
.faltan{background:#FFF3D1;border-left:4px solid var(--ambar);border-radius:10px;
  padding:14px 16px;margin-top:14px;text-align:left}
.faltan h4{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:#8a6d00;margin:10px 0 5px}
.faltan h4:first-child{margin-top:0}
.faltan li{margin-left:18px;font-size:13px;color:#5c4a00;line-height:1.7}

/* ── el documento ── */
.hoja{max-width:820px;margin:18px auto 0;background:#fff;color:#111;padding:38px 44px;
  border:1px solid var(--borde);border-radius:8px;font-size:11.5px;line-height:1.68;
  box-shadow:0 3px 16px rgba(11,60,110,.10);text-align:justify}
.enc{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--azul-osc);
  padding-bottom:12px;margin-bottom:20px}
.enc img{height:56px;width:auto}
.enc .emp{font-size:16px;font-weight:900;color:var(--verde);letter-spacing:.4px;line-height:1.1}
.enc .lem{font-size:9.5px;color:var(--azul);letter-spacing:1.3px;text-transform:uppercase}
.enc .der{margin-left:auto;text-align:right;font-size:9.5px;color:#666;line-height:1.6}

h1{font-size:15px;font-weight:900;text-align:center;line-height:1.35;
  text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.numc{text-align:center;font-size:14px;font-weight:800;color:var(--azul-osc);
  letter-spacing:1px;margin-bottom:20px}
p{margin-bottom:10px}
.cl{font-weight:800;text-transform:uppercase;letter-spacing:.3px}
h3{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;
  margin:18px 0 8px;color:var(--azul-osc)}
ol,ul{margin:0 0 10px 22px}
li{margin-bottom:6px}
.dato{background:#EEF5E4;padding:1px 5px;border-radius:3px;font-weight:700}
/* api 3.13: dato de la empresa que falta en Configuración (se nota en pantalla y en papel) */
.falta{background:#FDECEC;color:#A8262B;padding:1px 5px;border-radius:3px;font-weight:700}
#notaBarra{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%;order:9}
#notaBarra .nb{font-size:12.5px;font-weight:600;border-radius:8px;padding:6px 10px;line-height:1.4}
#notaBarra .nb.ok{background:#EAF6E4;color:#1f6b2e}
#notaBarra .nb.am{background:#FFF3D1;color:#6b5000}
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:52px}
.firma{text-align:center;font-size:11px;line-height:1.7}
.firma .lin{border-top:1px solid #111;padding-top:7px}
.firma b{display:block;font-weight:800}
.pie{margin-top:26px;padding-top:10px;border-top:1px solid #ddd;font-size:9px;
  color:#777;text-align:center;line-height:1.6}

@media print{
  body{background:#fff;padding:0}
  .barra{display:none}
  .hoja{max-width:none;margin:0;border:none;border-radius:0;padding:0;box-shadow:none;font-size:10.5pt}
  .firmas{page-break-inside:avoid} h3{page-break-after:avoid}
}
@page{margin:18mm}

<script>
/* api 3.5.1: mandar el enlace de este documento por WhatsApp */
function compartirDoc(){ var t = document.title + '\n' + location.href; window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank'); }
var LOGO="logo-ecovsa.png";
var COD="";

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function n2(v){return Number(v||0).toFixed(2);}

/* Los datos de la empresa vienen del servidor (constante EMPRESA en
   Codigo.gs), no escritos aquí. Cambiar la dirección es cambiar una línea
   allá, no acordarse de cuatro pantallas. El respaldo es por si una versión
   vieja del servidor todavía no los manda. */
var DATOS_EMP=null;
var EMP_RESP={comercial:"ECOVSA",razonSocial:"ECOTERMO DE PANAMA S.A.",
  ruc:"1074020-1-552789",dv:"50",lema:"Ecología · Vida · Salud",
  /* A propósito vacía: si algún día el servidor no manda los datos, es mejor
     que el documento salga sin dirección — y se note — a que salga con una
     dirección vieja en un contrato o un certificado. */
  direccion:"",
  ciudad:"Panamá",telefono:"310-2268",whatsapp:"6264-1647",
  correo:"info@ecovsa.com",instagram:"@ecovsapanama",
  resolucion:"Resolución Sanitaria N° 1519 del 10 de diciembre de 2025",
  resolucionCorta:"Resolución Sanitaria N° 1519",
  decreto:"Decreto Ejecutivo 111 de 1999",formulario:""};
/* 3.13 · El contrato es un documento legal: el cliente va con su RAZÓN SOCIAL.
   El nombre comercial solo si la razón social está vacía (prospectos viejos). */
function razonCliente(p){ return String((p&&(p["razon social"]||p.razonSocial))||"").trim() || String((p&&p.empresa)||"").trim(); }
function emp(){ return DATOS_EMP || EMP_RESP; }
/* La dirección ya nombra la ciudad; anteponerla daba "Panamá, Distrito Panamá". */
function conCiudad(dir,ciudad){
  var d=String(dir||"").trim(), c=String(ciudad||"").trim();
  if(!d) return c;
  if(!c || d.toUpperCase().indexOf(c.toUpperCase())>=0) return d;
  return c+", "+d;
}
function pieEmpresa(){
  var e=emp();
  return conCiudad(e.direccion, e.ciudad)+
         " · Tel. "+e.telefono+" · "+e.correo;
}

function D(v){return '<span class="dato">'+esc(v||"")+'</span>';}

var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
           "septiembre","octubre","noviembre","diciembre"];
function larga(iso){
  if(!iso) return "";
  var d=new Date(iso+"T12:00:00");
  if(isNaN(d.getTime())) return iso;
  return d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear();
}

/* el contrato exige el valor en letras */
var UNI=["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez",
 "once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve",
 "veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis",
 "veintisiete","veintiocho","veintinueve"];
var DEC=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
var CEN=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos",
 "setecientos","ochocientos","novecientos"];
function menor100(n){
  if(n<30) return UNI[n];
  var d=Math.floor(n/10), u=n%10;
  return DEC[d]+(u?" y "+UNI[u]:"");
}
function menor1000(n){
  if(n===100) return "cien";
  var c=Math.floor(n/100), r=n%100;
  return (c?CEN[c]:"")+(c&&r?" ":"")+(r?menor100(r):"");
}
function enLetras(v){
  var n=Math.floor(Number(v)||0);
  var cent=Math.round(((Number(v)||0)-n)*100);
  var txt;
  if(n===0) txt="cero";
  else if(n<1000) txt=menor1000(n);
  else {
    var mil=Math.floor(n/1000), r=n%1000;
    txt=(mil===1?"mil":menor1000(mil)+" mil")+(r?" "+menor1000(r):"");
  }
  txt=txt.charAt(0).toUpperCase()+txt.slice(1);
  return txt+" balboas con "+("0"+cent).slice(-2)+"/100";
}

function aviso(t){ $("app").style.display="none"; var a=$("aviso"); a.style.display="block"; a.innerHTML=t; }

function arrancar(){
  if(window.google && google.script && google.script.url){
    google.script.url.getLocation(function(loc){
      var p=(loc&&loc.parameter)||{}; seguir(p.cod||"");
    });
  } else {
    var m=(location.search||"").match(/[?&]cod=([^&]+)/);
    seguir(m?decodeURIComponent(m[1]):"");
  }
}

function seguir(cod){
  COD=cod;
  if(!COD){ aviso("Falta el código de propuesta en el enlace."); return; }
  var pin="";
  try{ pin=JSON.parse(localStorage.getItem("ecovsa_pin")||'""'); }catch(e){ pin=""; }
  if(!pin){ aviso("Entra primero en la página de mercadeo."); return; }

  google.script.run
    .withSuccessHandler(function(r){
      if(r && r.incompleto){ pintarFaltantes(r); return; }
      if(!r||!r.ok){ aviso(esc((r&&r.error)||"No se pudo cargar.")); return; }
      if(r.empresa) DATOS_EMP=r.empresa;
      pintar(r.prospecto, r);
      $("aviso").style.display="none"; $("app").style.display="block";
    })
    .withFailureHandler(function(){ aviso("Sin conexión."); })
    .api_contrato(pin, COD);
}

function pintarFaltantes(r){
  var bloques="";
  for(var g in r.faltan){
    bloques+="<h4>"+esc(g)+"</h4><ul>"+
      r.faltan[g].map(function(f){return "<li>"+esc(f)+"</li>";}).join("")+"</ul>";
  }
  /* api 3.13: también pueden faltar los datos de la empresa, que se completan en Configuración */
  var grupos=Object.keys(r.faltan||{}), cfg=grupos.filter(function(g){ return /configuraci/i.test(g); }).length, ficha=grupos.length-cfg;
  aviso('<h2>El contrato no se puede generar todavía</h2>'+
    '<div class="sub">Faltan datos obligatorios'+(ficha?' en la ficha de <b>'+esc(r.empresa||"")+'</b>':'')+
    '. Un contrato con campos vacíos no tiene validez legal, así que el sistema no lo emite.</div>'+
    '<div class="faltan">'+bloques+'</div>'+
    '<p style="margin-top:16px;font-size:13px">'+(ficha?'Completa esos campos en la ficha del prospecto'+(cfg?'; ':' '):'')+
    (cfg?'los datos de la empresa los completa el administrador en Configuración › Datos de la empresa; ':'')+
    'y vuelve a intentarlo.</p>');
}

/* ═══ api 3.13 · textos del contrato y datos de la empresa ═══
   · Las consideraciones y cláusulas las edita Mercadeo en Plantillas y ajustes ›
     Propuesta y contrato. El servidor las manda ya llenas en prospecto.textosContrato
     = {consideraciones:[…], clausulas:[{titulo, texto}]}, tal como quedaron al generar
     el contrato. Si no vienen (servidor anterior), se usa el texto de siempre (abajo).
   · El representante legal, el folio, la cuenta del banco y los correos de notificación
     ya no están escritos aquí: vienen de Configuración › Datos de la empresa. Si faltan,
     el contrato lo dice en su lugar y no se inventa nada.
   · Formato (el del servidor): cada renglón es un párrafo; «- » al empezar el renglón es un
     punto de lista (sale numerado); **negrita**; [[dato]] = dato llenado, resaltado. */
var FALTA="[falta en Configuración › Datos de la empresa]";
var FALTAN=[];
function falta(que){ if(FALTAN.indexOf(que)<0) FALTAN.push(que); return '<span class="falta">'+esc(FALTA)+'</span>'; }
function repLegal(){
  var r=emp().representanteLegal;
  if(typeof r==="string") r={nombre:r};
  return r||{};
}
function textoBanco(){
  var b=emp().datosBancarios;
  if(b && typeof b==="object") b=(b.banco&&b.cuenta)?String(b.banco).toUpperCase()+", nombre de cuenta "+(b.titular||"")+", No. de cuenta "+b.cuenta+", tipo de cuenta "+(b.tipo||""):"";
  return String(b||"").trim();
}
function correosNotif(){
  var c=emp().correosNotificacion;
  if(typeof c==="string") c=c.split(/[,;\/]/);
  return (c||[]).map(function(x){return String(x).trim();}).filter(Boolean);
}
/* html de un texto con marcas */
function enLinea(t){
  return esc(t).replace(/\[\[([\s\S]*?)\]\]/g,function(x,v){ return '<span class="dato">'+v+'</span>'; })
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .split(esc(FALTA)).join('<span class="falta">'+esc(FALTA)+'</span>');
}
function bloques(t){
  var out=[], li=[];
  function cl(){ if(li.length){ out.push("<ol>"+li.map(function(x){return "<li>"+enLinea(x)+"</li>";}).join("")+"</ol>"); li=[]; } }
  String(t==null?"":t).split("\n").forEach(function(l){
    var u=/^\s*-\s+(.*)$/.exec(l);
    if(!l.trim()){ cl(); return; }
    if(u){ li.push(u[1]); return; }
    cl(); out.push("<p>"+enLinea(l)+"</p>");
  });
  cl();
  return out.join("");
}
function clausulaHtml(c){
  var tit='<span class="cl">'+esc(String(c.titulo||"").replace(/\.\s*$/,""))+'.</span> ';
  var h=bloques(c.texto);
  return /^<p>/.test(h) ? '<p>'+tit+h.slice(3) : '<p>'+tit+'</p>'+h;
}

/* El texto de siempre (el del 3.12), para cuando el servidor no manda textosContrato */
function textosRespaldo(p, V){
  function r(t){ return String(t).replace(/\{(\w+)\}/g,function(x,k){ return V[k]; }); }
  return {
    consideraciones:[
      'EL CONTRATANTE requiere la prestación del servicio de recolección y manejo de desechos '+
      'hospitalarios, servicio que cumple EL CONTRATISTA, a carácter propio.',
      'EL CONTRATISTA se dedica en forma habitual y profesional a prestar servicios no '+

      'Los servicios descritos en este documento se prestan por parte del CONTRATISTA en forma '+

    clausulas:[
      {titulo:'Primera: Objeto del contrato', texto:r('EL CONTRATISTA se compromete a la '+
      'prestación del servicio de recolección, separación, transporte, tratamiento, trituración y '+

      'exclusivamente por EL CONTRATANTE en las sucursales, puntos de acopio y frecuencias acordadas, '+
      'de conformidad con la propuesta comercial No. {codigoPropuesta} fechada el '+

      'las estipulaciones contractuales.')},
      {titulo:'Segunda: Frecuencia y horario de recolección', texto:r('EL CONTRATISTA se '+
      'compromete a prestar el servicio objeto de este contrato de acuerdo con las siguientes '+
      'sucursales, puntos de acopio, frecuencias y horarios: {direccion} · Horario: {horario}'+
      ' · Frecuencia: {frecuencia}.\n\n'+
      'La frecuencia y el horario de recolección podrán ser modificados, previo acuerdo entre LAS '+
      'PARTES y considerando siempre tanto las necesidades operativas de EL CONTRATISTA como las de '+
      'EL CONTRATANTE, a fin de garantizar la prestación eficiente y adecuada del servicio.')},
      {titulo:'Tercera: Obligaciones de EL CONTRATISTA', texto:'Además de las obligaciones '+

      '- Prestar los servicios contratados de manera profesional, oportuna y eficiente, cumpliendo '+

      '- Garantizar que la prestación de los Servicios se brinde utilizando los equipos, suministros '+
      'y materiales adecuados, dando cumplimiento a los procedimientos, términos y condiciones '+
      'previstos para el mismo.\n'+
      '- Garantizar la validez y vigencia de los permisos, licencias, títulos y certificaciones, '+
      'como también que se cuenta con los conocimientos técnicos y experiencia necesarios para la '+
      'prestación del Servicio.\n'+
      '- Garantizar la trazabilidad de los residuos peligrosos, desde su recolección hasta su '+
      'disposición final, mediante registros firmados, bitácoras y certificaciones.\n'+
      '- Utilizar personal capacitado en el manejo de residuos infecciosos y peligrosos, dotado con '+
      'el equipo de protección personal (EPP) requerido.\n'+
      '- Informar de manera inmediata cualquier situación que pueda retrasar, interrumpir o afectar '+
      'la calidad de los Servicios y contar con un plan de contingencia que garantice la prestación de '+
      'estos ante eventualidades que se presenten.\n'+
      '- Presentar dentro de los 5 primeros días del mes, al correo del CONTRATANTE, la factura '+
      'correspondiente a los servicios prestados en el mes inmediatamente anterior.\n'+
      '- Informar de manera inmediata a EL CONTRATANTE cualquier modificación en los datos de '+
      'contacto o facturación.\n'+
      '- Expedir certificación referente al manejo dado a los residuos o desechos.\n'+
      '- Las demás obligaciones que de la naturaleza del presente Contrato se deriven o impongan '+
      'las normas legales.'},
      {titulo:'Cuarta: Obligaciones del contratante', texto:'Además de las obligaciones '+
      'estipuladas en los documentos que hacen parte del contrato, se establecen como obligaciones '+
      'especiales las siguientes:\n'+
      '- Cumplir con las actividades establecidas en las propuestas comerciales (Anexo 1).\n'+
      '- Pagar oportunamente las facturas presentadas por EL CONTRATISTA en los términos y plazos '+
      'convenidos en el presente contrato.\n'+
      '- Entregar únicamente los residuos que han sido previamente declarados y aprobados, así como '+
      'atender las instrucciones y requerimientos impartidos por EL CONTRATISTA y las autoridades para '+
      'la prestación del servicio.\n'+
      '- Garantizar que el empacado, embalado y etiquetado de sus residuos o desechos se realice '+
      'conforme a los requisitos legales y los establecidos por EL CONTRATISTA, respetando de igual '+
      'forma las normativas ambientales, de salud y seguridad establecidas.\n'+
      '- Cumplir con la normativa establecida sobre la materia.\n'+
      '- Atender de forma oportuna y eficiente todas las consultas y solicitudes que se puedan '+
      'presentar en ocasión al Servicio.\n'+
      '- Las demás obligaciones que de la naturaleza del presente Contrato se deriven o impongan '+
      'las normas legales.'},
      {titulo:'Quinta: Manejo y disposición de los desechos hospitalarios peligrosos', texto:
      'Respecto de las principales obligaciones asumidas por cada una de LAS PARTES, se comprometen a:\n'+
      '- EL CONTRATANTE, a garantizar que el empacado, embalado y etiquetado de sus residuos o '+
      'desechos se realice conforme a los requisitos legales vigentes y los requerimientos de servicio '+
      'establecidos por EL CONTRATISTA.\n'+
      '- EL CONTRATISTA se compromete a retirar los desechos hospitalarios peligrosos en las '+
      'instalaciones del CONTRATANTE para su transporte, tratamiento, trituración y disposición en '+
      'autoclave (equipo de última tecnología encargado de vaporizar, esterilizar y pulverizar el '+
      'material entregado), respetando las normativas ambientales, de salud y seguridad establecidas '+
      'para tal fin.\n'+
      '- LAS PARTES se comprometen a cumplir con las normas ambientales, sanitarias, de seguridad y '+
      'salud ocupacional, así como con los acuerdos municipales vigentes y aplicables para la '+
      'prestación del servicio objeto del presente contrato.\n\n'+
      'En consecuencia, serán los únicos responsables ante las autoridades competentes del '+
      'cumplimiento o incumplimiento de sus obligaciones.'},
      {titulo:'Sexta: Valor', texto:r('El valor del presente contrato corresponde a la suma '+
      'total de {valorEnLetras} ({valorTotal}) incluido el I.T.B.M.S., del servicio de '+
      'recolección de desechos hospitalarios peligrosos según propuesta presentada y aprobada.\n'+
      '- El kilogramo adicional a partir de {kgDesde} kg tendrá un costo de ({tarifaKg}) más I.T.B.M.S.\n'+
      (p["tarifa visita adic"] ? '- Las visitas adicionales a la frecuencia contratada tendrán un '+

      '- En caso de algún cambio en la programación, debe ser informado con un máximo de 48 horas '+

      {titulo:'Parágrafo primero: Revisión de la facturación', texto:'La tarifa fija '+
      ' del servicio  aquí acordado se incrementarán en igual proporción si se presenta un '+

      'De igual manera, cada vez que se proceda a prorrogar el siguiente contrato, LAS PARTES se '+
      'comprometen a revisar las tarifas señaladas en esta cláusula, para lo cual EL CONTRATISTA '+
      'presentará a EL CONTRATANTE, con treinta (30) días calendarios de anticipación a la terminación '+
      'del contrato, el porcentaje del mismo, el cual guardará relación con la inflación certificada por '+

      {titulo:'Parágrafo segundo: Pago del servicio', texto:r('EL CONTRATANTE se obliga a pagar '+

      'los primeros 5 días calendarios inmediatamente siguientes a su presentación al correo electrónico '+
      '{correoCliente}. La factura expedida por EL CONTRATISTA prestará mérito ejecutivo ante la '+
      'jurisdicción ordinaria, de acuerdo a las Leyes de la República de Panamá. De no recibir el pago '+
      'dentro del periodo correspondiente, se procederá con la suspensión del servicio y/o un recargo '+
      'del 10% de su facturación.')},
      {titulo:'Séptima: Vigencia del contrato', texto:r('LAS PARTES acuerdan que este contrato '+
      'tiene y tendrá una vigencia de {plazo} meses calendarios, prorrogables por el mismo tiempo. '+
      'En caso de que EL CONTRATANTE decida no continuar con el servicio, deberá notificarlo con treinta '+
      '(30) días de anticipación a la fecha de vencimiento del contrato; en caso de no notificar, se '+
      'entenderá prorrogado por el mismo término inicial. En el caso de que EL CONTRATANTE decida '+
      'culminar la relación comercial antes del plazo pactado, EL CONTRATISTA impondrá una penalización '+
      'de un mes de facturación por los gastos incurridos.')},
      {titulo:'Octava: Responsabilidad por daños o pérdidas del equipo', texto:'Convienen LAS '+
      'PARTES que cualquier daño o pérdida, una vez entregado e instalado el equipo y sus complementos, '+
      'a consecuencia de la inadecuada operación y/o la poca vigilancia hacia ellos o el personal, serán '+
      'responsabilidad de EL CONTRATANTE, por lo que se verá obligado a cubrir los gastos de '+
      'reparaciones y/o sustitución de los mismos.'},
      {titulo:'Novena: Total entendimiento', texto:'El hecho de que una de LAS PARTES permita '+
      'una o varias veces que la otra incumpla sus obligaciones, o las cumpla imperfectamente, o en '+
      'forma distinta de la pactada, o no insista en el cumplimiento de tales obligaciones, o no ejerza '+
      'oportunamente los derechos contractuales o legales que le correspondan, no reputará ni equivaldrá '+
      'a ningún tipo de modificación del presente contrato, ni obstará en ningún caso para que dicha '+
      'parte en el futuro reclame el fiel cumplimiento de las obligaciones que corren a cargo de la '+
      'otra, o ejerza los derechos contractuales, legales y/o convencionales de los cuales sea titular. '+
      'Las leyendas que aparecen como títulos o encabezados de los términos del presente contrato se han '+
      'insertado para conveniencia y fácil referencia del lector, de forma tal que las mismas no tienen '+
      'relevancia para efectos de la interpretación del contenido de los referidos términos.'},
      {titulo:'Décima: Causales de terminación del contrato', texto:'El presente Contrato '+
      'terminará por cualquiera de las siguientes causas:\n'+
      '- Por la terminación de la duración del Contrato.\n'+
      '- Por mutuo acuerdo entre LAS PARTES.\n'+
      '- Por las demás contenidas en la ley.\n'+
      '- Por incapacidad financiera, la cual se presume si se declara cualquiera de LAS PARTES en '+
      'quiebra o se le abre concurso de acreedores, o es intervenida por autoridad competente.\n'+
      '- Por fuerza mayor o caso fortuito como está descrito en la ley, siempre y cuando esto '+
      'imposibilite la ejecución del Contrato, habiendo pasado 30 días calendario a partir de la fecha '+
      'de los hechos que den lugar a la fuerza mayor o el caso fortuito.'},
      {titulo:'Décima primera: Legislación aplicable y resolución de conflictos', texto:'Este '+
      'Contrato y las relaciones entre LAS PARTES derivadas de la materia que constituye su objeto están '+
      'sujetos y regulados por las leyes vigentes en la República de Panamá. En caso de surgir '+
      'controversia, discrepancia o reclamación entre LAS PARTES relacionada con la interpretación, '+
      'ejecución o cumplimiento del presente documento, LAS PARTES se comprometen a resolver dichas '+
      'controversias de la siguiente manera:\n'+
      '- **Negociación amistosa:** en primer lugar, LAS PARTES se comprometen a intentar resolver '+
      'sus controversias mediante una negociación amistosa, en un plazo no mayor a 30 días hábiles '+
      'siguientes a la fecha en que se comunique entre ellas el conflicto. LAS PARTES acuerdan reunirse '+
      'de buena fe para dar una solución al motivo de controversia.\n'+
      '- **Conciliación:** si transcurrido el plazo anterior LAS PARTES no logran un acuerdo, se '+
      'someterán a un proceso de conciliación, el cual será llevado a cabo por un mediador designado de '+
      'común acuerdo o, en su defecto, por el Centro de Conciliación y Arbitraje de Panamá. El proceso '+
      'de conciliación deberá iniciarse dentro de los 15 días hábiles siguientes a la notificación de '+
      'fracaso de las negociaciones amistosas y deberá concluir en un plazo máximo de 30 días hábiles '+
      'siguientes a su inicio.\n\n'+
      'De no llegar LAS PARTES a un acuerdo, podrán interponer sus acciones ante los Tribunales de '+
      'Justicia competentes.'},
      {titulo:'Décima segunda: Confidencialidad', texto:'LAS PARTES se comprometen a guardar '+
      'completa reserva y estricta confidencialidad sobre toda la información intercambiada dentro de la '+
      'etapa precontractual, contractual y postcontractual, incluyendo pero sin limitarse al presente '+
      'Contrato, la Propuesta, los documentos Anexos y cualquier otra información compartida o revelada '+
      'por medio escrito, electrónico, verbal o por cualquier otro medio conocido por el hombre (la '+
      '"Información"). LAS PARTES mantendrán vigentes sus obligaciones respecto a la confidencialidad de '+
      'esta cláusula durante la vigencia del contrato y hasta por tres (3) años después de la fecha de '+
      'liquidación de este.'},
      {titulo:'Décima tercera: Caso fortuito o fuerza mayor', texto:'Cualquier incumplimiento '+
      'o demora en el cumplimiento de las obligaciones pactadas en el Contrato no generará '+
      'responsabilidades para LAS PARTES si dicho incumplimiento o demora resulta de caso fortuito o '+
      'fuerza mayor. Se entenderán como tales todas las eventualidades establecidas en el Código Civil '+
      'fuera del control razonable de LAS PARTES, que no puedan ser previstas o que, si son previsibles, '+
      'sean inevitables, que ocurran durante la vigencia de este Contrato y que impidan el cumplimiento '+
      'de las obligaciones. Las anteriores incluyen, pero no se limitan a, desastres naturales como '+
      'terremoto, tsunami, tormentas, deslizamientos de tierra o derrumbes, erupciones volcánicas o '+
      'inundaciones; conflictos armados; huelgas, disturbios o asonadas; epidemias o pandemias que '+
      'afecten gravemente a la población; y/o fallas a las infraestructuras físicas o tecnológicas que '+
      'sean irresistibles o irreparables en un periodo mayor a los 30 días.'},
      {titulo:'Décima cuarta: Domicilio contractual y notificaciones', texto:r('Para todos los '+
      'efectos derivados del presente Contrato, se establece como domicilio contractual la Ciudad de '+
      'Panamá, Panamá. Para que cualquier aviso o notificación entre LAS PARTES tenga validez, se '+
      'enviará a las siguientes direcciones, a menos que cualquiera de LAS PARTES suministre por escrito '+
      'una nueva dirección con una antelación no inferior a 10 días hábiles o comunes a la fecha del '+
      'cambio de dirección. Toda notificación se tendrá como realizada y será efectiva una vez que quien '+
      'envía el correo electrónico haya recibido confirmación de recibo por parte del destinatario. '+
      'Salvo que se disponga expresamente lo contrario, las notificaciones se enviarán a:\n'+
      '- EL CONTRATANTE, al correo electrónico {correoCliente} · Teléfono {telefonoCliente}\n'+
      '- EL CONTRATISTA, al correo electrónico {correosNotificacion}')},
      {titulo:'Décima quinta: Modificaciones', texto:'El presente contrato no podrá ser '+
      'enmendado o modificado en forma alguna, a menos que dichas enmiendas o modificaciones se den con '+
      'el consentimiento previo y expreso de LAS PARTES, manifestado por escrito. Cualquier modificación '+
      'que se quiera hacer frente a las condiciones del Contrato deberá ser acordada y legalizada por '+
      'LAS PARTES, cumpliendo las mismas formalidades establecidas para el Contrato.'}
    ]};
}

function pintar(p, r){
  var costo=Number(p["costo visita"])||0;
  var itbms=Number(p.itbms); if(!isFinite(itbms)||itbms<=0) itbms=0.07;
  var total=Math.round(costo*(1+itbms)*100)/100;
  var plazo=p["plazo contrato"]||12;
  var firma=p["fecha contrato"]||"";
  FALTAN=[];

  /* ECOTERMO: su representante legal, desde Configuración */
  var RL=repLegal(), nomRL=String(RL.nombre||"").trim();
  var g=String(RL.genero||"").toUpperCase().charAt(0);
  var repTxt = nomRL
    ? (g==="F"?'la señora ':g==="M"?'el señor ':'')+'<b>'+esc(nomRL.toUpperCase())+'</b>, '+(g==="F"?'mujer, ':g==="M"?'varón, ':'')+'mayor de edad '+
      'y de nacionalidad '+(RL.nacionalidad?esc(RL.nacionalidad):falta("la nacionalidad del representante legal"))+
      ' con documento de Identidad No. '+(RL.documento?esc(RL.documento):falta("el documento del representante legal"))
    : falta("el representante legal");
  var folio=String(emp().folio||"").trim();
  var banco=textoBanco(), correos=correosNotif();

  /* datos que se llenan solos: [[ ]] los resalta como antes */
  function M(v){ return "[["+String(v==null?"":v)+"]]"; }
  var V={
    codigoPropuesta:M(p.codigoPropuesta), fechaPropuesta:M(larga(p["fecha propuesta"])), direccion:M(p.direccion),
    horario:M("8:00 a.m. a 5:00 p.m."), frecuencia:M(p.frecuencia), valorEnLetras:M(enLetras(total)), valorTotal:"B/. "+M(n2(total)),
    kgDesde:M(Number(p["kg plan"])>0?Number(p["kg plan"])+1:""), tarifaKg:"B/. "+M(n2(p["tarifa kg adic"])), tarifaVisita:"B/. "+M(n2(p["tarifa visita adic"])),
    correoCliente:M(p.correo), telefonoCliente:M(p.telefono), plazo:M(plazo), resolucion:emp().resolucion||"",
    correoEmpresa:emp().correo||FALTA,
    datosBancarios:banco||(falta("los datos bancarios"),FALTA),
    correosNotificacion:correos.length?correos.join(" / "):(falta("los correos de notificación"),FALTA)
  };
  var TC=(p.textosContrato&&Array.isArray(p.textosContrato.clausulas)&&p.textosContrato.clausulas.length)?p.textosContrato:textosRespaldo(p,V);
  if(p.textosContrato){
    /* el texto ya viene lleno del servidor: si ahí dice que falta algo, también se avisa arriba */
    var todo=JSON.stringify(p.textosContrato);
    if(todo.indexOf(FALTA)>=0){ if(!banco) falta("los datos bancarios"); if(!correos.length) falta("los correos de notificación"); if(!nomRL) falta("el representante legal"); }
  }
  var cons=(Array.isArray(TC.consideraciones)?TC.consideraciones:String(TC.consideraciones||"").split("\n")).map(function(x){ return String(x).replace(/^\s*-\s+/,"").trim(); }).filter(Boolean);

  var html=
  DOCE.membrete({ empresa: emp(), modo: 'legal' })+

  '<h1>Contrato de servicio de recolección de desechos hospitalarios peligrosos</h1>'+
  '<div class="numc">N.° '+(p["n contrato"]?esc(p["n contrato"]):'<span class="falta">[sin número]</span>')+'</div>'+

  /* api 3.13.1 · «Las partes» se edita en Plantillas y ajustes: el servidor la manda ya llena */
  (TC.partes ? bloques(TC.partes) :
  '<p>Entre los suscritos a saber, '+D(p["representante legal"])+', '+
  D(p["genero representante"])+', mayor de edad, nacionalidad '+
  D(p["nacionalidad representante"])+', identificado con Cédula de Identidad No. '+
  D(p["cedula representante"])+' en su calidad de representante legal '+ 'de '+D(razonCliente(p))+
  ', sociedad panameña, inscrita en el folio N.° '+D(p["folio registro"])+
  ' de la Sección Mercantil del Registro Público de Panamá, con RUC '+D(p.ruc)+
  ' DV '+D(p.dv)+', quien de ahora en adelante se denominará <b>EL CONTRATANTE</b>, '+
  'por una parte y por la otra, '+repTxt+', en su calidad de '+
  'Representante Legal de la sociedad <b>'+esc(emp().razonSocial||"ECOTERMO DE PANAMA S.A.")+'</b>, que consta inscrita en '+
  'Registro Público al folio Mercantil N.° '+(folio?esc(folio):falta("el folio mercantil"))+', con RUC '+esc(emp().ruc)+' DV '+esc(emp().dv)+', quien en '+
  'adelante se denominará <b>EL CONTRATISTA</b>, y cuando actúen en conjunto se denominarán '+
  '<b>LAS PARTES</b>, han convenido en celebrar el presente contrato de prestación de servicios, '+
  'que se rige bajo las siguientes consideraciones y cláusulas:</p>')+

  '<h3>Consideraciones</h3><ol>'+cons.map(function(t){ return '<li>'+enLinea(t)+'</li>'; }).join('')+'</ol>'+

  '<h3>Cláusulas</h3>'+
  TC.clausulas.map(clausulaHtml).join('')+

  '<p style="margin-top:18px">Para constancia de LAS PARTES, se firma el presente contrato en la '+
  'Ciudad de Panamá el '+(firma?D(larga(firma)):'_______________________')+'.</p>'+

  '<div class="firmas">'+
    '<div class="firma"><div class="lin"><b>'+(nomRL?esc(nomRL.toUpperCase()):falta("el representante legal"))+'</b>'+esc(RL.documento||"")+'<br>'+
      esc(emp().razonSocial||"ECOTERMO DE PANAMA S.A.")+'</div></div>'+
    '<div class="firma"><div class="lin"><b>'+esc(p["representante legal"])+'</b>'+
      esc(p["cedula representante"])+'<br>'+esc(razonCliente(p))+'</div></div>'+
  '</div>'+

  '<div class="pie">'+esc(pieEmpresa())+
    (emp().formulario?'<br>'+esc(emp().formulario):'')+'<br>'+
  'Documento generado por el sistema Rutas ECOVSA a partir de la propuesta '+
  esc(p.codigoPropuesta)+'.</div>';

  $("hoja").innerHTML=html;
  document.title="Contrato "+(p["n contrato"]||"")+" · "+(razonCliente(p)||"");
  /* avisos para quien lo genera (no salen impresos) */
  var n=$("notaBarra"), t=[];
  if(r && r.nContratoNuevo && p["n contrato"]) t.push('<span class="nb ok">N.º asignado ahora: '+esc(p["n contrato"])+'</span>');
  if(FALTAN.length) t.push('<span class="nb am">Falta en Configuración › Datos de la empresa: '+esc(FALTAN.join(", "))+'. Complétalo antes de imprimir.</span>');
  if(n){ n.innerHTML=t.join(""); n.style.display=t.length?"":"none"; }
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",arrancar);
else arrancar();
</script>
