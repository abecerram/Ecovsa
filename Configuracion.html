<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración del sistema · ECOVSA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:'oculto',enSupabase:/^api_(?!optimizarRuta$)/};</script>
<script src="puente.js"></script>
<link rel="stylesheet" href="modulo-kit.css">
<script src="modulo-kit.js"></script>
<style>
/* ── Configuración del sistema · el apartado oculto del administrador ── */
.sysbar{background:#0b1f40}
.candado{display:inline-flex;align-items:center;gap:6px;background:rgba(245,179,1,.16);color:var(--amber);border:1px solid rgba(245,179,1,.4);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:800;letter-spacing:.4px}
.ulist .u{display:grid;grid-template-columns:40px minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1.3fr) 80px auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line2)}
.ulist .u:first-child{border-top:0}
.ulist .u.baja{opacity:.6}
.av2{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;flex:none}
.ulist .nm b{display:block;font-size:14px}
.ulist .nm span{font-size:12px;color:var(--muted)}
.rol{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:7px;padding:3px 8px}
.ulist .co{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ulist .co.falta{color:#8a6300}
.ulist .ac{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.estu{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;display:inline-block}
.estu.si{background:var(--ok-bg);color:#276b33}.estu.no{background:var(--line2);color:var(--muted)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* api 3.7: módulo principal y «también sigue» */
.prin{display:block;font-size:11.5px;color:var(--navy2);font-weight:700;margin-top:4px}
.sig{display:flex;gap:6px;flex-wrap:wrap}.sig button{border:1px solid var(--line);border-radius:18px;padding:6px 12px;font:700 12.5px Archivo,sans-serif;background:#fff;cursor:pointer;color:inherit}
.sig button.on{background:var(--info-bg);border-color:var(--navy2);color:var(--navy2)}
.pinbox{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px dashed #b9c6de;border-radius:12px;padding:12px 14px}
.pinbox .d{font-size:26px;font-weight:800;letter-spacing:8px;font-variant-numeric:tabular-nums}
.pinbox small{display:block;font-size:12px;color:var(--muted)}
.pinbox.nuevo{background:#fffaf0;border:2px solid var(--amber)}
.pinbox.nuevo .d{font-size:34px;color:var(--navy)}
.pasa{display:flex;flex-direction:column;gap:8px;font-size:13px}
.pasa div{display:flex;gap:8px;align-items:flex-start}
.pasa svg.i{width:16px;height:16px;margin-top:2px;color:var(--ok)}
/* matriz */
table.perm{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
.perm th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#7a879b;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.perm th:first-child{text-align:left}
.perm td{padding:6px;border-bottom:1px solid var(--line2);text-align:center}
.perm td:first-child{text-align:left;font-size:13px}
.pv{width:100%;min-width:82px;border:1px solid var(--line);border-radius:8px;padding:6px 4px;font:700 12px Archivo,sans-serif;cursor:pointer;background:#fff}
.pv.t{background:var(--ok-bg);border-color:#bfe3b3;color:#276b33}
.pv.v{background:var(--info-bg);border-color:#c9d8f5;color:#1d3f86}
.pv.n{background:#fff;color:var(--muted2)}
.pv.r{background:#f1ecf8;border-color:#dccdf0;color:#5b3a8a}
.pv:disabled{cursor:default;opacity:.8}
.pv.cambio{outline:2px solid var(--amber);outline-offset:1px}
/* reglas */
.reg .rr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 2px;border-top:1px solid var(--line2)}
.reg .rr:first-child{border-top:0}
.reg .rt b{display:block;font-size:14px}.reg .rt span{font-size:12.5px;color:var(--muted)}
.reg .sub-r{margin-left:18px;border-left:3px solid var(--line2);padding-left:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 12px;font:700 12.5px Archivo,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--navy2);color:#fff}
.monto{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;font-weight:700;color:var(--muted)}
.monto input{border:0;outline:0;width:110px;padding:8px 0;font:700 14px Archivo,sans-serif;color:var(--ink);text-align:right;background:none}
.cks{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:600}
.cks label{display:flex;gap:6px;align-items:center;cursor:pointer}
/* puerta: pedir el PIN */
.puerta{max-width:420px;margin:40px auto;text-align:center}
.puerta .card{padding:26px 22px}
.puerta h1{font-size:20px;margin:10px 0 4px}
.puerta .pins{display:flex;justify-content:center;gap:10px;margin:18px 0 8px}
.puerta .pins i{width:44px;height:52px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:800;background:#fff}
.puerta .pins i.on{border-color:var(--navy2)}
.puerta input.oculto{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.puerta .err{color:var(--bad);font-size:13px;min-height:20px;font-weight:600}
.teclado{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin-top:12px}
.teclado button{height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;font:800 19px Archivo,sans-serif;color:var(--navy2);cursor:pointer}
.teclado button:active{background:var(--hover)}
.demo{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:560px}
.demo .bar{background:var(--navy);height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff;font-weight:800}
.demo .bar .avd{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#26457f;display:grid;place-items:center;font-size:12px;box-shadow:0 0 0 3px var(--amber)}
.demo .menu2{position:absolute;right:12px;top:58px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,33,64,.18);width:250px;padding:6px}
.demo .menu2 div{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600}
.demo .menu2 div.hl{background:#fff8e6;color:#6b5400}
.demo .cuerpo2{height:230px}
.hisf{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:820px){
  .ulist .u{grid-template-columns:36px minmax(0,1fr) auto;row-gap:6px}
  .ulist .u .rolc{grid-column:2/-1}
  .ulist .u .co,.ulist .u .ul{grid-column:2/-1}
  .ulist .u .ac{grid-column:1/-1;justify-content:flex-start}
  .roles{grid-template-columns:1fr}
  .reg .rr{grid-template-columns:minmax(0,1fr)}
  .candado{display:none}
}
/* ── api 3.14 · Encender y apagar módulos ── */
.mods .m{display:grid;grid-template-columns:42px minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;padding:13px 4px;border-top:1px solid var(--line2)}.mods .m:first-child{border-top:0}
.mods .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--line2);color:var(--navy2)}
.mods .m.obra .ico{background:rgba(245,179,1,.18);color:#8a6300}
.mods .nm>b{display:block;font-size:14px}.mods .nm small{font-size:12px;color:var(--muted)}.mods .nm .dn{color:var(--ink)}
.mods .quien{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.est2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.est2 button{border:0;background:#fff;font:700 12px Archivo,sans-serif;padding:7px 11px;cursor:pointer;color:var(--muted)}
.est2 button.on{cursor:default}.est2 button.on.a{background:var(--ok-bg);color:#276b33}.est2 button.on.c{background:rgba(245,179,1,.22);color:#6b4d00}
.persona{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 3px;font-size:12px;font-weight:600;color:var(--ink)}
.persona i{width:22px;height:22px;border-radius:50%;background:var(--navy2);color:#fff;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center}.persona.fijo i{background:#0b1f40}
.prev3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:12px}
.lob{background:linear-gradient(160deg,#0f2a57,#0b1f40);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lob .t{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;color:#fff;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;gap:6px;min-height:84px}
.lob .t svg{width:22px;height:22px;stroke:#8fd46a}.lob .t.no{opacity:.55}.lob .t.no svg{stroke:#c9d6ea}
.lob .t .s{font-size:10.5px;font-weight:800;background:rgba(245,179,1,.2);color:#FFD98A;border-radius:6px;padding:2px 6px;align-self:flex-start}
.lob .avl{grid-column:1/-1;background:rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:8px 11px;font-size:12px}
.dentro{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);position:relative}
.dentro .bar{background:#0f2a57;color:#fff;padding:10px 14px;font-weight:800;font-size:13px;display:flex;gap:8px;align-items:center}
.dentro .cu{padding:14px 14px 60px;display:grid;gap:8px}.dentro .cu i{display:block;height:12px;border-radius:6px;background:var(--line2)}
.dentro .pst{position:absolute;left:10px;bottom:10px;right:10px;background:#fff6dc;border:1px solid #f1dd9c;color:#6b4d00;border-radius:999px;padding:6px 11px;font-size:12px}
.tapa{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:20px;background:#fff}
.tapa .ic2{width:56px;height:56px;border-radius:50%;background:#fff6dc;color:#8a6300;display:grid;place-items:center}.tapa b{font-size:15px}.tapa span{font-size:12.5px;color:var(--muted)}
@media(max-width:900px){.mods .m{grid-template-columns:40px minmax(0,1fr)}.mods .quien,.mods .est2{grid-column:2}.prev3{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<script src="cargador.js" data-modulo="Configuración"></script>
<div id="sysbar"></div>
<div class="mtabs" id="mtabs"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"></main></div>
<script>
/* ═══ Configuración del sistema (api 3.4) ═══ */
var PIN = '';              // el PIN que se escribió al entrar (no el guardado)
var MOSTRAR_PRUEBA = false, FILTRO = 'act', MAT = null, REG = null, SEGU = null, COB = null, FH = 'todo';
var COLOR_ROL = { admin: '#0f2a57', gerente: '#6C3A96', supervisor: '#0B5394', mercadeo: '#00792F', planta: '#8a4f9e', cobros: '#c98a00', operador: '#5b6880' };

function B() { return MK.base || {}; }
function nomRol(r) { return MK.ROLES[r] || r; }
function detRol(r) { var x = (B().roles || []).filter(function (y) { return y.id === r; })[0]; return x ? x.d : ''; }
function tagRol(r) { var c = COLOR_ROL[r] || '#5b6880'; return '<span class="rol" style="background:color-mix(in srgb,' + c + ' 12%,#fff);color:' + c + '">' + MK.esc(nomRol(r)) + '</span>'; }

/* ── la puerta: pedir el PIN otra vez ── */
function puerta(msg) {
  document.getElementById('main').innerHTML = '<div class="puerta"><div class="card">' +
    '<span class="candado">' + MK.ic('candado', 14) + 'SOLO ADMINISTRADOR</span>' +
    '<h1>Configuración del sistema</h1><p class="muted small">Escribe tu PIN otra vez para entrar. Aunque la sesión esté abierta, aquí se pide siempre.</p>' +
    '<div class="pins" id="pp"></div><input class="oculto" id="pin-in" inputmode="numeric" autocomplete="off" maxlength="6">' +
    '<div class="err" id="pin-err">' + MK.esc(msg || '') + '</div>' +
    '<div class="teclado">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '→'].map(function (k) { return '<button type="button" onclick="teclaPin(\'' + k + '\')">' + k + '</button>'; }).join('') + '</div>' +
    '<p class="small muted" style="margin-top:16px"><a href="index.html">← Volver a los módulos</a></p></div></div>';
  window._pin = ''; pintarPins();
  var inp = document.getElementById('pin-in');
  document.onkeydown = function (e) {
    if (PIN) return;
    if (/^\d$/.test(e.key)) teclaPin(e.key); else if (e.key === 'Backspace') teclaPin('⌫'); else if (e.key === 'Enter') teclaPin('→');
  };
}
var LARGO = 4;
function pintarPins() { var n = Math.max(LARGO, window._pin.length); var h = ''; for (var i = 0; i < n; i++) h += '<i class="' + (i < window._pin.length ? 'on' : '') + '">' + (i < window._pin.length ? '•' : '') + '</i>'; var e = document.getElementById('pp'); if (e) e.innerHTML = h; }
function teclaPin(k) {
  var e = document.getElementById('pin-err'); if (e) e.textContent = '';
  if (k === '⌫') window._pin = window._pin.slice(0, -1);
  else if (k === '→') { if (window._pin.length >= 4) probarPin(); return; }
  else if (window._pin.length < 6) window._pin += k;
  pintarPins();
  if (window._pin.length === LARGO) setTimeout(probarPin, 120);
}
function probarPin() {
  var p = window._pin; if (!p) return;
  MK.api('api_cfgBase', p).then(function (r) {
    if (!r || !r.ok) { window._pin = ''; pintarPins(); var e = document.getElementById('pin-err'); if (e) e.textContent = (r && r.error) || 'PIN no válido'; return; }
    PIN = p; document.onkeydown = null; usarBase(r); MK.ir(MK.seccion || 'usu', true);
  }, function () { var e = document.getElementById('pin-err'); if (e) e.textContent = 'Sin conexión.'; });
}
function usarBase(b) {
  MK.base = b; MK.usuario = b.usuario; MK.hoy = b.hoy;
  MAT = JSON.parse(JSON.stringify(b.matriz)); REG = JSON.parse(JSON.stringify(b.reglas)); SEGU = JSON.parse(JSON.stringify(b.seguridad)); COB = JSON.parse(JSON.stringify(b.cobros));
  MK.pintarBarra(); MK.pintarMenu();
  /* api 3.12: avisos de seguridad abiertos (equipos bloqueados, pedidos de PIN) */
  if (MK.contador) MK.contador('seg', b.segResumen && b.segResumen.abiertos, 'r');
  var sb = document.querySelector('#sysbar .mod'); if (sb && !document.querySelector('#sysbar .candado')) sb.insertAdjacentHTML('afterend', '<span class="candado">' + MK.ic('candado', 14) + 'SOLO ADMINISTRADOR</span>');
}
function recargar() {
  return MK.api('api_cfgBase', PIN).then(function (r) { if (r && r.ok) { usarBase(r); MK.repintar(); } else MK.aviso((r && r.error) || 'No se pudo recargar'); });
}

/* ═══ USUARIOS ═══ */
function vUsuarios() {
  var U = (B().usuarios || []);
  var reales = U.filter(function (u) { return !u.prueba; });
  var act = reales.filter(function (u) { return u.activo; });
  var admins = act.filter(function (u) { return u.rol === 'admin'; });
  var sinCo = act.filter(function (u) { return !u.correo; });
  var largo = SEGU.largoPin || 4;
  var viejos = act.filter(function (u) { return (u.largoPin || 4) < largo; });
  var lista = U.filter(function (u) { return (MOSTRAR_PRUEBA || !u.prueba) && (FILTRO === 'todos' || (FILTRO === 'act' ? u.activo : !u.activo)); });
  var h = MK.cabeza('Usuarios', 'Quién puede entrar al sistema y a qué. Nadie se borra: al darlo de baja, su PIN deja de servir y su nombre queda en lo que hizo.',
    '<button class="btn pri" onclick="altaUsuario()">' + MK.ic('alta', 16) + 'Dar de alta un usuario</button>');
  h += MK.kpis([
    { e: 'Activos', v: act.length, s: 'pueden entrar hoy' },
    { e: 'De baja', v: reales.length - act.length, s: reales.length - act.length ? 'su historia se conserva' : 'ninguno todavía' },
    { e: 'Administradores', v: admins.length, s: admins.length < 2 ? 'conviene tener uno de respaldo' : 'con respaldo', c: admins.length < 2 ? 'warn' : '' },
    { e: 'Sin correo', v: sinCo.length, s: sinCo.length ? sinCo.map(function (u) { return u.nombre; }).join(' · ') : 'todos tienen', c: sinCo.length ? 'warn' : '' }
  ]);
  if (viejos.length) h += '<div class="aviso am" style="margin-bottom:12px">' + viejos.length + ' usuario(s) siguen con PIN de 4 números. Les sirve hasta que les generes uno nuevo de ' + largo + '.</div>';
  h += '<div class="card"><div class="fila" style="justify-content:space-between;margin-bottom:6px">' +
    MK.chips([['act', 'Activos', act.length], ['baja', 'De baja', reales.length - act.length], ['todos', 'Todos']], FILTRO, 'filtroU') +
    '<label class="fila small" style="gap:8px;font-weight:600;color:var(--muted);cursor:pointer"><button class="sw' + (MOSTRAR_PRUEBA ? ' si' : '') + '" onclick="MOSTRAR_PRUEBA=!MOSTRAR_PRUEBA;MK.repintar()"></button>Mostrar usuarios de prueba</label></div>' +
    '<div class="ulist">' + (lista.length ? lista.map(function (u) {
      var c = COLOR_ROL[u.rol] || '#5b6880';
      var soloAdmin = u.rol === 'admin' && u.activo && admins.length < 2 && !u.prueba;
      var acc = u.activo
        ? '<button class="btn sm" onclick="editarUsuario(' + u.i + ')">' + MK.ic('lapiz', 15) + 'Editar</button><button class="btn sm" onclick="nuevoPin(' + u.i + ')">' + MK.ic('llave', 15) + 'PIN temporal</button>' +
          (u.yo || soloAdmin ? '' : '<button class="btn sm bad" onclick="bajaUsuario(' + u.i + ')">' + MK.ic('baja', 15) + 'Dar de baja</button>')
        : '<button class="btn sm" onclick="reactivar(' + u.i + ')">' + MK.ic('alta', 15) + 'Reactivar</button>';
      return '<div class="u ' + (u.activo ? '' : 'baja') + '"><span class="av2" style="background:' + c + '">' + MK.esc(MK.ini(u.nombre)) + '</span>' +
        '<div class="nm"><b>' + MK.esc(u.nombre) + (u.prueba ? ' <span class="tag t-gris">prueba</span>' : '') + (u.yo ? ' <span class="tag t-info">tú</span>' : '') + '</b><span>' +
        (u.activo ? MK.esc(detRol(u.rol)) : 'De baja desde ' + MK.esc(MK.dmy(u.fechaBaja) || '—') + (u.motivoBaja ? ' · ' + MK.esc(u.motivoBaja) : '')) +
        ((u.largoPin || 4) < largo && u.activo ? ' · <b style="color:#8a6300;display:inline">PIN de ' + (u.largoPin || 4) + '</b>' : '') +
        (u.activo && u.pinTemporal ? ' · <b style="color:' + (u.pinVence && u.pinVence < ahoraTxt() ? '#a8262b' : '#8a6300') + ';display:inline">' + (u.pinVence && u.pinVence < ahoraTxt() ? 'PIN temporal vencido' : 'PIN temporal · vence ' + MK.esc(fechaHora(u.pinVence))) + '</b>'
          : u.activo && u.pinCreadoEn ? ' · creó su PIN el ' + MK.esc(fechaHora(u.pinCreadoEn)) : '') + '</span></div>' +
        '<div class="rolc">' + tagRol(u.rol) + (u.activo && u.prefs && u.rol !== 'operador' ? '<span class="prin">principal: ' + MK.esc(nomPrin(u.prefs.principal)) + '</span>' : '') + '</div>' +
        '<div class="co ' + (u.correo ? '' : 'falta') + '">' + MK.esc(u.correo || 'Sin correo') + (u.telefono ? ' · ' + MK.esc(u.telefono) : '') + '</div>' +
        '<div class="ul"><span class="estu ' + (u.activo ? 'si' : 'no') + '">' + (u.activo ? 'Activo' : 'De baja') + '</span></div>' +
        '<div class="ac">' + acc + '</div></div>';
    }).join('') : MK.vacio('Nadie en esta lista.')) + '</div>' +
    '<div class="nota">El único administrador no puede darse de baja ni cambiarse de rol: primero hay que dar de alta otro. Los PIN nunca se ven en esta lista; se guardan cifrados.</div></div>';
  return h;
}
function filtroU(f) { FILTRO = f; MK.repintar(); }
function ahoraTxt() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

function rotar(m, r) {
  var ciclo = (m === 'campo' && r === 'operador') ? ['r', 'n'] : ['t', 'v', 'n'];

function guardarMatriz(btn) {

var EMPD = null, EMPV = false, EMPE = null, EMP_CTA = null;

  ['razonSocial', 'nombreComercial', 'ruc', 'dv', 'folio'].forEach(function (k) { if (o[k] !== EMPE[k]) n++; });
  ['nombre', 'nacionalidad', 'documento', 'genero'].forEach(function (k) { if (o.representanteLegal[k] !== EMPE.representanteLegal[k]) n++; });
  ['banco', 'titular', 'tipo'].forEach(function (k) { if (o.datosBancarios[k] !== EMPE.datosBancarios[k]) n++; });
  if (JSON.stringify(o.correosNotificacion) !== JSON.stringify(EMPE.correosNotificacion)) n++;

    '<div class="rr"><div class="rt"><b>En el contrato dice</b><span>«el señor …, varón» o «la señora …, mujer».</span></div><div class="seg"><button type="button" class="' + (R.genero === 'M' ? 'on' : '') + '" onclick="EMPE.representanteLegal.genero=\'M\';MK.repintar()">El señor</button><button type="button" class="' + (R.genero === 'F' ? 'on' : '') + '" onclick="EMPE.representanteLegal.genero=\'F\';MK.repintar()">La señora</button></div></div>' +

    '<div class="rr"><div class="rt"><b>Tipo de cuenta</b><span>Así sale en el contrato.</span></div><div class="seg"><button type="button" class="' + (/^CORR/i.test(Bk.tipo) ? 'on' : '') + '" onclick="EMPE.datosBancarios.tipo=\'CORRIENTE\';MK.repintar()">Corriente</button><button type="button" class="' + (/^AHO/i.test(Bk.tipo) ? 'on' : '') + '" onclick="EMPE.datosBancarios.tipo=\'AHORROS\';MK.repintar()">Ahorros</button></div></div>' +

  h += '<div class="card reg" style="margin-top:12px"><h3>Correos de notificación del contrato</h3><div class="rt" style="padding:4px 2px 8px"><span style="display:block">Los que el contrato da para notificar a la empresa (cláusula de domicilio y notificaciones).</span></div>' +
    E.correosNotificacion.map(function (c, i) {

function empAgregarCorreo() {

  EMPE.correosNotificacion.push(v); MK.repintar();
  setTimeout(function () { var n = document.getElementById('emp-co-n'); if (n) n.focus(); }, 30);
}
function guardarEmpresa(btn) {

  var mal = cos.filter(function (x) { return !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x); });
  if (mal.length) { m.textContent = 'Revisa: ' + mal.join(', ') + ' no parece un correo.'; return; }
  var cta = EMP_CTA === null ? '' : EMP_CTA.replace(/\s/g, '');
  if (EMP_CTA !== null && cta && !/^[0-9-]{4,30}$/.test(cta)) { m.textContent = 'El número de cuenta solo lleva números y guiones.'; return; }
  var d = { razonSocial: E.razonSocial.trim(), nombreComercial: E.nombreComercial.trim(), ruc: E.ruc.trim(), dv: E.dv.trim(), folio: E.folio.trim(),
    representanteLegal: { nombre: E.representanteLegal.nombre.trim(), nacionalidad: E.representanteLegal.nacionalidad.trim(), documento: E.representanteLegal.documento.trim(), genero: E.representanteLegal.genero },
    datosBancarios: { banco: E.datosBancarios.banco.trim(), titular: E.datosBancarios.titular.trim(), tipo: E.datosBancarios.tipo },
    correosNotificacion: cos };
  if (cta) d.datosBancarios.cuenta = cta;   // solo se manda si se cambió
  m.textContent = ''; MK.ocupado(btn, true);
  MK.api('api_empresaGuardar', PIN, d).then(function (r) {
    MK.ocupado(btn, false);
    if (!r || !r.ok) { m.textContent = (r && r.error) || 'No se pudo guardar.'; return; }
    MK.aviso('Datos de la empresa guardados'); EMPD = null; EMPE = null; EMP_CTA = null; recargar();
  }, function (e) { MK.ocupado(btn, false); m.textContent = e.message || 'Sin conexión'; });
}


/* ═══ ENCENDER Y APAGAR MÓDULOS (api 3.14) ═══
   Apagar un módulo lo cierra para todos menos para el administrador y los
   probadores. El servidor es el que cierra la puerta; aquí solo se decide. */
var OBRA = null, OBRA_V = false, OBRA_T = null, OBRA_SEL = [];

    if (MK.seccion === 'obra' && !obraHojaAbierta()) MK.repintar();
    MK.contador('obra', OBRA.ok ? OBRA.modulos.filter(function (m) { return m.apagado; }).length : 0, 'am');
  }, function () { OBRA_V = false; if (!silencio) { OBRA = { ok: false, error: 'Sin conexión' }; MK.repintar(); } });
}
function obraReloj() {
  clearInterval(OBRA_T);

function obraHojaAbierta() { var hj = document.getElementById('hoja'); return !!(hj && hj.classList.contains('si')); }

  obraReloj();
  var L = OBRA.modulos, off = L.filter(function (m) { return m.apagado; });
  var h = cab + (off.length ? '<div class="aviso am" style="margin-bottom:14px">' + MK.ic('llaveInglesa', 16) + ' <b>En mantenimiento: ' + MK.esc(off.map(function (m) { return m.titulo; }).join(', ')) + '.</b> Solo entran tú y los probadores.</div>' : '');
  h += '<div class="card"><div class="mods">' + L.map(function (m) {

      '<div class="nm"><b>' + MK.esc(m.titulo) + '</b><small>' + (ap ? 'En mantenimiento desde ' + MK.esc(fechaHora(m.desde)) + (m.regreso ? ' · vuelve: ' + MK.esc(m.regreso) : '')
        : MK.esc(m.detalle) + (m.zona === 'aparte' ? ' · se entra desde otro módulo' : '')) +
        (dentro ? ' · <b class="dn">' + dentro + ' dentro ahora</b>' : '') + '</small></div>' +
      '<div class="quien">' + (ap ? '<span style="font-weight:700;color:var(--ink)">Entran:</span>' + obraPersona(MK.usuario.nombre, true) +
          (m.entran || []).map(function (n) { return obraPersona(n, false, 'probador'); }).join('') +
          '<button class="btn sm gh" onclick="obraApagar(\'' + m.id + '\')">' + MK.ic('mas', 13) + ' Probador</button>'
        : 'Todos según «Módulos por rol»') + '</div>' +
      '<div class="est2"><button class="a' + (!ap ? ' on' : '') + '" onclick="' + (ap ? 'obraEncender(\'' + m.id + '\')' : '') + '">Encendido</button>' +
      '<button class="c' + (ap ? ' on' : '') + '" onclick="' + (ap ? '' : 'obraApagar(\'' + m.id + '\')') + '">En mantenimiento</button></div></div>';

  var ej = off[0] || L.filter(function (m) { return m.id === 'alta'; })[0] || L[0];
  h += '<div class="prev3" style="margin-top:14px">' +
    '<div class="card"><h3>1 · En el lobby</h3><div class="lob">' + L.filter(function (m) { return m.zona !== 'aparte'; }).map(function (m) {
      return '<div class="t' + (m.apagado ? ' no' : '') + '">' + MK.ic(OBRA_IC[m.id] || 'documento', 22) + MK.esc(m.titulo) + (m.apagado ? '<span class="s">🔧 En mantenimiento</span>' : '') + '</div>'; }).join('') +
      '<div class="avl">Al tocarlo: «' + MK.esc((ej.mensaje || ej.titulo + ' está en mantenimiento.') + (ej.regreso ? ' Vuelve: ' + String(ej.regreso).replace(/\.$/, '') + '.' : '')) + '»</div></div></div>' +
    '<div class="card"><h3>2 · Al que estaba dentro</h3><div class="dentro"><div class="bar">' + MK.ic(OBRA_IC[ej.id] || 'documento', 16) + ' ' + MK.esc(ej.titulo) + '</div>' +
      '<div class="tapa"><div class="ic2">' + MK.ic('llaveInglesa', 30) + '</div><b>' + MK.esc(ej.titulo) + ' está en mantenimiento</b><span>En menos de un minuto se le tapa la pantalla. Lo que estaba guardando queda en espera y se envía solo cuando vuelva.</span><span class="btn pri sm">Volver a los módulos</span></div></div></div>' +
    '<div class="card"><h3>3 · A ti y a los probadores</h3><div class="dentro"><div class="bar">' + MK.ic(OBRA_IC[ej.id] || 'documento', 16) + ' ' + MK.esc(ej.titulo) + '</div>' +
      '<div class="cu"><i style="width:40%"></i><i style="width:85%"></i><i style="width:70%"></i><i style="width:78%"></i></div>' +
      '<div class="pst">🔧 <b>En mantenimiento.</b> Solo lo ven: tú' + ((ej.entran || []).length ? ', ' + MK.esc(ej.entran.join(', ')) : '') + '.</div></div></div>' +
    '</div>' +
    '<div class="nota">El enlace directo tampoco abre: el servidor le responde «en mantenimiento» a cualquiera que no esté en la lista. El conductor sigue con su ruta aunque Logística esté apagado. Lo que ve el cliente (formulario, propuesta, encuesta, recibos) no se apaga desde aquí. Cada cambio queda en el Historial.</div>';
  return h;
}
var OBRA_IC = { inicio: 'brujula', campo: 'ruta', alta: 'maletin', planta: 'planta', cobros: 'moneda', certificados: 'sello', solicitud: 'factura', finanzas: 'billete', admin: 'llave', calidad: 'escudo' };
function obraApagar(id) {
  var m = obraMod(id); if (!m) return;
  OBRA_SEL = (m.entran || []).slice();
  var dentro = (m.dentro || []).filter(function (d) { return !d.sigue; });
  var U = OBRA.usuarios || [];
  MK.hoja('<h2>' + (m.apagado ? 'Mantenimiento de ' : 'Apagar ') + MK.esc(m.titulo) + (m.apagado ? '' : ' por mantenimiento') + '</h2>' +
    '<p class="muted" style="font-size:13px;margin-top:6px">Se cierra para todos menos para ti y los probadores. Nadie más puede verlo ni registrar nada. No se borra ningún dato.</p>' +
    (!m.apagado && dentro.length ? '<div class="aviso am" style="margin-top:12px"><b>' + dentro.length + (dentro.length === 1 ? ' persona está' : ' personas están') + ' dentro ahora.</b> En menos de un minuto les sale el aviso y la pantalla se tapa. Si estaban guardando algo, queda en espera y se envía solo cuando vuelvas a encender.</div>' +
      '<div class="lst" style="margin-top:8px">' + dentro.map(function (p) { return '<div class="it"><div class="av">' + MK.esc(MK.ini(p.nombre)) + '</div><div class="tx"><b>' + MK.esc(p.nombre) + '</b><small>' + MK.esc(p.rol || '') + '</small></div></div>'; }).join('') + '</div>' : '') +
    (id === 'campo' && !m.apagado ? '<div class="aviso az" style="margin-top:10px"><b>Los conductores en ruta siguen trabajando.</b> Su pantalla del camión no se apaga; el cierre es para la oficina de Logística.</div>' : '') +
    '<label class="lb">QUIÉN MÁS PUEDE ENTRAR MIENTRAS TANTO</label><div class="row w" style="gap:6px;margin-bottom:6px">' + obraPersona(MK.usuario.nombre, true, 'siempre') + '</div>' +
    '<div class="chips" id="obra-prob">' + U.map(function (u, i) { return '<button type="button" class="chip' + (OBRA_SEL.indexOf(u.nombre) >= 0 ? ' on' : '') + '" onclick="obraProb(' + i + ',this)">' + MK.esc(u.nombre) + ' <span class="n">' + MK.esc(u.rol) + '</span></button>'; }).join('') + '</div>' +
    '<div class="f2"><div><label class="lb">AVISO QUE VERÁN LOS DEMÁS</label><input class="in" id="obra-msj" maxlength="200" value="' + MK.esc(m.mensaje || (m.titulo + ' está en mantenimiento. Estamos haciendo mejoras.')) + '"></div>' +
    '<div><label class="lb">VUELVE (OPCIONAL)</label><input class="in" id="obra-reg" maxlength="60" placeholder="Ej.: hoy, 4:00 p. m." value="' + MK.esc(m.regreso || '') + '"></div></div>' +
    '<div class="small" id="obra-err" style="color:var(--bad);margin-top:8px"></div>' +
    '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn am" id="obra-si" onclick="obraConfirmar(\'' + id + '\',this)">' + MK.ic('pausa', 15) + (m.apagado ? ' Guardar cambios' : ' Apagar y cerrar') + '</button></div>', { fija: true });
}
function obraProb(i, el) {
  var u = (OBRA.usuarios || [])[i]; if (!u) return;
  var k = OBRA_SEL.indexOf(u.nombre);
  if (k >= 0) OBRA_SEL.splice(k, 1); else OBRA_SEL.push(u.nombre);
  el.classList.toggle('on', k < 0);
}
function obraConfirmar(id, btn) {
  var e = document.getElementById('obra-err'); e.textContent = '';
  MK.ocupado(btn, true);
  MK.api('api_cfgModuloEstado', PIN, id, { apagar: true, entran: OBRA_SEL, mensaje: MK.val('obra-msj'), regreso: MK.val('obra-reg') }).then(function (r) {
    MK.ocupado(btn, false);
    if (!r || !r.ok) { e.textContent = (r && r.error) || 'No se pudo.'; return; }
    var m = obraMod(id); MK.cerrarHoja();
    MK.aviso((m ? m.titulo : 'El módulo') + ' quedó en mantenimiento · se cierra para los demás en menos de un minuto');
    OBRA = null; recargar();
  }, function (x) { MK.ocupado(btn, false); e.textContent = x.message || 'Sin conexión'; });
}
function obraEncender(id) {
  var m = obraMod(id); if (!m) return;
  MK.hoja('<h2>Encender ' + MK.esc(m.titulo) + '</h2><p class="muted" style="font-size:13px;margin-top:6px">Vuelve a abrir para todos según «Módulos por rol». Los que lo tenían abierto ven «ya está disponible» en menos de un minuto; lo que quedó en espera se envía solo.</p>' +
    '<div class="small" id="obra-err" style="color:var(--bad);margin-top:8px"></div>' +
    '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn ok" onclick="obraOn(\'' + id + '\',this)">Encender</button></div>');
}
function obraOn(id, btn) {
  MK.ocupado(btn, true);
  MK.api('api_cfgModuloEstado', PIN, id, { apagar: false }).then(function (r) {
    MK.ocupado(btn, false);
    if (!r || !r.ok) { document.getElementById('obra-err').textContent = (r && r.error) || 'No se pudo.'; return; }
    var m = obraMod(id); MK.cerrarHoja(); MK.aviso((m ? m.titulo : 'El módulo') + ' encendido');
    OBRA = null; recargar();
  }, function (x) { MK.ocupado(btn, false); document.getElementById('obra-err').textContent = x.message || 'Sin conexión'; });
}

/* ═══ HISTORIAL ═══ */
function vHistorial() {
  var H = B().historial || [];
  var l = H.filter(function (h) { return FH === 'todo' || h.seccion === FH; });
  var secs = ['Usuarios', 'Módulos', 'Encender y apagar', 'Reglas', 'Seguridad', 'Cobros', 'Funciones', 'Empresa'];
  return MK.cabeza('Historial', 'Todo lo que se hace en Configuración, con quién y cuándo. No se puede borrar.') +
    '<div class="card"><div style="margin-bottom:10px">' + MK.chips([['todo', 'Todo', H.length]].concat(secs.map(function (s) { return [s, s, H.filter(function (h) { return h.seccion === s; }).length]; })), FH, 'filtroH') + '</div>' +
    MK.tabla(['Fecha', 'Quién', 'Qué'], l.map(function (h) { return ['<span class="hisf">' + MK.esc(MK.dmy(h.fecha.slice(0, 10)) + ' ' + h.fecha.slice(11)) + '</span>', MK.esc(h.quien), '<b style="font-weight:600">' + MK.esc(h.accion) + '</b>' + (h.detalle ? '<small>' + MK.esc(h.detalle) + '</small>' : '')]; }), { vacio: 'Todavía no hay nada: el historial empezó con esta versión.' }) + '</div>';
}
function filtroH(f) { FH = f; MK.repintar(); }

/* ═══ CÓMO SE ENTRA ═══ */
function vEntrada() {
  return MK.cabeza('Cómo se entra', 'El apartado oculto: no aparece en el lobby ni en el menú de nadie más.') +
    '<div class="g2m"><div class="demo"><div class="bar"><span>ECOVSA</span><span style="font-weight:500;color:#b9c6de">· cualquier módulo</span><span class="avd">' + MK.esc(MK.ini(MK.usuario.nombre)) + '</span></div>' +
    '<div class="menu2"><div>' + MK.ic('persona', 16) + MK.esc(MK.usuario.nombre) + ' · Administrador</div><div class="hl">' + MK.ic('ajustes', 16) + 'Configuración del sistema</div><div>' + MK.ic('candado', 16) + 'Bloquear pantalla</div><div>' + MK.ic('puerta', 16) + 'Salir</div></div><div class="cuerpo2"></div></div>' +
    '<div class="card"><h3>Tres candados</h3><div class="pasa" style="margin-top:10px">' +
    '<div>' + MK.ic('persona') + '<span><b>Solo se ve si eres administrador.</b> Se abre tocando tu nombre, arriba a la derecha, en cualquier módulo. Nadie más ve esa línea.</span></div>' +
    '<div>' + MK.ic('llave') + '<span><b>Pide tu PIN otra vez</b> al entrar, aunque ya estés adentro.</span></div>' +
    '<div>' + MK.ic('candado') + '<span><b>El servidor lo revisa.</b> Si alguien escribe la dirección a mano sin ser administrador, no ve nada: cada acción se rechaza en el servidor.</span></div></div>' +
    '<div class="nota">Se llama «Configuración» para no confundirlo con el módulo Administración (inventario, activos, equipos y vehículos). Si pierdes tu PIN, nadie más entra aquí: conviene dar de alta un segundo administrador cuando se pueda.</div></div></div>';
}

MK.iniciar({
  modulo: 'Configuración',
  base: 'api_cfgBase',
  inicio: 'usu',
  pin: function () { return PIN; },
  paginas: [
    { g: 'CONFIGURACIÓN' },
    { id: 'usu', n: 'Usuarios', i: 'personas' },
    { id: 'perm', n: 'Módulos por rol', i: 'tabla' },
    { id: 'obra', n: 'Encender y apagar', i: 'pausa' },
    { id: 'reg', n: 'Reglas de solicitudes', i: 'reglas' },
    { id: 'cob', n: 'Escalera de cobro', i: 'escalera' },
    { id: 'inc', n: 'Incidencias en ruta', i: 'alerta' },
    { id: 'seg', n: 'Seguridad', i: 'candado' },
    { id: 'fun', n: 'Funciones', i: 'ajustes' },
    { id: 'emp', n: 'Datos de la empresa', i: 'maletin' },
    { id: 'his', n: 'Historial', i: 'historial' },
    { id: 'rb', n: 'Registro de borrados', i: 'basura' },
    { id: 'prb', n: 'Datos de prueba', i: 'filtro' },
    { id: 'esp', n: 'Espacio de archivos', i: 'subir' },
    { g: 'AYUDA' },
    { id: 'ent', n: 'Cómo se entra', i: 'puerta' }
  ],
  pieMenu: '<a href="index.html">← Volver a los módulos</a>',
  /* antes de pedir nada: la puerta del PIN (si Seguridad lo pide) */
  antes: function () {
    var aj = null; try { aj = JSON.parse(localStorage.getItem('eco_ajustes') || 'null'); } catch (e) {}
    if (aj && aj.largoPin) LARGO = aj.largoPin;
    if (aj && aj.pedirPinConfig === false) { PIN = MK.pin; return true; }
    puerta(); return false;
  },
  alCargar: function (b) { usarBase(b); if (!OBRA) cargarObra(true); },
  pintar: function (id) {
    var main = document.getElementById('main');
    if (!PIN || !MK.base || !MK.base.usuarios) return;
    var V = { usu: vUsuarios, perm: vModulos, reg: vReglas, cob: vCobros, inc: vIncidencias, seg: vSeguridad, fun: vFunciones, emp: vEmpresa, obra: vObra, his: vHistorial, ent: vEntrada, esp: vEspacio, rb: vRegistro, prb: vPrueba };
    main.innerHTML = (V[id] || vUsuarios)();
  }
});
</script>
