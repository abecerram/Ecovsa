.tr391 .tr-b{display:flex;align-items:center;gap:12px;margin-top:10px}.tr391 .bar{flex:1;height:8px;border-radius:8px;background:var(--line2);overflow:hidden}.tr391 .bar i{display:block;height:100%;background:var(--tm-ok,#2e9b47);border-radius:8px;transition:width .4s ease}

#pg384p .aur{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#pg384p .aur .b{position:absolute;border-radius:50%;filter:blur(64px);mix-blend-mode:screen;will-change:transform}
#pg384p .aur .b1{width:76vmax;height:76vmax;left:-28vmax;top:-34vmax;background:radial-gradient(circle,#0B5394 0%,rgba(11,83,148,0) 64%);opacity:.7;animation:pgA1 17s ease-in-out infinite alternate}
#pg384p .aur .b2{width:64vmax;height:64vmax;right:-24vmax;top:-16vmax;background:radial-gradient(circle,#1E9032 0%,rgba(30,144,50,0) 64%);opacity:.6;animation:pgA2 21s ease-in-out infinite alternate}
#pg384p .aur .b3{width:66vmax;height:66vmax;left:-14vmax;bottom:-38vmax;background:radial-gradient(circle,#88BE47 0%,rgba(136,190,71,0) 62%);opacity:.45;animation:pgA3 19s ease-in-out infinite alternate}
#pg384p .aur .b4{width:66vmax;height:66vmax;right:-22vmax;bottom:-34vmax;background:radial-gradient(circle,#2f7bd6 0%,rgba(47,123,214,0) 62%);opacity:.55;animation:pgA4 23s ease-in-out infinite alternate}
#pg384p.v-aurora .col{position:relative;z-index:1;width:min(372px,100%);display:flex;flex-direction:column;align-items:center;gap:4px;margin:auto}
#pg384p .aro{position:relative;width:128px;height:128px;display:grid;place-items:center;margin-top:4px}
#pg384p .aro .giro{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,#0B5394,#2f7bd6,#1E9032,#88BE47,#ffffff,#88BE47,#1E9032,#2f7bd6,#0B5394);-webkit-mask:radial-gradient(circle,transparent 61%,#000 63%);mask:radial-gradient(circle,transparent 61%,#000 63%);animation:pgRota 7s linear infinite}
#pg384p.v-aurora .emb{position:relative;z-index:1;width:108px;height:108px;box-shadow:0 0 0 5px rgba(255,255,255,.2),0 12px 38px rgba(0,0,0,.4);animation:pgLate 3.4s ease-in-out infinite}

#pg384p.v-aurora .letras{width:112px;height:auto;margin:6px 0 2px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
#pg384p.v-aurora .fr{width:100%;padding:18px 20px 16px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 30px 70px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;text-align:center}
#pg384p.v-aurora .cand{color:#ffe08a;background:rgba(245,179,1,.18);border:1px solid rgba(255,214,102,.5)}
#pg384p.v-aurora h1{font-size:21px;margin:10px 0 2px}#pg384p.v-aurora .sub{color:#d6e6ff;margin-bottom:12px}
#pg384p.v-aurora .pts{gap:14px;margin:2px 0 2px}
#pg384p.v-aurora .pts i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.6);transition:all .18s}
#pg384p.v-aurora .pts i.cur{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
#pg384p.v-aurora .pts i.on{background:linear-gradient(135deg,#a8e063,#1E9032);border-color:transparent;box-shadow:0 0 6px rgba(136,190,71,.6);transform:scale(1.18)}
#pg384p.v-aurora .pts.mal i{background:#ff6b5e;border-color:#ff6b5e;box-shadow:0 0 16px rgba(255,107,94,.8)}
#pg384p.v-aurora .pts.okp i{background:linear-gradient(135deg,#d7ffa8,#4ade80);border-color:transparent;box-shadow:0 0 8px rgba(160,255,140,.7);transform:scale(1.3)}
#pg384p.v-aurora .msg{color:#d6e6ff;min-height:34px}#pg384p.v-aurora .msg.mal{color:#ffb3aa}
#pg384p.v-aurora .tec{gap:10px;max-width:300px}
#pg384p.v-aurora .tec button{height:56px;border-radius:18px;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.24);box-shadow:0 6px 16px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#pg384p.v-aurora .tec button:hover{background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.1))}
#pg384p.v-aurora .tec button:active{background:linear-gradient(135deg,#2f7bd6,#1E9032);transform:scale(.94)}
#pg384p.v-aurora .tec .ok{background:linear-gradient(135deg,#a8e063,#1E9032);color:#06210f;border-color:rgba(255,255,255,.5);box-shadow:0 6px 14px rgba(30,144,50,.3),inset 0 1px 0 rgba(255,255,255,.5)}
#pg384p.v-aurora .vol{color:#d6e6ff;margin-top:12px}
#pg384p.v-aurora.espera .aro .giro{background:conic-gradient(from 0deg,#F5B301,#fff1c2,#F5B301,#c98a00,#F5B301);animation-duration:24s}
/* al entrar: la luz del logo se expande en anillos de color y chispas */
#pg384p .burst{position:absolute;left:50%;top:0;width:0;height:0;z-index:2;pointer-events:none}
#pg384p .burst i{position:absolute;left:0;top:0;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid #88BE47;opacity:0;transform:scale(.4)}

@media(max-width:480px){#pg384p .aro{width:104px;height:104px}#pg384p.v-aurora .emb{width:88px;height:88px}#pg384p.v-aurora .tec button{height:52px}#pg384p.v-aurora .fr{padding:14px 14px 12px}#pg384p.v-aurora h1{font-size:19px}}

/* Sin destellos (pedido de Álvaro): fuera rayos, halos, brillos y chispas; quedan los colores del logo en fondo, aro y teclas */

#pg384p.v-aurora .pts i.on,#pg384p.v-aurora .pts.okp i,#pg384p.v-aurora .pts.mal i{box-shadow:none}

#pg384p.v-aurora .emb{box-shadow:0 0 0 4px rgba(255,255,255,.14)}
#pg384p .aur .b{filter:blur(90px)}
#pg384p.entrando .burst i{animation:pgAnillo2 1.2s ease-out forwards}
@keyframes pgAnillo2{0%{opacity:.35;transform:scale(.6)}100%{opacity:0;transform:scale(5)}}

/* ── MEZCLA «Panel + Aurora»: tarjeta partida del Panel sobre el fondo de color del logo, sin destellos ── */
#pg384p.v-mezcla{background:#061a3a}
#pg384p.v-mezcla .caja{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);width:min(880px,100%);border-radius:26px;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 30px 70px rgba(0,0,0,.35)}
#pg384p.v-mezcla .pg-lat{background:linear-gradient(160deg,rgba(11,83,148,.55),rgba(15,108,82,.4) 70%,rgba(136,190,71,.25));color:#fff;padding:34px 30px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;border-right:1px solid rgba(255,255,255,.16)}
#pg384p.v-mezcla .aro{margin:0 0 2px}
#pg384p.v-mezcla .letras{width:112px;margin:2px 0 0}
#pg384p.v-mezcla .rot{font-size:24px;font-weight:800}
#pg384p.v-mezcla .pg-lat ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}

#pg384p.v-mezcla .fr{background:none;border:0;box-shadow:none;border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:30px 28px 22px}

@media(max-width:760px){#pg384p.v-mezcla{align-items:flex-start;overflow-y:auto}#pg384p.v-mezcla .caja{grid-template-columns:1fr;margin:auto 0}#pg384p.v-mezcla .pg-lat{flex-direction:row;flex-wrap:wrap;align-items:center;padding:16px 18px;gap:10px;border-right:0;border-bottom:1px solid rgba(255,255,255,.16)}#pg384p.v-mezcla .aro{width:58px;height:58px}#pg384p.v-mezcla .aro .emb{width:48px;height:48px}#pg384p.v-mezcla .pg-lat .letras{width:84px}#pg384p.v-mezcla .pg-lat .rot{width:100%;font-size:18px}#pg384p.v-mezcla .pg-lat ul{display:none}#pg384p.v-mezcla .fr{padding:16px 14px 12px}}

/* ── Clave escrita (próximo cambio: de PIN numérico a clave con letras) ── */

@keyframes pgRota{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#pg384p .aur .b,#pg384p .aro .giro,#pg384p.v-aurora .emb{animation:none}}
#pg384p.entrando .fr{transition:opacity .6s .5s,transform .6s .5s;opacity:0;transform:translateY(8px)}
#pg384p.entrando .aro .giro{animation-duration:.9s}
body.pg384-cerrada #sysbar,body.pg384-cerrada #mtabs,body.pg384-cerrada .shell{display:none}

<body>
<script src="cargador.js" data-modulo="Configuración"></script>
<div id="sysbar"></div>
<div class="mtabs" id="mtabs"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"></main></div>
<script id="pg384">
/* ═══ 3.84 · puerta de Configuración (solo administrador): «Panel Aurora». Mismo PIN, mismo servidor, misma opción pedirPinConfig. ═══ */
var PG384 = null;
function pg384Puerta(msg) {
  ['sysbar', 'mtabs', 'mnav', 'main'].forEach(function (id) { var e = document.getElementById(id); if (e) e.innerHTML = ''; });   /* el menú no se ve detrás de la puerta */
  document.body.classList.add('pg384-cerrada');
  try { pg384Monta(msg); } catch (e) { document.body.classList.remove('pg384-cerrada'); puerta(msg); }   /* si algo falla, queda la puerta de siempre */
}
function pg384Monta(msg) {
  var LARGO_P = LARGO || 4, pin = '', ocupado = false, hasta = 0, tim = null, fin = false;
  var d = document.createElement('div'); d.id = 'pg384p'; d.className = 'v-mezcla v-aurora'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Entrada a Configuración');
  var ico = function (n, s) { return MK.ic(n, s || 18); };
  var teclas = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'borrar', '0', 'ok'].map(function (k) {
    return k === 'borrar' ? '<button type="button" data-k="borrar" aria-label="Borrar">' + ico('atras', 20) + '</button>' : k === 'ok' ? '<button type="button" data-k="ok" class="ok" aria-label="Entrar" disabled>' + ico('check', 22) + '</button>' : '<button type="button" data-k="' + k + '">' + k + '</button>';
  }).join('');
  d.innerHTML = '<div class="aur" aria-hidden="true"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i><i class="b b4"></i></div>' +
    '<div class="caja"><aside class="pg-lat"><div class="aro"><i class="giro"></i><span class="emb"><img src="ecovsa-emblema.png" alt=""></span></div><img class="letras" src="ecovsa-letras.png" alt="ECOVSA"><div class="rot">Centro de control</div>' +
    '<ul><li>' + ico('candado', 18) + '<span>Solo el administrador entra aquí.</span></li><li>' + ico('llave', 18) + '<span>El PIN se pide cada vez, aunque la sesión esté abierta.</span></li><li>' + ico('historial', 18) + '<span>Todo cambio queda en el Historial, con quién y cuándo.</span></li></ul></aside>' +
    '<div class="fr"><span class="cand">' + ico('candado', 14) + 'SOLO ADMINISTRADOR</span><h1>Configuración del sistema</h1><p class="sub">Escribe tu PIN para entrar</p>' +
    '<div class="pts" id="pg-pts"></div><div class="msg" id="pg-msg" aria-live="polite"></div><div class="tec" id="pg-tec">' + teclas + '</div>' +
    '<a class="vol" href="index.html">← Volver a los módulos</a></div></div>' +
    '<div class="burst" aria-hidden="true"><i></i><i></i><i></i></div>';
  document.body.appendChild(d);
  var pts = d.querySelector('#pg-pts'), mj = d.querySelector('#pg-msg'), ok = d.querySelector('.ok');
  function pintar() { var n = Math.max(LARGO_P, pin.length), h = ''; for (var i = 0; i < n; i++) h += '<i class="' + (i < pin.length ? 'on' : '') + (i === pin.length && !ocupado && !fin ? ' cur' : '') + '"></i>'; pts.innerHTML = h; ok.disabled = ocupado || fin || pin.length < 4; }
  function dec(t, mal) { mj.textContent = t || ''; mj.className = 'msg' + (mal ? ' mal' : ''); }
  function tecla(k) {
    if (ocupado || fin) return; dec('');
    if (k === 'borrar') pin = pin.slice(0, -1); else if (k === 'ok') { if (pin.length >= 4) probar(); return; } else if (pin.length < 6) pin += k;
    pintar(); if (pin.length === LARGO_P) setTimeout(probar, 160);
  }
  function salir() { clearTimeout(tim); document.onkeydown = null; document.removeEventListener('paste', pegar); }
  function probar() {
    if (ocupado || fin || !pin) return; ocupado = true; dec('Verificando…'); pintar();
    pg384Validar(pin, function (r) {
      ocupado = false;
      if (r && r.ok) {
        fin = true; pintar(); pts.classList.add('okp'); dec('Bienvenido' + (r.nombre ? ', ' + r.nombre.split(' ')[0] : '')); d.classList.add('entrando');
        setTimeout(function () { salir(); d.remove(); pg384Entro(); }, 1500); return;
      }
      pts.classList.add('mal'); setTimeout(function () { pts.classList.remove('mal'); }, 500); pin = '';
      if (r && r.sinConexion) { dec(r.error, true); pintar(); return; }   /* sin señal: puede volver a intentar */
      fin = true; pintar(); d.classList.add('espera');   /* PIN malo (o espera / bloqueo): el aviso del servidor y se sale; no se deja entrar */
      var b = r && r.bloqueo, t = (r && r.error) || 'PIN no válido';
      dec(t, true);
      tim = setTimeout(function () { salir(); try { localStorage.removeItem('ecovsa_pin'); } catch (e) {} location.href = 'index.html'; }, b ? 3800 : 2600);
    });
  }
  d.querySelector('#pg-tec').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) tecla(b.getAttribute('data-k')); });
  document.onkeydown = function (e) { if (/^\d$/.test(e.key)) tecla(e.key); else if (e.key === 'Backspace') tecla('borrar'); else if (e.key === 'Enter') tecla('ok'); };
  function pegar(e) { var t = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\D/g, '').slice(0, 6); if (t) { e.preventDefault(); pin = t; pintar(); if (pin.length >= 4) setTimeout(probar, 160); } }
  document.addEventListener('paste', pegar);
  if (msg) dec(msg, true);
  pintar();
}
function pg384Validar(p, fin) {
  /* directo al servidor (no con MK.api): MK.api, ante un PIN malo, saca al lobby sin avisar; aquí primero se muestra el aviso del servidor */
  var run = window.google && google.script && google.script.run;
  if (!run) { fin({ ok: false, sinConexion: true, error: 'Sin conexión. Intenta con señal.' }); return; }
  run.withSuccessHandler(function (r) {
    if (!r || !r.ok) { fin({ ok: false, error: (r && r.error) || 'PIN no válido', bloqueo: r && r.bloqueo }); return; }
    PG384 = { pin: p, base: r }; fin({ ok: true, nombre: (r.usuario && r.usuario.nombre) || '' });
  }).withFailureHandler(function () { fin({ ok: false, sinConexion: true, error: 'Sin conexión. Intenta con señal.' }); }).api_cfgBase(p);
}
function pg384Entro() {
  if (!PG384) return;
  PIN = PG384.pin; document.body.classList.remove('pg384-cerrada');
  usarBase(PG384.base); cc379Arranque(); MK.ir(MK.seccion || 'inicio', true);   /* mismo orden de siempre: base → menú agrupado → pantalla */
}
</script>
<script>
/* ═══ Configuración del sistema (api 3.4) ═══ */
var PIN = '';              // el PIN que se escribió al entrar (no el guardado)
var MOSTRAR_PRUEBA = false, FILTRO = 'act', MAT = null, REG = null, SEGU = null, COB = null, FH = 'todo';
var COLOR_ROL = { admin: '#0f2a57', gerente: '#6C3A96', supervisor: '#0B5394', mercadeo: '#00792F', planta: '#8a4f9e', cobros: '#c98a00', operador: '#5b6880', fumigacion: '#2f7d4f' };

function B() { return MK.base || {}; }
function nomRol(r) { return MK.ROLES[r] || r; }
function detRol(r) { var x = (B().roles || []).filter(function (y) { return y.id === r; })[0]; return x ? x.d : ''; }
function tagRol(r) { var c = COLOR_ROL[r] || '#5b6880'; return '<span class="rol" style="background:color-mix(in srgb,' + c + ' 12%,#fff);color:' + c + '">' + MK.esc(nomRol(r)) + '</span>'; }

/* ── la puerta: pedir el PIN otra vez ── */
function puerta(msg) {
  document.getElementById('main').innerHTML = '<div class="puerta"><div class="card">' +
    '<span class="candado">' + MK.ic('candado', 14) + 'SOLO ADMINISTRADOR</span>' +
    '<h1>Configuración del sistema</h1><p class="muted small">Escribe tu PIN otra vez para entrar. Aunque la sesión esté abierta, aquí se pide siempre.</p>' +
    '<div class="pins" id="pp"></div><input class="oculto" id="pin-in" inputmode="numeric" autocomplete="off" maxlength="6">' +
    '<div class="err" id="pin-err">' + MK.esc(msg || '') + '</div>' +
    '<div class="teclado">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '→'].map(function (k) { return '<button type="button" onclick="teclaPin(\'' + k + '\')">' + k + '</button>'; }).join('') + '</div>' +
    '<p class="small muted" style="margin-top:16px"><a href="index.html">← Volver a los módulos</a></p></div></div>';
  window._pin = ''; pintarPins();
  var inp = document.getElementById('pin-in');
  document.onkeydown = function (e) {
    if (PIN) return;
    if (/^\d$/.test(e.key)) teclaPin(e.key); else if (e.key === 'Backspace') teclaPin('⌫'); else if (e.key === 'Enter') teclaPin('→');
  };
}
var LARGO = 4;
function pintarPins() { var n = Math.max(LARGO, window._pin.length); var h = ''; for (var i = 0; i < n; i++) h += '<i class="' + (i < window._pin.length ? 'on' : '') + '">' + (i < window._pin.length ? '•' : '') + '</i>'; var e = document.getElementById('pp'); if (e) e.innerHTML = h; }
function teclaPin(k) {
  var e = document.getElementById('pin-err'); if (e) e.textContent = '';
  if (k === '⌫') window._pin = window._pin.slice(0, -1);
  else if (k === '→') { if (window._pin.length >= 4) probarPin(); return; }
  else if (window._pin.length < 6) window._pin += k;
  pintarPins();
  if (window._pin.length === LARGO) setTimeout(probarPin, 120);
}
function probarPin() {
  var p = window._pin; if (!p) return;
  MK.api('api_cfgBase', p).then(function (r) {
    if (!r || !r.ok) { window._pin = ''; pintarPins(); var e = document.getElementById('pin-err'); if (e) e.textContent = (r && r.error) || 'PIN no válido'; return; }
    PIN = p; document.onkeydown = null; usarBase(r); cc379Arranque(); MK.ir(MK.seccion || 'inicio', true);   /* 3.83: con la puerta de PIN también se arma el menú agrupado */
  }, function () { var e = document.getElementById('pin-err'); if (e) e.textContent = 'Sin conexión.'; });
}
function usarBase(b) {
  MK.base = b; MK.usuario = b.usuario; MK.hoy = b.hoy;
  MAT = JSON.parse(JSON.stringify(b.matriz)); REG = JSON.parse(JSON.stringify(b.reglas)); SEGU = JSON.parse(JSON.stringify(b.seguridad)); COB = JSON.parse(JSON.stringify(b.cobros));
  MK.pintarBarra(); MK.pintarMenu();
  /* api 3.12: avisos de seguridad abiertos (equipos bloqueados, pedidos de PIN) */
  if (MK.contador) MK.contador('seg', b.segResumen && b.segResumen.abiertos, 'r');
  var sb = document.querySelector('#sysbar .mod'); if (sb && !document.querySelector('#sysbar .candado')) sb.insertAdjacentHTML('afterend', '<span class="candado">' + MK.ic('candado', 14) + 'SOLO ADMINISTRADOR</span>');
}
function recargar() {
  return MK.api('api_cfgBase', PIN).then(function (r) { if (r && r.ok) { usarBase(r); MK.repintar(); } else MK.aviso((r && r.error) || 'No se pudo recargar'); });
}

/* ═══ USUARIOS ═══ */
function vUsuarios() {
  var U = (B().usuarios || []);
  var reales = U.filter(function (u) { return !u.prueba; });
  var act = reales.filter(function (u) { return u.activo; });
  var admins = act.filter(function (u) { return u.rol === 'admin'; });
  var sinCo = act.filter(function (u) { return !u.correo; });
  var sinCl = act.filter(function (u) { return !u.tieneClave || u.claveTemp; });
  if (!ASIG391 && act.some(function (u) { return !u.usuario; })) { ASIG391 = true; MK.api('api_cfgAccesoUsuarios', PIN).then(function () { recargar(); }); }

function empAgregarCorreo() {

      '<div class="nota" style="margin-top:8px">Si casi todos entran por el celular, las mejoras se piensan primero para el celular.</div>' : MK.vacio('Sin datos todavía.')) + '</div></div></div>';
  return h;
}
</script>
