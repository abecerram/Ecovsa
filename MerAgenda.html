<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda y actividades · Mercadeo · ECOVSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:'oculto',enSupabase:/^api_(?!optimizarRuta$)/,
  escritura:/^api_(crm(Guardar|Completar|Anular|Captura|Mover|Reasignar|Borrar|Subir|Usar)|guardar|marcar|abrir|cerrar|registrar|borrar|eliminar|crear|actualizar|enviar|corregir|dar|anular|confirmar|aprobar|rechazar|subir|asignar|mover|cambiar|agregar|nuevo|editar|reabrir|emitir|pasar|pedir)/i};</script>
<script src="puente.js"></script>

<script src="mercadeo-kit.js"></script>
<style>
/* ── Agenda y actividades · opción A «Calendario de la semana» ── */
.tipoic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#eef2f8;color:var(--navy2);flex:none}
.tipoic.sm{width:24px;height:24px;border-radius:7px}
.tipoic.sm svg.i{width:14px;height:14px}
.lnk{color:var(--navy2);font-weight:600;cursor:pointer}
.lnk:hover{text-decoration:underline}
.sub{font-size:12px;color:var(--muted)}

/* calendario */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.cal{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.calbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.calbar h4{font-size:15px;font-weight:700;margin:0 6px}
.calbar .sel{width:auto;padding:5px 8px;font-size:12.5px}
.tipf{display:flex;gap:6px;flex-wrap:wrap}
.calhead,.calbody{display:grid;grid-template-columns:52px repeat(6,minmax(0,1fr))}
.calhead{border-bottom:1px solid var(--line);background:#fafbfd}
.calhead .dh{padding:7px 8px 6px;font-size:12px;color:var(--muted);border-left:1px solid var(--line2);display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:1px;cursor:default}
.calhead .dh b{grid-column:1/-1;justify-self:start;font-size:17px;color:var(--ink);font-weight:700;line-height:1.2;padding:0 1px}
.calhead .dh.hoy b{color:#fff;background:var(--navy2);border-radius:8px;padding:0 7px}
.calhead .dh small{font-size:11px;color:var(--muted)}
.calbody{position:relative}
.hcol .hr{font-size:11px;color:var(--muted2);text-align:right;padding-right:7px;position:relative;top:-7px}
.dcol{position:relative;border-left:1px solid var(--line2);cursor:cell}
.dcol.hoy{background-color:#fbfcfe}
.dcol.sobre{background-color:#eef3fb}
.ev{position:absolute;left:3px;right:3px;border:1px solid var(--line);border-left:3px solid var(--navy2);border-radius:7px;background:#fff;padding:3px 6px;font-size:11.5px;line-height:1.3;overflow:hidden;cursor:grab;box-shadow:0 1px 3px rgba(15,33,64,.06);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ev:hover{border-color:#9db4d8;border-left-color:var(--navy2);z-index:3}
.ev b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.corto{display:flex;gap:5px;align-items:center;padding:2px 6px}
.ev.corto .t{flex:none;font-weight:600}
.ev.corto .t svg.i{display:none}
.ev.corto.estrecho .t{display:none}
.ev.corto b{flex:1;min-width:0}
.ev .t{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:11px}
.ev .t svg.i{width:12px;height:12px}
.ev .c{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev.atr{border-left-color:var(--bad)}
.ev.hecha{border-left-color:var(--gris);background:#f7f8fa;color:var(--muted);opacity:.62;cursor:pointer}
.ev.hecha b{text-decoration:line-through;font-weight:600}
.arrastrando{opacity:.3!important}
.fantasma{position:fixed;z-index:95;pointer-events:none;opacity:.92;box-shadow:0 10px 24px rgba(15,33,64,.25)!important;background:#fff;border-radius:8px;transform:rotate(-1deg)}
.ahora{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:4;pointer-events:none}
.ahora:before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.guia{position:absolute;left:2px;right:2px;min-height:22px;border:1.5px dashed var(--navy2);border-radius:7px;background:#eaf0fa;pointer-events:none;font-size:11px;font-weight:700;color:var(--navy2);padding:3px 6px;z-index:5}
.diatabs{display:none;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.diatabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 0;font:600 11.5px Archivo,sans-serif;color:var(--muted);cursor:pointer;min-width:48px;position:relative}
.diatabs button b{display:block;font-size:15px;color:var(--ink)}
.diatabs button.hoy{border-color:var(--navy2)}
.diatabs button.on{background:var(--navy2);border-color:var(--navy2);color:#cfe0ff}
.diatabs button.on b{color:#fff}
.diatabs button i{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber)}

/* vista de un día (celular) */
.dia1{display:none;padding:4px 12px 12px}
.d-h{display:grid;grid-template-columns:48px minmax(0,1fr);min-height:40px;border-top:1px solid var(--line2);position:relative}
.d-h>span{font-size:11.5px;color:var(--muted2);padding-top:5px}
.d-h>div{padding:5px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.d-h.sinh{background:#fbfcfe}.d-h.sinh>span{font-weight:700;color:var(--muted)}
.d-h .vac{display:block;height:100%;min-height:28px;cursor:cell}
.d-ev{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--navy2);border-radius:9px;padding:8px 10px;background:#fff;cursor:pointer}
.d-ev .tx{flex:1;min-width:0}.d-ev .tx b{display:block;font-weight:600}
.d-ev .tx small{display:block;color:var(--muted);font-size:12px}
.d-ev.hecha{opacity:.55;border-left-color:var(--gris)}.d-ev.hecha b{text-decoration:line-through}
.d-ev.atr{border-left-color:var(--bad)}
.d-now{position:absolute;left:40px;right:0;height:0;border-top:2px solid var(--bad);z-index:2;pointer-events:none}

/* lateral: lo que no tiene hora */
.side .card{margin-bottom:12px;padding:12px 14px}
.side .ti{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border:1px solid transparent;border-bottom-color:var(--line2);cursor:grab;border-radius:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.side .ti:hover{background:var(--hover);border-color:var(--line)}
.side .ti:last-child{border-bottom-color:transparent}
.side .ti .tx{flex:1;min-width:0;font-size:12.5px}
.side .ti .tx b{display:block;font-weight:600}
.side .ti .tx small{color:var(--muted);font-size:11.5px}
.side .vacio{font-size:12px;color:var(--muted);padding:6px}
.side .venc{color:var(--bad);font-weight:600}
.side .ayuda{margin:0 2px 8px;display:flex;gap:6px;align-items:center}

/* detalle */
.lado h2{font-size:18px;margin:8px 0 2px;padding-right:30px}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 10px;font-size:13px;margin:12px 0}
.kv span{color:var(--muted)}
.kv div{min-width:0;overflow-wrap:anywhere}
.movr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.lado .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* actividades */
.feedf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.feedf .in,.feedf .sel{width:auto}
.feedf .q{flex:1;min-width:200px}
.dia{font-size:12px;font-weight:700;letter-spacing:.7px;color:#5b6a80;margin:16px 0 6px;display:flex;gap:8px;align-items:center;text-transform:uppercase}
.dia:after{content:"";flex:1;height:1px;background:var(--line)}
.dia span{font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted2)}
.ent{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ent .cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ent .cab b{font-weight:700}
.ent .cab .h{margin-left:auto;font-size:12px;color:var(--muted)}
.ent p{margin:4px 0 6px;font-size:13.5px;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ent p.todo{display:block;cursor:default}
.ent .pie{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

@media(max-width:1100px){
  .calwrap{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:700px){
  .calhead,.calbody{display:none}
  .diatabs,.dia1{display:flex}
  .dia1{display:block}
  .calbar h4{width:100%;order:-1;margin:0}
  .calbar .tipf{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .ent .cab .h{margin-left:0;width:100%}
  .feedf .in,.feedf .sel{flex:1 1 40%}
  .feedf .q{flex-basis:100%}
  .ph .btn{flex:1 1 auto}
}
/* gerencia solo consulta */
body.solo-ver [data-a="nueva"],body.solo-ver [data-a="registrar"],body.solo-ver [data-a="slot"]{display:none!important}
body.solo-ver [data-drag]{cursor:pointer}
</style>
</head>
<body class="mk">
<div id="sysbar"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"><div class="cargando">Cargando…</div></main></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = MK.esc;
  var ICO = { llamada: 'llamada', visita: 'visita', whatsapp: 'whatsapp', correo: 'correo', reunion: 'reunion', tarea: 'tarea', nota: 'nota', sistema: 'sistema' };
  var FILTROS = [['todas', 'Todas'], ['llamada', 'Llamadas'], ['visita', 'Visitas y reuniones'], ['mensaje', 'WhatsApp y correo'], ['tarea', 'Otras']];
  var PX = 60;                      // alto de una hora en el calendario
  var A = { lunes: '', dia: '', filtro: 'todas', quien: '', vista: 'cal' };
  var R = null, T = {}, H0 = 7, H1 = 18, CARGANDO = false, OTRA = false, SUPRIMIR = 0;
  var F = { tipo: '', desde: '', hasta: '', q: '', usuario: '' }, ACTS = null, TOTAL = 0;

  function cel() { return window.matchMedia('(max-width:700px)').matches; }
  function hm(h) { var p = String(h || '').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }
  function mhm(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }
  function horaTxt(x) { return x === 12 ? '12 m.' : (x > 12 ? x - 12 : x) + (x < 12 ? ' a. m.' : ' p. m.'); }
  function durTxt(m) { m = Number(m) || 0; if (!m) return ''; return m < 60 ? m + ' min' : (m % 60 ? (m / 60).toFixed(1) : m / 60) + ' h'; }
  function yo() { return (MK.usuario && MK.usuario.nombre) || ''; }
  /* lunes a sábado; el domingo aparece solo si hoy es domingo o hay tareas ese día (si no, quedaban invisibles) */
  function semana() {
    var d = []; for (var i = 0; i < 6; i++) d.push(MK.masDias(A.lunes, i));
    var dom = MK.masDias(A.lunes, 6);
    if (MK.hoy === dom || (R && R.desde === A.lunes && (R.tareas || []).some(function (t) { return t.fecha === dom; }))) d.push(dom);
    return d;
  }
  function finSemana() { return MK.masDias(A.lunes, 6); }
  function pasaFiltro(t) {
    var f = A.filtro;
    if (f === 'todas') return true;
    if (f === 'visita') return t.tipo === 'visita' || t.tipo === 'reunion';
    if (f === 'mensaje') return t.tipo === 'whatsapp' || t.tipo === 'correo';
    if (f === 'tarea') return ['llamada', 'visita', 'reunion', 'whatsapp', 'correo'].indexOf(t.tipo) < 0;
    return t.tipo === f;
  }
  function pasaQuien(t) {
    if (A.quien === 'todos') return true;
    if (A.quien === 'mias') return !t.asignado || t.asignado === yo();
    return t.asignado === A.quien;
  }
  function pasa(t) { return pasaFiltro(t) && pasaQuien(t); }
  function vencida(t) { return t.estado === 'pendiente' && t.fecha && t.fecha < MK.hoy; }
  function irRef(rt, ref) { if (!ref) return; if (rt === 'cli') MK.irCliente(ref); else MK.irOportunidad(ref); }
  function cuentaHtml(t) {
    if (!t.ref) return esc(t.cuenta || 'Sin cuenta ligada');
    return '<a class="lnk" data-a="ficha" data-rt="' + esc(t.refTipo || 'op') + '" data-ref="' + esc(t.ref) + '">' + esc(t.cuenta || t.ref) + '</a>';
  }

  /* ═══ esqueleto ═══ */
  function esqueleto() {
    $('main').innerHTML =
      '<div class="ph"><div><h1>Agenda y actividades</h1><p>Hoy: ' + esc(MK.fechaLarga(MK.hoy)) + '</p></div><div class="sp"></div>' +
      '<button class="btn" data-a="ics-semana" title="Descarga las tareas pendientes de la semana para Outlook, Google o el calendario del celular">' + MK.ic('calendario', 16) + 'Semana al calendario</button>' +
      '<button class="btn" data-a="registrar">' + MK.ic('nota', 16) + 'Registrar actividad</button>' +
      '<button class="btn pri" data-a="nueva">' + MK.ic('mas', 16) + 'Nueva tarea</button></div>' +
      '<div class="tabs"><button data-a="tab" data-v="cal">Calendario</button><button data-a="tab" data-v="act">Actividades</button></div>' +
      '<section id="v-cal"><div class="calwrap"><div class="cal">' +
      '<div class="calbar"><button class="btn sm" data-a="sem" data-n="-7" aria-label="Semana anterior">‹</button><button class="btn sm" data-a="hoy">Hoy</button><button class="btn sm" data-a="sem" data-n="7" aria-label="Semana siguiente">›</button>' +
      '<h4 id="c-tit"></h4><div class="sp"></div><select class="sel" id="c-quien" aria-label="De quién"></select><div class="tipf" id="c-fil"></div></div>' +
      '<div class="diatabs" id="c-dias"></div><div class="calhead" id="c-head"></div><div class="calbody" id="c-body"><div class="cargando" style="grid-column:1/-1">Cargando la semana…</div></div><div class="dia1" id="c-dia"></div>' +
      '</div><div class="side" id="c-side"></div></div></section>' +
      '<section id="v-act" hidden><div class="feedf" id="f-bar"></div><div id="f-res" class="small muted"></div><div id="f-lista"><div class="cargando">Cargando…</div></div></section>';
    var q = $('c-quien'), ases = (MK.base.asesores || []);
    var op = [['mias', 'Mis tareas'], ['todos', 'Todo el equipo']];
    if (MK.usuario.rol !== 'mercadeo') ases.forEach(function (a) { if (a.nombre !== yo()) op.push([a.nombre, a.nombre.trim()]); });
    q.innerHTML = op.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('');
    q.value = A.quien;
    q.onchange = function () { var antes = A.quien; A.quien = q.value; if (MK.usuario.rol === 'mercadeo' && (antes === 'mias') !== (A.quien === 'mias')) cargar(); else pintarCal(); };
    $('main').addEventListener('click', clic);
    pintarTabs();
  }
  function pintarTabs() {
    [].forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === A.vista); });
    $('v-cal').hidden = A.vista !== 'cal'; $('v-act').hidden = A.vista !== 'act';
    if (A.vista === 'act' && !ACTS) { pintarFiltros(); cargarActs(); }
  }

  /* ═══ carga de la semana ═══ */
  function cargar() {
    if (CARGANDO) { OTRA = true; return; }
    CARGANDO = true;
    var d = semana(), todos = MK.usuario.rol === 'mercadeo' && A.quien !== 'mias';
    MK.api('api_crmTareas', MK.pin, d[0], finSemana(), todos).then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.error) || 'No se pudo leer la agenda.');
      if (r.desde !== semana()[0]) return;   // cambió de semana mientras cargaba
      R = r; indexar(); pintarCal();
    }).catch(function (e) {
      MK.error('c-body', e.message || 'Sin conexión.'); MK.error('c-dia', e.message || 'Sin conexión.'); $('c-side').innerHTML = '';
    }).then(function () { CARGANDO = false; if (OTRA) { OTRA = false; cargar(); } });
  }
  function indexar() {
    T = {};
    ['tareas', 'atrasadas', 'sinFecha', 'sinHora'].forEach(function (k) { (R[k] || []).forEach(function (t) { T[t.id] = t; }); });
  }
  /* después de mover una tarea: acomodarla en las listas sin esperar al servidor */
  function recolocar(t) {
    var d = semana();
    ['tareas', 'atrasadas', 'sinFecha', 'sinHora'].forEach(function (k) { R[k] = (R[k] || []).filter(function (x) { return x.id !== t.id; }); });
    if (t.fecha && t.fecha >= d[0] && t.fecha <= finSemana()) R.tareas.push(t);
    if (t.estado === 'pendiente') {
      if (t.fecha && t.fecha < MK.hoy) R.atrasadas.push(t);
      if (!t.fecha) R.sinFecha.push(t);
      if (t.fecha && !t.hora && t.fecha >= d[0] && t.fecha <= finSemana()) R.sinHora.push(t);
    }
    indexar();
  }

  /* ═══ calendario ═══ */
  function pintarCal() {
    if (!R) return;
    var aj = R.ajustes || (MK.base && MK.base.ajustes) || {};
    var dias = semana();
    if (dias.indexOf(A.dia) < 0) A.dia = dias.indexOf(MK.hoy) >= 0 ? MK.hoy : dias[0];
    var lista = (R.tareas || []).filter(pasa);
    H0 = Math.floor(hm(aj.horaInicio || '07:00') / 60); H1 = Math.ceil(hm(aj.horaFin || '18:00') / 60);
    if (!(H1 > H0)) { H0 = 7; H1 = 18; }
    lista.forEach(function (t) { if (!t.hora) return; var a = hm(t.hora); H0 = Math.min(H0, Math.floor(a / 60)); H1 = Math.max(H1, Math.ceil((a + Math.max(Number(t.duracion) || 30, 30)) / 60)); });
    H1 = Math.min(H1, 24);
    var d0 = dias[0], d5 = dias[dias.length - 1];
    $('c-head').style.gridTemplateColumns = $('c-body').style.gridTemplateColumns = '52px repeat(' + dias.length + ',minmax(0,1fr))';
    $('c-tit').textContent = 'Semana del ' + MK.fechaCorta(d0) + ' al ' + MK.fechaCorta(d5) + ' ' + d5.slice(0, 4);
    $('c-fil').innerHTML = FILTROS.map(function (f) { return '<button class="chip' + (A.filtro === f[0] ? ' on' : '') + '" data-a="filtro" data-f="' + f[0] + '">' + f[1] + '</button>'; }).join('');
    var pendDia = function (s) { return lista.filter(function (t) { return t.fecha === s && t.estado === 'pendiente'; }).length; };
    $('c-dias').innerHTML = dias.map(function (s) {
      var n = pendDia(s);
      return '<button class="' + (s === A.dia ? 'on ' : '') + (s === MK.hoy ? 'hoy' : '') + '" data-a="dia" data-d="' + s + '">' + MK.fecha(s).split(' ')[0] + '<b>' + Number(s.slice(8)) + '</b>' + (n ? '<i title="' + n + ' pendientes"></i>' : '') + '</button>';
    }).join('');
    $('c-head').innerHTML = '<div></div>' + dias.map(function (s) {
      var n = pendDia(s);
      return '<div class="dh' + (s === MK.hoy ? ' hoy' : '') + '">' + MK.fecha(s).split(' ')[0] + (n ? '<small>' + n + ' pend.</small>' : '') + '<b>' + Number(s.slice(8)) + '</b></div>';
    }).join('');
    var hcol = '<div class="hcol">'; for (var h = H0; h < H1; h++) hcol += '<div class="hr" style="height:' + PX + 'px">' + (h === H0 ? '' : horaTxt(h)) + '</div>'; hcol += '</div>';
    var fondo = 'background-image:repeating-linear-gradient(to bottom,transparent 0,transparent ' + (PX - 1) + 'px,var(--line2) ' + (PX - 1) + 'px,var(--line2) ' + PX + 'px);';
    var cols = dias.map(function (s) {
      var evs = lista.filter(function (t) { return t.fecha === s && t.hora; }).sort(function (a, b) { return a.hora.localeCompare(b.hora); });
      var fin = [], grupo = [], html = '';
      /* columnas para las que se cruzan */
      var cerrarGrupo = function () { var nc = Math.max(1, fin.length); grupo.forEach(function (t) { t._nc = nc; }); grupo = []; fin = []; };
      evs.forEach(function (t) {
        var a = hm(t.hora), b = a + Math.max(Number(t.duracion) || 30, 30);
        if (fin.length && fin.every(function (f) { return f <= a; })) cerrarGrupo();
        var c = 0; while (fin[c] != null && fin[c] > a) c++; fin[c] = b; t._c = c; grupo.push(t);
      });
      cerrarGrupo();

  /* ═══ registrar actividad: primero la cuenta ═══ */
  function registrar() {
    var h = MK.hoja('<h2>Registrar actividad</h2><p class="muted small">Elige el tipo y busca la cuenta; después anotas qué pasó.</p>' +
      '<label class="lb">¿QUÉ FUE?</label>' + MK.chips('rtipo', ['llamada', 'visita', 'whatsapp', 'correo', 'reunion', 'nota'].map(function (k) { return [k, MK.ic(ICO[k], 14) + ' ' + MK.TIPOS[k]]; }), 'llamada') +
      '<label class="lb" for="rg-q">¿CON QUIÉN?</label><input class="in" id="rg-q" placeholder="Nombre, RUC o contacto" autocomplete="off" autofocus>' +
      '<div class="lst" id="rg-l" style="margin-top:6px;max-height:280px;overflow:auto"></div>' +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button></div>');
    MK.activarChips(h);
    var q = $('rg-q'), l = $('rg-l'), tt = null;
    q.oninput = function () {
      clearTimeout(tt); var v = q.value.trim(); if (v.length < 2) { l.innerHTML = ''; return; }
      l.innerHTML = '<div class="sub" style="padding:8px">Buscando…</div>';
      tt = setTimeout(function () {
        MK.api('api_crmBuscar', MK.pin, v).then(function (x) {
          if (q.value.trim() !== v) return;
          var res = (x && x.resultados) || [];
          if (!res.length) { l.innerHTML = '<div class="sub" style="padding:8px">Nada con «' + esc(v) + '».</div>'; return; }
          l.innerHTML = res.slice(0, 15).map(function (z, i) {
            return '<a href="#" class="it" data-i="' + i + '" style="color:var(--ink)">' + MK.ic(z.tipo === 'cliente' ? 'edificio' : z.tipo === 'oportunidad' ? 'embudo' : 'persona', 16) + '<div class="tx"><b>' + esc(z.nombre) + '</b><small>' + (z.tipo === 'cliente' ? 'Cliente' : z.tipo === 'oportunidad' ? 'Oportunidad' : 'Contacto') + (z.detalle ? ' · ' + esc(z.detalle) : '') + '</small></div></a>';
          }).join('');
          [].forEach.call(l.querySelectorAll('a'), function (a) {
            a.onclick = function (e) {
              e.preventDefault(); var z = res[+a.getAttribute('data-i')], tipo = MK.valorChips(h, 'rtipo');
              MK.cerrarHoja();
              if (z.tipo === 'contacto') { var p = String(z.detalle || '').split(' · '); MK.actividad({ tipo: tipo, ref: z.id, refTipo: z.refTipo || 'op', cuenta: p[p.length - 1] || z.nombre, contacto: z.nombre }); }
              else MK.actividad({ tipo: tipo, ref: z.id, refTipo: z.tipo === 'cliente' ? 'cli' : 'op', cuenta: z.nombre });
            };
          });
        }, function () { l.innerHTML = '<div class="sub" style="padding:8px">Sin conexión.</div>'; });
      }, 250);
    };
  }

  /* ═══ pestaña «Actividades»: el diario ═══ */
  function pintarFiltros() {
    if (!F.desde) { F.desde = MK.masDias(MK.hoy, -30); F.hasta = MK.hoy; }
    var tipos = [['', 'Todas'], ['llamada', 'Llamadas'], ['whatsapp', 'WhatsApp'], ['correo', 'Correos'], ['visita', 'Visitas'], ['reunion', 'Reuniones'], ['nota', 'Notas']];
    var ases = (MK.base.asesores || []);
    $('f-bar').innerHTML =
      '<div class="row w" style="width:100%" data-chips="ftipo">' + tipos.map(function (t) { return '<button type="button" class="chip' + (F.tipo === t[0] ? ' on' : '') + '" data-v="' + t[0] + '">' + (t[0] ? MK.ic(ICO[t[0]], 13) + ' ' : '') + t[1] + '</button>'; }).join('') + '</div>' +
      '<input class="in q" id="f-q" placeholder="Buscar en el texto, la cuenta o el contacto" value="' + esc(F.q) + '">' +
      '<label class="small muted" for="f-d">Del</label><input class="in" type="date" id="f-d" value="' + F.desde + '">' +
      '<label class="small muted" for="f-h">al</label><input class="in" type="date" id="f-h" value="' + F.hasta + '">' +
      (MK.usuario.rol !== 'mercadeo' || ases.length ? '<select class="sel" id="f-u" aria-label="Quién la registró"><option value="">Registradas por todos</option>' + ases.map(function (a) { return '<option' + (F.usuario === a.nombre ? ' selected' : '') + ' value="' + esc(a.nombre) + '">' + esc(a.nombre.trim()) + '</option>'; }).join('') + '</select>' : '');
    var g = $('f-bar').querySelector('[data-chips="ftipo"]');
    MK.activarChips($('f-bar')); g._cambio = function (v) { F.tipo = v; cargarActs(); };
    var tq = null; $('f-q').oninput = function () { clearTimeout(tq); tq = setTimeout(function () { F.q = $('f-q').value.trim(); pintarActs(); }, 200); };
    $('f-d').onchange = function () { F.desde = this.value; cargarActs(); };
    $('f-h').onchange = function () { F.hasta = this.value; cargarActs(); };
    if ($('f-u')) $('f-u').onchange = function () { F.usuario = this.value; cargarActs(); };
  }
  var seqAct = 0;
  function cargarActs() {
    var n = ++seqAct;
    if (F.desde && F.hasta && F.desde > F.hasta) { $('f-lista').innerHTML = '<div class="aviso am">La fecha «del» es después de la fecha «al».</div>'; $('f-res').textContent = ''; return; }
    MK.cargando('f-lista');
    MK.api('api_crmActividades', MK.pin, { desde: F.desde, hasta: F.hasta, tipo: F.tipo, usuario: F.usuario, limite: 1000 }).then(function (r) {
      if (n !== seqAct) return;
      if (!r || !r.ok) throw new Error((r && r.error) || 'No se pudo leer el diario.');
      ACTS = r.actividades || []; TOTAL = r.total || ACTS.length; pintarActs();
    }).catch(function (e) { if (n === seqAct) MK.error('f-lista', e.message || 'Sin conexión.'); });
  }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function pintarActs() {
    if (!ACTS) return;
    var q = norm(F.q);
    var l = q ? ACTS.filter(function (a) { return norm([a.cuenta, a.texto, a.contacto, a.resultado, a.usuario, a.ref].join(' ')).indexOf(q) >= 0; }) : ACTS;
    $('f-res').innerHTML = l.length + ' actividad' + (l.length === 1 ? '' : 'es') + (q ? ' con «' + esc(F.q) + '»' : '') + ' · del ' + esc(MK.fecha(F.desde)) + ' al ' + esc(MK.fecha(F.hasta)) + (TOTAL > ACTS.length ? ' · se muestran las ' + ACTS.length + ' más recientes de ' + TOTAL + '; acorta las fechas para ver el resto' : '');
    if (!l.length) { $('f-lista').innerHTML = MK.vacio(ACTS.length ? 'Nada coincide con la búsqueda.' : 'No hay actividades en esas fechas.'); return; }
    var h = '', dia = '';
    var cuenta = {}; l.forEach(function (a) { cuenta[a.fecha] = (cuenta[a.fecha] || 0) + 1; });
    l.forEach(function (a) {
      if (a.fecha !== dia) { dia = a.fecha; h += '<div class="dia">' + esc(MK.cuando(dia) === 'hoy' ? 'Hoy' : MK.cuando(dia) === 'ayer' ? 'Ayer' : MK.fechaLarga(dia).replace(/ de \d{4}$/, '')) + ' <span>' + cuenta[dia] + '</span></div>'; }
      h += '<div class="ent"><div class="tipoic">' + MK.ic(ICO[a.tipo] || 'nota', 16) + '</div><div style="min-width:0"><div class="cab"><b>' + (a.ref ? cuentaHtml(a) : esc(a.cuenta || 'Sin cuenta')) + '</b><span class="tag t-gris">' + esc(MK.TIPOS[a.tipo] || a.tipo) + '</span>' + (a.contacto ? '<span class="small muted">con ' + esc(a.contacto) + '</span>' : '') + '<span class="h">' + esc(a.hora) + '</span></div>' +
        '<p data-a="expandir" title="Tocar para ver completo">' + esc(String(a.texto || '').replace(/\n\s*\n+/g, '\n')) + '</p><div class="pie">' + (a.resultado ? '<span class="tag ' + (/no le interesa|no contest/i.test(a.resultado) ? 't-warn' : /interes|propuesta|firm|positiv/i.test(a.resultado) ? 't-ok' : 't-gris') + '">' + esc(a.resultado) + '</span>' : '') +
        '<span>' + esc(a.usuario) + '</span>' + (a.tareaId ? '<span>· cerró una tarea</span>' : '') + (a.plantilla ? '<span>· con plantilla</span>' : '') + '</div></div></div>';
    });
    $('f-lista').innerHTML = h;
  }

  /* ═══ clics ═══ */
  function clic(e) {
    var b = e.target.closest('[data-a]'); if (!b || !$('main').contains(b)) return;
    var a = b.getAttribute('data-a');
    if (b.tagName === 'A') e.preventDefault();
    if (Date.now() - SUPRIMIR < 350 && (a === 'ver' || a === 'slot')) return;
    if (SOLO_VER && (a === 'nueva' || a === 'registrar' || a === 'slot')) return;
    if (a === 'ficha') { e.stopPropagation(); irRef(b.getAttribute('data-rt'), b.getAttribute('data-ref')); return; }
    if (a === 'expandir') { b.classList.add('todo'); return; }
    if (a === 'ver') { verTarea(b.getAttribute('data-id')); return; }
    if (a === 'tab') { A.vista = b.getAttribute('data-v'); pintarTabs(); try { history.replaceState(null, '', A.vista === 'act' ? '?vista=actividades' : location.pathname); } catch (x) {} return; }
    if (a === 'sem') { A.lunes = MK.masDias(A.lunes, +b.getAttribute('data-n')); A.dia = A.lunes; R = null; MK.cargando('c-body'); cargar(); return; }
    if (a === 'hoy') { A.lunes = MK.lunes(MK.hoy); A.dia = MK.hoy; pintarCal._una = 0; cargar(); return; }
    if (a === 'filtro') { A.filtro = b.getAttribute('data-f'); pintarCal(); return; }
    if (a === 'dia') { A.dia = b.getAttribute('data-d'); pintarCal(); return; }
    if (a === 'nueva') { MK.tarea({ fecha: A.vista === 'cal' && cel() ? A.dia : MK.hoy }); return; }
    if (a === 'registrar') { registrar(); return; }
    if (a === 'slot') { MK.tarea({ fecha: b.getAttribute('data-d'), hora: b.getAttribute('data-hora') }); return; }
    if (a === 'ics-semana') {
      if (!R) return;
      var l = (R.tareas || []).filter(function (t) { return t.estado === 'pendiente' && pasa(t); });
      if (!l.length) { MK.aviso('No hay tareas pendientes esta semana.'); return; }
      bajarIcs(l, 'agenda-' + semana()[0] + '.ics');
      MK.aviso('Se descargaron ' + l.length + ' tareas: ábrelo para agregarlas a tu calendario.');
      return;
    }
  }
  /* clic en una franja vacía del calendario: tarea nueva con ese día y hora */
  function clicFranja(e) {
    var col = e.target.classList && e.target.classList.contains('dcol') ? e.target : null;
    if (!col || SOLO_VER || Date.now() - SUPRIMIR < 350) return;
    var r = col.getBoundingClientRect(), m = H0 * 60 + Math.floor((e.clientY - r.top) / PX * 2) * 30;
    MK.tarea({ fecha: col.getAttribute('data-dia'), hora: mhm(Math.max(H0 * 60, Math.min(H1 * 60 - 30, m))) });
  }

  var SOLO_VER = false;
  MK.iniciar('agenda', function (base) {
    SOLO_VER = base.usuario.rol === 'gerente';
    if (SOLO_VER) document.body.classList.add('solo-ver');
    A.lunes = MK.lunes(MK.hoy); A.dia = MK.hoy;
    A.quien = base.usuario.rol === 'mercadeo' ? 'mias' : 'todos';
    A.vista = MK.param('vista') === 'actividades' ? 'act' : 'cal';
    esqueleto();
    $('c-body').addEventListener('click', clicFranja);
    cargar();
    window.addEventListener('mk:cambio', function () { cargar(); if (ACTS) cargarActs(); });
    var mq = window.matchMedia('(max-width:700px)'), alCambiar = function () { if (R) pintarCal(); };
    if (mq.addEventListener) mq.addEventListener('change', alCambiar); else if (mq.addListener) mq.addListener(alCambiar);
    setInterval(lineaAhora, 60000);
  });
})();
</script>
</body>
</html>
