  escritura:/^api_(crm(Guardar|Completar|Anular|Captura|Mover|Reasignar|Borrar|Subir|Usar)|guardar|marcar|abrir|cerrar|registrar|borrar|eliminar|crear|actualizar|enviar|corregir|dar|anular|confirmar|aprobar|rechazar|subir|asignar|mover|cambiar|agregar|nuevo|editar|reabrir|emitir|pasar|pedir)/i};</script>

<style>
/* ── Clientes · api 3.55: la página por empresa, con buscador, cifras y «Para hoy» (Maqueta_clientes_pagina) ── */
.sysbar .srch{min-width:0}
.c-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.c-top h1{font-size:24px;margin:0}.c-top .sp{flex:1}
.mas-m{position:relative}
.mas-m .menu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px rgba(15,33,64,.14);padding:6px;min-width:260px;z-index:30;display:none}
.mas-m .menu.si{display:block}
.mas-m .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font:600 13px Archivo,sans-serif;color:var(--ink);cursor:pointer}
.mas-m .menu button:hover{background:#f4f7fc}.mas-m .menu small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:1px}
.mas-m .menu button[disabled]{opacity:.5;cursor:default}
/* buscador */
.c-sti{position:sticky;top:58px;z-index:20;background:var(--bg,#f3f5f8);padding:6px 0 8px}
.c-bus{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--navy2);border-radius:14px;padding:4px 6px 4px 14px;color:var(--navy2)}
.c-bus input{flex:1;border:0;outline:0;font:500 16px Archivo,sans-serif;padding:10px 0;min-width:0;background:transparent;color:var(--ink)}
.c-bus .k{font-size:11px;color:var(--muted2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.c-bus .x{border:0;background:none;font-size:20px;color:var(--muted2);cursor:pointer;padding:0 8px}
.c-res{font-size:13px;color:var(--muted);margin:6px 2px 0}.c-res b{color:var(--ink)}
.c-res:empty{display:none}
/* cifras y para hoy */
.c-sum{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.c-sum button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font:500 12.5px Archivo,sans-serif;color:var(--muted);cursor:pointer;text-align:left}
.c-sum button b{font-size:15px;color:var(--ink);margin-right:4px}
.c-sum button.on{border-color:var(--navy2);box-shadow:inset 0 0 0 1px var(--navy2);background:#f5f8fd}
.c-sum button.rj b{color:var(--bad)}.c-sum button.fijo{cursor:default}
.c-hoy{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.c-hoy:empty{display:none}
.c-hoy>span{font-size:11px;letter-spacing:.7px;font-weight:700;color:var(--muted2);margin-right:4px}
.c-hoy button{display:inline-flex;gap:6px;align-items:center;border:1px solid #f0dcaa;background:#fff8e6;border-radius:999px;padding:6px 12px;font:600 12.5px Archivo,sans-serif;color:#5a4100;cursor:pointer}
.c-hoy button.rj{border-color:#f3c2c4;background:#fdeff0;color:#8c1d22}
.c-hoy button.az{border-color:#cfdcf3;background:#eef3fc;color:#1d3f86}
.c-hoy button.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.c-hoy button b{font-weight:800}
.c-trab{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:13px;line-height:1.45}
.c-trab .tx{flex:1;min-width:0}.c-trab b{display:block;font-size:14px}
.c-trab .x{border:0;background:none;font-size:18px;color:var(--muted2);cursor:pointer}
/* filtros */
.c-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.c-chips{display:contents}.c-chips a{align-self:center}
.chip.f{background:#eaf0fb;border-color:#c9d6ef;color:var(--navy2)}
.c-ord{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.c-ord select{width:auto;padding:6px 8px}
.c-fx{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.c-fx.si{display:grid}.c-fx .lb{margin:0 0 3px}.c-fxb{align-self:end}
.c-ley{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.c-ley i{display:inline-block;width:12px;height:8px;border-radius:3px;margin-right:5px}
.c-ley u{display:inline-block;width:2px;height:12px;background:var(--ink);margin-right:5px;vertical-align:-2px}
/* lista */
.c-l{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.c-h,.c-r{display:grid;grid-template-columns:30px minmax(0,2.3fr) minmax(0,1.1fr) minmax(0,.9fr) minmax(0,.8fr) minmax(0,1.1fr) 74px;gap:12px;align-items:center;padding:11px 14px}
.c-h{font-size:11px;letter-spacing:.7px;font-weight:700;color:var(--muted2);border-bottom:1px solid var(--line);background:#fafbfd}
.c-r{border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}.c-r:last-child{border:0}
.c-r:hover{background:var(--hover,#f7f9fd)}
.c-r .nm{min-width:0}
.c-r .nm a.ir{font-weight:700;font-size:14.5px;color:var(--ink);text-decoration:none}
.c-r .nm a.ir:hover,.c-r .nm a.ir:focus-visible{color:var(--navy2);text-decoration:underline;text-underline-offset:3px}
.c-r .nm small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-r.sd{background:#fafbfd}.c-r.sd .nm a.ir{font-weight:600;font-size:13.5px}
.c-r.sd .nm{padding-left:14px;border-left:2px solid var(--line)}
.c-r.hl{background:#fff8e1}.c-r.sel{background:#eef3fb}.c-r.baja .nm a.ir{color:var(--muted)}
.c-r .falta{color:#8a5a00}
.c-r .tr{display:flex;flex-direction:column;gap:6px;margin-top:6px;white-space:normal}
.c-r .tr .ac{display:flex;gap:6px;flex-wrap:wrap}
.c-r .c1 input{width:16px;height:16px;accent-color:var(--navy2)}
.c-chev{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--navy2);padding:0;transition:transform .15s}
.c-chev.ab{transform:rotate(90deg)}
.c-r .act{display:flex;gap:4px;justify-content:flex-end}
.c-r .c5,.c-r .c5 *{white-space:nowrap}
.c-sin{padding:26px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px}
.sal{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.kgtx{font-size:11.5px;color:var(--muted);margin-top:2px}
.kb{position:relative;display:block;height:8px;border-radius:4px;background:#e9edf3;width:100%;max-width:150px;margin-bottom:5px}
.kb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#14306b}
.kb i.so{background:#3b6fd4}.kb i.ba{background:#a9b3c2}
.kb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.kbt{font-size:12.5px}.kb-so{color:#2456b8!important;font-weight:600}.kb-ba{color:#8a5a00!important}
.kbw{display:inline-block;width:70px;vertical-align:middle}.kbw .kb{margin:0}
.mob{display:none;font-size:12.5px;color:var(--ink);margin-top:6px;line-height:1.5;white-space:normal}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--navy2);cursor:pointer;padding:0}
.ib:hover{border-color:#9db4d8}
.mas{padding:10px;text-align:center;border-top:1px solid var(--line2)}
.bulk{display:none;position:sticky;top:132px;z-index:15;box-shadow:0 6px 18px rgba(15,33,64,.18);align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy2);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:600}
.bulk.si{display:flex}.bulk .btn{background:#fff}.bulk .btn.gh{background:none;color:#fff}

.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 12px;font-size:13px;margin-top:10px}
.kv>span{color:var(--muted)}
.kv>b{font-weight:600;overflow-wrap:anywhere;min-width:0}
.lado h2{font-size:18px;margin:2px 36px 2px 0;line-height:1.25}
.lado .card{padding:12px}
.lado .card+.card{margin-top:12px}
.por{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:3px 0}
.sugerido{margin-top:10px;padding:8px 10px;background:#f4f7fb;border-radius:9px;font-size:12.5px}
.her{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line2)}
.her:last-child{border:0}.her:hover b{color:var(--navy2)}
.av.sm{width:26px;height:26px;font-size:10px}

/* altas enviadas */
.sol{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sol.ok{border-left-color:var(--ok)}.sol.bad{border-left-color:var(--bad)}.sol.gris{border-left-color:var(--gris)}
.sol .top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sol .top b{font-size:14.5px}
.sol .det{font-size:12.5px;color:var(--muted);margin-top:3px}
.sol .mot{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--bad-bg);color:#8c1d22;font-size:13px}
.sol .ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.elige{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.elige button{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer;font:inherit;color:inherit}
.elige button:hover{border-color:var(--navy2)}
.elige b{display:flex;gap:8px;align-items:center;color:var(--navy2);font-size:14px}
.elige small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.45}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ayuda{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.req{color:var(--bad)}
.fq .it{display:flex;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line2)}

@media(max-width:1000px){.c-fx{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
  .c-h,.c-ley{display:none}
  .c-r{grid-template-columns:28px minmax(0,1fr) auto;gap:8px;padding:12px 10px;align-items:start}
  .c-r>.c3,.c-r>.c4,.c-r>.c5,.c-r>.c6{display:none}.c-r>.c7{grid-column:3;grid-row:1}
  .c-r .nm small{white-space:normal}.mob{display:block}
  .c-bus .k{display:none}.c-ord{margin-left:0}
  .c-sum,.c-hoy{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .c-sum button,.c-hoy button{flex:none;white-space:nowrap}
  .bulk{top:124px}
  .elige,.fila2{grid-template-columns:1fr}
}
@media(max-width:560px){.c-fx{grid-template-columns:1fr}.c-top h1{font-size:21px}.c-top .bt-txt{display:none}}
</style>

<body class="mk">
<script src="cargador.js" data-modulo="Mercadeo"></script>
<div id="sysbar"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"><div class="cargando">Cargando…</div></main></div>
<script>
(function () {
  var E = MK.esc, D = MK.dinero, N = MK.num, IC = MK.ic;
  var CRM = null, CAR = null, ALTA = null, LISTA = [], POR_ID = {};
  var TAB = 'cartera', SELEC = false, ELEGIDOS = {}, ABIERTOS = {}, TOPE = 120;
  var F = nuevoF();
  var ROL = '';

  function nuevoF() { return { q: '', salud: '', region: '', sit: '', estado: '', ficha: '', frec: '', bajas: false, kpi: '', hoy: '', ord: 'at' }; }

  /* ── niveles y situaciones ── */
  var NIV = { sano: ['Sano', 'ok'], atencion: ['Atención', 'warn'], riesgo: ['En riesgo', 'bad'], crecer: ['Puede crecer', 'info'] };
  var PESO = { riesgo: 0, atencion: 1, crecer: 2, sano: 3, baja: 4 };
  var SIT_TX = { activo: 'Activo', mora: 'Suspendido por mora', pausa: 'En pausa', cierre: 'De baja', retiro: 'Retirado' };
  function sitDe(c) { var s = String((c._car && c._car.situacion) || c.situacion || '').trim().toLowerCase(); return s || 'activo'; }
  function grupoSit(c) { var s = sitDe(c); return s === 'mora' || s === 'pausa' ? 'susp' : (s === 'cierre' || s === 'retiro' ? 'baja' : 'activo'); }
  function nivel(c) { return grupoSit(c) === 'baja' ? 'baja' : ((c.salud && c.salud.nivel) || 'sano'); }
  function titulo(s) { s = String(s || '').trim().toLowerCase(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
  function norm(s) { return String(s || '').trim().toLowerCase(); }
  function nombreCorto(c) { var n = c.nombre; if (c.cuenta) { var r = n.replace(new RegExp('^' + c.cuenta.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*-\\s*', 'i'), ''); if (r && r !== n) return r; } return n; }

  function salB(c) {
    if (nivel(c) === 'baja') return '<span class="sal"><span class="dot d-gris"></span>De baja</span>';
    var n = NIV[nivel(c)] || NIV.sano;
    return '<span class="sal"><span class="dot d-' + n[1] + '"></span>' + n[0] + ' <span class="sc num">' + (c.salud ? c.salud.puntos : '') + '</span></span>';
  }
  function motivo(c) {
    if (nivel(c) === 'baja') { var cr = c._car || {}; return 'De baja' + (cr['fecha baja'] ? ' desde ' + MK.fechaCorta(cr['fecha baja']) : '') + (cr['motivo baja'] ? ' · ' + cr['motivo baja'] : ''); }
    if (grupoSit(c) === 'susp') return SIT_TX[sitDe(c)] + ((c._car && c._car['motivo baja']) ? ': ' + c._car['motivo baja'] : '');
    var m = (c.salud && c.salud.motivos) || [];
    return m.length ? m[0] + (m.length > 1 ? ' (+' + (m.length - 1) + ')' : '') : 'Todo en orden';
  }
  function kgN(v) { return v > 0 && v < 10 ? N(v, 1).replace(/\.0$/, '') : N(v); }
  function kgB(kg, plan) {
    if (!plan) return '<div class="kgtx num">' + kgN(kg) + ' kg/mes · sin plan en la ficha</div>';
    var ra = kg / plan, w = Math.min(ra, 1.6) / 1.6 * 100, pl = 1 / 1.6 * 100;
    return '<div class="kgbar" title="' + N(kg) + ' kg al mes (promedio de 90 días) contra un plan de ' + N(plan) + ' kg"><i class="' + (ra >= 1.2 ? 'over' : ra < 0.5 ? 'low' : '') + '" style="width:' + w + '%"></i><u style="left:' + pl + '%"></u></div>' +
      '<div class="kgtx num">' + kgN(kg) + ' / ' + N(plan) + ' kg · ' + Math.round(ra * 100) + ' %</div>';
  }
  function conT(c) {
    var cr = c._car || {};
    if (cr.esEspecial) return '<span class="tag t-gris">Servicio especial</span>';
    if (c.diasVence === null || c.diasVence === undefined || c.diasVence === '') return '<span class="tag t-gris">Sin fecha</span>';
    if (c.diasVence < 0) return '<span class="tag t-bad">Vencido</span>';
    if (c.diasVence <= 60) return '<span class="tag t-warn">Vence en ' + c.diasVence + ' d</span>';
    return '<span class="tag t-ok">Vigente</span>';
  }
  function sugerencia(c) {
    var s = c.salud || {}, kg = c.kgMes || 0, pl = c.planKg || 0;
    if (s.pago && s.pago !== 'ok') return 'Poner al día el saldo vencido antes de renovar';
    if (s.kilos === 'crecer') return 'Renovar con plan de ' + N(Math.ceil(kg * 1.1 / 5) * 5) + ' kg (hoy ' + N(pl) + ' kg)';
    if (s.kilos === 'ojo' && kg > 0) return 'Ofrecer plan de ' + N(Math.max(5, Math.ceil(kg * 1.2 / 5) * 5)) + ' kg antes de que lo pida';
    return 'Renovar con el mismo plan y el ajuste anual';
  }

  /* ── carga ── */
  MK.iniciar('clientes', function (base) {
    ROL = (base.usuario && base.usuario.rol) || '';
    if (/^#altas/.test(location.hash)) TAB = 'altas';
    pintarEsqueleto();
    cargar();
    if (ROL !== 'gerente') cargarAltas();
    window.addEventListener('mk:cambio', function () { cargar(); if (TAB === 'altas' || ALTA) cargarAltas(); });
  });

  function pintarEsqueleto() {
    var m = document.getElementById('main');
    m.innerHTML = '<div class="c-top"><h1>Clientes</h1><span class="sp"></span>' +
      '<button class="btn" id="bt-exp" title="Descarga en Excel lo que se ve en la lista">' + IC('bajar', 16) + '<span class="bt-txt">Exportar</span></button>' +
      (ROL !== 'gerente' ? '<span class="mas-m"><button class="btn" id="bt-mas2" aria-haspopup="true" title="Más">⋯ <span class="bt-txt">Más</span></button><div class="menu" id="mn-mas"></div></span>' +
        '<button class="btn pri" id="bt-nuevo">' + IC('mas', 16) + 'Cliente nuevo</button>' : '') + '</div>' +
      '<div class="tabs" id="tabs"></div>' +
      '<section id="p-cartera"><div class="cargando">Cargando la cartera…</div></section>' +
      '<section id="p-altas" hidden><div class="cargando">Cargando…</div></section>';
    document.getElementById('bt-exp').onclick = exportar;
    var bn = document.getElementById('bt-nuevo'); if (bn) bn.onclick = clienteNuevo;
    var bmas = document.getElementById('bt-mas2'); if (bmas) bmas.onclick = function (e) { e.stopPropagation(); menuMas(); };
    document.addEventListener('click', function (e) { var mn = document.getElementById('mn-mas'); if (mn && !e.target.closest('.mas-m')) mn.classList.remove('si'); });
    pintarTabs();
  }
  /* «⋯ Más»: lo que se usa de vez en cuando */
  function menuMas() {
    var mn = document.getElementById('mn-mas'); if (!mn) return;
    if (mn.classList.contains('si')) { mn.classList.remove('si'); return; }
    var ded = !!(CAR && CAR.puedeTarifas);
    mn.innerHTML = '<button type="button" id="mn-agr">Agrupar sedes en una empresa<small>Marcar varias sedes y juntarlas, o sacarlas de su empresa</small></button>' +
      '<button type="button" id="mn-ded"' + (ded ? '' : ' disabled') + '>Deducir fechas de inicio del histórico<small>' + (ded ? 'Para las fichas sin «inicio de recolección»' : 'Lo hace quien maneja las tarifas') + '</small></button>';
    mn.classList.add('si');
    document.getElementById('mn-agr').onclick = function () { mn.classList.remove('si'); if (TAB !== 'cartera') { TAB = 'cartera'; verTab(); } SELEC = true; ELEGIDOS = {}; pintarLista(); };
    document.getElementById('mn-ded').onclick = function () { mn.classList.remove('si'); deducirInicios(); };
  }
  /* Una devuelta ya corregida sigue DEVUELTA en la hoja: se reconoce porque
     después se envió otra del mismo cliente. */
  function marcarReenviadas(l) {
    l.forEach(function (s, i) {
      if (String(s.estado).toUpperCase() !== 'DEVUELTA') return;
      var nueva = l.filter(function (x, j) { return x !== s && norm(x.empresa) === norm(s.empresa) && (x.fechaSolicitud > s.fechaSolicitud || (x.fechaSolicitud === s.fechaSolicitud && j < i)); })[0];
      s._reenviada = nueva ? nueva.fechaSolicitud : '';
    });
  }
  function pintarTabs() {
    var mias = (ALTA && ALTA.mias) || []; marcarReenviadas(mias);
    /* api 3.31: el número es lo que te toca atender (devueltas y por iniciar) */
    var dev = ALTAS && ALTAS.cuentas ? ALTAS.cuentas.accion : mias.filter(function (s) { return String(s.estado).toUpperCase() === 'DEVUELTA' && !s._reenviada; }).length;
    var emps = {}; LISTA.forEach(function (c) { if (grupoSit(c) !== 'baja') emps[c.cuenta || ('#' + c.id)] = 1; });
    var t = [['cartera', 'Cartera', CRM ? Object.keys(emps).length : '']];

  /* ═══ api 3.55 · la página de Clientes (Maqueta_clientes_pagina, aprobada el 27 oct con las dudas en A) ═══
     Arriba solo lo de todos los días: el buscador (pegado al bajar), una fila de cifras que filtran y «Para hoy»
     (listas de trabajo con su botón en cada fila). Los filtros van escondidos y se ven como etiquetas con ✕.
     La lista va por empresa: su nombre abre la hoja de la empresa, la flecha despliega sus sedes y cada sede
     abre su hoja; el ojito abre el vistazo de al lado. */

  /* ── búsqueda: sin tildes, palabras en cualquier orden, números sin guiones ── */
  function sinT(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function soloDig(s) { return String(s || '').replace(/\D/g, ''); }
  function palabras() { return sinT(F.q).split(/\s+/).filter(Boolean); }
  function textoDe(c) { return [c.nombre, c.razon, c.ruc, c.contacto, c.telefono, c.correo, c.cuenta].concat(c.alias || []).join(' '); }
  function encaja(txt, P) {
    P = P || palabras(); if (!P.length) return true;
    var t = sinT(txt), d = soloDig(txt);
    return P.every(function (p) { return t.indexOf(p) >= 0 || (soloDig(p).length >= 3 && soloDig(p) === p.replace(/[\s.-]/g, '') && d.indexOf(soloDig(p)) >= 0); });
  }
  function resal(txt) {
    txt = String(txt || ''); var P = palabras(); if (!P.length) return E(txt);
    var t = sinT(txt), m = [];
    P.forEach(function (p) { var i = t.indexOf(p); if (i >= 0) m.push([i, i + p.length]); });
    if (!m.length) return E(txt);
    m.sort(function (a, b) { return a[0] - b[0]; });
    var out = '', k = 0;
    m.forEach(function (x) { if (x[0] < k) return; out += E(txt.slice(k, x[0])) + '<mark>' + E(txt.slice(x[0], x[1])) + '</mark>'; k = x[1]; });
    return out + E(txt.slice(k));
  }

  function pasa(c, sinKpi) {
    var gs = grupoSit(c);
    if (!F.bajas && gs === 'baja' && F.sit !== 'baja' && F.kpi !== 'baja') return false;
    if (F.salud && nivel(c) !== F.salud) return false;
    if (F.region) { var rg = norm(c.region); if (norm(F.region) === 'sin región' ? (rg && rg !== 'sin región') : rg !== norm(F.region)) return false; }
    if (F.sit && gs !== F.sit) return false;
    if (F.estado && norm(c.estado) !== norm(F.estado)) return false;
    if (F.frec && norm(c.frecuencia) !== norm(F.frec)) return false;
    if (F.ficha) {
      var fl = faltanDe(c), cr = c._car || {};
      if (F.ficha === 'falta' && !fl.length) return false;
      if (F.ficha === 'sininicio' && cr['inicio recoleccion']) return false;
      if (F.ficha === 'sininicio' && !CAR && (c.faltan || []).indexOf('inicio') < 0) return false;
      if (F.ficha === 'sinruc' && c.ruc) return false;
      if (F.ficha === 'vencido' && !(c.diasVence !== null && c.diasVence < 0)) return false;
      if (F.ficha === 'porvencer' && !(c.diasVence !== null && c.diasVence >= 0 && c.diasVence <= 60)) return false;
      if (F.ficha === 'sinvenc' && (c.vencimiento || cr.esEspecial)) return false;
    }
    if (!sinKpi && F.kpi) {
      if (F.kpi === 'cobrar' && !(c.saldo > 0)) return false;
      if (F.kpi === 'vencido' && !(c.vencido > 0)) return false;
      if (F.kpi === 'susp' && gs !== 'susp') return false;
      if (F.kpi === 'baja' && gs !== 'baja') return false;
    }
    if (F.hoy && HOYS[F.hoy] && !HOYS[F.hoy].f(c)) return false;
    if (F.q && !encaja(textoDe(c))) return false;
    return true;
  }

      var i = L.indexOf(a);
      var x = '<div class="sol ' + (a.tono === 'bad' ? 'bad' : a.g === 'marcha' || a.g === 'plan' ? 'ok' : '') + '"><div class="top"><div style="flex:1;min-width:200px"><b>' + E(a.empresa) + '</b><div class="det">' + E(a.desc) + '</div></div>' +
        '<span class="tag t-' + E(a.tono || 'gris') + '">' + E(a.estado) + '</span></div>' + camino(a) +
        '<div class="al-q"><b>Qué pasa ahora:</b> ' + E(a.que) + '</div>';
      if (a.dev) x += '<div class="al-box rj"><b>Qué tienes que corregir:</b> ' + (a.corregir && a.corregir.length ? E(a.corregir.map(function (c) { return c.t; }).join(' · ').toLowerCase()) : 'ver la nota') + '.' + (a.motivo ? ' Nota de Logística: «' + E(a.motivo) + '».' : '') + '</div>';
      if (a.porIniciar) x += '<div class="al-box am"><b>Por iniciar · sin fecha de ' + (a.unica ? 'visita' : 'primera recolección') + '.</b>' +
        (a.ultimo ? ' Último contacto: ' + E(a.ultimo.fecha) + ', ' + E(a.ultimo.tipo) + ' — «' + E(a.ultimo.texto) + '».' : ' Sin contactos anotados todavía.') +
        (a.siguiente ? ' Próximo seguimiento: ' + E(a.siguiente.fecha) + '.' : '') +
        '<div class="row w" style="gap:8px;margin-top:8px;align-items:flex-end"><button class="btn sm" data-ll="' + i + '">' + IC('telefono', 14) + 'Anotar llamada</button><span style="flex:1"></span>' +
        '<div><label class="lb" for="al-f' + i + '" style="margin:0 0 2px">YA TIENE FECHA</label><input class="in" type="date" id="al-f' + i + '" min="' + E(MK.hoy) + '" style="max-width:170px"></div><button class="btn sm pri" data-fe="' + i + '">Avisar a Logística</button></div></div>';
      if (a.g === 'plan') x += '<div class="al-box vd">Listo de tu lado: ya está en ruta. Sale de tu seguimiento; queda en «Todas» como historial.</div>';
      x += '<div class="ac">' +
        (a.dev && ROL !== 'gerente' ? '<button class="btn sm pri" data-cor="' + i + '">' + IC('lapiz', 14) + 'Corregir y reenviar</button>' : '') +
        (a.codigoPropuesta ? '<button class="btn sm" data-op="' + E(a.codigoPropuesta) + '">' + IC('embudo', 14) + 'Abrir la oportunidad</button>' : '') +
        (a.clienteId ? '<button class="btn sm" data-cli="' + E(a.clienteId) + '">' + IC('persona', 14) + 'Abrir la ficha del cliente</button>' : '') + '</div></div>';
      return x;
    }).join('');
    p.innerHTML = h;
    document.getElementById('al-nueva').onclick = function () { formAlta(null); };
    [].forEach.call(p.querySelectorAll('[data-f]'), function (b) { b.onclick = function () { AL_FIL = b.getAttribute('data-f'); pintarAltas(); }; });
    [].forEach.call(p.querySelectorAll('[data-cor]'), function (b) { b.onclick = function () { formAlta(L[+b.getAttribute('data-cor')]); }; });
    [].forEach.call(p.querySelectorAll('[data-op]'), function (b) { b.onclick = function () { MK.irOportunidad(b.getAttribute('data-op')); }; });
    [].forEach.call(p.querySelectorAll('[data-cli]'), function (b) { b.onclick = function () { MK.irCliente(b.getAttribute('data-cli')); }; });
    [].forEach.call(p.querySelectorAll('[data-ll]'), function (b) { b.onclick = function () { anotarLlamada(L[+b.getAttribute('data-ll')]); }; });
    [].forEach.call(p.querySelectorAll('[data-fe]'), function (b) { b.onclick = function () {
      var k = +b.getAttribute('data-fe'), a = L[k], f = document.getElementById('al-f' + k).value;
      if (!f) { MK.aviso('Elige la fecha que dio el cliente.'); return; }
      MK.ocupado(b, true, 'Avisando…');
      MK.api('api_altaAvisarFecha', MK.pin, a.solicitudId, f).then(function (r) {
        MK.ocupado(b, false);
        if (!r || !r.ok) { MK.aviso((r && r.error) || 'No se pudo avisar.'); return; }
        MK.aviso('Listo: Logística recibió el aviso para ponerlo en ruta el ' + MK.fecha(f));
        cargarAltas();
      }, function (e) { MK.ocupado(b, false); MK.aviso('Sin conexión: ' + e.message); });
    }; });
  }
  function anotarLlamada(a) {
    MK.hoja('<h2>Anotar seguimiento · ' + E(a.empresa) + '</h2><p class="small muted">Queda en la historia del cliente. Si quedaste de volver a llamar, pon la fecha y sale en tu agenda.</p>' +
      '<label class="lb" for="ll-tipo">CÓMO</label><select class="sel" id="ll-tipo"><option value="llamada">Llamada</option><option value="whatsapp">WhatsApp</option><option value="correo">Correo</option><option value="visita">Visita</option></select>' +
      '<label class="lb" for="ll-txt">QUÉ DIJO EL CLIENTE</label><textarea class="in" id="ll-txt" placeholder="Ej.: espera el permiso del MINSA; llama el jueves"></textarea>' +
      '<label class="lb" for="ll-prox">PRÓXIMO SEGUIMIENTO (OPCIONAL)</label><input class="in" type="date" id="ll-prox" min="' + E(MK.hoy) + '" style="max-width:180px">' +
      '<div id="ll-msg" class="small" style="margin-top:8px;color:var(--bad)"></div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="ll-ok">Guardar</button></div>');
    document.getElementById('ll-ok').onclick = function () {
      var b = this, t = document.getElementById('ll-txt').value.trim();
      if (!t) { document.getElementById('ll-msg').textContent = 'Escribe qué te dijo el cliente.'; return; }
      MK.ocupado(b, true, 'Guardando…');
      MK.api('api_altaAnotar', MK.pin, a.solicitudId, { tipo: document.getElementById('ll-tipo').value, texto: t, proximo: document.getElementById('ll-prox').value }).then(function (r) {
        MK.ocupado(b, false);
        if (!r || !r.ok) { document.getElementById('ll-msg').textContent = (r && r.error) || 'No se pudo guardar.'; return; }
        MK.cerrarHoja(); MK.aviso('Anotado'); cargarAltas();
      }, function (e) { MK.ocupado(b, false); document.getElementById('ll-msg').textContent = 'Sin conexión: ' + e.message; });
    };
  }

  /* El mismo formulario del alta de Alta.html. Con una devuelta, sale lleno
     con lo que se envió (incluida la ficha comercial) para corregir y reenviar. */
  function formAlta(s) {
    var go = function () {
      s = s || {};
      var zonas = (ALTA && ALTA.zonas) || [], frs = (ALTA && ALTA.frecuencias) || [];
      function opc(l, v) { var h = '<option value="">Elegir…</option>', vv = String(v || ''); if (vv && l.indexOf(vv) < 0) h += '<option selected>' + E(vv) + '</option>'; return h + l.map(function (o) { return '<option' + (o === vv ? ' selected' : '') + '>' + E(o) + '</option>'; }).join(''); }
      function inp(id, et, v, extra) { return '<div><label class="lb" for="fa-' + id + '">' + et + '</label><input class="in" id="fa-' + id + '" value="' + E(v || '') + '"' + (extra || '') + '></div>'; }
      var dev = s.solicitudId && String(s.estado).toUpperCase() === 'DEVUELTA';
      /* api 3.31: lo que Logística marcó para corregir sale en rojo; la visita única pide su fecha y no frecuencia */
      var COR = {}; (s.corregir || []).forEach(function (c) { COR[c.k || c] = 1; });
      var u31 = !!s.unica || /UNICA|ÚNICA/i.test(String(s.tipoServicio || ''));
      MK.hoja('<h2>' + (dev ? 'Corregir y reenviar' : 'Alta directa a logística') + '</h2>' +
        (dev ? '<div class="aviso rj small" style="margin:8px 0"><b>Te la devolvieron:</b> ' + ((s.corregir || []).length ? 'corrige lo marcado en rojo (' + E(s.corregir.map(function (c) { return c.t || c; }).join(', ').toLowerCase()) + ').' : '') + (s.motivo ? ' Nota: «' + E(s.motivo) + '».' : '') + ' Lo demás va igual que antes; Logística la revisa de nuevo.' + '</div>'
             : '<p class="muted small">Los campos con <span class="req">*</span> son obligatorios. Queda pendiente de revisión de logística antes de entrar a rutas.</p>') +
        '<div class="fila2">' + inp('empresa', 'EMPRESA <span class="req">*</span>', s.empresa, ' placeholder="Nombre comercial"') + inp('razon', 'RAZÓN SOCIAL', s.razonSocial, ' placeholder="Si es distinta al nombre comercial"') + '</div>' +
        '<div id="fa-dup" class="small" style="margin-top:4px"></div>' +
        '<div class="fila2">' + inp('contacto', 'CONTACTO <span class="req">*</span>', s.contacto) + inp('cargo', 'CARGO', s.cargo, ' placeholder="Administrador, dueño…"') + '</div>' +
        '<div class="fila2">' + inp('telefono', 'TELÉFONO', s.telefono, ' inputmode="tel"') + inp('celular', 'CELULAR <span class="req">*</span>', s.celular, ' inputmode="tel" placeholder="6000-0000"') + '</div>' +
        inp('correo', 'CORREO', s.correo, ' inputmode="email"') +
        '<label class="lb" for="fa-direccion">DIRECCIÓN <span class="req">*</span></label><textarea class="in" id="fa-direccion" placeholder="Calle, edificio, local, punto de referencia">' + E(s.direccion || '') + '</textarea>' +
        '<div class="fila2"><div><label class="lb" for="fa-zona">ZONA</label><select class="sel" id="fa-zona">' + opc(zonas, s.zona) + '</select></div>' + inp('plus', 'PLUS CODE DE GOOGLE MAPS', s.plusCode, ' placeholder="Ej.: 2F6R+C5"') + '</div>' +
        '<p class="ayuda">Opcional pero muy útil: en Google Maps, mantén presionado sobre el punto y copia el código corto. Si no lo pones, logística ubica al cliente antes de rutearlo.</p>' +
        (u31 ? '<input type="hidden" id="fa-frec" value="">' + '<div class="fila2">' + inp('kg', 'KILOS ESTIMADOS', s.kgMax, ' inputmode="decimal" placeholder="10"') + '<div></div></div>'
             : '<div class="fila2"><div><label class="lb" for="fa-frec">FRECUENCIA <span class="req">*</span></label><select class="sel" id="fa-frec">' + opc(frs.filter(function (f) { return !/ESPECIAL|SOLICITUD/i.test(f); }), s.frecuencia) + '</select></div>' + inp('kg', 'KG MÁX. POR VISITA', s.kgMax, ' inputmode="decimal" placeholder="10"') + '</div>') +
        '<div class="fila2"><div><label class="lb" for="fa-inicio">' + (u31 ? 'FECHA PEDIDA POR EL CLIENTE' : 'INICIO DE RECOLECCIÓN') + '</label><input class="in" type="date" id="fa-inicio" value="' + E((u31 ? s.fechaPedida : s.inicioRecoleccion) || (u31 ? '' : MK.hoy)) + '"><p class="ayuda">' + (u31 ? 'Logística la pone en la ruta de ese día.' : 'Desde cuándo logística puede incluirlo en una ruta.') + '</p></div><div></div></div>' +
        (dev ? '<div class="lb" style="margin-top:14px">PRECIO Y SERVICIO</div>' +
          '<div class="fila2"><div><label class="lb" for="fa-tipo">TIPO DE SERVICIO</label><select class="sel" id="fa-tipo"><option value="RECURRENTE">Recurrente</option><option value="VISITA UNICA"' + (u31 ? ' selected' : '') + '>Visita única</option></select></div>' +
            inp('costo', u31 ? 'PRECIO DE LA VISITA ($)' : 'PRECIO DEL PLAN ($)', s.planCosto, ' inputmode="decimal"') + '</div>' +
          '<div class="fila2">' + inp('plankg', 'KILOS INCLUIDOS', s.planKg, ' inputmode="decimal"') + inp('kgadic', 'PRECIO DEL KILO ADICIONAL ($)', s.tarifaKgAdic, ' inputmode="decimal"') + '</div>' +
          (u31 ? '' : '<div class="fila2">' + inp('visadic', 'PRECIO DE LA VISITA ADICIONAL ($)', s.tarifaVisitaAdic, ' inputmode="decimal"') + '<div></div></div>') : '') +
        '<label class="lb" for="fa-notas">NOTAS PARA LOGÍSTICA</label><textarea class="in" id="fa-notas" placeholder="Horario de atención, restricciones de acceso, a quién buscar…">' + E(s.notas || '') + '</textarea>' +
        '<div id="fa-msg" class="small" style="margin-top:8px;color:var(--bad)"></div>' +
        '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="fa-ok">' + (dev ? 'Reenviar a logística' : 'Enviar a logística') + '</button></div>', { ancha: true });
      if (dev) { var MARCA = { direccion: ['fa-direccion', 'fa-zona', 'fa-plus'], contacto: ['fa-contacto', 'fa-celular', 'fa-telefono'], fecha: ['fa-inicio'], precio: ['fa-costo', 'fa-plankg', 'fa-kgadic', 'fa-visadic'], tipo: ['fa-tipo'] };
        /* cambiar el tipo rearma el formulario (frecuencia o fecha pedida) sin perder lo escrito */
        var ft = document.getElementById('fa-tipo');
        if (ft) ft.onchange = function () { var g = function (id) { var e = document.getElementById('fa-' + id); return e ? e.value.trim() : ''; };
          formAlta(Object.assign({}, s, { empresa: g('empresa'), razonSocial: g('razon'), contacto: g('contacto'), cargo: g('cargo'), telefono: g('telefono'), celular: g('celular'), correo: g('correo'),
            direccion: g('direccion'), zona: g('zona'), plusCode: g('plus'), kgMax: g('kg'), notas: g('notas'), planCosto: g('costo'), planKg: g('plankg'), tarifaKgAdic: g('kgadic'), tarifaVisitaAdic: g('visadic') || s.tarifaVisitaAdic,
            tipoServicio: ft.value, unica: ft.value === 'VISITA UNICA', frecuencia: ft.value === 'VISITA UNICA' ? '' : s.frecuencia })); };
        Object.keys(COR).forEach(function (k) { (MARCA[k] || []).forEach(function (id) { var el = document.getElementById(id); if (el) { el.classList.add('marca-rj'); var lb = document.querySelector('label[for="' + id + '"]'); if (lb && lb.innerHTML.indexOf('corregir') < 0) lb.innerHTML += ' <span style="color:#d64045">· corregir</span>'; } }); }); }
      var emp = document.getElementById('fa-empresa'), dup = document.getElementById('fa-dup');
      emp.oninput = function () {
        var v = emp.value.trim().toUpperCase(); if (v.length < 4) { dup.innerHTML = ''; return; }
        var p = ((ALTA && ALTA.clientesExistentes) || []).filter(function (c) { c = String(c).toUpperCase(); return c.indexOf(v) >= 0 || v.indexOf(c) >= 0; });
        dup.innerHTML = p.length ? '<span style="color:#8a5a00;font-weight:700">Ya existe algo parecido: ' + E(p.slice(0, 3).join(' · ')) + '</span>' : '';
      };
      emp.oninput();
      document.getElementById('fa-ok').onclick = function () {
        var b = this, msg = document.getElementById('fa-msg'), v = function (id) { return document.getElementById('fa-' + id).value.trim(); };
        var d = {};
        /* lo que venía de la propuesta (RUC, plan, tarifas, contrato…) viaja igual */
        ['ruc', 'dv', 'sector', 'provincia', 'codigoPropuesta', 'tipoServicio', 'planCosto', 'planKg', 'tarifaKgAdic', 'tarifaVisitaAdic', 'contrato', 'fechaContrato', 'plazoContrato', 'vencimiento', 'horarioRecoleccion', 'diasSemana', 'retieneItbms', 'facturacion', 'canalEnvio']
          .forEach(function (k) { if (s[k] !== undefined && s[k] !== '') d[k] = s[k]; });
        Object.assign(d, { empresa: v('empresa'), razonSocial: v('razon'), contacto: v('contacto'), cargo: v('cargo'), telefono: v('telefono'), celular: v('celular'), correo: v('correo'),
          direccion: v('direccion'), zona: v('zona'), plusCode: v('plus'), frecuencia: v('frec'), kgMax: v('kg'), inicioRecoleccion: v('inicio'), notas: v('notas') });
        if (u31) { d.fechaPedida = v('inicio'); d.tipoServicio = d.tipoServicio || 'VISITA UNICA'; }
        if (dev) { d.reenvioDe = s.solicitudId; d.tipoServicio = v('tipo');
          [['costo', 'planCosto'], ['plankg', 'planKg'], ['kgadic', 'tarifaKgAdic'], ['visadic', 'tarifaVisitaAdic']].forEach(function (z) { var e = document.getElementById('fa-' + z[0]); if (e) d[z[1]] = e.value.trim(); });
          if (u31) delete d.tarifaVisitaAdic; else d.fechaPedida = ''; }
        var f = []; if (!d.empresa) f.push('empresa'); if (!d.contacto) f.push('contacto'); if (!d.celular) f.push('celular'); if (!d.direccion) f.push('dirección'); if (!d.frecuencia && !u31) f.push('frecuencia');
        if (f.length) { msg.textContent = 'Falta: ' + f.join(', ') + '.'; return; }
        MK.ocupado(b, true, 'Enviando…');
        MK.api('api_guardarSolicitud', MK.pin, d).then(function (r) {
          MK.ocupado(b, false);
          if (!r || !r.ok) { msg.textContent = (r && r.error) || 'No se pudo enviar.'; return; }
          if (dev) MK.api('api_marcarNovedadVista', MK.pin, 'dev:' + s.solicitudId).catch(function () {});
          MK.cerrarHoja(); MK.aviso(r.duplicado ? 'Enviado · ojo: ya existe un cliente con ese nombre' : 'Enviado a logística');
          TAB = 'altas'; try { history.replaceState(null, '', '#altas'); } catch (e) {}
          cargarAltas(); pintarTabs();
        }, function (e) { MK.ocupado(b, false); msg.textContent = 'Sin conexión: no se envió. ' + e.message; });
      };
    };
    if (ALTA && !ALTA.error) go(); else { MK.aviso('Un momento…'); MK.api('api_altaBootstrap', MK.pin).then(function (r) { if (r && r.ok) { ALTA = r; go(); } else MK.aviso((r && r.error) || 'No se pudo abrir el formulario.'); }, function () { MK.aviso('Sin conexión'); }); }
  }
})();
</script>
