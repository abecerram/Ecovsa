<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes · Mercadeo · ECOVSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:'oculto',enSupabase:/^api_(?!optimizarRuta$)/,
  escritura:/^api_(crm(Guardar|Completar|Anular|Captura|Mover|Reasignar|Borrar|Subir|Usar)|guardar|marcar|abrir|cerrar|registrar|borrar|eliminar|crear|actualizar|enviar|corregir|dar|anular|confirmar|aprobar|rechazar|subir|asignar|mover|cambiar|agregar|nuevo|editar|reabrir|emitir|pasar|pedir)/i};</script>
<script src="puente.js"></script>
<link rel="stylesheet" href="mercadeo-kit.css">
<script src="mercadeo-kit.js"></script>
<style>
/* ── Clientes · opción A «Cuentas con sucursales» ── */
/* la búsqueda de la barra no debe empujar la página en celular */
.sysbar .srch{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi.bt{cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi.bt:hover{border-color:#9db4d8}
.kpi.bt.on{border-color:var(--navy2);box-shadow:inset 0 0 0 1px var(--navy2)}
.kpi small{display:block;font-size:11.5px;color:var(--muted2);margin-top:2px}
.kpi b.mon{font-size:18px;white-space:nowrap;padding:3px 0 2px}

.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.fbar .in{width:240px}
.fbar .sel{width:auto;padding:7px 8px;font-size:12.5px}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;background:#fff;user-select:none}
.tg input{accent-color:var(--navy2)}
.tg.on{border-color:var(--navy2);background:#eaf0fa;color:var(--navy2)}
.fres{font-size:12px;color:var(--muted);margin-left:auto}
.fmob{display:none!important}

.sal{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.sal .sc{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.kgbar{position:relative;height:7px;border-radius:4px;background:var(--line2);width:110px}
.kgbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--navy2)}
.kgbar i.over{background:var(--info)}.kgbar i.low{background:var(--gris)}
.kgbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.kgtx{font-size:11.5px;color:var(--muted);margin-top:3px}

.acc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.acc .hd,.acc .rw{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 116px 116px 200px 70px;gap:10px;align-items:center;padding:10px 12px}
.acc .hd{background:#fafbfd;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.7px;color:#7a879b;font-weight:700}
.acc .rw{border-bottom:1px solid var(--line2);cursor:pointer}
.acc .rw:last-child{border-bottom:0}
.acc .rw:hover{background:var(--hover)}
.acc .rw.sub{background:#fbfcfe;padding-left:26px}
.acc .rw.sub .nm b{font-weight:600}
.acc .rw.sel{background:#eef3fb}
.acc .rw.baja .nm b{color:var(--muted)}
.acc .nm{min-width:0}.acc .nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .chev{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;transition:transform .15s;color:var(--navy2)}
.acc .chev.ab{transform:rotate(90deg)}
.acc .act{display:flex;gap:4px;justify-content:flex-end}
.acc .c1 input{width:16px;height:16px;accent-color:var(--navy2)}
.acc .c6{min-width:0}.acc .c6 .kgtx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .c5,.acc .c5 *{white-space:nowrap}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--navy2);cursor:pointer;padding:0}
.ib:hover{border-color:#9db4d8}
.lbl-m{display:none;font-size:10.5px;color:var(--muted2);font-weight:700;letter-spacing:.5px}
.av.sm{width:26px;height:26px;font-size:10px}
.mas{padding:10px;text-align:center;border-top:1px solid var(--line2)}

.rnv{display:flex;align-items:flex-start;gap:10px;padding:10px;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.rnv:hover{border-color:#9db4d8}
.rnv .fe{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:9px;padding:3px 0;line-height:1.15}
.rnv .fe b{display:block;font-size:16px}.rnv .fe span{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.rnv .fe.bad{border-color:#f0b9bb;color:var(--bad)}
.rnv .tx{flex:1;min-width:0}.rnv .tx b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis}.rnv .tx small{display:block;font-size:12px;color:var(--muted)}
.rnv .sug{color:#2c3a52!important;margin-top:2px}
.rnv .ac{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.renrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}

.a-sub{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:12px}
.a-sub .et{font-size:11px;font-weight:700;color:var(--muted2);letter-spacing:.6px}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.chip b.num{font-weight:700}
.bulk{display:none;position:sticky;top:64px;z-index:6;box-shadow:0 6px 18px rgba(15,33,64,.18);align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy2);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:600}
.bulk.si{display:flex}
.bulk .btn{background:#fff}
.bulk .btn.gh{background:none;color:#fff}

.fq .it{display:flex;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line2)}
.fq .it:last-child{border:0}
.fq .tx{flex:1;min-width:0}.fq .tx b{font-weight:600}.fq .tx small{display:block;color:var(--muted);font-size:12px}

.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 12px;font-size:13px;margin-top:10px}
.kv>span{color:var(--muted)}
.kv>b{font-weight:600;overflow-wrap:anywhere;min-width:0}
.lado h2{font-size:18px;margin:2px 36px 2px 0;line-height:1.25}
.lado .card{padding:12px}
.lado .card+.card{margin-top:12px}
.por{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:3px 0}
.sugerido{margin-top:10px;padding:8px 10px;background:#f4f7fb;border-radius:9px;font-size:12.5px}
.her{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line2)}
.her:last-child{border:0}.her:hover b{color:var(--navy2)}

/* altas enviadas */
.sol{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sol.ok{border-left-color:var(--ok)}.sol.bad{border-left-color:var(--bad)}.sol.gris{border-left-color:var(--gris)}
.sol .top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sol .top b{font-size:14.5px}
.sol .det{font-size:12.5px;color:var(--muted);margin-top:3px}
.sol .mot{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--bad-bg);color:#8c1d22;font-size:13px}
.sol .ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.elige{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.elige button{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer;font:inherit;color:inherit}
.elige button:hover{border-color:var(--navy2)}
.elige b{display:flex;gap:8px;align-items:center;color:var(--navy2);font-size:14px}
.elige small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.45}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ayuda{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.req{color:var(--bad)}

@media(max-width:1180px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.acc .hd,.acc .rw{grid-template-columns:28px minmax(0,1fr) 130px 106px 106px 170px 70px}}
@media(max-width:900px){
  .kpis{display:flex;overflow-x:auto;padding-bottom:4px}.kpis .kpi{min-width:132px;flex:none}
  .acc .hd{display:none}
  .acc .rw{grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"c n n" "c k k" "c t s" "c r r";row-gap:6px;column-gap:10px}
  .acc .rw>.c1{grid-area:c;align-self:start}.acc .rw>.nm{grid-area:n}.acc .rw>.c3{grid-area:k}.acc .rw>.c4{grid-area:t}.acc .rw>.c5{grid-area:s;text-align:right}.acc .rw>.c6{grid-area:r}
  .acc .rw>.c4 .kgtx{display:inline;margin-left:6px}
  .acc .rw>.c7{display:none}
  .acc .rw.sub{padding-left:14px}
  .lbl-m{display:inline}
  .kgbar{width:100%}
  .fmob{display:inline-flex!important}
  .fbar:not(.ab)>*:not(.in):not(.fmob):not(.fres){display:none}
  .fbar .in{width:auto;flex:1;min-width:0}
  .fres{margin-left:0;width:100%;order:5}
  .renrow{display:flex;overflow-x:auto;padding-bottom:4px}.renrow .rnv{min-width:260px;flex:none}
  .elige,.fila2{grid-template-columns:1fr}
}
</style>
</head>
<body class="mk">
<script src="cargador.js" data-modulo="Mercadeo"></script>
<div id="sysbar"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"><div class="cargando">Cargando…</div></main></div>
<script>
(function () {
  var E = MK.esc, D = MK.dinero, N = MK.num, IC = MK.ic;
  var CRM = null, CAR = null, ALTA = null, LISTA = [], POR_ID = {};
  var TAB = 'cartera', SELEC = false, ELEGIDOS = {}, ABIERTOS = {}, VER_FICHAS = false, TOPE = 120;
  var F = nuevoF();
  var ROL = '';

  function nuevoF() { return { q: '', salud: '', region: '', sit: '', estado: '', ficha: '', frec: '', bajas: false, kpi: '' }; }

  /* ── niveles y situaciones ── */
  var NIV = { sano: ['Sano', 'ok'], atencion: ['Atención', 'warn'], riesgo: ['En riesgo', 'bad'], crecer: ['Puede crecer', 'info'] };
  var PESO = { riesgo: 0, atencion: 1, crecer: 2, sano: 3, baja: 4 };
  var SIT_TX = { activo: 'Activo', mora: 'Suspendido por mora', pausa: 'En pausa', cierre: 'De baja', retiro: 'Retirado' };
  function sitDe(c) { var s = String((c._car && c._car.situacion) || c.situacion || '').trim().toLowerCase(); return s || 'activo'; }
  function grupoSit(c) { var s = sitDe(c); return s === 'mora' || s === 'pausa' ? 'susp' : (s === 'cierre' || s === 'retiro' ? 'baja' : 'activo'); }
  function nivel(c) { return grupoSit(c) === 'baja' ? 'baja' : ((c.salud && c.salud.nivel) || 'sano'); }
  function titulo(s) { s = String(s || '').trim().toLowerCase(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
  function norm(s) { return String(s || '').trim().toLowerCase(); }
  function nombreCorto(c) { var n = c.nombre; if (c.cuenta) { var r = n.replace(new RegExp('^' + c.cuenta.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*-\\s*', 'i'), ''); if (r && r !== n) return r; } return n; }

  function salB(c) {
    if (nivel(c) === 'baja') return '<span class="sal"><span class="dot d-gris"></span>De baja</span>';
    var n = NIV[nivel(c)] || NIV.sano;
    return '<span class="sal"><span class="dot d-' + n[1] + '"></span>' + n[0] + ' <span class="sc num">' + (c.salud ? c.salud.puntos : '') + '</span></span>';
  }
  function motivo(c) {
    if (nivel(c) === 'baja') { var cr = c._car || {}; return 'De baja' + (cr['fecha baja'] ? ' desde ' + MK.fechaCorta(cr['fecha baja']) : '') + (cr['motivo baja'] ? ' · ' + cr['motivo baja'] : ''); }
    if (grupoSit(c) === 'susp') return SIT_TX[sitDe(c)] + ((c._car && c._car['motivo baja']) ? ': ' + c._car['motivo baja'] : '');
    var m = (c.salud && c.salud.motivos) || [];
    return m.length ? m[0] + (m.length > 1 ? ' (+' + (m.length - 1) + ')' : '') : 'Todo en orden';
  }
  function kgN(v) { return v > 0 && v < 10 ? N(v, 1).replace(/\.0$/, '') : N(v); }
  function kgB(kg, plan) {
    if (!plan) return '<div class="kgtx num">' + kgN(kg) + ' kg/mes · sin plan en la ficha</div>';
    var ra = kg / plan, w = Math.min(ra, 1.6) / 1.6 * 100, pl = 1 / 1.6 * 100;
    return '<div class="kgbar" title="' + N(kg) + ' kg al mes (promedio de 90 días) contra un plan de ' + N(plan) + ' kg"><i class="' + (ra >= 1.2 ? 'over' : ra < 0.5 ? 'low' : '') + '" style="width:' + w + '%"></i><u style="left:' + pl + '%"></u></div>' +
      '<div class="kgtx num">' + kgN(kg) + ' / ' + N(plan) + ' kg · ' + Math.round(ra * 100) + ' %</div>';
  }
  function conT(c) {
    var cr = c._car || {};
    if (cr.esEspecial) return '<span class="tag t-gris">Servicio especial</span>';
    if (c.diasVence === null || c.diasVence === undefined || c.diasVence === '') return '<span class="tag t-gris">Sin fecha</span>';
    if (c.diasVence < 0) return '<span class="tag t-bad">Vencido</span>';
    if (c.diasVence <= 60) return '<span class="tag t-warn">Vence en ' + c.diasVence + ' d</span>';
    return '<span class="tag t-ok">Vigente</span>';
  }
  function sugerencia(c) {
    var s = c.salud || {}, kg = c.kgMes || 0, pl = c.planKg || 0;
    if (s.pago && s.pago !== 'ok') return 'Poner al día el saldo vencido antes de renovar';
    if (s.kilos === 'crecer') return 'Renovar con plan de ' + N(Math.ceil(kg * 1.1 / 5) * 5) + ' kg (hoy ' + N(pl) + ' kg)';
    if (s.kilos === 'ojo' && kg > 0) return 'Ofrecer plan de ' + N(Math.max(5, Math.ceil(kg * 1.2 / 5) * 5)) + ' kg antes de que lo pida';
    return 'Renovar con el mismo plan y el ajuste anual';
  }

  /* ── carga ── */
  MK.iniciar('clientes', function (base) {
    ROL = (base.usuario && base.usuario.rol) || '';
    if (/^#altas/.test(location.hash)) TAB = 'altas';
    pintarEsqueleto();
    cargar();
    if (ROL !== 'gerente') cargarAltas();
    window.addEventListener('mk:cambio', function () { cargar(); if (TAB === 'altas' || ALTA) cargarAltas(); });
  });

  function pintarEsqueleto() {
    var m = document.getElementById('main');
    m.innerHTML = '<div class="ph"><div><h1>Clientes</h1><p>Toda la cartera: cuentas, sucursales, salud, contratos y cobros. Hoy ' + E(MK.fechaLarga(MK.hoy)) + '.</p></div><div class="sp"></div>' +
      '<button class="btn" id="bt-exp">' + IC('bajar', 16) + 'Exportar</button>' +
      (ROL !== 'gerente' ? '<button class="btn pri" id="bt-nuevo">' + IC('mas', 16) + 'Cliente nuevo</button>' : '') + '</div>' +
      '<div class="tabs" id="tabs"></div>' +
      '<section id="p-cartera"><div class="cargando">Cargando la cartera…</div></section>' +
      '<section id="p-altas" hidden><div class="cargando">Cargando…</div></section>';
    document.getElementById('bt-exp').onclick = exportar;
    var bn = document.getElementById('bt-nuevo'); if (bn) bn.onclick = clienteNuevo;
    pintarTabs();
  }
  /* Una devuelta ya corregida sigue DEVUELTA en la hoja: se reconoce porque
     después se envió otra del mismo cliente. */
  function marcarReenviadas(l) {
    l.forEach(function (s, i) {
      if (String(s.estado).toUpperCase() !== 'DEVUELTA') return;
      var nueva = l.filter(function (x, j) { return x !== s && norm(x.empresa) === norm(s.empresa) && (x.fechaSolicitud > s.fechaSolicitud || (x.fechaSolicitud === s.fechaSolicitud && j < i)); })[0];
      s._reenviada = nueva ? nueva.fechaSolicitud : '';
    });
  }
  function pintarTabs() {
    var mias = (ALTA && ALTA.mias) || []; marcarReenviadas(mias);
    var dev = mias.filter(function (s) { return String(s.estado).toUpperCase() === 'DEVUELTA' && !s._reenviada; }).length;
    var t = [['cartera', 'Cartera', CRM ? CRM.clientes.length : '']];
    if (ROL !== 'gerente') t.push(['altas', 'Altas enviadas', dev ? dev + ' devuelta' + (dev > 1 ? 's' : '') : (mias.length || '')]);
    var el = document.getElementById('tabs');
    el.innerHTML = t.map(function (x) { return '<button data-t="' + x[0] + '" class="' + (TAB === x[0] ? 'on' : '') + '">' + x[1] + (x[2] !== '' ? '<span class="n"' + (dev && x[0] === 'altas' ? ' style="background:var(--bad-bg);color:var(--bad)"' : '') + '>' + x[2] + '</span>' : '') + '</button>'; }).join('');
    [].forEach.call(el.querySelectorAll('button'), function (b) { b.onclick = function () { TAB = b.getAttribute('data-t'); try { history.replaceState(null, '', TAB === 'altas' ? '#altas' : location.pathname.split('/').pop()); } catch (e) {} verTab(); }; });
    verTab();
  }
  function verTab() {
    document.getElementById('p-cartera').hidden = TAB !== 'cartera';
    document.getElementById('p-altas').hidden = TAB !== 'altas';
    [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === TAB); });
    if (TAB === 'altas') pintarAltas();
  }

  function cargar() {
    Promise.all([
      MK.api('api_crmClientes', MK.pin),
      MK.api('api_cartera', MK.pin).catch(function () { return null; })
    ]).then(function (r) {
      var a = r[0], b = r[1];
      if (!a || !a.ok) { MK.error('p-cartera', (a && a.error) || 'No se pudo cargar la cartera.'); return; }
      CRM = a; CAR = b && b.ok ? b : null;
      var porCar = {}; if (CAR) CAR.clientes.forEach(function (x) { porCar[String(x.id)] = x; });
      LISTA = CRM.clientes.map(function (c) { c._car = porCar[String(c.id)] || null; return c; });
      POR_ID = {}; LISTA.forEach(function (c) { POR_ID[c.id] = c; });
      Object.keys(ELEGIDOS).forEach(function (k) { if (!POR_ID[k]) delete ELEGIDOS[k]; });
      pintarCartera(); pintarTabs();
    }, function (e) { MK.error('p-cartera', 'Sin conexión: ' + e.message); });
  }

  /* ── faltantes de ficha: los de la cartera (Alta) y los del CRM, sin repetir ── */
  function faltanDe(c) {
    var l = [], vistos = {};
    ((c._car && c._car.faltantes) || []).concat(c.faltan || []).forEach(function (f) {
      var k = norm(f).replace(/^inicio$/, 'inicio de recolección').replace(/^ruc$/, 'ruc');
      if (!vistos[k]) { vistos[k] = 1; l.push(k === 'ruc' ? 'RUC' : k); }
    });
    return l;
  }

  /* ── filtros ── */
  function pasa(c, sinKpi) {
    var gs = grupoSit(c), cr = c._car || {};
    if (!F.bajas && gs === 'baja' && F.sit !== 'baja' && F.kpi !== 'baja') return false;
    if (F.q) { var q = norm(F.q); if (norm([c.nombre, c.razon, c.ruc, c.contacto, c.cuenta, c.correo, c.telefono].join(' ')).indexOf(q) < 0) return false; }
    if (F.salud && nivel(c) !== F.salud) return false;
    if (F.region) { var rg = norm(c.region); if (norm(F.region) === 'sin región' ? (rg && rg !== 'sin región') : rg !== norm(F.region)) return false; }
    if (F.sit && gs !== F.sit) return false;
    if (F.estado && norm(c.estado) !== norm(F.estado)) return false;
    if (F.frec && norm(c.frecuencia) !== norm(F.frec)) return false;
    if (F.ficha) {
      var fl = faltanDe(c);
      if (F.ficha === 'falta' && !fl.length) return false;
      if (F.ficha === 'sininicio' && cr['inicio recoleccion']) return false;
      if (F.ficha === 'sininicio' && !CAR && c.faltan.indexOf('inicio') < 0) return false;
      if (F.ficha === 'sinruc' && c.ruc) return false;
      if (F.ficha === 'vencido' && !(c.diasVence !== null && c.diasVence < 0)) return false;
      if (F.ficha === 'porvencer' && !(c.diasVence !== null && c.diasVence >= 0 && c.diasVence <= 60)) return false;
      if (F.ficha === 'sinvenc' && (c.vencimiento || cr.esEspecial)) return false;
    }

    var p = document.getElementById('p-altas'); if (!p) return;
    if (!ALTA) { MK.cargando(p); return; }
    if (ALTA.error) { MK.error(p, ALTA.error); return; }
    var l = ALTA.mias || [];
    marcarReenviadas(l);
    var h = '<div class="row w" style="margin-bottom:12px"><p class="muted small" style="flex:1;min-width:240px">Los clientes que enviaste a logística y en qué quedaron. Aquí no se aprueba nada: quien revisa y ubica al cliente es logística. Si te devuelven uno, corrige lo que dice el motivo y vuelve a enviarlo.</p>' +
      '<button class="btn" id="al-nueva">' + IC('mas', 15) + 'Alta directa</button></div>';
    if (!l.length) h += '<div class="card">' + MK.vacio('Todavía no has enviado clientes. Cuando una oportunidad pasa a cartera o haces un alta directa, aparece aquí.') + '</div>';
    h += l.map(function (s, i) {
      var est = String(s.estado || '').toUpperCase(), cls = est === 'APROBADA' ? 'ok' : est === 'DEVUELTA' ? (s._reenviada ? 'gris' : 'bad') : '';
      var tag = est === 'APROBADA' ? '<span class="tag t-ok">Aprobada · ya está en la cartera</span>' : est === 'DEVUELTA' ? (s._reenviada ? '<span class="tag t-gris">Devuelta · ya corregida</span>' : '<span class="tag t-bad">Devuelta</span>') : '<span class="tag t-warn">Pendiente · con logística</span>';
      var linea = est === 'APROBADA' ? 'Aprobada' + (s.procesadaEn ? ' el ' + MK.fecha(s.procesadaEn) : '') + (s.procesadaPor ? ' · la revisó ' + s.procesadaPor : '')
        : est === 'DEVUELTA' ? 'Te la devolvieron' + (s.procesadaEn ? ' el ' + MK.fecha(s.procesadaEn) : '') + (s.procesadaPor ? ' · ' + s.procesadaPor : '')
        : 'Esperando revisión' + (s.diasEsperando ? ' · ' + s.diasEsperando + (s.diasEsperando === 1 ? ' día' : ' días') : ' · enviada hoy');
      var cli = est === 'APROBADA' ? LISTA.filter(function (c) { return norm(c.nombre) === norm(s.empresa); })[0] : null;
      return '<div class="sol ' + cls + '"><div class="top"><div style="flex:1;min-width:200px"><b>' + E(s.empresa) + '</b><div class="det">Enviada el ' + E(MK.fecha(s.fechaSolicitud)) + ' · ' + E(titulo(s.frecuencia) || '—') + (s.zona ? ' · ' + E(titulo(s.zona)) : '') + (s.codigoPropuesta ? ' · desde ' + E(s.codigoPropuesta) : ' · alta directa') + '</div>' +
        '<div class="det">' + E(linea) + '</div></div>' + tag + '</div>' +
        (est === 'DEVUELTA' && s._reenviada ? '<div class="det" style="margin-top:6px">Se corrigió y se volvió a enviar el ' + E(MK.fecha(s._reenviada)) + '. Motivo de entonces: «' + E(s.motivo || 'sin motivo') + '»</div>' : '') +
        (est === 'DEVUELTA' && !s._reenviada ? '<div class="mot"><b>Motivo:</b> «' + E(s.motivo || 'Sin motivo anotado') + '»</div>' : '') +
        '<div class="ac">' +
          (est === 'DEVUELTA' && !s._reenviada && ROL !== 'gerente' ? '<button class="btn sm pri" data-cor="' + i + '">' + IC('lapiz', 14) + 'Corregir y reenviar</button>' : '') +
          (s.codigoPropuesta ? '<button class="btn sm" data-op="' + E(s.codigoPropuesta) + '">' + IC('embudo', 14) + 'Abrir la oportunidad</button>' : '') +
          (cli ? '<button class="btn sm" data-cli="' + E(cli.id) + '">' + IC('persona', 14) + 'Abrir la ficha del cliente</button>' : '') +
        '</div></div>';
    }).join('');
    p.innerHTML = h;
    document.getElementById('al-nueva').onclick = function () { formAlta(null); };
    [].forEach.call(p.querySelectorAll('[data-cor]'), function (b) { b.onclick = function () { formAlta(l[+b.getAttribute('data-cor')]); }; });
    [].forEach.call(p.querySelectorAll('[data-op]'), function (b) { b.onclick = function () { MK.irOportunidad(b.getAttribute('data-op')); }; });
    [].forEach.call(p.querySelectorAll('[data-cli]'), function (b) { b.onclick = function () { MK.irCliente(b.getAttribute('data-cli')); }; });
  }

  /* El mismo formulario del alta de Alta.html. Con una devuelta, sale lleno
     con lo que se envió (incluida la ficha comercial) para corregir y reenviar. */
  function formAlta(s) {
    var go = function () {
      s = s || {};
      var zonas = (ALTA && ALTA.zonas) || [], frs = (ALTA && ALTA.frecuencias) || [];
      function opc(l, v) { var h = '<option value="">Elegir…</option>', vv = String(v || ''); if (vv && l.indexOf(vv) < 0) h += '<option selected>' + E(vv) + '</option>'; return h + l.map(function (o) { return '<option' + (o === vv ? ' selected' : '') + '>' + E(o) + '</option>'; }).join(''); }
      function inp(id, et, v, extra) { return '<div><label class="lb" for="fa-' + id + '">' + et + '</label><input class="in" id="fa-' + id + '" value="' + E(v || '') + '"' + (extra || '') + '></div>'; }
      var dev = s.solicitudId && String(s.estado).toUpperCase() === 'DEVUELTA';
      MK.hoja('<h2>' + (dev ? 'Corregir y reenviar' : 'Alta directa a logística') + '</h2>' +
        (dev ? '<div class="aviso rj small" style="margin:8px 0"><b>Te la devolvieron:</b> «' + E(s.motivo || 'sin motivo anotado') + '». Corrige y envíala otra vez; logística la revisa de nuevo.</div>'
             : '<p class="muted small">Los campos con <span class="req">*</span> son obligatorios. Queda pendiente de revisión de logística antes de entrar a rutas.</p>') +
        '<div class="fila2">' + inp('empresa', 'EMPRESA <span class="req">*</span>', s.empresa, ' placeholder="Nombre comercial"') + inp('razon', 'RAZÓN SOCIAL', s.razonSocial, ' placeholder="Si es distinta al nombre comercial"') + '</div>' +
        '<div id="fa-dup" class="small" style="margin-top:4px"></div>' +
        '<div class="fila2">' + inp('contacto', 'CONTACTO <span class="req">*</span>', s.contacto) + inp('cargo', 'CARGO', s.cargo, ' placeholder="Administrador, dueño…"') + '</div>' +
        '<div class="fila2">' + inp('telefono', 'TELÉFONO', s.telefono, ' inputmode="tel"') + inp('celular', 'CELULAR <span class="req">*</span>', s.celular, ' inputmode="tel" placeholder="6000-0000"') + '</div>' +
        inp('correo', 'CORREO', s.correo, ' inputmode="email"') +
        '<label class="lb" for="fa-direccion">DIRECCIÓN <span class="req">*</span></label><textarea class="in" id="fa-direccion" placeholder="Calle, edificio, local, punto de referencia">' + E(s.direccion || '') + '</textarea>' +
        '<div class="fila2"><div><label class="lb" for="fa-zona">ZONA</label><select class="sel" id="fa-zona">' + opc(zonas, s.zona) + '</select></div>' + inp('plus', 'PLUS CODE DE GOOGLE MAPS', s.plusCode, ' placeholder="Ej.: 2F6R+C5"') + '</div>' +
        '<p class="ayuda">Opcional pero muy útil: en Google Maps, mantén presionado sobre el punto y copia el código corto. Si no lo pones, logística ubica al cliente antes de rutearlo.</p>' +
        '<div class="fila2"><div><label class="lb" for="fa-frec">FRECUENCIA <span class="req">*</span></label><select class="sel" id="fa-frec">' + opc(frs, s.frecuencia) + '</select></div>' + inp('kg', 'KG MÁX. POR VISITA', s.kgMax, ' inputmode="decimal" placeholder="10"') + '</div>' +
        '<div class="fila2"><div><label class="lb" for="fa-inicio">INICIO DE RECOLECCIÓN</label><input class="in" type="date" id="fa-inicio" value="' + E(s.inicioRecoleccion || MK.hoy) + '"><p class="ayuda">Desde cuándo logística puede incluirlo en una ruta.</p></div><div></div></div>' +
        '<label class="lb" for="fa-notas">NOTAS PARA LOGÍSTICA</label><textarea class="in" id="fa-notas" placeholder="Horario de atención, restricciones de acceso, a quién buscar…">' + E(s.notas || '') + '</textarea>' +
        '<div id="fa-msg" class="small" style="margin-top:8px;color:var(--bad)"></div>' +
        '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="fa-ok">' + (dev ? 'Reenviar a logística' : 'Enviar a logística') + '</button></div>', { ancha: true });
      var emp = document.getElementById('fa-empresa'), dup = document.getElementById('fa-dup');
      emp.oninput = function () {
        var v = emp.value.trim().toUpperCase(); if (v.length < 4) { dup.innerHTML = ''; return; }
        var p = ((ALTA && ALTA.clientesExistentes) || []).filter(function (c) { c = String(c).toUpperCase(); return c.indexOf(v) >= 0 || v.indexOf(c) >= 0; });
        dup.innerHTML = p.length ? '<span style="color:#8a5a00;font-weight:700">Ya existe algo parecido: ' + E(p.slice(0, 3).join(' · ')) + '</span>' : '';
      };
      emp.oninput();
      document.getElementById('fa-ok').onclick = function () {
        var b = this, msg = document.getElementById('fa-msg'), v = function (id) { return document.getElementById('fa-' + id).value.trim(); };
        var d = {};
        /* lo que venía de la propuesta (RUC, plan, tarifas, contrato…) viaja igual */
        ['ruc', 'dv', 'sector', 'provincia', 'codigoPropuesta', 'tipoServicio', 'planCosto', 'planKg', 'tarifaKgAdic', 'tarifaVisitaAdic', 'contrato', 'fechaContrato', 'plazoContrato', 'vencimiento', 'horarioRecoleccion', 'diasSemana', 'retieneItbms', 'facturacion', 'canalEnvio']
          .forEach(function (k) { if (s[k] !== undefined && s[k] !== '') d[k] = s[k]; });
        Object.assign(d, { empresa: v('empresa'), razonSocial: v('razon'), contacto: v('contacto'), cargo: v('cargo'), telefono: v('telefono'), celular: v('celular'), correo: v('correo'),
          direccion: v('direccion'), zona: v('zona'), plusCode: v('plus'), frecuencia: v('frec'), kgMax: v('kg'), inicioRecoleccion: v('inicio'), notas: v('notas') });
        var f = []; if (!d.empresa) f.push('empresa'); if (!d.contacto) f.push('contacto'); if (!d.celular) f.push('celular'); if (!d.direccion) f.push('dirección'); if (!d.frecuencia) f.push('frecuencia');
        if (f.length) { msg.textContent = 'Falta: ' + f.join(', ') + '.'; return; }
        MK.ocupado(b, true, 'Enviando…');
        MK.api('api_guardarSolicitud', MK.pin, d).then(function (r) {
          MK.ocupado(b, false);
          if (!r || !r.ok) { msg.textContent = (r && r.error) || 'No se pudo enviar.'; return; }
          if (dev) MK.api('api_marcarNovedadVista', MK.pin, 'dev:' + s.solicitudId).catch(function () {});
          MK.cerrarHoja(); MK.aviso(r.duplicado ? 'Enviado · ojo: ya existe un cliente con ese nombre' : 'Enviado a logística');
          TAB = 'altas'; try { history.replaceState(null, '', '#altas'); } catch (e) {}
          cargarAltas(); pintarTabs();
        }, function (e) { MK.ocupado(b, false); msg.textContent = 'Sin conexión: no se envió. ' + e.message; });
      };
    };
    if (ALTA && !ALTA.error) go(); else { MK.aviso('Un momento…'); MK.api('api_altaBootstrap', MK.pin).then(function (r) { if (r && r.ok) { ALTA = r; go(); } else MK.aviso((r && r.error) || 'No se pudo abrir el formulario.'); }, function () { MK.aviso('Sin conexión'); }); }
  }
})();
</script>
</body>
</html>
