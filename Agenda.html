<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda del equipo · ECOVSA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:"oculto",enSupabase:/^api_(?!optimizarRuta$)/};</script><script src="puente.js"></script>
<link rel="stylesheet" href="modulo-kit.css">
<script src="modulo-kit.js"></script>
<style>
/* ── copiado de MerAgenda.html (Agenda de Mercadeo) para que se vea igual ── */
.tipoic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--tm-clasico-fondo);color:var(--navy2);flex:none}
.tipoic.sm{width:24px;height:24px;border-radius:7px}
.tipoic.sm svg.i{width:14px;height:14px}
.sub{font-size:12px;color:var(--muted)}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.cal{background:var(--tm-tarjeta);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.calbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.calbar h4{font-size:15px;font-weight:700;margin:0 6px}
.calbar .sel{width:auto;padding:5px 8px;font-size:12.5px}
.tipf{display:flex;gap:6px;flex-wrap:wrap}
.calhead,.calbody{display:grid;grid-template-columns:52px repeat(6,minmax(0,1fr))}
.calhead{border-bottom:1px solid var(--line);background:var(--tm-papel)}
.calhead .dh{padding:7px 8px 6px;font-size:12px;color:var(--muted);border-left:1px solid var(--line2);display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:1px;cursor:default}
.calhead .dh b{grid-column:1/-1;justify-self:start;font-size:17px;color:var(--ink);font-weight:700;line-height:1.2;padding:0 1px}
.calhead .dh.hoy b{color:var(--tm-tarjeta);background:var(--navy2);border-radius:8px;padding:0 7px}
.calhead .dh small{font-size:11px;color:var(--muted)}
.calbody{position:relative}
.hcol .hr{font-size:11px;color:var(--muted2);text-align:right;padding-right:7px;position:relative;top:-7px}
.dcol{position:relative;border-left:1px solid var(--line2);cursor:cell}
.dcol.hoy{background-color:var(--tm-papel)}
.dcol.sobre{background-color:var(--tm-clasico-fondo)}
.ev{position:absolute;left:3px;right:3px;border:1px solid var(--line);border-left:3px solid var(--navy2);border-radius:7px;background:var(--tm-tarjeta);padding:3px 6px;font-size:11.5px;line-height:1.3;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px color-mix(in srgb,var(--tm-tinta) 6%,transparent);user-select:none;-webkit-user-select:none;z-index:2}
.ev:hover{border-color:var(--tm-gris2);z-index:3}
.ev b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.corto{display:flex;gap:5px;align-items:center;padding:2px 6px}
.ev.corto .t{flex:none;font-weight:600}
.ev.corto .t svg.i{display:none}
.ev.corto.estrecho .t{display:none}
.ev.corto b{flex:1;min-width:0}
.ev .t{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:11px}
.ev .t svg.i{width:12px;height:12px}
.ev .c{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev.atr{border-left-color:var(--bad)!important}
.ev.hecha{border-left-color:var(--gris)!important;background:var(--tm-hover);color:var(--muted);opacity:.62}
.ev.hecha b{text-decoration:line-through;font-weight:600}
.ev[draggable="true"]{cursor:grab}
.ahora{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:4;pointer-events:none}
.ahora:before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.diatabs{display:none;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.diatabs button{flex:1;border:1px solid var(--line);background:var(--tm-tarjeta);border-radius:9px;padding:5px 0;font:600 11.5px Archivo,sans-serif;color:var(--muted);cursor:pointer;min-width:48px;position:relative}
.diatabs button b{display:block;font-size:15px;color:var(--ink)}
.diatabs button.hoy{border-color:var(--navy2)}
.diatabs button.on{background:var(--navy2);border-color:var(--navy2);color:var(--tm-noche-tx)}
.diatabs button.on b{color:var(--tm-tarjeta)}
.diatabs button i{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.dia1{display:none;padding:4px 12px 12px}
.d-h{display:grid;grid-template-columns:48px minmax(0,1fr);min-height:40px;border-top:1px solid var(--line2);position:relative}
.d-h>span{font-size:11.5px;color:var(--muted2);padding-top:5px}
.d-h>div{padding:5px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.d-h.sinh{background:var(--tm-papel)}.d-h.sinh>span{font-weight:700;color:var(--muted)}
.d-ev{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--navy2);border-radius:9px;padding:8px 10px;background:var(--tm-tarjeta);cursor:pointer}
.d-ev .tx{flex:1;min-width:0}.d-ev .tx b{display:block;font-weight:600}
.d-ev .tx small{display:block;color:var(--muted);font-size:12px}
.d-ev.hecha{opacity:.55;border-left-color:var(--gris)!important}.d-ev.hecha b{text-decoration:line-through}
.d-ev.atr{border-left-color:var(--bad)!important}
.side .card{margin-bottom:12px;padding:12px 14px}
.side .card h5{margin:0 0 4px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:7px}
.side .card h5 .sp{flex:1}
.side .card h5 i{width:7px;height:7px;border-radius:50%;background:var(--bad)}
.side .ti{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border:1px solid transparent;border-bottom-color:var(--line2);cursor:pointer;border-radius:8px}
.side .ti:hover{background:var(--hover);border-color:var(--line)}
.side .ti:last-child{border-bottom-color:transparent}
.side .ti .tx{flex:1;min-width:0;font-size:12.5px}
.side .ti .tx b{display:block;font-weight:600}
.side .ti .tx small{color:var(--muted);font-size:11.5px}
.side .vacio{font-size:12px;color:var(--muted);padding:6px;text-align:center}
.side .venc{color:var(--bad);font-weight:600}
.side .ayuda{margin:0 2px 8px;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.lado h2{font-size:18px;margin:8px 0 2px;padding-right:30px}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 10px;font-size:13px;margin:12px 0}
.kv span{color:var(--muted)}
.kv div{min-width:0;overflow-wrap:anywhere}
.feedf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.feedf .in,.feedf .sel{width:auto}
.feedf .q{flex:1;min-width:200px}
.dia{font-size:12px;font-weight:700;letter-spacing:.7px;color:var(--tm-clasico-gris);margin:16px 0 6px;display:flex;gap:8px;align-items:center;text-transform:uppercase}
.dia:after{content:"";flex:1;height:1px;background:var(--line)}
.dia span{font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted2)}
.dia.rj{color:var(--bad)}
.ent{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;background:var(--tm-tarjeta);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.ent:hover{border-color:var(--tm-clasico-borde)}
.ent .cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ent .cab b{font-weight:700}
.ent .cab .h{margin-left:auto;font-size:12px;color:var(--muted)}
.ent p{margin:4px 0 6px;font-size:13px;color:var(--tm-navy2)}
.ent .pie{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ent .pie .sp{flex:1}

/* ── lo propio de la agenda ── */
.ar{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--tm-navy2)}
.ar i{width:8px;height:8px;border-radius:3px;background:var(--navy2);flex:none}
.c-dir{--ac:var(--tm-navy2)}.c-mer{--ac:var(--tm-morado)}.c-pla{--ac:var(--tm-verde-bandera)}.c-cob{--ac:var(--tm-warn-tx)}.c-lps{--ac:var(--tm-azul)}.c-lso{--ac:var(--tm-info)}
.ar.c-dir i,.ar.c-mer i,.ar.c-pla i,.ar.c-cob i,.ar.c-lps i,.ar.c-lso i{background:var(--ac)}
.ev.c-dir,.ev.c-mer,.ev.c-pla,.ev.c-cob,.ev.c-lps,.ev.c-lso,.d-ev[class*="c-"]{border-left-color:var(--ac)}
.ruta-bl{position:absolute;left:0;right:0;z-index:1;border-left:3px solid var(--tm-gris2);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--tm-gris2) 13%,transparent),color-mix(in srgb,var(--tm-gris2) 13%,transparent) 6px,transparent 6px,transparent 12px);font-size:10.5px;font-weight:700;color:var(--tm-gris);padding:3px 6px;pointer-events:none}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.leyenda .rt{display:inline-block;width:14px;height:10px;border-left:3px solid var(--tm-gris2);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--tm-gris2) 25%,transparent),color-mix(in srgb,var(--tm-gris2) 25%,transparent) 3px,transparent 3px,transparent 6px);vertical-align:-1px;margin-right:4px}
.swl{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.swl .sw{width:34px;height:20px}.swl .sw::after{width:14px;height:14px}.swl .sw.si::after{left:17px}
/* «Hoy»: misma lista que «Lo que te espera hoy» de Mi día */
.esp .grp{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);margin:14px 0 2px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.esp .grp:first-child{margin-top:2px}
.esp .grp:after{content:"";flex:1;height:1px;background:var(--line2)}
.esp .grp.rj{color:var(--bad)}
.esp .it{display:flex;gap:11px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line2);cursor:pointer}
.esp .it:last-child{border-bottom:0}
.esp .it:hover .tx b{color:var(--navy2)}
.esp .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--gris)}
.esp .dot.r{background:var(--bad)}.esp .dot.a{background:var(--amber)}.esp .dot.ok{background:var(--ok)}
.esp .tx{flex:1;min-width:0}.esp .tx b{display:block;font-weight:700;font-size:13.5px;line-height:1.3}
.esp .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.esp .ac{display:flex;gap:6px;flex:none;align-self:center}
.card h3.ct{margin:0 0 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px}
.card h3.ct .sp{flex:1}
.card h3.ct a{font-size:12px;letter-spacing:0;text-transform:none;font-weight:700;color:var(--navy2);cursor:pointer}
.mini{display:grid;grid-template-columns:46px minmax(0,1fr);gap:0 8px;font-size:12.5px}
.mini .h{color:var(--muted2);font-size:11.5px;padding:7px 0;border-top:1px solid var(--line2)}
.mini .e{padding:5px 0;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.mini .e .x{border-left:3px solid var(--ac,var(--navy2));background:var(--tm-hover);border-radius:6px;padding:4px 7px;cursor:pointer}
.mini .e .x small{display:block;color:var(--muted);font-size:11px}
.mini .e .x.rt{border-left-color:var(--tm-gris2);background:repeating-linear-gradient(135deg,var(--tm-clasico-fondo),var(--tm-clasico-fondo) 6px,var(--tm-tarjeta) 6px,var(--tm-tarjeta) 12px);cursor:default;color:var(--muted);font-weight:700}
.eqa{display:grid;grid-template-columns:minmax(0,1fr) 64px 76px;gap:6px;align-items:center;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line2)}
.eqa:first-of-type{border-top:0}.eqa b{text-align:right}.eqa .bad{color:var(--bad);font-weight:800;text-align:right}
.ag-msg{padding:9px 11px;border-radius:11px;background:var(--line2);margin-bottom:8px;font-size:13px}.ag-msg.yo{background:var(--info-bg)}
.ag-msg b{font-size:12px;display:block;margin-bottom:2px}.ag-msg small{color:var(--muted);font-weight:600}
.pasos{display:flex;gap:4px;margin:12px 0 4px}
.pasos span{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:5px 2px;border-radius:7px;background:var(--line2)}
.pasos span.on{background:var(--navy2);color:var(--tm-tarjeta)}.pasos span.bad{background:var(--bad-bg);color:var(--bad)}
.ag-carga{display:grid;grid-template-columns:170px minmax(0,1fr) 34px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line2)}
.ag-carga:first-of-type{border-top:0}
.ag-carga .br{display:flex;height:13px;border-radius:7px;overflow:hidden;background:var(--line2)}
.ag-mat{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px}
.ag-mat th{font-size:10.5px;color:var(--muted);font-weight:800;text-align:center;padding:2px}.ag-mat th.f{text-align:left;white-space:nowrap}
.ag-mat td{text-align:center;border-radius:7px;padding:8px 0;font-weight:800}
.ag-lab{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:7px 12px;background:var(--tm-warn-bg);border-top:1px dashed var(--tm-warn);font-size:12px;color:var(--tm-warn-tx)}
.ag-lab b{text-transform:uppercase;letter-spacing:.04em}.ag-lab select{padding:3px 6px;border:1px solid var(--line);border-radius:7px;background:var(--tm-tarjeta)}
.ag-lab a{color:var(--tm-warn-tx);font-weight:700}
.ag-lab.fuera{display:none}
body.con-lab .main{padding-bottom:70px}
body.solo-ver [data-escribe]{display:none!important}
.sysbar .ag-bell{position:relative;display:inline-grid;place-items:center;width:36px;height:34px;border-radius:9px;cursor:pointer;margin-right:4px;flex:none;border:1px solid color-mix(in srgb,var(--tm-gris2) 45%,transparent);background:color-mix(in srgb,var(--tm-tarjeta) 8%,transparent);color:inherit;outline:2px solid var(--lima,var(--tm-raya));outline-offset:1px}
.sysbar .ag-bell svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sysbar .ag-bell .bd{position:absolute;top:-6px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--tm-tarjeta);font:800 10.5px/18px Archivo,sans-serif;text-align:center}
@media(max-width:700px){body.con-campana .sysbar .cap{display:none}}
/* ═══ v4 · estilos alternativos ═══ */
.bj-ok{align-self:stretch;border:1px solid var(--tm-gris2);background:var(--tm-linea2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--tm-verde-bandera)}.bj-ok .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bj-ok .t svg.i{color:var(--ok)}.bj-ok .n{font-size:12.5px;margin-top:5px;color:var(--tm-ok)}.bj-ok .b{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ag-seg2 button i.rj{background:var(--bad);color:var(--tm-tarjeta)}
.bj-prop{align-self:stretch;border:1px solid var(--tm-verde-marca);background:var(--tm-warn-bg);border-radius:12px;padding:10px 12px;font-size:13px}.bj-prop .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bj-prop .n{color:var(--tm-warn-tx);font-size:12.5px;margin-top:5px}.bj-prop .b{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.bj-sys small{opacity:.75}
.av2{display:inline-grid;place-items:center;border-radius:50%;color:var(--tm-tarjeta);font-weight:800;flex:none;letter-spacing:.3px}
.ag-seg2{display:flex;gap:4px;background:var(--tm-linea2);border:1px solid var(--line);border-radius:11px;padding:3px}
.ag-seg2 button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font:700 12.5px Archivo,sans-serif;color:var(--muted);cursor:pointer}
.ag-seg2 button.on{background:var(--tm-tarjeta);color:var(--navy2);box-shadow:0 1px 3px color-mix(in srgb,var(--tm-tinta) 12%,transparent)}
.ag-seg2 button i{font-style:normal;font-size:11px;background:var(--line2);border-radius:7px;padding:0 6px;margin-left:5px}
.bj{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px;align-items:start}
.bj-izq{background:var(--tm-tarjeta);border:1px solid var(--line);border-radius:14px;padding:12px}
.bj-lista{max-height:calc(100vh - 290px);min-height:300px;overflow:auto;margin:0 -6px}
.bj-f{display:flex;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.bj-f:hover{background:var(--hover)}.bj-f.on{background:var(--info-bg);border-color:var(--tm-clasico-borde)}
.bj-f .tx{flex:1;min-width:0}.bj-f .r1{display:flex;gap:8px;align-items:baseline}.bj-f .r1 b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.bj-f .h{font-size:11.5px;color:var(--muted);white-space:nowrap}.bj-f .h.rj{color:var(--bad);font-weight:700}
.bj-f .t{font-size:13px;color:var(--tm-navy2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 5px}
.bj-f.nuevo .t{font-weight:700;color:var(--ink)}.bj-f.nuevo .r1 b:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--navy2);margin-right:6px;vertical-align:1px}
.bj-f .r3{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11.5px}
.bj-der{background:var(--tm-tarjeta);border:1px solid var(--line);border-radius:14px;min-height:520px;display:flex;flex-direction:column}
.bj-cab{display:flex;align-items:center;gap:8px;padding:16px 18px 10px}.bj-cab .fl{color:var(--muted)}.bj-cab .tx{margin-left:8px;min-width:0}.bj-cab h2{font-size:17px;margin:0 0 2px}
.bj-hilo{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:10px;background:var(--tm-papel);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);margin-top:10px}
.bj-sys{align-self:center;font-size:11.5px;color:var(--muted);background:var(--tm-tarjeta);border:1px solid var(--line2);border-radius:20px;padding:4px 12px;display:flex;gap:5px;align-items:center}
.bj-msg{display:flex;gap:8px;align-items:flex-end;max-width:78%}.bj-msg.yo{align-self:flex-end;flex-direction:row-reverse}
.bj-msg .bb{background:var(--tm-tarjeta);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:13px;line-height:1.45}
.bj-msg.yo .bb{background:var(--navy2);border-color:var(--navy2);color:var(--tm-tarjeta);border-radius:14px 14px 4px 14px}
.bj-msg .bb b{display:block;font-size:11.5px;margin-bottom:2px}.bj-msg .bb small{font-weight:500;opacity:.7}
.bj-msg .ref{display:flex;gap:5px;align-items:center;margin-top:7px;font-size:12px;font-weight:700;color:var(--navy2)}.bj-msg.yo .ref{color:var(--tm-noche-tx)}
.bj-esc{display:flex;gap:8px;align-items:center;padding:12px 18px;flex-wrap:wrap}.bj-esc .in{flex:1;min-width:180px}.bj-esc .sp{flex:0}
.ms{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.ms-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
