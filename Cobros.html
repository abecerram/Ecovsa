<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobros · ECOVSA</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">

<style>
/* ═══ Cobros · opción A «Mi día de cobro» (api 3.4) ═══ */
:root{--co:#c98a00}
.ph h1{display:flex;align-items:center;gap:10px}
.ph h1::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--co)}
.tb td.r{white-space:nowrap}
.lado .kpis .kpi b{font-size:18px;white-space:nowrap}
.dia{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.tarea{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;padding:12px 8px;border-top:1px solid var(--line2);border-radius:10px;cursor:pointer}
.tarea:first-of-type{border-top:0}
.tarea:hover{background:var(--hover)}
.tarea.sel{background:#fffaf0;box-shadow:inset 0 0 0 1px #f0d9a0}
.tarea .rk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;background:#fff4d6;color:#8a6300}
.tarea b{font-size:14px}
.tarea .m{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.tarea .sal{font-weight:800;font-size:14px;white-space:nowrap}
.acc2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn.co{background:#eef3fb;border-color:#cfdcf2;color:var(--navy2)}
.btn.tel{background:#fff;border-color:#bfe3b3;color:#276b33}
.esc-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 80%,#000)}
.esc-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chipx{white-space:nowrap;display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:4px}
.chipx.bad{background:var(--bad-bg);color:#a8262b}.chipx.warn{background:var(--warn-bg);color:#8a6300}.chipx.gris{background:var(--line2);color:var(--muted)}.chipx.ok{background:var(--ok-bg);color:#276b33}.chipx.info{background:var(--info-bg);color:#2c56a8}
.panel{position:sticky;top:74px}
.panel .et,.et{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted2)}
.facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.facs .f{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.facs .f b{display:block;font-size:12.5px}.facs .f span{font-size:11.5px;color:var(--muted)}.facs .f .sa{font-weight:800;font-size:13px;margin-top:3px}
.nota.rj2{background:var(--bad-bg);border-color:#f3c4c6;color:#6d1a1e}.nota.rj2 .muted{color:#8a4a4d}
.pv{display:grid;grid-template-columns:minmax(0,1fr) 110px 120px auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line2)}
.pv:first-of-type{border-top:0}.pv b{font-size:14px;cursor:pointer}.pv .m{font-size:12.5px;color:var(--muted)}
.pv .dd{font-weight:800;font-size:13px;white-space:nowrap}
@media (max-width:820px){.pv{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.pv>div:first-child{grid-column:1/-1}.pv .dd{grid-column:1}.pv>.num{grid-column:2}.pv .acc2{grid-column:1/-1}}
.msg{white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;max-height:240px;overflow:auto}
/* escalera */
.esc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:16px}
.pel{border-radius:13px;background:#fff;border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--c)}
.pel .d{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--c)}
.pel b{font-size:14px;line-height:1.25}
.pel .n{font-size:22px;font-weight:800}
.pel .n small{font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.pel .s{font-size:11.5px;color:var(--muted)}
.pel ul{margin:0;padding-left:15px;font-size:12px;color:#3d4a60;display:flex;flex-direction:column;gap:3px}
.pel .who{font-size:11px;font-weight:700;background:var(--line2);border-radius:6px;padding:2px 7px;align-self:flex-start}
.pel.clic{cursor:pointer}.pel.clic:hover{box-shadow:0 4px 14px rgba(15,33,64,.08)}
.lista .li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2)}
.lista .li:first-child{border-top:0}
.lista .zc{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.lista .tx b{display:block;font-size:13.5px}.lista .tx span{font-size:12.5px;color:var(--muted)}
/* agenda */
.ag{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;padding:12px 4px;border-top:1px solid var(--line2);align-items:start}
.ag:first-of-type{border-top:0}
.ag .cuando{font-size:12px;font-weight:800}
.ag .cuando small{display:block;font-weight:600;color:var(--muted)}
.ag b{font-size:14px;cursor:pointer}.ag b:hover{text-decoration:underline}
.ag .m{font-size:12.5px;color:var(--muted);margin:2px 0 2px}
/* resultados */
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* planes */
.planes{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.planes>*{min-width:0}
.pl{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pl.on{border-color:var(--co);box-shadow:inset 0 0 0 1px var(--co);background:#fffaf0}
.pl b{font-size:14px}.pl span{font-size:12px;color:var(--muted)}
.barra2{height:9px;border-radius:5px;background:var(--line2);overflow:hidden}.barra2 i{display:block;height:100%;background:var(--ok)}
.cu{display:grid;grid-template-columns:34px 110px minmax(0,1fr) 120px 110px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);font-size:13px}
.cu:first-child{border-top:0}
.cu .k{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;background:var(--line2);color:var(--muted)}
.cu .k.ok{background:var(--ok);color:#fff}
.cu .m{font-weight:800;text-align:right}
.cond{display:flex;flex-direction:column;gap:7px;font-size:13px}
.cond div{display:flex;gap:8px;align-items:flex-start}.cond svg.i{width:16px;height:16px;color:var(--co);margin-top:2px}
.tl2 .e{display:grid;grid-template-columns:86px 14px minmax(0,1fr);gap:8px;align-items:start;padding:5px 0;font-size:12.5px}
.tl2 .e .d{color:var(--muted)}.tl2 .e i{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--navy2)}
.tl2 .e i.p{background:var(--ok)}.tl2 .e i.x{background:var(--bad)}.tl2 .e i.w{background:var(--amber)}
/* lote */
.pasos{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pasos span{font-size:12px;font-weight:700;border-radius:20px;padding:5px 12px;background:var(--line2);color:var(--muted)}
.pasos span.on{background:var(--navy2);color:#fff}.pasos span.ok{background:var(--ok-bg);color:#276b33}
.grupos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.gr{border-radius:12px;border:1px solid var(--line);background:#fff;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column}
.gr span{font-size:12px;font-weight:700;color:var(--muted)}.gr b{font-size:22px}.gr small{font-size:11.5px;color:var(--muted2)}
.gr.n{border-top:4px solid var(--ok)}.gr.y{border-top:4px solid var(--gris)}.gr.d{border-top:4px solid var(--amber)}.gr.s{border-top:4px solid var(--bad)}
.gr.on{box-shadow:inset 0 0 0 2px var(--navy2)}
.tipo{font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 6px}.tipo.f{background:var(--info-bg);color:#2c56a8}.tipo.p{background:var(--ok-bg);color:#276b33}.tipo.nc{background:var(--warn-bg,#fff4d6);color:#8a5a00}
.est{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.est.n{background:var(--ok-bg);color:#276b33}.est.y{background:var(--line2);color:var(--muted)}.est.d{background:var(--warn-bg);color:#8a6300}.est.s{background:var(--bad-bg);color:#a8262b}
.why{font-size:12px;color:#3d4a60}
.cols{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.cols span{font-size:11.5px;border-radius:6px;padding:3px 8px;background:var(--line2)}.cols i{font-style:normal;color:var(--muted)}
textarea.pega{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
.rep{display:grid;grid-template-columns:24px minmax(0,1fr) 110px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2);font-size:13px}
.rep:first-child{border-top:0}
.rep input.in{padding:6px 8px;text-align:right}
.dtab tbody tr{cursor:pointer}
.buscaCu{position:relative}
.buscaCu .res2{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(15,33,64,.15);z-index:5;max-height:240px;overflow:auto}
.buscaCu .res2 a{display:block;padding:8px 10px;border-bottom:1px solid var(--line2);color:var(--ink);font-size:13px;cursor:pointer}
.buscaCu .res2 a small{display:block;color:var(--muted);font-size:11.5px}
.buscaCu .res2 a:hover{background:var(--hover)}
@media (max-width:1100px){.esc{grid-template-columns:repeat(2,minmax(0,1fr))}.planes,.dia{grid-template-columns:minmax(0,1fr)}.panel{display:none}}
@media (max-width:820px){
  .res,.grupos{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cu{grid-template-columns:30px minmax(0,1fr) auto}.cu .x{display:none}
  .ag{grid-template-columns:minmax(0,1fr)}
  .esc{grid-template-columns:minmax(0,1fr)}
  .tarea{grid-template-columns:26px minmax(0,1fr)}.tarea .sal{grid-column:2}
}
</style>
</head>
<body>
<script src="cargador.js" data-modulo="Cobros"></script>
<div id="sysbar"></div>
<div class="mtabs" id="mtabs"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"></main></div>
<script>
/* ════════════════════════════════════════════════════════════════
   COBROS · opción A — Mi día de cobro, seguimientos y planes (api 3.4)
   Todo sale de una sola llamada (api_cobBase). Cada guardado vuelve a
   pedirla: los saldos se calculan en el servidor, nunca aquí.
   ════════════════════════════════════════════════════════════════ */
var CTA = '', SEL_PLAN = '', FSEG = 'agenda', FDEU = 'deben', FFAC = 'abiertas', FPAG = 'todos', QFAC = '', QDEU = '', LOTE = null, LFILTRO = 'todos', PF_MES = '';
function B() { return MK.base || {}; }
function cu(k) { return (B().cuentas || []).filter(function (c) { return c.clave === k; })[0]; }
function escD(id) { return (B().escalera || []).filter(function (e) { return e.id === id; })[0]; }
function escChip(id) { var e = escD(id); return e ? '<span class="esc-chip" style="--c:' + e.c + '">' + MK.esc(e.n) + '</span>' : ''; }
function D(v) { return MK.dinero(v); }
function fdm(iso) { return MK.dmy(iso); }
function tonoChip(t) { return t === 'bad' ? 'bad' : t === 'warn' ? 'warn' : t === 'info' ? 'info' : 'gris'; }
function iconoCanal(c) { return c === 'whatsapp' ? 'whatsapp' : c === 'correo' ? 'correo' : c === 'llamada' ? 'telefono' : c === 'contacto' ? 'lapiz' : c === 'carta' ? 'documento' : c === 'pedirSusp' || c === 'mercadeo' ? 'candado' : 'ojo'; }
function btnCanal(a, clave) {
  var c = cu(clave) || {};
  if (a === 'whatsapp') return '<button class="btn wa sm escribe" onclick="event.stopPropagation();mensaje(\'' + clave + '\',\'whatsapp\')">' + MK.ic('whatsapp', 15) + 'WhatsApp</button>';
  if (a === 'correo') return '<button class="btn co sm escribe" onclick="event.stopPropagation();mensaje(\'' + clave + '\',\'correo\')">' + MK.ic('correo', 15) + 'Correo</button>';
  if (a === 'llamada') return (c.telefono ? '<a class="btn tel sm" href="tel:' + MK.esc(String(c.telefono).split(/[\/,;]/)[0].replace(/[^0-9+]/g, '')) + '" onclick="event.stopPropagation()">' + MK.ic('telefono', 15) + 'Llamar</a>' : '') + '<button class="btn co sm escribe" onclick="event.stopPropagation();mensaje(\'' + clave + '\',\'correo\')">' + MK.ic('correo', 15) + 'Correo formal</button>';
  if (a === 'contacto') return '<button class="btn sm escribe" onclick="event.stopPropagation();contacto(\'' + clave + '\')">' + MK.ic('lapiz', 15) + 'Completar contacto</button>';
  if (a === 'carta') return '<button class="btn bad sm escribe" onclick="event.stopPropagation();carta(\'' + clave + '\',\'ultimo\')">' + MK.ic('documento', 15) + 'Carta de último aviso</button>';
  if (a === 'pedirSusp') return '<button class="btn bad sm escribe" onclick="event.stopPropagation();pedirSuspension(\'' + clave + '\')">' + MK.ic('candado', 15) + 'Pedir suspensión</button>';
  if (a === 'mercadeo') return '<span class="chipx gris">' + MK.ic('candado', 13) + '&nbsp;esperando a Mercadeo</span><button class="btn sm" onclick="event.stopPropagation();abrirCuenta(\'' + clave + '\')">' + MK.ic('ojo', 15) + 'Ver cuenta</button>';
  return '<button class="btn sm" onclick="event.stopPropagation();abrirCuenta(\'' + clave + '\')">' + MK.ic('ojo', 15) + 'Ver cuenta</button>';
}
function recargar() { return MK.recargar(); }

/* ═══════════ MI DÍA ═══════════ */
function vMiDia() {
  var b = B(), t = b.totales, m = b.metricas;
  var hoy = (b.agenda || []).filter(function (a) { return a.cuando !== 'pronto'; });
  if (!CTA || !cu(CTA)) CTA = hoy.length ? hoy[0].clave : ((b.cuentas || [])[0] || {}).clave;
  var h = MK.cabeza('Mi día de cobro', MK.fechaLarga(b.hoy).replace(/^./, function (x) { return x.toUpperCase(); }) + ' · la lista sale sola cada mañana, de la escalera, las promesas y los planes',
    MK.chips([['midia', 'Hoy · ' + hoy.length], ['seg', 'Seguimientos'], ['planes', 'Planes']], 'midia', 'MK.ir'));
  h += '<div class="aviso-ver aviso az">Tu usuario solo mira Cobros: puedes ver todo, pero no registrar.</div>';
  h += MK.kpis([
    { e: 'Vencido', v: D(t.vencido), s: t.cuentasDeben + ' cuentas · ' + t.facturasVencidas + ' facturas', c: t.vencido > 0 ? 'bad' : '' },
    { e: 'Más de 90 días', v: D(t.mas90), s: t.vencido ? MK.num(t.mas90 / t.vencido * 100, 1) + ' % de lo vencido' : '', c: t.mas90 > 0 ? 'bad' : '' },
    { e: 'Cobrado este mes', v: D(m.cobradoMes), s: m.pagosMes + ' pago' + (m.pagosMes === 1 ? '' : 's') + (m.mas90 ? ' · ' + D(m.mas90) + ' de más de 90 días' : '') },
    { e: 'Gestiones esta semana', v: m.gestionesSemana, s: m.cuentasSinGestion + ' cuenta' + (m.cuentasSinGestion === 1 ? '' : 's') + ' sin ninguna gestión', c: m.gestionesSemana ? '' : 'warn' }
  ]);
  h += promosQueTerminan();
  var lista = hoy.slice(0, 12);
  h += '<div class="dia"><section class="card"><h3>Hoy toca <span class="sp"></span><span class="l muted">' + hoy.length + ' en total</span></h3>' +
    (lista.length ? lista.map(function (a, i) {
      var c = cu(a.clave) || {};
      var sub = c.abiertas + ' factura' + (c.abiertas === 1 ? '' : 's') + (c.moraMax ? ' · la más vieja con ' + c.moraMax + ' días' : '') + (c.ultimoPago ? ' · último pago ' + fdm(c.ultimoPago) : ' · sin pagos');
      return '<div class="tarea ' + (a.clave === CTA ? 'sel' : '') + '" onclick="tocarTarea(\'' + a.clave + '\')"><span class="rk">' + (i + 1) + '</span><div><b>' + MK.esc(a.cliente) + '</b> ' + escChip(c.escalon) +
        '<div class="m">' + MK.esc(sub) + '</div><span class="chipx ' + tonoChip(a.tono) + '">' + (a.cuando === 'atrasado' ? 'Atrasado · ' : '') + MK.esc(a.texto) + '</span>' +
        '<div class="acc2">' + btnCanal(a.canal, a.clave) + '<button class="btn sm escribe" onclick="event.stopPropagation();anotar(\'' + a.clave + '\')">' + MK.ic('check', 15) + 'Anotar resultado</button></div></div>' +
        '<span class="sal num">' + D(a.saldo) + '</span></div>';
    }).join('') + (hoy.length > lista.length ? '<div class="nota">' + (hoy.length - lista.length) + ' más en <a href="#seg" onclick="MK.ir(\'seg\');return false">Seguimientos</a>.</div>' : '')
      : MK.vacio('Nada para hoy. Buen día para revisar Conciliar pagos o Incobrables.')) + '</section>' +
    '<section class="card panel">' + (CTA ? panelCuenta(CTA) : MK.vacio('Toca una cuenta')) + '</section></div>';
  return h;
}
/* api 3.13 · promociones que terminan: 15 días antes del fin del beneficio (o el último día
   hábil antes) Cobros lo ve, igual que Mercadeo. Al llegar el fin, el sistema pasa solo al
   cliente a su plan normal y quita lo gratis: aquí se dice qué cambia en la factura. */
var FP_OK = {};
function fpId(x) { return String(x.id || x.beneficioId || (x.clienteId + ':' + x.promo)).replace(/[^\w:.\-]/g, ''); }
function fpClave(x) {
  if (x.clave && cu(x.clave)) return x.clave;
  var c = (B().cuentas || []).filter(function (c) { return x.clienteId && (c.clienteIds || []).map(String).indexOf(String(x.clienteId)) >= 0; })[0] ||
    (B().cuentas || []).filter(function (c) { return String(c.cliente).trim().toUpperCase() === String(x.cliente || '').trim().toUpperCase(); })[0];
  return c ? c.clave : '';
}
function fpDiaMes(iso) { var f = String(iso || '').slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(f) ? Number(f.slice(8)) + ' de ' + MK.MESES_L[Number(f.slice(5, 7)) - 1] : f; }
function promosQueTerminan() {
  var L = (B().promosQueTerminan || []).filter(function (x) { return !FP_OK[fpId(x)]; });
  if (!L.length) return '';
  return '<section class="card" style="border-left:4px solid var(--amber);margin-bottom:14px"><h3>' + MK.ic('reloj', 16) + ' Promociones que terminan <span class="sp"></span><span class="l muted">' + L.length + '</span></h3>' +
    L.map(function (x) {
      var id = fpId(x), k = fpClave(x), fin = String(x.fin || x.termina || '').slice(0, 10), d = Number(x.dias), plan = x.planNormal || x.plan || '';
      var sig = /^\d{4}-\d{2}-\d{2}$/.test(fin) ? MK.masDias(fin, 1) : '', mes = sig ? MK.MESES_L[Number(sig.slice(5, 7)) - 1] : '';
      var desde = !sig ? 'Después' : sig.slice(8) === '01' ? 'Desde ' + mes : 'Desde el ' + fpDiaMes(sig);
      var cambia = Array.isArray(x.cambia) ? x.cambia.filter(Boolean) : [];
      return '<div class="fila" style="justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line2)"><div style="min-width:0;flex:1 1 320px"><b>' + MK.esc(x.cliente) + '</b> <span class="chipx warn">' + (d === 0 ? 'hoy' : d === 1 ? 'mañana' : isFinite(d) ? 'en ' + d + ' días' : 'pronto') + '</span>' +
        '<div style="margin-top:3px">A ' + MK.esc(x.cliente) + ' se le termina la promoción «' + MK.esc(x.promo || '') + '» el ' + MK.esc(fpDiaMes(fin)) + '. ' + desde + ' se cobra con su plan normal' + (plan ? ' («' + MK.esc(plan) + '»)' : '') + '.</div>' +
        '<div class="small muted" style="margin-top:3px">' + (cambia.length ? 'En la factura' + (mes ? ' de ' + MK.esc(mes) : '') + ': ' + MK.esc(cambia.join('; ')) + '.' : 'En la factura' + (mes ? ' de ' + MK.esc(mes) : '') + ' ya no sale lo gratis de la promoción.') + ' El sistema hace el cambio solo.</div></div>' +
        '<div class="fila" style="flex:none">' + (k ? '<button class="btn sm" onclick="abrirCuenta(\'' + k + '\')">' + MK.ic('ojo', 15) + 'Ver cuenta</button>' : '') +
        '<button class="btn sm escribe" onclick="fpEnterado(\'' + id + '\',this)">' + MK.ic('check', 15) + 'Enterado</button></div></div>';
    }).join('') + '</section>';
}

      (s.plazoVencido ? 'Venció el plazo que dio Mercadeo (' + fdm(s.plazoHasta) + '). Vuelve a decidir.' : 'Mercadeo decide desde la ficha del cliente: suspender, dar plazo o seguir cobrando. Mientras tanto, el servicio sigue.') +
      (s.motivo ? '<br><span class="muted">Motivo: ' + MK.esc(s.motivo) + ' · ' + MK.esc(s.pidio || '') + '</span>' : '') +
      '<div class="acc2"><button class="btn sm escribe" onclick="retirarSusp(\'' + s.id + '\')">' + MK.ic('x', 14) + 'Retirar la solicitud</button></div></div>';
  if (s.estado === 'PLAZO')
    return '<div class="nota am"><b>Mercadeo dio plazo hasta el ' + fdm(s.plazoHasta) + '</b><br>' + MK.esc(s.motivoDecision || 'sin nota') + ' · ' + MK.esc(s.decidio || '') + '<br><span class="muted">Si al vencer no ha pagado, la solicitud vuelve sola a Mercadeo.</span></div>';
  if (s.estado === 'SEGUIR' && s.fechaDecision && s.fechaDecision >= MK.masDias(MK.hoy, -30))
    return '<div class="nota"><b>Mercadeo decidió no suspender · ' + fdm(s.fechaDecision) + '</b><br>' + MK.esc(s.motivoDecision) + ' · ' + MK.esc(s.decidio || '') + '</div>';
  if (s.estado === 'SUSPENDIDA' && c.situacion === 'mora')

  return '';
}

/* ── pedir la suspensión a Mercadeo ── */
function pedirSuspension(k) {
  var c = cu(k); if (!c) return;

  var ca = c.cartaUltimo;
  MK.lado('<span class="et">Pedir suspensión</span><h2>' + MK.esc(c.cliente) + '</h2>' +
    '<div class="sub">Cobros la pide; Mercadeo la decide desde la ficha del cliente (suspender, dar plazo o seguir cobrando). Hasta que decida, el servicio sigue.</div>' +
    MK.kpis([{ e: 'Vencido', v: D(c.vencido), c: 'bad' }, { e: 'Mora', v: c.moraMax + ' d' }, { e: 'Último pago', v: c.ultimoPago ? fdm(c.ultimoPago) : 'nunca' }], 3) +
    '<div class="cond" style="margin:4px 0 12px">' +
      [[!!ca, ca ? 'Carta de último aviso enviada el ' + fdm(ca.fecha) + (ca.limite ? ' · plazo hasta el ' + fdm(ca.limite) : '') : 'No se ha enviado la carta de último aviso'],
       [!c.promesa, c.promesa ? 'Tiene una promesa de pago para el ' + fdm(c.promesa.fecha) : 'Sin promesa vigente'],
       [!(c.plan && ['ACTIVO', 'ATRASADO', 'PROPUESTO'].indexOf(c.plan.estado) >= 0), c.plan ? 'Plan de pago ' + c.plan.estado.toLowerCase() : 'Sin plan de pago activo'],
       [!c.reclamo, c.reclamo ? 'Tiene un reclamo abierto' : 'Sin reclamo abierto']].map(function (x) {
        return '<div>' + MK.ic(x[0] ? 'check' : 'alerta', 16) + '<span' + (x[0] ? '' : ' style="color:#a8262b"') + '>' + MK.esc(x[1]) + '</span></div>';
      }).join('') + '</div>' +
    (!ca ? '<div class="aviso am">Lo usual es mandar primero la carta de último aviso y esperar su plazo. <a href="#" onclick="carta(\'' + k + '\',\'ultimo\');return false">Generar la carta</a></div>' : '') +
    '<label class="lb">Por qué se pide (lo lee Mercadeo)</label><textarea class="in" id="ps-mot" autofocus placeholder="p. ej. venció el plazo de la carta, no contesta llamadas desde agosto"></textarea>' +
    '<div class="small muted" style="margin-top:6px">' + (c.puntos && c.puntos.length ? 'Puntos que dejarían de recibir visitas: ' + c.puntos.map(MK.esc).join(' · ') : '') + '</div>' +
    '<div class="pie2"><button class="btn" onclick="MK.cerrarLado()">Cancelar</button><button class="btn bad" onclick="guardarPedirSusp(\'' + k + '\',this)">' + MK.ic('candado', 16) + 'Pedir a Mercadeo</button></div>');
}
function guardarPedirSusp(k, btn) {
  var m = MK.val('ps-mot'); if (!m) { MK.aviso('Escribe por qué se pide.'); return; }

  MK.llamar('api_cobPedirSuspension', k, m).then(function () { MK.cerrarLado(); MK.aviso('Pedida · Mercadeo la ve en la ficha del cliente'); recargar(); }, function () { MK.ocupado(btn, false); });
}
function retirarSusp(id) {
  MK.hoja('<h2>Retirar la solicitud</h2><p class="muted">Mercadeo deja de verla. Queda escrito quién la retiró y por qué.</p><label class="lb">Por qué</label><input class="in" id="rs-mot" autofocus placeholder="p. ej. abonó la mitad y prometió el resto">' +
    '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="rs-si">Retirar</button></div>');

    MK.llamar('api_cobAnularSuspension', id, MK.val('rs-mot') || 'Retirada por Cobros').then(function () { MK.cerrarHoja(); MK.cerrarLado(); MK.aviso('Solicitud retirada'); recargar(); });
  };
}

/* ── cartas de cobro: enlace + texto para correo y WhatsApp ── */
var CARTA = null;
function urlCarta(token) { return location.href.replace(/[?#].*$/, '').replace(/[^\/]*$/, '') + 'Carta.html?carta=' + token; }
function carta(k, tipo) {
  var c = cu(k); if (!c) return;
  var t = tipo || 'ultimo', C = B().cfg || {};
  MK.lado('<span class="et">Carta de cobro</span><h2>' + (t === 'ultimo' ? 'Último aviso' : t === 'suspension' ? 'Suspensión del servicio' : 'Reactivación') + ' · ' + MK.esc(c.cliente) + '</h2>' +
    '<div class="sub">La carta queda con la fecha de hoy, las facturas abiertas y el párrafo normativo de Configuración. El cliente la abre con un enlace y la puede guardar en PDF.</div>' +
    (t === 'ultimo' ? '<div class="f2"><div><label class="lb">Días de plazo</label><input class="in" id="ca-pl" type="number" min="1" max="60" value="' + (C.plazoAviso || 10) + '"></div><div><label class="lb">Vence el</label><input class="in" id="ca-vf" disabled value="' + fdm(MK.masDias(MK.hoy, C.plazoAviso || 10)) + '"></div></div>' : '') +
    '<label class="lb">Nota para el cliente (opcional)</label><textarea class="in" id="ca-no" placeholder="p. ej. si ya realizó el pago, envíenos el comprobante y lo aplicamos"></textarea>' +
    '<div class="pie2"><button class="btn" onclick="MK.cerrarLado()">Cancelar</button><button class="btn pri" onclick="crearCarta(\'' + k + '\',\'' + t + '\',this)">' + MK.ic('documento', 16) + 'Generar la carta</button></div>');
  var pl = document.getElementById('ca-pl');
  if (pl) pl.oninput = function () { document.getElementById('ca-vf').value = fdm(MK.masDias(MK.hoy, Math.max(1, Math.min(60, Number(pl.value) || 10)))); };
}
function crearCarta(k, t, btn) {
  MK.ocupado(btn, true, 'Generando…');
  MK.llamar('api_cobCrearCarta', k, t, { plazo: Number(MK.val('ca-pl')) || 0, nota: (document.getElementById('ca-no') || {}).value || '' }).then(function (r) {
    CARTA = { k: k, r: r, canal: '' }; pintarCarta();
  }, function () { MK.ocupado(btn, false); });
}
function textoCarta(canal) {
  var r = CARTA.r, c = cu(CARTA.k) || {}, u = urlCarta(r.token), E = B().empresa || {};
  var saludo = 'Estimados ' + (c.razon || c.cliente) + ':';
  var cuerpo = r.tipo === 'ultimo'
    ? 'Les compartimos el aviso formal de su saldo vencido con ECOVSA por ' + D(c.vencido) + '. Tienen plazo hasta el ' + fdm(r.fechaLimite) + ' para ponerse al día o acordar un plan de pago con nosotros.'
    : r.tipo === 'suspension' ? 'Les compartimos la notificación de suspensión del servicio de recolección por el saldo pendiente de ' + D(c.saldo) + '. El servicio se reanuda al ponerse al día.'
    : 'Les confirmamos la reactivación del servicio de recolección. Gracias por ponerse al día.';
  var pie = 'Pueden ver y guardar la carta con el detalle de sus facturas aquí:\n' + u + '\n\nCualquier consulta, estamos a la orden' + (E.whatsapp ? ' al WhatsApp ' + E.whatsapp : '') + (E.telefono ? ' o al ' + E.telefono : '') + '.\n\nDepartamento de Cobros · ECOVSA';
  return canal === 'whatsapp' ? '*ECOVSA* · ' + r.titulo + '\n\n' + saludo + '\n' + cuerpo + '\n\n' + pie : saludo + '\n\n' + cuerpo + '\n\n' + pie;
}
function pintarCarta() {
  var r = CARTA.r, c = cu(CARTA.k) || {}, u = urlCarta(r.token);
  MK.lado('<span class="et">Carta lista · ' + MK.esc(r.cartaId) + '</span><h2>' + MK.esc(r.titulo) + ' · ' + MK.esc(r.cliente) + '</h2>' +
    '<div class="sub">El sistema no la manda solo: abre WhatsApp o tu correo con el texto y el enlace. Al volver, toca «Ya la envié» para que quede anotada' + (r.tipo === 'ultimo' ? ' y la agenda te avise el ' + fdm(r.fechaLimite) : '') + '.</div>' +
    '<label class="lb">Enlace de la carta</label><div class="fila"><input class="in" id="ca-url" readonly value="' + MK.esc(u) + '" onclick="this.select()" style="flex:1"><button class="btn sm" onclick="MK.copiar(document.getElementById(\'ca-url\').value)">Copiar</button><a class="btn sm" href="' + MK.esc(u) + '" target="_blank" rel="noopener">' + MK.ic('ojo', 15) + 'Ver</a></div>' +
    '<div class="f2"><div><label class="lb">WhatsApp</label><input class="in" id="ca-tel" value="' + MK.esc(r.telefono && !/^n\/?a$/i.test(r.telefono) ? r.telefono : '') + '" placeholder="teléfono"></div><div><label class="lb">Correo</label><input class="in" id="ca-cor" value="' + MK.esc(r.correo || '') + '" placeholder="correo"></div></div>' +
    '<label class="lb">Mensaje</label><textarea class="in" id="ca-tx" style="min-height:220px">' + MK.esc(textoCarta('correo')) + '</textarea>' +
    '<div class="pie2"><button class="btn wa" onclick="enviarCarta(\'whatsapp\')">' + MK.ic('whatsapp', 16) + 'WhatsApp</button><button class="btn co" onclick="enviarCarta(\'correo\')">' + MK.ic('correo', 16) + 'Correo</button><button class="btn pri" onclick="cartaEnviada(this)">' + MK.ic('check', 16) + 'Ya la envié</button></div>');
}
function enviarCarta(canal) {
  var r = CARTA.r, t = document.getElementById('ca-tx').value;
  CARTA.canal = canal;
  if (canal === 'whatsapp') {
    var n = MK.telWa(MK.val('ca-tel')); if (!n) { MK.aviso('Escribe un número de WhatsApp.'); return; }
    window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(t.indexOf('*ECOVSA*') === 0 ? t : textoCarta('whatsapp')), '_blank');
  } else {
    var d = MK.val('ca-cor'); if (!/@/.test(d)) { MK.aviso('Escribe un correo válido.'); return; }
    location.href = 'mailto:' + encodeURIComponent(d) + '?subject=' + encodeURIComponent('ECOVSA · ' + r.titulo + ' · ' + r.cliente) + '&body=' + encodeURIComponent(t);
  }
}
function cartaEnviada(btn) {
  MK.ocupado(btn, true);
  MK.llamar('api_cobCartaEnviada', CARTA.r.cartaId, CARTA.canal || 'correo').then(function () { MK.cerrarLado(); MK.aviso('Carta anotada en la cuenta'); recargar(); }, function () { MK.ocupado(btn, false); });
}

/* ── pasar a incobrable (Cobros, con la autorización de gerencia) ── */
var INCQ = null;
function incobrableCuenta(k) {
  var c = cu(k); if (!c) return;
  var F = (B().facturas || []).filter(function (f) { return f.clave === k && f.saldo > 0.009 && f.mora > 0; }).sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; });
  var dias = (B().cfg || {}).incobrableDias || 365, sel = {};
  F.forEach(function (f) { if (f.mora >= dias) sel[f.factura] = true; });
  INCQ = { k: k, facturas: F, sel: sel };
  pintarIncQ();
}
function pintarIncQ() {
  var c = cu(INCQ.k), F = INCQ.facturas, n = F.filter(function (f) { return INCQ.sel[f.factura]; });
  MK.lado('<span class="et">Pasar a incobrable</span><h2>' + MK.esc(c.cliente) + '</h2>' +
    '<div class="sub">Gerencia lo autoriza fuera del sistema; aquí se anota quién. Las facturas salen de la cartera activa y dejan de sumar; no se borran y, si pagan, vuelven solas como recuperadas. Gerencia ve el aviso.</div>' +
    '<div class="tbw"><table class="tb"><thead><tr><th></th><th>Factura</th><th>Fecha</th><th>Días</th><th class="r">Saldo</th></tr></thead><tbody>' + F.map(function (f) {
      return '<tr><td><input type="checkbox" ' + (INCQ.sel[f.factura] ? 'checked' : '') + ' onchange="INCQ.sel[\'' + f.factura + '\']=this.checked;pintarIncQ()"></td><td>' + MK.esc(f.factura) + '</td><td>' + fdm(f.fecha) + '</td><td>' + f.mora + '</td><td class="r num">' + D(f.saldo) + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="f2"><div><label class="lb">Quién de gerencia lo autorizó</label><input class="in" id="iq-au" value="' + MK.esc(INCQ.au || '') + '" oninput="INCQ.au=this.value" placeholder="nombre"></div>' +
    '<div><label class="lb">Motivo</label><input class="in" id="iq-mo" value="' + MK.esc(INCQ.mo || '') + '" oninput="INCQ.mo=this.value" placeholder="p. ej. cerró el consultorio"></div></div>' +
    '<div class="pie2"><button class="btn" onclick="MK.cerrarLado()">Cancelar</button><button class="btn bad" onclick="guardarIncQ(this)"' + (n.length ? '' : ' disabled') + '>' + MK.ic('archivo', 16) + 'Pasar ' + n.length + ' (' + D(n.reduce(function (s, f) { return s + f.saldo; }, 0)) + ')</button></div>');
}
function guardarIncQ(btn) {
  var sel = Object.keys(INCQ.sel).filter(function (x) { return INCQ.sel[x]; });
  if (!MK.val('iq-au')) { MK.aviso('Escribe quién de gerencia lo autorizó.'); return; }
  if (!MK.val('iq-mo')) { MK.aviso('Escribe el motivo.'); return; }
  MK.ocupado(btn, true);
  MK.llamar('api_cobPasarIncobrable', sel, MK.val('iq-mo'), MK.val('iq-au')).then(function (r) {
    MK.cerrarLado(); INC_SEL = {}; MK.aviso(r.facturas + ' factura(s) fuera de la cartera · ' + D(r.monto) + ' · gerencia ve el aviso'); recargar();
  }, function () { MK.ocupado(btn, false); });
}
</script>
<script>
/* ═══ Cobros (api 3.5) · segunda parte: seguimientos, planes, escalera, cartera, documentos ═══ */

/* ═══════════ SEGUIMIENTOS ═══════════ */
function vSeguimientos() {
  var b = B(), m = b.metricas, A = b.agenda || [];

  var h = MK.cabeza('Seguimientos', 'Cada gestión deja su resultado y el siguiente paso con fecha. La agenda sale de la escalera, las promesas y las cuotas de los planes.',
    MK.chips([['agenda', 'Agenda', A.length], ['promesas', 'Promesas', viv.length], ['historial', 'Historial', (b.gestiones || []).length]], FSEG, 'filtroSeg'));
  h += MK.kpis([
    { e: 'Gestiones esta semana', v: m.gestionesSemana, s: m.cuentasConGestion + ' de ' + (m.cuentasConGestion + m.cuentasSinGestion) + ' cuentas tienen alguna gestión', c: m.gestionesSemana ? '' : 'warn' },
    { e: 'Promesas vivas', v: viv.filter(function (c) { return c.promesa.estado === 'viva'; }).length, s: D(viv.reduce(function (s, c) { return s + (c.promesa.estado === 'viva' ? c.promesa.monto : 0); }, 0)) + ' prometido' },
    { e: 'Promesas cumplidas', v: m.promesasVencidas ? MK.num(m.promesasCumplidas / m.promesasVencidas * 100) + ' %' : '—', s: m.promesasVencidas ? m.promesasCumplidas + ' de ' + m.promesasVencidas + ' · últimos 90 días' : 'empieza a medirse con las promesas anotadas' },
    { e: 'En plan de pago', v: m.enPlanCuentas, s: m.enPlanCuentas ? D(m.enPlanSaldo) + ' en plan' : (b.planes || []).filter(function (p) { return p.estado === 'PROPUESTO'; }).length + ' propuesto(s)' }
  ]);
  var izq = '';
  if (FSEG === 'agenda') {
    izq = '<section class="card"><h3>Agenda <span class="sp"></span><span class="l muted">atrasado · hoy · próximos 7 días</span></h3>' + (A.length ? A.map(function (a) {
      var c = cu(a.clave) || {};
      return '<div class="ag"><div class="cuando" style="color:' + (a.cuando === 'atrasado' ? 'var(--bad)' : a.cuando === 'hoy' ? '#8a6300' : 'var(--muted)') + '">' + (a.cuando === 'hoy' ? 'Hoy' : MK.fecha(a.fecha)) + '<small>' + (a.cuando === 'atrasado' ? 'atrasado' : a.cuando === 'hoy' ? '' : MK.cuando(a.fecha)) + '</small></div>' +
        '<div><b onclick="abrirCuenta(\'' + a.clave + '\')">' + MK.esc(a.cliente) + '</b> ' + escChip(c.escalon) + '<div class="m">' + MK.esc(a.texto) + '</div><div class="acc2">' + btnCanal(a.canal, a.clave) +
        '<button class="btn sm escribe" onclick="anotar(\'' + a.clave + '\')">' + MK.ic('check', 15) + 'Anotar resultado</button></div></div>' +
        '<span class="num" style="font-weight:800">' + D(a.saldo) + '</span></div>';
    }).join('') : MK.vacio('Nada en la agenda de los próximos 7 días.')) + '</section>';
  } else if (FSEG === 'promesas') {
    izq = '<section class="card"><h3>Promesas de pago</h3>' + MK.tabla(['Cuenta', 'Prometió para', 'Monto', 'Ha pagado', 'Estado', ''], viv.map(function (c) {
      var p = c.promesa;
      return ['<b>' + MK.esc(c.cliente) + '</b>', fdm(p.fecha) + '<small>' + MK.cuando(p.fecha) + '</small>', D(p.monto), D(p.pagado),

  }
  var canales = (m.canales || []);
  var der = '<section class="card"><h3>Recuperación</h3>' + MK.kpis([
    { e: 'Cobrado este mes', v: D(m.cobradoMes), s: m.pagosMes + ' pagos' },
    { e: 'De más de 90 días', v: D(m.mas90), s: m.mas90N ? m.mas90N + ' pago(s)' : 'nada de la cartera vieja este mes', c: m.mas90 ? 'ok' : 'warn' },
    { e: 'Por planes', v: D(m.porPlanes), s: m.enPlanCuentas ? m.enPlanCuentas + ' cuenta(s) en plan' : 'sin planes activos' },
    { e: 'Agenda de hoy', v: m.agendaHoy, s: 'cosas por hacer hoy o atrasadas' }], 2) +
    '<h3 style="margin-top:6px">Efectividad por canal · 90 días</h3>' + (canales.length ? MK.hbar(canales.map(function (x) { return { e: x.canal, d: x.gestiones + ' gestiones · ' + x.conPago + ' con pago en 15 días', v: x.gestiones ? Math.round(x.conPago / x.gestiones * 100) : 0 }; }), { fmt: function (v) { return v + ' %'; }, color: 'var(--co)' }) : MK.vacio('Sin gestiones en los últimos 90 días.')) +

function filtroSeg(f) { FSEG = f; MK.repintar(); }
function anularPromesa(id) {

/* ═══════════ PLANES DE PAGO ═══════════ */

  var h = MK.cabeza((A.nombre ? A.nombre + ' · ' : '') + 'Asistente IA', 'Te ayuda a ordenar el día y a redactar los mensajes. Nunca envía nada: tú revisas y envías.', MK.chips(tabs, IA.pest, 'iaPest'));
  if (!A.conectada) h += '<div class="aviso am">' + MK.ic('alerta', 16) + ' La asistente todavía no está conectada. ' + (A.esAdmin ? '<a href="Configuracion.html#ia">Conéctala en Configuración › Conexión de IA</a>.' : 'El administrador la conecta en Configuración.') + '</div>';
  else if (!A.encendida) h += '<div class="aviso am">' + MK.ic('pausa', 16) + ' La asistente está apagada.' + (A.esAdmin ? ' Enciéndela en Ajustes.' : '') + '</div>';
  else h += '<div class="small muted" style="margin:-6px 0 12px">Trabajando con ' + MK.esc(A.proveedorN) + (A.proveedor === 'gemini' ? ' · los clientes le llegan sin nombres (modo anónimo)' : '') + '</div>';
  return h + (IA.pest === 'chat' ? vIAChat() : IA.pest === 'ajustes' ? vIAAjustes() : vIATablero());
}
function iaPest(p) { IA.pest = p; MK.repintar(); }
function iaLista() {
  return (B().cuentas || []).filter(function (c) { return c.paso && c.saldo > 0.009 && c.paso.fecha <= MK.hoy; })
    .sort(function (a, b) { return (b.vencido || 0) - (a.vencido || 0); }).slice(0, 25);
}
function vIATablero() {
  var L = iaLista(), A = IA.aj, puede = A.conectada && A.encendida, bz = typeof bznAbiertos === 'function' ? bznAbiertos().length : 0;
  var h = '<div class="card" style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px">' + iaAvatar(40) + '<div><b>' + (A.nombre ? 'Hola, soy ' + MK.esc(A.nombre) + '.' : 'Hola.') + '</b> Hoy hay <b>' + L.length + '</b> cuenta' + (L.length === 1 ? '' : 's') + ' con un paso pendiente' + (bz ? ' y <b>' + bz + '</b> cosa' + (bz === 1 ? '' : 's') + ' del portal en el <a href="#" onclick="MK.ir(\'buzon\');return false">Buzón</a>' : '') + '.' +
    (puede ? ' Toca «Que lo escriba ella» y te dejo el mensaje listo para revisar.' : '') + '</div></div>';
  if (!L.length) return h + '<div class="card">' + MK.vacio('Nada pendiente para hoy.') + '</div>';
  return h + L.map(function (c) {
    var tuyo = c.grande || c.reclamo;
    return '<div class="card" style="margin-bottom:10px"><div class="fila" style="justify-content:space-between;gap:10px;align-items:flex-start"><div style="flex:1;min-width:220px">' +
      '<div class="fila" style="gap:6px;flex-wrap:wrap;align-items:center"><b>' + MK.esc(c.cliente) + '</b>' + escChip(c.escalon) + '<span class="num">' + D(c.saldo) + '</span>' + (c.grande ? '<span class="chipx info">cuenta grande</span>' : '') + (c.reclamo ? '<span class="chipx bad">reclamo</span>' : '') + '</div>' +
      '<div class="small" style="margin-top:4px">' + MK.esc(c.paso.texto) + (c.vencido > 0.009 ? ' · vencido ' + D(c.vencido) + ' · ' + c.moraMax + ' días' : '') + '</div>' +
      (tuyo ? '<div class="small" style="margin-top:4px;color:var(--navy2,#14306b)">' + iaAvatar(16) + ' Este caso es tuyo: lo decides tú.</div>' : '') + '</div>' +
      '<div class="acc2" style="flex-direction:column;align-items:stretch;min-width:170px">' +
      (puede && !tuyo ? '<button class="btn sm pri" onclick="iaRedactar(\'' + c.clave + '\')">' + MK.ic('asistente', 15) + 'Que lo escriba ella</button>' : '') +
      '<button class="btn sm" onclick="abrirCuenta(\'' + c.clave + '\')">' + MK.ic('flecha', 15) + 'Lo hago yo</button></div></div></div>';
  }).join('');
}
var IAR = null;
function iaRedactar(k, tono, canal) {
  var c = cu(k); if (!c) return;
  IAR = { k: k, tono: tono || 'cordial', canal: canal || (c.paso && c.paso.canal === 'correo' ? 'correo' : 'whatsapp'), texto: '', cargando: true, error: '' };
  iaPintarR();
  MK.api('api_iaRedactar', MK.pinUso(), { clave: k, tono: IAR.tono, canal: IAR.canal }).then(function (r) {
    if (!IAR || IAR.k !== k) return;
    IAR.cargando = false;
    if (!r || !r.ok) { IAR.error = (r && r.error) || 'No se pudo.'; }
    else if (!r.texto || !r.texto.ok) { IAR.error = (r.texto && r.texto.error) || 'La IA no respondió. Intenta de nuevo.'; }
    else { IAR.texto = r.texto.texto; IAR.tel = r.telefono; IAR.correo = r.correo; IAR.cliente = r.cliente; }
    iaPintarR();
  }, function (e) { if (IAR) { IAR.cargando = false; IAR.error = 'Sin conexión: ' + e.message; iaPintarR(); } });
}
function iaPintarR() {
  var R = IAR; if (!R) return; var c = cu(R.k) || {};
  var tonos = [['cordial', 'Cordial'], ['firme', 'Firme'], ['formal', 'Formal']], canales = [['whatsapp', 'WhatsApp'], ['correo', 'Correo']];
  var tel = String(R.tel || c.whatsapp || c.telefono || '').replace(/\D/g, ''); if (tel.length === 8) tel = '507' + tel;
  var h = '<span class="et">' + MK.esc(iaNombre()) + ' · borrador</span><h2>' + MK.esc(c.cliente || '') + '</h2><div class="sub">' + MK.esc((c.paso && c.paso.texto) || '') + '</div>' +
    '<div class="fila" style="gap:6px;flex-wrap:wrap;margin:6px 0">' + tonos.map(function (t) { return '<button class="chip' + (R.tono === t[0] ? ' on' : '') + '" onclick="iaRedactar(\'' + R.k + '\',\'' + t[0] + '\',IAR.canal)">' + t[1] + '</button>'; }).join('') +
    '<span style="width:10px"></span>' + canales.map(function (t) { return '<button class="chip' + (R.canal === t[0] ? ' on' : '') + '" onclick="iaRedactar(\'' + R.k + '\',IAR.tono,\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('') + '</div>';
  if (R.cargando) h += '<div class="cargando">' + MK.esc(iaNombre()) + ' está escribiendo…</div>';
  else if (R.error) h += '<div class="aviso am">' + MK.esc(R.error) + '</div>';
  else h += '<textarea class="in" id="iar-txt" rows="9" style="width:100%">' + MK.esc(R.texto) + '</textarea>' +
    '<div class="nota" style="margin-top:8px">Revísalo y cámbialo si quieres. No se envía solo: lo envías tú.</div>' +
    '<div class="pie2" style="flex-wrap:wrap;gap:6px">' +
    (R.canal === 'whatsapp' && tel ? '<button class="btn pri" onclick="iaEnviar(\'wa\')">' + MK.ic('whatsapp', 15) + 'Abrir WhatsApp</button>' : '') +
    (R.canal === 'correo' && (R.correo || c.correo) ? '<button class="btn pri" onclick="iaEnviar(\'mail\')">' + MK.ic('correo', 15) + 'Abrir correo</button>' : '') +
    '<button class="btn" onclick="iaEnviar(\'copiar\')">Copiar</button>' +
    '<button class="btn" onclick="iaAnotarEnviado()">' + MK.ic('check', 15) + 'Ya lo envié</button></div>';
  MK.lado(h);
}
function iaEnviar(como) {
  var t = String((document.getElementById('iar-txt') || {}).value || ''), c = cu(IAR.k) || {};
  if (como === 'copiar') { try { navigator.clipboard.writeText(t); MK.aviso('Copiado'); } catch (e) { MK.aviso('No se pudo copiar'); } return; }
  if (como === 'wa') { var tel = String(IAR.tel || c.whatsapp || c.telefono || '').replace(/\D/g, ''); if (tel.length === 8) tel = '507' + tel; window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(t), '_blank'); }
  if (como === 'mail') window.open('mailto:' + encodeURIComponent(IAR.correo || c.correo || '') + '?subject=' + encodeURIComponent('Estado de cuenta · ' + (c.cliente || '')) + '&body=' + encodeURIComponent(t), '_blank');
}
function iaAnotarEnviado() {
  var k = IAR.k, canal = IAR.canal;
  MK.llamar('api_cobAnotar', { clave: k, tipo: 'enviado', canal: canal, notas: 'Mensaje redactado con ' + iaNombre() + ' (' + IAR.tono + ')' }).then(function () { MK.cerrarLado(); IAR = null; MK.aviso('Anotado como enviado'); recargar(); }, function () {});
}
function vIAChat() {
  var A = IA.aj, puede = A.conectada && A.encendida;
  var h = '<div class="card"><div id="ia-chat" style="display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px">';
  if (!IA.chat.length) h += '<div class="fila" style="gap:10px;align-items:flex-start">' + iaAvatar(30) + '<div class="small" style="background:#eef3fb;border-radius:12px;padding:10px 12px;max-width:80%">Pregúntame lo que necesites de la cartera: quién debe más, a quién conviene llamar hoy, cómo va una cuenta o cómo decirle algo a un cliente con tacto.</div></div>';
  IA.chat.forEach(function (m) {
    h += m.de === 'yo' ? '<div style="align-self:flex-end;background:var(--navy2,#14306b);color:#fff;border-radius:12px;padding:9px 12px;max-width:80%;white-space:pre-wrap;font-size:13.5px">' + MK.esc(m.t) + '</div>'
      : '<div class="fila" style="gap:10px;align-items:flex-start">' + iaAvatar(30) + '<div style="background:' + (m.error ? '#fff4d6' : '#eef3fb') + ';border-radius:12px;padding:9px 12px;max-width:80%;white-space:pre-wrap;font-size:13.5px">' + MK.esc(m.t) + '</div></div>';
  });
  if (IA.pensando) h += '<div class="fila" style="gap:10px">' + iaAvatar(30) + '<div class="small muted" style="padding:9px 0">' + MK.esc(iaNombre()) + ' está pensando…</div></div>';
  h += '</div><div class="fila" style="gap:8px;margin-top:10px"><textarea class="in" id="ia-q" rows="2" style="flex:1" placeholder="' + (puede ? 'Escríbele a ' + MK.esc(iaNombre()) + '…' : 'La asistente no está disponible') + '"' + (puede ? '' : ' disabled') + ' onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();iaPreguntar();}"></textarea>' +
    '<button class="btn pri" onclick="iaPreguntar()"' + (puede && !IA.pensando ? '' : ' disabled') + '>Enviar</button></div>' +
    '<div class="small muted" style="margin-top:6px">Solo conversa contigo: no envía nada a ningún cliente.' + (A.proveedor === 'gemini' ? ' A Gemini los clientes le llegan como códigos, sin nombres.' : '') + '</div></div>';
  setTimeout(function () { var el = document.getElementById('ia-chat'); if (el) el.scrollTop = el.scrollHeight; }, 0);
  return h;
}
function iaPreguntar() {
  var q = String((document.getElementById('ia-q') || {}).value || '').trim(); if (!q || IA.pensando) return;
  IA.chat.push({ de: 'yo', t: q }); IA.pensando = true; MK.repintar();
  MK.api('api_iaPreguntar', MK.pinUso(), { mensajes: IA.chat.filter(function (m) { return !m.error; }).slice(-12) }).then(function (r) {
    IA.pensando = false;
    var R = r && r.ok ? r.respuesta : null;
    if (R && R.ok) IA.chat.push({ de: 'ella', t: R.texto });
    else IA.chat.push({ de: 'ella', t: (R && R.error) || (r && r.error) || 'No pude responder. Intenta de nuevo.', error: true });
    MK.repintar(); setTimeout(function () { var el = document.getElementById('ia-q'); if (el) el.focus(); }, 0);
  }, function (e) { IA.pensando = false; IA.chat.push({ de: 'ella', t: 'Sin conexión: ' + e.message, error: true }); MK.repintar(); });
}
function vIAAjustes() {
  var A = IA.aj;
  return '<div class="card"><h3 style="margin-top:0">Ajustes de la asistente</h3>' +
    '<label class="lb">Nombre</label><input class="in" id="iaa-nom" maxlength="40" value="' + MK.esc(A.nombre || '') + '" placeholder="El nombre con que firma: «[Nombre] · Asistente de ECOVSA»">' +
    '<label class="lb">Estado</label><select class="in" id="iaa-enc"><option value="1"' + (A.encendida ? ' selected' : '') + '>Encendida</option><option value="0"' + (A.encendida ? '' : ' selected') + '>Apagada</option></select>' +
    '<label class="lb">Respuestas</label><select class="in" id="iaa-mod"><option value="rapida"' + (A.modo !== 'equilibrada' ? ' selected' : '') + '>Rápidas y cortas</option><option value="equilibrada"' + (A.modo === 'equilibrada' ? ' selected' : '') + '>Más completas</option></select>' +
    '<div class="nota" style="margin:10px 0">La clave del proveedor se pone en <a href="Configuracion.html#ia">Configuración › Conexión de IA</a>. ' + (A.conectada ? 'Hoy: ' + MK.esc(A.proveedorN) + '.' : 'Todavía no está conectada.') + ' Tope: 250 consultas al día.</div>' +
    '<button class="btn pri" onclick="iaGuardarAjustes(this)">' + MK.ic('check', 16) + 'Guardar</button></div>';
}
function iaGuardarAjustes(btn) {
  MK.ocupado(btn, true);
  MK.llamar('api_iaGuardarAjustes', { nombre: MK.val('iaa-nom'), encendida: MK.val('iaa-enc') === '1', modo: MK.val('iaa-mod') }).then(function () { IA.aj = null; MK.aviso('Guardado'); cargarIA(); MK.repintar(); }, function () { MK.ocupado(btn, false); });
}

</script>
