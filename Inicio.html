<script>
/* ════════════════════════════════════════════════════════════════
   DIRECCIÓN · opción B (api 3.4)
   Resumen + las cuatro zonas (lo que calcula Direccion.gs, sin repetir
   cálculos) + Finanzas adentro (Inicio-2.js). Gerencia fiscaliza: ve
   todo y anota; mover estados queda según las Reglas de Configuración.
   ════════════════════════════════════════════════════════════════ */
var ZONAS = {
  log: { id: 'logistica', n: 'Logística', c: 'var(--z-log)', hex: '#0B5394', i: 'camion' },
  mer: { id: 'mercadeo', n: 'Mercadeo', c: 'var(--z-mer)', hex: '#00792F', i: 'maletin' },
  pla: { id: 'planta', n: 'Planta', c: 'var(--z-pla)', hex: '#6C3A96', i: 'planta' },
  cob: { id: 'cobros', n: 'Cobros', c: 'var(--z-cob)', hex: '#c98a00', i: 'moneda' }
};
var SEC_DE = { logistica: 'log', mercadeo: 'mer', planta: 'pla', cobros: 'cob' };
var PER = 'mes', DESDE = '', HASTA = '', CURVA = '12';
var ZCACHE = {}, ABIERTAS = {};
function B() { return MK.base || {}; }
function D(v) { return MK.dinero(v); }
function setZc(c) { document.documentElement.style.setProperty('--zc', c); }

/* ── periodo de las zonas y del Resumen ── */
function rangoZ(p) {
  var h = MK.hoy, d = h;
  if (p === 'semana') d = MK.masDias(h, -6);
  else if (p === 'quincena') d = MK.masDias(h, -14);
  else if (p === 'mes') d = h.slice(0, 8) + '01';
  else if (p === 'trimestre') d = MK.masMeses(h.slice(0, 8) + '01', -2);
  else if (p === 'anio') d = h.slice(0, 4) + '-01-01';
  return [d, h];
}
function fijarPer(p) { PER = p; if (p !== 'libre') { var r = rangoZ(p); DESDE = r[0]; HASTA = r[1]; } }
function enPalabras(d1, d2) {
  if (!d1 || !d2) return '';
  if (d1.slice(0, 7) === d2.slice(0, 7)) return 'Del ' + Number(d1.slice(8)) + ' al ' + Number(d2.slice(8)) + ' de ' + MK.mesNombre(d2.slice(0, 7)).split(' ')[0];
  return 'Del ' + MK.fechaCorta(d1) + ' al ' + MK.fechaCorta(d2);
}
function chipsPerZ(fn) {
  return '<div class="per">' + MK.chips([['semana', 'Semana'], ['quincena', 'Quincena'], ['mes', 'Mes'], ['trimestre', 'Trimestre'], ['anio', 'Año']], PER, fn || 'cambiaPerZ') +
    '<input type="date" id="z-d1" value="' + DESDE + '" onchange="fechasZ()"><input type="date" id="z-d2" value="' + HASTA + '" onchange="fechasZ()"></div>';
}
function cambiaPerZ(p) { fijarPer(p); ABIERTAS = {}; if (MK.seccion === 'res') { MK.recargar(); } else MK.repintar(); }
function fechasZ() {
  var a = MK.val('z-d1'), b = MK.val('z-d2'); if (!a || !b) return;
  if (a > b) { var t = a; a = b; b = t; }
  PER = 'libre'; DESDE = a; HASTA = b; if (MK.seccion === 'res') MK.recargar(); else MK.repintar();
}

/* ═══════════ RESUMEN ═══════════ */
function spark(vals, color) {
  var max = Math.max.apply(null, vals.map(function (v) { return Math.abs(v); }).concat([1]));

<script>
/* ════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════ */
var MOVTOPE = 60, FPER = 'anio', FPRY = '', ER = {}, SOL = null, SOLF = 'todas', SOLQ = '', MOVS = {}, MOVQ = '', MOVSOLO = '', CAT = null, CATQ = '';

function chipsFPer() { return MK.chips([['mes', 'Mes'], ['mesant', 'Mes pasado'], ['trim', 'Trimestre'], ['anio', 'Año'], ['todo', 'Todo']], FPER, 'cambiaFPer'); }

function textoRango(r) { return r[0] === '2020-01-01' ? 'Todo el registro' : enPalabras(r[0], r[1]) + (r[0].slice(0, 4) !== r[1].slice(0, 4) ? '' : ' de ' + r[1].slice(0, 4)); }

/* ═══════════ UTILIDAD ═══════════ */

      (esp.length ? esp.map(function (s) {
