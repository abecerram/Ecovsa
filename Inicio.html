<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dirección · ECOVSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:'oculto',enSupabase:/^api_(?!optimizarRuta$)/};</script>
<script src="puente.js"></script>
<link rel="stylesheet" href="modulo-kit.css">
<script src="modulo-kit.js"></script>
<style>
/* ═══ Dirección · opción B, con Finanzas adentro (api 3.4) ═══ */
:root{--z-log:#0B5394;--z-mer:#00792F;--z-pla:#6C3A96;--z-cob:#c98a00;--z-fin:#0f7a7a;--zc:var(--navy2)}
.ph h1{display:flex;align-items:center;gap:10px}
.ph h1::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--zc)}
.et{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted2)}
.chipx{white-space:nowrap;display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.chipx.bad{background:var(--bad-bg);color:#a8262b}.chipx.warn{background:var(--warn-bg);color:#8a6300}.chipx.gris{background:var(--line2);color:var(--muted)}.chipx.ok{background:var(--ok-bg);color:#276b33}.chipx.info{background:var(--info-bg);color:#2c56a8}
.per{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.per input[type=date],.per input[type=month]{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font:inherit;font-size:12.5px;background:#fff;color:var(--ink)}
.dice{font-size:12.5px;color:var(--muted);margin:-4px 0 14px}.dice b{color:var(--ink)}
/* resumen */
.zt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.zt article{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border-top:4px solid var(--c);min-width:0}
.zt article:hover{box-shadow:0 6px 18px rgba(15,33,64,.08)}
.zt .zn{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--c)}
.zt .zn .n{margin-left:auto;font-size:11px;background:var(--c);color:#fff;border-radius:10px;padding:1px 7px;letter-spacing:0}
.zt .v{font-size:21px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.zt .s{font-size:12px;color:var(--muted)}
.zt .cmp{font-size:11.5px;font-weight:700}.zt .cmp.bien{color:var(--ok)}.zt .cmp.mal{color:var(--bad)}.zt .cmp.igual{color:var(--muted2)}
.zt .du{font-size:12px;color:#3d4a60;border-top:1px solid var(--line2);padding-top:7px;margin-top:auto}
.spk{display:flex;align-items:center;gap:3px;height:34px}
.spk i{flex:1;border-radius:3px;min-height:2px}
.res2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.lista .li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2)}
.lista .li:first-child{border-top:0}
.lista .zc{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.lista .tx{flex:1;min-width:0}.lista .tx b{display:block;font-size:13.5px}.lista .tx span{font-size:12.5px;color:var(--muted)}
.lista .li.clic{cursor:pointer}.lista .li.clic:hover .tx b{color:var(--info)}
.lista .tx .urgx,.urgx{font-size:10px;font-weight:800;color:#fff;background:var(--bad);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.linea{font-size:14px;line-height:1.6;color:#3d4a60}.linea b{color:var(--ink)}
/* zonas */
.bloq{margin-bottom:14px}.bloq>.et{display:block;margin-bottom:8px}
.kpi .de{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border-radius:5px;padding:1px 5px;margin-left:6px;background:var(--line2);color:var(--muted);vertical-align:1px}
.kpi .de.per{background:var(--info-bg);color:#2c56a8}
.kpi.malo b{color:var(--bad)}
.duele{display:flex;gap:10px;align-items:flex-start;background:var(--bad-bg);border:1px solid #f3c2c4;border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#7a1f23}
.duele.amb{background:var(--warn-bg);border-color:#f3dc9c;color:#6b4d00}
.duele svg{flex:none;margin-top:1px}
.graf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.graf.ancha{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.card h3 .lee,.lee{font-size:12px;color:var(--muted);font-weight:500}
.svgw svg{width:100%;height:auto;display:block}
.ley{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rep .f{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.rep .f .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rep .f .b{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}.rep .f .b i{display:block;height:100%;border-radius:5px}
.rep .f .c{text-align:right;font-weight:700}.rep .sin{color:var(--muted2)}
.reps{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.decide{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:14px}
.decide .d{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.decide .d span{color:var(--muted)}.decide .d.urg{border-left:4px solid var(--bad)}
.preg{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.preg>button{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;cursor:pointer}
.preg>button:hover{background:var(--hover)}
.preg .q{font-size:12.5px;color:var(--muted)}.preg .r{font-size:14px;font-weight:700}
.preg .cuenta{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--line2);border-radius:8px;padding:3px 9px;white-space:nowrap}
.preg .fl{transition:transform .15s;color:var(--muted2)}
.preg.abierta .fl{transform:rotate(180deg)}
.preg .cuerpo{display:none;padding:0 14px 14px}.preg.abierta .cuerpo{display:block}
.preg td.alerta{color:var(--bad);font-weight:700}
.preg tr.extra{display:none}
.mas{margin-top:8px}
/* finanzas */
.regla-hoy{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#eef6f6;border:1px solid #cfe5e5;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.regla-hoy .sp{flex:1}.regla-hoy .l{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.est{white-space:nowrap;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}
.est.sol{background:var(--info-bg);color:#2c56a8}.est.vb{background:var(--warn-bg);color:#8a6300}.est.pp{background:#fff4d6;color:#8a6300}.est.pag{background:var(--ok-bg);color:#276b33}.est.rec{background:var(--bad-bg);color:#a8262b}.est.anu{background:var(--line2);color:var(--muted)}
.notag{white-space:pre-wrap;background:#fffaf0;border:1px solid #f0d9a0;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#5c4400}
.mm td.neg{color:var(--bad);font-weight:700}.mm td.pos{color:var(--ok);font-weight:700}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;font-size:13px}
.dl div span{display:block;font-size:11.5px;color:var(--muted)}.dl div b{font-weight:700}
.pie2{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.tb td.r,.tb tr.tot td{white-space:nowrap}
.cat-t td small{display:block;color:var(--muted);font-size:11.5px}
@media (max-width:1180px){.zt{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.zt{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.res2,.graf,.graf.ancha,.reps{grid-template-columns:minmax(0,1fr)}.dl{grid-template-columns:minmax(0,1fr)}.rep .f{grid-template-columns:minmax(0,110px) minmax(0,1fr) 40px}}
@media (max-width:460px){.zt{grid-template-columns:minmax(0,1fr)}}
@media print{.per,.chips,.btn,.mas{display:none!important}.preg .cuerpo{display:block}.preg tr.extra{display:table-row}}
</style>
</head>
<body>
<div id="sysbar"></div>
<div class="mtabs" id="mtabs"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"></main></div>
<script>
/* ════════════════════════════════════════════════════════════════
   DIRECCIÓN · opción B (api 3.4)
   Resumen + las cuatro zonas (lo que calcula Direccion.gs, sin repetir
   cálculos) + Finanzas adentro (Inicio-2.js). Gerencia fiscaliza: ve
   todo y anota; mover estados queda según las Reglas de Configuración.
   ════════════════════════════════════════════════════════════════ */
var ZONAS = {
  log: { id: 'logistica', n: 'Logística', c: 'var(--z-log)', hex: '#0B5394', i: 'camion' },
  mer: { id: 'mercadeo', n: 'Mercadeo', c: 'var(--z-mer)', hex: '#00792F', i: 'maletin' },
  pla: { id: 'planta', n: 'Planta', c: 'var(--z-pla)', hex: '#6C3A96', i: 'planta' },
  cob: { id: 'cobros', n: 'Cobros', c: 'var(--z-cob)', hex: '#c98a00', i: 'moneda' }
};
var SEC_DE = { logistica: 'log', mercadeo: 'mer', planta: 'pla', cobros: 'cob' };
var PER = 'mes', DESDE = '', HASTA = '', CURVA = '12';
var ZCACHE = {}, ABIERTAS = {};
function B() { return MK.base || {}; }
function D(v) { return MK.dinero(v); }
function setZc(c) { document.documentElement.style.setProperty('--zc', c); }

/* ── periodo de las zonas y del Resumen ── */
function rangoZ(p) {
  var h = MK.hoy, d = h;
  if (p === 'semana') d = MK.masDias(h, -6);
  else if (p === 'quincena') d = MK.masDias(h, -14);
  else if (p === 'mes') d = h.slice(0, 8) + '01';
  else if (p === 'trimestre') d = MK.masMeses(h.slice(0, 8) + '01', -2);
  else if (p === 'anio') d = h.slice(0, 4) + '-01-01';
  return [d, h];
}
function fijarPer(p) { PER = p; if (p !== 'libre') { var r = rangoZ(p); DESDE = r[0]; HASTA = r[1]; } }
function enPalabras(d1, d2) {
  if (!d1 || !d2) return '';
  if (d1.slice(0, 7) === d2.slice(0, 7)) return 'Del ' + Number(d1.slice(8)) + ' al ' + Number(d2.slice(8)) + ' de ' + MK.mesNombre(d2.slice(0, 7)).split(' ')[0];
  return 'Del ' + MK.fechaCorta(d1) + ' al ' + MK.fechaCorta(d2);
}
function chipsPerZ(fn) {
  return '<div class="per">' + MK.chips([['semana', 'Semana'], ['quincena', 'Quincena'], ['mes', 'Mes'], ['trimestre', 'Trimestre'], ['anio', 'Año']], PER, fn || 'cambiaPerZ') +
    '<input type="date" id="z-d1" value="' + DESDE + '" onchange="fechasZ()"><input type="date" id="z-d2" value="' + HASTA + '" onchange="fechasZ()"></div>';
}
function cambiaPerZ(p) { fijarPer(p); ABIERTAS = {}; if (MK.seccion === 'res') { MK.recargar(); } else MK.repintar(); }
function fechasZ() {
  var a = MK.val('z-d1'), b = MK.val('z-d2'); if (!a || !b) return;
  if (a > b) { var t = a; a = b; b = t; }
  PER = 'libre'; DESDE = a; HASTA = b; if (MK.seccion === 'res') MK.recargar(); else MK.repintar();
}

/* ═══════════ RESUMEN ═══════════ */
function spark(vals, color) {
  var max = Math.max.apply(null, vals.map(function (v) { return Math.abs(v); }).concat([1]));
  return '<div class="spk">' + vals.map(function (v) { return '<i style="height:' + Math.max(6, Math.abs(v) / max * 100) + '%;background:' + (v < 0 ? 'var(--bad)' : color) + ';opacity:.85"></i>'; }).join('') + '</div>';
}
function cmp(z) {
  if (!z.comparable || !z.difTexto || z.dif == null) return '';
  var d = Number(z.dif) || 0, malo = z.subirEsMalo ? d > 0 : d < 0;
  var cls = d === 0 ? 'igual' : malo ? 'mal' : 'bien';
  return '<span class="cmp ' + cls + '">' + (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '= ') + MK.num(Math.abs(d), Math.abs(d) % 1 ? 1 : 0) + ' ' + MK.esc(z.difTexto) + '</span>';
}
function vResumen() {
  var b = B(), f = b.finanzas;
  setZc('var(--navy2)');
  var h = MK.cabeza('Resumen', enPalabras(b.desde, b.hasta) + ' · cada tarjeta abre su zona', chipsPerZ());
  h += '<div class="zt">' + (b.zonas || []).map(function (z) {
    var k = SEC_DE[z.zona], Z = ZONAS[k] || {}, pend = z.pendientes && z.pendientes.total;
    return '<article style="--c:' + Z.c + '" onclick="MK.ir(\'' + k + '\')"><div class="zn">' + MK.ic(Z.i, 15) + MK.esc(Z.n) + (pend ? '<span class="n">' + pend + '</span>' : '') + '</div>' +
      '<div class="v num">' + MK.esc(z.texto || '—') + '</div><div class="s">' + MK.esc(z.sub || '') + '</div>' + cmp(z) +
      (z.duele ? '<div class="du">' + MK.esc(z.duele) + '</div>' : '') + '</article>';
  }).join('');
  if (f && !f.error) {
    var m = f.mes, s = f.solicitudes || {};
    h += '<article style="--c:var(--z-fin)" onclick="MK.ir(\'fut\')"><div class="zn">' + MK.ic('billete', 15) + 'Finanzas' + (s.porPagar ? '<span class="n">' + s.porPagar + '</span>' : '') + '</div>' +
      '<div class="v num" style="color:' + (m.utilidad < 0 ? 'var(--bad)' : 'var(--ink)') + '">' + D(m.utilidad) + '</div><div class="s">utilidad de ' + MK.mesNombre(m.mes).split(' ')[0] + ' · ingreso ' + D(m.ingreso) + ' · gasto ' + D(m.gasto) + '</div>' +
      spark((f.serie || []).map(function (x) { return x.utilidad; }), 'var(--z-fin)') +
      '<div class="du">' + (s.porPagar ? s.porPagar + ' solicitud(es) por pagar · ' + D(s.montoPorPagar) + (s.viejas ? ' · ' + s.viejas + ' con más de 7 días' : '') : 'Ninguna solicitud por pagar.') + '</div></article>';
  }
  h += '</div>';

  /* Te esperan: lo del vigía de cada zona + las solicitudes */
  var te = [];
  if (f && !f.error) {
    var s2 = f.solicitudes || {};
    if (s2.porAprobar) te.push({ c: 'var(--z-fin)', i: 'billete', t: s2.porAprobar + ' solicitud(es) esperando aprobación', d: D(s2.montoPorAprobar), ir: 'fsol', u: false, o: 90 });
    if (s2.porPagar) te.push({ c: 'var(--z-fin)', i: 'billete', t: s2.porPagar + ' solicitud(es) por pagar', d: D(s2.montoPorPagar) + (s2.viejas ? ' · ' + s2.viejas + ' llevan más de 7 días' : '') + (s2.pasanAviso ? ' · ' + s2.pasanAviso + ' pasan del monto de aviso' : ''), ir: 'fsol', u: s2.urgentes > 0, o: s2.viejas ? 80 : 40 });
  }
  (b.zonas || []).forEach(function (z) {
    var k = SEC_DE[z.zona], Z = ZONAS[k] || {}, l = (z.pendientes && z.pendientes.lista) || [];
    l.slice(0, 3).forEach(function (p) { te.push({ c: Z.c, i: Z.i, t: p.titulo, d: Z.n + ' · ' + (p.detalle || ''), ir: k, u: !!p.alta, o: p.alta ? 100 : 30 }); });
    if (l.length > 3) te.push({ c: Z.c, i: Z.i, t: 'Y ' + (z.pendientes.total - 3) + ' más en ' + Z.n, d: 'se ven en la zona', ir: k, u: false, o: 10 });
  });
  te.sort(function (a, b) { return b.o - a.o; });
  h += '<div class="res2"><section class="card"><h3>Te esperan <span class="sp"></span><span class="lee">lo urgente arriba</span></h3><div class="lista">' +
    (te.length ? te.slice(0, 12).map(function (x) {
      return '<div class="li clic" style="--c:' + x.c + '" onclick="MK.ir(\'' + x.ir + '\')"><span class="zc">' + MK.ic(x.i, 17) + '</span><div class="tx"><b>' + MK.esc(x.t) + (x.u ? '<span class="urgx">URGENTE</span>' : '') + '</b><span>' + MK.esc(x.d) + '</span></div>' + MK.ic('flecha', 16) + '</div>';
    }).join('') : MK.vacio('Nada esperando una decisión.')) + '</div></section>';
  h += '<section class="card"><h3>El mes en una línea</h3><div class="lee" style="margin-bottom:10px">' + enPalabras(b.desde, b.hasta) + '</div><div class="linea">' + lineaMes() + '</div>' +
    ((b.fallas || []).length ? '<div class="nota">No se pudo calcular: ' + MK.esc(b.fallas.join(' · ')) + '</div>' : '') + '</section></div>';
  /* api 3.5 · Avisos: lo que Cobros y Mercadeo hicieron y gerencia debe saber. Solo informan. */
  var AV = b.avisos || [];
  if (AV.length) {
    var icA = { incobrable: 'archivo', suspension: 'candado', reactivacion: 'renovar' }, cA = { incobrable: 'var(--z-cob, #c98a00)', suspension: 'var(--bad)', reactivacion: 'var(--ok)' };
    h += '<section class="card" style="margin-top:14px"><h3>Avisos de Cobros y Mercadeo <span class="sp"></span><span class="lee">últimos 15 días · solo informan</span></h3><div class="lista">' +
      AV.slice(0, 10).map(function (a) {
        return '<div class="li" style="--c:' + (cA[a.tipo] || 'var(--navy2)') + '"><span class="zc">' + MK.ic(icA[a.tipo] || 'alerta', 17) + '</span><div class="tx"><b>' + MK.esc(a.titulo) + '</b><span>' + MK.esc(a.detalle) + ' · ' + MK.esc(MK.dmy(a.fecha)) + (a.hora ? ' ' + MK.esc(a.hora) : '') + '</span></div></div>';
      }).join('') + (AV.length > 10 ? '<div class="nota">Y ' + (AV.length - 10) + ' más en estos 15 días.</div>' : '') + '</div></section>';
  }
  return h;
}
function lineaMes() {
  var b = B(), z = {}, f = b.finanzas, out = [];
  (b.zonas || []).forEach(function (x) { z[x.zona] = x; });
  if (f && !f.error) {
    out.push('En <b>' + MK.mesNombre(f.mes.mes) + '</b> se facturó <b>' + D(f.mes.ingreso) + '</b> y se gastó <b>' + D(f.mes.gasto) + '</b>: la utilidad va en <b style="color:' + (f.mes.utilidad < 0 ? 'var(--bad)' : 'var(--ok)') + '">' + D(f.mes.utilidad) + '</b>.');
    var s = f.solicitudes || {};
    out.push('Se pagaron ' + (s.pagadasMes || 0) + ' solicitud(es) por ' + D(s.montoPagadoMes) + (s.porPagar ? ' y quedan ' + s.porPagar + ' por pagar.' : '; no queda ninguna por pagar.'));
  }
  if (z.logistica && !z.logistica.error) out.push('Logística: ' + MK.esc(z.logistica.texto) + ' (' + MK.esc(z.logistica.sub) + ').');
  if (z.mercadeo && !z.mercadeo.error) out.push('Mercadeo: ' + MK.esc(z.mercadeo.texto) + '.');
  if (z.planta && !z.planta.error) out.push('Planta: ' + MK.esc(z.planta.texto) + '.');
  if (z.cobros && !z.cobros.error) out.push('Cobros: ' + MK.esc(z.cobros.texto) + ' (' + MK.esc(z.cobros.sub) + ').');
  return out.join(' ');
}

/* ═══════════ LAS CUATRO ZONAS ═══════════
   El detalle llega con las preguntas ya contestadas (api_dir_zona) y se
   guarda por zona y periodo: saltar entre zonas es instantáneo. */
function claveZ(k) { return ZONAS[k].id + '|' + DESDE + '|' + HASTA + '|' + (k === 'mer' ? CURVA : ''); }
function vZona(k) {
  var Z = ZONAS[k]; setZc(Z.c);
  var ck = claveZ(k), r = ZCACHE[ck];
  if (!r) {
    if (r !== false) { ZCACHE[ck] = false;
    MK.api('api_dir_zona', MK.pinUso(), Z.id, DESDE, HASTA, CURVA).then(function (x) {
      if (!x || !x.ok) { delete ZCACHE[ck]; if (MK.seccion === k) document.getElementById('main').innerHTML = MK.cabeza(Z.n) + '<div class="aviso rj">' + MK.esc((x && x.error) || 'No se pudo calcular.') + '</div>'; return; }
      ZCACHE[ck] = x; if (x.conteos) { MK.contadores.mer = x.conteos.mercadeo ? { n: x.conteos.mercadeo } : null; MK.contadores.cob = x.conteos.cobros ? { n: x.conteos.cobros } : null; MK.pintarMenu(); }
      if (MK.seccion === k) MK.repintar();

/* ═══════════ GASTOS ═══════════ */
function traerMovs() {
  var r = rangoF(FPER), k = r.join('|') + '|' + MOVQ + '|' + MOVSOLO;
  if (MOVS[k]) return MOVS[k];
  if (MOVS[k] === undefined) {
    MOVS[k] = null;
    MK.api('api_movimientos', MK.pinUso(), r[0], r[1], { q: MOVQ, solo: MOVSOLO, limite: 400 }).then(function (x) {
      if (!x || !x.ok) { MOVS[k] = undefined; MK.aviso((x && x.error) || 'No se pudo leer'); return; }
      MOVS[k] = x; MK.repintar();
    }, function () { MOVS[k] = undefined; });
  }
  return null;
}

  h += '<div class="card"><h3>Uno por uno <span class="sp"></span><span class="lee">aquí se marca lo extraordinario y lo que está por confirmar</span></h3>' +

    ph: 'Buscar proveedor, SP-2026…, zona',
    fn: function (q) {
      var Q = q.toUpperCase().trim(), out = [];
      Object.keys(ZONAS).forEach(function (k) { if (ZONAS[k].n.toUpperCase().indexOf(Q) === 0) out.push({ t: ZONAS[k].n, d: 'Zona de Dirección', i: ZONAS[k].i, ir: function () { MK.ir(k); } }); });
      if (!verFin()) return out;
      var arma = function () {
        ((SOL && SOL.solicitudes) || []).forEach(function (s) { if ((s.solicitudId + ' ' + s.proveedor).toUpperCase().indexOf(Q) >= 0) out.push({ t: s.solicitudId + ' · ' + s.proveedor, d: (s.etiqueta || s.estado) + ' · ' + D(s.total), i: 'billete', ir: function () { MK.ir('fsol'); verSol(s.solicitudId); } }); });
        return out;
      };
      if (SOL) return arma();
      return MK.api('api_dirSolicitudes', MK.pinUso(), {}).then(function (x) { if (x && x.ok) SOL = x; return arma(); });
    }
  },
  paginas: [
    { g: 'GERENCIA' }, { id: 'res', n: 'Resumen', i: 'casa' },
    { g: 'OPERACIÓN' }, { id: 'log', n: 'Logística', i: 'camion' }, { id: 'mer', n: 'Mercadeo', i: 'maletin' }, { id: 'pla', n: 'Planta', i: 'planta' }, { id: 'cob', n: 'Cobros', i: 'moneda' },
    { g: 'FINANZAS', quien: function (u) { return !!u._fin; } },
    { id: 'fut', n: 'Utilidad', i: 'grafico', quien: function (u) { return !!u._fin; } },
    { id: 'fsol', n: 'Solicitudes de pago', i: 'billete', quien: function (u) { return !!u._fin; } },
    { id: 'fgas', n: 'Gastos', i: 'factura', quien: function (u) { return !!u._fin; } },
    { id: 'fcat', n: 'Catálogos', i: 'libro', quien: function (u) { return !!u._fin; } },
    { g: 'INFORMES' }, { id: 'imp', n: 'Imprimir esta vista', i: 'imprimir', ir: 'javascript:window.print()' }
  ],
  pieMenu: '¿Buscas las pantallas anteriores? <a href="InicioAnterior.html">Dirección</a> · <a href="FinanzasAnterior.html">Finanzas</a>',
  alCargar: function (b) {
    MK.usuario = MK.usuario || {};
    MK.usuario._fin = !!(b.permisos && b.permisos.finanzas !== 'no');
    MK.contadores = {};
    var c = b.conteos || {};
    if (c.mercadeo) MK.contadores.mer = { n: c.mercadeo };
    if (c.cobros) MK.contadores.cob = { n: c.cobros };
    var s = b.finanzas && b.finanzas.solicitudes;
    if (s && (s.porPagar || s.porAprobar)) MK.contadores.fsol = { n: s.porAprobar || s.porPagar, t: s.viejas ? 'am' : '' };
    MK.op.accion.t = 'Solicitudes' + (s && s.porPagar ? ' · ' + s.porPagar + ' por pagar' : '');
    /* cambió la base: lo guardado de finanzas se vuelve a pedir */
    SOL = null; ER = {}; MOVS = {};
  },
  pintar: function (id) {
    if (!MK.base) return;
    var V = { res: vResumen, log: function () { return vZona('log'); }, mer: function () { return vZona('mer'); }, pla: function () { return vZona('pla'); }, cob: function () { return vZona('cob'); }, fut: vUtil, fsol: vSol, fgas: vGas, fcat: vCat };
    document.getElementById('main').innerHTML = (V[id] || vResumen)();
  }
});

</script>
