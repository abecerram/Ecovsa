name: Preparar acceso Agregar cliente 3.101
on:
  push:
    branches: [codex/agregar-cliente-3101]
    paths: [.github/planificador3101/**, .github/workflows/preparar-agregar-3101.yml]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          node .github/planificador3101/generar.cjs
          echo 'a37699c4631009283096d882efc233ed7d52c3ffdbb180e19a4d8910e6f029e3  Index.html' | sha256sum -c -
          git rm .github/planificador3101/generar.cjs .github/planificador3101/pantalla_3101.js .github/planificador3101/estilos_3101.css .github/workflows/preparar-agregar-3101.yml
          rm -rf .github/planificador3101/GitHub .github/planificador3101/SHA256.json
          git add Index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preparar pantalla 3.101 para agregar clientes'
          git push origin HEAD:refs/heads/codex/agregar-cliente-3101
