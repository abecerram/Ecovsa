name: Preparar pantalla 3.99 final
on:
  push:
    branches: [codex/planificador-399]
    paths: [.github/planificador399/**, .github/workflows/preparar-planificador-399.yml]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          node .github/planificador399/construir.cjs
          echo '745a46cf83ac451dc33280f376721aebaf3f6f4a95382e6883c49b8c0030a62c  Index.html' | sha256sum -c -
          git rm .github/planificador399/construir.cjs .github/planificador399/pantalla_399.js .github/planificador399/estilos_399.css .github/workflows/preparar-planificador-399.yml
          rm .github/planificador399/pantalla_sha256.json
          git add Index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Planificador 3.99 listo para publicación autorizada'
          git push origin HEAD:refs/heads/codex/planificador-399
