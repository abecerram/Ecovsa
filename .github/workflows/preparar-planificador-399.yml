name: Preparar pantalla 3.99 comprobada
on:
  push:
    branches: [codex/planificador-399]
    paths: [.github/planificador399/**, .github/workflows/preparar-planificador-399.yml]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Construir pantalla exacta de CI43760617547
        run: |
          set -euo pipefail
          node .github/planificador399/construir.cjs
          echo '374166c6344ccf9f6d13f0c9f6f594fb2854ccea3c65640f9a992781acfa9a20  Index.html' | sha256sum -c -
      - name: Conservar solo Index en la rama de publicación
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/planificador-399'
          git rm .github/planificador399/construir.cjs .github/planificador399/pantalla_399.js .github/planificador399/estilos_399.css .github/workflows/preparar-planificador-399.yml
          rm .github/planificador399/pantalla_sha256.json
          git add Index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Planificador 3.99: pantalla idéntica al candidato validado'
          git push origin HEAD:refs/heads/codex/planificador-399
