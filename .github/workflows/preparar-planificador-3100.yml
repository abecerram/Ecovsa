name: Preparar pantalla 3.100 final
on:
  push:
    branches: [codex/planificador-3100]
    paths: [.github/planificador3100/**, .github/workflows/preparar-planificador-3100.yml]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          node .github/planificador3100/generar.cjs
          echo '9f16e234cb74333e68ff810a994c6db6f82c1dec214f650fb4cf1f335ac2a418  Index.html' | sha256sum -c -
          git rm .github/planificador3100/generar.cjs .github/planificador3100/pantalla_3100.js .github/planificador3100/estilos_3100.css .github/workflows/preparar-planificador-3100.yml
          rm -rf .github/planificador3100/GitHub .github/planificador3100/SHA256.json
          git add Index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preparar Index 3.100 final verificado'
          git push origin HEAD:refs/heads/codex/planificador-3100
