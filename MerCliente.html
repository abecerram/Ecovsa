<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha del cliente · Mercadeo · ECOVSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:'oculto',enSupabase:/^api_(?!optimizarRuta$)/,
  escritura:/^api_(crm(Guardar|Completar|Anular|Captura|Mover|Reasignar|Borrar|Subir|Usar)|guardar|marcar|abrir|cerrar|registrar|borrar|eliminar|crear|actualizar|enviar|corregir|dar|anular|confirmar|aprobar|rechazar|subir|asignar|mover|cambiar|agregar|nuevo|editar|reabrir|emitir|pasar|pedir)/i};</script>
<script src="puente.js"></script>
<link rel="stylesheet" href="mercadeo-kit.css">
<script src="mercadeo-kit.js"></script>
<style>
/* ── Ficha del cliente · opción A «Encabezado y pestañas» ── */
.sysbar .srch{min-width:0}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--muted)}.crumb a:hover{color:var(--navy2)}
.a-head{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 16px 4px}
.hname{font-size:22px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.bigav{width:52px;height:52px;border-radius:14px;background:#e3e9f3;color:var(--navy2);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);margin-top:14px}
.facts>div{padding:12px 14px 10px;border-right:1px solid var(--line2);min-width:0}
.facts>div:last-child{border:0}
.facts>div>span{display:block;font-size:11px;letter-spacing:.6px;font-weight:700;color:var(--muted2)}
.facts b{display:block;font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.facts small{font-size:12px;color:var(--muted)}
.alerta{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--info);background:#fff;border-radius:12px;padding:12px 14px;margin:14px 0 0}
.alerta.am{border-left-color:var(--amber)}.alerta.rj{border-left-color:var(--bad)}
.alerta .tx{flex:1;min-width:0;font-size:13px}.alerta .tx b{display:block;font-size:14px}
.alerta .ac{display:flex;gap:6px;flex-wrap:wrap}
/* api 3.5 · la solicitud de suspensión que manda Cobros */
.susp{border:1px solid #f1c4c6;border-left:4px solid var(--bad);background:#fff;border-radius:12px;padding:14px 16px;margin:14px 0 0}
.susp.pz{border-color:#f0dcaa;border-left-color:var(--amber)}
.susp .h{display:flex;gap:10px;align-items:flex-start}.susp .h .tx{flex:1;min-width:0}
.susp .h b{display:block;font-size:15px}.susp .h small{font-size:12.5px;color:var(--muted)}
.susp .mo{font-size:13px;background:var(--line2);border-radius:8px;padding:8px 11px;margin:10px 0}
.susp .ck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;margin:6px 0 4px}
.susp .ck div{display:flex;gap:7px;align-items:flex-start;font-size:12.5px}
.susp .ck svg.i{width:15px;height:15px;flex:none;margin-top:2px}
.susp .ck .ck-si svg{color:var(--ok)}.susp .ck .ck-no svg{color:var(--bad)}.susp .ck .ck-av svg{color:var(--amber)}
.susp .nums{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}.susp .nums b{color:var(--ink);font-size:14px}
.susp .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
@media(max-width:560px){.susp .ck{grid-template-columns:1fr}}
.a-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px;overflow-x:auto}
.a-tabs button{border:0;background:none;padding:10px 14px;font:700 13.5px Archivo,sans-serif;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.a-tabs button.on{color:var(--navy2);border-bottom-color:var(--navy2)}
.a-tabs button span{font-size:11px;background:var(--line2);border-radius:8px;padding:1px 7px;margin-left:5px;color:var(--muted)}
.a-tabs button span.r{background:var(--bad-bg);color:var(--bad)}
.a-g{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.a-g>.col{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}
.a-g .card{min-width:0}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;font-size:13px}
.kv>span{color:var(--muted)}
.kv>b,.kv>div{font-weight:600;overflow-wrap:anywhere;min-width:0}
.dgrp{font-size:11px;letter-spacing:.8px;font-weight:700;color:var(--muted2);margin:14px 0 6px;display:flex;gap:8px;align-items:center}
.dgrp .sp{flex:1}
.pil{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pil>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-width:0}
.pil span.h{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.6px;font-weight:700;color:var(--muted2)}
.pil b{display:block;font-size:13.5px;margin-top:4px}
.pil small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.cl .it{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.cl .it:last-child{border:0}
.cl .it .f{color:var(--muted)}
.cl del{color:var(--muted)}.cl ins{text-decoration:none;font-weight:700}
.ct{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.ct:last-of-type{border-bottom:0}
.ct .tx{flex:1;min-width:0}.ct .tx b{display:block}.ct .tx small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.ct .bts{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.tlf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tlx .ev{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:0 0 14px;position:relative}
.tlx .ev:before{content:'';position:absolute;left:16px;top:34px;bottom:0;width:1px;background:var(--line)}
.tlx .ev:last-child:before{display:none}
.tlx .ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--navy2)}
.tlx .ic.sis{color:var(--muted2);background:#f7f9fc}
.tlx .bd{min-width:0;padding-top:2px}
.tlx .bd .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tlx .bd .h b{color:var(--ink);font-size:13px}
.tlx .bd p{font-size:13px;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.tk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2)}
.tk:last-child{border:0}
.tk input{margin-top:3px;accent-color:var(--navy2);width:16px;height:16px;flex:none}
.tk .tx{flex:1;font-size:13px;min-width:0}.tk .tx small{display:block;color:var(--muted);font-size:12px}
.tk .tx a{color:var(--ink);font-weight:600}
.tk.hecha .tx a{text-decoration:line-through;color:var(--muted);font-weight:500}
.dc{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.dc:last-child{border:0}
.dc .fi{width:34px;height:40px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--navy2);flex:none;background:#fafbfd}
.dc .tx{flex:1;min-width:0;font-size:13px}.dc .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dc .tx small{display:block;color:var(--muted);font-size:12px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.chart .bar:hover rect.v{opacity:.8}
.leyenda{display:flex;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leyenda i.pl{height:0;border-top:2px dashed var(--ink);border-radius:0;width:14px;vertical-align:3px}
.suc td b{font-weight:600}
.tb td.num,.tb td.r{white-space:nowrap}
.her{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--line2);cursor:pointer}
.her:last-child{border:0}.her:hover b{color:var(--navy2)}
.sitbx{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.nota{white-space:pre-wrap;font-size:12.5px;color:#34425a;background:#fafbfd;border:1px solid var(--line2);border-radius:9px;padding:9px 10px;max-height:220px;overflow:auto}
.rj-kpi .kpi{padding:10px 12px}.rj-kpi .kpi b{font-size:19px}
.ren{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.ren>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ren>div.on{border-color:var(--navy2);box-shadow:inset 0 0 0 1px var(--navy2);background:#f8faff}
.ren span{display:block;font-size:11px;letter-spacing:.6px;font-weight:700;color:var(--muted2)}
.ren b{display:block;font-size:17px;margin-top:3px}
.ren small{display:block;font-size:12px;color:var(--muted)}
/* editar ficha */
.fg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.fg h4{font-size:12px;letter-spacing:.8px;color:#5b6a80;text-transform:uppercase;margin-bottom:2px}
.rej{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.fuera{font-weight:600;color:#8a5a00;letter-spacing:0}
.pista{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px;background:#fafbfd;border-radius:9px;padding:8px 10px}
@media(max-width:1180px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}.facts>div:nth-child(3){border-right:0}.facts>div{border-bottom:1px solid var(--line2)}}
@media(max-width:900px){
  .a-g{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:1fr 1fr}.facts>div{border-right:0!important;padding:10px 4px}
  .pil{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:120px minmax(0,1fr)}
  .alerta{flex-wrap:wrap}
  .ren{grid-template-columns:1fr}
  .rej{grid-template-columns:1fr}
}
@media(max-width:560px){.rj-kpi{grid-template-columns:1fr 1fr!important}.rj-kpi .kpi b{font-size:16px}.alerta{flex-direction:column;align-items:flex-start}.hname{font-size:19px}.kv{grid-template-columns:1fr;gap:1px 0}.kv>span{margin-top:6px}.qa .btn{padding:7px 10px}.cl .it{grid-template-columns:1fr;gap:2px}}
/* gerencia solo consulta: el CRM (actividades, tareas, contactos, documentos) no lo modifica */
body.solo-ver #q-act,body.solo-ver #q-tar,body.solo-ver #al-tarea,body.solo-ver [data-nt],body.solo-ver [data-ra],body.solo-ver [data-gc],body.solo-ver [data-rt],body.solo-ver [data-nc],body.solo-ver [data-ec],body.solo-ver [data-bc],body.solo-ver [data-sd],body.solo-ver [data-tk]{display:none!important}
</style>
</head>
<body class="mk">
<div id="sysbar"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"><div class="cargando">Cargando…</div></main></div>
<script>
(function () {
  var E = MK.esc, D = MK.dinero, N = MK.num, IC = MK.ic;
  var ID = MK.param('id'), R = null, TAB = 'resumen', TLF = 'todo', ROL = '', LISTAS = null;
  var TABS = ['resumen', 'servicio', 'cobros', 'contrato', 'contactos', 'actividad', 'documentos'];
  var NIV = { sano: ['Sano', 'ok'], atencion: ['Atención', 'warn'], riesgo: ['En riesgo', 'bad'], crecer: ['Puede crecer', 'info'] };
  var SIT = { activo: ['Activo', 'ok'], mora: ['Suspendido por mora', 'bad'], pausa: ['En pausa', 'warn'], cierre: ['De baja · cerró', 'gris'], retiro: ['De baja · se retiró', 'gris'] };
  var SIT_TEXTO = {
    mora: ['Suspender por mora', 'Deja de aparecer en las rutas mientras no pague. Lo usual es que Cobros lo pida primero; esta decisión es de Mercadeo y gerencia ve el aviso. Cuando pague, se reactiva desde aquí.', 'Por qué (n.º de factura, monto pendiente, con quién se habló)'],
    pausa: ['Pausa a solicitud del cliente', 'Deja de aparecer en las rutas mientras dure. El contrato sigue vivo.', 'Por qué (quién lo pidió y hasta cuándo)'],
    cierre: ['Dar de baja · cerró', 'Baja definitiva: cerró el establecimiento. Sale de las rutas y su historial se conserva completo.', 'Por qué (cerró, cambió de dueño…)'],
    retiro: ['Dar de baja · se retiró', 'Baja definitiva: se retiró o se fue con otro proveedor. Sale de las rutas y su historial se conserva completo.', 'Por qué (se fue con otro proveedor, lo hará por su cuenta…)'],
    activo: ['Reactivar el servicio', 'Vuelve a las rutas desde la próxima programación.', 'Nota (opcional)']
  };
  function titulo(s) { s = String(s || '').trim().toLowerCase(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
  function kgN(v) { v = Number(v) || 0; return v > 0 && v < 10 ? N(v, 1).replace(/\.0$/, '') : N(v); }
  function fc(iso) { return /^\d{4}-\d{2}-\d{2}/.test(iso || '') ? MK.fechaCorta(iso) : '—'; }
  function valHist(campo, v) {
    v = String(v == null ? '' : v).trim(); if (!v) return '—';
    if (/^\d{4}-\d{2}-\d{2}/.test(v)) return MK.fechaCorta(v.slice(0, 10));
    if (/costo|tarifa/.test(campo) && isFinite(Number(v))) return D(v);
    if (/kg/.test(campo) && isFinite(Number(v))) return N(v) + ' kg';
    return titulo(v);
  }
  function card(t, icn, body, extra) { return '<div class="card"' + (extra || '') + '><h3>' + (icn ? IC(icn, 16) : '') + t + '</h3>' + body + '</div>'; }
  function sit() { var s = String((R && R.datos && R.datos.situacion) || '').trim().toLowerCase(); return s || 'activo'; }
  function fuera() { return ['mora', 'pausa', 'cierre', 'retiro'].indexOf(sit()) >= 0; }
  function puedeEditar() { return ['mercadeo', 'supervisor', 'admin'].indexOf(ROL) >= 0; }
  function planCompartido() { var c = R.cliente, s = R.sucursales || []; return !!(c.cuenta && s.length && c.planKg > 0 && s.every(function (x) { return x.planKg === c.planKg && x.planCosto === c.planCosto; })); }
  function telDe() { var c = R.cliente, t = c.telefono || ''; if (t.replace(/\D/g, '').length >= 7) return t; var k = (R.contactos || []).filter(function (x) { return (x.celular || x.telefono || '').replace(/\D/g, '').length >= 7; })[0]; return k ? (k.celular || k.telefono) : ''; }
  function correoDe() { var c = R.cliente; if (c.correo) return c.correo; var k = (R.contactos || []).filter(function (x) { return x.correo; })[0]; return k ? k.correo : ''; }
  function ctx(extra) { var c = R.cliente; return Object.assign({ ref: c.id, refTipo: 'cli', cuenta: c.nombre, contacto: c.contacto }, extra || {}); }

  MK.iniciar('cliente', function (base) {
    ROL = (base.usuario && base.usuario.rol) || '';
    if (ROL === 'gerente') document.body.classList.add('solo-ver');
    var h = (location.hash || '').replace('#', ''); if (TABS.indexOf(h) >= 0) TAB = h;
    if (!ID) { document.getElementById('main').innerHTML = '<div class="aviso rj">Falta el cliente en el enlace. <a href="MerClientes.html">Ir a Clientes</a></div>'; return; }
    cargar();
    window.addEventListener('mk:cambio', function () { cargar(true); });
  });

  function cargar(silencio) {
    if (!silencio) MK.cargando('main', 'Cargando la ficha…');
    MK.api('api_crmCliente', MK.pin, ID).then(function (r) {
      if (!r || !r.ok) { document.getElementById('main').innerHTML = '<div class="aviso rj">' + E((r && r.error) || 'No se pudo abrir la ficha.') + ' <a href="MerClientes.html">Volver a Clientes</a></div>'; return; }
      R = r; document.title = r.cliente.nombre + ' · Mercadeo · ECOVSA'; pintar();
    }, function (e) { MK.error('main', 'Sin conexión: ' + e.message); });
  }

  /* ── encabezado ── */
  function tagSal() {
    var s = R.cliente.salud || {}, n = NIV[s.nivel] || NIV.sano;
    if (sit() === 'cierre' || sit() === 'retiro') return '';
    return '<span class="tag t-' + n[1] + '"><span class="dot d-' + n[1] + '"></span>' + n[0] + ' · ' + s.puntos + '</span>';
  }
  function tagSit() { var s = SIT[sit()] || [titulo(sit()), 'gris']; return '<span class="tag t-' + s[1] + '">' + E(s[0]) + '</span>'; }
  function contratoTxt(c) {
    if (c.diasVence === null || c.diasVence === undefined) return { b: c.contrato || 'Sin número', s: 'sin fecha de vencimiento', t: '' };
    if (c.diasVence < 0) return { b: MK.fechaCorta(c.vencimiento), s: '<span class="tag t-bad">vencido hace ' + (-c.diasVence) + ' días</span>', t: 'bad' };
    if (c.diasVence <= 60) return { b: MK.fechaCorta(c.vencimiento), s: '<span class="tag t-warn">vence en ' + c.diasVence + ' días</span>', t: 'warn' };
    return { b: MK.fechaCorta(c.vencimiento), s: 'vigente · ' + c.diasVence + ' días', t: 'ok' };
  }
  function cabecera() {
    var c = R.cliente, d = R.datos, desde = d['inicio recoleccion'], tel = telDe(), cor = correoDe();
    var meta = [c.cuenta ? 'Cuenta ' + c.cuenta + (R.sucursales.length ? ' · ' + (R.sucursales.length + 1) + ' sucursales' : '') : '', c.ruc ? 'RUC ' + c.ruc + (d.dv !== '' && d.dv != null ? ' DV ' + d.dv : '') : 'Sin RUC', titulo(c.region), desde ? 'cliente desde ' + desde.slice(0, 4) : '', c.razon && c.razon !== c.nombre ? c.razon : ''].filter(Boolean);
    var ct = contratoTxt(c), pc = planCompartido();
    var ra = c.planKg ? c.kgMes / c.planKg : 0;
    return '<div class="a-head"><div class="row" style="align-items:flex-start;gap:14px;flex-wrap:wrap"><span class="bigav">' + E(MK.ini(c.nombre)) + '</span><div style="flex:1;min-width:200px"><div class="hname">' + E(c.nombre) + '</div>' +
      '<div class="meta">' + E(meta.join(' · ')) + '</div>' +
      '<div class="row w" style="margin-top:8px;gap:6px">' + tagSit() + tagSal() + (c.estado ? '<span class="tag t-gris">' + E(c.estado) + '</span>' : '') + (c.cuenta ? '<span class="tag t-info">Cuenta ' + E(c.cuenta) + '</span>' : '') + tagTarde() + '</div></div></div>' +
      '<div class="qa">' +
        (tel ? '<a class="btn sm" id="q-tel" href="tel:' + E(tel.replace(/[^\d+]/g, '')) + '">' + IC('telefono', 15) + 'Llamar</a><button class="btn wa sm" id="q-wa">' + IC('whatsapp', 15) + 'WhatsApp</button>' : '') +
        '<button class="btn sm" id="q-mail">' + IC('correo', 15) + 'Correo</button>' +
        '<button class="btn pri sm" id="q-act">' + IC('mas', 15) + 'Registrar actividad</button>' +
        '<button class="btn sm" id="q-tar">' + IC('tarea', 15) + 'Nueva tarea</button>' +
        (puedeEditar() ? '<button class="btn sm" id="q-edit">' + IC('lapiz', 15) + 'Editar ficha</button>' : '') +
      '</div>' +
      '<div class="facts">' +
        '<div><span>PLAN</span><b class="num">' + (c.planKg ? N(c.planKg) + ' kg' : '—') + (c.planCosto ? ' · ' + D(c.planCosto) : '') + '</b><small>' + E(titulo(c.frecuencia) || 'sin frecuencia') + (pc ? ' · de la cuenta' : '') + '</small></div>' +
        '<div><span>KILOS AL MES</span><b class="num"' + (ra >= 1.2 && !pc ? ' style="color:var(--info)"' : '') + '>' + kgN(c.kgMes) + ' kg' + (c.planKg && !pc ? ' · ' + Math.round(ra * 100) + ' %' : '') + '</b><small>promedio de 90 días · ' + c.visitas90 + ' visitas</small></div>' +
        '<div><span>PRÓXIMA VISITA</span><b>' + E(fc(c.proximaVisita)) + '</b><small>' + (/^\d{4}-/.test(c.proximaVisita || '') ? E(MK.cuando(c.proximaVisita)) + ' · ' : '') + 'última ' + E(fc(c.ultimaVisita)) + '</small></div>' +
        '<div><span>SALDO</span><b class="num">' + D(c.saldo) + '</b><small>' + (c.vencido > 0 ? '<b style="color:var(--bad);display:inline;font-size:12px">' + D(c.vencido) + ' vencido</b>' : 'nada vencido') + ' · de Cobros</small></div>' +
        '<div><span>CONTRATO</span><b>' + E(ct.b) + '</b><small>' + ct.s + '</small></div>' +
      '</div></div>';
  }
  function alerta() {

  /* ── documentos ── */
  function verDocumento(d, btn) {
    if (!d) return;
    if (!d.archivoId && d.enlace) { window.open(d.enlace, '_blank', 'noopener'); return; }
    var w = window.open('', '_blank');
    MK.ocupado(btn, true, '…');
    MK.api('api_crmArchivo', MK.pin, d.archivoId).then(function (r) {
      MK.ocupado(btn, false);
      if (!r || !r.ok || !r.datos) { if (w) w.close(); MK.aviso((r && r.error) || 'No se pudo abrir el archivo.'); return; }
      var m = /^data:([^;]+);base64,(.*)$/.exec(r.datos); if (!m) { if (w) w.close(); MK.aviso('El archivo no se pudo leer.'); return; }
      var bin = atob(m[2]), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([u8], { type: m[1] }));
      if (w) w.location.href = url; else { var a = document.createElement('a'); a.href = url; a.download = r.nombre || d.nombre; document.body.appendChild(a); a.click(); a.remove(); }
    }, function (e) { MK.ocupado(btn, false); if (w) w.close(); MK.aviso(e.message); });
  }
  function hojaDocumento() {
    MK.hoja('<h2>Subir documento</h2><p class="muted small">' + E(R.cliente.nombre) + '</p>' +
      '<label class="lb" for="dc-t">TIPO</label><select class="sel" id="dc-t">' + TIPOS_DOC.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + '</option>'; }).join('') + '</select>' +
      '<label class="lb" for="dc-n">NOMBRE</label><input class="in" id="dc-n" placeholder="Ej.: Contrato firmado 2026">' +
      '<label class="lb" for="dc-f">ARCHIVO <span class="muted">(PDF o imagen, hasta 3 MB)</span></label><input class="in" type="file" id="dc-f" accept=".pdf,image/*,.doc,.docx,.xls,.xlsx">' +
      '<label class="lb" for="dc-e">O ENLACE <span class="muted">(si está en Drive u otro lugar)</span></label><input class="in" id="dc-e" placeholder="https://…">' +
      '<label class="lb" for="dc-s">ESTADO</label><select class="sel" id="dc-s"><option value="firmada">Firmado</option><option value="borrador">Borrador</option><option value="enviada">Enviado</option><option value="aceptada">Aceptado</option><option value="vencida">Vencido</option></select>' +
      '<label class="lb" for="dc-no">NOTAS</label><input class="in" id="dc-no">' +
      '<div id="dc-msg" class="small" style="margin-top:8px;color:var(--bad)"></div>' +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="dc-ok">Guardar</button></div>');
    var fi = document.getElementById('dc-f'), nm = document.getElementById('dc-n');
    fi.onchange = function () { if (fi.files[0] && !nm.value.trim()) nm.value = fi.files[0].name.replace(/\.[^.]+$/, ''); };
    document.getElementById('dc-ok').onclick = function () {
      var b = this, msg = document.getElementById('dc-msg'), f = fi.files[0], enl = document.getElementById('dc-e').value.trim();
      var d = { tipo: document.getElementById('dc-t').value, ref: R.cliente.id, refTipo: 'cli', cuenta: R.cliente.nombre, nombre: nm.value.trim(), estado: document.getElementById('dc-s').value, notas: document.getElementById('dc-no').value.trim(), enlace: enl };
      if (!f && !enl) { msg.textContent = 'Elige un archivo o pega un enlace.'; return; }
      if (f && f.size > 3 * 1024 * 1024 * 0.74) { msg.textContent = 'El archivo pesa más de lo permitido (unos 2.2 MB). Redúcelo o guarda el enlace de donde está.'; return; }
      if (!d.nombre) d.nombre = f ? f.name : 'Documento';
      MK.ocupado(b, true, 'Subiendo…');
      var guardar = function (archivoId) {
        if (archivoId) d.archivoId = archivoId;
        return MK.api('api_crmGuardarDocumento', MK.pin, d).then(function (r) {
          MK.ocupado(b, false);
          if (!r || !r.ok) { msg.textContent = (r && r.error) || 'No se pudo guardar.'; return; }
          MK.cerrarHoja(); MK.aviso('Documento guardado'); MK.cambio({ tipo: 'documento' });
        });
      };
      var fallo = function (e) { MK.ocupado(b, false); msg.textContent = e.message || 'Sin conexión'; };
      if (!f) { guardar('').catch(fallo); return; }
      var rd = new FileReader();
      rd.onload = function () {
        MK.api('api_crmSubirArchivo', MK.pin, { nombre: f.name, tipo: f.type, datos: rd.result }).then(function (r) {
          if (!r || !r.ok) { MK.ocupado(b, false); msg.textContent = (r && r.error) || 'No se pudo subir el archivo.'; return; }
          return guardar(r.archivo.id);
        }).catch(fallo);
      };
      rd.onerror = function () { fallo(new Error('No se pudo leer el archivo.')); };
      rd.readAsDataURL(f);
    };
  }

  /* ── editar ficha: los mismos campos y reglas de la ficha de Alta ── */
  function editarFicha() {
    if (LISTAS) { abrirEdicion(); return; }
    MK.aviso('Abriendo la ficha…');
    MK.api('api_cartera', MK.pin).then(function (r) {
      if (!r || !r.ok) { MK.aviso((r && r.error) || 'No se pudo abrir la edición.'); return; }
      LISTAS = { frecuencias: r.frecuencias || [], canales: r.canales || [], modalidades: r.modalidades || [], carteras: r.carteras || ['recurrente', 'contrato'] };
      abrirEdicion();
    }, function (e) { MK.aviso('Sin conexión: ' + e.message); });
  }
  /* Un desplegable jamás pierde un valor que no reconoce: si el dato guardado
     no está en la lista, se agrega como opción marcada (regla de Alta). */
  function campo(et, id, val, tipo, ops) {
    var v = String(val == null ? '' : val).trim();
    if (ops) {
      var lista = ops.map(function (o) { return Array.isArray(o) ? o : [o, o]; });
      var fueraL = v && !lista.some(function (o) { return String(o[0]) === v; });
      return '<div><label class="lb" for="' + id + '">' + et + (fueraL ? ' <span class="fuera">· fuera de lista</span>' : '') + '</label><select class="sel" id="' + id + '"><option value=""></option>' + (fueraL ? '<option selected>' + E(v) + '</option>' : '') +
        lista.map(function (o) { return '<option value="' + E(o[0]) + '"' + (v === String(o[0]) ? ' selected' : '') + '>' + E(o[1]) + '</option>'; }).join('') + '</select></div>';
    }
    return '<div><label class="lb" for="' + id + '">' + et + '</label><input class="in" id="' + id + '" type="' + (tipo || 'text') + '" value="' + E(v) + '"></div>';
  }
  var CAMPOS = [['nombre', 'fi-nombre'], ['razon social', 'fi-razon'], ['ruc', 'fi-ruc'], ['dv', 'fi-dv'], ['correo', 'fi-correo'], ['canal', 'fi-canal'], ['contacto', 'fi-contacto'], ['telefono', 'fi-telefono'], ['contrato', 'fi-contrato'],
    ['inicio recoleccion', 'fi-inicio'], ['vencimiento', 'fi-vencimiento'], ['notas comerciales', 'fi-notas'], ['frecuencia', 'fi-frecuencia'], ['plan costo', 'fi-costo'], ['plan kg', 'fi-kg'],
    ['tarifa kg adic', 'fi-kgadic'], ['tarifa visita adic', 'fi-visadic'], ['facturacion', 'fi-facturacion'], ['modalidad', 'fi-modalidad'], ['retiene itbms', 'fi-retiene'], ['tipo cartera', 'fi-cartera'], ['dias semana', 'fi-dias']];
  function abrirEdicion() {
    var d = R.datos, L = LISTAS;
    MK.hoja('<h2>Editar ficha</h2><p class="muted small">' + E(R.cliente.nombre) + ' · lo que cambie del plan y las tarifas queda en el historial con fecha y quién.</p>' +
      '<div class="fg"><h4>Identificación</h4><div class="rej">' + campo('Nombre comercial', 'fi-nombre', d.nombre) + campo('Razón social', 'fi-razon', d['razon social']) + campo('RUC', 'fi-ruc', d.ruc) + campo('DV', 'fi-dv', d.dv) + '</div></div>' +
      '<div class="fg"><h4>Plan y tarifas</h4><div class="rej">' +
        campo('Modalidad de cobro', 'fi-modalidad', d.modalidad || 'plan', null, L.modalidades) + campo('Frecuencia', 'fi-frecuencia', d.frecuencia, null, L.frecuencias) +
        campo('Día(s) de la semana', 'fi-dias', d['dias semana']) + campo('Costo del plan (B/.)', 'fi-costo', d['plan costo']) + campo('Kg incluidos en el plan', 'fi-kg', d['plan kg']) +
        campo('Tarifa kg adicional', 'fi-kgadic', d['tarifa kg adic']) + campo('Tarifa visita adicional', 'fi-visadic', d['tarifa visita adic']) +
        campo('Facturación', 'fi-facturacion', d.facturacion, null, ['POR PUNTO', 'AGRUPADA']) + campo('¿Retiene ITBMS?', 'fi-retiene', d['retiene itbms'], null, ['NO', 'SI']) + campo('Cartera', 'fi-cartera', d['tipo cartera'], null, L.carteras) + '</div>' +
        '<div class="pista"><b>Día de la semana:</b> si se atiende siempre el mismo día, escribe el número (1 lunes … 7 domingo); para dos veces por semana sepáralos con coma: <i>2,5</i> es martes y viernes.<br>' +
        'La <b>modalidad</b> define cómo se cobra: <i>plan</i> es tarifa fija con kilos incluidos y excedente, <i>peso</i> cobra cada kilo recolectado, <i>servicio</i> es una recolección única sin contrato.<br>' +
        'Los <b>agentes retenedores</b> retienen el 50 % del ITBMS: la factura sale por el total pero al banco entra menos. Marcarlo evita perseguir un saldo que ya está cancelado.<br>' +
        'La <b>cartera</b> decide cómo se cobra y con qué vara se mide: <i>recurrente</i> es el servicio mensual (60 días vencido es alarma); <i>contrato</i> son actos públicos por periodo, donde 60 días es el trámite normal.</div></div>' +
      '<div class="fg"><h4>Contacto y envío de recibos</h4><div class="rej">' + campo('Contacto', 'fi-contacto', d.contacto) + campo('Teléfono', 'fi-telefono', d.telefono) + campo('Correo', 'fi-correo', d.correo, 'email') + campo('Canal de envío', 'fi-canal', d.canal, null, L.canales) + '</div></div>' +
      '<div class="fg"><h4>Contrato</h4><div class="rej">' + campo('N.º de contrato', 'fi-contrato', d.contrato) + campo('Primera recolección', 'fi-inicio', d['inicio recoleccion'], 'date') + campo('Vencimiento', 'fi-vencimiento', d.vencimiento, 'date') + '</div></div>' +
      '<div class="fg"><h4>Notas comerciales</h4><textarea class="in" id="fi-notas" rows="4">' + E(d['notas comerciales'] || '') + '</textarea></div>' +
      '<p class="small muted" style="margin-top:10px">La situación (activo, mora, pausa, baja) no se edita aquí: se cambia en Contrato › Situación comercial, con su motivo.</p>' +
      '<div id="fi-msg" class="small" style="margin-top:8px;color:var(--bad)"></div>' +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="fi-ok">Guardar ficha</button></div>', { ancha: true });
    document.getElementById('fi-ok').onclick = function () {
      var b = this, msg = document.getElementById('fi-msg'), datos = {};
      CAMPOS.forEach(function (p) { var e = document.getElementById(p[1]); if (e) datos[p[0]] = e.value; });
      /* solo viaja lo que cambió: así el historial no se llena de cambios fantasma */
      var cambio = {};
      Object.keys(datos).forEach(function (k) {
        var antes = String(R.datos[k] == null ? '' : R.datos[k]).trim(), ahora = String(datos[k]).trim();
        if (k === 'modalidad' && !antes && ahora === 'plan') return;   /* vacío ya significa «plan» */
        if (ahora !== antes) cambio[k] = datos[k];
      });
      if (!Object.keys(cambio).length) { msg.textContent = 'No hay nada que cambiar.'; return; }
      if ('nombre' in cambio && !String(cambio.nombre).trim()) { msg.textContent = 'El nombre comercial no puede quedar vacío.'; return; }
      MK.ocupado(b, true);
      MK.api('api_crmGuardarFichaCliente', MK.pin, R.cliente.id, cambio).then(function (r) {
        MK.ocupado(b, false);
        if (!r || !r.ok) { msg.textContent = (r && r.error) || 'No se pudo guardar.'; return; }
        MK.cerrarHoja(); MK.aviso(r.cambios ? 'Ficha guardada · ' + r.cambios + ' cambio(s) de plan registrado(s)' : 'Ficha guardada');
        MK.cambio({ tipo: 'ficha', id: R.cliente.id });
      }, function (e) { MK.ocupado(b, false); msg.textContent = 'Sin conexión: no se guardó. ' + e.message; });
    };
  }
})();
</script>
