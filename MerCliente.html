  function grafico() {
    var c = R.cliente, S = R.servicio.porMes || [], pc = planCompartido();
    if (!S.length) return MK.vacio('Sin recolecciones registradas.');
    var plan = pc ? 0 : (c.planKg || 0);
    var W = window.innerWidth < 600 ? 360 : 600, H = window.innerWidth < 600 ? 190 : 200, pl = 40, pb = 26, pt = 18, max = Math.max.apply(null, S.map(function (x) { return x.kg; }).concat([plan, 1])) * 1.15;
    var bw = (W - pl - 10) / S.length, y = function (v) { return pt + (H - pt - pb) * (1 - v / max); };
    var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Kilos recolectados por mes">';
    [0, 0.5, 1].forEach(function (fr) { var yy = y(max / 1.15 * fr); g += '<line x1="' + pl + '" x2="' + (W - 6) + '" y1="' + yy + '" y2="' + yy + '" stroke="#eef1f5"/>'; if (fr) g += '<text x="' + (pl - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="#8a96a8">' + N(max / 1.15 * fr) + '</text>'; });
    g += '<text x="' + (pl - 6) + '" y="' + (y(0) + 4) + '" text-anchor="end" font-size="11" fill="#8a96a8">0</text>';
    S.forEach(function (s, i) {
      var x = pl + i * bw + bw * .22, w = bw * .56, dentro = plan ? Math.min(s.kg, plan) : s.kg, sobre = plan ? Math.max(0, s.kg - plan) : 0;
      var enc = i === S.length - 1 && s.mes === MK.hoy.slice(0, 7);
      g += '<g class="bar"><title>' + MK.mesNombre(s.mes) + ': ' + kgN(s.kg) + ' kg en ' + s.visitas + ' visita' + (s.visitas === 1 ? '' : 's') + (plan ? (s.kg > plan ? ' · ' + kgN(s.kg - plan) + ' kg sobre el plan' : ' · ' + kgN(plan - s.kg) + ' kg bajo el plan') : '') + (enc ? ' (mes en curso)' : '') + '</title>';
      g += '<rect x="' + (pl + i * bw) + '" y="' + pt + '" width="' + bw + '" height="' + (H - pt - pb) + '" fill="transparent"/>';
      if (s.kg > 0) {
        g += '<rect class="v" x="' + x + '" y="' + y(dentro) + '" width="' + w + '" height="' + Math.max(0, y(0) - y(dentro)) + '" rx="3" fill="#14306b"' + (enc ? ' fill-opacity=".55"' : '') + '/>';
        if (sobre > 0) g += '<rect class="v" x="' + x + '" y="' + y(s.kg) + '" width="' + w + '" height="' + Math.max(0, y(plan) - y(s.kg) - 2) + '" rx="3" fill="#3b6fd4"' + (enc ? ' fill-opacity=".55"' : '') + '/>';
        g += '<text x="' + (x + w / 2) + '" y="' + (y(s.kg) - 5) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#0f2140">' + kgN(s.kg) + '</text>';
      }

      '<label class="lb" for="ct-n">NOMBRE</label><input class="in" id="ct-n" autofocus value="' + E(k.nombre || '') + '">' +
      '<label class="lb" for="ct-c">CARGO</label><input class="in" id="ct-c" value="' + E(k.cargo || '') + '" placeholder="Administrador, contabilidad, jefa de enfermería…">' +
      '<div class="grid g2" style="gap:10px"><div><label class="lb" for="ct-cel">CELULAR</label><input class="in" id="ct-cel" inputmode="tel" value="' + E(k.celular || '') + '"></div><div><label class="lb" for="ct-tel">TELÉFONO</label><input class="in" id="ct-tel" inputmode="tel" value="' + E(k.telefono || '') + '"></div></div>' +
      '<label class="lb" for="ct-m">CORREO</label><input class="in" id="ct-m" inputmode="email" value="' + E(k.correo || '') + '">' +
      '<label class="lb" for="ct-no">NOTAS</label><input class="in" id="ct-no" value="' + E(k.notas || '') + '" placeholder="Qué hace, cuándo llamar, qué recibe">' +
      '<label class="chk" style="margin-top:12px"><input type="checkbox" id="ct-p"' + (k.principal ? ' checked' : '') + '> Contacto principal</label>' +
      '<div id="ct-msg" class="small" style="margin-top:8px;color:var(--bad)"></div>' +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="ct-ok">Guardar</button></div>');
    document.getElementById('ct-ok').onclick = function () {
      var b = this, v = function (i) { return document.getElementById(i).value.trim(); };
      var d = { id: k.id || '', ref: R.cliente.id, refTipo: 'cli', cuenta: R.cliente.nombre, nombre: v('ct-n'), cargo: v('ct-c'), celular: v('ct-cel'), telefono: v('ct-tel'), correo: v('ct-m'), notas: v('ct-no'), principal: document.getElementById('ct-p').checked };
      if (!d.nombre) { document.getElementById('ct-msg').textContent = 'Escribe el nombre.'; return; }
      MK.ocupado(b, true);
      MK.api('api_crmGuardarContacto', MK.pin, d).then(function (r) {
        MK.ocupado(b, false);
        if (!r || !r.ok) { document.getElementById('ct-msg').textContent = (r && r.error) || 'No se pudo guardar.'; return; }
        MK.cerrarHoja(); MK.aviso('Contacto guardado'); MK.cambio({ tipo: 'contacto' });
      }, function (e) { MK.ocupado(b, false); document.getElementById('ct-msg').textContent = e.message; });
    };
  }

  /* ── documentos ── */
  function verDocumento(d, btn) {
    if (!d) return;
    if (!d.archivoId && d.enlace) { window.open(d.enlace, '_blank', 'noopener'); return; }
    var w = window.open('', '_blank');
    MK.ocupado(btn, true, '…');
    MK.api('api_crmArchivo', MK.pin, d.archivoId).then(function (r) {
      MK.ocupado(btn, false);
      if (r && r.ok && (r.url || r.almacenError)) { if (!r.url) { if (w) w.close(); MK.aviso(r.almacenError); return; } if (w) w.location.href = r.url; else location.href = r.url; return; }
      if (!r || !r.ok || !r.datos) { if (w) w.close(); MK.aviso((r && r.error) || 'No se pudo abrir el archivo.'); return; }
      var m = /^data:([^;]+);base64,(.*)$/.exec(r.datos); if (!m) { if (w) w.close(); MK.aviso('El archivo no se pudo leer.'); return; }
      var bin = atob(m[2]), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([u8], { type: m[1] }));
      if (w) w.location.href = url; else { var a = document.createElement('a'); a.href = url; a.download = r.nombre || d.nombre; document.body.appendChild(a); a.click(); a.remove(); }
    }, function (e) { MK.ocupado(btn, false); if (w) w.close(); MK.aviso(e.message); });
  }
  function hojaDocumento() {
    MK.hoja('<h2>Subir documento</h2><p class="muted small">' + E(R.cliente.nombre) + '</p>' +
      '<label class="lb" for="dc-t">TIPO</label><select class="sel" id="dc-t">' + TIPOS_DOC.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + '</option>'; }).join('') + '</select>' +
      '<label class="lb" for="dc-n">NOMBRE</label><input class="in" id="dc-n" placeholder="Ej.: Contrato firmado 2026">' +
      '<label class="lb" for="dc-f">ARCHIVO <span class="muted">(PDF o imagen, hasta 3 MB)</span></label><input class="in" type="file" id="dc-f" accept=".pdf,image/*,.doc,.docx,.xls,.xlsx">' +
      '<label class="lb" for="dc-e">O ENLACE <span class="muted">(si está en Drive u otro lugar)</span></label><input class="in" id="dc-e" placeholder="https://…">' +
      '<label class="lb" for="dc-s">ESTADO</label><select class="sel" id="dc-s"><option value="firmada">Firmado</option><option value="borrador">Borrador</option><option value="enviada">Enviado</option><option value="aceptada">Aceptado</option><option value="vencida">Vencido</option></select>' +
      '<label class="lb" for="dc-no">NOTAS</label><input class="in" id="dc-no">' +
      '<div id="dc-sub"></div><div id="dc-msg" class="small" style="margin-top:8px;color:var(--bad)"></div>' +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="dc-ok">Guardar</button></div>');
    var fi = document.getElementById('dc-f'), nm = document.getElementById('dc-n');
    fi.onchange = function () { if (fi.files[0] && !nm.value.trim()) nm.value = fi.files[0].name.replace(/\.[^.]+$/, ''); };
    document.getElementById('dc-ok').onclick = function () {
      var b = this, msg = document.getElementById('dc-msg'), f = fi.files[0], enl = document.getElementById('dc-e').value.trim();
      var d = { tipo: document.getElementById('dc-t').value, ref: R.cliente.id, refTipo: 'cli', cuenta: R.cliente.nombre, nombre: nm.value.trim(), estado: document.getElementById('dc-s').value, notas: document.getElementById('dc-no').value.trim(), enlace: enl };
      if (!f && !enl) { msg.textContent = 'Elige un archivo o pega un enlace.'; return; }
      if (f && f.size > 3 * 1024 * 1024 * 0.74) { msg.textContent = 'El archivo pesa más de lo permitido (unos 2.2 MB). Redúcelo o guarda el enlace de donde está.'; return; }
      if (!d.nombre) d.nombre = f ? f.name : 'Documento';
      MK.ocupado(b, true, 'Subiendo…'); msg.textContent = '';
      /* api 3.5.2: la tarjeta de espera (emblema, pasos) */
      var T = f && window.ARCH && ARCH.tarjeta ? ARCH.tarjeta(document.getElementById('dc-sub'), { nombre: f.name, detalle: ARCH.kb(f.size), reemplazar: true }) : null;
      if (T) T.paso(0);
      var guardar = function (archivoId) {
        if (archivoId) d.archivoId = archivoId;
        if (T) T.paso(2);
        return MK.api('api_crmGuardarDocumento', MK.pin, d).then(function (r) {
          MK.ocupado(b, false);
          if (!r || !r.ok) { if (T) T.error((r && r.error) || 'No se pudo guardar.'); else msg.textContent = (r && r.error) || 'No se pudo guardar.'; return; }
          if (T) T.listo('Guardado');
          setTimeout(function () { MK.cerrarHoja(); MK.aviso('Documento guardado'); MK.cambio({ tipo: 'documento' }); }, T ? 650 : 0);
        });
      };
      var fallo = function (e) { MK.ocupado(b, false); if (T) T.error(e.message || 'Sin conexión'); else msg.textContent = e.message || 'Sin conexión'; };
      if (!f) { guardar('').catch(fallo); return; }
      var rd = new FileReader();
      rd.onload = function () {
        if (T) T.paso(1);
        MK.api('api_crmSubirArchivo', MK.pin, { nombre: f.name, tipo: f.type, datos: rd.result }).then(function (r) {
          if (!r || !r.ok) { fallo(new Error((r && r.error) || 'No se pudo subir el archivo.')); return; }
          return guardar(r.archivo.id);
        }).catch(fallo);
      };
      rd.onerror = function () { fallo(new Error('No se pudo leer el archivo.')); };
      rd.readAsDataURL(f);
    };
  }

  /* ── situación comercial (igual que en Alta: motivo obligatorio) ── */
  function cambiarSituacion(s) {
    var t = SIT_TEXTO[s], act = s === 'activo', eraMora = sit() === 'mora';
    MK.hoja('<h2>' + E(t[0]) + '</h2><p class="muted small" style="margin-top:4px"><b>' + E(R.cliente.nombre) + '</b><br>' + E(t[1]) + '</p>' +
      '<label class="lb" for="st-m">' + (act ? 'NOTA (OPCIONAL)' : 'MOTIVO <span class="req" style="color:var(--bad)">*</span>') + '</label><textarea class="in" id="st-m" autofocus placeholder="' + E(t[2]) + '"></textarea>' +
      '<div id="st-msg" class="small" style="margin-top:8px;color:var(--bad)"></div>' +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn ' + (s === 'cierre' || s === 'retiro' ? 'bad' : act ? 'ok' : 'pri') + '" id="st-ok">' + E(t[0]) + '</button></div>');
    document.getElementById('st-ok').onclick = function () {
      var b = this, m = document.getElementById('st-m').value.trim(), msg = document.getElementById('st-msg');
      if (!act && !m) { msg.textContent = 'Escribe el motivo. Dentro de un año nadie va a recordar por qué.'; document.getElementById('st-m').focus(); return; }
      MK.ocupado(b, true);
      MK.api('api_cambiarEstadoCliente', MK.pin, R.cliente.id, s, m).then(function (r) {
        MK.ocupado(b, false);
        if (!r || !r.ok) { msg.textContent = (r && r.error) || 'No se pudo cambiar.'; return; }
        MK.cerrarHoja(); MK.aviso(act ? 'Cliente reactivado' : 'Fuera de servicio · quedó registrado');
        if (act && eraMora && R.cobrosClave) MK.api('api_cobCrearCarta', MK.pin, R.cobrosClave, 'reactivacion', {}).then(function (k) { if (k && k.ok) mostrarCarta(k, 'Servicio reactivado'); }).catch(function () {});
        if (!act) MK.api('api_crmGuardarActividad', MK.pin, ctx({ tipo: 'nota', texto: t[0] + ': ' + m })).catch(function () {});
        MK.cambio({ tipo: 'situacion' });
      }, function (e) { MK.ocupado(b, false); msg.textContent = 'Sin conexión: no se guardó. ' + e.message; });
    };
  }

  /* ── editar ficha: los mismos campos y reglas de la ficha de Alta ── */
  function editarFicha() {
    if (LISTAS) { abrirEdicion(); return; }
    MK.aviso('Abriendo la ficha…');
    MK.api('api_cartera', MK.pin).then(function (r) {
      if (!r || !r.ok) { MK.aviso((r && r.error) || 'No se pudo abrir la edición.'); return; }
      LISTAS = { frecuencias: r.frecuencias || [], canales: r.canales || [], modalidades: r.modalidades || [], carteras: r.carteras || ['recurrente', 'contrato'] };
      abrirEdicion();
    }, function (e) { MK.aviso('Sin conexión: ' + e.message); });
  }
  /* Un desplegable jamás pierde un valor que no reconoce: si el dato guardado
     no está en la lista, se agrega como opción marcada (regla de Alta). */
  function campo(et, id, val, tipo, ops) {
    var v = String(val == null ? '' : val).trim();
    if (ops) {
      var lista = ops.map(function (o) { return Array.isArray(o) ? o : [o, o]; });
      var fueraL = v && !lista.some(function (o) { return String(o[0]) === v; });
      return '<div><label class="lb" for="' + id + '">' + et + (fueraL ? ' <span class="fuera">· fuera de lista</span>' : '') + '</label><select class="sel" id="' + id + '"><option value=""></option>' + (fueraL ? '<option selected>' + E(v) + '</option>' : '') +
        lista.map(function (o) { return '<option value="' + E(o[0]) + '"' + (v === String(o[0]) ? ' selected' : '') + '>' + E(o[1]) + '</option>'; }).join('') + '</select></div>';
    }
    return '<div><label class="lb" for="' + id + '">' + et + '</label><input class="in" id="' + id + '" type="' + (tipo || 'text') + '" value="' + E(v) + '"></div>';
  }
  var CAMPOS = [['nombre', 'fi-nombre'], ['razon social', 'fi-razon'], ['ruc', 'fi-ruc'], ['dv', 'fi-dv'], ['correo', 'fi-correo'], ['canal', 'fi-canal'], ['contacto', 'fi-contacto'], ['telefono', 'fi-telefono'], ['contrato', 'fi-contrato'],
    ['inicio recoleccion', 'fi-inicio'], ['vencimiento', 'fi-vencimiento'], ['notas comerciales', 'fi-notas'], ['frecuencia', 'fi-frecuencia'], ['plan costo', 'fi-costo'], ['plan kg', 'fi-kg'],
    ['tarifa kg adic', 'fi-kgadic'], ['tarifa visita adic', 'fi-visadic'], ['facturacion', 'fi-facturacion'], ['modalidad', 'fi-modalidad'], ['retiene itbms', 'fi-retiene'], ['tipo cartera', 'fi-cartera'], ['dias semana', 'fi-dias']];
  function abrirEdicion() {
    var d = R.datos, L = LISTAS;
    MK.hoja('<h2>Editar ficha</h2><p class="muted small">' + E(R.cliente.nombre) + ' · lo que cambie del plan y las tarifas queda en el historial con fecha y quién.</p>' +
      '<div class="fg"><h4>Identificación</h4><div class="rej">' + campo('Nombre comercial', 'fi-nombre', d.nombre) + campo('Razón social', 'fi-razon', d['razon social']) + campo('RUC', 'fi-ruc', d.ruc) + campo('DV', 'fi-dv', d.dv) + '</div></div>' +
      '<div class="fg"><h4>Plan y tarifas</h4><div class="rej">' +
        campo('Modalidad de cobro', 'fi-modalidad', d.modalidad || 'plan', null, L.modalidades) + campo('Frecuencia', 'fi-frecuencia', d.frecuencia, null, L.frecuencias) +
        campo('Día(s) de la semana', 'fi-dias', d['dias semana']) + campo('Costo del plan (B/.)', 'fi-costo', d['plan costo']) + campo('Kg incluidos en el plan', 'fi-kg', d['plan kg']) +
        campo('Tarifa kg adicional', 'fi-kgadic', d['tarifa kg adic']) + campo('Tarifa visita adicional', 'fi-visadic', d['tarifa visita adic']) +
        campo('Facturación', 'fi-facturacion', d.facturacion, null, ['POR PUNTO', 'AGRUPADA']) + campo('¿Retiene ITBMS?', 'fi-retiene', d['retiene itbms'], null, ['NO', 'SI', 'EXENTO']) + campo('Cartera', 'fi-cartera', d['tipo cartera'], null, L.carteras) + '</div>' +
        '<div class="pista"><b>Día de la semana:</b> si se atiende siempre el mismo día, escribe el número (1 lunes … 7 domingo); para dos veces por semana sepáralos con coma: <i>2,5</i> es martes y viernes.<br>' +
        'La <b>modalidad</b> define cómo se cobra: <i>plan</i> es tarifa fija con kilos incluidos y excedente, <i>peso</i> cobra cada kilo recolectado, <i>servicio</i> es una recolección única sin contrato.<br>' +
        'Los <b>agentes retenedores</b> retienen el 50 % del ITBMS (el 3.5 % del subtotal): la factura sale por el total pero al banco entra menos. Marcarlo evita perseguir un saldo que ya está cancelado. Los <b>exentos</b> no pagan ITBMS: su factura sale sin ITBMS.<br>' +
        'La <b>cartera</b> decide cómo se cobra y con qué vara se mide: <i>recurrente</i> es el servicio mensual (60 días vencido es alarma); <i>contrato</i> son actos públicos por periodo, donde 60 días es el trámite normal.</div></div>' +
      '<div class="fg"><h4>Contacto y envío de recibos</h4><div class="rej">' + campo('Contacto', 'fi-contacto', d.contacto) + campo('Teléfono', 'fi-telefono', d.telefono) + campo('Correo', 'fi-correo', d.correo, 'email') + campo('Canal de envío', 'fi-canal', d.canal, null, L.canales) + '</div></div>' +
      '<div class="fg"><h4>Contrato</h4><div class="rej">' + campo('N.º de contrato', 'fi-contrato', d.contrato) + campo('Primera recolección', 'fi-inicio', d['inicio recoleccion'], 'date') + campo('Vencimiento', 'fi-vencimiento', d.vencimiento, 'date') + '</div></div>' +
      '<div class="fg"><h4>Notas comerciales</h4><textarea class="in" id="fi-notas" rows="4">' + E(d['notas comerciales'] || '') + '</textarea></div>' +
      '<p class="small muted" style="margin-top:10px">La situación (activo, mora, pausa, baja) no se edita aquí: se cambia en Contrato › Situación comercial, con su motivo.</p>' +
      '<div id="fi-msg" class="small" style="margin-top:8px;color:var(--bad)"></div>' +
      '<div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="fi-ok">Guardar ficha</button></div>', { ancha: true });
    document.getElementById('fi-ok').onclick = function () {
      var b = this, msg = document.getElementById('fi-msg'), datos = {};
      CAMPOS.forEach(function (p) { var e = document.getElementById(p[1]); if (e) datos[p[0]] = e.value; });
      /* solo viaja lo que cambió: así el historial no se llena de cambios fantasma */
      var cambio = {};
      Object.keys(datos).forEach(function (k) {
        var antes = String(R.datos[k] == null ? '' : R.datos[k]).trim(), ahora = String(datos[k]).trim();
        if (k === 'modalidad' && !antes && ahora === 'plan') return;   /* vacío ya significa «plan» */
        if (ahora !== antes) cambio[k] = datos[k];
      });
      if (!Object.keys(cambio).length) { msg.textContent = 'No hay nada que cambiar.'; return; }
      if ('nombre' in cambio && !String(cambio.nombre).trim()) { msg.textContent = 'El nombre comercial no puede quedar vacío.'; return; }
      MK.ocupado(b, true);
      MK.api('api_crmGuardarFichaCliente', MK.pin, R.cliente.id, cambio).then(function (r) {
        MK.ocupado(b, false);
        if (!r || !r.ok) { msg.textContent = (r && r.error) || 'No se pudo guardar.'; return; }
        MK.cerrarHoja(); MK.aviso(r.cambios ? 'Ficha guardada · ' + r.cambios + ' cambio(s) de plan registrado(s)' : 'Ficha guardada');
        MK.cambio({ tipo: 'ficha', id: R.cliente.id });
      }, function (e) { MK.ocupado(b, false); msg.textContent = 'Sin conexión: no se guardó. ' + e.message; });
    };
  }
})();
</script>
<style id="estilo-349">
.s49-srv{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:4px}.s49-srv label{display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
.s49-fi{display:flex;gap:6px;align-items:center;margin:4px 0}.s49-fi .sel{flex:1;min-width:0}
</style>
<script id="js-349">
/* ═══ api 3.49 · Mercadeo › Cliente: lo contratado en esta sucursal y «Agregar sucursal» ═══
   Una sucursal nueva de un cliente que ya tenemos (el caso Madenta) no se escribe junto a la de
   siempre: se agrega aquí, con lo que contrata, y a Logística le llega su alta para verificarla. */
var MC49 = (function () {
  var E = MK.esc, IC = MK.ic, CLI = null, X = null, ED = null;
  var SRV = [['peligrosos', 'Recolección de peligrosos'], ['solidos', 'Recolección de sólidos'], ['fumigacion', 'Fumigación']];
  var CADA = [['visita', 'En cada visita'], ['mes', 'Al mes'], ['bimestre', 'Cada 2 meses'], ['trimestre', 'Cada 3 meses'], ['semestre', 'Cada 6 meses']];
  var FUM = { mes: 'Cada mes', bimestre: 'Cada 2 meses', trimestre: 'Cada 3 meses', semestre: 'Cada 6 meses' };
  function servTx(sv) { var t = []; if (!sv) return t; if (sv.peligrosos) t.push('Peligrosos'); if (sv.solidos) t.push('Sólidos'); if (sv.fumigacion) t.push('Fumigación ' + String(FUM[sv.fumFrec] || 'cada mes').toLowerCase()); return t; }
  var NOM = '';
  function card(c, nombre) {
    CLI = c; NOM = nombre || ''; setTimeout(cargar, 0);
    return '<div class="card" id="mc49"><h3>' + IC('caja', 16) + titulo() + '</h3><div class="small muted">Cargando…</div></div>';
  }
  function cargar() {
    if (!CLI) return;
    MK.api('api_serviciosSede', MK.pin, CLI.id).then(function (r) { if (r && r.ok) { X = r; pintar(); } }, function () {});
  }
  function titulo() { return NOM ? 'Lo contratado en ' + E(NOM) : 'Lo contratado en esta sede'; }
  function pintar() {
    try { window.dispatchEvent(new CustomEvent('mc49:ficha', { detail: X })); } catch (e) {}   /* api 3.54: la cifra y el aviso de arriba */
    var el = document.getElementById('mc49'); if (!el || !X) return;
    var f = X.ficha;
    el.innerHTML = '<h3>' + IC('caja', 16) + titulo() + '<span class="sp"></span>' + (X.puede ? '<button class="btn sm" data-mc49="editar">' + IC('lapiz', 13) + (f.revisado ? 'Cambiar' : 'Confirmar') + '</button>' : '') + '</h3>' +
      '<div class="row w" style="gap:6px">' + servTx(f.servicios).map(function (t) { return '<span class="tag ' + (/Fumig/.test(t) ? 't-ok' : 't-info') + '">' + E(t) + '</span>'; }).join('') +
      (f.insumos || []).map(function (i) { return '<span class="tag t-gris">' + E(i.cantidad + ' ' + i.nombre + ' · ' + (i.cadaTxt || '').toLowerCase()) + '</span>'; }).join('') + '</div>' +
      (f.revisado ? '' : '<p class="small muted" style="margin-top:6px">Ficha de antes: se toma con recolección de peligrosos hasta que alguien lo confirme.</p>') +
      '<p class="small muted" style="margin-top:8px">El portal del cliente usa esta lista: lo que no está aquí le sale como «¿Desea contratarlo?» y te llega como servicio adicional.</p>' +
      (X.puede ? '<div class="row w" style="margin-top:10px"><button class="btn sm" data-mc49="sucursal">' + IC('mas', 14) + 'Agregar sede</button></div>' : '');
  }
  function editar() {
    var f = X.ficha;
    ED = { sv: JSON.parse(JSON.stringify(f.servicios)), ins: (f.insumos || []).map(function (i) { return { catId: i.catId, cantidad: i.cantidad, cada: i.cada }; }) };
    MK.hoja('<h2>Lo contratado · ' + E(f.nombre) + '</h2><div id="mc49-ed"></div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="mc49-ok">Guardar</button></div>');
    pintarEd('mc49-ed', ED);
    document.getElementById('mc49-ok').onclick = function () {
      var b = this; MK.ocupado(b, true);
      MK.llamar('api_guardarServiciosSede', MK.pin, CLI.id, { servicios: ED.sv, insumos: ED.ins }).then(function (r) { X.ficha = r.ficha; MK.cerrarHoja(); MK.aviso('Guardado'); pintar(); }, function () { MK.ocupado(b, false); });
    };
  }
  function pintarEd(id, o) {
    var box = document.getElementById(id), CAT = X.insumos || []; if (!box) return;
    box.innerHTML = '<div class="lb" style="margin-top:6px">SERVICIOS</div><div class="s49-srv">' + SRV.map(function (r) {
      return '<label><input type="checkbox"' + (o.sv[r[0]] ? ' checked' : '') + ' onchange="MC49.srv(\'' + id + '\',\'' + r[0] + '\',this.checked)"> ' + r[1] + '</label>' +
        (r[0] === 'fumigacion' && o.sv.fumigacion ? '<select class="sel" style="max-width:160px" onchange="MC49.srv(\'' + id + '\',\'fumFrec\',this.value)">' + Object.keys(FUM).map(function (k) { return '<option value="' + k + '"' + ((o.sv.fumFrec || 'mes') === k ? ' selected' : '') + '>' + FUM[k] + '</option>'; }).join('') + '</select>' : '');
    }).join('') + '</div><div class="lb" style="margin-top:10px">INSUMOS QUE SE ENTREGAN</div>' + o.ins.map(function (x, n) {
      return '<div class="s49-fi"><input class="in" type="number" min="1" style="width:70px" value="' + E(x.cantidad) + '" oninput="MC49.ins(\'' + id + '\',' + n + ',\'cantidad\',this.value)">' +
        '<select class="sel" onchange="MC49.ins(\'' + id + '\',' + n + ',\'catId\',this.value)">' + CAT.map(function (c) { return '<option value="' + E(c.id) + '"' + (c.id === x.catId ? ' selected' : '') + '>' + E(c.nombre) + '</option>'; }).join('') + '</select>' +
        '<select class="sel" onchange="MC49.ins(\'' + id + '\',' + n + ',\'cada\',this.value)">' + CADA.map(function (c) { return '<option value="' + c[0] + '"' + (x.cada === c[0] ? ' selected' : '') + '>' + c[1] + '</option>'; }).join('') + '</select>' +
        '<button class="btn sm gh" onclick="MC49.insQuitar(\'' + id + '\',' + n + ')" title="Quitar">' + IC('basura', 13) + '</button></div>';
    }).join('') + (CAT.length ? '<button class="btn sm gh" onclick="MC49.insMas(\'' + id + '\')">' + IC('mas', 13) + ' Agregar insumo</button>' : '');
  }
  function obj(id) { return id === 'mc49-ed' ? ED : ED.nueva; }
  function sucursal() {
    var c = CLI;
    ED = { nueva: { sv: { peligrosos: true, solidos: false, fumigacion: false, fumFrec: 'mes' }, ins: [] } };
    MK.hoja('<h2>Agregar sucursal · ' + E(c.nombre) + '</h2><p class="small muted">Misma razón social y mismo contrato. A Logística le llega el alta de esta sucursal para verificar la dirección; al aprobarla nace su propia ficha con lo que contrata aquí. La ficha de hoy no cambia de nombre (sus recibos siguen igual).</p>' +
      '<div class="grid g2" style="gap:8px"><div><label class="lb">NOMBRE DE LA SUCURSAL</label><input class="in" id="mc49-n" placeholder="Santa María Plaza"></div>' +
      '<div><label class="lb">FRECUENCIA</label><select class="sel" id="mc49-f"><option value="">La de esta ficha</option>' + ['SEMANAL', '2X SEMANA', 'QUINCENAL', 'MENSUAL', 'BIMESTRAL', 'TRIMESTRAL', 'SEMESTRAL', 'ANUAL', 'DIARIA'].map(function (f) { return '<option>' + f + '</option>'; }).join('') + '</select></div>' +
      '<div style="grid-column:1/-1"><label class="lb">DIRECCIÓN</label><input class="in" id="mc49-d" placeholder="Calle, edificio, local"></div>' +
      '<div><label class="lb">HORARIO</label><input class="in" id="mc49-h" placeholder="8:00 a 11:00"></div><div><label class="lb">PUNTO EN EL MAPA (OPCIONAL)</label><input class="in" id="mc49-c" placeholder="lat, lng"></div>' +
      '<div><label class="lb">CONTACTO EN EL LUGAR</label><input class="in" id="mc49-k"></div><div><label class="lb">TELÉFONO</label><input class="in" id="mc49-t"></div>' +
      '<div><label class="lb">COSTO POR VISITA (B/.)</label><input class="in" id="mc49-p" type="number" placeholder="El de esta ficha"></div>' +
      '<div style="grid-column:1/-1"><label class="lb">DIRECCIÓN DE ESTA FICHA (SI TENÍA LAS DOS JUNTAS)</label><input class="in" id="mc49-a" value="' + E(c.direccion || '') + '"></div></div>' +
      '<div id="mc49-nv"></div><div class="pie"><button class="btn" onclick="MK.cerrarHoja()">Cancelar</button><button class="btn pri" id="mc49-ok">Enviar el alta a Logística</button></div>', { ancha: true });
    pintarEd('mc49-nv', ED.nueva);
    document.getElementById('mc49-ok').onclick = function () {
      var b = this, v = function (k) { return document.getElementById(k).value.trim(); }, cc = v('mc49-c').split(','), lat = parseFloat(cc[0]), lng = parseFloat(cc[1]);
      MK.ocupado(b, true);
      MK.llamar('api_merAgregarSucursal', MK.pin, c.id, { nombre: v('mc49-n'), direccion: v('mc49-d'), frecuencia: v('mc49-f'), horario: v('mc49-h'), contacto: v('mc49-k'), telefono: v('mc49-t'), costo: v('mc49-p'),
        lat: isFinite(lat) && isFinite(lng) ? lat : '', lng: isFinite(lat) && isFinite(lng) ? lng : '', direccionActual: v('mc49-a'), servicios: ED.nueva.sv, insumos: ED.nueva.ins })
        .then(function (r) { MK.cerrarHoja(); MK.aviso('Alta enviada a Logística: ' + r.nombre); }, function () { MK.ocupado(b, false); });
    };
  }
  document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-mc49]'); if (!b || !X) return; var a = b.getAttribute('data-mc49'); if (a === 'editar') editar(); else if (a === 'sucursal') sucursal(); });
  return { card: card, servTx: servTx,
    srv: function (id, k, v) { obj(id).sv[k] = v; if (k === 'fumigacion') pintarEd(id, obj(id)); },
    ins: function (id, n, k, v) { obj(id).ins[n][k] = k === 'cantidad' ? Number(v) : v; },
    insMas: function (id) { var C = (X.insumos || [])[0]; if (C) obj(id).ins.push({ catId: C.id, cantidad: 1, cada: 'mes' }); pintarEd(id, obj(id)); },
    insQuitar: function (id, n) { obj(id).ins.splice(n, 1); pintarEd(id, obj(id)); } };
})();
</script>
</body>
</html>
