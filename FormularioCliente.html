<title>Formulario de datos · ECOVSA</title>
<link rel="icon" href="logo-ecovsa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* ═══ Formulario público del cliente · paso a paso (opción B) ═══
   Mismo lenguaje de Mercadeo: azul marino, blanco, bordes finos y el color
   solo para estados. Sin kit: la página es pública y no lleva PIN. */
:root{
  --navy:#0f2a57; --navy2:#14306b; --ink:#0f2140; --txt:#3d4a60; --muted:#667489; --muted2:#8a96a8;
  --line:#e1e6ee; --line2:#eef1f5; --bg:#f4f6f9; --card:#fff; --campo:#d3dcea; --sel:#f5f8fd;
  --ok:#2f9e44; --ok-bg:#eaf6e4; --bad:#d64045; --bad-bg:#fdecea; --warn-bg:#fff4d6; --warn:#8a6100;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100vh;min-height:100dvh}
button{font-family:inherit;color:inherit}
a{color:var(--navy2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid #9db4d8;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cargando */
.carga{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:50;color:var(--muted);font-weight:600;font-size:14px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy2);animation:g .9s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}

/* marca */
.top{background:var(--navy);color:#fff}
.top .in{max-width:680px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.lg{width:44px;height:44px;border-radius:11px;background:#fff url(logo-ecovsa.png) center/34px no-repeat;flex:none}
.top b{display:block;font-size:15px;letter-spacing:2px}
.top span{font-size:12px;color:#b8c7e0}
.top .wmk{display:block;width:96px;height:auto;margin:1px 0 4px}
.trust{background:#fff;border-bottom:1px solid var(--line)}
.trust .in{max-width:680px;margin:0 auto;padding:9px 18px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--txt)}
.trust span{display:inline-flex;align-items:center;gap:6px}
.trust svg.i{width:15px;height:15px;color:var(--navy2)}

/* estructura del paso */
.bw{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.bh{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid transparent}
.bh.sombra{border-bottom-color:var(--line)}
.bh .in{max-width:680px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:12px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--navy2);flex:none}
.back:disabled{opacity:.35;cursor:default}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:5px;border-radius:3px;background:#d8dfe9}
.segs i.on{background:var(--navy2)}
.bh .cuenta{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.bh .mini{display:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff url(logo-ecovsa.png) center/24px no-repeat;flex:none}
.bc{flex:1;padding:14px 18px 22px;max-width:680px;width:100%;margin:0 auto}
.bc h2{font-size:24px;line-height:1.22;font-weight:700;margin:4px 0 6px;outline:none}
.bc .ex{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.bf{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line)}
.bf .in{max-width:680px;margin:0 auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.guardado{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;min-height:17px}
.guardado.mal{color:var(--bad);font-weight:600}

/* botones */
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:var(--navy2);color:#fff;font:700 16.5px Archivo,sans-serif;padding:15px;cursor:pointer;min-height:52px;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:#fff;color:var(--navy2);border:1.5px solid #c9d5e8}
.btn.wa{background:#1fa855}
.lnk{display:block;width:100%;text-align:center;background:none;border:0;color:var(--navy2);font:700 14.5px Archivo,sans-serif;padding:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#b9c7de}

/* piezas de las preguntas */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1.5px solid var(--campo);background:#fff;border-radius:14px;padding:14px 12px;min-height:96px;text-align:left;font:700 15px Archivo,sans-serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile svg.i{color:var(--navy2);width:26px;height:26px}
.tile[aria-pressed="true"]{border-color:var(--navy2);background:var(--sel);box-shadow:0 0 0 1px var(--navy2) inset}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--campo);border-radius:12px;padding:13px 13px;background:#fff;cursor:pointer;text-align:left;font:inherit;width:100%}
.opt .bx{width:24px;height:24px;border-radius:7px;border:1.5px solid #b3c0d4;display:grid;place-items:center;flex:none;margin-top:1px;color:#fff;background:#fff}
.opt .bx svg.i{width:16px;height:16px;stroke-width:2.6}
.opt b{display:block;font-size:15.5px}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35}
.opt[aria-pressed="true"]{border-color:var(--navy2);background:var(--sel)}
.opt[aria-pressed="true"] .bx{background:var(--navy2);border-color:var(--navy2)}
.lstb{display:grid;gap:9px}
.lstb button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--campo);background:#fff;border-radius:12px;padding:15px 14px;font:700 16px Archivo,sans-serif;color:var(--ink);cursor:pointer;text-align:left;min-height:56px}
.lstb button small{font-weight:500;color:var(--muted);font-size:13px;display:block}
.lstb button svg.i{color:var(--muted2)}
.lstb button[aria-pressed="true"]{border-color:var(--navy2);background:var(--sel);box-shadow:0 0 0 1px var(--navy2) inset}
.lstb button[aria-pressed="true"] svg.i{color:var(--navy2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--campo);background:#fff;border-radius:22px;padding:10px 15px;font:600 14.5px Archivo,sans-serif;color:var(--ink);cursor:pointer;min-height:44px}
.chips button[aria-pressed="true"]{background:var(--navy2);border-color:var(--navy2);color:#fff}
.stp{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 16px}
.stp button{width:60px;height:60px;border-radius:50%;border:1.5px solid #c9d5e8;background:#fff;font:700 28px Archivo,sans-serif;color:var(--navy2);cursor:pointer;display:grid;place-items:center}
.stp .v{text-align:center}
.stp input{width:130px;text-align:center;border:0;border-bottom:2px solid var(--line);background:transparent;font:800 46px Archivo,sans-serif;color:var(--ink);padding:2px 0;font-variant-numeric:tabular-nums;border-radius:0}
.stp input:focus{outline:none;border-bottom-color:var(--navy2)}
.stp small{display:block;color:var(--muted);font-size:13.5px;margin-top:4px}
.seg{display:inline-flex;border:1.5px solid #c9d5e8;border-radius:11px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:10px 16px;font:700 14px Archivo,sans-serif;color:var(--muted);cursor:pointer;min-height:44px}
.seg button+button{border-left:1.5px solid #c9d5e8}
.seg button[aria-pressed="true"]{background:var(--navy2);color:#fff}
.centro{text-align:center}

/* campos */
.fg{margin-top:16px}
.fg:first-of-type{margin-top:4px}
.fl{display:block;font-size:14px;font-weight:700;color:var(--txt);margin-bottom:6px}
.fl .rq{color:var(--bad);font-style:normal}
.fl .op{font-weight:500;color:var(--muted);font-size:13px}
.fi{width:100%;border:1.5px solid var(--campo);border-radius:11px;padding:12px 13px;font:500 16px Archivo,sans-serif;color:var(--ink);background:#fff;min-height:50px;-webkit-appearance:none;appearance:none}
.fi:focus{outline:2px solid #9db4d8;border-color:var(--navy2)}
.fi::placeholder{color:#9aa6b8}
textarea.fi{resize:vertical;min-height:84px;line-height:1.4}
.fh{font-size:13px;color:var(--muted);margin-top:5px}
.fe{display:none;font-size:13.5px;color:var(--bad);font-weight:600;margin-top:6px}
.fg.err .fi{border-color:var(--bad);background:#fffafa}
.fg.err .fe,.blq.err .fe{display:block}
.blq.err .opts .opt,.blq.err .tile{border-color:#e9a3a6}
.fila2{display:grid;grid-template-columns:1fr;gap:0 12px}
.fila2.ruc{grid-template-columns:1fr 92px}
.fila2 .fg{margin-top:16px}
.ubic{display:flex;gap:12px;align-items:center;border:1.5px solid #c9d5e8;background:#fff;border-radius:12px;padding:12px 14px;margin-top:12px;width:100%;cursor:pointer;text-align:left;font:inherit;color:var(--navy2)}
.ubic b{display:block;font-size:15px}.ubic small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.ubic.ok{border-color:#bfe0c3;background:#f6fbf5;color:var(--ok)}
.ubic.ok b{color:var(--ink)}
.ubic:disabled{opacity:.7;cursor:progress}
.notita{font-size:13px;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;display:flex;gap:9px;align-items:flex-start}
.notita svg.i{width:17px;height:17px;color:var(--navy2);margin-top:1px}
.notita.mal{background:var(--bad-bg);border-color:#f3c3c5;color:#8f2a2e}
.notita.mal svg.i{color:var(--bad)}

/* intro */
.hola h2{font-size:25px}
.hola .ex{font-size:15.5px;color:var(--txt)}
.caja{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px}
.caja .r{display:flex;gap:12px;align-items:flex-start;padding:11px 0;font-size:14.5px}
.caja .r+.r{border-top:1px solid var(--line2)}
.caja .r svg.i{color:var(--navy2);margin-top:1px}
details.info{background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:14px;font-size:14px}
details.info summary{cursor:pointer;padding:13px 14px;font-weight:700;color:var(--navy2);list-style:none;display:flex;gap:9px;align-items:center}
details.info summary::-webkit-details-marker{display:none}
details.info summary svg.i{width:18px;height:18px}
details.info .x{padding:0 14px 14px;color:var(--txt);line-height:1.6}
details.info .x b{color:var(--ink)}
.pie{text-align:center;font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}

/* resumen */
.rev{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;font:inherit;color:inherit;padding:0}
.rev:hover{border-color:#c9d5e8}
.rev .rh{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line2);font-weight:700;font-size:14.5px}
.rev .rh .cam{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--navy2);font-size:13.5px;font-weight:700}
.rev .rh .cam svg.i{width:15px;height:15px}
.rev .rb{display:block;padding:9px 13px 11px;font-size:14px;color:var(--txt);line-height:1.55;word-wrap:break-word}
.rev .rb .no{color:var(--muted2)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 8px}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.rev.falta{border-color:#f0b9bb}

/* hoja */
.velo{position:fixed;inset:0;background:rgba(10,25,50,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:#fff;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px}
.hoja h3{font-size:19px;margin-bottom:8px;outline:none}
.hoja p{font-size:14.5px;color:var(--txt)}
@media(min-width:640px){ .velo{align-items:center} .hoja{border-radius:18px} }

/* final y avisos */
.fin{max-width:600px;margin:0 auto;padding:22px 18px 30px}
/* documentos (api 3.5.1) */
.dprog{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-size:13px;color:var(--muted);font-weight:600}
.dprog div{flex:1;height:8px;border-radius:5px;background:var(--line2);overflow:hidden}.dprog i{display:block;height:100%;background:var(--ok);border-radius:5px}
.dlis{background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.dit{display:flex;gap:12px;align-items:center;padding:14px}
.dit+.dit{border-top:1px solid var(--line2)}
.dsub{padding:0 14px 12px}.dsub .arc-t{margin:0}
.dic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--line2);color:var(--muted);flex:none}
.dit.ok .dic{background:var(--ok-bg);color:var(--ok)}.dit.r .dic{background:var(--bad-bg);color:var(--bad)}.dit.am .dic{background:var(--warn-bg);color:var(--warn)}
.dtx{flex:1;min-width:0}.dtx b{display:block;font-size:15px}.dtx small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}.dtx .mot{display:inline;font-size:12.5px;color:#8f2a2e}
.dch{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:4px;background:var(--line2);color:var(--muted)}
.dch.ok{background:var(--ok-bg);color:#1f7a3a}.dch.r{background:var(--bad-bg);color:#a8262b}.dch.am{background:var(--warn-bg);color:var(--warn)}
.dbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #c9d5e8;background:#fff;color:var(--navy2);border-radius:10px;padding:9px 12px;font:700 13.5px Archivo,sans-serif;cursor:pointer;flex:none;white-space:nowrap}
.dbtn svg.i{width:17px;height:17px}.dbtn:disabled{opacity:.6}
@media(max-width:520px){.dit{flex-wrap:wrap}.dtx{flex:1 1 calc(100% - 60px)}.dbtn{margin-left:50px}}
.okc{width:66px;height:66px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:6px auto 14px}
.okc svg.i{width:34px;height:34px;stroke-width:2.6}
.okc.am{background:var(--warn-bg);color:var(--warn)}
.fin h2{text-align:center;font-size:23px;line-height:1.25;outline:none}
.fin .sub{text-align:center;color:var(--txt);margin-top:6px;font-size:15px}
.fin .sub b{color:var(--ink)}
.fin h4{font-size:15px;margin-top:22px}
.tl{margin-top:12px;border-left:2px solid var(--line);padding-left:18px;margin-left:6px}
.tl div{position:relative;padding:0 0 16px}
.tl div:before{content:"";position:absolute;left:-26px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--navy2)}
.tl div.y:before{background:var(--navy2)}
.tl b{display:block;font-size:14.5px}
.tl small{color:var(--muted);font-size:13.5px;display:block;margin-top:1px}
.ase{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:8px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:#e7edf7;color:var(--navy2);flex:none}
.ase b{display:block}.ase small{color:var(--muted);font-size:13px}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.acc .btn{font-size:15px;padding:12px;min-height:48px}
.acc .btn.full{grid-column:1/-1}

/* aviso flotante */
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;font-size:14px;font-weight:600;border-radius:11px;padding:11px 16px;box-shadow:0 10px 30px rgba(15,33,64,.25);max-width:calc(100% - 32px);text-align:center}

@media(min-width:640px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .opts.dos{grid-template-columns:1fr 1fr}
  .fila2{grid-template-columns:1fr 1fr}
  .fila2.ruc{grid-template-columns:1fr 130px}
  .bc{padding:26px 24px 30px}
  .bc h2{font-size:28px}
  .bh .mini{display:block}
  .bh .in{padding:14px 24px 10px}
  .bf .in{padding:14px 24px 16px}
  .bf .btn{max-width:360px;margin:0 auto}
  .top .in,.trust .in{padding-left:24px;padding-right:24px}
}
</style>
</head>

/* ═══ validación amable ═══ */
function soloDig(s){ return String(s || '').replace(/\D/g, ''); }
function celOk(s){ var d = soloDig(s); if (/^\+/.test(txt(s))) return d.length >= 8 && d.length <= 15; if (d.length === 11 && d.indexOf('507') === 0) d = d.slice(3); return d.length === 7 || d.length === 8; }
function correoOk(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s); }
function rucNorm(s){ return String(s || '').toUpperCase().replace(/\s+/g, '').replace(/[–—]/g, '-').replace(/-+/g, '-'); }
function rucOk(s){ var r = rucNorm(s); return /^[0-9A-Z]{1,12}(-[0-9A-Z]{1,12}){2,3}$/.test(r) && soloDig(r).length >= 4; }
function errores(p){
  var e = [];
  if (p === 'act') { if (!D.act) e.push(['b-act']); else if (D.act === 'Otro' && !txt(D.actOtro)) e.push(['actOtro', 'Cuéntenos a qué se dedica.']); }
  if (p === 'res' && !D.res.length) e.push(['b-res']);
  if (p === 'kg') { var v = kgValor(); if (v && !(Number(v.replace(',', '.')) >= 0)) e.push([D.modoKg, 'Escriba solo el número, por ejemplo 20.']); }
  if (p === 'quien') {
    if (!txt(D.contacto)) e.push(['contacto', 'Díganos con quién coordinamos.']);
    if (!txt(D.celular)) e.push(['celular', 'Falta el celular: por ahí le avisamos de cada visita.']);
    else if (!celOk(D.celular)) e.push(['celular', 'Revise el número: un celular en Panamá tiene 8 dígitos, por ejemplo 6000-0000.']);
    var c = txt(D.correo);
    if (c && !correoOk(c)) e.push(['correo', 'Revise el correo: parece que le falta algo. Ejemplo: recepcion@clinica.com']);
    else if (c && /\.(con|cmo|om|comm)$/i.test(c)) e.push(['correo', '¿Quiso decir «' + esc(c.replace(/\.(con|cmo|om|comm)$/i, '.com')) + '»? Revise el final del correo.']);
    if (txt(D.telefono) && !celOk(D.telefono)) e.push(['telefono', 'Revise el teléfono: debe tener 7 u 8 dígitos, por ejemplo 200-0000.']);
  }
  if (p === 'donde' && !txt(D.direccion)) e.push(['direccion', 'Falta la dirección: sin ella no podemos incluirlo en la ruta.']);
  if (p === 'fact') {
    if (!txt(D.empresa)) e.push(['empresa', 'Falta el nombre del establecimiento.']);
    if (!txt(D.ruc)) e.push(['ruc', 'Falta el RUC. Está en el Aviso de Operación.']);
    else if (!rucOk(D.ruc)) e.push(['ruc', /-/.test(D.ruc) ? 'Revise el RUC: va con sus guiones, tal como sale en el Aviso de Operación. Ej.: 155712345-2-2021 u 8-123-456.' : 'Escriba el RUC con sus guiones, tal como sale en el Aviso de Operación. Ej.: 155712345-2-2021.']);
    if (txt(D.dv) && !/^\d{1,2}$/.test(txt(D.dv))) e.push(['dv', 'El DV son 1 o 2 números. Ej.: 58']);
  }
  return e;
}
function faltantes(){
  var f = [];
  PASOS.forEach(function (p) { if (p !== 'hola' && p !== 'rev' && errores(p).length) f.push({ paso: p }); });
  return f;
}
function mostrarErrores(e){
  document.querySelectorAll('.fg.err,.blq.err').forEach(function (g) { g.classList.remove('err'); });
  document.querySelectorAll('.fi[aria-invalid]').forEach(function (x) { x.removeAttribute('aria-invalid'); });
  var primero = null;
  e.forEach(function (x) {
    if (x[0].indexOf('b-') === 0) { var b = $(x[0]); if (b) { b.classList.add('err'); primero = primero || b.querySelector('button'); } return; }
    var g = $('g-' + x[0]), inp = $('f-' + x[0]);
    if (g) { g.classList.add('err'); $('f-' + x[0] + '-e').innerHTML = x[1]; }
    if (inp) { inp.setAttribute('aria-invalid', 'true'); primero = primero || inp; }
    else if (!g && x[1]) toast(x[1]);
  });
  if (primero) { primero.focus({ preventScroll: true }); primero.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

/* ═══ navegación ═══ */
/* Avanzar agrega una entrada al historial (el botón «atrás» del teléfono
   vuelve a la pregunta anterior); retroceder con la flecha solo la reemplaza. */
function ir(k, empujar){
  i = Math.max(0, Math.min(PASOS.length - 1, k));
  if (empujar !== false) history.pushState({ paso: i }, ''); else history.replaceState({ paso: i }, '');
  pintar();
}
function siguiente(){
  var p = PASOS[i], e = errores(p);
  if (p === 'fact') { D.ruc = rucNorm(D.ruc); }
  if (e.length) return mostrarErrores(e);
  if (p === 'rev') return enviar();
  var dest = desdeResumen ? PASOS.indexOf('rev') : i + 1;
  if (PASOS[dest] === 'rev') desdeResumen = false;
  guardar(PASOS[dest]);
  ir(dest);
}
window.addEventListener('popstate', function (ev) {
  if (!D || enviado) return;
  var k = ev.state && typeof ev.state.paso === 'number' ? ev.state.paso : 0;
  desdeResumen = false; i = k; pintar();
});

/* ═══ eventos ═══ */
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('button,[data-a]'); if (!b) return;
  var a = b.getAttribute('data-a');
  if (a === 'reintentar') { $('app').innerHTML = ''; return seguir(TOKEN); }
  if (a === 'docs') return pantallaDocs({ yaEnvio: enviado });
  if (a === 'volverForm') { if (enviado) return listo(); return pintar(); }
  if (a === 'subirDoc') return elegirDoc(b.getAttribute('data-doc'));
  if (!D || enviado) return;
  if (a === 'empezar') { guardar(PASOS[1]); return ir(1); }
  if (a === 'atras') {
    var dest = desdeResumen ? PASOS.indexOf('rev') : i - 1; desdeResumen = false;
    if (dest > 0) guardar(PASOS[dest]);
    return ir(dest, false);
  }
  if (a === 'sig') return siguiente();
  if (a === 'despues') return despues();
  if (a === 'ubic') return ubicar();
  if (a === 'modoKg') { D.modoKg = D.modoKg === 'bolsas' ? 'kg' : 'bolsas'; pintar(false); var inp = $('f-' + D.modoKg); if (inp) inp.focus(); return; }
  if (a === 'cerrarHoja') return cerrarHoja();
  if (b.hasAttribute('data-act')) {
    D.act = b.getAttribute('data-act');
    document.querySelectorAll('[data-act]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    if (D.act === 'Otro') { pintar(false); var o = $('f-actOtro'); if (o) o.focus(); return; }
    D.actOtro = '';
    return setTimeout(siguiente, 180);
  }
  if (b.hasAttribute('data-res')) {
    var r = b.getAttribute('data-res'), k = D.res.indexOf(r);
    if (k >= 0) D.res.splice(k, 1);
    else if (r === NOSE) D.res = [NOSE];
    else { D.res = D.res.filter(function (x) { return x !== NOSE; }); D.res.push(r); }
    var y = window.scrollY; pintar(false); window.scrollTo(0, y);
    var nb = document.querySelector('[data-res="' + r.replace(/"/g, '\\"') + '"]'); if (nb) nb.focus({ preventScroll: true });
    return;
  }
  if (b.hasAttribute('data-frec')) {
    D.frec = b.getAttribute('data-frec');
    document.querySelectorAll('[data-frec]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    return setTimeout(siguiente, 180);
  }
  if (b.hasAttribute('data-set')) {
    var key = b.getAttribute('data-set'), val = b.getAttribute('data-v');
    D[key] = D[key] === val && key !== 'base' ? '' : val;
    var y2 = window.scrollY; pintar(false); window.scrollTo(0, y2);
    var foco = (key === 'cargo' && D.cargo === 'Otro') ? $('f-cargoOtro') : (key === 'prov' && D.prov === 'Otra') ? $('f-provOtra') : document.querySelector('[data-set="' + key + '"][data-v="' + val.replace(/"/g, '\\"') + '"]');
    if (foco) foco.focus({ preventScroll: true });
    return;
  }
  if (b.hasAttribute('data-mas')) {
    var km = b.getAttribute('data-mas'), n = Number(String(D[km] || '0').replace(',', '.')) || 0, d = Number(b.getAttribute('data-d'));
    var paso = km === 'kg' && (n > 10 || (n === 10 && d > 0)) ? 5 : 1;
    n = Math.max(0, Math.round((n + d * paso) * 10) / 10);
    D[km] = n ? String(n) : '';
    $('f-' + km).value = D[km];
    var sg = $('sig'); if (sg && !desdeResumen) { sg.textContent = n > 0 ? 'Siguiente' : 'No sé, seguir'; sg.classList.toggle('sec', !(n > 0)); }
    return;
  }
  if (b.hasAttribute('data-ir')) { desdeResumen = true; return ir(PASOS.indexOf(b.getAttribute('data-ir'))); }
});
document.addEventListener('input', function (ev) {
  var t = ev.target, k = t.getAttribute && t.getAttribute('data-k'); if (!k || !D) return;
  D[k] = t.value;
  var g = $('g-' + k); if (g && g.classList.contains('err')) { g.classList.remove('err'); t.removeAttribute('aria-invalid'); }
  if ((k === 'kg' || k === 'bolsas') && $('sig') && !desdeResumen) { var n = Number(String(t.value).replace(',', '.')); $('sig').textContent = n > 0 ? 'Siguiente' : 'No sé, seguir'; $('sig').classList.toggle('sec', !(n > 0)); }
});
/* Enter en un campo de una línea: pasa al siguiente campo o al botón. */
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && $('velo')) return cerrarHoja();
  if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
  ev.preventDefault();
  var campos = Array.prototype.slice.call(document.querySelectorAll('#bc .fi, #bc .stp input'));
  var k = campos.indexOf(ev.target);
  if (k >= 0 && k < campos.length - 1) campos[k + 1].focus(); else siguiente();
});
window.addEventListener('scroll', function () { var bh = $('bh'); if (bh) bh.classList.toggle('sombra', window.scrollY > 4); }, { passive: true });

/* ═══ usar mi ubicación ═══ */
function mapa(){ return '<div class="fh" style="margin-top:7px">Punto guardado para la ruta · <a href="https://www.google.com/maps?q=' + D.lat + ',' + D.lng + '" target="_blank" rel="noopener">Ver en el mapa</a></div>'; }
function ubicar(){
  var b = $('ubic'), s = $('ubic-s'), m = $('ubic-msg');
  function msg(t, mal){ m.innerHTML = '<div class="notita' + (mal ? ' mal' : '') + '">' + ic(mal ? 'alerta' : 'info') + '<span>' + t + '</span></div>'; }
  if (!navigator.geolocation) return msg('Este teléfono no deja compartir la ubicación desde aquí. No pasa nada: con la dirección basta.', true);
  b.disabled = true; s.textContent = 'Buscando su ubicación…'; m.innerHTML = '';
  navigator.geolocation.getCurrentPosition(function (pos) {
    D.lat = pos.coords.latitude.toFixed(6); D.lng = pos.coords.longitude.toFixed(6);
    b.disabled = false; b.classList.add('ok'); b.innerHTML = ic('check') + '<span><b>Ubicación agregada</b><small id="ubic-s">Toque para tomarla de nuevo</small></span>';
    var prec = Math.round(pos.coords.accuracy || 0);
    msg('Listo. El conductor llegará directo con el mapa' + (prec ? ' (precisión de unos ' + prec + ' m)' : '') + '. <a href="https://www.google.com/maps?q=' + D.lat + ',' + D.lng + '" target="_blank" rel="noopener">Ver en el mapa</a>');
    guardar(PASOS[i]);
  }, function (err) {
    b.disabled = false; s.textContent = D.lat ? 'Toque para tomarla de nuevo' : 'Deja el punto exacto en el mapa para la ruta';
    msg(err && err.code === 1 ? 'No nos dio permiso para ver la ubicación. No pasa nada: con la dirección basta.'
      : 'No pudimos encontrar la ubicación ahora. Puede intentar otra vez o seguir solo con la dirección.', true);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

/* ═══ guardar y seguir después ═══ */
function despues(){
  D.ruc = rucNorm(D.ruc);
  guardar('fact', function (ok) {
    var h = $('velo-h'); if (!h) return;
    $('velo-t').innerHTML = ok ? 'Guardamos todo lo que lleva. Cuando tenga el Aviso de Operación a mano, abra <b>el mismo enlace</b> que le enviamos y seguirá en esta pregunta.'
      : 'No pudimos guardar ahora (revise la señal). Si cierra, lo que falte por guardar se pierde: mejor intente de nuevo en un momento.';
    h.textContent = ok ? 'Quedó guardado' : 'No se pudo guardar';
  });
  var v = document.createElement('div'); v.className = 'velo'; v.id = 'velo';
  v.innerHTML = '<div class="hoja" role="dialog" aria-modal="true" aria-labelledby="velo-h"><h3 id="velo-h" tabindex="-1">Guardando…</h3><p id="velo-t">Un momento.</p>' +
    '<button class="btn" style="margin-top:16px" data-a="cerrarHoja">Seguir llenando</button></div>';
  v.addEventListener('click', function (e) { if (e.target === v) cerrarHoja(); });
  document.body.appendChild(v);
  $('velo-h').focus();
}
function cerrarHoja(){ var v = $('velo'); if (v) v.remove(); var s = $('sig'); if (s) s.focus(); }

/* ═══ envío ═══ */
var enviado = false, vigilando = null;
function enviar(){
  var f = faltantes();
  if (f.length) { toast('Falta completar un dato en esta parte.'); desdeResumen = true; ir(PASOS.indexOf(f[0].paso)); setTimeout(function () { mostrarErrores(errores(f[0].paso)); }, 60); return; }
  var b = $('sig'); b.disabled = true; b.textContent = 'Enviando…';
  $('errEnvio').innerHTML = '';
  /* primero el borrador (lleva la ubicación, que el envío final no recibe) y después el envío que cierra el enlace */
  guardar('rev', function () {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) return listo();
        if (r && r.cerrado) return pantallaCerrada({ recibido: '' });
        falloEnvio((r && r.error) || 'No se pudo enviar. Intente de nuevo.');
      })
      .withFailureHandler(function (err) {
        var m = String(err && err.message || err || '');
        if (/cola/i.test(m)) return enCola();
        falloEnvio('No pudimos enviar sus datos (revise la señal). Lo que lleva está guardado; intente de nuevo.');
      })
      .api_guardarDatosFormularioCliente(TOKEN, datosEnvio());
  });
}
function falloEnvio(t){
  var b = $('sig'); if (b) { b.disabled = false; b.textContent = 'Intentar de nuevo'; }
  $('errEnvio').innerHTML = '<div class="notita mal" style="margin:0 0 10px">' + ic('alerta') + '<span>' + esc(t) + '</span></div>';
}
/* Sin señal: el puente dejó el envío en cola y lo manda solo al volver la conexión.
   Se consulta el enlace cada 15 s; cuando figura recibido, se muestra el final. */
function enCola(){
  var b = $('sig'); if (b) { b.disabled = true; b.textContent = 'Esperando señal…'; }
  $('errEnvio').innerHTML = '<div class="notita" style="margin:0 0 10px">' + ic('info') + '<span>No hay señal ahora. Sus datos se enviarán solos en cuanto vuelva la conexión; no hace falta enviarlos de nuevo. Deje esta página abierta.</span></div>';
  clearInterval(vigilando);
  vigilando = setInterval(function () {
    google.script.run.withSuccessHandler(function (r) {
      if (r && !r.ok && r.cerrado) { clearInterval(vigilando); listo(); }
    }).withFailureHandler(function () {}).api_crmFormulario(TOKEN);
  }, 15000);
}

function listo(){
  enviado = true; $('toast').hidden = true;
  var ce = R.contactoEcovsa || {}, nom = txt(ce.nombre) || 'ECOVSA', firma = txt(ce.firma), cont = txt(D.contacto);
  var cargo = firma && nom !== 'ECOVSA' && firma.toLowerCase().indexOf(nom.toLowerCase()) === 0 ? firma.slice(nom.length).replace(/^\s*·\s*/, '') : 'Asesor comercial · ECOVSA';
  if (nom === 'ECOVSA') cargo = 'Equipo comercial';
  var ini = nom.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
  var tel = txt(ce.telefono) || TEL, telLink = 'tel:+507' + soloDig(tel);
  var wa = WA_LINK + '?text=' + encodeURIComponent('Hola, soy ' + (cont || 'la persona de contacto') + ' de ' + (D.empresa || 'mi establecimiento') + '. Acabo de enviar el formulario (referencia ' + TOKEN + ').');
  var u = unica();
  $('app').innerHTML = marca() +
    '<main class="fin"><div class="okc">' + ic('check') + '</div>' +
    '<h2 tabindex="-1">¡Listo' + (cont ? ', ' + esc(cont.split(/\s+/)[0]) : '') + '! Recibimos sus datos</h2>' +
    '<p class="sub">Gracias por completar la información de <b>' + esc(D.empresa) + '</b>.<br>Referencia de su solicitud: <b>' + esc(TOKEN) + '</b></p>' +
    '<h4>¿Qué sigue?</h4><div class="tl">' +
      '<div class="y"><b>Hoy o el próximo día hábil</b><small>' + (nom === 'ECOVSA' ? 'Nuestro equipo revisa' : esc(nom) + ' revisa') + ' sus datos y le escribe si falta algo.</small></div>' +
      '<div><b>En 1 o 2 días hábiles</b><small>Le enviamos la propuesta por WhatsApp' + (txt(D.correo) ? ' y correo' : '') + ', con el precio y las condiciones del servicio.</small></div>' +
      (u ? '<div><b>Si la acepta</b><small>Coordinamos con usted el día y la hora de la recolección.</small></div>'
         : '<div><b>Si la acepta</b><small>Firmamos el contrato y programamos la primera recolección. En esa visita le dejamos su distintivo con código QR.</small></div>') +
    '</div>' +
    (DOCS && !DOCS.completo ? '<h4>Documentos para el contrato</h4><div class="notita">' + ic('documento') + '<span>Si ya los tiene a mano (aviso de operación, cédula del representante, Registro Público y datos bancarios), puede subirlos ahora o más tarde con este mismo enlace. No son obligatorios para recibir la propuesta.</span></div>' +
      '<button class="btn sec" style="margin-top:10px" data-a="docs">' + ic('subir') + 'Subir documentos</button>' : '') +
    '<h4>¿Dudas? Le atiende</h4>' +
    '<div class="ase"><div class="av" aria-hidden="true">' + esc(ini || 'E') + '</div><div style="flex:1;min-width:0"><b>' + esc(nom) + '</b><small>' + esc(cargo) + '</small></div></div>' +
    '<div class="acc"><a class="btn wa" href="' + wa + '" target="_blank" rel="noopener">' + ic('whatsapp') + 'WhatsApp</a>' +
      '<a class="btn sec" href="' + telLink + '" aria-label="Llamar al ' + esc(tel) + '">' + ic('telefono') + 'Llamar</a>' +
      '<a class="btn sec full" href="mailto:' + CORREO + '?subject=' + encodeURIComponent('Solicitud ' + TOKEN) + '">' + ic('correo') + 'Escribir a ' + CORREO + '</a></div>' +
    '<p class="pie" style="margin-top:18px">Ya puede cerrar esta página. Si necesita corregir algo, avísenos por WhatsApp o al ' + esc(tel) + '.</p>' +
    '<div class="pie">ECOVSA · Resolución Sanitaria N.° 1519</div></main>';
  window.scrollTo(0, 0);
  document.querySelector('.fin h2').focus({ preventScroll: true });
}

/* ═══ api 3.5.1 · Documentos para el contrato ═══
   Se suben desde el mismo enlace, cuando el cliente quiera. Cada uno queda
   «en revisión» hasta que ECOVSA lo acepta; si se rechaza, se ve el motivo
   y se puede volver a subir. Con todos aceptados, el enlace se cierra. */
var DOC_OP = {};
function pantallaDocs(o){
  o = o || {};
  $('cargando').hidden = true;
  var L = (DOCS && DOCS.docs) || [], hechos = L.filter(function (d) { return d.estado === 'aceptado'; }).length;
  var EST = { falta: ['Falta', 'g'], 'por revisar': ['En revisión', 'am'], aceptado: ['Recibido', 'ok'], rechazado: ['Hay que volver a subirlo', 'r'] };
  $('app').innerHTML = marca() +
    '<main class="bc" style="padding-top:18px"><h2 tabindex="-1">Documentos para el contrato</h2>' +
    '<p class="ex">' + (o.yaEnvio ? 'Ya recibimos sus datos' + (o.empresa ? ' de <b>' + esc(o.empresa) + '</b>' : '') + '. ' : '') + 'Suba cada documento en PDF o como foto; las fotos se achican solas. ECOVSA los revisa y aquí verá si quedaron recibidos.</p>' +
    '<div class="dprog"><div><i style="width:' + Math.round(hechos / Math.max(1, L.length) * 100) + '%"></i></div><span>' + hechos + ' de ' + L.length + ' recibidos</span></div>' +
    '<div class="dlis">' + L.map(function (d) {
      var e = EST[d.estado] || [d.estado, 'g'], su = SUBIDAS[d.doc] && SUBIDAS[d.doc].tarjeta(), op = su && su.estado === 'trabajando' ? 'Subiendo…' : DOC_OP[d.doc];
      var btn = d.estado === 'aceptado' ? '' : '<button class="dbtn" data-a="subirDoc" data-doc="' + esc(d.doc) + '"' + (op ? ' disabled' : '') + '>' + ic('subir') + (op ? esc(op) : d.estado === 'falta' ? 'Subir' : d.estado === 'rechazado' ? 'Volver a subir' : 'Cambiar archivo') + '</button>';
      return '<div class="dit ' + e[1] + '"><div class="dic">' + ic(d.estado === 'aceptado' ? 'check' : d.estado === 'rechazado' ? 'alerta' : 'documento') + '</div><div class="dtx"><b>' + esc(d.n) + '</b>' +
        '<span class="dch ' + e[1] + '">' + esc(e[0]) + '</span>' +
        '<small>' + (d.estado === 'rechazado' ? '<b class="mot">Motivo: ' + esc(d.motivo) + '</b>' : d.estado === 'por revisar' ? 'Recibimos ' + esc(d.nombre || 'el archivo') + '. Lo revisamos pronto.' : d.estado === 'aceptado' ? 'Listo, gracias.' : esc(d.ayuda)) + '</small></div>' + btn + '</div>' +
        (SUBIDAS[d.doc] ? '<div class="dsub" data-sub="' + esc(d.doc) + '"></div>' : '');
    }).join('') + '</div>' +
    '<input type="file" id="dfile" accept="' + ((window.ARCH && ARCH.acepta) || '.pdf,image/*') + '" hidden>' +
    '<div id="derr"></div>' +
    '<div class="notita" style="margin-top:14px">' + ic('candado') + '<span>Sus documentos se guardan en un espacio privado de ECOVSA. Solo los ve el equipo que prepara su contrato.</span></div>' +
    '<button class="btn sec" style="margin-top:16px" data-a="volverForm">' + ic('atras') + (o.yaEnvio ? 'Volver' : 'Volver al formulario') + '</button>' +
    pie() + '</main>';
  var inp = $('dfile'); inp.onchange = function () { var f = inp.files[0]; var dd = inp.getAttribute('data-doc'); inp.value = ''; if (f && dd) subirDoc(dd, f); };
  ponerSubidas();
  var h = document.querySelector('.bc h2'); if (h) h.focus({ preventScroll: true });
}
function elegirDoc(doc){ var inp = $('dfile'); if (!inp) return; inp.setAttribute('data-doc', doc); inp.click(); }
function errDoc(t){ var e = $('derr'); if (e) e.innerHTML = '<div class="notita mal">' + ic('alerta') + '<span>' + esc(t) + '</span></div>'; }
/* api 3.5.2: cada subida con su tarjeta (emblema, porcentaje, pasos, Reintentar).
   La tarjeta vive aparte de la pantalla: al repintar la lista se vuelve a poner. */
var SUBIDAS = {};
function ponerSubidas(){
  Object.keys(SUBIDAS).forEach(function (k) { var t = SUBIDAS[k].tarjeta(), slot = document.querySelector('[data-sub="' + k + '"]'); if (t && slot && t.el.parentNode !== slot) slot.appendChild(t.el); });
}
function subirDoc(doc, f){
  var ya = SUBIDAS[doc] && SUBIDAS[doc].tarjeta();
  if (ya && ya.estado === 'trabajando') return;
  var e = $('derr'); if (e) e.innerHTML = '';
  var llamar = function (fn, args, msgSinRed) {
    return new Promise(function (ok, mal) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function () { mal(new Error(msgSinRed)); });
      r[fn].apply(r, args);
    });
  };
  SUBIDAS[doc] = ARCH.flujo({ host: document.createElement('div'), file: f, textoListo: 'Recibido. Lo revisamos pronto.',
    pedir: function (meta) {
      return llamar('api_docsClientePedirSubida', [TOKEN, K, doc, meta], 'Sin conexión. Intente de nuevo.').then(function (r) {
        if (r && r.ok && !r.subida) r.almacenError = 'Nuestro espacio de archivos no respondió. Intente en un rato o mándelo por WhatsApp al ' + WA + '.';
        return r;
      });
    },
    registrar: function (id) {
      return llamar('api_docsClienteListo', [TOKEN, K, id], 'El archivo subió pero no pudimos avisar. Intente de nuevo.').then(function (r) {
        if (r && r.ok) DOCS = { docs: r.docs, completo: r.completo };
        return r;
      });
    },
    alListo: function () {
      toast('Recibido. Lo revisamos pronto.');
      pantallaDocs({ yaEnvio: enviado }); ponerSubidas();
      setTimeout(function () { var t = SUBIDAS[doc] && SUBIDAS[doc].tarjeta(); if (t && t.estado === 'listo') { delete SUBIDAS[doc]; pantallaDocs({ yaEnvio: enviado }); ponerSubidas(); } }, 2500);
    },
    alError: function () { pantallaDocs({ yaEnvio: enviado }); ponerSubidas(); },
    alCancelar: function () { delete SUBIDAS[doc]; pantallaDocs({ yaEnvio: enviado }); ponerSubidas(); }
  });
  pantallaDocs({ yaEnvio: enviado }); ponerSubidas();
}

/* ═══ pantallas de aviso: enlace cerrado, inválido o sin señal ═══ */
function pantallaCerrada(r){
  enviado = true;
  var fecha = '';
  if (r && r.recibido) { var p = String(r.recibido).split('-'); if (p.length === 3) fecha = ' el ' + Number(p[2]) + ' de ' + ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][Number(p[1]) - 1] + ' de ' + p[0]; }
  if (r && 'recibido' in r)
    return pantallaAviso('Ya recibimos sus datos', 'Recibimos la información' + (r.empresa ? ' de <b>' + esc(r.empresa) + '</b>' : '') + fecha + '. Este enlace ya quedó cerrado.<br>Si necesita corregir algo, llámenos al <a href="' + TEL_LINK + '">' + TEL + '</a> o escríbanos por WhatsApp.', { bueno: true, html: true });
  pantallaAviso('Esta solicitud ya fue atendida', 'Esta solicitud ya fue procesada. Gracias por su interés.<br>Si tiene alguna duda, llámenos al <a href="' + TEL_LINK + '">' + TEL + '</a>.', { bueno: true, html: true });
}
function pantallaAviso(titulo, texto, o){
  o = o || {};
  $('cargando').hidden = true; $('toast').hidden = true;
  $('app').innerHTML = marca() +
    '<main class="fin" style="padding-top:34px"><div class="okc' + (o.bueno ? '' : ' am') + '">' + ic(o.bueno ? 'check' : 'alerta') + '</div>' +
    '<h2 tabindex="-1">' + esc(titulo) + '</h2><p class="sub">' + (o.html ? texto : esc(texto)) + '</p>' +
    (o.reintentar ? '<button class="btn" style="margin-top:20px" data-a="reintentar">Intentar de nuevo</button>' : '') +
    '<div class="acc" style="margin-top:22px"><a class="btn sec" href="' + TEL_LINK + '" aria-label="Llamar al ' + TEL + '">' + ic('telefono') + 'Llamar</a>' +
      '<a class="btn sec" href="' + WA_LINK + '" target="_blank" rel="noopener">' + ic('whatsapp') + 'WhatsApp</a></div>' +
    '<div class="pie" style="margin-top:20px">ECOVSA · Tel. ' + TEL + ' · ' + CORREO + '</div></main>';
  var h = document.querySelector('.fin h2'); if (h) h.focus({ preventScroll: true });
}

var tt = null;
function toast(t){ var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(function () { el.hidden = true; }, 3200); }
</script>
</body>
</html>
