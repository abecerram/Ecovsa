<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes · Mercadeo · ECOVSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script>window.PUENTE_CONFIG={sinCopia:/./,indicador:'oculto',enSupabase:/^api_(?!optimizarRuta$)/,
  escritura:/^api_(crm(Guardar|Completar|Anular|Captura|Mover|Reasignar|Borrar|Subir|Usar)|guardar|marcar|abrir|cerrar|registrar|borrar|eliminar|crear|actualizar|enviar|corregir|dar|anular|confirmar|aprobar|rechazar|subir|asignar|mover|cambiar|agregar|nuevo|editar|reabrir|emitir|pasar|pedir)/i};</script>

<style>
/* ── Reportes · opción B «Catálogo de reportes» ── */
.sysbar .srch{min-width:0}  /* la barra del kit se desborda a 390 px sin esto */
.cat{display:grid;grid-template-columns:268px minmax(0,1fr);gap:16px;align-items:start}
.lista{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto}
.lista .g{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--muted2);padding:10px 10px 4px}
.lista a{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:9px;color:var(--ink);cursor:pointer}
.lista a svg{margin-top:1px;color:#46546b}
.lista a:hover{background:var(--hover)}
.lista a.on{background:#eaf0fa}
.lista a.on svg{color:var(--navy2)}
.lista a b{display:block;font-weight:600;font-size:13px}
.lista a small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.lista .bus{margin:4px 4px 6px;width:calc(100% - 8px)}
.lista .nada{padding:6px 10px 8px;font-size:12px;color:var(--muted)}
.selm{display:none;margin-bottom:12px}
.rep{min-width:0}
.rep .cab{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rep .cab .tt{flex:1;min-width:200px}
.rep .cab .gr{font-size:12px;color:var(--muted);font-weight:600}
.rep .cab h2{font-size:19px;font-weight:700;line-height:1.25}
.rep .como{background:var(--hover);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#43516a;margin:12px 0}
.rep .como b{color:var(--ink)}
.rep .como .fx{display:block;margin-top:6px;font-weight:600;color:var(--navy2)}
.ctr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctr .lab{font-size:13px;color:var(--muted)}
.ctr .lab b{color:var(--ink);font-weight:600}
.nav{display:inline-flex;align-items:center;gap:2px}
.nav .btn{padding:5px 8px}
.rango{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.rango .in{width:auto;padding:5px 8px}
.mini{display:grid;gap:10px;margin-bottom:14px}
.mini .m{border:1px solid var(--line2);border-radius:10px;padding:8px 11px;min-width:0}
.mini .m span{display:block;font-size:11.5px;color:var(--muted)}
.mini .m b{display:block;font-size:19px;font-weight:700;letter-spacing:-.2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .m em{font-style:normal;font-size:11.5px;font-weight:700}
.mini .m em.igual{color:var(--muted);font-weight:600}
.ley{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ley i.ln{height:0;border-top:2px dashed #7d8aa0;border-radius:0;width:14px;vertical-align:3px}
.ch{width:100%;min-height:20px}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch text{font-family:Archivo,system-ui,sans-serif}
.ch .hit{fill:transparent}
.ch g.b:hover .bar{opacity:.82}
.tctr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 8px}
.tctr h4{font-size:12px;letter-spacing:.9px;color:#5b6a80;font-weight:700;text-transform:uppercase;margin-right:auto}
.tctr .in,.tctr .sel{width:auto;padding:5px 9px;font-size:12.5px}
.tctr .in{min-width:170px}
.tb td .mb{display:inline-block;height:6px;border-radius:3px;background:var(--navy2);vertical-align:middle;margin-right:6px}
.tb tr.tot td{font-weight:700;background:#fafbfd}
.tb td.num,.tb td.r,.tb td.nw{white-space:nowrap}
.tb tr.ex{cursor:pointer}
.tb tr.ex td:first-child{white-space:nowrap}
.tb tr.ex .fl{display:inline-block;width:12px;color:var(--muted);transition:transform .15s}
.tb tr.ex.abierto .fl{transform:rotate(90deg)}
.tb tr.sub td{background:#fbfcfe;padding:0}
.tb tr.sub .lst{padding:4px 14px 6px 34px}
.tb tr.sub .it{padding:7px 0;font-size:12.5px;gap:10px;flex-wrap:wrap}
.tb th.ord{user-select:none}
.tb th .fl{font-size:10px;margin-left:3px}
.tb td.t{max-width:300px;min-width:180px}
.tb td.t div{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tb a.lk{font-weight:600;color:var(--navy2)}
.tb a.lk:hover{text-decoration:underline}
.pieT{font-size:12px;color:var(--muted);margin-top:8px}
.guard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px;background:#fafbfd;font-size:12.5px;flex-wrap:wrap}
.guard svg{color:var(--amber)}
.guard b{font-weight:700}
.solo-imp{display:none}
@media(max-width:1180px){.mini{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media(max-width:900px){.cat{grid-template-columns:minmax(0,1fr)}.lista{display:none}.selm{display:block}}
@media(max-width:600px){
  .mini{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .rep.card{padding:14px 12px}
  .rep .cab h2{font-size:17px}
  .hide-m{display:none}
  .tctr h4{flex-basis:100%}
  .tctr .in{min-width:0;flex:1 1 100%}
  .tctr .sel{flex:1 1 40%;min-width:0}
  .tb td,.tb th{padding:8px 9px}
}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body.mk{background:#fff;font-size:12px}
  .lista,.selm,.no-imp,.toast,#hoja,.ph{display:none!important}
  .cat{display:block}
  .rep.card{border:0;padding:0}
  .solo-imp{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:12px}
  .solo-imp b{font-size:15px;letter-spacing:2px;color:var(--navy)}
  .solo-imp span{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}
  .rep .como{background:#fff}
  .tbw{overflow:visible;border:1px solid var(--line)}
  .tb tbody tr:hover td{background:none}
  .tb tr{page-break-inside:avoid}
  .ch{page-break-inside:avoid}
  a{color:var(--ink)}
}
/* gerencia solo consulta: no guarda reportes (el servidor no se lo permite) */
body.solo-ver #rGuardar,body.solo-ver #rAct,body.solo-ver #rQuitar{display:none!important}
</style>
</head>

<script>
(function () {
  'use strict';

  /* ═══ Catálogo de reportes ═══ */
  var CAT = [
    { g: 'VENTAS' },
    { id: 'resumen', n: 'Resumen del periodo', d: 'Cifras clave y su comparación', i: 'grafico' },
    { id: 'conversion', n: 'Conversión y ciclo', d: 'Ganadas ÷ cerradas y días a firma', i: 'tendencia', usa: ['ops'] },
    { id: 'embudo', n: 'Embudo', d: 'Lo abierto hoy, por etapa', i: 'embudo', sinPer: true, usa: ['ops'] },
    { id: 'pronostico', n: 'Pronóstico de cierre', d: 'Lo que se espera firmar por mes', i: 'calendario', sinPer: true, usa: ['ops'] },
    { id: 'ganadas', n: 'Ganadas', d: 'Lo firmado en el periodo', i: 'check' },
    { g: 'ORIGEN' },
    { id: 'fuente', n: 'Por fuente', d: 'De dónde vienen las oportunidades', i: 'flecha', usa: ['ops'] },
    { id: 'sector', n: 'Por sector', d: 'Privado, gobierno, minera…', i: 'edificio', usa: ['ops'] },
    { id: 'servicio', n: 'Por tipo de servicio', d: 'Recurrente o visita única', i: 'renovar', usa: ['ops'] },
    { g: 'EQUIPO' },
    { id: 'asesor', n: 'Por asesor', d: 'Resultados de cada asesor', i: 'personas', usa: ['ops'] },
    { id: 'actividades', n: 'Actividades', d: 'Llamadas, visitas, WhatsApp…', i: 'telefono', usa: ['act'] },
    { g: 'CARTERA' },
    { id: 'salud', n: 'Salud de la cartera', d: 'Sanos, atención, riesgo', i: 'sello', sinPer: true, usa: ['cli'] },
    { id: 'riesgo', n: 'Clientes en riesgo', d: 'A quién atender primero', i: 'alerta', sinPer: true },
    { id: 'crecer', n: 'Para crecer', d: 'El plan les queda chico', i: 'tendencia', sinPer: true },
    { id: 'renovaciones', n: 'Renovaciones', d: 'Contratos que vencen pronto', i: 'renovar', sinPer: true },
    { g: 'PÉRDIDAS' },
    { id: 'perdidas', n: 'Motivos y lista', d: 'Por qué se pierde', i: 'x' }
  ];
  function catDe(id) { for (var i = 0; i < CAT.length; i++) if (CAT[i].id === id) return CAT[i]; return null; }

  /* ═══ Estado ═══ */
  var ST = { rep: 'resumen', per: { tipo: 'mes', desp: 0, desde: '', hasta: '' }, filtros: {}, guardado: '' };
  var D = null, DP = null, RKEY = '', PKEY = '', CARGANDO = false, ERR = '';
  var OPS = null, CLI = null, ACT = {};       // datos de apoyo (se piden solo cuando un reporte los usa)
  var ABIERTOS = {};                          // filas de grupo desplegadas
  var TABLA = null;                           // la tabla que se ve (para exportar)
  var CHART = null;                           // función del gráfico visible
  var LIMITE = 50, VERTODAS = {}, TODAS = false; // filas visibles (al imprimir salen todas)

  /* ═══ Periodos ═══ */
  function p2(n) { return ('0' + n).slice(-2); }
  function ymd(y, m, d) { var x = new Date(Date.UTC(y, m - 1, d)); return x.getUTCFullYear() + '-' + p2(x.getUTCMonth() + 1) + '-' + p2(x.getUTCDate()); }
  function finMes(y, m) { return ymd(y, m + 1, 0); }
  function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
  function rangoDe(per) {
    var hoy = MK.hoy, y = +hoy.slice(0, 4), m = +hoy.slice(5, 7), r = {};
    var dsp = per.desp || 0;
    if (per.tipo === 'mes') {
      var a = ymd(y, m + dsp, 1); r.desde = a; r.hasta = finMes(+a.slice(0, 4), +a.slice(5, 7));
      r.lab = cap(MK.mesNombre(a.slice(0, 7)));
      var ap = ymd(y, m + dsp - 1, 1); r.prev = { desde: ap, hasta: finMes(+ap.slice(0, 4), +ap.slice(5, 7)), lab: MK.mesNombre(ap.slice(0, 7)) };
    } else if (per.tipo === 'trimestre') {
      var q0 = Math.floor((m - 1) / 3) * 3 + 1 + dsp * 3, b = ymd(y, q0, 1), by = +b.slice(0, 4), bm = +b.slice(5, 7);
      r.desde = b; r.hasta = finMes(by, bm + 2);
      r.lab = cap(MK.MESES[bm - 1]) + ' – ' + MK.MESES[(bm + 1) % 12] + ' ' + by + ' (T' + ((bm + 2) / 3) + ')';
      var c = ymd(y, q0 - 3, 1); r.prev = { desde: c, hasta: finMes(+c.slice(0, 4), +c.slice(5, 7) + 2), lab: 'el trimestre anterior' };
    } else if (per.tipo === 'anio') {
      var yy = y + dsp; r.desde = yy + '-01-01'; r.hasta = yy + '-12-31'; r.lab = 'Año ' + yy;

    } else {
      var d1 = per.desde || MK.masDias(hoy, -29), d2 = per.hasta || hoy; if (d2 < d1) { var t = d1; d1 = d2; d2 = t; }
      r.desde = d1; r.hasta = d2; r.lab = MK.fechaCorta(d1) + ' – ' + MK.fechaCorta(d2) + (d2.slice(0, 4) === hoy.slice(0, 4) && d1.slice(0, 4) === d2.slice(0, 4) ? ' ' + d2.slice(0, 4) : '');
      var n = MK.dias(d1, d2) + 1; r.prev = { desde: MK.masDias(d1, -n), hasta: MK.masDias(d1, -1), lab: 'los ' + n + ' días anteriores' };
    }
    r.enCurso = hoy >= r.desde && hoy <= r.hasta;
    if (r.enCurso && r.hasta > hoy) r.lab += ' · al ' + MK.fechaCorta(hoy);

  }
  function descPer(per) {
    if (per.tipo === 'rango') return 'Del ' + MK.fechaCorta(per.desde) + ' al ' + MK.fechaCorta(per.hasta);

  }

  /* ═══ Formatos ═══ */
  function pc(x) { return x == null || x === '' ? '—' : Math.round(x) + ' %'; }
  function din(v) { return MK.dinero(v); }
  function din0(v) { return 'B/. ' + Math.round(Number(v) || 0).toLocaleString('en-US'); }
  function kf(n) { n = Math.round(n); var a = Math.abs(n); return a >= 10000 ? Math.round(n / 1000) + ' mil' : a >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + ' mil' : String(n); }
  function mesC(ym) { if (!/^\d{4}-\d{2}/.test(ym || '')) return ym === 'sin fecha' ? 'Sin fecha' : (ym || ''); return MK.MESES[+ym.slice(5, 7) - 1] + (ym.slice(0, 4) !== MK.hoy.slice(0, 4) ? ' ' + ym.slice(2, 4) : ''); }
  function mesL(ym) { return ym === 'sin fecha' ? 'Sin fecha' : cap(MK.mesNombre(ym)); }
  function pl(n, s) { return n + ' ' + s + (n === 1 ? '' : 's'); }
  function sum(l, f) { return l.reduce(function (s, x) { return s + (Number(typeof f === 'function' ? f(x) : x[f]) || 0); }, 0); }
  function lkOp(cod, t) { return '<a class="lk" href="MerOportunidad.html?id=' + encodeURIComponent(cod) + '">' + MK.esc(t || cod) + '</a>'; }
  function lkCli(id, t) { return '<a class="lk" href="MerCliente.html?id=' + encodeURIComponent(id) + '">' + MK.esc(t || id) + '</a>'; }
  function delta(v, ref, fmt, menosMejor) {
    if (ref == null || v == null || !DP) return '';
    var d = v - ref; if (Math.abs(d) < 1e-9) return '<em class="igual">= igual</em>';
    var bueno = menosMejor ? d < 0 : d > 0;
    return '<em class="' + (bueno ? 'up' : 'down') + '">' + (d > 0 ? '▲ +' : '▼ −') + (fmt ? fmt(Math.abs(d)) : Math.abs(d)) + '</em>';
  }
  var NIVEL = { sano: ['Sano', 't-ok'], atencion: ['Atención', 't-warn'], riesgo: ['Riesgo', 't-bad'], crecer: ['Para crecer', 't-info'] };

  /* La misma regla del servidor para saber qué oportunidades caen en el periodo */
  function creada(p) { return String(p['fecha contacto'] || '').slice(0, 10) || String(p.registradoEn || '').slice(0, 10) || ''; }
  function cierre(p) { return String(p['fecha cierre'] || (p.ganada ? (p['fecha contrato'] || p['fecha etapa']) : p.perdida ? p['fecha etapa'] : '') || '').slice(0, 10); }
  function enP(f) { return f && f >= D.desde && f <= D.hasta; }
  function txt(v) { return String(v == null ? '' : v).trim(); }

  /* ═══ Gráficos SVG ═══ */
  var NAVY = '#14306b', CLARO = '#8fa3c7', GRIS = '#c3cddd', REJ = '#eef1f5', TXT = '#667489', INK = '#0f2140', BANDA = '#f1f4f9';
  function r1(v) { return Math.round(v * 10) / 10; }
  function tx(x, y, s, o) { o = o || {}; return '<text x="' + r1(x) + '" y="' + r1(y) + '" font-size="' + (o.fs || 11) + '" fill="' + (o.c || TXT) + '"' + (o.a ? ' text-anchor="' + o.a + '"' : '') + (o.w ? ' font-weight="' + o.w + '"' : '') + '>' + MK.esc(s) + '</text>'; }
  function escala(max) {
    if (!(max > 0)) return [1, [0, 1]];
    var p = Math.pow(10, Math.floor(Math.log10(max))), paso = [1, 2, 2.5, 5, 10].map(function (m) { return m * p; }).filter(function (s) { return max / s <= 4; })[0] || p * 10;
    if (max <= 4 && paso < 1) paso = 1;
    var top = Math.ceil(max / paso) * paso, t = []; for (var v = 0; v <= top + 1e-9; v += paso) t.push(Math.round(v * 1000) / 1000); return [top, t];
  }

  function svgA(W, H, aria) { return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + MK.esc(aria || '') + '" preserveAspectRatio="xMinYMin meet">'; }
  /* barras verticales agrupadas (+ línea de meta opcional) */
  function barrasV(W, o) {
    var H = o.H || (W < 480 ? 190 : 230), L = o.L || 44, B = 24, T = 20, cats = o.cats, ser = o.series, n = cats.length, iw = W - L - 6, ih = H - B - T;
    var mx = 0; ser.forEach(function (s) { s.v.forEach(function (v) { mx = Math.max(mx, v || 0); }); }); if (o.linea) o.linea.v.forEach(function (v) { mx = Math.max(mx, v || 0); });
    var e = escala(mx), top = e[0], cw = iw / Math.max(1, n);
    var g = svgA(W, H, o.aria);
    (o.band || []).forEach(function (i) { g += '<rect x="' + r1(L + i * cw) + '" y="' + T + '" width="' + r1(cw) + '" height="' + ih + '" fill="' + BANDA + '"/>'; });
    e[1].forEach(function (v) { var y = T + ih - v / top * ih; g += '<line x1="' + L + '" x2="' + (W - 6) + '" y1="' + r1(y) + '" y2="' + r1(y) + '" stroke="' + REJ + '"/>' + tx(L - 6, y + 4, o.fy ? o.fy(v) : v, { a: 'end', fs: 10.5 }); });
    var gap = 3, bw = Math.max(3, Math.min(o.bwMax || 28, (cw * .68 - gap * (ser.length - 1)) / ser.length)), cada = Math.ceil(n / Math.max(1, Math.floor(iw / 44)));
    cats.forEach(function (c, i) {
      var x0 = L + i * cw + (cw - (bw * ser.length + gap * (ser.length - 1))) / 2, tope = T + ih;
      var tit = (o.tipT ? o.tipT(i) : c) + '\n' + ser.map(function (s) { return s.n + ': ' + (o.fv ? o.fv(s.v[i] || 0) : (s.v[i] || 0)); }).join('\n') + (o.linea ? '\n' + o.linea.n + ': ' + (o.fv ? o.fv(o.linea.v[i] || 0) : o.linea.v[i]) : '');
      g += '<g class="b"><title>' + MK.esc(tit) + '</title><rect class="hit" x="' + r1(L + i * cw) + '" y="' + T + '" width="' + r1(cw) + '" height="' + ih + '"/>';
      ser.forEach(function (s, j) {
        var v = s.v[i] || 0, h = v / top * ih;
        if (s.contorno) g += h > 0 ? '<rect x="' + r1(x0 + j * (bw + gap)) + '" y="' + r1(T + ih - h) + '" width="' + r1(bw) + '" height="' + r1(h) + '" rx="3" fill="#fff" stroke="' + s.c + '" stroke-width="1.5" stroke-dasharray="4 3"/>' : '';
        else g += rectR(x0 + j * (bw + gap), T + ih - h, bw, h, s.c);
        tope = Math.min(tope, T + ih - h);
      });
      g += '</g>';
      if (o.etq) { var et = o.etq(i); if (et) g += tx(L + i * cw + cw / 2, tope - 6, et, { a: 'middle', fs: 11, c: INK, w: 700 }); }
      if (i % cada === 0) g += tx(L + i * cw + cw / 2, H - 7, c, { a: 'middle', fs: 10.5, c: (o.band || []).indexOf(i) >= 0 ? INK : TXT });
    });

    var csv = '﻿' + L.map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); return /[",;\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    try {
      var a = document.createElement('a'), url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.href = url; a.download = 'ECOVSA-reporte-' + ST.rep + (c.sinPer ? '-' + MK.hoy : '-' + rg.desde + '_' + rg.hasta) + '.csv';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      MK.aviso('Se descargó el CSV (' + l.length + ' filas). Ábrelo con Excel.');
    } catch (e) { MK.aviso('No se pudo descargar: ' + e.message); }
  }

  /* ═══ Arranque ═══ */
  MK.iniciar('reportes', function (base) {
    if (base && base.usuario && base.usuario.rol === 'gerente') document.body.classList.add('solo-ver');
    document.getElementById('main').innerHTML =
      '<div class="ph"><div><h1>Reportes</h1><p>Conversión, ciclo de venta, pronóstico, pérdidas, origen de los clientes y la cartera. Datos al ' + MK.esc(MK.fechaLarga(MK.hoy)) + '.</p></div></div>' +
      '<select class="sel selm" id="rSelm" aria-label="Reporte"></select>' +
      '<div class="cat"><nav class="lista" id="rLista" aria-label="Catálogo de reportes"></nav><section class="card rep" id="rRep"></section></div>';
    var h = decodeURIComponent((location.hash || '').slice(1));
    var gi = h.indexOf('g=') === 0 ? h.slice(2) : '';
    if (!gi && catDe(h)) ST.rep = h;
    pintar(); cargar();
    if (gi) { var t = setInterval(function () { if (D) { clearInterval(t); abrirGuardado(gi); } }, 120); setTimeout(function () { clearInterval(t); }, 15000); }
  });
  window.addEventListener('mk:cambio', function () { RKEY = ''; OPS = null; CLI = null; ACT = {}; cargar(); });
})();
