MQIFRp43XZJIMLVbFMtjDCTkHEpoYy7MaUKKBKrrL/4WxVBC5AAHQb/D5XBfOzO3brtAAAAAElFTkSuQmCC"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"><style>
:root{
  --navy:#0f2a57; --marca:#14306b; --acento:#F5B301; --tinta:#0f2140; --gris:#667489;
  --fondo:#f3f5f8; --tarjeta:#fff; --linea:#e1e6ee; --suave:#f6f8fb; --azulclaro:#e8effb;
  --ok:#2f9e44; --ok-bg:#eaf6e4; --warn:#a87400; --warn-bg:#fff4d6; --bad:#d64045; --bad-bg:#fdecea; --info:#3b6fd4; --info-bg:#e8effb;
  --verde-b:#00792F;
  --letra:Archivo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --radio:14px; --radio-b:9px; color-scheme:light;
  --sa:env(safe-area-inset-top,0px); --barra:74px;
}
@media (max-width:820px){:root{--barra:62px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font:15px/1.5 var(--letra);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* barra con la insignia (opción C) */
.barra{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(8px + var(--sa)) 16px 8px;height:calc(var(--barra) + var(--sa));position:sticky;top:0;z-index:30}
.barra img.l{height:19px;display:block}
.barra .sep{width:1px;height:26px;background:rgba(255,255,255,.22)}
.barra .mod{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.barra .sp{flex:1}
.barra .usr{display:flex;gap:9px;align-items:center;font-size:13px}
.barra .av{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.barra .salir{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.em-c{border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.em-c img{width:78%;display:block}
.barra .ins{position:absolute;left:34px;top:calc(12px + var(--sa));width:84px;height:84px;box-shadow:0 0 0 4px var(--navy),0 10px 22px rgba(15,33,64,.25)}
.barra .hueco{width:104px;flex:none}
.barra .pc{display:contents}.barra .cel{display:none}
.cuerpo{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - var(--barra))}
.menu{background:#fff;border-right:1px solid var(--linea);padding:34px 10px 14px}
.menu .mi{position:sticky;top:calc(var(--barra) + var(--sa) + 10px)}
.menu h6{margin:12px 10px 6px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris)}
.menu button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--tinta);font-size:14px;font-weight:600}
.menu button svg{color:#8592a6;flex:none}
.menu button:hover{background:var(--suave)}
.menu button[aria-current="page"]{background:var(--azulclaro);color:var(--marca)}
.menu button[aria-current="page"] svg{color:var(--marca)}
.menu button[disabled]{opacity:.45;cursor:not-allowed}
.nb{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
.tabs{display:none}
.main{padding:22px 26px 40px;min-width:0;max-width:1100px}
.main h1{font-size:22px;margin:0 0 2px;color:var(--marca);text-wrap:balance}
.main .bajada{color:var(--gris);margin:0 0 16px}
@media (max-width:820px){
  .barra .pc{display:none}.barra .cel{display:flex}
  .barra .ins{left:50%;transform:translateX(-50%);top:calc(14px + var(--sa));width:64px;height:64px}
  .cuerpo{grid-template-columns:minmax(0,1fr)}
  .menu{display:none}
  /* pestañas de ancho fijo, solo la raya de abajo (opción B) */
  .tabs{display:flex;position:sticky;top:calc(var(--barra) + var(--sa));z-index:25;background:#fff;border-bottom:1px solid var(--linea);overflow-x:auto;scrollbar-width:none;padding-top:16px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 96px;background:none;border:0;padding:12px 4px 10px;font-size:13.5px;font-weight:600;color:#6b778b;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;position:relative}
  .tabs button[aria-current="page"]{color:var(--marca);border-bottom-color:var(--marca)}
  .tabs button[disabled]{opacity:.45}
  .tabs .nb{position:absolute;top:6px;right:8px;margin:0}
  .main{padding:16px 14px 28px}
}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-ini{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-ini{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.g2{grid-template-columns:minmax(0,1fr)}.kpi b{font-size:21px!important}}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:16px 18px;min-width:0}
.card>h3{margin:0 0 10px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);display:flex;gap:8px;align-items:center}
.card>h3 .sp{flex:1}

.pista{background:var(--suave);border:1px dashed #cfd7e3;border-radius:10px;padding:9px 12px;color:var(--gris);font-size:13px}
.campo{display:grid;gap:5px;margin-bottom:12px}.campo label,.campo .lb{font-size:12.5px;font-weight:700;color:var(--gris)}
.campo input,.campo select,.campo textarea{border:1px solid #cdd5e1;border-radius:var(--radio-b);padding:9px 11px;background:#fff;width:100%}
.ent{max-width:420px;margin:0 auto;padding:34px 16px}

.cg-a{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 24px;text-align:center}

.dv-b{position:relative;flex:1}.dv-b iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.dv-b .cg-a{position:absolute;inset:0;min-height:0}

.ent h2{margin:12px 0 4px;color:var(--marca);font-size:20px}

/* Extensiones de presentación; los estilos y recursos de marca provienen de Portal.html. */

/* 3.18.2 · la entrada: la cortina azul con el emblema que se arma, las letras ECOVSA y «Mi portal»
   (la misma de los módulos del equipo). Dura al menos ENTRADA_MIN para que se vea completa;
   si los datos tardan más, las flechas siguen girando hasta que lleguen. */
var ENTRADA_MIN=3600, ENTRADA_T=0;
function entrada(){
  if(window.ECOCARGA&&ECOCARGA.cortina){ ENTRADA_T=Date.now(); ECOCARGA.cortina({modulo:'Mi portal',mensaje:'Trayendo su información…'}); if(instalada()) despierta(); }
  else espera('Trayendo su información…');

/* 3.18.3 · en la app instalada el teléfono muestra primero el emblema quieto (eso no se puede animar).
   La cortina arranca con el emblema del MISMO tamaño y en el MISMO lugar, da una vuelta (cobra vida),
   se achica a su puesto y aparecen las letras: se ve como una sola animación. */
function despierta(){
  var c=document.getElementById('eco-cortina'), l=c&&c.querySelector('.eco-lg'); if(!l) return;
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  ENTRADA_MIN=4600; window.__desp=performance.now();
  document.documentElement.classList.add('eco-desp');
  var gr=Math.round(Math.min(innerWidth*0.5,innerHeight*0.32,300));
  l.classList.remove('arma'); l.classList.add('quieto');
  l.style.width=l.style.height=gr+'px';
  var r=l.getBoundingClientRect(), dy=Math.round(innerHeight/2-(r.top+r.height/2));
  l.style.transform='translateY('+dy+'px)'; l.style.boxShadow='none';
  void l.offsetWidth; l.classList.remove('quieto');
  setTimeout(function(){ if(l.isConnected){ l.classList.add('vuelta'); } },250);
  setTimeout(function(){ if(l.isConnected){ l.classList.remove('vuelta'); void l.offsetWidth; l.classList.add('vuelta'); } },1150);
  setTimeout(function(){ if(l.isConnected){ l.classList.remove('vuelta'); l.style.width=l.style.height=''; l.style.transform=''; l.style.boxShadow=''; } },2050);
  setTimeout(function(){ if(l.isConnected){ l.classList.add('gira'); } },2700);
}

/* un solo oyente para el menú, las pestañas y los botones «Ver todas» */
document.addEventListener('click',function(e){ var b=e.target.closest('#app [data-v]'); if(!b||b.disabled) return; ir(b.getAttribute('data-v')); });
function avisoCuenta(){
  var c=S.cuenta, n=nivel();
  var ayuda=S.ayuda?'':'<button class="btn sm" onclick="ayudaPago()">Necesito ayuda con mi pago</button>';
  if(c.estado==='suspendida') return '<div class="aviso bad"><div class="tx"><b>Su servicio está en pausa.</b> '+(n==='sede'?'La corporación maneja el pago de la cuenta. ':'Para reactivarlo, regularice las facturas pendientes. ')+'Escríbanos al WhatsApp 6264-1647.'+(n!=='sede'?'<div class="acc"><button class="btn sm pri" onclick="comprobante()">Subir comprobante</button>'+ayuda+'</div>':'')+'</div></div>';
  if(c.estado==='atraso'&&n!=='sede'&&V!=='facturas') return '<div class="aviso warn"><div class="tx"><b>Tiene '+(c.vencidas.length||'')+' factura'+(c.vencidas.length===1?'':'s')+' vencida'+(c.vencidas.length===1?'':'s')+'</b>'+(c.vencidas.length?' ('+c.vencidas.map(function(v){ return 'N.º '+esc(nFac(v.factura))+' · '+B(v.saldo); }).join(', ')+')':'')+'. Los certificados de los periodos sin pagar se liberan al confirmar el pago.'+
    '<div class="acc"><button class="btn sm pri" onclick="comprobante()">Subir comprobante</button>'+ayuda+'</div></div></div>';
  return '';
}
function legal(){ var e=S.empresa||{}; return esc(e.razonSocial||'')+' · '+esc(e.comercial||'ECOVSA')+' · RUC '+esc(e.ruc||'')+(e.dv?' DV '+esc(e.dv):'')+'<br>'+esc(e.direccion||'')+'<br>'+esc(e.resolucion||'')+'<br>Tel. 310-2268 · WhatsApp 6264-1647 · info@ecovsa.com'; }
function titulo(t,s){ return '<h1>'+t+'</h1>'+(s?'<p class="bajada">'+s+'</p>':''); }
function ir(v){ V=v; pintar(); window.scrollTo(0,0); }

/* ── Inicio ── */
function vInicio(){
  var n=nivel(), sedes=S.sedes, rec=S.recibos, mes=S.hoy.slice(0,7);
  var visMes=rec.filter(function(r){ return r.fecha.slice(0,7)===mes; }).length, kg90=sedes.reduce(function(s,x){ return s+x.kg90; },0), ult=rec[0];
  var h=titulo((n==='corp'?'Resumen de ':'Hola, ')+esc(n==='corp'?S.yo.razonSocial:String(S.yo.nombre).split(' ')[0]), n==='corp'?sedes.length+' sedes con servicio de ECOVSA':esc((sedes[0]||{}).nombre)+(sedes[0]&&sedes[0].frecuencia?' · frecuencia '+esc(sedes[0].frecuencia).toLowerCase():''));
  if(S.cuenta.estado==='suspendida'&&n!=='sede') return h+'<div class="card"><h3>Facturas pendientes</h3><div class="kpi"><b>'+B(S.cuenta.saldo)+'</b><span>saldo de la cuenta</span></div><div style="margin-top:12px"><button class="btn pri" data-v="facturas">Ver facturas y pagos</button></div></div>';
  h+=avisoLleno();
  h+='<div class="grid g4">'+[[visMes,'visitas este mes'],[kg(kg90)+' kg','recolectados en 90 días'],[ult?f(ult.fecha):'—','última visita'+(ult&&n==='corp'?' · '+ult.sede:'')],[n==='sede'?S.certificados.length:B(S.cuenta.saldo),n==='sede'?'certificados':'saldo de la cuenta']].map(function(k){ return '<div class="card kpi"><b>'+esc(k[0])+'</b><span>'+esc(k[1])+'</span></div>'; }).join('')+'</div>';
  h+='<div class="grid g-ini" style="margin-top:14px"><div class="card"><h3>Últimas visitas<span class="sp"></span><button class="btn sm" data-v="recibos">Ver todas</button></h3>'+(rec.length?rec.slice(0,esCel()?3:5).map(filaRec).join(''):'<p style="color:var(--gris)">Todavía no hay visitas registradas.</p>')+'</div>'+
    '<div class="card"><h3>Su certificado de servicio</h3>'+certServicio()+'</div></div>';
  h+='<div style="margin-top:14px">'+susServicios()+'</div>';
  return h;
}
function filaRec(r){ var d=new Date(r.fecha+'T12:00:00'); return '<div class="fila"><div class="fecha"><b>'+d.getDate()+'</b><span>'+MES[d.getMonth()]+'</span></div><div class="tx"><b>Recibo '+esc(r.recibo||'s/n')+'</b><small>'+(nivel()==='corp'?esc(r.sede)+' · ':'')+kg(r.kg)+' kg'+(r.bolsas?' · '+r.bolsas+' bolsas':'')+'</small></div>'+(r.recibo?'<a class="btn sm" href="'+esc(doc(r.url))+'" target="_blank" rel="noopener">Ver</a>':'')+'</div>'; }

/* ── certificado de servicio en miniatura (opción A) ── */
function certServicio(){
  if(!S.servicio.length) return '<p style="color:var(--gris);margin:0">Su certificado de servicio llega con la entrega del distintivo. Si lo necesita antes, pídalo en «Servicios y productos».</p>';
  return S.servicio.map(certMini).join('');
}
function certMini(c){
  var sede=S.sedes.find(function(x){ return x.nombre===c.establecimiento; })||S.sedes[0]||{};
  var vence=new Date(c.vence+'T12:00:00'), hoy=new Date(S.hoy+'T12:00:00'), res=Math.max(0,Math.round((vence-hoy)/864e5));
  var ini=sede.inicio&&sede.inicio<S.hoy?new Date(sede.inicio+'T12:00:00'):new Date(vence-365*864e5), tot=Math.max(1,Math.round((vence-ini)/864e5)), prog=Math.min(100,Math.max(0,Math.round((tot-res)/tot*100)));
  var nv=nivel(), sedeV=nv==='sede'&&c.tipo==='cuenta';   // api 3.22: la sucursal ve su propio nombre
  var es=sedeV?((S.sedes[0]||{}).nombre||c.establecimiento):(c.tipo==='cuenta'?(S.yo.razonSocial||c.establecimiento):c.establecimiento);
  return '<div class="cm-a"><div class="fr"><i style="width:50%;background:#0C5395"></i><i style="width:28%;background:#00782E"></i><i style="width:22%;background:#86B62C"></i></div>'+
    '<div class="top">'+emC(38)+'<div class="t"><small>CERTIFICADO DE SERVICIO</small><b>N.° '+esc(c.numero||c.folio)+'</b></div><span class="vig">VIGENTE</span></div>'+
    '<div class="bd"><div class="es">'+esc(es)+'</div><div class="sv">'+(sedeV?'Incluida en el certificado de servicio de '+esc(S.yo.razonSocial||c.establecimiento)+' · ':c.tipo==='cuenta'?'Certificado de la cuenta'+(nv==='corp'?' · cubre '+S.sedes.length+' sucursales':'')+' · ':'')+'Recolección, transporte y disposición final de desechos peligrosos · ECOTERMO DE PANAMA S.A.</div>'+
    '<div class="dat">'+(sede.inicio&&(c.tipo!=='cuenta'||sedeV)?'<div><span>Desde</span><b>'+f(sede.inicio)+'</b></div>':'')+'<div><span>Vigente hasta</span><b>'+f(c.vence)+'</b></div>'+(sede.frecuencia&&(c.tipo!=='cuenta'||sedeV)?'<div><span>Frecuencia</span><b>'+esc(cap(sede.frecuencia))+'</b></div>':'')+'</div>'+
    (nv==='corp'&&c.tipo==='cuenta'&&S.sedes.length>1?'<details class="suc"><summary>Ver las '+S.sedes.length+' sucursales que cubre</summary><ul>'+S.sedes.map(function(x){ return '<li>'+esc(x.nombre)+'</li>'; }).join('')+'</ul></details>':'')+
    '<div class="bar"><div class="l"><i style="width:'+prog+'%"></i></div><small><span>Vigente · le quedan <b style="color:var(--ok)">'+res+' días</b></span><span>hasta el '+fl(c.vence)+'</span></small></div></div>'+
    '<div class="acc"><a class="btn sm pri" href="'+esc(doc(c.url))+'" target="_blank" rel="noopener">Ver</a><a class="btn sm" href="'+esc(doc(c.url))+'" target="_blank" rel="noopener">'+ic('descarga',15)+'Descargar</a></div></div>';
}
function cap(s){ s=String(s||'').toLowerCase(); return s.charAt(0).toUpperCase()+s.slice(1); }

/* ── sus servicios con ECOVSA (opción B): peligrosos activo + sólidos disponible ── */

  var n=nivel(), s=S.sedes[0]||{}, L=s.lleno||{};
  var dd=n==='corp'?'<div><span>Sedes</span><b>'+S.sedes.length+'</b></div><div><span>Con servicio</span><b>'+S.sedes.filter(function(x){ return x.estado==='activo'; }).length+'</b></div>'
    :'<div><span>Frecuencia</span><b>'+esc(cap(s.frecuencia)||'—')+'</b></div><div><span>Próxima visita</span><b>'+proximaTxt(L)+'</b></div>';

function demoGuide(){modal('<h2>Explore la renovación de su portal</h2><p>La identidad visual procede de sus archivos originales: fuente Archivo, colores, emblema, letras ECOVSA y fotografías de productos.</p><ol class="r-guide-list"><li><b>Cliente activo:</b> próxima recolección destacada, saldo, certificado y solicitud adicional.</li><li><b>Cliente nuevo:</b> primera visita por coordinar y solicitud con fecha preferida.</li><li><b>Vehículo en camino:</b> llegada estimada y estados de seguimiento, incluida la pérdida de señal.</li><li><b>Factura pendiente:</b> pruebe seleccionar un comprobante. El archivo no se sube.</li><li><b>Cuenta corporativa y sucursal:</b> explore sus vistas originales con datos ficticios.</li><li><b>Solicitudes:</b> envíe un ejemplo, consulte el historial y simule una respuesta de ECOVSA.</li><li><b>Documentos:</b> abra o descargue ejemplos en HTML, marcados sin validez.</li></ol><p class="r-modalnotes">Esta es una demostración, no la aplicación de producción. El mapa es ilustrativo y no recibe GPS. Las solicitudes de ejemplo se conservan en este navegador cuando su configuración lo permite; los comprobantes y los accesos de equipo se reinician al cambiar de escenario o recargar. «Reiniciar» borra solo los datos de esta demostración.</p><div class="pie">'+demoAction('Explorar el portal','cerrarModal()','pri')+'</div>');}

};

demoSync=function(){S.pedidos=DEMO.requests.filter(function(p){return p.scenario===DEMO.scenario;}).map(function(p){return {...p};});S.sedes.forEach(function(s){var p=S.pedidos.find(function(p){return p.sede===s.nombre&&p.type==='recoleccion'&&!p.cerrada;});if(s.lleno)s.lleno.abierta=p?{folio:p.folio,fecha:p.fecha}:null;});};
function corpTeam(s){return S.equipo.filter(function(p){return p.sede===s.nombre&&p.estado==='activo';});}
function corpNext(s){return s.lleno&&s.lleno.proxima||'';}
function corpProgress(s){var done=Number(s.visitasMes)||0,total=Number(s.lleno&&s.lleno.tocan)||0;return {done:done,total:total,remaining:Math.max(0,total-done),percent:total?Math.min(100,Math.round(done/total*100)):0};}
function corpMonth(){return MESL[Number(S.hoy.slice(5,7))-1]+' '+S.hoy.slice(0,4);}
function corpProgressMarkup(s){var p=corpProgress(s),records=S.recibos.filter(function(r){return r.sede===s.nombre&&r.fecha.slice(0,7)===S.hoy.slice(0,7);}).sort(function(a,b){return b.fecha.localeCompare(a.fecha);});return '<section class="corp-progress"><div class="corp-progresshead"><div><span>Visitas de '+esc(corpMonth())+'</span><strong>'+p.done+' de '+(p.total||'—')+'</strong></div><span class="tag '+(!p.total?'t-gris':p.remaining?'t-warn':'t-ok')+'">'+(!p.total?'Cantidad por confirmar':p.remaining?p.remaining+' pendiente'+(p.remaining===1?'':'s'):'Visitas completadas')+'</span></div><p>Frecuencia: <b>'+esc(s.frecuencia||'Por confirmar')+'</b> · '+(p.total?p.total+' visita'+(p.total===1?'':'s')+' prevista'+(p.total===1?'':'s')+' este mes':'Visitas previstas por confirmar')+'</p>'+(p.total?'<div class="pb '+(p.remaining?'warn':'')+'" role="progressbar" aria-label="Avance de visitas de '+esc(s.nombre)+'" aria-valuemin="0" aria-valuemax="'+Math.max(p.total,p.done)+'" aria-valuenow="'+p.done+'"><i style="width:'+p.percent+'%"></i></div>':'')+'<div class="corp-monthrecords">'+(records.length?records.map(function(r){return '<div><span>'+f(r.fecha)+'</span><b>'+kg(r.kg)+' kg</b></div>';}).join(''):'Sin recolecciones registradas este mes.')+'</div></section>';}
function corpMonthSummary(){var totals=S.sedes.reduce(function(a,s){var p=corpProgress(s);a.done+=p.done;a.total+=p.total;if(p.done)a.attended++;if(p.remaining)a.pending++;return a;},{done:0,total:0,attended:0,pending:0});return '<section class="card corp-monthsummary"><h3>Avance de recolección · '+esc(corpMonth())+'</h3><div class="grid g3"><div><strong>'+totals.done+' de '+totals.total+'</strong><span>visitas realizadas / previstas</span></div><div><strong>'+totals.attended+' de '+S.sedes.length+'</strong><span>sedes con recolección este mes</span></div><div><strong>'+totals.pending+'</strong><span>sedes con visitas pendientes</span></div></div><p>Una sede atendida puede tener más visitas pendientes según su frecuencia. Las próximas fechas son estimadas; no confirman una visita programada.</p></section>';}
function corpNeeds(s){return !corpNext(s)||corpNext(s)<S.hoy||!corpTeam(s).length||!!(s.lleno&&s.lleno.abierta);}
function corpOpen(id){CORP.site=id;V='sedes';pintar();window.scrollTo(0,0);}
function corpAccess(id){CORP.accessSite=id||'';pedirPersona();}
function corpRequest(id){CORP.accessSite=id;demoRequest('Programar visita');var el=$('r-sede');if(el)el.value=id;}
function corpCard(s){var next=corpNext(s),team=corpTeam(s),notice=s.lleno&&s.lleno.abierta;return '<article class="card corp-site"><div class="corp-sitehead"><h3>'+esc(s.nombre)+'</h3><span class="tag '+(s.estado==='activo'?'t-ok':'t-warn')+'">'+(s.estado==='activo'?'Servicio activo':'En pausa')+'</span></div><p class="corp-address">'+esc(s.direccion)+'</p>'+corpProgressMarkup(s)+'<dl class="corp-details"><div><dt>Próxima visita estimada</dt><dd>'+(next?fl(next):'Primera visita por coordinar')+'<small class="corp-estimate">Según frecuencia y última visita. Pendiente de coordinación.</small></dd></div><div><dt>Encargado con acceso</dt><dd>'+ (team.length?esc(team.map(function(p){return p.nombre;}).join(', ')):'Sin encargado asignado')+'</dd></div><div><dt>Última visita</dt><dd>'+(s.ultimaVisita?f(s.ultimaVisita):'Aún sin visitas')+'</dd></div><div><dt>Recolectado en 90 días</dt><dd>'+kg(s.kg90)+' kg</dd></div></dl>'+(notice?'<p class="corp-note">Solicitud '+esc(notice.folio)+' en coordinación</p>':'')+'<div class="r-act">'+demoAction('Ver detalle',"corpOpen('"+s.clienteId+"')",'sm pri')+demoAction(team.length?'Gestionar accesos':'Asignar encargado',team.length?"ir('equipo')":"corpAccess('"+s.clienteId+"')",'sm')+'</div></article>';}
vInicio=function(){var h=corpInicioBase();if(nivel()!=='corp')return h;h=h.replace('Visitas de esta semana','Próximas visitas estimadas').replace('No hay visitas programadas esta semana.','No hay visitas estimadas para los próximos siete días.');var needs=S.sedes.filter(corpNeeds),missing=S.sedes.filter(function(s){return !corpTeam(s).length;});var block='<section class="card corp-overview"><div><div class="r-eyebrow">Administración corporativa</div><h2>Todas sus sedes, bajo control</h2><p>Supervise las recolecciones y gestione quién entra al portal de cada sucursal.</p></div><div class="r-act">'+demoAction('Ver todas las sedes',"ir('sedes')",'pri')+demoAction('Gestionar accesos',"ir('equipo')")+'</div></section>';
 block+=corpMonthSummary();block+='<section class="card corp-attention"><h3>'+ (needs.length?'Necesita su atención':'Sin pendientes por sede')+'<span class="sp"></span><span class="tag '+(needs.length?'t-warn':'t-ok')+'">'+needs.length+' sede'+(needs.length===1?'':'s')+'</span></h3>'+(needs.length?needs.map(function(s){var reason=!corpTeam(s).length?'No tiene encargado con acceso':!corpNext(s)?'Primera visita por coordinar':corpNext(s)<S.hoy?'Revisar fecha de recolección':'Recolección solicitada · En coordinación';return '<div class="fila"><div class="tx"><b>'+esc(s.nombre)+'</b><small>'+reason+'</small></div>'+demoAction(!corpTeam(s).length?'Asignar encargado':'Ver sede',!corpTeam(s).length?"corpAccess('"+s.clienteId+"')":"corpOpen('"+s.clienteId+"')",'sm')+'</div>';}).join(''):'<p class="corp-address">Todas las sedes tienen encargado y fecha de recolección disponible.</p>')+'</section>';
 var start=h.indexOf('<div class="grid g4">');return start<0?block+h:h.slice(0,start)+block+h.slice(start);
};
vSedes=function(){if(nivel()!=='corp')return corpSedesBase();if(CORP.site){var s=S.sedes.find(function(s){return s.clienteId===CORP.site;});if(s)return demoAction('‹ Volver a todas las sedes','CORP.site="";pintar()','sm')+titulo(esc(s.nombre),'Supervisión corporativa de la sucursal')+corpCard(s)+'<div class="grid g2" style="margin-top:16px"><section class="card"><h3>Recibos de esta sede</h3>'+S.recibos.filter(function(r){return r.sede===s.nombre;}).map(filaRec).join('')+'</section><section class="card"><h3>Coordinar con ECOVSA</h3><p>Solicite una visita para esta sede. ECOVSA confirmará la fecha.</p>'+demoAction('Solicitar visita',"corpRequest('"+s.clienteId+"')",'pri')+'</section></div>';}
 var list=S.sedes.filter(function(s){return s.nombre.toLowerCase().includes(CORP.query.toLowerCase())&&(CORP.filter==='todas'||CORP.filter==='atencion'&&corpNeeds(s)||CORP.filter==='sinacceso'&&!corpTeam(s).length);});
 return titulo('Sus sedes','Frecuencia, avance del mes y fechas de recolección de cada sucursal.')+corpMonthSummary()+'<div class="corp-toolbar"><label for="corp-search">Buscar sede<input id="corp-search" placeholder="Nombre de la sede" value="'+esc(CORP.query)+'"></label><label for="corp-filter">Mostrar<select id="corp-filter"><option value="todas" '+(CORP.filter==='todas'?'selected':'')+'>Todas las sedes</option><option value="atencion" '+(CORP.filter==='atencion'?'selected':'')+'>Necesitan atención</option><option value="sinacceso" '+(CORP.filter==='sinacceso'?'selected':'')+'>Sin encargado con acceso</option></select></label><span role="status">'+list.length+' de '+S.sedes.length+' sedes</span></div><div class="grid g2 corp-sites">'+(list.length?list.map(corpCard).join(''):demoEmpty('No encontramos sedes','Pruebe otro nombre o cambie el filtro.'))+'</div>';
};
vEquipo=function(){var h=corpEquipoBase();if(nivel()!=='corp')return h;var p=h.indexOf('<div style="margin-bottom:12px">');var note='<div class="card corp-accessnote"><h3>Un acceso para cada responsabilidad</h3><div class="grid g2"><div><b>Corporativo</b><p>Supervisa todas las sedes, la cuenta y los accesos del equipo.</p></div><div><b>Encargado de sucursal</b><p>Ve el portal de una sola sede, con sus visitas, documentos y solicitudes.</p></div></div><small>Se conserva el flujo de su código: Corporativo solicita los accesos y ECOVSA los aprueba.</small></div>';return p<0?h+note:h.slice(0,p)+note+h.slice(p);};
var corpPedirBase=pedirPersona;
pedirPersona=function(){corpPedirBase();var select=$('ra-site');if(select&&CORP.accessSite)select.value=CORP.accessSite;CORP.accessSite='';};
pintar=function(){corpPaintBase();var q=$('corp-search');if(q)q.oninput=function(){CORP.query=this.value;var pos=this.selectionStart;pintar();var input=$('corp-search');if(input){input.focus();input.setSelectionRange(pos,pos);}};var f=$('corp-filter');if(f)f.onchange=function(){CORP.filter=this.value;pintar();};};
/* Abrir la entrega en la pantalla revisada; el selector conserva las demás vistas. */
demoHydrate=function(){DEMO.scenario='corporativo';};

/* Calendario ilustrativo: las proyecciones no son reservas de logística. */
var CAL={site:''},calInicioBase=vInicio,calSedesBase=vSedes,calPaintBase=pintar;
function calEvents(){
 var ym=S.hoy.slice(0,7),events=[];
 S.sedes.forEach(function(s){
  var records=S.recibos.filter(function(r){return r.sede===s.nombre&&r.fecha.slice(0,7)===ym;});
  records.forEach(function(r){events.push({site:s.clienteId,name:s.nombre,date:r.fecha,status:'realizada',kg:r.kg});});
  if(s.estado!=='activo')return;
  var next=corpNext(s);if(!next)return;
  var dates=[];
  if(s.frecuencia==='Semanal'){
   var anchor=new Date(next+'T12:00:00'),start=new Date(ym+'-01T12:00:00');
   var offset=(anchor.getDay()-start.getDay()+7)%7;
   for(var day=1+offset;day<=31;day+=7){var d=new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7))-1,day,12);if(d.getMonth()!==start.getMonth())break;dates.push(ym+'-'+String(day).padStart(2,'0'));}
  }else if(s.frecuencia==='Mensual'){
   // Para la maqueta se conserva la visita del mes, si ya existe, o la próxima estimada.
   if(!records.length&&next.slice(0,7)===ym)dates.push(next);
  }
  dates.forEach(function(date){if(!records.some(function(r){return r.fecha===date;}))events.push({site:s.clienteId,name:s.nombre,date:date,status:date<S.hoy?'sinregistro':'estimada'});});
 });
 return events.sort(function(a,b){return a.date.localeCompare(b.date)||a.name.localeCompare(b.name);});
}
function calStatus(e){return e.status==='realizada'?'Realizada':e.status==='sinregistro'?'Estimada · sin registro':'Estimada';}
function calView(){
 var all=calEvents(),events=all.filter(function(e){return !CAL.site||e.site===CAL.site;}),ym=S.hoy.slice(0,7),first=new Date(ym+'-01T12:00:00'),offset=(first.getDay()+6)%7,days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),cells='';
 for(var b=0;b<offset;b++)cells+='<div class="cal-day cal-blank" aria-hidden="true"></div>';
 for(var day=1;day<=days;day++){
  var date=ym+'-'+String(day).padStart(2,'0'),items=events.filter(function(e){return e.date===date;});
  cells+='<div class="cal-day'+(date===S.hoy?' cal-today':'')+'"><div class="cal-daytop"><time datetime="'+date+'">'+day+'</time>'+(items.length?'<span>'+items.length+' visita'+(items.length===1?'':'s')+'</span>':'')+'</div>'+items.map(function(e){return '<button type="button" class="cal-event '+e.status+'" onclick="corpOpen(\''+e.site+'\')"><b>'+esc(e.name)+'</b><small>'+calStatus(e)+(e.status==='realizada'?' · '+kg(e.kg)+' kg':'')+'</small></button>';}).join('')+'</div>';
 }
 while((offset+days)%7){cells+='<div class="cal-day cal-blank" aria-hidden="true"></div>';days++;}
 var realised=events.filter(function(e){return e.status==='realizada';}).length,estimated=events.filter(function(e){return e.status==='estimada';}).length,unrecorded=events.length-realised-estimated;
 var h='<section class="card cal-section"><div class="cal-header"><div><div class="r-eyebrow">Calendario mensual de recolección</div><h2>'+esc(cap(corpMonth()))+'</h2><p>Qué sede se atiende, qué día y cuántas visitas se contemplan este mes.</p></div><label for="cal-site">Ver sede<select id="cal-site"><option value="">Todas las sedes</option>'+S.sedes.map(function(s){return '<option value="'+s.clienteId+'"'+(CAL.site===s.clienteId?' selected':'')+'>'+esc(s.nombre)+'</option>';}).join('')+'</select></label></div><div class="cal-totals"><b>'+events.length+' visita'+(events.length===1?'':'s')+' en el calendario</b><span>'+realised+' realizadas</span><span>'+estimated+' estimadas por venir</span><span>'+unrecorded+' estimadas pasadas sin registro</span></div><div class="cal-legend"><span class="realizada">● Realizada</span><span class="estimada">● Estimada</span><span class="sinregistro">● Estimada pasada sin registro</span></div><p class="cal-disclaimer">Las fechas estimadas son tentativas según la frecuencia y la última visita; no confirman programación. Una fecha pasada sin registro requiere revisión y no acredita una recolección.</p><div class="cal-scroll"><div class="cal-week">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(function(d){return '<span>'+d+'</span>';}).join('')+'</div><div class="cal-grid">'+cells+'</div></div><h3 class="cal-tabletitle">Fechas y cantidad de visitas por sede</h3><div class="cal-tablewrap"><table class="cal-table"><thead><tr><th>Sede / frecuencia</th><th>Fechas del mes</th><th>Cantidad</th></tr></thead><tbody>'+S.sedes.filter(function(s){return !CAL.site||s.clienteId===CAL.site;}).map(function(s){var rows=events.filter(function(e){return e.site===s.clienteId;});return '<tr><td><b>'+esc(s.nombre)+'</b><small>'+esc(s.frecuencia)+'</small></td><td>'+rows.map(function(e){return '<span class="cal-date '+e.status+'">'+f(e.date)+' · '+calStatus(e)+'</span>';}).join('')+'</td><td><b>'+rows.length+' visitas</b><small>'+rows.filter(function(e){return e.status==='realizada';}).length+' realizadas</small></td></tr>';}).join('')+'</tbody></table></div><p class="cal-disclaimer">Datos ilustrativos de la demostración. En el portal real, el calendario debe recibir del sistema las fechas estimadas de cada visita del mes y los registros de recolección.</p></section>';
 return h;
}
var calSeccionesBase=secciones;
secciones=function(){var sections=calSeccionesBase();if(nivel()==='corp')sections[0][1].push(['calendario','Calendario de recolecciones','Calendario','camion']);return sections;};
vInicio=function(){var h=calInicioBase();if(nivel()!=='corp')return h;var pos=h.indexOf('<section class="card corp-monthsummary">'),link='<div class="cal-shortcut">'+demoAction('Ver calendario de recolecciones',"ir('calendario')",'sm')+'<span>Consulte las fechas y la distribución de visitas del mes.</span></div>';return pos>=0?h.slice(0,pos)+link+h.slice(pos):h;};
function corpSiteList(sites){return '<div class="corp-sites corp-listwrap"><table class="corp-list"><thead><tr><th>Sede / encargado</th><th>Frecuencia</th><th>Visitas del mes</th><th>Última recolección</th><th>Próxima estimada</th><th>Acciones</th></tr></thead><tbody>'+sites.map(function(s){var p=corpProgress(s),team=corpTeam(s),next=corpNext(s);return '<tr><td><b>'+esc(s.nombre)+'</b><small>'+esc(s.direccion)+'</small><small>'+esc(team.length?team.map(function(p){return p.nombre;}).join(', '):'Sin encargado con acceso')+'</small></td><td>'+esc(s.frecuencia)+'</td><td><strong class="corp-listcount">'+p.done+' de '+(p.total||'—')+'</strong><small>'+(!p.total?'Cantidad por confirmar':p.remaining?p.remaining+' pendiente'+(p.remaining===1?'':'s'):'Completadas')+'</small>'+(p.total?'<div class="pb '+(p.remaining?'warn':'')+'"><i style="width:'+p.percent+'%"></i></div>':'')+'</td><td>'+(s.ultimaVisita?f(s.ultimaVisita):'Aún sin visitas')+'</td><td>'+(next?f(next):'Por coordinar')+'<small>Fecha tentativa</small></td><td><div class="r-act">'+demoAction('Ver detalle',"corpOpen('"+s.clienteId+"')",'sm')+(!team.length?demoAction('Asignar encargado',"corpAccess('"+s.clienteId+"')",'sm'):'')+'</div></td></tr>';}).join('')+'</tbody></table></div>';}
vSedes=function(){var h=calSedesBase();if(nivel()!=='corp'||CORP.site)return h;var sites=S.sedes.filter(function(s){return s.nombre.toLowerCase().includes(CORP.query.toLowerCase())&&(CORP.filter==='todas'||CORP.filter==='atencion'&&corpNeeds(s)||CORP.filter==='sinacceso'&&!corpTeam(s).length);});var pos=h.indexOf('<div class="grid g2 corp-sites">');return pos<0?h:h.slice(0,pos)+(sites.length?corpSiteList(sites):'<div class="corp-sites">'+demoEmpty('No encontramos sedes','Pruebe otro nombre o cambie el filtro.')+'</div>');};
pintar=function(){calPaintBase();if(V==='calendario'&&nivel()==='corp')$('main').innerHTML=avisoCuenta()+titulo('Calendario de recolecciones','Fechas y cantidad de visitas por sede durante el mes.')+calView()+'<div class="pie-p">'+legal()+'<div class="r-footer-demo">Demostración visual local · Datos de ejemplo</div></div>';var el=$('cal-site');if(el)el.onchange=function(){CAL.site=this.value;pintar();};};

demoHydrate();demoScenario(DEMO.scenario);demoPhone();
</script></body></html>
