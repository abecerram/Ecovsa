<style>
/* ── Plantillas y ajustes · opción A «Ajustes con menú lateral» ── */
.sysbar .srch{min-width:0}  /* la barra del kit se desborda a 390 px sin esto */
.aj{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.subm{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;position:sticky;top:74px}
.subm a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer}
.subm a:hover{background:var(--hover)}
.subm a.on{background:#eaf0fa;color:var(--navy2)}
.subm a small{margin-left:auto;font-size:11px;color:var(--muted2);font-weight:700}
.subm a .pt{width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:auto;flex:none}
.subm a .pt+small{margin-left:6px}
.subm .pie{border-top:1px solid var(--line2);margin-top:6px;padding:10px 8px 4px;font-size:11.5px;color:var(--muted);line-height:1.4}
.sec-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h p{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:680px}
.estado{font-size:12.5px;color:var(--muted);font-weight:600}
.estado.sucio{color:#8a5a00}
.kp2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kp2 .kpi b{font-size:19px}
.in.n{width:72px;text-align:right;padding:6px 8px}
.in.sm,.sel.sm{padding:6px 8px;font-size:13px}
.uni{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.recbox{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;min-height:16px}
.recbox .btn{padding:1px 6px;font-size:11.5px;margin-left:4px;color:var(--info);vertical-align:0}
.recbox .btn svg{width:12px;height:12px}
.difiere{border-color:#e7c872!important;background:#fffdf5!important}
.it-l{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.it-l:last-child{border:0}
.it-l .in{flex:1;min-width:0}
.it-l .u{font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:64px;text-align:right}
.ib{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ib:hover{color:var(--bad);border-color:#f0b9bb}
.ib svg{width:15px;height:15px}
.fila-v{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line2)}
.fila-v:last-child{border:0;padding-bottom:2px}
.fila-v:first-child{padding-top:2px}
.fila-v h4{font-size:14px;font-weight:700}
.fila-v p{font-size:12.5px;color:var(--muted);margin-top:3px}
.fila-v .hoy{font-size:12px;margin-top:6px;color:#3d4a60}
.pref{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.pref span{padding:0 9px;color:var(--muted);font-weight:700;font-size:13px;background:#fafbfd;align-self:stretch;display:flex;align-items:center;border-right:1px solid var(--line)}
.pref .in{border:0;border-radius:0}
/* plantillas */
.pl-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.pl-list .g{font-size:10.5px;font-weight:700;letter-spacing:.8px;color:var(--muted2);margin:0 2px 0 8px;text-transform:uppercase}
.pl-list .grp{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin-right:8px}
.pl-list .grp .g{margin-left:0}
.pl-list .chip.off{color:var(--muted2);border-style:dashed}
.pl-list .chip.off.on{color:#fff}
.pl-list .chip svg{width:12px;height:12px}
.pl-list .chip .st{color:var(--amber)}
.pl-list .chip .st svg{fill:var(--amber)}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
textarea.ta{font:500 13.5px/1.5 Archivo,sans-serif;resize:vertical;min-height:220px}
.vars{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.vars button{border:1px dashed #b9c6da;background:#f8fafd;border-radius:6px;padding:3px 7px;font:600 11.5px ui-monospace,Menlo,Consolas,monospace;color:var(--navy2);cursor:pointer}
.vars button:hover{background:var(--info-bg);border-style:solid}
.vv{background:var(--info-bg);color:var(--navy2);border-radius:4px;padding:0 3px;font-weight:600}
.vfalta{background:var(--warn-bg);color:#8a5a00;border-radius:4px;padding:0 4px;font-weight:700;font-size:12px}
.vbad{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:0 4px;font-weight:700;font-size:12px}
.wa{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#f1f3f6}
.wa-h{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.wa-h small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.wa-b{padding:14px 12px 16px;min-height:200px}
.bub{background:#fff;border:1px solid #dfe6dc;border-left:3px solid #1fa855;border-radius:10px 10px 10px 3px;padding:9px 11px 7px;font-size:13.5px;line-height:1.5;max-width:94%;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow-wrap:anywhere}
.bub .hr{display:block;text-align:right;font-size:10.5px;color:var(--muted2);margin-top:3px}
.mail{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.mail .mh{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;background:#fafbfd}
.mail .mh div{padding:2px 0;overflow-wrap:anywhere}.mail .mh span{color:var(--muted);display:inline-block;width:52px}
.mail .ms{font-weight:700;font-size:14px;padding:10px 14px 0;overflow-wrap:anywhere}
.mail .mb{padding:10px 14px 16px;font-size:13.5px;line-height:1.55;min-height:180px;overflow-wrap:anywhere}
.chk2{margin-top:8px;font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:#cfd7e3;border-radius:20px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--navy2)}
.sw input:checked+i:before{transform:translateX(14px)}
.sw input:focus-visible+i{outline:2px solid #bcd0f0;outline-offset:2px}
.ck{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;font-weight:600}
.meta-pl{font-size:12px;color:var(--muted);margin-top:2px}
.pie-ed{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line2)}
.ev{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}
.ev h4{font-size:14px;font-weight:700}
.ev .ex{font-size:12.5px;color:var(--muted);margin:3px 0 8px}
.firma-prev{border:1px solid var(--line);border-radius:10px;background:#fafbfd;padding:10px 12px;font-size:13px;white-space:pre-wrap;color:#2a3850;margin-top:8px}
@media(max-width:1100px){.kp2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  .aj{grid-template-columns:minmax(0,1fr)}
  .subm{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}
  .subm a{white-space:nowrap;flex:none}.subm a small,.subm .pie{display:none}.subm a .pt{margin-left:4px}
  .ed-grid{grid-template-columns:minmax(0,1fr)}
  .fila-v{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:600px){
  .ph .sp{display:none}
  .tb td,.tb th{padding:8px 9px}
  .hide-m{display:none}
  .tb.et thead{display:none}
  .tb.et tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:12px;border-bottom:1px solid var(--line2)}
  .tb.et tr:last-child{border:0}
  .tb.et td{border:0;padding:0}
  .tb.et td:first-child,.tb.et td.r{grid-column:1/-1;text-align:left}
  .tb.et td[data-l]::before{content:attr(data-l);display:block;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--muted2);margin:4px 0 3px}
}
/* gerencia solo consulta: ve los ajustes pero no los cambia */
body.solo-ver #ajGuardar,body.solo-ver #ajDesc,body.solo-ver #ajEstado,body.solo-ver #plNueva,body.solo-ver #plDup,body.solo-ver #plBorrar,body.solo-ver #plGuardar,body.solo-ver #plDeshacer,body.solo-ver #plCanc,body.solo-ver [data-rec],body.solo-ver [data-add],body.solo-ver [data-n],body.solo-ver #ajCuerpo .ib{display:none!important}
body.solo-ver #ajCuerpo [data-t],body.solo-ver #ajCuerpo [data-c],body.solo-ver #ajCuerpo [data-v],body.solo-ver #ajCuerpo label.ck{pointer-events:none}
</style>

<body class="mk">
<script src="cargador.js" data-modulo="Mercadeo"></script>
<div id="sysbar"></div>
<div class="shell"><nav class="mnav" id="mnav"></nav><main class="main" id="main"><div class="cargando">Cargando…</div></main></div>
<script>
(function () {
  'use strict';

  var SECS = [
    ['etapas', 'Etapas del embudo', 'embudo'],
    ['listas', 'Fuentes y motivos', 'lista'],
    ['metas', 'Metas y alertas', 'tendencia'],
    ['plantillas', 'Plantillas', 'plantilla'],
    ['avisos', 'Notificaciones', 'campana'],
    ['firma', 'Firma, tono y agenda', 'lapiz'],
    ['espacio', 'Espacio de archivos', 'clip']
  ];
  var ABIERTAS = ['Registrado', 'Formulario enviado', 'Formulario recibido', 'Propuesta enviada', 'En negociación', 'Contrato en proceso', 'Stand-by'];
  var ESCALARES = ['metaMensual', 'diasRenovacion', 'diasSinContacto', 'tono', 'firma', 'horaInicio', 'horaFin'];
  var VARS = { empresa: 'Nombre de la empresa', contacto: 'Nombre del contacto', asesor: 'Quien envía el mensaje', fecha: 'La fecha de hoy', hora: 'Hora de la próxima cita', propuesta: 'Código de la propuesta', enlace: 'Enlace del formulario del cliente', firma: 'Tu firma', saludo: 'Buenos días / tardes / noches' };

  var DAT = null, AJ = null, ED = null, REC = null, ERR = '';
  var OPS = null, CLI = null, URL_APP = '';
  var SEC = 'etapas';
  var PL = [], PSEL = '', PED = null, PORIG = null, PFOCO = 'texto', MUESTRA = '';
  var NOTIF = null;

  function cp(x) { return JSON.parse(JSON.stringify(x)); }
  function get(o, k) { var i = k.indexOf('.'); if (i < 0) return o[k]; var g = o[k.slice(0, i)]; return g ? g[k.slice(i + 1)] : undefined; }
  function set(o, k, v) { var i = k.indexOf('.'); if (i < 0) { o[k] = v; return; } var g = k.slice(0, i); o[g] = o[g] || {}; o[g][k.slice(i + 1)] = v; }
  function igual(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function hayRec(k) { return REC && get(REC, k) !== undefined; }

  /* ═══ Lo que cambió (clave → valor) ═══ */
  function cambios() {
    if (!AJ || !ED) return [];
    var out = [];
    ['probabilidades', 'limitesDias'].forEach(function (g) {
      var ks = Object.keys(Object.assign({}, AJ[g] || {}, ED[g] || {}));
      ks.forEach(function (e) { if (!igual((ED[g] || {})[e], (AJ[g] || {})[e])) out.push([g + '.' + e, ED[g][e]]); });
    });
    ['fuentes', 'motivosPerdida'].forEach(function (k) { if (!igual(ED[k], AJ[k])) out.push([k, ED[k]]); });
    ESCALARES.forEach(function (k) { if (!igual(ED[k], AJ[k])) out.push([k, ED[k]]); });
    return out;
  }
  function secDe(clave) {
    var r = clave.split('.')[0];
    if (r === 'probabilidades' || r === 'limitesDias') return 'etapas';
    if (r === 'fuentes' || r === 'motivosPerdida') return 'listas';
    if (r === 'metaMensual' || r === 'diasRenovacion' || r === 'diasSinContacto') return 'metas';
    return 'firma';
  }
  function plSucia() { return !!(PED && PORIG && !igual(normPl(PED), normPl(PORIG))) || !!(PED && !PORIG); }
  function normPl(p) { return { nombre: p.nombre || '', momento: p.momento || '', canal: p.canal || 'whatsapp', asunto: p.asunto || '', texto: p.texto || '' }; }
  function pintarEstado() {
    var c = cambios(), e = document.getElementById('ajEstado'), b = document.getElementById('ajGuardar'), d = document.getElementById('ajDesc');
    if (e) { e.textContent = c.length ? (c.length === 1 ? '1 cambio sin guardar' : c.length + ' cambios sin guardar') : 'Todo guardado'; e.className = 'estado' + (c.length ? ' sucio' : ''); }
    if (b && !b._ocupado) b.disabled = !c.length;
    if (d) d.hidden = !c.length;
    var m = document.getElementById('ajMenu'); if (m) pintarMenu();
  }

  /* ═══ Validación ═══ */
  function errores() {
    var e = [];
    ABIERTAS.forEach(function (s) { var v = ED.probabilidades[s]; if (!(v >= 0 && v <= 100) || v !== Math.round(v)) e.push('La probabilidad de «' + s + '» debe ser un número entero de 0 a 100.'); });
    Object.keys(ED.limitesDias || {}).forEach(function (s) { var v = ED.limitesDias[s]; if (!(v >= 1 && v <= 180) || v !== Math.round(v)) e.push('Los días máximos de «' + s + '» deben ser de 1 a 180.'); });
    [['fuentes', 'fuentes'], ['motivosPerdida', 'motivos de pérdida']].forEach(function (x) {
      var l = ED[x[0]] || []; if (!l.length) e.push('La lista de ' + x[1] + ' no puede quedar vacía.');
      var vis = {}; l.forEach(function (v) { var k = String(v).trim().toLowerCase(); if (!k) e.push('Hay un renglón vacío en ' + x[1] + '.'); else if (vis[k]) e.push('«' + v + '» está repetido en ' + x[1] + '.'); vis[k] = 1; });
    });
    if (!(ED.metaMensual >= 0)) e.push('La meta mensual debe ser un número (0 = sin meta).');
    if (!(ED.diasRenovacion >= 1 && ED.diasRenovacion <= 365)) e.push('El aviso de renovación debe ser de 1 a 365 días.');
    if (!(ED.diasSinContacto >= 1 && ED.diasSinContacto <= 365)) e.push('Los días sin contacto deben ser de 1 a 365.');
    if (!String(ED.firma || '').trim()) e.push('La firma no puede quedar vacía.');
    if (!/^\d{2}:\d{2}$/.test(ED.horaInicio || '') || !/^\d{2}:\d{2}$/.test(ED.horaFin || '')) e.push('Escribe la hora de inicio y fin de la agenda.');
    else if (ED.horaInicio >= ED.horaFin) e.push('La agenda debe empezar antes de terminar.');
    return e;
  }

  /* ═══ Guardar ajustes ═══ */
  function guardarTodo() {
    var b = document.getElementById('ajGuardar'), c = cambios(); if (!c.length) return;
    var er = errores();
    if (er.length) { MK.hoja('<h2>Revisa antes de guardar</h2><ul style="margin:10px 0 0 18px;font-size:13px;line-height:1.6">' + er.map(function (x) { return '<li>' + MK.esc(x) + '</li>'; }).join('') + '</ul><div class="pie"><button class="btn pri" onclick="MK.cerrarHoja()">Entendido</button></div>'); return; }
    MK.ocupado(b, true); b._ocupado = true;
    var i = 0, fallo = '';
    (function sig() {
      if (i >= c.length) {
        b._ocupado = false; MK.ocupado(b, false); pintarEstado();
        if (fallo) { MK.aviso(fallo); pintarSeccion(); return; }
        MK.aviso('Ajustes guardados. Se aplican desde ya en todo Mercadeo.');
        MK.cambio({ tipo: 'ajustes' });
        return;
      }
      var k = c[i][0], v = c[i][1];
      MK.api('api_crmGuardarAjuste', MK.pin, k, v).then(function (r) {
        if (!r || !r.ok) { fallo = (r && r.error) || 'No se pudo guardar «' + k + '».'; i = c.length; sig(); return; }
        set(AJ, k, cp(v));   // lo que ya quedó guardado
        i++; sig();
      }, function (e) { fallo = 'Sin conexión: no se guardó todo. ' + e.message; i = c.length; sig(); });
    })();
  }
  function descartar() {
    MK.confirmar('Se pierden los cambios que no has guardado y vuelven los valores guardados.', function () { ED = cp(AJ); pintarSeccion(); pintarEstado(); MK.aviso('Cambios descartados'); }, { titulo: 'Descartar cambios', boton: 'Descartar', peligro: true });
  }

  /* ═══ Recomendado ═══ */
  function fmtRec(k, v) {
    if (Array.isArray(v)) return v.length + ' elementos';
    if (/^probabilidades\./.test(k)) return v + ' %';
    if (/^limitesDias\./.test(k) || k === 'diasRenovacion' || k === 'diasSinContacto') return v + ' días';
    if (k === 'metaMensual') return Number(v) ? MK.dinero(v) : 'sin meta';
    if (k === 'tono') return v === 'cercano' ? 'Cercano' : 'Formal';
    if (k === 'horaInicio' || k === 'horaFin') return v;
    return '«' + String(v) + '»';
  }
  function recHtml(k) {
    if (!hayRec(k)) return '';
    var r = get(REC, k), dif = !igual(get(ED, k), r);
    return '<span class="recbox" data-rk="' + MK.esc(k) + '">' + (dif ? 'Recomendado: ' + MK.esc(fmtRec(k, r)) + '<button type="button" class="btn gh sm" data-rec="' + MK.esc(k) + '">' + MK.ic('renovar', 12) + 'Usar</button>' : '<span style="color:var(--ok)">✓</span> Es el recomendado') + '</span>';
  }
  function refrescarRec(k) {
    [].forEach.call(document.querySelectorAll('.recbox[data-rk]'), function (el) { if (el.getAttribute('data-rk') === k) { el.outerHTML = recHtml(k); } });
    [].forEach.call(document.querySelectorAll('[data-k]'), function (el) { if (el.getAttribute('data-k') === k) el.classList.toggle('difiere', !igual(get(ED, k), get(AJ, k))); });
    activarRec();
  }
  function activarRec() {
    [].forEach.call(document.querySelectorAll('[data-rec]'), function (b) {
      b.onclick = function () { var k = b.getAttribute('data-rec'); set(ED, k, cp(get(REC, k))); pintarSeccion(); pintarEstado(); };
    });
  }
  /* entradas con data-k: se guardan en ED al escribir */
  function activarEntradas(alCambiar) {
    [].forEach.call(document.querySelectorAll('#ajCuerpo [data-k]'), function (el) {
      var k = el.getAttribute('data-k'), t = el.getAttribute('data-t') || 'txt';
      el.classList.toggle('difiere', !igual(get(ED, k), get(AJ, k)));
      var h = function () {
        var v = el.value;
        if (t === 'int') v = v === '' ? NaN : Math.round(Number(v));
        else if (t === 'num') v = v === '' ? 0 : Number(v);
        set(ED, k, v); refrescarRec(k); pintarEstado(); if (alCambiar) alCambiar(k);
      };
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', h);
    });
    activarRec();
  }

  /* ═══ Menú y cuerpo ═══ */
  function pintarMenu() {
    var c = cambios(), sucias = {}; c.forEach(function (x) { sucias[secDe(x[0])] = 1; }); if (plSucia()) sucias.plantillas = 1;
    var cnt = { etapas: ABIERTAS.length, listas: (ED.fuentes || []).length + (ED.motivosPerdida || []).length, plantillas: PL.length, avisos: NOTIF ? NOTIF.eventos.filter(function (e) { return e.activo; }).length + ' de ' + NOTIF.eventos.length : '' };
    document.getElementById('ajMenu').innerHTML = SECS.map(function (s) {
      return '<a class="' + (s[0] === SEC ? 'on' : '') + '" data-s="' + s[0] + '" href="#' + s[0] + '">' + MK.ic(s[2], 16) + MK.esc(s[1]) + (sucias[s[0]] ? '<span class="pt" title="Cambios sin guardar"></span>' : '') + (cnt[s[0]] !== undefined && cnt[s[0]] !== '' ? '<small>' + cnt[s[0]] + '</small>' : '') + '</a>';
    }).join('') + '<div class="pie">Cada cambio queda registrado con la fecha y quién lo hizo. Los valores con fondo amarillo aún no se han guardado.</div>';
    [].forEach.call(document.querySelectorAll('#ajMenu a'), function (a) { a.onclick = function (e) { e.preventDefault(); irA(a.getAttribute('data-s')); }; });
  }
  function irA(s) {
    if (s === SEC) return;
    if (SEC === 'plantillas' && plSucia()) {

  /* favorita y activa se guardan al tocarlas, con lo que ya estaba guardado (no con lo que se está escribiendo) */
  function interruptor(campo, valor, inp, sec) {
    var base = Object.assign({}, PORIG); base[campo] = valor; inp.disabled = true;
    MK.api('api_crmGuardarPlantilla', MK.pin, { id: base.id, nombre: base.nombre, momento: base.momento, canal: base.canal, asunto: base.asunto, texto: base.texto, favorita: !!base.favorita, activa: base.activa !== false }).then(function (r) {
      inp.disabled = false;
      if (!r || !r.ok) { inp.checked = !valor; MK.aviso((r && r.error) || 'No se pudo guardar.'); return; }
      PORIG[campo] = valor; PED[campo] = valor;
      MK.aviso(campo === 'favorita' ? (valor ? 'Marcada como favorita' : 'Ya no es favorita') : (valor ? 'Plantilla activada' : 'Plantilla desactivada: ya no se ofrece al enviar'));
      recargarPlantillas(PSEL, sec);

  function guardarPl(btn, sec) {
    var msg = document.getElementById('plMsg'), p = PED;
    if (!String(p.nombre || '').trim()) { msg.textContent = 'Ponle un nombre.'; document.getElementById('plNom').focus(); return; }
    if (!String(p.texto || '').trim()) { msg.textContent = 'Escribe el mensaje.'; document.getElementById('plTx').focus(); return; }
    var mal = revisar(p.texto + ' ' + (p.asunto || ''), {}).mal;
    if (mal.length) { msg.textContent = 'Corrige: ' + mal.map(function (x) { return '{' + x + '}'; }).join(', ') + ' no existe.'; return; }
    if (PL.some(function (x) { return x.id !== PSEL && String(x.nombre).trim().toLowerCase() === String(p.nombre).trim().toLowerCase(); })) { msg.textContent = 'Ya hay una plantilla con ese nombre.'; return; }
    msg.textContent = '';
    var o = PORIG || {};
    var d = { id: PORIG ? PORIG.id : '', nombre: p.nombre.trim(), momento: p.momento, canal: p.canal, asunto: p.canal === 'correo' ? p.asunto : (p.asunto || ''), texto: p.texto, favorita: !!o.favorita, activa: PORIG ? o.activa !== false : true };
    btn._oc = true; MK.ocupado(btn, true);
    MK.api('api_crmGuardarPlantilla', MK.pin, d).then(function (r) {
      btn._oc = false; MK.ocupado(btn, false);

  /* ═══ Carga ═══ */
  function aplicar(r, conservar) {
    DAT = r; REC = r.recomendados || {};
    var viejoAJ = AJ, cambiosAntes = conservar && AJ ? cambios() : [];
    AJ = cp(r.ajustes || {});
    ED = cp(AJ);
    ['probabilidades', 'limitesDias'].forEach(function (g) { AJ[g] = AJ[g] || {}; ED[g] = ED[g] || {}; });
    cambiosAntes.forEach(function (c) { set(ED, c[0], cp(c[1])); });   // lo que se estaba editando no se pierde
    PL = r.plantillas || [];
    NOTIF = r.notificaciones && r.notificaciones.ok ? r.notificaciones : null;
    if (PSEL && !PL.some(function (x) { return x.id === PSEL; }) && PORIG) { PSEL = ''; PED = null; PORIG = null; }
    else if (PSEL && !plSucia()) selPl(PSEL);
    void viejoAJ;
  }

      if (!r || !r.ok) { ERR = (r && r.error) || 'No se pudieron leer los ajustes.'; pintarTodo(); return; }
      ERR = ''; aplicar(r, conservar); pintarTodo();
    }, function (e) { ERR = 'Sin conexión: ' + e.message; pintarTodo(); });
  }
  function cargarOps() {
    MK.api('api_crmOportunidades', MK.pin).then(function (r) { OPS = r && r.ok ? (r.oportunidades || []) : []; if (AJ) pintarSeccion(); }, function () { OPS = []; if (AJ) pintarSeccion(); });
  }
  function pintarTodo() {
    var m = document.getElementById('main');
    if (ERR && !AJ) { m.innerHTML = cabecera(); MK.error('ajCuerpo', ERR); return; }
    if (!AJ) return;
    if (!document.getElementById('ajMenu')) m.innerHTML = cabecera();
    pintarMenu(); pintarSeccion(); pintarEstado();
  }
  function cabecera() {
    return '<div class="ph"><div><h1>Plantillas y ajustes</h1><p>Reglas del embudo, listas, metas, mensajes, avisos y tu firma. Lo que cambies aquí se aplica en todo Mercadeo.</p></div><div class="sp"></div>' +
      '<span class="estado" id="ajEstado">Todo guardado</span><button class="btn gh sm" id="ajDesc" hidden>Descartar</button><button class="btn pri" id="ajGuardar" disabled>Guardar cambios</button></div>' +
      '<div class="aj"><nav class="subm" id="ajMenu" aria-label="Apartados"></nav><section id="ajCuerpo" style="min-width:0"><div class="cargando">Cargando…</div></section></div>';
  }

  MK.iniciar('ajustes', function (base) {
    var h = (location.hash || '').slice(1); if (SECS.some(function (s) { return s[0] === h; })) SEC = h;
    document.getElementById('main').innerHTML = cabecera();
    if (base && base.usuario && base.usuario.rol === 'gerente') {
      /* modo consulta: todo a la vista, nada editable */
      document.body.classList.add('solo-ver');
      var soloLeer = function () {
        [].forEach.call(document.querySelectorAll('#ajCuerpo input, #ajCuerpo textarea, #ajCuerpo select'), function (x) {
          if (x.id === 'plMu') return;
          if (x.tagName === 'SELECT' || x.type === 'checkbox' || x.type === 'radio') x.disabled = true; else x.readOnly = true;
        });
      };
      new MutationObserver(soloLeer).observe(document.getElementById('main'), { childList: true, subtree: true });
      var ph = document.querySelector('#main .ph > div'); if (ph) ph.insertAdjacentHTML('beforeend', '<p class="small muted">Modo consulta: gerencia ve los ajustes; los cambia mercadeo o administración.</p>');
    }
    document.getElementById('main').addEventListener('click', function (e) {
      var t = e.target.closest && e.target.closest('#ajGuardar, #ajDesc'); if (!t) return;
      if (t.id === 'ajGuardar') guardarTodo(); else descartar();
    });
    cargar(false); cargarOps();
    MK.api('api_urlApp').then(function (u) { URL_APP = typeof u === 'string' ? u : ''; if (SEC === 'plantillas') prevPl(); }, function () {});
  });
  window.addEventListener('mk:cambio', function () { cargar(true); OPS = null; CLI = null; cargarOps(); });
  window.addEventListener('beforeunload', function (e) { if ((AJ && cambios().length) || plSucia()) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
