  function dif(a, b) {
    var A = aTexto(a).split(/(\s+)/), Bw = aTexto(b).split(/(\s+)/), n = A.length, m = Bw.length;
    if (n * m > 400000) return [MK.esc(aTexto(a)), MK.esc(aTexto(b))];
    var L = []; for (var i = 0; i <= n; i++) { L.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) L[i][j] = A[i] === Bw[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    var ra = '', rb = ''; i = 0; j = 0;
    while (i < n && j < m) {
      if (A[i] === Bw[j]) { ra += MK.esc(A[i]); rb += MK.esc(Bw[j]); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) { ra += /^\s+$/.test(A[i]) ? A[i] : '<del>' + MK.esc(A[i]) + '</del>'; i++; }
      else { rb += /^\s+$/.test(Bw[j]) ? Bw[j] : '<ins>' + MK.esc(Bw[j]) + '</ins>'; j++; }
    }
    while (i < n) { ra += /^\s+$/.test(A[i]) ? A[i] : '<del>' + MK.esc(A[i]) + '</del>'; i++; }
    while (j < m) { rb += /^\s+$/.test(Bw[j]) ? Bw[j] : '<ins>' + MK.esc(Bw[j]) + '</ins>'; j++; }

    if (!aTexto(ahora).trim()) { if (m) m.textContent = 'El texto no puede quedar vacío. Para volver al de fábrica usa «Volver al texto original».'; return; }
    dlgEntiendo({ titulo: 'Guardar para todos', ancha: true, boton: 'Guardar para todos',
      sub: MK.esc(nomDoc(doc)) + ' › <b>' + MK.esc(b.titulo) + '</b>' + (dVariantes(b).length > 1 ? ' · ' + MK.esc(dNombreVar(b, v)) : ''),
      cuerpo: cmpHtml(antes, ahora),
      aviso: '<b>Este cambio queda en TODAS ' + nomDoc(doc, 1) + ' que se generen desde hoy.</b> Lo ya enviado o firmado conserva el texto con que salió.',
      llamar: function () { return MK.api('api_docGuardarTexto', MK.pin, doc, b.id, v, ahora, true); },
      listo: function (r) {
        delete DBORR[kB(doc, b.id, v)];
        if (r.bloque) { reponerBloque(doc, r.bloque); secDocs(document.getElementById('ajCuerpo')); } else { DOC[doc] = null; cargarDoc(doc); }
        pintarMenu(); MK.aviso('Guardado. ' + (doc === 'propuesta' ? 'Las propuestas nuevas ya salen' : 'Los contratos nuevos ya salen') + ' con este texto.');
      } });
  }
  function dlgOriginal(b, v) {
    var doc = DTAB, t = (b.textos || {})[v] || {};
    dlgEntiendo({ titulo: 'Volver al texto original', ancha: true, boton: 'Volver al original',
      sub: MK.esc(nomDoc(doc)) + ' › <b>' + MK.esc(b.titulo) + '</b>' + (dVariantes(b).length > 1 ? ' · ' + MK.esc(dNombreVar(b, v)) : ''),
      cuerpo: cmpHtml(t.texto, t.original != null ? t.original : ''),
      aviso: '<b>«' + MK.esc(b.titulo) + '» vuelve al texto de fábrica en TODAS ' + nomDoc(doc, 1) + ' que se generen desde hoy.</b> Lo ya enviado o firmado conserva el texto con que salió.',
      llamar: function () { return MK.api('api_docVolverOriginal', MK.pin, doc, b.id, v, true); },
      listo: function (r) {
        delete DBORR[kB(doc, b.id, v)];
        if (r.bloque) { reponerBloque(doc, r.bloque); secDocs(document.getElementById('ajCuerpo')); } else { DOC[doc] = null; cargarDoc(doc); }
        pintarMenu(); MK.aviso('Listo: «' + b.titulo + '» volvió al texto original.');
      } });
  }
  function dlgFabrica() {
    var doc = DTAB, n = nEditados(doc);
    dlgEntiendo({ titulo: 'Restaurar todo de fábrica', boton: 'Restaurar todo', peligro: true,
      sub: MK.esc(nomDoc(doc)) + ' · ' + (n ? n + (n === 1 ? ' bloque editado' : ' bloques editados') : 'ningún bloque editado'),
      cuerpo: '<p style="margin-top:10px;font-size:13.5px">Todos los bloques ' + (doc === 'propuesta' ? 'de la propuesta' : 'del contrato') + ' vuelven al texto de fábrica. La numeración no cambia.</p>',
      aviso: '<b>Queda en TODAS ' + nomDoc(doc, 1) + ' que se generen desde hoy.</b> Lo ya enviado o firmado no cambia.',
      llamar: function () { return MK.api('api_docRestaurarFabrica', MK.pin, doc, true); },
      listo: function () {
        Object.keys(DBORR).forEach(function (k) { if (k.indexOf(doc + '|') === 0) delete DBORR[k]; });
        DOC[doc] = null; cargarDoc(doc); pintarMenu(); MK.aviso('Listo: ' + (doc === 'propuesta' ? 'la propuesta' : 'el contrato') + ' quedó con los textos de fábrica.');
      } });
  }

  /* ── historial ── */
  function panelHistorial() {
    MK.lado('<h2 style="font-size:18px;margin-bottom:2px">Historial</h2><p class="small muted">Propuesta y contrato · textos y numeración</p>' + chipsHist() + '<div id="dcHl"><div class="cargando">Cargando…</div></div>');
    activarChipsHist();
    MK.api('api_docHistorial', MK.pin, HFILTRO).then(function (r) {
      var el = document.getElementById('dcHl'); if (!el) return;
      if (!r || !r.ok) { el.innerHTML = '<div class="aviso rj">' + MK.esc((r && r.error) || 'No se pudo leer el historial.') + '</div>'; return; }
      var L = r.items || [];
      el.innerHTML = (L.length ? '<div class="tl hist">' + L.map(function (x, i) {
        var dn = x.doc === 'propuesta' ? 'Propuesta' : x.doc === 'contrato' ? 'Contrato' : 'Numeración', ant = aTexto(x.textoAnterior);
        return '<div class="hev' + (x.doc === 'numeracion' ? ' sis' : '') + '"><small>' + MK.esc(fechaHist(x.cuando)) + ' · <b style="color:var(--ink)">' + MK.esc(x.quien || '') + '</b>' + (x.avisoAdmin ? ' · <span class="tag t-info" style="font-size:10.5px;padding:0 6px">aviso al administrador</span>' : '') + '</small>' +
          '<div class="hb"><span class="tag t-gris">' + dn + '</span> <b>' + MK.esc(x.titulo || '') + '</b></div><p>' + chipsLlaves(x.resumen, x.doc === 'contrato' ? 'contrato' : 'propuesta') + '</p>' +
          (ant || x.puedeVolver ? '<div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap">' + (ant ? '<button class="btn sm" data-hver="' + i + '">' + MK.ic('ojo', 13) + 'Ver texto anterior</button>' : '') +
            (x.puedeVolver && puedeDocH(x.doc) ? '<button class="btn sm" data-hvol="' + i + '">' + MK.ic('renovar', 13) + 'Volver a esta versión</button>' : '') + '</div>' : '') +
          (ant ? '<div class="antes" id="dcHa' + i + '" hidden><label class="lb" style="margin-top:0">TEXTO ANTERIOR</label>' + MK.esc(ant).replace(/\n/g, '<br>') + '</div>' : '') + '</div>';
      }).join('') + '</div>' : MK.vacio('Todavía no hay cambios' + (HFILTRO ? ' en esta parte.' : '.'))) +
        '<p class="small muted" style="margin-top:4px">«Volver a esta versión» pide la misma confirmación con «Entiendo» y también queda en el historial.</p>';
      [].forEach.call(el.querySelectorAll('[data-hver]'), function (b) { b.onclick = function () { var a = document.getElementById('dcHa' + b.getAttribute('data-hver')); a.hidden = !a.hidden; b.classList.toggle('on2', !a.hidden); }; });
      [].forEach.call(el.querySelectorAll('[data-hvol]'), function (b) { b.onclick = function () { dlgVolverVersion(L[+b.getAttribute('data-hvol')]); }; });
    }, function (e) { var el = document.getElementById('dcHl'); if (el) el.innerHTML = '<div class="aviso rj">Sin conexión: ' + MK.esc(e.message) + '</div>'; });
  }
  function puedeDocH(doc) { var d = DOC[doc] || DOC.propuesta || DOC.contrato; return !(MK.usuario && MK.usuario.rol === 'gerente') && !(d && d.puedeEditar === false); }
  function chipsHist() { return '<div class="row w" style="gap:6px;margin:12px 0 14px" id="dcHf">' + [['', 'Todo'], ['propuesta', 'Propuesta'], ['contrato', 'Contrato'], ['numeracion', 'Numeración']].map(function (x) { return '<button type="button" class="chip' + (HFILTRO === x[0] ? ' on' : '') + '" data-hf="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>'; }
  function activarChipsHist() { [].forEach.call(document.querySelectorAll('#dcHf [data-hf]'), function (b) { b.onclick = function () { HFILTRO = b.getAttribute('data-hf'); panelHistorial(); }; }); }
  function dlgVolverVersion(x) {
    var doc = x.doc, b = dBloque(doc, x.bloque), actual = b ? ((b.textos || {})[x.variante] || {}).texto : '';
    dlgEntiendo({ titulo: 'Volver a esta versión', ancha: true, boton: 'Volver a esta versión',
      sub: MK.esc(nomDoc(doc)) + ' › <b>' + MK.esc(x.titulo || '') + '</b> · versión de ' + MK.esc(fechaHist(x.cuando)),
      cuerpo: b ? cmpHtml(actual != null ? actual : '', x.textoAnterior) : '<label class="lb">TEXTO DE ESA VERSIÓN</label><div class="cmp-t nuevo">' + MK.esc(aTexto(x.textoAnterior)).replace(/\n/g, '<br>') + '</div>',
      aviso: '<b>Este texto vuelve a quedar en TODAS ' + nomDoc(doc, 1) + ' que se generen desde hoy.</b> Lo ya enviado o firmado conserva el texto con que salió.',
      llamar: function () { return MK.api('api_docVolverVersion', MK.pin, x.id, true); },
      listo: function () { Object.keys(DBORR).forEach(function (k) { if (k.indexOf(doc + '|' + x.bloque + '|') === 0) delete DBORR[k]; }); DOC[doc] = null; cargarDoc(doc); panelHistorial(); MK.aviso('Listo: volvió el texto de esa versión.'); } });
  }

  /* ═══ 5 · Notificaciones (igual que Alta › Notificaciones) ═══ */
  function secAvisos(el) {
    var h = '<div class="sec-h"><div><h2>Notificaciones</h2><p>A quién se le escribe cuando pasa cada cosa. El correo se abre ya redactado y lo mandas tú desde tu cuenta. Varios correos van separados por coma.</p></div></div>';
    if (!NOTIF) { el.innerHTML = h + '<div class="aviso">A quién le llega cada aviso lo decide supervisión o gerencia. Si hay que cambiar un correo, pídeselo a ellos.</div>'; return; }
    h += NOTIF.eventos.map(function (e, i) {
      return '<div class="ev"><div class="row w"><h4>' + MK.esc(e.titulo) + '</h4><span class="sp"></span><span class="tag ' + (e.activo ? 't-ok' : 't-gris') + '">' + (e.activo ? 'Se usa' : 'Apagado') + '</span></div><div class="ex">' + MK.esc(e.explica) + '</div>' +
        '<label class="lb" for="nt-' + i + '">CORREOS, SEPARADOS POR COMA</label><input class="in" id="nt-' + i + '" type="text" value="' + MK.esc(e.destinatarios) + '" placeholder="contabilidad@ecovsa.com, kmezua@ecovsa.com" autocomplete="off">' +
        '<div class="row w" style="margin-top:11px"><label class="ck"><input type="checkbox" id="na-' + i + '"' + (e.activo ? ' checked' : '') + ' style="width:16px;height:16px"> Usar estos correos</label><span class="sp"></span><button type="button" class="btn sm" data-n="' + i + '">Guardar</button></div></div>';
    }).join('') +
      '<div class="aviso" style="margin-top:4px"><b>El sistema no manda correos.</b> Cuando ocurre la acción, te abre tu programa de correo con el mensaje escrito y estas direcciones puestas; lo revisas y lo mandas tú. Así sale con tu firma y te queda en Enviados.</div>';
    el.innerHTML = h;
    [].forEach.call(el.querySelectorAll('[data-n]'), function (b) { b.onclick = function () { guardarNotificacion(+b.getAttribute('data-n'), b); }; });
  }
  function guardarNotificacion(i, btn) {
    var e = NOTIF.eventos[i], d = document.getElementById('nt-' + i).value, a = document.getElementById('na-' + i).checked;
    MK.ocupado(btn, true);
    MK.api('api_guardarNotificacion', MK.pin, e.evento, d, a).then(function (r) {
      MK.ocupado(btn, false);
      if (!r || !r.ok) { MK.aviso((r && r.error) || 'No se pudo guardar'); return; }
      e.destinatarios = (r.destinatarios || []).join(', '); e.activo = !!r.activo;
      secAvisos(document.getElementById('ajCuerpo')); pintarMenu();
      MK.aviso('Guardado ✓');
    }, function () { MK.ocupado(btn, false); MK.aviso('Sin conexión — no se guardó'); });
  }

  /* ═══ 6 · Firma, tono y agenda ═══ */
  /* ═══ api 3.5.1 · Espacio de archivos ═══
     Documentos de clientes y camiones en Supabase Storage (plan gratis: 1 GB).
     Al pasar de ~200 clientes o del 70 % del espacio, conviene el plan Pro. */
  function secEspacio(el) {
    el.innerHTML = '<div class="cargando">Midiendo el espacio…</div>';
    MK.api('api_arcEspacio', MK.pin).then(function (r) {
      if (!r || !r.ok) { el.innerHTML = '<div class="aviso rj">' + MK.esc((r && r.error) || 'No se pudo medir.') + '</div>'; return; }
      var e = r.espacio, pc = Math.min(100, e.pct), col = pc >= 85 ? 'var(--bad)' : pc >= 70 ? 'var(--amber)' : 'var(--ok)';
      var adm = MK.usuario && MK.usuario.rol === 'admin';
      el.innerHTML = '<div class="card"><h3>Espacio de archivos</h3>' +
        (e.listo ? '' : '<div class="aviso am">El espacio de archivos todavía no está conectado.</div>') +
        '<div style="display:flex;align-items:baseline;gap:8px;margin:6px 0 8px"><b style="font-size:28px" class="num">' + MK.num(e.usadoMB, 1) + ' MB</b><span class="muted">de ' + MK.num(e.limiteMB) + ' MB · ' + MK.num(e.pct, 1) + ' %</span></div>' +
        '<div style="height:12px;border-radius:7px;background:var(--line2);overflow:hidden"><i style="display:block;height:100%;width:' + Math.max(pc, 0.6) + '%;background:' + col + '"></i></div>' +
        '<div class="grid g2" style="margin-top:14px;gap:12px"><div class="kpi"><b class="num">' + e.clientes + '</b><span>clientes en servicio · aviso a los ' + e.clientesAviso + '</span></div>' +
        '<div class="kpi"><b class="num">~' + Math.max(0, Math.floor((e.limiteMB - e.usadoMB) / 3)) + '</b><span>clientes más caben (unos 3 MB por cliente)</span></div></div>' +
        (e.aviso ? '<div class="aviso am" style="margin-top:12px">Es momento de pasar Supabase al plan Pro (25 dólares al mes: 100 GB de archivos y 8 GB de base de datos).</div>' : '<p class="small muted" style="margin-top:12px">Plan gratis de Supabase: 1 GB para archivos. Las fotos se achican solas antes de subir (unos 0.4 MB por documento). Cuando pase de 200 clientes o del 70 % del espacio, aquí y en Mi día sale el aviso para pasar al plan Pro.</p>') +
        (e.adjuntosViejos ? '<div class="aviso az" style="margin-top:12px">Hay ' + e.adjuntosViejos + ' adjunto(s) de antes guardados dentro de la base de datos (' + MK.num(e.adjuntosViejosMB, 1) + ' MB). ' +
          (adm ? 'Pásalos al espacio de archivos para aligerar la base.<div style="margin-top:8px"><button class="btn sm pri" id="es-mudar">' + MK.ic('subir', 14) + ' Pasarlos ahora</button></div>' : 'El administrador los pasa al espacio de archivos desde aquí.') + '</div>' : '') + '</div>';
      var b = document.getElementById('es-mudar');
      if (b) b.onclick = function () {
        MK.ocupado(b, true, 'Pasando…');
        (function tanda() {
          MK.api('api_arcMudarAdjuntos', MK.pin).then(function (x) {
            if (!x || !x.ok) { MK.ocupado(b, false); MK.aviso((x && x.error) || 'No se pudo.'); return; }
            if (x.almacenError) { MK.ocupado(b, false); MK.aviso(x.almacenError); return; }
            if (x.quedan > 0) { b.textContent = 'Quedan ' + x.quedan + '…'; tanda(); } else { MK.aviso('Listo: todos los adjuntos están en el espacio de archivos'); secEspacio(el); }
          }, function (err) { MK.ocupado(b, false); MK.aviso('Sin conexión: ' + err.message); });
        })();
      };
    }, function (err) { el.innerHTML = '<div class="aviso rj">Sin conexión: ' + MK.esc(err.message) + '</div>'; });
  }
  function secFirma(el) {
    el.innerHTML = '<div class="sec-h"><div><h2>Firma, tono y agenda</h2><p>Cómo cierran tus mensajes, con qué saludo empiezan y qué horas muestra la Agenda.</p></div></div>' +
      '<div class="card">' +
      '<div class="fila-v"><div><h4>Firma</h4><p>Reemplaza a <b>{firma}</b> al final de las plantillas de WhatsApp y de correo.</p><label class="lb" for="fiTx">FIRMA</label><textarea class="in" id="fiTx" rows="3" data-k="firma" maxlength="300" style="min-height:70px">' + MK.esc(ED.firma) + '</textarea>' + recHtml('firma') + '</div>' +
      '<div><label class="lb">ASÍ SE VE</label><div class="firma-prev" id="fiPrev"></div></div></div>' +
      '<div class="fila-v"><div><h4>Tono de los mensajes</h4><p>Define el saludo que pone <b>{saludo}</b>. <b>Formal</b>: «Buenos días / Buenas tardes / Buenas noches» según la hora. <b>Cercano</b>: «Hola».</p>' +
      '<div class="seg" id="toSeg" style="margin-top:10px"><button type="button" data-t="formal" class="' + (ED.tono !== 'cercano' ? 'on' : '') + '">Formal</button><button type="button" data-t="cercano" class="' + (ED.tono === 'cercano' ? 'on' : '') + '">Cercano</button></div>' + recHtml('tono') + '</div>' +
      '<div><label class="lb">EJEMPLO</label><div class="firma-prev" id="toPrev"></div></div></div>' +
      '<div class="fila-v"><div><h4>Horario de la agenda</h4><p>La Agenda muestra el día desde esta hora hasta esta otra.</p></div>' +
      '<div><div class="grid g2" style="gap:10px"><div><label class="lb" for="hi">DESDE</label><input class="in" type="time" id="hi" step="1800" data-k="horaInicio" value="' + MK.esc(ED.horaInicio) + '">' + recHtml('horaInicio') + '</div>' +
      '<div><label class="lb" for="hf">HASTA</label><input class="in" type="time" id="hf" step="1800" data-k="horaFin" value="' + MK.esc(ED.horaFin) + '">' + recHtml('horaFin') + '</div></div><div class="small" id="hMsg" style="color:var(--bad);margin-top:6px"></div></div></div>' +
      '</div>';
    var prev = function () {
      document.getElementById('fiPrev').textContent = '…\n\n' + (ED.firma || '');
      document.getElementById('toPrev').textContent = saludo() + ' Ana, le escribe ' + ((MK.usuario || {}).nombre || '') + ' de ECOVSA.';
      document.getElementById('hMsg').textContent = ED.horaInicio && ED.horaFin && ED.horaInicio >= ED.horaFin ? 'La hora de inicio debe ser antes de la de fin.' : '';
    };
    prev();
    [].forEach.call(document.querySelectorAll('#toSeg button'), function (b) {
      b.onclick = function () { ED.tono = b.getAttribute('data-t'); [].forEach.call(document.querySelectorAll('#toSeg button'), function (x) { x.classList.toggle('on', x === b); }); refrescarRec('tono'); pintarEstado(); prev(); };
    });
    activarEntradas(prev);
  }

  /* ═══ Carga ═══ */
  function aplicar(r, conservar) {
    DAT = r; REC = r.recomendados || {};
    var viejoAJ = AJ, cambiosAntes = conservar && AJ ? cambios() : [];
    AJ = cp(r.ajustes || {});
    ED = cp(AJ);
    ['probabilidades', 'limitesDias'].forEach(function (g) { AJ[g] = AJ[g] || {}; ED[g] = ED[g] || {}; });
    cambiosAntes.forEach(function (c) { set(ED, c[0], cp(c[1])); });   // lo que se estaba editando no se pierde
    PL = r.plantillas || [];
    NOTIF = r.notificaciones && r.notificaciones.ok ? r.notificaciones : null;
    if (PSEL && !PL.some(function (x) { return x.id === PSEL; }) && PORIG) { PSEL = ''; PED = null; PORIG = null; }
    else if (PSEL && !plSucia()) selPl(PSEL);
    void viejoAJ;
  }
  function cargar(conservar) {
    return MK.api('api_crmAjustes', MK.pin).then(function (r) {
      if (!r || !r.ok) { ERR = (r && r.error) || 'No se pudieron leer los ajustes.'; pintarTodo(); return; }
      ERR = ''; aplicar(r, conservar); pintarTodo();
    }, function (e) { ERR = 'Sin conexión: ' + e.message; pintarTodo(); });
  }
  function cargarOps() {
    MK.api('api_crmOportunidades', MK.pin).then(function (r) { OPS = r && r.ok ? (r.oportunidades || []) : []; if (AJ) pintarSeccion(); }, function () { OPS = []; if (AJ) pintarSeccion(); });
  }
  function pintarTodo() {
    var m = document.getElementById('main');
    if (ERR && !AJ) { m.innerHTML = cabecera(); MK.error('ajCuerpo', ERR); return; }
    if (!AJ) return;
    if (!document.getElementById('ajMenu')) m.innerHTML = cabecera();
    pintarMenu(); pintarSeccion(); pintarEstado();
  }
  function cabecera() {
    return '<div class="ph"><div><h1>Plantillas y ajustes</h1><p>Reglas del embudo, listas, metas, mensajes, propuesta y contrato, avisos y tu firma. Lo que cambies aquí se aplica en todo Mercadeo.</p></div><div class="sp"></div>' +
      '<span class="estado" id="ajEstado">Todo guardado</span><button class="btn gh sm" id="ajDesc" hidden>Descartar</button><button class="btn pri" id="ajGuardar" disabled>Guardar cambios</button></div>' +
      '<div class="aj"><nav class="subm" id="ajMenu" aria-label="Apartados"></nav><section id="ajCuerpo" style="min-width:0"><div class="cargando">Cargando…</div></section></div>';
  }

  MK.iniciar('ajustes', function (base) {
    var h = (location.hash || '').slice(1); if (SECS.some(function (s) { return s[0] === h; })) SEC = h;
    document.getElementById('main').innerHTML = cabecera();
    if (base && base.usuario && base.usuario.rol === 'gerente') {
      /* modo consulta: todo a la vista, nada editable */
      document.body.classList.add('solo-ver');
      var soloLeer = function () {
        [].forEach.call(document.querySelectorAll('#ajCuerpo input, #ajCuerpo textarea, #ajCuerpo select'), function (x) {
          if (x.id === 'plMu') return;
          if (x.tagName === 'SELECT' || x.type === 'checkbox' || x.type === 'radio') x.disabled = true; else x.readOnly = true;
        });
      };
      new MutationObserver(soloLeer).observe(document.getElementById('main'), { childList: true, subtree: true });
      var ph = document.querySelector('#main .ph > div'); if (ph) ph.insertAdjacentHTML('beforeend', '<p class="small muted">Modo consulta: gerencia ve los ajustes; los cambia mercadeo o administración.</p>');
    }
    document.getElementById('main').addEventListener('click', function (e) {
      var t = e.target.closest && e.target.closest('#ajGuardar, #ajDesc'); if (!t) return;
      if (t.id === 'ajGuardar') guardarTodo(); else descartar();
    });
    cargar(false); cargarOps();
    MK.api('api_urlApp').then(function (u) { URL_APP = typeof u === 'string' ? u : ''; if (SEC === 'plantillas') prevPl(); }, function () {});
  });
  window.addEventListener('mk:cambio', function () { cargar(true); OPS = null; CLI = null; cargarOps(); });
  window.addEventListener('beforeunload', function (e) { if ((AJ && cambios().length) || plSucia() || docSucio()) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
